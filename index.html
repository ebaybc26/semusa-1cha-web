{ id:"hs2024-80", subject:"행정소송법", year:2024, no:80, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례에 의할 때 특별한 사정이 없는 한 소의 이익이 인정되는 경우는?",
  choices:["거부처분을 취소하는 재결에 따른 후속처분이 아니라 그 재결의 취소를 구하는 경우","사업양도에 따른 지위승계신고가 수리된 경우 사업양도가 무효라는 이유로 그 수리처분의 무효확인을 구하는 경우","취소소송의 계속 중 행정청이 해당 처분을 직권으로 취소한 경우","지방자치단체의 계약직공무원이 계약해지에 대해서 계약기간 만료 이후에 무효확인소송을 제기한 경우","조례의 근거 없이 이루어진 지방의료원의 폐업결정 이후 해당 조례가 적법하게 제정된 경우 그 폐업결정에 대한 취소를 구하는 경우"],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-41", subject:"행정소송법", year:2025, no:41, law:"행정소송법", unit:"행정소송의 종류·한계", kind:"concept",
  stem:"행정소송의 구분에 관한 행정소송법 규정의 일부이다. (  )에 들어갈 내용으로 옳은 것은?\n\n○ 항고소송: 행정청의 ( ㄱ )이나 ( ㄴ )에 대하여 제기하는 소송\n○ 기관소송: 국가 또는 ( ㄷ )의 기관상호간에 있어서의 권한의 존부 또는 그 행사에 관한 다툼이 있을 때에 이에 대하여 제기하는 소송",
  choices:["ㄱ: 처분, ㄴ: 행정심판의 재결, ㄷ: 공공단체","ㄱ: 처분, ㄴ: 부작위, ㄷ: 공공단체","ㄱ: 처분등, ㄴ: 부작위, ㄷ: 공공단체","ㄱ: 처분등, ㄴ: 부작위, ㄷ: 지방자치단체","ㄱ: 처분등, ㄴ: 행정심판의 재결, ㄷ: 지방자치단체"],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-42", subject:"행정소송법", year:2025, no:42, law:"행정소송법", unit:"소송비용", kind:"concept",
  stem:"소송비용에 관한 설명으로 옳지 않은 것은?",
  choices:["취소청구가 사정판결에 의하여 기각된 경우 소송비용은 피고가 부담한다.","행정청이 처분을 취소함으로 인하여 청구가 각하된 경우 소송비용은 피고가 부담한다.","소송비용에 관한 재판이 확정된 때에는 참가인이었던 행정청이 소속하는 국가 또는 공공단체에 그 효력을 미친다.","소송비용에 관하여는 「행정소송법」의 규정 외에도 「민사소송법」 규정이 준용된다.","소송비용의 부담을 규정한 「행정소송법」 제32조는 당사자소송에 준용되지 않는다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-43", subject:"행정소송법", year:2025, no:43, law:"행정소송법", unit:"재판관할", kind:"concept",
  stem:"행정소송의 재판관할에 관한 설명으로 옳지 않은 것은?",
  choices:["국가의 사무를 위탁받은 공공단체의 장을 피고로 하는 취소소송은 대법원소재지를 관할하는 행정법원에 제기할 수 있다.","중앙행정기관을 피고로 하는 취소소송은 대법원소재지를 관할하는 행정법원에 제기할 수 있다.","중앙행정기관의 부속기관을 피고로 하는 취소소송은 대법원소재지를 관할하는 행정법원에 제기할 수 있다.","특정의 장소에 관계되는 처분에 대한 취소소송은 그 장소의 소재지를 관할하는 행정법원에 제기할 수 있다.","취소소송의 제1심관할법원은 원고의 소재지를 관할하는 행정법원으로 한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-44", subject:"행정소송법", year:2025, no:44, law:"행정소송법", unit:"관련청구의 이송·병합", kind:"concept",
  stem:"항고소송에 있어 관련청구소송의 이송ㆍ병합에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송과 당해 처분과 관련되는 부당이득반환 청구소송이 다른 법원에 계속되고 있는 경우 법원은 취소소송을 관련청구소송이 계속된 법원으로 이송할 수 있다.","관련청구소송의 이송은 법원이 상당하다고 인정하는 때에 한하여 허용된다.","관련청구소송의 이송은 법원의 직권으로도 할 수 있다.","취소소송의 피고 외의 자를 상대로 한 관련청구소송은 취소소송이 계속된 법원에 병합하여 제기할 수 있다.","관련청구소송의 병합은 사실심의 변론종결시까지 할 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-46", subject:"행정소송법", year:2025, no:46, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"행정소송법상 법률상 이익에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["당해 처분의 근거 법규와 관련 법규에 의하여 보호되는 개별적ㆍ직접적ㆍ구체적 이익이 있는 자는 법률상 이익이 인정된다.","부작위위법확인소송은 처분의 신청을 한 자로서 부작위의 위법의 확인을 구할 법률상 이익이 있는 자만이 제기할 수 있다.","개발제한구역 안에서의 공장설립을 승인한 처분이 쟁송취소되었다면, 그 승인처분에 기초한 공장건축허가처분이 잔존하더라도 인근 주민은 공장건축허가처분의 취소를 구할 법률상 이익이 없다.","사실심 변론종결시에 법률상 이익을 갖추었더라도 상고심에서 이를 흠결하면 부적법한 소가 된다.","처분의 효과가 소멸된 뒤에 취소소송을 제기하려면 그 처분의 취소로 인하여 회복되는 법률상 이익이 있어야 한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-47", subject:"행정소송법", year:2025, no:47, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"항고소송에서 원고적격이 인정되는 것은? (다툼이 있으면 판례에 따름)",
  choices:["대학교 직원 노동조합이 교육부장관의 학교법인 임시이사 선임처분의 취소를 구하는 경우","기존 담배 일반소매인이 신규 구내소매인 지정처분의 취소를 구하는 경우","대한의사협회가 보건복지부 고시인 ‘건강보험요양급여행위 및 그 상대가치점수 개정’의 취소를 구하는 경우","한의사가 한약조제시험을 통하여 한약조제권을 인정받은 약사에 대한 합격처분의 무효확인을 구하는 경우","지방자치단체가 건축물 소재지 관할 허가권자인 다른 지방자치단체의 장을 상대로 「건축법」상 건축협의 취소의 취소를 구하는 경우"],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-48", subject:"행정소송법", year:2025, no:48, law:"행정소송법", unit:"피고적격", kind:"concept",
  stem:"항고소송의 피고에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["이해관계 있는 제3자도 피고경정을 신청할 수 있다.","피고경정 결정이 있은 때에는 종전의 피고에 대한 소송은 취하된 것으로 본다.","원고가 피고를 잘못 지정하여 피고경정 결정이 있은 때에는 새로운 피고에 대한 소송은 처음에 소를 제기한 때에 제기된 것으로 본다.","지방의회를 피고로 하여 제기한 조례무효확인소송은 부적법하다.","저작권심의조정위원회 위원장을 피고로 저작권 등록처분의 무효확인을 구하는 소는 부적법하다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-49", subject:"행정소송법", year:2025, no:49, law:"행정소송법", unit:"소송참가", kind:"concept",
  stem:"행정소송법상 소송참가에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 당사자 또는 제3자의 신청 또는 직권에 의하여 결정으로써 그 제3자를 소송에 참가시킬 수 있다.","참가신청을 한 제3자는 그 신청을 각하한 결정에 대하여 즉시항고할 수 있다.","「행정소송법」상의 소송참가 외에 「민사소송법」에 따른 보조참가는 허용되지 않는다.","참가인은 소송에 관하여 공격ㆍ방어ㆍ이의ㆍ상소, 그 밖의 모든 소송행위를 할 수 있지만, 참가할 때의 소송의 진행정도에 따라 할 수 없는 소송행위는 그러하지 아니하다.","참가한 행정청의 소송행위가 피참가인의 소송행위에 어긋나는 경우에는 그 참가인의 소송행위는 효력을 가지지 아니한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-50", subject:"행정소송법", year:2025, no:50, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"공부(公簿)상 기재행위와 관련하여 처분성이 인정되지 않는 것은? (다툼이 있으면 판례에 따름)",
  choices:["토지대장 직권말소행위","토지대장상의 소유자명의변경신청 거부행위","건축물대장 작성신청 반려행위","건축물대장 용도변경신청 거부행위","지적공부상 토지면적등록 정정신청 반려행위"],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-51", subject:"행정소송법", year:2025, no:51, law:"행정소송법", unit:"행정심판전치주의", kind:"concept",
  stem:"행정심판전치주의에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["지방세 부과처분을 다투는 경우에는 필요적 행정심판전치주의가 적용된다.","전심절차에 있어서의 주장과 행정소송에 있어서의 주장은 일치하여야 하므로 전심절차에 있어서 주장하지 아니한 사항은 행정소송에서 주장할 수 없다.","행정심판전치주의는 부작위위법확인소송에 준용된다.","무효선언을 구하는 취지의 취소소송에는 행정심판전치주의가 적용된다.","필요적 행정심판전치주의의 경우 행정심판을 제기함이 없이 취소소송을 제기할 수 있는 사유는 원고가 이를 소명해야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-45", subject:"행정소송법", year:2025, no:45, law:"행정소송법", unit:"선결문제", kind:"concept",
  stem:"처분의 효력 유무 또는 존재 여부가 민사소송의 선결문제로 되어 당해 민사소송의 수소법원이 이를 심리ㆍ판단하는 경우에 준용되는 행정소송법 규정이 아닌 것은?",
  choices:["피고경정","행정심판기록의 제출명령","직권심리","소송비용에 관한 재판의 효력","행정청의 소송참가"],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-52", subject:"행정소송법", year:2025, no:52, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"행정소송법상 취소소송에 규정된 사항으로 당사자소송에 준용되는 것을 모두 고른 것은?\n\nㄱ. 재판관할\nㄴ. 직권심리\nㄷ. 행정심판기록의 제출 명령\nㄹ. 집행정지",

{ id:"hs2025-53", subject:"행정소송법", year:2025, no:53, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"집행정지의 요건에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["집행정지의 소극적 요건인 ‘공공복리에 중대한 영향을 미칠 우려’에 대한 주장ㆍ소명책임은 원고에게 있다.","집행정지는 본안소송이 계속될 것을 요하나, 그 본안소송이 소송요건을 갖춘 적법한 것이어야 하는 것은 아니다.","본안 처분 자체의 적법 여부에 관하여 판단하지 않은 채 집행정지의 요건을 충족하지 않는다는 이유로 집행정지 신청을 배척하였더라도 위법하지 않다.","집행정지는 법원의 직권에 의하여 할 수 없다.","신청인의 본안청구가 이유 없음이 명백하지 않아야 한다는 것은 집행정지의 요건에 포함되지 않는다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-54", subject:"행정소송법", year:2025, no:54, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"집행정지에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분등의 효력의 일부에 대해서도 집행정지할 수 있다.","취소소송과 무효확인소송에서는 집행정지가 허용될 수 있다.","집행정지의 결정에 대하여는 즉시항고할 수 있으나 이 즉시항고에는 결정의 집행을 정지하는 효력이 없다.","본안에서 계쟁처분이 최종적으로 적법한 것으로 확정되면 집행정지결정의 효력은 소급하여 소멸한다.","일정한 납부기한을 정한 과징금부과처분에 대한 집행정지결정이 내려진 경우 그 집행정지기간 동안에는 납부기간이 진행되지 않는다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-55", subject:"행정소송법", year:2025, no:55, law:"행정소송법", unit:"제소기간", kind:"concept",
  stem:"제소기간에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송에서 청구취지를 변경하여 구 소가 취하되고 새로운 소가 제기된 것으로 변경이 이루어진 경우 새로운 소에 대한 제소기간의 준수는 원칙적으로 소 변경이 있은 때를 기준으로 한다.","부작위위법확인소송의 경우 행정심판을 거쳤는지 여부를 묻지 않고 제소기간의 제한을 받지 않는다.","필요적 행정심판전치주의 하에서 행정심판 제기 후 30일이 지나도 재결이 없는 경우 언제든지 취소소송을 제기할 수 있다.","「행정소송법」에는 제소기간 불고지 및 오고지의 효과에 관하여 규정하고 있다.","행정심판 청구기간을 도과하여 각하된 후 재결서 송달일부터 90일 내에 취소소송을 제기하였다면 제소기간을 준수한 것으로 볼 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-56", subject:"행정소송법", year:2025, no:56, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"소의 변경에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 청구의 기초에 변경이 없는 한 사실심의 변론종결시까지 소의 변경을 허가할 수 있다.","취소소송을 제기하였다가 당사자소송으로 소 변경을 허용할 경우 제소기간 준수여부 판단기준에는 변경된 당사자소송의 제소기간이 적용된다.","「행정소송법」은 행정소송과 민사소송 간 소 변경을 규정하고 있다.","소 변경은 원고의 신청 없이도 법원의 직권으로 할 수 있다.","처분변경으로 인한 소 변경의 신청은 처분의 변경이 있음을 안 날로부터 90일 이내에 하여야 한다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-57", subject:"행정소송법", year:2025, no:57, law:"행정소송법", unit:"원처분주의·재결주의", kind:"concept",
  stem:"원처분주의 또는 재결주의의 연결이 옳지 않은 것은?",
  choices:["감사원의 변상판정에 대한 재심의 판정에 대한 불복 - 재결주의","지방노동위원회의 처분에 대한 중앙노동위원회의 재심판정에 대한 불복 - 재결주의","관할 지방토지수용위원회의 수용재결에 대한 중앙토지수용위원회의 이의재결에 대한 불복 - 원처분주의","공립학교 교원의 징계처분에 대한 교원소청심사위원회의 결정에 대한 불복 - 재결주의","특허출원에 대한 심사관의 거절결정에 대한 특허심판원의 심결에 대한 불복 - 재결주의"],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-58", subject:"행정소송법", year:2025, no:58, law:"행정소송법", unit:"소송형식", kind:"concept",
  stem:"소송형식의 연결이 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["구 「산업집적활성화 및 공장설립에 관한 법률」에 따른 산업단지관리공단의 입주변경계약의 취소를 다투는 소송 - 당사자소송","국유재산 무단 점유자에 대한 변상금 부과처분의 취소를 다투는 소송 - 항고소송","구 「도시 및 주거환경정비법」상 재개발조합 조합장의 지위를 다투는 소송 - 민사소송","구 「공무원연금법」상 공무원연금관리공단의 급여 결정에 불복하는 소송 - 취소소송","국가의 훈기부상 화랑무공훈장을 수여받은 것으로 기재되어 있는 원고가 태극무공훈장을 수여받은 자임의 확인을 구하는 소송 - 당사자소송"],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-59", subject:"행정소송법", year:2025, no:59, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"항고소송의 대상인 처분에 해당하는 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 개별공시지가의 결정\nㄴ. 건축법상 이행강제금 납부의 최초 독촉\nㄷ. 지방의회의 의장선임의결\nㄹ. 금융기관의 임원에 대한 금융감독원장의 문책 경고",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-60", subject:"행정소송법", year:2025, no:60, law:"행정소송법", unit:"판례 종합", kind:"concept",
  stem:"행정소송에 관한 판례의 입장으로 옳지 않은 것은?",
  choices:["부작위위법확인소송으로 작위의무의 이행을 구할 수 없다.","상수원에서 급수를 받고 있는 지역주민들은 구 「수도법」상 상수원보호구역변경처분의 취소를 구할 법률상의 이익이 없다.","토지구획정리조합으로부터 조합원에 대한 구 「토지구획정리사업법」상의 청산금채권을 양수한 사람은 민사소송에 의하여 양수금의 지급을 구할 수 있다.","당사자소송에 있어서 원고가 피고를 잘못 지정한 때에 법원은 바로 각하할 것이 아니라 석명권을 행사하여 정당한 피고로 경정하게 해야 한다.","「병역법」상 군의관의 신체등위판정은 항고소송의 대상이 아니다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-61", subject:"행정소송법", year:2025, no:61, law:"행정소송법", unit:"소송요건", kind:"concept",
  stem:"취소소송상 소송요건심리 단계에서 판단해야 할 사항이 아닌 것은? (다툼이 있으면 판례에 따름)",
  choices:["원고적격의 존재여부","소의 이익의 존재여부","전심절차의 준수여부","처분절차의 준수여부","처분성의 존재여부"],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-62", subject:"행정소송법", year:2025, no:62, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"행정소송상 특수한 소송심리 방법에 해당하는 것은?",
  choices:["공개심리주의","쌍방심리주의","구술심리주의","변론주의","직권심리주의"],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-63", subject:"행정소송법", year:2025, no:63, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"항고소송의 입증책임 또는 증명책임에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 처분의 적법성에 대한 입증책임은 일반적으로 원고가 진다.\nㄴ. 재량권의 일탈ㆍ남용은 원고가 증명한다.\nㄷ. 사실의 증명은 추호의 의혹도 없어야 한다는 자연과학적 증명에 따른다.\nㄹ. 허가기준 미달을 이유로 불허가한 경우 그 처분이 적법하다는 주장과 입증의 책임은 처분청에게 있다.",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-64", subject:"행정소송법", year:2025, no:64, law:"행정소송법", unit:"처분사유의 추가·변경", kind:"concept",
  stem:"처분사유의 추가ㆍ변경에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["「행정소송법」상 명문의 근거규정은 존재하지 않는다.","처분사유 자체가 아니라 처분사유의 근거가 되는 기초사실 내지 평가요소에 지나지 않는 사정은 추가로 주장할 수 있다.","처분의 사실관계에 변경이 없는 한 적용법령만을 추가하거나 변경하는 것은 가능하다.","행정청의 처분사유의 추가ㆍ변경은 사실심 개시전까지만 허용된다.","입찰참가자격을 제한시킨 당초의 처분 사유인 정당한 이유 없이 계약을 이행하지 않은 사실과 항고소송에서 새로 주장한 계약의 이행과 관련하여 관계 공무원에게 뇌물을 준 사실은 기본적 사실관계의 동일성이 없다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-65", subject:"행정소송법", year:2025, no:65, law:"행정소송법", unit:"판결 일반", kind:"concept",
  stem:"행정소송의 판결에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["청구의 전부 또는 일부를 인용하는 판결은 본안판결이다.","항고소송의 판결서는 「민사소송법」이 아닌 「행정소송법」에 규정된 특수한 기재방법을 준수해야 한다.","판결은 재판장이 판결원본에 따라 주문을 읽어 선고하며, 필요한 때에는 이유를 간략히 설명할 수 있다.","판결은 당사자가 출석하지 아니하여도 선고할 수 있다.","판결주문은 그 내용이 특정되어 있고 그 주문 자체에서 특정할 수 있어야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-66", subject:"행정소송법", year:2025, no:66, law:"행정소송법", unit:"사정판결", kind:"concept",
  stem:"사정판결에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["사정판결은 중간판결에 해당한다.","사정판결에서 처분의 위법성 판단 기준시점은 처분시이다.","사정판결은 공공복리의 증진과 행정의 적법성 확보를 위하여 필요하다면 널리 사용되어져야 한다.","사정판결은 처분이 위법하지 않음이 확인되어도 가능하다.","사정판결은 당사자의 신청이 있는 경우에만 할 수 있다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-67", subject:"행정소송법", year:2025, no:67, law:"행정소송법", unit:"소송의 종료", kind:"concept",
  stem:"판결에 의하지 않는 취소소송의 종료에 관한 설명으로 옳은 것은?",
  choices:["피고는 원고가 제기한 소의 일부를 인정하는 경우 소의 취하를 할 수 있다.","원고가 자기의 소송상 청구가 이유 없음을 자인하는 인낙은 사실심 종결후에도 가능하다.","재판장은 신속하고 공정한 분쟁 해결과 국민의 권익 구제를 위하여 필요하다고 인정하는 경우에는 소송계속 중인 사건에 대하여 직권으로 소의 취하, 처분등의 취소 또는 변경, 그 밖에 다툼을 적정하게 해결하기 위해 필요한 사항을 서면으로 권고할 수 있다.","재판장이 소송계속 중인 사건에 대하여 처분등의 취소를 구두로 권고하는 경우에는 이해관계인, 그 밖의 참고인을 심문하여야 한다.","청구의 포기는 원고 또는 피고가 할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-68", subject:"행정소송법", year:2025, no:68, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"판결의 효력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소판결의 기속력은 「행정소송법」에 규정되어 있다.","처분을 취소하는 확정판결의 효력은 소송에 참여한 당사자에게만 미친다.","과세처분의 취소소송에서 청구가 기각된 확정판결의 기판력은 그 과세처분의 무효확인을 구하는 소송에도 미친다.","확정판결은 주문에 포함된 것에 한하여 기판력을 가진다.","과세처분을 취소하는 판결이 확정된 후, 과세관청에서 그 과세처분을 경정하는 경정처분을 하였다면 당연무효의 처분이다."],
  answer:2, status:"clear", note:"" },

{ id:"hs2025-77", subject:"행정소송법", year:2025, no:77, law:"행정소송법", unit:"당사자소송", kind:"concept",

        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object" && parsed.answers) {
          state.answers = parsed.answers;
        }
      }
    } catch (e) { /* ignore */ }
  }
  function saveLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers: state.answers }));
    } catch (e) { /* ignore */ }
  }

  /* ---------------- cross-device sync (db capability) ---------------- */
  var dbDoc = null;
  var writeChain = Promise.resolve();
  var lastWrittenJSON = null;

  function setSyncUI(live, label) {
    var pill = document.getElementById("syncPill");
    var lbl = document.getElementById("syncLabel");
    pill.setAttribute("data-live", live ? "1" : "0");
    lbl.textContent = label;
  }

  function persist() {
    saveLocal();
    if (!dbDoc) return;
    var json = JSON.stringify(state.answers);
    if (json === lastWrittenJSON) return;
    lastWrittenJSON = json;
    writeChain = writeChain.then(function () {
      return dbDoc.set({ answers: state.answers, updatedAt: Date.now() });
    }).catch(function (err) {
      setSyncUI(false, "동기화 실패 — 이 기기에만 저장됨");
    });
  }

  async function initSync() {
    try {
      var userCap = await claude.use("user");
      var dbCap = await claude.use("db");
      if (!userCap || !dbCap) {
        setSyncUI(false, "이 기기에만 저장됨 (로그인 시 기기 간 동기화)");
        return;
      }
      var uid = await userCap.id();
      if (!uid) {
        setSyncUI(false, "이 기기에만 저장됨 (로그인 시 기기 간 동기화)");
        return;
      }
      dbDoc = dbCap.doc("data/users/" + uid + "/semusa_study");
      var snap = await dbDoc.get();
      if (snap.exists) {
        var data = snap.data();
        if (data && data.answers) {
          state.answers = data.answers;
          lastWrittenJSON = JSON.stringify(state.answers);
          renderAll();
        }
      }
      setSyncUI(true, "계정 동기화 켜짐 — 어느 기기에서나 이어서 풀 수 있어요");
    } catch (e) {
      setSyncUI(false, "이 기기에만 저장됨");
    }
  }

  /* ---------------- derived ---------------- */
  function isAnswered(q) { return state.answers[q.id] !== undefined; }
  function correctSet(q) { return Array.isArray(q.answer) ? q.answer : [q.answer]; }
  function isCorrect(q) { return correctSet(q).indexOf(state.answers[q.id]) !== -1; }

  function scoreText() {
    var sc = scoreFor(state.topSubject, state.subject, state.unit);
    return sc.correct + " / " + sc.total;
  }

  function belongsToLaw(q, law) {
    return q.law.indexOf(law) !== -1 || law.indexOf(q.law) !== -1;
  }

  function matchesKind(q) {
    var kind = q.kind || "concept";
    return state.kind === "all" || state.kind === kind;
  }

  function matchesFilters(q) {
    return q.subject === state.topSubject &&
      belongsToLaw(q, state.subject) &&
      (state.unit === "all" || q.unit === state.unit) &&
      matchesKind(q);
  }

  function subjectList() {
    return QUESTIONS.filter(matchesFilters);
  }

  function visibleList() {
    var base = subjectList();
    if (state.mode === "wrong") {
      return base.filter(function (q) { return isAnswered(q) && !isCorrect(q); });
    }
    return base;
  }

  function scoreFor(topSubject, law, unit) {
    var items = QUESTIONS.filter(function (q) {
      return q.subject === topSubject && belongsToLaw(q, law) &&
        (unit === "all" || unit === undefined || q.unit === unit) && matchesKind(q);
    });
    var correct = 0;
    items.forEach(function (q) { if (isAnswered(q) && isCorrect(q)) correct++; });
    return { correct: correct, total: items.length };
  }

  function unitsOf(topSubject, law) {
    var seen = [];
    QUESTIONS.forEach(function (q) {
      if (q.subject === topSubject && belongsToLaw(q, law) && q.unit && seen.indexOf(q.unit) === -1) {
        seen.push(q.unit);
      }
    });
    return seen;
  }

  /* ---------------- render ---------------- */
  function renderTopSubjects() {
    var wrap = document.getElementById("topSubjects");
    wrap.innerHTML = "";
    TOP_SUBJECTS.forEach(function (subject) {
      var has = loadedTopSubjects.indexOf(subject) !== -1;
      var pill = document.createElement(has ? "button" : "span");
      var cls = "top-subject-pill";
      if (has) cls += " clickable";
      if (has && subject === state.topSubject) cls += " active";
      if (!has) cls += " soon";
      pill.className = cls;
      if (has) {
        var laws = loadedLawsOf(subject);
        var sc = scoreFor(subject, laws.length ? laws[0] : subject, "all");
        var total = QUESTIONS.filter(function (q) { return q.subject === subject; }).length;
        pill.textContent = subject + " · " + total + "문항";
        pill.addEventListener("click", function () {
          state.topSubject = subject;
          var newLaws = loadedLawsOf(subject);
          state.subject = newLaws.length ? newLaws[0] : subject;
          state.unit = "all";
          state.currentIndex = 0;
          renderAll();
        });
      } else {
        pill.textContent = subject + " · 준비중";
      }
      wrap.appendChild(pill);
    });
  }

  function renderSubjects() {
    var wrap = document.getElementById("subjects");
    wrap.innerHTML = "";
    var laws = loadedLawsOf(state.topSubject);
    if (!laws.length) { wrap.style.display = "none"; return; }
    wrap.style.display = "";
    laws.forEach(function (law) {
      var pill = document.createElement("button");
      var cls = "subject-pill clickable";
      if (law === state.subject) cls += " active";
      pill.className = cls;
      var sc = scoreFor(state.topSubject, law, "all");
      pill.textContent = law + " · " + sc.total + "문항";
      pill.addEventListener("click", function () {
        state.subject = law;
        state.unit = "all";
        state.currentIndex = 0;
        renderAll();
      });
      wrap.appendChild(pill);
    });
  }

  function renderUnits() {
    var wrap = document.getElementById("units");
    wrap.innerHTML = "";
    var units = unitsOf(state.topSubject, state.subject);
    if (!units.length) { wrap.style.display = "none"; return; }
    wrap.style.display = "";
    var allPill = document.createElement("button");
    allPill.className = "unit-pill" + (state.unit === "all" ? " active" : "");
    allPill.textContent = "전체 단원";
    allPill.addEventListener("click", function () {
      state.unit = "all";
      state.currentIndex = 0;
      renderAll();
    });
    wrap.appendChild(allPill);
    units.forEach(function (unit) {
      var pill = document.createElement("button");
      var cls = "unit-pill" + (unit === state.unit ? " active" : "");
      pill.className = cls;
      var sc = scoreFor(state.topSubject, state.subject, unit);
      pill.textContent = unit + " (" + sc.total + ")";
      pill.addEventListener("click", function () {
        state.unit = unit;
        state.currentIndex = 0;
        renderAll();
      });
      wrap.appendChild(pill);
    });
  }

  function renderKindTabs() {
    var wrap = document.getElementById("kindTabs");
    var cfg = SUBJECT_CONFIG[state.topSubject];
    var hasCalc = cfg ? cfg.hasCalc : true;
    wrap.style.display = hasCalc ? "" : "none";
    if (!hasCalc && state.kind !== "all") {
      state.kind = "all";
      document.querySelectorAll("[data-kind]").forEach(function (b) { b.classList.remove("active"); });
      document.querySelector('[data-kind="all"]').classList.add("active");
    }
  }

  function renderRail() {
    var rail = document.getElementById("rail");
    rail.innerHTML = "";
    var years = [2023, 2024, 2025];
    var list = visibleList();
    years.forEach(function (year) {
      var items = list.filter(function (q) { return q.year === year; });
      if (!items.length) return;
      var group = document.createElement("div");
      group.className = "rail-group";
      var label = document.createElement("div");
      label.className = "rail-year";
      label.textContent = year + "년";
      group.appendChild(label);
      var grid = document.createElement("div");
      grid.className = "rail-grid";
      items.forEach(function (q) {
        var btn = document.createElement("button");
        var cls = "q-chip";
        var idx = visibleList().indexOf(q);
        if (idx === state.currentIndex) cls += " current";
        if (isAnswered(q)) cls += isCorrect(q) ? " correct" : " wrong";
        btn.className = cls;
        btn.textContent = q.no;
        btn.title = q.year + "년 " + q.no + "번";
        btn.addEventListener("click", function () {
          state.currentIndex = visibleList().indexOf(q);
          renderAll();
        });
        grid.appendChild(btn);
      });
      group.appendChild(grid);
      rail.appendChild(group);
    });
  }

  function choiceLabel(i) {
    return ["①", "②", "③", "④", "⑤"][i];
  }

  function renderPanel() {
    var panel = document.getElementById("panel");
    panel.innerHTML = "";
    var list = visibleList();
    if (!list.length) {
      var empty = document.createElement("div");
      empty.className = "card empty-state";
      empty.textContent = "오답노트가 비어 있어요. 틀린 문제가 생기면 여기 쌓여요.";
      panel.appendChild(empty);
      return;
    }
    if (state.currentIndex >= list.length) state.currentIndex = list.length - 1;
    if (state.currentIndex < 0) state.currentIndex = 0;
    var q = list[state.currentIndex];

    var card = document.createElement("div");
    card.className = "card";

    var meta = document.createElement("div");
    meta.className = "card-meta";
    var kind = q.kind || "concept";
    meta.innerHTML =
      '<span class="qno">' + q.year + "년 제" + (q.year === 2023 ? "60" : q.year === 2024 ? "61" : "62") + "회 · " + q.no + "번</span>" +
      '<span class="tag law">' + q.law + "</span>" +
      '<span class="tag">' + KIND_LABEL[kind] + "</span>" +
      '<span class="tag badge-' + q.status + '">' + STATUS_LABEL[q.status] + "</span>";
    card.appendChild(meta);

    var stem = document.createElement("p");
    stem.className = "stem";
    stem.textContent = q.stem;
    card.appendChild(stem);

    var choicesWrap = document.createElement("div");
    choicesWrap.className = "choices";
    var answered = isAnswered(q);
    q.choices.forEach(function (text, i) {
      var idx = i + 1;
      var btn = document.createElement("button");
      var cls = "choice";
      if (answered) {
        if (correctSet(q).indexOf(idx) !== -1) cls += " reveal-correct";
        else if (idx === state.answers[q.id]) cls += " reveal-wrong";
      }
      btn.className = cls;
      btn.disabled = answered;
      btn.innerHTML = '<span class="num">' + choiceLabel(i) + "</span><span>" + text.replace(/\n/g, "<br>") + "</span>";
      btn.addEventListener("click", function () {
        state.answers[q.id] = idx;
        persist();
        renderAll();
      });
      choicesWrap.appendChild(btn);
    });
    card.appendChild(choicesWrap);

    if (answered) {
      var ok = isCorrect(q);
      var result = document.createElement("div");
      result.className = "result-line " + (ok ? "ok" : "ng");
      result.innerHTML =
        "<b>" + (ok ? "정답입니다" : "오답입니다") + "</b> — 공식정답 " + choiceLabel(q.answer - 1) + "번<br>" +
        '<span class="note-label">개정 검토</span> ' + q.note;
      card.appendChild(result);
    }

    var nav = document.createElement("div");
    nav.className = "card-nav";
    var prevBtn = document.createElement("button");
    prevBtn.className = "nav-btn";
    prevBtn.textContent = "← 이전";
    prevBtn.disabled = state.currentIndex === 0;
    prevBtn.addEventListener("click", function () { state.currentIndex--; renderAll(); });
    var nextBtn = document.createElement("button");
    nextBtn.className = "nav-btn";
    nextBtn.textContent = "다음 →";
    nextBtn.disabled = state.currentIndex >= list.length - 1;
    nextBtn.addEventListener("click", function () { state.currentIndex++; renderAll(); });
    nav.appendChild(prevBtn);
    nav.appendChild(nextBtn);
    card.appendChild(nav);

    panel.appendChild(card);
  }

  function renderScore() {
    document.getElementById("scoreNum").textContent = scoreText();
  }

  function renderAll() {
    renderTopSubjects();
    renderSubjects();
    renderUnits();
    renderKindTabs();
    renderRail();
    renderPanel();
    renderScore();
  }

  /* ---------------- events ---------------- */
  document.querySelectorAll("[data-mode]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-mode]").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      state.mode = btn.getAttribute("data-mode");
      state.currentIndex = 0;
      renderAll();
    });
  });
  document.querySelectorAll("[data-kind]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-kind]").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      state.kind = btn.getAttribute("data-kind");
      state.currentIndex = 0;
      renderAll();
    });
  });

  loadLocal();
  renderAll();
  if (window.claude && typeof window.claude.use === "function") {
    initSync();
  } else {
    setSyncUI(false, "이 기기에만 저장됨");
  }
})();
</script>
