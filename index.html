{ id:"jj2021-31", subject:"재정학", year:2021, no:31, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라에서 시행 중인 소득재분배정책에 관한 설명으로 옳지 않은 것은?",
  choices:["국민기초생활보장제도는 절대빈곤선을 기준으로 수급 대상자를 선정한다.","근로장려세제는 근로빈곤층(working poor)에게 생계안정지원과 동시에 근로 유인을 위한 제도이다.","공공부조는 일반 국민이 납부한 세금을 재원으로 저소득계층을 지원하는 프로그램이다.","우리나라에서 운용중인 사회보험은 국민연금, 건강보험, 고용보험, 산재보험, 노인장기요양보험이 있다.","사회보험제도는 가입자들이 납부한 보험료를 기본 재원으로 운영된다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2021-32", subject:"재정학", year:2021, no:32, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"적자재정에 따른 국채발행의 효과에 관한 설명으로 옳은 것은?",
  choices:["리카르도(D. Ricardo)는 총수요를 변화시킬 수 있다고 하였다.","러너(A. Lerner)는 내부채무는 미래세대의 부담을 증가시킨다고 하였다.","통화주의자들은 총수요가 변한다고 하였다.","배로(R. Barro)는 국민저축과 투자에 전혀 영향을 미치지 않는다고 하였다.","케인즈학파는 국채발행을 통해 조세부담을 경감시켜주어도 총수요는 변하지 않는다고 하였다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2021-33", subject:"재정학", year:2021, no:33, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"소득분배의 불평등도 측정에 관한 설명으로 옳은 것은?",
  choices:["지니(Gini)계수: 0과 1 사이의 값을 가지며, 1에 가까울수록 소득이 평등하게 분배되었음을 나타낸다.","달튼(H. Dalton)의 평등지수: 0과 1 사이의 값을 가지며, 1에 가까울수록 소득이 평등하게 분배되었음을 나타낸다.","앳킨슨(A. Atkinson)지수: -1과 1 사이의 값을 가지며, 1이면 소득이 완전 평등하게 분배되었음을 나타낸다.","5분위분배율: 하위 20 %에 속하는 사람들의 소득점유비율을 상위 20 %에 속하는 사람들의 소득점유비율로 나눈 값이다.","십분위분배율: 상위 40 %에 속하는 사람들의 소득점유비율을 하위 20 %에 속하는 사람들의 소득점유비율로 나눈 값이다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2021-34", subject:"재정학", year:2021, no:34, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"정부의 사회취약계층을 위한 현물보조와 현금보조에 관한 비교 설명으로 옳은 것을 모두 고른 것은? (단, 정부지출은 동일하다.)\n\nㄱ. 현물보조는 현금보조보다 소비자들이 선호한다.\nㄴ. 현물보조는 현금보조보다 높은 행정비용과 운영비용을 수반한다.\nㄷ. 현금보조는 현물보조에 비하여 오남용 가능성이 높다.\nㄹ. 현금보조는 현물보조보다 소비자에게 보다 넓은 선택의 자유를 부여한다.",
  choices:["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"jj2021-35", subject:"재정학", year:2021, no:35, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"정부의 세금 인하로 인해 발생하는 경제적 효과로 옳지 않은 것은?",
  choices:["가처분 소득이 늘어나 화폐 수요가 증가한다.","소비 지출이 증가하므로 총수요 곡선이 오른쪽으로 이동한다.","리카르도(D. Ricardo)의 대등정리에 따르면 세금 인하로 인해 발생하는 재정 적자를 국채로 충당할 때 총수요에 아무런 영향을 끼치지 않는다.","구축 효과가 없다는 가정 하에 세금 감면액과 정부 지출 증가액이 동일한 크기라면 두 정책의 총수요 효과는 동일하다.","구축 효과가 없다는 가정 하에 정부 지출을 줄이는 만큼 세금을 감면하면 재정 적자의 변화 없이 총수요를 감소시킨다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2021-36", subject:"재정학", year:2021, no:36, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"외부효과를 내부화하기 위한 시장 메커니즘이 아닌 것은?",
  choices:["피구세","푸드 스탬프","오염 배출권","환경 투자 보조금","거래 가능 어획 쿼터제"],
  answer:2, status:"clear", note:"" },
{ id:"jj2021-37", subject:"재정학", year:2021, no:37, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"다음은 재화 X의 소비에 대한 사적 한계 편익(PMB), 생산의 사적 한계 비용(PMC), 생산에 따른 한계 외부 피해(MD)이다.\n\nPMB = 600 - 4Q    PMC = 6Q    MD = 2Q\n\n사회적 최적 생산량을 달성하기 위한 피구세(Pigouvian tax)의 크기는? (단, Q는 생산량이다.)",
  choices:["25","40","50","80","100"],
  answer:5, status:"clear", note:"" },
{ id:"jj2021-38", subject:"재정학", year:2021, no:38, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"분배에 대한 공리주의적 주장으로 옳지 않은 것은?",
  choices:["가장 바람직한 분배 상태는 최소극대화의 원칙을 따른다.","바람직한 분배가 모든 사람이 동일한 효용함수를 가지지 않을 때에도 나타날 수 있다.","벤담(J. Bentham)은 사회 전체의 후생을 극대화하는 분배가 가장 바람직하다고 보았다.","불균등한 소득 분배도 정당화될 수 있다.","효용함수는 소득의 한계효용이 체감한다는 가정이 필요하다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2021-39", subject:"재정학", year:2021, no:39, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공적연금과 사적연금에 관한 설명으로 옳지 않은 것은?",
  choices:["인플레이션이 있는 경우 공적연금과 달리 사적연금에는 인플레이션에 조정된 연금이 지급된다.","공적연금은 사적연금 시장에서 나타날 수 있는 역선택 문제를 해결할 수 있다.","공적연금은 사적연금보다 준비금을 적게 보유할 수 있다.","사적연금은 공적연금에 비해 수요자의 다양한 요구에 대응하기 용이하다.","공적연금은 위험의 공동 부담이라는 측면에서 사적연금 시장에서 나타날 수 있는 도덕적 해이 문제를 해결할 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2021-40", subject:"재정학", year:2021, no:40, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"특정 프로젝트의 비용과 편익이 불확실한 경우 활용하는 확실성등가(certainty equivalent)에 관한 설명으로 옳지 않은 것은?",
  choices:["확실성등가가 크면 클수록 더 위험회피적(risk averse)이다.","확실성등가를 산출하기 위해서는 프로젝트의 수익 분포뿐만 아니라 개인의 위험회피도에 대한 정보도 필요하다.","위험중립적(risk neutral)인 개인의 경우 위험 프리미엄은 0이며 확실성등가는 기대소득과 일치한다.","확실성등가는 프로젝트의 기대소득에서 위험 프리미엄을 공제한 금액을 말한다.","위험회피적인 개인의 경우 위험한 기회로부터 기대소득보다 확실성등가가 항상 작다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2017-1", subject:"재정학", year:2017, no:1, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"토지에 부과하는 조세부담이 자본화되어 토지가격이 하락했을 경우 다음 설명으로 옳은 것은?",
  choices:["토지처럼 공급이 고정되어 있는 자산에 과세를 하면 조세부담의 자본화가 발생할 수 있다.","자본화가 일어나면 조세부담은 누구에게도 귀착되지 않는다.","토지가격은 부과된 조세의 현재가치보다 항상 크게 하락한다.","토지임대사용자에게 모든 조세부담이 귀착된다.","조세부과 후 토지구입자에게 모든 조세부담이 귀착된다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2017-2", subject:"재정학", year:2017, no:2, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"목적세에 관한 설명으로 옳지 않은 것은?",
  choices:["교육세, 교통·에너지·환경세 등을 예로 들 수 있다.","목적세 세수를 필요한 만큼 확보하지 못하면 보통세 세수를 전용해야 하는 문제가 발생할 수 있다.","정부의 재원배분 과정을 자동화하여 정부예산의 효율성을 높인다.","정부의 예산배분 과정에서 나타나는 정치적 갈등을 줄일 수 있다.","정부재정 운영의 신축성을 떨어뜨린다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2017-3", subject:"재정학", year:2017, no:3, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"calc",
  stem:"세수함수가 T = -300 + 0.5Y 일 때, 다음 중 옳지 않은 것은? (단, T는 세금, Y는 소득, Y>600 이다.)",
  choices:["소득이 증가함에 따라 평균세율은 증가한다.","한계세율은 소득에 관계없이 일정하다.","세수탄력성은 1보다 작다.","한계세율은 평균세율보다 크다.","위의 세수함수는 선형누진소득세에 해당된다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2017-4", subject:"재정학", year:2017, no:4, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"A국과 B국 모두 개인소득세를 도입하고 있다. A국은 비례세율구조이고, B국은 누진세율구조이다. 명목소득과 물가가 같은 비율로 상승한다고 할 때, 세법이 변화하지 않는 경우에 A국과 B국의 실질조세 징수액은?",
  choices:["A국, B국 모두 증가한다.","A국은 감소하나 B국은 증가한다.","A국은 증가하나 B국은 감소한다.","A국은 변화가 없고 B국은 증가한다.","A국은 증가하고 B국은 변화가 없다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2017-5", subject:"재정학", year:2017, no:5, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"소득세 구조가 누진적인 경우가 아닌 것은?",
  choices:["면세점이 존재하고 선형조세함수일 경우","면세점은 없으나 한계세율이 소득에 따라 증가할 경우","세수탄력성이 1보다 클 경우","한계세율과 평균세율이 같을 경우","한계세율은 일정하나 평균세율이 소득에 따라 증가할 경우"],
  answer:4, status:"clear", note:"" },
{ id:"jj2017-6", subject:"재정학", year:2017, no:6, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"조세의 귀착에 관한 설명으로 옳지 않은 것은?",
  choices:["균형예산귀착은 다른 조세가 없다고 가정하고 특정 조세로 조달한 재원에 의한 정부지출사업까지 고려하여 조세의 분배 효과를 분석한다.","차별귀착은 모든 조세와 정부지출이 일정하게 유지된다고 가정하고 하나의 세금을 다른 세금으로 대체할 경우의 분배 효과를 비교 분석한다.","절대귀착은 다른 조세나 정부지출에 아무런 변화가 없다는 가정 하에서 특정 조세의 분배 효과를 분석한다.","절대귀착은 균형예산귀착보다 정부지출이 분배에 미치는 효과를 파악할 때 더 적합한 분석방법이다.","균형예산귀착은 정부가 부과하는 조세가 다수인 경우에는 분석이 용이하지 않다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2017-7", subject:"재정학", year:2017, no:7, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"X재와 Y재를 소비하는 어떤 사회에서 과세에 따른 초과부담에 관한 설명으로 옳은 것은?",
  choices:["조세수입이 동일한 경우, 두 재화보다는 한 재화에 세금을 부과할 때 초과부담은 작아진다.","개별물품세가 부과되어도 수요량이 변하지 않으면 초과부담은 존재하지 않는다.","현금보조는 부(-)의 조세의 일종이므로 초과부담이 발생한다.","두 재화가 대체관계인 경우, X재에 조세가 부과된 상태에서 Y재에 조세를 부과하면 Y재의 과세에 따른 왜곡의 발생으로 반드시 경제 전체의 초과부담은 늘어난다.","두 재화가 완전보완재인 경우, 한 재화에 과세하면 경제 전체의 초과부담은 0(zero)이다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2017-8", subject:"재정학", year:2017, no:8, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"부분균형분석을 따를 때 조세귀착에 관한 설명으로 옳지 않은 것은?",
  choices:["물품세의 법적 귀착과 경제적 귀착은 항상 동일한 결과를 나타낸다.","물품세 부과에 따른 소비자에로의 조세귀착은 공급의 가격탄력성이 수요의 가격탄력성보다 클수록 더 커진다.","노동수요의 탄력성이 무한히 큰 경우 근로소득세를 부과하면 세부담은 노동자에게 모두 귀착된다.","완전 개방 경제에서 자본에 대한 과세는 전적으로 자본의 사용자에게 귀착된다.","조세귀착의 부분균형분석은 특정한 시장에서 부과된 조세가 다른 시장에 영향을 미치지 않고 그 시장에서만 영향을 미친다는 가정 하에서 분배 효과를 측정한다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2017-9", subject:"재정학", year:2017, no:9, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"시장수요가 시장공급보다 탄력적인 재화가 있다고 할 때, 이 재화가 거래되는 경쟁적인 시장에서 물품세를 부과하거나 또는 가격보조를 할 경우 새로운 균형에서의 귀착으로 옳은 것을 모두 고른 것은?\n\nㄱ. 수요자에게 물품세를 부과할 경우 상대적으로 수요자에게 조세가 더 많이 귀착될 것이다.\nㄴ. 수요자에게 가격보조를 할 경우 상대적으로 수요자에게 보조금이 더 많이 귀착될 것이다.\nㄷ. 공급자에게 물품세를 부과할 경우 상대적으로 공급자에게 조세가 더 많이 귀착될 것이다.\nㄹ. 공급자에게 가격보조를 할 경우 상대적으로 공급자에게 보조금이 더 많이 귀착될 것이다.",
  choices:["ㄱ","ㄷ","ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:4, status:"clear", note:"" },
{ id:"jj2017-10", subject:"재정학", year:2017, no:10, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"로젠(H. Rosen)이 제시한 바람직한 소득세의 조건과 관련된 설명으로 옳지 않은 것은?",
  choices:["동일한 소득의 가족에게는 똑같은 세금을 부과하는 수평적 공평성이 충족되어야 한다.","합산과세방식은 가족 간 수직적 공평성 조건을 충족하나 수평적 공평성과 결혼중립성 조건은 충족하지 못한다.","결혼 여부가 두 개인의 조세부담을 변화시켜서는 안 된다.","납세자 간 분리과세방식은 결혼중립성 조건을 충족하나 가족 간 수평적 공평성은 충족하지 못한다.","소득이 증가함에 따라 한계소득세율이 증가하는 수직적 공평성이 충족되어야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2017-11", subject:"재정학", year:2017, no:11, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"조세의 효율성에 관한 설명으로 옳지 않은 것은?",
  choices:["조세에 의한 초과부담은 소득효과와는 관련이 없고 대체효과에 의해서 유발된다.","조세부과가 초래하는 초과부담을 측정할 때는 보상수요곡선을 사용하여야 한다.","정액세는 납세자의 경제 행위와는 무관하게 세금을 부과하기 때문에 조세에 의한 왜곡이 일어나지 않는다.","이미 조세를 부과하고 있는 상태에서 새로운 조세를 부과하면 소비자들은 부담이 추가되어 항상 효용은 줄어든다.","2기간 생애주기모형(two-period life-cycle model)에서 이자소득세는 없고 매기의 소비가 정상재이라면 근로소득세가 부과되어도 대체효과에 의한 초과부담은 발생하지 않는다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2017-12", subject:"재정학", year:2017, no:12, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"근로소득세 부과가 노동시장에 미치는 효과에 관한 설명으로 옳은 것은?",
  choices:["여가가 정상재일 경우 임금변화에 따른 소득효과가 대체효과보다 작다면 후방굴절형 노동공급곡선이 될 것이다.","여가가 열등재일 경우 비례소득세를 부과하면 노동공급량은 감소한다.","여가가 정상재일 경우 비례소득세를 부과하면 대체효과는 노동공급을 늘리는 방향으로 작용하고 소득효과는 노동공급을 줄이는 방향으로 작용한다.","여가가 정상재일 경우 누진소득세 부과가 노동공급에 미치는 영향은 비례소득세 부과와 유사하지만 고소득자에게 유리하다.","여가가 정상재일 경우 선형누진소득세의 평균세율이 비례소득세와 동일하다면 노동공급에 미치는 효과는 동일하다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2017-13", subject:"재정학", year:2017, no:13, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"근로소득세율이 다음과 같다고 한다.\n\n구간 / 근로소득(단위: 만원) / 세율(%)\n(1) / 1,200 이하 / 6\n(2) / 1,200 초과 ~ 4,600 이하 / 15\n(3) / 4,600 초과 ~ 8,800 이하 / 24\n(4) / 8,800 초과 ~ 15,000 이하 / 35\n(5) / 15,000 초과 ~ 50,000 이하 / 38\n(6) / 50,000 초과 / 40\n\n이 때 구간 (3)인 4,600만원 초과 ~ 8,800만원 이하에 해당하는 세율을 현재의 24%에서 30%로 인상할 경우 다음 중 옳은 것을 모두 고른 것은?\n\nㄱ. 구간 (1) ~ (3)에 속하는 사람들의 평균세율이 내려간다.\nㄴ. 구간 (4) ~ (6)에 속하는 사람들의 노동공급 선택에 왜곡이 발생한다.\nㄷ. 구간 (4) ~ (6)에 속하는 사람들의 평균세율이 올라간다.",
  choices:["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ"],
  answer:5, status:"clear", note:"" },
{ id:"jj2017-14", subject:"재정학", year:2017, no:14, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"멀리즈(J. Mirrlees)가 분석한 최적비선형소득세와 관련된 내용으로 옳지 않은 것은?",
  choices:["효율과 공평을 함께 고려한다.","노동의 공급을 늘리는 유인 기능의 성격을 지닌다.","최고 소득 구간에 대한 한계소득세율은 0(zero)이다.","한계소득세율은 항상 1보다 작다.","임금률이 낮은 개인이 높은 개인보다 더 큰 효용을 누릴 수도 있다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2017-15", subject:"재정학", year:2017, no:15, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"우리나라 부가가치세에 관한 설명으로 옳지 않은 것은?",
  choices:["현재 우리나라 세목 가운데 세수입이 가장 크다.","기초생활필수품은 영세율 대상이다.","일반적으로 소득세에 비해 조세저항이 작다.","수출품에 대한 영세율 적용은 완전면세 효과를 나타낸다.","재화와 용역(서비스)의 생산·유통과정에서 창출되는 부가가치가 과세 대상이다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2017-16", subject:"재정학", year:2017, no:16, law:"재정학", unit:"1편 재정학의 개요", kind:"concept",
  stem:"1인당 국민소득이 증가할 때 정부지출이 국민경제에서 차지하는 비중이 점차 증가하는 현상에 대한 원인이 아닌 것은?",
  choices:["소득증가율에 비해 공공재에 대한 수요가 더 빠른 속도로 증가하기 때문이다.","시장의 기능이 자연적으로 축소되기 때문이다.","관료가 예산을 극대화하려는 성향을 보이기 때문이다.","기술혁신에 따른 생산비 절감효과 측면에서 공공재가 사적재에 비해 뒤떨어지기 때문이다.","복지를 포함한 공공서비스 수요의 소득탄력성이 크기 때문이다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2017-17", subject:"재정학", year:2017, no:17, law:"재정학", unit:"7편 재정학의 기타주제", kind:"calc",
  stem:"민간소비(C), 조세(T), 투자(I)가 아래와 같고 재정은 균형 상태이다. 이 나라의 완전고용국민소득이 4,000이라고 할 때, 정부지출을 증가시켜 완전고용을 달성하고자 하는 경우의 추가 정부지출규모(A)와 감세정책을 통하여 완전고용을 실현하고자 하는 경우의 감세규모(B)로 옳은 것은? (단, Y는 국민소득이다.)\n\nC = 200 + 0.8(Y - T),  T = 400,  I = 400",
  choices:["A: 120, B: 150","A: 150, B: 120","A: 300, B: 450","A: 450, B: 300","A: 800, B: 1,000"],
  answer:1, status:"clear", note:"" },
{ id:"jj2017-18", subject:"재정학", year:2017, no:18, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"임금이 상승할 때 처음에는 우상향하다가 일정 임금 수준 이상에서 후방굴절 형태를 갖는 노동공급곡선과 관련된 설명으로 옳은 것은? (단, 여가는 정상재라 가정한다.)",
  choices:["후방굴절 구간에서는 대체효과가 소득효과보다 크다.","임금과 노동공급이 정(+)의 관계인 구간에서는 근로소득세를 증가시키면 노동공급은 증가한다.","후방굴절 구간에서 근로소득세를 증가시키면 노동공급은 증가한다.","근로소득세 과세는 초과부담을 초래하지 않는다.","근로소득세 납부 후 임금율은 상승한다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2017-19", subject:"재정학", year:2017, no:19, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"어떤 기업이 자본재에 투자하려고 한다. 이 때 첫 해에 이 투자에 대해 전액 감가상각을 허용하는 경우(A)와 이자비용의 손금처리를 부인하는 경우(B)로 구분할 때, A와 B가 각각 이 투자에 미치는 영향은?",
  choices:["A: 투자 촉진, B: 투자 촉진","A: 투자 촉진, B: 투자 위축","A: 투자 위축, B: 투자 촉진","A: 투자 불변, B: 투자 불변","A: 투자 불변, B: 투자 위축"],
  answer:2, status:"clear", note:"" },
{ id:"jj2017-20", subject:"재정학", year:2017, no:20, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"calc",
  stem:"어떤 재화의 시장 수요곡선과 공급곡선이 각각 Q^D = 1,000 - 5P, Q^S = 50 이라고 가정한다. 정부가 이 재화 1단위당 100원의 세금을 소비자에게 부과했을 경우, 사중적 손실(deadweight loss)은? (단, Q^D는 수요함수, Q^S는 공급함수, P는 가격이다.)",
  choices:["0","100","250","1,000","2,500"],
  answer:1, status:"clear", note:"" },
{ id:"jj2017-21", subject:"재정학", year:2017, no:21, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"소득불평등도 지수에 관한 설명으로 옳지 않은 것은?",
  choices:["앳킨슨(A. Atkinson)지수는 소득분배에 대한 사회적 가치판단에 따라서 크기가 달라진다.","로렌츠(M. Lorenz)곡선은 하위 몇 %에 속하는 사람들이 전체 소득에서 차지하는 비율을 나타내는 점들의 궤적이다.","지니계수(Gini coefficient)는 로렌츠곡선을 이용해서 계산할 수 있다.","지니계수는 전체 인구의 평균적인 소득격차의 개념을 활용하고 있다.","달튼(H. Dalton)의 평등지수는 1에 가까울수록 불평등한 상태를 의미한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2017-22", subject:"재정학", year:2017, no:22, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"지방재정조정제도의 하나인 보조금제도에 관한 설명으로 옳지 않은 것은?",
  choices:["우리나라의 국고보조금은 조건부보조금(conditional grant)이다.","우리나라의 보통교부세는 무조건부보조금(unconditional grant)이다.","무조건부보조금은 그 중 일부가 지역 주민의 조세부담을 완화시키는데 사용될 수 있다.","비대응보조금(non-matching grant)은 지역 주민의 사적재 소비를 늘리도록 영향을 미칠 수 있다.","대응보조금(matching grant)은 공공재의 소비를 증가시키고 지방정부의 재정부담 완화로 사적재의 소비도 증가시킨다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2017-23", subject:"재정학", year:2017, no:23, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"사회후생함수에 관한 설명으로 옳지 않은 것은?",
  choices:["사회후생함수는 그 사회가 어떠한 가치 기준을 선택할 것인가에 대한 해답을 제공해 준다.","사회후생함수는 개인들의 효용을 측정할 수 있다고 가정한다.","공리주의 사회후생함수일 경우 사회후생이 극대화되려면 각 개인의 소득의 한계효용이 서로 같아야 한다.","사회후생을 극대화시키는 배분은 파레토효율을 실현한다.","어떤 배분이 총효용가능경계선(utility possibility frontier)상에 있다면 그 배분에서는 효율과 공평을 함께 증가시킬 수 없다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2017-24", subject:"재정학", year:2017, no:24, law:"재정학", unit:"3편 공공지출이론", kind:"calc",
  stem:"소득이 Y₁, Y₂인 두 사람으로 구성된 사회의 후생함수가 W = Y₁ × Y₂ 라고 한다. 두 사람의 소득이 각각 Y₁ = 16, Y₂ = 4 이라고 할 때, 앳킨슨(A. Atkinson) 지수는?",
  choices:["0.1","0.2","0.3","0.8","8"],
  answer:2, status:"clear", note:"" },
{ id:"jj2017-25", subject:"재정학", year:2017, no:25, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"공유지의 비극(tragedy of the commons)에 관한 설명으로 옳지 않은 것은?",
  choices:["소유권이 분명하지 않은 상태에서 각 개인이 자원을 아껴 쓸 유인을 갖지 못해 발생하는 문제이다.","연근해의 어족 자원 고갈이 하나의 예이다.","공유지 사용과 관련된 개인의 결정이 다른 사람에게 외부성을 일으키게 된다.","여러 사람이 공동으로 사용하려는 목적으로 구입한 자원의 소유권은 결국 한 사람에게 귀착된다.","공동으로 사용하는 자원은 관련자들의 비효율적 사용으로 빨리 고갈되는 경향이 있다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2017-26", subject:"재정학", year:2017, no:26, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"공공재(public goods), 사적재(private goods) 및 클럽재(club goods)에 관한 설명으로 옳은 것은?",
  choices:["정부에 의해 공급되지 않고 기업에 의해 공급되는 재화는 모두 사적재이다.","우편과 철도서비스는 순수공공재에 해당된다.","클럽재는 시장을 통해서는 효율적으로 공급될 수 없다.","공공재의 규모가 일정할 때, 추가적 사용에 따른 한계비용은 증가한다.","이론적으로 순수공공재와 순수사적재 간 효율적 자원배분이 가능하다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2017-27", subject:"재정학", year:2017, no:27, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"공공재의 수요표출메커니즘에 관한 설명으로 옳지 않은 것은?",
  choices:["어떤 소비자가 부담할 세금은 자신이 표출한 선호가 아니라 다른 소비자들이 표출한 선호에 의해 결정된다.","수요표출메커니즘을 활용하면 공공재의 효율적 공급을 실현할 수 있다.","개별 소비자들은 다른 소비자들의 선호 표출과 관계없이 정직하게 선호를 표출하는 것이 최선이므로 무임승차문제는 발생하지 않는다.","수요표출메커니즘을 이용하면 정부의 균형예산 조건이 항상 충족된다.","수요표출메커니즘의 예로는 클라크세(Clarke Tax)가 있다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2017-28", subject:"재정학", year:2017, no:28, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"단순다수결 투표제를 통해 공교육에 대한 투자지출 규모를 결정하려고 한다. 3명의 투표자 A, B, C의 선호가 각각 다음과 같이 주어졌을 때, 옳지 않은 것은? (단, 3가지 안에 대한 지출 규모는 x < y < z 이다.)\n\n구분 / A / B / C\n1순위 / x / y / z\n2순위 / y / z / x\n3순위 / z / x / y",
  choices:["이행성 조건이 충족되지 못한다.","투표의 역설이 발생한다.","중위투표자 정리가 성립한다.","꽁도세(Condorcet) 투표방식을 따를 때 대진 순서에 따라 승자가 달라진다.","의사진행조작(manipulation)이 발생할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2017-29", subject:"재정학", year:2017, no:29, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"A시 의회에서는 의사결정방식으로 최적다수결제(optimal majority) 모형을 사용하기로 하였다. 가결률 n(0 ≤ n ≤ 1)에 따른 의사결정비용과 의안통과로 인해 자신들이 손해를 본다고 느끼는 사람들에게서 발생하는 외부비용이 다음과 같다. 이 때 최적 가결률은?\n\n의사결정비용 = 10n² + 10\n외부비용 = -6n² - 2n + 5",
  choices:["1/3","1/4","1/5","1/6","1"],
  answer:2, status:"clear", note:"" },
{ id:"jj2017-30", subject:"재정학", year:2017, no:30, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"A국은 개인들의 효용함수가 동일하고, 고소득자가 저소득자보다 수는 적지만 소득점유율이 높은 불공평한 분배를 보이고 있다. 이 때 공공재 공급과 관련하여 단순다수결투표를 할 경우 다음 중 옳은 것은? (단, 공공재는 정상재이다.)",
  choices:["공공재에 대한 수요는 고소득자가 저소득자보다 항상 작다.","단순다수결투표로 정해지는 공공재 공급수준은 효율적이다.","중위투표자의 소득을 높이는 소득 재분배 후 단순다수결투표를 한다면 공공재의 수요량은 적어질 것이다.","비례적 소득세를 부과하여 소득을 재분배하면 공공재가 최적공급 수준에 비해 과대 공급될 가능성이 있다.","해당 공공재에 대해 대체관계가 있는 사적재가 존재할 경우 단순다수결투표의 균형은 항상 성립하지 않는다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2017-31", subject:"재정학", year:2017, no:31, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"배출권거래제도에 관한 설명으로 옳지 않은 것은?",
  choices:["기업들에게 허용되는 오염물질 배출의 총량을 미리 정해 놓는다.","공해를 줄이는 데 드는 한계비용이 상대적으로 낮은 기업은 배출권을 판매한다.","배출권 시장의 균형에서는 배출권을 줄이는 데 드는 각 기업의 한계비용이 같아진다.","배출권의 총량이 정해지면 배출권을 각 기업에게 어떻게 할당하느냐와 관계없이 효율적 배분이 가능하다.","환경오염 감축효과가 불확실한 것이 단점이다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2017-32", subject:"재정학", year:2017, no:32, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"하천의 상류에는 하천오염물질을 유출하는 기업 A가 조업하고 있으며, 하천의 하류에는 깨끗한 물을 사용해야 하는 기업 B가 조업하고 있다고 가정할 경우, 코즈정리(Coase Theorem)와 관련하여 옳지 않은 것은?",
  choices:["하천의 재산권을 기업 A에게 부여하면 기업 B에게 부여하는 경우보다 하천의 오염도가 증가할 것이다.","코즈정리가 성립하려면 재산권이 명확하게 규정되어 있어야 한다.","코즈정리가 성립하려면 협상으로부터 얻는 이득이 협상에 드는 비용보다 커야만 한다.","코즈정리에 따르더라도 분배문제는 해결되지 않는다.","코즈정리가 성립하려면 재산권 부여와 관련된 소득효과가 없어야 한다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2017-33", subject:"재정학", year:2017, no:33, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"외부성에 관한 설명으로 옳지 않은 것은?",
  choices:["외부성이 존재할 경우 효율적 자원배분을 위해서는 사회적 한계비용과 사회적 한계편익이 일치해야 한다.","실질적 외부성이란 개인의 행동이 제3자에게 의도하지 않은 이득이나 손실을 가져와 비효율적인 자원배분의 원인으로 작용하는 현상을 말한다.","금전적 외부성이 존재하면 상대가격구조의 변동을 가져와 비효율적인 자원배분의 원인으로 작용한다.","긍정적 외부성이 존재하면 해당 재화는 사회적 최적 수준보다 적게 생산되는 경향이 있다.","부정적 외부성이 존재하면 해당 재화는 사회적 최적 수준보다 많이 생산되는 경향이 있다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2017-34", subject:"재정학", year:2017, no:34, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"로렌츠(M. Lorenz)곡선에 관한 설명으로 옳지 않은 것은?",
  choices:["두 지역의 로렌츠곡선이 서로 교차한다면 두 지역의 소득분배 평등도의 비교가 어렵다.","소득분배의 평등도에 대한 서수적인 평가를 나타낸다.","로렌츠곡선이 대각선에 가까이 위치할수록 보다 평등한 분배를 나타낸다.","사회 구성원이 똑같은 소득을 나누어 갖는 균등분배를 평등한 소득분배로 전제한다.","셋 이상의 곡선을 동시에 비교할 수 없다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2017-35", subject:"재정학", year:2017, no:35, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"오이(W. Y. Oi)에 의해 제시된 최적이부요금에 관한 설명으로 옳지 않은 것은?",
  choices:["총요금 중에서 고정 수수료와 사용 단위당 요금 사이의 비중은 재화를 공급 받는 소비자들의 고정 수수료에 대한 탄력성에 의존한다.","램지의 가격설정방식에서 적용된 역탄력성 법칙과 유사하다.","고정 수수료에 대한 탄력성이 클수록 고정 수수료를 낮게 책정하고 사용 요금을 높게 책정하면 효율성이 증가한다.","단일요금 부과의 경우에 비하여 더 높은 효율성을 달성할 수 있다.","최적이부요금은 비용함수와 수요함수만을 이용하면 산출할 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2017-36", subject:"재정학", year:2017, no:36, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"의료보험제도에서 포괄수가제와 행위별수가제에 관한 다음 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 포괄수가제의 경우 행위별수가제에 비해 과잉진료 행위가 줄어든다.\nㄴ. 포괄수가제의 경우 행위별수가제에 비해 의료서비스 품질의 저하가 우려된다.\nㄷ. 포괄수가제에 비해 행위별수가제는 의학 발전에 부정적이다.",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:2, status:"clear", note:"" },
{ id:"jj2017-37", subject:"재정학", year:2017, no:37, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"연금제도의 경제적 효과에 관한 설명으로 옳지 않은 것은?",
  choices:["연금제도는 노동공급과 노동수요의 증대를 가져와 경제성장에 기여하게 된다.","적립방식의 연금제도는 일반적으로 세대 내의 구성원 간에 부(wealth)의 이전을 초래한다.","연금급여에 대한 기대로 조기에 퇴직하는 퇴직효과(retirement effect)는 개인 저축을 늘리는 작용을 한다.","연금제도는 저축의 중요성을 일깨우는 인식효과(recognition effect)를 가져오며 이는 개인 저축을 늘리는 작용을 한다.","연금급여에 대한 기대는 개인 저축을 줄이는 자산대체효과(wealth substitution effect)를 발생시킨다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2017-38", subject:"재정학", year:2017, no:38, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"calc",
  stem:"인플레이션율이 3%, 명목이자율이 5%일 경우 20%의 이자소득세율이 적용된다면 납세 후 실질수익율은?",
  choices:["1%","2%","3%","4%","5%"],
  answer:1, status:"clear", note:"" },
{ id:"jj2017-39", subject:"재정학", year:2017, no:39, law:"재정학", unit:"3편 공공지출이론", kind:"calc",
  stem:"A, B 두 사업의 연차별 수익이 아래 표와 같다. 두 사업의 비용편익분석 결과에 관한 설명으로 옳지 않은 것은?\n\n사업안 / 0년 / 1년차 / 2년차\nA / -1,000 / 0 / 1,210\nB / -1,000 / 1,150 / 0",
  choices:["순현재가치 평가 결과 할인율이 7%라면 A가 유리한 사업이다.","순현재가치 평가 결과 할인율이 8%라면 B가 유리한 사업이다.","할인율에 따라 내부수익율과 순현재가치의 평가 결과가 상이하다.","내부수익율 기준으로는 B가 유리한 사업이다.","순현재가치로 평가하는 경우, 할인율이 높을수록 편익이 단기간에 집약적으로 발생하는 단기투자에 유리하다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2017-40", subject:"재정학", year:2017, no:40, law:"재정학", unit:"3편 공공지출이론", kind:"calc",
  stem:"어떤 사업에 대한 비용편익분석을 하려고 한다. 사업 시행 마지막 해인 50년 후에는 구조물을 처리하는 데 드는 비용 등을 고려할 때 기대순편익이 -100억 원이라고 한다. 이자율은 매년 10%이고, 지금부터 50년 후의 위험할인율은 20%이라고 한다. 사업 시행 마지막 해 순편익의 확실대등액(certainty equivalents)의 현재가치는?",
  choices:["-100억 원 × (1 - 0.2 - 0.1)^50","-100억 원 ÷ (1 - 0.2) ÷ (1 + 0.1)^50","-100억 원 ÷ (1 + 0.2) ÷ (1 + 0.1)^50","-100억 원 × (1 - 0.2) ÷ (1 + 0.1)^50","-100억 원 × (1 + 0.2) ÷ (1 + 0.1)^50"],
  answer:5, status:"clear", note:"" },
{ id:"jj2016-1", subject:"재정학", year:2016, no:1, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"외부성 문제를 해결하기 위한 과세의 사례는?",
  choices:["모든 상품에 대해서 10%의 소비세를 부과하는 경우","고소득 근로자들에게 고율의 누진소득세를 부과하는 경우","대기오염을 감축시킬 목적으로 오염발생 기업 제품에 과세하는 경우","고가부동산의 거래에 고율의 취득세를 부과하는 경우","중소기업의 법인소득에 법인세를 부과하는 경우"],

{ id:"jj2016-2", subject:"재정학", year:2016, no:2, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"우리나라 소득세 및 부가가치세 체계에서 면세자 비율을 낮추기 위한 방안으로 옳지 않은 것을 모두 고른 것은? (단, 향후 경제성장률과 물가상승률은 모두 양의 값이며 경제성장률이 더 높다. 현재의 소득공제 항목은 모두 존치된다.)\n\nㄱ. 소비활력 제고를 위해 간이과세자의 간이과세 적용요건을 완화한다.\nㄴ. 면세점을 현재 수준으로 유지한다.\nㄷ. 저출산 문제에 대응하기 위해 다자녀 가정의 인적공제를 확대한다.\nㄹ. 개인연금저축의 공제액을 확대한다.",
  choices:["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],

{ id:"jj2016-3", subject:"재정학", year:2016, no:3, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"원점에 대해 볼록한 무차별곡선을 가진 소비자 A는 열등재인 X재와 정상재인 Y재의 소비에 있어서 효용극대화를 달성하고 있다. 정부가 X재에 t_X의 세율로 과세한다고 할 때 가격효과에 관한 설명으로 옳은 것은?\n\nㄱ. 대체효과에 의해, A의 X재 소비를 감소시키고 Y재 소비를 증가시킨다.\nㄴ. 대체효과에 의해, A의 X재 소비를 감소시키고 Y재 소비를 감소시킨다.\nㄷ. 소득효과에 의해, A의 X재 소비를 증가시키고 Y재 소비를 증가시킨다.\nㄹ. 소득효과에 의해, A의 X재 소비를 증가시키고 Y재 소비를 감소시킨다.\nㅁ. 소득효과에 의해, A의 X재 소비를 감소시키고 Y재 소비를 증가시킨다.",

  answer:2, status:"clear", note:"" },
{ id:"jj2016-4", subject:"재정학", year:2016, no:4, law:"재정학", unit:"3편 공공지출이론", kind:"calc",
  stem:"편익과 비용의 흐름이 다음 표와 같은 공공투자사업에 관한 설명으로 옳은 것은 몇 개인가? (단, 사회적 할인율은 10 % 이다.)\n\n분석기간 / 편익(억원) / 비용(억원)\n0기 / 0 / 10\n1기 / 10 / 10\n2기 / 10 / 10\n3기 / 10 / 10\n4기 / 10 / 0\n\nㅇ 사업의 내부수익률은 12 % 이다.\nㅇ 본 사업의 순현재가치는 1 이다.\nㅇ 본 사업의 편익비용비율(B/C ratio)은 1 보다 작다.\nㅇ 사회적 할인율이 7.5 %로 인하되면 순현재가치는 증가한다.",
  choices:["0개","1개","2개","3개","4개"],

{ id:"jj2016-5", subject:"재정학", year:2016, no:5, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"재산세와 같은 일반적인 자산과세(property tax)에 관한 설명으로 옳지 않은 것은?",
  choices:["자산과세의 세부담자는 자산소유자이지만, 주로 물건을 기준으로 과세되기 때문에 대물세로 간주한다.","자산수익률이 노동수익률보다 높은 경우, 자산과세의 강화는 소득분배 불평등도를 완화시킨다.","자산과세를 지방세의 근간으로 하면 지역 간 재정불균형을 심화시킬 수 있다.","이론적으로 동결효과(lock-in effect)로 인하여 부동산 거래를 활성화시킨다.","능력원칙과 편익원칙을 모두 구현할 수 있는 과세방식이다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2016-6", subject:"재정학", year:2016, no:6, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"재정연방체제이론에 따른 중앙정부와 지방정부 간 기능배분에 관한 설명으로 옳지 않은 것은?",
  choices:["공공재 공급효과가 미치는 공간적 범위에 따라 중앙정부와 지방정부가 공급해야 할 공공재를 구분해야 한다.","조세부담-편익 연계가 강한 공공재는 지방정부가, 그렇지 않은 공공재는 중앙정부가 공급하는 것이 바람직하다.","무임승차의 가능성이 높은 공공재의 경우에는 중앙정부가, 그렇지 않은 공공재는 지방정부가 공급하는 것이 바람직하다.","국방과 외교는 중앙정부가, 쓰레기 수거와 거리청소는 지방정부가 공급하는 것이 바람직하다.","부정적 외부성이 존재하는 공공재는 중앙정부가, 긍정적 외부성이 존재하는 공공재는 지방정부가 공급하는 것이 바람직하다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2016-7", subject:"재정학", year:2016, no:7, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"중앙정부의 지방자치단체에 대한 교부금 지원이 초래하는 끈끈이효과(flypaper effect)에 관한 설명으로 옳지 않은 것은?",
  choices:["지방정부의 공공재 지출증대 효과는 중앙정부의 정액교부금 지원을 통한 경우가 중앙정부의 조세감면-주민소득증가에 의한 경우보다 효과가 더 크다.","중앙정부의 교부금으로 인해 지방공공재의 생산비가 하락한 것으로 주민들이 인식하는 경향이 있다.","지역주민이 중앙정부의 교부금 지원에 따른 한계조세가격의 하락으로 인식하는 재정착각에 빠질 수 있다.","관료들이 중앙정부로부터 교부금을 받았다는 사실을 공개할 때 나타나는 현상이다.","지방자치단체 관료들의 예산극대화 동기와 무관하지 않다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2016-8", subject:"재정학", year:2016, no:8, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"A국의 소득을 소득계층별, 소득형태별로 정리한 표에 관한 해석으로 옳지 않은 것은? (단, 소득공제는 없다.)\n\n구분 / 총소득(%) / 노동소득(%) / 자산소득(%) / 기타소득(%)\n상위(1 ~ 10%) / 29.4 / 31.2 / 96.9 / 66.3\n중위(11 ~ 60%) / 51.0 / 54.3 / 3.1 / 33.7\n하위(61 ~ 100%) / 19.6 / 14.5 / 0.0 / 0.0\n소득형태별 점유율(%) / 100.0 / 86.0 / 3.0 / 11.0",
  choices:["동일한 세율로 세수를 극대화하려면 자산 및 기타소득에 과세하는 것이 효과적이다.","자산소득을 갖고 있는 사람들은 대부분 상위소득자라 할 수 있다.","국가 전체로 보면 노동소득에서 발생하는 금액이 제일 크다.","효과적인 소득재분배를 위해서는 금융소득과 부동산(임대, 양도)소득에 중과세할 필요가 있다.","조세의 효율성 측면에서 판단하자면 동일한 조세 수입 가정 하에 모든 소득에 단일세율로 과세하는 것이 좋다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2016-9", subject:"재정학", year:2016, no:9, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"린달(E. Lindahl)의 자발적 협상모형과 관련된 설명으로 옳은 것은 몇 개인가?\n\nㅇ 부정적 외부성이 존재한다 하더라도, 개인 간의 협상을 통해 효율성이 개선될 수 있다는 이론이다.\nㅇ 린달 모형의 정책적 함의는 '개인 간 갈등해소를 위해 정부가 적극적으로 개입해야 함'을 의미한다.\nㅇ 린달 모형에서 도출된 해는 사뮤엘슨의 효율성 조건을 만족시킬 수 있다.\nㅇ 합의에서 결정되는 비용의 부담비율이 시장에서 가격의 기능과 유사함을 밝힌 모형이다.\nㅇ 정부의 개입이 불필요하다는 것을 강조했다는 점에서 코즈 이론과 유사하지만, 형평성을 강조했다는 점에서 코즈 이론과 차별화 된다.",
  choices:["0개","1개","2개","3개","5개"],
  answer:3, status:"clear", note:"" },
{ id:"jj2016-10", subject:"재정학", year:2016, no:10, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"어느 나라의 소득세 과세구간은 n개이고, 각 과세구간의 한계세수당 한계효용의 비율은 다음과 같았다.\n\nMU₁/MR₁ < MU₂/MR₂ = MU₃/MR₃ = … = MU_(n-1)/MR_(n-1) < MU_n/MR_n\n\n(여기서 MR(한계세수)과 MU(한계효용)는 각각 0 보다 크고, 체감한다.)\n효용을 극대화할 수 있는 세율 조정방안은? (단, 소비는 세후소득에만 의존하고, 각 구간에서 효용은 소비의 함수, 세수는 세율의 함수이다.)",
  choices:["1번째 과세구간의 소득세율은 높이고, n번째 과세구간의 소득세율도 높인다.","1번째 과세구간의 소득세율은 높이고, n번째 과세구간의 소득세율은 낮춘다.","1번째 과세구간의 소득세율은 낮추고, n번째 과세구간의 소득세율은 높인다.","1번째 과세구간의 소득세율은 낮추고, n번째 과세구간의 소득세율도 낮춘다.","현재 상태에서 세율조정은 불필요하다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2016-11", subject:"재정학", year:2016, no:11, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"오염의 효율적 억제에 관한 설명으로 옳지 않은 것은?",
  choices:["오염의 최적 수준은 오염감축의 사회적 한계비용이 오염의 사회적 한계피해와 같아지는 점에서 결정된다.","오염 발생 기업에 대한 과세는 오염 감축기술의 개발을 저해한다.","오염은 기업 간 오염 감축비용을 고려하여 통제하는 것이 합리적이다.","재산권 설정과 거래를 통해 오염의 최적수준을 달성할 수 있다.","오염에 대한 과세는 기업들이 스스로 오염을 억제할 유인을 준다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2016-12", subject:"재정학", year:2016, no:12, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"정부가 정량보조의 형태로 소규모 임대아파트를 지역주민들에게 무상으로 제공하는 경우 경제적 효과로 옳은 것을 모두 고른 것은?\n\nㄱ. 무주택자의 입장에서는 정액 임대료를 지원하는 것에 비해 후생면에서 더 우월하다.\nㄴ. 대형평수 주택소유자의 입장에서는 정액 임대료를 지원하는 것에 비해 후생면에서 더 열등하다.\nㄷ. 식품을 정량보조로 지급하는 것과 동일한 효과를 갖는다.",
  choices:["ㄱ","ㄴ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:2, status:"clear", note:"" },
{ id:"jj2016-13", subject:"재정학", year:2016, no:13, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라 고용보험제도는 보험료를 일정기간 납부하면 실직 시 일정기간 실업급여로 지급하게 된다. 이의 경제적 효과로 옳은 것은?",
  choices:["구직활동을 하지 않게 한다.","자발적 실업자에게도 지급된다.","도덕적 해이는 발생하지 않는다.","경기가 좋아지면 실업급여의 지급이 늘어난다.","소득대체율이 높을수록 구직노력을 덜 하게 하는 유인이 발생한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2016-14", subject:"재정학", year:2016, no:14, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"다음과 같은 형태로 운영되는 소득세 과세체계에 관한 설명으로 옳지 않은 것은? (단, 부의 소득세는 고려하지 않는다.)\n\nT = (Y - 1000) × 0.3   (T는 세액, Y는 소득)",

  answer:4, status:"clear", note:"" },
{ id:"jj2016-15", subject:"재정학", year:2016, no:15, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"소득구간별 세율이 아래와 같을 때, 연금저축에 대하여 400만원까지 소득공제혜택이 주어지던 것이 400만원까지에 대하여 10 %의 세액공제로 전환되었다고 가정할 경우의 효과로 옳은 것은?\n\n구분 / 세율\n저소득층 / 5 %\n중소득층 / 15 %\n고소득층 / 30 %",
  choices:["중소득자의 혜택이 상대적으로 증가한다.","저소득층의 연금저축이 감소할 것이다.","저축금액에 관계없이 모든 계층에게 같은 금액의 세제혜택이 주어진다.","고소득층의 혜택이 상대적으로 더 감소한다.","소득분배 개선 효과는 없다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2016-16", subject:"재정학", year:2016, no:16, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"램지(Ramsey)의 최적물품과세원리에 관한 내용으로 옳지 않은 것은?",
  choices:["초과부담을 최소화하는 방법이다.","과세 시 모든 상품의 소비량 감소율이 같도록 설계되어야 한다.","재화 간 세수에 대한 후생비용의 비율이 같아야 한다.","필수재에 더 높은 세율을 적용하도록 한다.","수요의 가격탄력성이 높은 재화일수록 높은 세율을 적용한다."],

{ id:"jj2016-17", subject:"재정학", year:2016, no:17, law:"재정학", unit:"3편 공공지출이론", kind:"calc",

{ id:"jj2016-18", subject:"재정학", year:2016, no:18, law:"재정학", unit:"1편 재정학의 개요", kind:"concept",
  stem:"파레토최적에 관한 설명으로 옳지 않은 것은?",
  choices:["생산자 간 생산요소 배분의 효율성은 모든 생산요소시장이 완전경쟁시장이면 달성된다.","소비자 간 재화 배분의 효율성은 모든 상품시장이 완전경쟁시장이면 달성된다.","시장경제에서 생산자 및 소비자 모두가 완전경쟁상태에 있다면, 강단조성을 갖는 동시에 외부성 등이 존재하지 않는다는 조건 하에서 파레토효율이 이루어진다.","파레토최적 배분상태는 효용가능경계곡선 상에서 하나만 나타난다.","재화의 최적구성은 생산에 있어서 두 재화 간 한계변환율과 소비에 있어서 두 재화 간 한계대체율이 같을 때 이루어진다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2016-19", subject:"재정학", year:2016, no:19, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"조세를 통한 소득재분배 효과에 관한 설명으로 옳지 않은 것은?",
  choices:["누진세 구조의 개인소득세는 저소득층의 소득을 직접 증가시키는 것은 아니지만 소득분배 개선 효과를 나타낸다.","소비세의 과세대상을 사치품으로 한정하여 부과한다면 고소득층이 세금부담을 주로 할 것이므로 소득분배 개선 효과를 나타낸다.","한계세율이 점증하는 누진소득세 체계에서 소득공제를 도입하면 고소득층의 세후 소득을 감소시킨다.","법인세의 세부담이 소비자에게 전가된다면 소득분배가 악화된다.","자산소득 지니계수가 높은 나라에서는 자산소득에 높은 세율로 과세하면 소득분배 개선 효과를 나타낸다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2016-20", subject:"재정학", year:2016, no:20, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공적연금보험제도 도입이 민간저축에 미치는 영향에 관한 설명으로 옳지 않은 것은? (단, 다른 조건은 일정하다고 가정한다.)",
  choices:["노후대비에 대한 인식이 더욱 제고되어 민간저축은 증가한다.","연금보험료를 납부하게 되면 개인의 가처분소득 감소로 민간저축은 감소한다.","평생에 걸친 소비의 현재가치는 소득의 현재가치와 같다는 조건 하에서 자산대체효과는 민간저축을 감소시킨다.","상속효과에 따르면 민간저축은 증가할 것이다.","공적연금보험제도의 실시로 발생하는 은퇴효과는 민간저축을 감소시킨다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2016-21", subject:"재정학", year:2016, no:21, law:"재정학", unit:"3편 공공지출이론", kind:"calc",

{ id:"jj2016-22", subject:"재정학", year:2016, no:22, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"규모에 대한 수확체증인 공공서비스 공급에 있어서 가격을 한계비용과 같도록 설정함으로써 발생하는 손실을 해결하기 위한 방안으로 옳지 않은 것은?",
  choices:["일반 세원으로 손실을 충당한다.","공공서비스의 평균비용으로 공공서비스가격을 결정한다.","소비자가 사용하는 양에 따라 다른 가격을 설정한다.","소비자로 하여금 일정한 금액을 지불하게 한 다음 소비자가 구입하는 양에 비례하여 추가적인 가격을 설정한다.","한계수입과 한계비용이 같은 점을 공공서비스가격으로 한다."],

{ id:"jj2016-23", subject:"재정학", year:2016, no:23, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"두 기업(A, B)이 존재하는 경제에서 A기업은 X재를 생산하고, B기업은 Y재를 생산할 경우, A기업의 비용함수(C_a)는 X² + 4X이고, B기업의 비용함수(C_b)는 Y² + 3Y + X이다. 효율적인 자원배분을 위한 정부 정책수단으로 옳지 않은 것은? (단, X > 0, Y > 0 이다.)",
  choices:["B기업에 환경세를 부과한다.","외부성을 유발하는 물질에 대한 신규시장을 개설한다.","두 기업을 공동 소유할 수 있도록 통합한다.","두 기업 간 거래비용이 매우 적고, 협상으로 인한 소득재분배의 변화가 없을 경우 자발적 타협을 유도한다.","정부가 X재와 Y재의 사회적 최적량을 생산하도록 수량을 규제한다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2016-24", subject:"재정학", year:2016, no:24, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"두 사람(A, B)이 존재하는 경제에서 공공재 X의 한계비용(MC_x)은 2X, A의 한계효용(MU_A)은 4-X, B의 한계효용(MU_B)은 8-2X이다. 공공재의 균형량은?",

{ id:"jj2016-25", subject:"재정학", year:2016, no:25, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"안전자산과 위험자산으로 구성되어 있는 경제에서 안전자산의 수익률은 0 이며, 개인은 수익극대화를 추구한다. 위험자산에 비례소득세를 부과하고 손실 보상을 전혀 해주지 않는 경우의 설명으로 옳은 것은?",
  choices:["위험부담 행위의 소득탄력성이 양이면, 소득효과는 위험자산에 대한 투자를 줄이고 대체효과는 위험자산에 대한 투자를 늘려 총효과는 불확실하다.","위험부담 행위의 소득탄력성이 음이면, 소득효과와 대체효과 모두 위험자산에 대한 투자를 늘린다.","위험부담 행위의 소득탄력성이 양이면, 소득효과와 대체효과 모두 위험자산에 대한 투자를 줄인다.","위험부담 행위의 소득탄력성이 음이면, 소득효과와 대체효과 모두 위험자산에 대한 투자를 줄인다.","위험부담 행위의 소득탄력성이 양이면 소득효과와 대체효과가 발생하지 않아 위험자산에 대한 투자는 불변이다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2016-26", subject:"재정학", year:2016, no:26, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"시장 내 모든 기업이 이윤극대화를 추구할 때, 종가세와 종량세의 조세귀착에 관한 설명으로 옳지 않은 것은?",
  choices:["완전경쟁시장의 경우 과세 후 균형점에서 수요가격과 공급가격의 차만 같으면 종가세와 종량세의 전가는 동일하다.","완전경쟁시장의 경우 과세 후 균형점에서 수요가격과 공급가격의 차만 같으면 종가세와 종량세의 조세수입은 동일하다.","독점시장에서 소비자에게 과세하는 경우 종가세와 종량세가 생산량에 동일하게 영향을 미친다면, 종가세의 조세수입이 종량세의 조세수입보다 많아진다.","독점시장에서 소비자에게 과세하는 경우 종가세와 종량세로 인한 조세수입이 같다면, 종가세의 생산량보다 종량세의 생산량이 더 많아진다.","독점시장에서 소비자에게 과세하는 경우 종가세와 종량세가 생산량에 동일하게 영향을 미친다면, 종가세와 종량세의 사중손실(deadweight loss)의 크기는 동일하다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2016-27", subject:"재정학", year:2016, no:27, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"근로소득세가 노동공급에 미치는 영향으로 옳은 것은?",
  choices:["여가가 정상재일 때, 비례소득세 부과로 인한 대체효과가 소득효과보다 크면 노동공급은 늘어난다.","여가가 정상재일 때, 비례소득세와 동일한 조세수입을 가져다주는 비왜곡적인 정액세를 부과하는 경우 노동공급에 미치는 효과는 동일하다.","여가가 열등재일 때, 비례소득세 부과로 인한 대체효과가 소득효과보다 크면 노동공급은 늘어난다.","여가가 열등재일 때, 비례소득세와 동일한 조세수입을 가져다주는 비왜곡적인 정액세를 부과하는 경우 노동공급에 미치는 효과는 동일하다.","여가가 열등재일 때, 비왜곡적인 정액세를 부과하는 경우 소득효과만 존재하여 노동공급은 감소한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2016-28", subject:"재정학", year:2016, no:28, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"스턴(N. Stern)이 주장한 소득세의 최적과세에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 불평등에 대한 혐오감지표의 절대값이 낮을수록 최적소득세율은 낮다.\nㄴ. 조세수입 목표가 클수록 최적소득세율은 높다.\nㄷ. 면세점 이상인 소득자에 대해서 최적선형소득세는 최적비선형소득세에 비해 수직적 공평을 제고하는 데 상대적으로 효과적이지 않다.",
  choices:["ㄱ","ㄴ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],

{ id:"jj2016-29", subject:"재정학", year:2016, no:29, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",

  choices:["노동의 수요탄력성이 무한히 클 경우 근로소득세는 고용주가 모두 부담한다.","자본에 과세하는 경우 자본의 개방도가 높을수록 자본공급자의 부담은 높아진다.","공급이 고정되어 있는 토지에 대한 과세는 토지의 현재 소유자에게 귀착된다.","토지의 공급이 신축적일 경우 토지에 대한 과세는 완전한 자본화를 가져온다.","노동의 공급탄력성이 매우 작을 경우 근로소득세는 고용주가 대부분 부담한다."],

{ id:"jj2016-30", subject:"재정학", year:2016, no:30, law:"재정학", unit:"3편 공공지출이론", kind:"calc",

{ id:"jj2016-31", subject:"재정학", year:2016, no:31, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"코즈 정리에 관한 설명으로 옳지 않은 것은?",
  choices:["정부가 소유권을 설정하면, 자발적 거래에 의하여 시장실패가 해결된다는 정리이다.","외부성이 있는 재화의 과다 또는 과소 공급을 해소하는 대책에 해당한다.","외부불경제의 경우 이해당사자 중 가해자와 피해자를 명확하게 구분하지 않더라도 코즈 정리를 적용할 수 있다.","외부성 문제 해결에 있어서 효율성과 형평성을 동시에 고려하는 해결 방안이다.","코즈 정리는 외부성 관련 당사자들이 부담해야 하는 거래비용이 작을 때 적용이 용이하다."],

{ id:"jj2016-32", subject:"재정학", year:2016, no:32, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"다수가 사용하는 공공재의 최적공급이론에 관한 설명으로 옳은 것은?",
  choices:["비배제성이 존재할 경우에도 공공재의 정확한 수요를 도출할 수 있다.","공공재의 전체 수요곡선은 개별수요곡선을 수평으로 합계한 것이다.","공공재의 최적공급 상황에서는 동일한 소비량에 대하여 상이한 가격을 지불하게 된다.","파레토 효율은 공공재 개별 이용자의 한계편익과 한계비용이 일치할 때 달성된다.","공공재의 각 이용자가 부담하는 공공재 가격은 공급에 따르는 한계비용과 일치한다."],

{ id:"jj2018-9", subject:"재정학", year:2018, no:9, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"다음은 아담 스미스의 국부론 내용의 일부이다. 현대의 조세이론 가운데 자원배분의 왜곡과 관련된 항목을 모두 고른 것은?\n\nㄱ. 조세 징수에 많은 수의 관리들이 필요해서 그들의 봉급이 조세수입의 대부분을 갉아먹고 또한 그들의 부수입이 국민들에게 추가적인 과세부담으로 되는 경우이다.\nㄴ. 조세가 국민들의 근면을 방해하고, 그들로 하여금 (많은 사람들을 먹여 살리고 고용할 수 있는) 어떤 산업부문에 종사하는 것을 단념하도록 만드는 경우이다.\nㄷ. 탈세를 시도하다가 실패하는 불행한 사람들에게 몰수 기타의 형벌을 부과함으로써, 조세가 그들을 종종 몰락시키고 그리하여 사회가 (그들의 자본 운용으로부터 얻을 수 있었을) 이익을 상실하게 되는 경우이다.\nㄹ. 국민들에게 조세 징수인의 빈번한 방문·짜증나는 조사를 받게 함으로써 조세가 국민들에게 수많은 불필요한 고통·번거로움·억압을 주는 경우이다.",
  choices:["ㄴ","ㄹ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄹ"],
  answer:1, status:"clear", note:"" },
{ id:"jj2018-10", subject:"재정학", year:2018, no:10, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",

  answer:4, status:"clear", note:"" },
{ id:"jj2018-11", subject:"재정학", year:2018, no:11, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"calc",

{ id:"jj2018-12", subject:"재정학", year:2018, no:12, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"법인세와 소득세의 통합에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 조합방식(partnership method): 완전통합으로 배당이나 사내유보를 구분하지 않고 개인소득세로 부과하는 방식이다.\nㄴ. 자본이득방식(capital gains method): 완전통합으로 법인소득 중 배당되는 부분은 개인소득으로, 사내유보는 자본이득으로 과세하는 방식이다.\nㄷ. 배당세액공제제도(dividend gross-up method): 부분통합으로 법인의 모든 이윤에 과세한 후, 이중과세를 피하기 위하여 법인세 과세분 전체를 개인소득세에서 세액공제하는 방식이다.\nㄹ. 차등세율제도(split rate system): 부분통합으로 법인의 이윤 중 배당된 부분에 대해서는 사내유보가 되는 부분보다 더 낮은 법인세율을 적용해 주는 방식이다.",
  choices:["ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:3, status:"clear", note:"" },
{ id:"jj2018-13", subject:"재정학", year:2018, no:13, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"근로소득세 부과가 노동공급에 미치는 영향으로 옳은 것은?",
  choices:["여가가 정상재일 경우, 소득효과와 대체효과 모두 노동공급을 증가시키므로 총노동공급은 증가한다.","여가가 정상재일 경우, 소득효과로 노동공급이 증가하고, 대체효과로 노동공급이 감소하여 총노동공급의 변화는 알 수 없다.","여가가 열등재일 경우, 소득효과와 대체효과 모두 노동공급을 증가시키므로 총노동공급은 증가한다.","여가가 열등재일 경우, 소득효과로 노동공급이 감소하고, 대체효과로 노동공급이 증가하여 총노동공급의 변화는 알 수 없다.","여가가 열등재일 경우, 소득효과로 노동공급이 증가하고, 대체효과로 노동공급이 감소하여 총노동공급의 변화는 알 수 없다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2018-14", subject:"재정학", year:2018, no:14, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"다음 그림은 과세표준과 세율의 관계를 표시하고 있다. 이에 관한 설명으로 옳은 것은?\n\n[그림] 가로축 과세표준, 세로축 세율. 세율이 0~a, a~b, b~c, c 초과의 네 구간에서 계단식으로 높아지며(0부터 이미 양(+)의 세율), c를 넘으면 가장 높은 세율이 수평으로 유지된다. (초과누진세율 구조의 한계세율 그래프)",
  choices:["과세표준이 a를 초과할 때 비로소 누진세가 나타난다.","평균세율은 과세표준의 구간에 따라 계단식으로 증가한다.","과세표준의 전 구간에 걸쳐 평균세율은 한계세율보다 낮다.","과세표준이 c를 초과하면 평균세율은 더 이상 증가하지 않는다.","과세표준의 전 구간에서 세액공제가 증가하면 한계세율은 감소한다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2018-15", subject:"재정학", year:2018, no:15, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"X재, Y재, 여가 간의 선택에 조세부과가 미치는 효과로 옳지 않은 것은? (단, X재: 여가와 보완재, Y재: 노동과 보완재)",
  choices:["X재에 대한 개별소비세는 X재와 여가 간의 선택에 영향을 미친다.","Y재에 대한 개별소비세는 Y재와 여가 간의 선택에 영향을 미친다.","일반소비세, 소득세, 개별소비세 가운데 어느 쪽이 더 효율적인가는 단정하기 어렵다.","X재에 중과하는 개별 소비세는 여가에 간접적으로 과세할 수 있기 때문에 보다 효율적이다.","정액세(lump-sum tax)는 초과부담을 수반하지 않기 때문에 형평성 측면에서 우월한 조세이다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2018-16", subject:"재정학", year:2018, no:16, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"이자소득세 부과의 효과로 옳지 않은 것은? (단, 현재소비와 미래소비는 모두 정상재이다.)",
  choices:["이자소득세 부과 시 민간저축과 정부저축의 합은 그 변화를 알 수 없다.","이자소득세가 부과되면 미래소비의 가격이 상승하는 효과를 가진다.","이자소득세 부과 시 민간저축은 증가할 수도 감소할 수도 있다.","이자소득세 부과 시 현재소비는 대체효과에 의해 증가하고 소득효과에 의해 감소한다.","이자소득세 부과 시 미래소비에 주는 영향은 대체효과와 소득효과로 나눠지는데 이들 두 효과는 서로 반대 방향으로 작동한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2018-17", subject:"재정학", year:2018, no:17, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"다음 그림은 재화 A, 재화 B가 존재하는 경제에서 납세자의 예산선과 무차별곡선(i, ii)을 나타내고 있다. 과세 이전의 예산선은 B0A0이고, 과세 이후의 예산선은 B0A1이다. 과세 이전과 과세 이후 납세자의 효용극대화 점은 각각 E0, E1이다. 과세 이전 예산선과 동일한 기울기를 가지면서 과세 이후 효용극대화 점을 지나는 무차별곡선에 접하는 예산선은 B2A2로 주어져 있다. 이 때 초과부담은?\n\n[그림] 가로축 재화A, 세로축 재화B. E1(과세 후 균형, 무차별곡선 ii 위)에서 수직선을 위로 올리면 원래 예산선 B0A0과 F에서 만나고, 아래로 내리면 B2A2와 G에서 만난다. E2는 무차별곡선 ii와 B2A2의 접점, E0는 무차별곡선 i와 B0A0의 접점이다. H는 E1을 지나는 수직선과 E2 높이의 수평선(B*)이 만나는 점이다.",
  choices:["FE₁","FG","FH","E₁G","E₁H"],
  answer:4, status:"clear", note:"" },
{ id:"jj2018-18", subject:"재정학", year:2018, no:18, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"개인소득세의 소득공제와 세액공제에 관한 설명으로 옳지 않은 것은?",
  choices:["누진세율 구조인 경우 세액공제의 실제 조세 감면 효과는 대상자의 소득이 클수록 크게 나타난다.","소득공제는 담세능력에 따라 과세하고자 하는 것이다.","소득공제를 실시하면 파레토 효율성 조건 중의 하나인 교환의 조건을 충족하지 못한다.","개인들의 수요에 대한 가격탄력성이 각각 다른 상황에서 특정 경제행위의 장려가 조세감면의 목표라면 소득공제가 세액공제보다 효과적일 수 있다.","현재 우리나라 세액공제 사례로 의료비, 정치후원금 등이 있다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2018-19", subject:"재정학", year:2018, no:19, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"하버거(A. Harberger)는 조세귀착에 관한 일반균형 모형에서 다음과 같이 가정하였다. 이러한 경우에 나타나는 현상으로 옳지 않은 것은?\n\nㄱ. 두 재화 X, Y가 있으며, 생산기술은 일차동차(선형동차)이고 X는 자본집약적 부문이고 Y는 노동집약적 부문이다.\nㄴ. 모든 시장은 완전경쟁이고 노동과 자본의 총량은 일정하고 부문 간 요소 이동성이 완전하다.",
  choices:["X부문과 Y부문의 노동에 대한 동률의 조세는 그 부담이 모두 노동에 귀착된다.","X재화에 물품세를 부과하면 노동에 대비한 자본의 상대가격을 높이게 된다.","X부문의 자본에 대한 과세는 산출효과를 통해 노동에 대비한 자본의 상대가격을 낮추게 된다.","X부문의 자본에 대한 과세는 요소대체효과를 통해 노동에 대비한 자본의 상대가격을 낮추게 된다.","Y부문의 노동에 대한 과세 시 산출효과와 요소대체효과는 서로 같은 방향으로 작용한다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2018-20", subject:"재정학", year:2018, no:20, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"법인세에 관한 설명으로 옳지 않은 것은?",
  choices:["경제적 이윤에 대해 과세하는 형태의 법인세는 기업의 생산 결정을 왜곡하지 않는다.","법인세 부과로 인해 법인소득 단계와 개인소득 단계에서 이중 과세하는 문제가 발생한다.","우리나라의 법인세율은 여러 세율로 구성된 누진구조로 되어 있다.","타인자본에 대해서만 이자비용 공제를 허용하는 법인세는 투자재원 조달 방식에 왜곡을 가져오지 않는다.","국가 간의 조세경쟁이 존재하는 경우 투자를 유지하기 위해 각 국은 법인세율을 낮춘다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2018-21", subject:"재정학", year:2018, no:21, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"비용-편익분석에 관한 설명으로 옳지 않은 것은?",
  choices:["현재가치법에서 할인율이 높아질수록 편익이 초기에 집중되는 사업의 상대적 우선순위가 높아진다.","내부수익률은 사업 순편익의 현재가치를 0으로 만드는 할인율이다.","사업의 규모가 현저히 다른 두 사업에 대해서 내부수익률법과 현재가치법은 다른 우선순위를 가질 수 있다.","추가적인 비용을 비용 증가 또는 편익 감소 어느 쪽으로 분류하든 편익-비용 비율은 달라지지 않는다.","우리나라 정부에서 행하고 있는 예비타당성 조사는 비용-편익 분석의 사례이다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2018-22", subject:"재정학", year:2018, no:22, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"연금제도에 관한 설명으로 옳지 않은 것은?",
  choices:["노후소득의 감소에 대비한 사회보험제도이다.","사회보험으로 운용하는 이유는 역선택 문제가 있기 때문이다.","우리나라의 국민연금은 적립방식이 아닌 부과방식으로 도입되었다.","연금제도가 가지는 재산대체효과는 민간저축을 줄이는 방향으로 작용한다.","부과방식의 연금이 운용되게 되면 세대간 소득이전이 발생할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2018-23", subject:"재정학", year:2018, no:23, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"야생동물 보호 정책에 관한 설명으로 옳지 않은 것은?",
  choices:["순찰대를 만들어 감시를 하였으나 여전히 남획이 계속되었다면 규제를 통한 외부성의 내부화에는 한계가 있음을 의미한다.","야생동물에 대한 재산권을 동물 판매업자에게 부여한 결과 남획이 줄어들었다. 이는 재산권을 누구에게 부여하는가에 따라 소득분배뿐만 아니라 자원배분의 효율성도 영향을 받음을 의미한다.","포획 가능한 야생동물 수를 매년 정하고, 포획권을 경매를 통해 판매하여 야생동물 수를 유지할 수 있었다. 이는 시장기구를 통해 외부성을 내부화한 예이다.","야생동물에 대한 재산권을 해당 지역의 부족들에게 부여하였더니, 이 부족들은 탐방사업 등을 통해 수익을 거두기 위하여 야생동물 보호활동을 강화했다. 이는 재산권 확립을 통한 외부성 문제 해결의 예이다.","야생동물을 포획·반출하는 행위에 세금을 부과하여 야생동물의 남획을 최적 수준으로 줄일 수 있었다면 이러한 정책은 피구 조세의 예로 볼 수 있다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2018-24", subject:"재정학", year:2018, no:24, law:"재정학", unit:"1편 재정학의 개요", kind:"concept",
  stem:"보상원칙에 관한 설명으로 옳지 않은 것은?",
  choices:["파레토 기준의 한계를 보완하는 차원의 접근이다.","개인 간의 직접적 효용비교 없이 어떤 변화가 개선인지의 여부를 평가할 수 있는 방법이다.","판단하는 시점에서는 보상 여부를 감안하지 않지만 선택 결정 이후에는 보상이 이루어져야만 성립한다.","하나의 상태가 다른 상태로 변화했을 때 이득을 보는 사람이 손해를 보게 되는 사람의 손실을 보전하고도 남는 것이 있을 때 칼도기준을 충족한다.","사회구성원들이 1원에 대해 똑같은 사회적 가치평가를 한다고 암묵적으로 가정하고 있다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2018-25", subject:"재정학", year:2018, no:25, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"애로우(K. Arrow)의 불가능성정리에서 사회적 선호체계가 가져야 할 바람직한 속성이 아닌 것은?",
  choices:["볼록성","이행성","비독재성","파레토 원칙","제3의 선택가능성으로부터의 독립"],

{ id:"jj2018-26", subject:"재정학", year:2018, no:26, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"갑의 생산행위가 시장기구를 통하지 않고 을에게 피해를 입히게 되는데, 갑의 한계편익은 200 − (1/2)Q, 한계비용은 50, 갑의 행위로 인한 을의 한계피해비용은 10이다. 코즈(Coase) 정리에 따라 효율적인 생산규모 산정이 가능하다고 할 때, 다음 설명으로 옳은 것은? (Q: 갑의 생산량)",
  choices:["갑이 재산권을 가지고 있을 경우, 을이 80을 갑에게 제공하면 자발적 협상이 타결될 수 있다.","갑이 재산권을 가지고 있을 경우, 자발적 협상이 타결되면 갑의 생산량은 증가한다.","갑이 재산권을 가지고 있을 경우, 자발적 협상이 타결되면 갑의 최대 후생은 22,600이다.","을이 재산권을 가지고 있을 경우, 갑이 을에게 2,500을 제공하면 자발적 협상이 타결될 수 있다.","을이 재산권을 가지고 있을 경우, 자발적 협상이 타결이 되지 않으면 갑의 생산량은 300이다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2018-27", subject:"재정학", year:2018, no:27, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"현물보조와 현금보조에 관한 설명으로 옳지 않은 것은?",
  choices:["현물보조의 대표적인 항목에는 의무 교육, 의료, 주거 등 가치재들이 포함된다.","현물보조에 비하여 현금보조는 높은 행정비용과 운영비용을 수반한다.","동일한 재정을 투입하는 경우 일반적으로 현금보조가 현물보조에 비하여 소비자에게 보다 넓은 선택을 가능하게 한다.","현물보조를 사용하는 주된 이유는 해당 현물의 소비가 바람직하다고 생각하기 때문이다.","현금보조가 가지는 단점 중 하나는 상대적으로 부정수급과 오남용 가능성이 크다는 것이다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2018-28", subject:"재정학", year:2018, no:28, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"규모수익체증 하에서 적정 공공요금 결정이론에 관한 설명으로 옳지 않은 것은?",
  choices:["한계비용 가격설정방법으로 요금을 결정하면, 공급되는 공공서비스 양은 효율적이다.","한계비용 가격설정방법으로 요금을 결정하면, 공공서비스를 생산하는 기관은 이윤을 창출할 수 없다.","평균비용 가격설정방법으로 요금을 결정하면, 공급되는 공공서비스 양은 비효율적이다.","평균비용 가격설정방법으로 요금을 결정하면, 공공서비스를 생산하는 기관은 이윤을 창출할 수 있다.","이부가격제도(two-part tariff)는 기업의 손실 규모를 줄이기 위하여 도입된다."],

{ id:"jj2018-29", subject:"재정학", year:2018, no:29, law:"재정학", unit:"3편 공공지출이론", kind:"calc",
  stem:"갑과 을 두 사람이 존재하는 경제에서 이들의 후생이 소득수준과 동일할 경우, 갑의 소득은 400, 을의 소득은 100이다. 앳킨슨 지수(Atkinson index)로 소득분배를 평가한 설명으로 옳은 것은?",
  choices:["롤즈의 사회후생함수인 경우 앳킨슨 지수는 0이다.","롤즈의 사회후생함수인 경우 앳킨슨 지수는 0.4이다.","롤즈의 사회후생함수인 경우 앳킨슨 지수는 1이다.","공리주의 사회후생함수인 경우 앳킨슨 지수는 1이다.","공리주의 사회후생함수인 경우 앳킨슨 지수는 0이다."],

{ id:"jj2018-30", subject:"재정학", year:2018, no:30, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"갑과 을 두 사람만 존재하는 경제에서 공공재 생산의 단위비용은 생산수준과 관계없이 1이다. 갑의 공공재 수요함수는 3 − (1/3)Ga이고, 을의 공공재 수요함수는 4 − (1/2)Gb이다. 린달균형(Lindahl equilibrium)에 의해 적정공공재를 생산할 때, 갑과 을의 비용분담 비율은? (단, Ga, Gb는 각각 갑과 을의 공공재 수요량이다.)",

{ id:"jj2018-31", subject:"재정학", year:2018, no:31, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"A와 B 두 사람만이 존재하는 경제에서, 비경합적이고 배제불가능한 연극공연에 대한 A의 효용함수는 UA = 100 + 20D − D²이고 B의 효용함수는 UB = 20 + 12D − 2D²으로 주어져 있다. 연극공연의 한계비용이 MC = 2D라고 할 때 사회적으로 바람직한 최적 연극공연은 몇 회인가? (단, D는 연극공연 횟수이다.)",

{ id:"jj2018-32", subject:"재정학", year:2018, no:32, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공공투자가 유발하는 편익과 비용에 관한 설명으로 옳지 않은 것은?",
  choices:["실질적 편익은 공공사업의 최종소비자가 얻는 편익으로, 사회후생 증가에 기여한다.","화폐적 편익과 비용은 공공사업에 의해 야기되는 상대가격의 변화 때문에 발생하며, 사회전체의 후생은 불변이다.","무형적 비용은 외부불경제에 의해 발생한다.","유형적 편익이 무형적 편익보다 작은 공공사업이 존재한다.","무형적 편익과 비용은 시장에서 파악되지 않기 때문에 공공투자의 시행 여부를 판단함에 있어 고려하지 않아도 된다."],

{ id:"jj2018-33", subject:"재정학", year:2018, no:33, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"투표제도에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 과반수제에서는 '투표의 역설' 현상이 나타날 수 있다.\nㄴ. 보다방식(Borda count)에서는 선택대상 간 연관성이 없다.\nㄷ. 선택대상에 대한 선호의 강도는 점수투표제에서 직접 표시될 수 있다.\nㄹ. 전략적 행동이 없다면 점수투표제가 선택대상에 대한 선호의 강도를 가장 잘 반영한다.\nㅁ. 점수투표제는 개인의 선호를 서수로 나타낸다.",
  choices:["ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㅁ","ㄴ, ㄹ, ㅁ","ㄷ, ㄹ, ㅁ"],
  answer:2, status:"clear", note:"" },
{ id:"jj2018-34", subject:"재정학", year:2018, no:34, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"다음 그림은 어떤 재화에 대한 우하향하는 수요곡선과 수평인 공급곡선을 나타내고 있다. 이 재화에 정부가 상품 한 단위당 k만큼의 보조금을 지급하여 보조금 이후의 공급곡선은 S'으로 나타나고 있다. 이러한 보조금이 가지는 초과부담은 무엇으로 표시되는가?\n\n[그림] 수요곡선 D는 세로축 G에서 시작해 우하향. 공급곡선 S는 가격 P에서 수평(세로축 A, 수요곡선과 B에서 교차, 수량 Q1), 보조금 후 공급곡선 S'은 가격 (1−k)P에서 수평(세로축 D, 수요곡선과 F에서 교차, 수량 Q2). C는 S 위에서 Q2 바로 위의 점, E는 S' 위에서 Q1 바로 아래의 점.",
  choices:["초과부담은 0이다.","삼각형 BCF","삼각형 BEF","삼각형 GBA","사각형 ABFD"],
  answer:2, status:"clear", note:"" },
{ id:"jj2018-35", subject:"재정학", year:2018, no:35, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"공동의 목초지에 갑과 을이 각각 100마리의 양을 방목하기로 합의하면 갑과 을의 이득은 각각 10원이다. 두 사람 모두 합의를 어기고 100마리 이상을 방목하면 갑과 을의 이득은 각각 0원이다. 만약 한 명은 합의를 지키고 다른 한 명이 합의를 어기면 어긴 사람의 이득은 11원, 합의를 지킨 사람의 이득은 −1원이다. 이러한 게임적 상황에서 정부가 합의를 어긴 사람에게 2원의 과태료를 부과할 때 발생될 결과는?",
  choices:["두 사람 모두 합의를 지킨다.","두 사람 모두 합의를 어긴다.","두 사람의 합의 준수 여부는 불확실하다.","갑은 반드시 합의를 지키지만 을은 합의를 어긴다.","갑은 반드시 합의를 어기지만 을은 합의를 지킨다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2018-36", subject:"재정학", year:2018, no:36, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"정부 지출증대를 위한 공채발행이 경제에 미치는 영향에 관한 설명으로 옳은 것은?",
  choices:["공채를 전액 중앙은행이 인수할 경우, 경기가 과열된 상태에서는 인플레이션을 억제하는 효과가 있다.","공채를 전액 중앙은행이 인수할 경우, 화폐공급량이 감소하기 때문에 유효수요 증대효과는 없다.","공채가 전액 시중에서 소화될 경우, 이자율이 상승하고, 민간투자가 억제되는 현상을 구축효과라고 한다.","공채의 잔액이 증가함에 따라 민간의 소비지출이 감소하는 현상을 러너효과라고 한다.","공채가 전액 시중에서 소화될 경우, 중앙은행이 인수할 경우보다 유효수요의 증대효과가 크다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2018-37", subject:"재정학", year:2018, no:37, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"지방 분권화에 관한 설명으로 옳지 않은 것은?",
  choices:["분권화로 지역들이 차별성을 가지고, 여러 지역 중에서 투표자가 자신이 원하는 곳을 선택할 수 있다면 결과적으로 후생이 증가될 수 있다.","분권화로 지방정부는 각 지역의 특성에 부합하는 다양한 정책들을 시도할 수 있다.","한 지역의 공공재가 다른 지역에도 영향을 주는 외부성을 가지고 있는 경우 분권화는 효율적인 공공재 배분을 가능하게 한다.","조세행정에는 규모의 경제가 존재하기 때문에 국세 행정을 이용하여 징수하고 이후 지방으로 배분하는 형태로 조세행정과 재정배분이 이루어지기도 한다.","지방자치단체장은 선거를 통해 선출되기 때문에 지역 주민들의 수요에 민감하게 반응한다."],
  answer:3, status:"clear", note:"" },

{ id:"jj2018-40", subject:"재정학", year:2018, no:40, law:"재정학", unit:"7편 재정학의 기타주제", kind:"calc",

  stem:"선형누진세와 비선형누진세에 관한 설명으로 옳지 않은 것은?",
  choices:["한계세율이 평균세율보다 높다.","비선형누진세는 한계세율과 평균세율이 동시에 변화한다.","선형누진세는 한계세율과 평균세율이 변화하지 않는다.","선형누진세는 비선형누진세에 비해 상대적으로 고소득층에 유리할 수도 있다.","선형누진세는 면세점을 두고 있다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2019-3", subject:"재정학", year:2019, no:3, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"최적물품세에 관한 설명으로 옳지 않은 것은?",
  choices:["램지규칙은 주어진 조세수입 목표를 달성하는 가운데 초과부담을 최소화할 때 실현된다.","램지규칙에 따른 최적의 세율구조는 보상수요곡선을 전제로 한다.","콜렛-헤이그(Corlett-Hague) 규칙은 해당 재화 수요의 가격탄력성에 따라 차등적인 물품세를 부과해야 성립한다.","역탄력성 규칙은 역진성을 초래하는 한계가 있다.","램지규칙은 재화 간 조세수입의 한계초과부담을 일치시키는 과정에서 도출된다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2019-4", subject:"재정학", year:2019, no:4, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"조세의 초과부담에 관한 설명으로 옳지 않은 것은?",
  choices:["조세부과로 상대가격이 변화하고, 이로 인해 민간의 의사결정이 영향을 받음으로써 발생한다.","민간부문의 의사결정에 아무런 영향을 미치지 않는 조세를 중립세라 한다.","세율이 높으면 초과부담이 줄어들지만 조세수입은 늘어난다.","수요의 가격탄력성이 클수록 초과부담은 커진다.","초과부담은 대체효과에 의해 발생하기 때문에 보상수요곡선으로 크기를 측정해야 한다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2019-5", subject:"재정학", year:2019, no:5, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"소득세제에 관한 설명으로 옳지 않은 것은?",
  choices:["선형누진세의 경우 한계세율은 소득수준에 관계없이 항상 일정하다.","세액공제는 한계세율을 인상시킨다.","소득공제는 저소득층보다 고소득층에게 유리하다.","소득공제는 재화의 상대가격 변화를 초래할 수 있다.","소득획득에 소요되는 비용을 공제하면 수평적 공평성이 증진될 수 있다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2019-6", subject:"재정학", year:2019, no:6, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"calc",
  stem:"수요곡선과 공급곡선에서 생산물 1단위당 300원의 세금이 부과되었다. 300원에서 소비자가 부담하는 세금의 크기는? (단, 수요곡선: P = 6,000 - 4Q, 공급곡선: P = 2Q, P: 가격, Q: 수량)",
  choices:["50원","100원","200원","250원","300원"],
  answer:3, status:"clear", note:"" },
{ id:"jj2019-7", subject:"재정학", year:2019, no:7, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"알링햄-센드모(M. Allingham and A. Sandmo)의 탈세모형에 관한 설명으로 옳지 않은 것은?",
  choices:["세율 인상에 따른 대체효과는 탈루소득을 줄이는 방향으로 작용한다.","탈세행위는 불법성을 특징으로 한다는 점에서 조세회피와 구별된다.","탈세 방지 수단으로 적발 확률의 증가와 벌금 인상을 고려할 때, 행정비용 측면에서는 높은 벌금의 부과가 바람직하다.","절대위험기피도 체감의 특성을 가진 납세자를 가정한다.","탈세행위는 수평적 공평성뿐 아니라 수직적 공평성에도 부정적 효과를 낳는다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2019-8", subject:"재정학", year:2019, no:8, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"공평과세에 관한 설명으로 옳지 않은 것은?",
  choices:["편익원칙은 빅셀(K. Wicksell), 린달(E. Lindahl) 등에 의해 발전되었는데, 이들은 조세를 자발적 교환에 대한 대가로 파악한다.","수수료, 통행료, 사용료는 편익원칙에 따른 과세의 예이다.","능력원칙에 따르면 상이한 경제적 능력을 가진 사람에게는 상이한 크기의 조세를 부과해야 한다.","밀(J. Mill)은 공평과세의 원칙으로 동등희생설을 주장한다.","사뮤엘슨(P. Samuelson)에 의하면 동등절대희생의 원칙은 한계효용의 소득탄력성이 1보다 작은 경우에 누진과세를 정당화한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2019-9", subject:"재정학", year:2019, no:9, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"부(-)의 소득세제에서, 한계세율을 t, 모든 사람에게 최소한으로 보장되는 소득인 기초수당을 m이라고 할 때, 보조금은 S = m-tE (단, E는 스스로 번 소득)이다. 부의 소득세에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 누진적 소득세제의 논리적 연장이다.\nㄴ. 소득세의 납부과정에서 정부로부터 보조를 받는 형식을 취한다.\nㄷ. 어떤 사람이 스스로 벌어들인 소득이 m/t이면, 보조금은 0(zero)이다.\nㄹ. 재분배효과는 m이 클수록 커진다.\nㅁ. t가 클수록 근로의욕이 커진다.",
  choices:["ㄷ, ㅁ","ㄱ, ㄴ, ㄷ","ㄴ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],
  answer:4, status:"clear", note:"" },
{ id:"jj2019-10", subject:"재정학", year:2019, no:10, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공공경비팽창에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 바그너(A. Wagner)의 법칙이란 1인당 국민소득이 증가할 때 공공부문의 상대적 크기가 증가하는 것을 말한다.\nㄴ. 피코크-와이즈만(A. Peacock and J. Wiseman)은 사회적 격변기에 정부지출 수준이 급속히 높아져 일정기간 유지되면, 추세선 자체가 상방으로 이동하게 되는데 이를 전위효과(displacement effect)라고 불렀다.\nㄷ. 보몰(W. Baumol)은 노동집약적인 공공부문이 민간부문보다 생산성 향상이 더디게 일어나기 때문에 경비가 팽창하게 된다고 보았다.\nㄹ. 부캐넌(J. Buchanan)은 특정 공공지출의 편익은 수혜자들에게 직접적으로 인식되는 반면, 공공서비스의 공급비용은 모든 사회구성원들에게 조세형태로 분산되기 때문에 공공서비스 공급비용을 과소평가한다고 설명하였다.",
  choices:["ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"jj2019-11", subject:"재정학", year:2019, no:11, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"근로소득세의 초과부담에 관한 설명으로 옳지 않은 것은?",
  choices:["초과부담은 세율이 높을수록 커지며, 노동공급의 탄력성이 낮을수록 커진다.","개인에 대한 근로소득세의 초과부담은 대체효과가 클수록 증가한다.","초과부담 측정은 임금률의 변화가 초래하는 소득효과를 제외한 보상된 노동공급곡선을 이용해야 한다.","대체효과에 따른 노동공급 변화가 초래하는 후생 순손실을 의미한다.","노동공급량 감소에 따른 노동공급자의 잉여 감소분에서 조세수입을 제외한 것이다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2019-12", subject:"재정학", year:2019, no:12, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"조세부과 기준으로서 경제적 능력의 평가에 관한 설명으로 옳지 않은 것은?",
  choices:["소득을 평가기준으로 할 경우, 여가와 노동에 대한 개인의 선호를 반영하지 못하는 한계가 있다.","소비를 평가기준으로 할 경우, 누진과세가 불가능하다.","소득을 평가기준으로 할 경우, 시장을 통하지 않고 취득된 귀속소득은 과세대상에 포함하기 어렵다.","재산을 평가기준으로 할 경우, 재산 가치 평가의 어려움이 있다.","소득을 평가기준으로 할 경우, 인플레이션 발생 시 실질적인 조세부담이 증가한다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2019-13", subject:"재정학", year:2019, no:13, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"조세의 공평성에 관한 설명으로 옳지 않은 것은?",
  choices:["동일한 경제적 능력 소유자의 조세부담은 같아야 한다.","수평적 공평성은 어떤 사람들을 똑같은 능력의 소유자로 보아야 하는 문제가 있을 수 있다.","납세 이후에도 개인의 효용수준의 순서는 변하지 않아야 한다.","소득세율의 누진성 강화는 수직적 공평성을 저해한다.","포괄적 소득세는 수평적 공평성 제고를 위해 바람직하다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2019-14", subject:"재정학", year:2019, no:14, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"누진적 조세제도에 관한 설명으로 옳지 않은 것은?",
  choices:["누진세율구조로 조세제도가 복잡해질 경우, 제도에 허점이 발생하여 수직적 공평성이 저해될 수 있다.","누진세율구조는 경제적 활력을 줄여 효율성에 부정적 영향을 끼칠 수 있다.","누진세를 도입할 경우, 두 과세기간의 평균소득이 동일한 자영업자와 근로소득자 사이에 수평적 공평성을 저해할 수 있다.","편익원칙에 따를 때, 편익의 소득탄력성이 1보다 작을 경우 누진세의 도입은 공평하다.","누진세율구조는 가처분 소득의 평준화를 통해 수직적 불평등을 완화할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2019-15", subject:"재정학", year:2019, no:15, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라의 근로장려세제에 관한 설명으로 옳지 않은 것은?",
  choices:["기초생활보장 등 각종 복지지원에서 제외되는 저소득근로자에게 생계비 등을 보조해 주는 제도이다.","근로장려금은 가구 구성과 소득 수준에 따라 달라진다.","소득수준이 높은 가구일수록 소득 1원 증가에 따른 가처분소득 증가분은 줄어드는 방식을 취한다.","근로빈곤층의 노동공급에 미치는 영향을 최소화하면서 생계안정을 지원하는 제도이다.","개인의 노동공급에 미치는 영향을 분석하면 소득효과 없이 대체효과가 존재하여 노동공급은 소폭 줄어든다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2019-16", subject:"재정학", year:2019, no:16, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"조세와 기업의 투자에 관한 설명으로 옳지 않은 것은?",
  choices:["신고전파 투자이론에 따르면 자본의 사용자 비용이 적을수록 투자가 증가한다.","자본스톡의 사용자비용탄력성이 클수록 조세정책이 기업의 투자에 미치는 영향이 크다.","토빈의 q이론에 따를 경우, 자본의 대체비용이 클수록 투자가 줄어든다.","자본의 사용자 비용과 관련된 한계실효세율 측정은 세전수익률을 세후수익률로 나누어서 구할 수 있다.","투자를 촉진하기 위한 방법으로는 가속상각 제도의 채택, 투자세액공제 허용 등이 있다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2019-17", subject:"재정학", year:2019, no:17, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"공채에 관한 설명으로 옳지 않은 것은?",
  choices:["고전파경제학에서는 균형재정을 바람직한 것으로 보았기 때문에 공채발행을 부정적으로 인식하고 있다.","케인스경제학에서는 적자재정에 따른 공채발행을 보다 적극적으로 수용하고 있다.","재원조달 측면에서 볼 때 '리카도(D. Ricardo)의 대등정리'가 적용되면 조세에 비해 공채발행으로 더 큰 총수요증가를 기대할 수 있다.","'이용시 지불원칙(pay-as-you-use principle)'에 의하면 정부의 투자지출에는 공채발행이 바람직하다.","공채발행은 그 목적과 달리 결과적으로 소득재분배를 유발할 가능성이 있다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2019-18", subject:"재정학", year:2019, no:18, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공공요금과 관련된 설명으로 옳지 않은 것은?",
  choices:["일반적으로 공공부문이 생산하는 재화나 서비스의 한계비용가격설정은 효율적인 결과를 초래할 수 없다.","전기, 수도 등 사용재의 성격을 갖는 재화나 서비스의 경우에는 조세보다 공공요금을 부과함으로써 자원배분의 효율성을 높일 수 있다.","규모의 경제가 작용하는 재화나 서비스의 경우에는 한계비용에 따라 가격을 설정한다면 손실이 발생할 수 있다.","램지가격설정방식은 효율성을 달성할 수 있으나 분배상 문제를 일으킬 수 있다.","공공요금 설정에서 분배적 측면을 고려한 낮은 가격책정은 정부의 재정부담을 증가시킬 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2019-19", subject:"재정학", year:2019, no:19, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"지방분권에 관한 설명으로 옳지 않은 것은?",
  choices:["정부부문의 총지출 중 중앙정부의 직접적 지출이 차지하는 비율을 중앙집권화율이라 하며, 분권 수준을 파악하는 지표로 사용한다.","오우츠(W. Oates)는 공공재 공급비용이 동일하다면, 지방공공재는 중앙정부보다 지방정부가 공급하는 것이 효율적일 수 있다고 주장하였다.","오우츠의 분권화 정리는 공공재 공급에 있어서 규모의 경제가 있고, 인접 지역으로의 외부성이 없는 경우에 성립한다.","티부(C. Tiebout)는 개인들의 지역 간 이동이 자유롭다면, 개인들이 선호하는 지방정부를 선택하는 '발에 의한 투표'를 주장하였다.","티부모형은 지방정부의 재원은 재산세로 충당하는 것을 상정하고 있다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2019-20", subject:"재정학", year:2019, no:20, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"법인세에 관한 설명으로 옳지 않은 것은?",
  choices:["우리나라 법인세 제도에서는 기업의 부채가 클수록 법인세 부담이 줄어든다.","모딜리아니-밀러(F. Modigliani and M. Miller)의 제1명제는 기업 가치 극대화를 위한 최적 자본구조가 존재하지 않는다는 것이다.","우리나라의 현행 법인세 법정 최고 세율은 25%이다.","인플레이션에 의해 감가상각공제의 실질가치가 떨어지면 법인세 부담이 가벼워진다.","소득세와 법인세의 통합은 효율성뿐 아니라 공평성의 차원에서도 논의된다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2019-21", subject:"재정학", year:2019, no:21, law:"재정학", unit:"1편 재정학의 개요", kind:"concept",
  stem:"자원배분의 효율성에 관한 설명으로 옳지 않은 것은?",
  choices:["어떤 배분상태가 효율적이기 위해서는 그 상태로부터 다른 상태로 옮겨갈 때 파레토 개선이 불가능해야 한다.","후생경제학의 제2정리에서는 시장이 완전경쟁이라면 자원은 효율적으로 배분됨을 보여주는데, 아담 스미스의 '보이지 않는 손'이 달성됨을 의미한다.","공공재는 그 특성상 가격을 설정할 수 없기 때문에 시장실패의 원인이 될 수 있다.","중립세(neutral tax)를 제외한 조세부과는 자원배분상 비효율을 초래할 수 있다.","도덕적 해이는 정보의 비대칭성으로 발생하는 현상이며, 자원배분 상 비효율을 초래할 수 있다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2019-22", subject:"재정학", year:2019, no:22, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"사회후생함수에 관한 설명으로 옳지 않은 것은? (단, n명으로 구성된 사회에서 개인 i의 후생은 wi, 사회후생은 W)",
  choices:["공리주의적 사회후생함수는 모든 사회구성원의 개인적 후생의 총합으로 나타내며 W=w1+...+wn 가 된다.","앳킨슨(A. Atkinson)의 확장된 공리주의 사회후생함수는 W=(1/α)Σ(i=1~n) wi^α 로 표현되는데, 이는 α가 1보다 작은 경우에는 개인후생의 합뿐만 아니라 분배에 의해서도 사회후생이 영향을 받는다는 것을 보여준다.","롤즈(J. Rawls)의 사회후생함수는 도덕적 가치관을 중시하는 규범적 규율을 반영하는데, 이를 표현하면 W=min{w1,...,wn}로 나타낼 수 있다.","평등주의적 사회후생함수는 개인의 후생수준이 높을수록 더 작은 가중치를 적용한다.","애로우(K. Arrow)는 합리적인 사회적 선호체계를 갖춘 사회후생함수가 존재함을 실증을 통해 입증했다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2019-23", subject:"재정학", year:2019, no:23, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"마을 주민이면 누구나 방목할 수 있는 공동의 목초지가 있다. 송아지의 구입 가격은 200,000이고, 1년 후에 팔 수 있다. 마을 전체의 이윤을 극대화시키는 방목 송아지 수(A)와 개별 주민 입장에서의 최적 방목 송아지 수(B)는? (단, 송아지의 1년 뒤 가격 P = 1,600,000 - 50,000Q, Q: 방목하는 송아지 수)",
  choices:["A: 12, B: 12","A: 13, B: 16","A: 14, B: 28","A: 15, B: 29","A: 16, B: 30"],
  answer:3, status:"clear", note:"" },
{ id:"jj2019-24", subject:"재정학", year:2019, no:24, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공기업에 관한 설명으로 옳은 것은?",
  choices:["비용체감산업의 경우 효율적 공급을 위해 규제를 해도 해당 민간 기업이 지속적으로 초과이윤을 얻기 때문에 공기업으로 운영해야 한다.","비용체감산업을 공기업으로 운영하고자 하는 경우 재정수입 확보가 주요 목적이다.","산업이 대규모인 경우 자원의 효율적 배분을 위해 공기업으로 운영해야 할 필요성이 있다.","공기업을 민영화하면 '주인-대리인 문제'는 사라진다.","공기업 민영화 요구의 경제학적 근거는 기존 비용체감산업의 성격이 변화된 데서 찾을 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2019-25", subject:"재정학", year:2019, no:25, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"4가구(가~라)가 있는 마을에서 강을 건너기 위한 다리를 건설하기로 합의하였다. (가)는 다리를 건널 필요가 없는 농가이고, (나)는 다리를 이용하여 강 건너 직장에 출퇴근하여 500의 총편익을 얻는다. 다리 이용에 따른 (다)의 총편익은 400+30M+20M³이고 (라)의 총편익은 300+70M+30M³이다. 이때 다리의 총건설비용은 3,850M+700이다. 다리의 적정 규모 M은? (단, M: 다리규모)",
  choices:["2","3","4","5","6"],
  answer:4, status:"clear", note:"" },
{ id:"jj2019-26", subject:"재정학", year:2019, no:26, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"공공재의 성격에 관한 설명으로 옳은 것은?",
  choices:["비경합성이란 소비자의 추가적인 소비에 따른 한계비용은 0(zero)이 됨을 의미한다.","순수 공공재는 배제성과 비경합성을 동시에 충족한다.","대부분 공공재는 순수 공공재로 볼 수 있으며, 시장이 성립하지 못한다.","클럽재는 배제성 적용이 불가능하다.","공공재의 소비자들은 자신의 수요를 정확하게 표출한다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2019-27", subject:"재정학", year:2019, no:27, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"갑, 을, 병 세 사람으로 구성된 사회에 공공재를 공급하고자 한다. 공공재의 총공급 비용은 TC=36Q이며, 갑, 을, 병 각각의 수요함수는 Q=30-P, Q=35-P/2, Q=40-P/4이다. 공공재 공급비용을 각자 균등하게 부담할 때, 꽁도세(Condorcet) 방식에 의한 공공재 공급량은? (단, Q: 수량, P: 가격)",
  choices:["29","30","32","35","37"],
  answer:1, status:"clear", note:"" },
{ id:"jj2019-28", subject:"재정학", year:2019, no:28, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"공공재의 수요표출 메커니즘에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 수요표출 메커니즘의 궁극적 목적은 파레토 효율적 자원배분을 실현하기 위함이다.\nㄴ. 클라크 조세(Clarke tax)의 핵심은 개인이 부담할 세금의 크기와 표출한 선호 간 독립성을 확보하는 것이다.\nㄷ. 클라크 조세에서 개인은 자신의 진정한 선호를 표출하는 것이 우월전략이다.\nㄹ. 클라크 조세에서 어떤 소비자가 부담할 세금은 자신이 표출한 선호가 아니라 다른 소비자들이 표출한 선호에 의해 결정된다.",
  choices:["ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"jj2019-29", subject:"재정학", year:2019, no:29, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"관료제 모형에 관한 설명으로 옳은 것은?",
  choices:["니스카넨(W. Niskanen) 모형에서 관료제 조직은 가격순응자와 같이 행동한다.","니스카넨 모형과 미그-빌레인저(Migue-Belanger) 모형에서는 공익추구를 기본 가정으로 한다.","니스카넨 모형에서 관료는 예산의 한계편익과 한계비용이 일치하는 수준까지 예산규모를 늘린다.","다른 조건이 모두 동일할 때, 니스카넨 모형에 따른 공공재의 초과공급은 미그-빌레인저 모형에 따를 때의 초과공급보다 적다.","니스카넨 모형에서 관료제에 대응하는 방안으로 생산과 공급활동은 민간기업에 맡기고 정부는 비용만 부담하는 방법이 있다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2019-30", subject:"재정학", year:2019, no:30, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"투표자들의 선호 강도를 반영할 수 있는 제도를 모두 고른 것은?\n\nㄱ. 거부권투표제    ㄴ. 보다(Borda)투표제    ㄷ. 점수투표제\nㄹ. 투표거래(logrolling)    ㅁ. 만장일치제",
  choices:["ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄴ, ㄹ, ㅁ","ㄷ, ㄹ, ㅁ"],
  answer:3, status:"clear", note:"" },
{ id:"jj2019-31", subject:"재정학", year:2019, no:31, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"대기오염을 유발하는 경유 차량의 운행으로 인한 외부성에 관한 설명으로 옳은 것은?",
  choices:["경유 사용으로 인해 대기오염이 증가하여 국민건강을 해친다면, 이는 외부경제효과이다.","경유 소비에 대해 토빈세(Tobin tax)를 부과하면 대기오염을 감축시킬 수 있다.","대기오염을 유발하기 때문에 경유 소비는 사회적 적정 수준보다 과소하다.","외부효과를 상쇄하는 조세의 크기는 바람직한 경유 소비량 수준에서의 한계피해액만큼이어야 한다.","조세부과를 통해 외부효과를 내부화할 수 있지만, 자원배분의 효율을 달성하기 어렵다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2019-32", subject:"재정학", year:2019, no:32, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"강 상류에서 우유를 생산하는 목장이 있다. 이 목장의 우유 1ℓ의 한계비용은 MC=100+Q이고, 수요곡선은 P=1,300-10Q이다. 목장의 축산폐수가 하류지역에 피해를 유발하는데, 그 한계피해는 MD=Q이다. 경쟁적인 우유시장에서 정부가 교정조세(corrective tax)를 부과할 경우 옳지 않은 것은? (단, P: 가격, Q: 수량)",
  choices:["사회적 최적생산량은 100ℓ이다.","사회적 최적생산량 수준에서의 가격은 300이다.","사회적 최적생산량 수준을 달성하기 위해서는 단위당 100의 교정조세를 부과해야 한다.","교정조세를 부과하지 않으면, 과다 생산될 여지가 있다.","교정조세를 부과할 때 기업의 이윤극대화 생산량은 1,200/11 ℓ이다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2019-33", subject:"재정학", year:2019, no:33, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"강 상류에서 가축을 기르는 축산농가와 하류에서 물고기를 잡는 어민들 간에 상류의 가축분뇨 방류로 인한 분쟁이 발생하였다. 다음 중 외부성을 해결하는 타당한 방안을 모두 고른 것은?\n\nㄱ. 강물에 대한 소유권을 설정한다.\nㄴ. 오염배출권을 발행하여 거래한다.\nㄷ. 축산농가에 대해 환경세를 부과한다.\nㄹ. 가축분뇨 방류로 인한 수질 오염 허용치를 설정한다.",
  choices:["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"jj2019-34", subject:"재정학", year:2019, no:34, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"외부편익이 존재하는 경우를 나타낸 아래 그림에 관한 설명으로 옳은 것의 개수는? (단, D: 수요곡선, PMB: 사적 한계편익, S: 공급곡선, PMC: 사적 한계비용, MEB: 한계외부편익, SMB: 사회적 한계편익)\n\n[그림] 가로축 Q(수량), 세로축 P(가격). 공급곡선 S(=PMC)는 수평선. 수요곡선 D(=PMB)는 우하향. SMB(=PMB+MEB)는 D보다 위쪽에서 우하향하며 D와 평행하지 않고 더 가파르게 시작해 D와 멀어진다. S와 D가 만나는 점이 B(생산량 Q1), S와 SMB가 만나는 점이 C(생산량 Qe). A는 SMB 위에서 Q1 수직선과 만나는 점. F는 MEB(D와 SMB 사이의 수직 거리)를 Q1에서 표시한 점.\n\no 이 그림은 재화의 소비에 외부편익이 존재하는 경우를 나타낸 것이다.\no 시장균형은 PMB=PMC가 성립하는 점 B에서 달성되는데, 이때의 생산량은 SMB>PMC가 되므로 사회적으로는 과소하다.\no 시장균형에서 발생하는 사회적 후생비용의 크기는 삼각형 ABC에 해당한다.\no 시장균형에서는 생산량을 변화시키려는 경쟁적 힘이 작용한다.\no 생산량을 Qe로 증가시킴에 따른 사회적 순이득(net gain)은 삼각형 ABC와 같다.",
  choices:["1개","2개","3개","4개","5개"],
  answer:4, status:"clear", note:"" },
{ id:"jj2019-35", subject:"재정학", year:2019, no:35, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"소득분배에 관한 설명으로 옳지 않은 것은?",
  choices:["상위 20%의 소득이 서로 같은 A, B국이 있을 때, A국의 10분위분배율이 1/2이고 B국의 5분위배율이 2라면, 하위 20%의 소득은 A국이 B국보다 크다.","지니계수는 값이 클수록 소득분배가 불평등함을 의미한다.","사회무차별곡선이 원점에 대해 볼록할수록, 해당 사회에 대한 앳킨슨 지수(Atkinson index)는 높게 나타난다.","조세 체계의 누진성을 강화하면 5분위배율은 하락한다.","소득이 완벽히 평준화된 사회에서 로렌츠곡선은 대각선이 된다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2019-36", subject:"재정학", year:2019, no:36, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"소득재분배정책에 관한 설명으로 옳지 않은 것은?",
  choices:["우리나라의 4대 사회보험은 국민연금, 건강보험, 고용보험, 산재보험이다.","소득세의 누진세율제도는 소득 계층 간 가처분소득의 격차를 줄이는 역할을 한다.","사회보험제도는 보험료를 납부한 사람만, 그리고 공공부조 프로그램은 세금을 납부한 사람에게만 혜택을 준다.","근로장려세제는 근로빈곤층(working poor) 지원을 위한 제도이다.","국민기초생활보장제도는 근로능력의 유무에 관계없이 월소득이 최저생계비에 미치지 못할 경우 정부가 보조해 주는 제도이다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2019-37", subject:"재정학", year:2019, no:37, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라의 국민연금제도에 관한 설명으로 옳은 것은?",
  choices:["우리나라의 국민연금제도는 국내에 거주하는 16세 이상 60세 미만의 국민이면 가입이 가능하다.","공무원, 군인, 사립학교 교원 등은 별도의 연금제도에 가입하지만, 본인이 원하면 국민연금에도 동시 가입이 가능하다.","우리나라 국민연금은 적립방식을 취하는데, 납부된 보험료로 기금을 조성하고 기금과 운용수익으로 연금을 지급한다.","사업장 가입자의 연금보험료 중 기여금은 가입자 본인이, 부담금은 사용자가 부담하는데, 그 금액은 각각 기준소득월액의 5.0%이다.","국민연금제도 도입에 따른 은퇴효과와 상속효과는 자발적인 저축을 감소시킨다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2019-38", subject:"재정학", year:2019, no:38, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"정부가 사회보험을 도입하는 근거로 옳지 않은 것은?",
  choices:["역선택 문제 때문","도덕적 해이를 방지하기 위해","온정주의(paternalism) 때문","외부효과를 해결하기 위해","소득재분배를 위해"],
  answer:2, status:"clear", note:"" },
{ id:"jj2019-39", subject:"재정학", year:2019, no:39, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"경제안정을 위한 재정의 총수요관리에 관한 설명으로 옳지 않은 것은?",
  choices:["총수요관리를 위한 재정정책의 유형으로는 자동안정장치(built-in stabilizer), 공식에 의한 신축성(formular flexibility), 재량적 재정정책(discretionary fiscal policy) 등이 있다.","자동안정장치의 대표적인 정책수단으로는 누진세제도와 실업보험제도 등이 있다.","자동안정장치는 시차문제에서 재량적 재정정책에 비해 더 나은 정책수단이라 할 수 있다.","재량적 재정정책은 자동안정장치에 비해 총수요관리에 보다 능동적으로 대처할 수 있다.","자동안정장치는 불황기일 경우 재정긴축, 호황기일 경우 재정확장으로 작동된다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2019-40", subject:"재정학", year:2019, no:40, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"비용편익분석에 관한 설명으로 옳은 것은?",
  choices:["비용편익분석의 이론적 기반은 파레토 보상기준이다.","현재가치법을 사용할 경우, 할인율이 낮을수록 장기사업보다 단기사업이 유리하다.","현재가치법은 총편익의 현재가치를 기준으로 사업의 우선순위를 결정한다.","편익-비용비율법의 경우 그 값이 작을수록 우선순위가 올라간다.","내부수익률은 순편익의 현재가치를 1로 만드는 할인율이다."],
  answer:1, status:"clear", note:"" },

{ id:"jj2020-1", subject:"재정학", year:2020, no:1, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"조세의 초과부담에 관한 설명으로 옳은 것은?",
  choices:["다른 조건이 일정하면, 대체재가 많은 재화에 과세하면 그렇지 않은 경우에 비해 초과부담이 작다.","조세수입에서 후생감소분을 차감한 것이다.","가격변화에 둔감한 재화에 대한 과세는 상대적으로 초과부담을 작게 발생시킨다.","정액세(lump-sum tax) 부과는 소득효과가 없기 때문에 초과부담을 발생시키지 않는다.","두 재화가 완전보완재인 경우 그 중 한 재화에 대한 과세는 초과부담을 발생시킨다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2020-2", subject:"재정학", year:2020, no:2, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"조세에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 동등한 경제 상황에 있는 사람들에게 동등하게 과세하여야 한다는 것이 수직적 공평이며, 부자에게는 더 많은 세금을 부과하여야 한다는 것이 수평적 공평이라 한다.\nㄴ. 조세의 중립성은 조세가 자원배분의 효율성을 왜곡시키지 않는 것을 의미하며, 조세의 간편성은 납세비용이나 조세행정의 부담을 줄이는 것을 의미한다.\nㄷ. 조세부담의 귀착이란 법률상 납세의무자가 조세부담의 일부를 거래 상대방에게 일시적으로 이전하는 것을 말하며, 최종적으로 누가 조세를 부담할 것인가를 나타내는 것이 조세부담의 전가이다.\nㄹ. 인두세는 단기적으로 대체효과가 발생하지 않는다는 점에서 왜곡이 없는 조세이지만, 소득에 대해 역진적이기 때문에 공평하다고 말할 수 없다.",
  choices:["ㄴ","ㄷ","ㄹ","ㄱ, ㄷ","ㄴ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"jj2020-3", subject:"재정학", year:2020, no:3, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"개인소득세는 누진세이고, 과세 단위는 개인단위 과세와 부부합산 과세가 있다. 이러한 과세 단위가 가지는 특징에 관한 설명으로 옳지 않은 것은?",
  choices:["개인단위 과세는 각 납세자의 지불능력을 잘 반영하는 특징을 가지고 있다.","부부합산 과세는 가족이 경제활동의 기본 단위라는 인식에 기반하고 있다.","부부합산 과세의 경우, 주소득원과 그 배우자가 각각 직면한 한계세율은 동일하다.","개인단위 과세의 경우, 주소득원과 그 배우자가 각각 직면한 한계세율은 상이하다.","비탄력적인 부문에 높은 세율을 부과한다는 램지원칙에 개인단위 과세보다 부부합산 과세가 더 잘 부합한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2020-4", subject:"재정학", year:2020, no:4, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"소득세 누진구조에 대한 에지워스(F. Edgeworth) 최적분배모형에서는 다음과 같은 가정을 하였다. 이 모형에 관한 해석으로 옳지 않은 것은?\n\n가정 1: 주어진 세수를 충족시키면서 개인들의 효용의 합을 극대화하는 형태로 최적 소득세를 결정한다.\n가정 2: 개인들은 자신의 소득에만 의존하는 동일한 효용함수를 가지며, 효용함수는 한계효용 체감의 특성을 보여주고 있다.\n가정 3: 사회 전체의 가용한 소득은 고정되어 있다.",
  choices:["가정 1은 공리주의적인 사회후생함수를 가정하였음을 의미한다.","가정 2는 이타적인 효용함수를 배제하고 있음을 의미한다.","가정 3은 분배상태가 변화할 때 총소득의 크기가 달라질 수 있다는 점에서 비현실적이라는 비판을 받고 있다.","가장 높은 소득자로부터 세금을 거두어 가장 낮은 소득자에게 재분배하는 경우 사회후생은 증가하게 된다.","가정 2로 인해 최적 소득세는 모든 사회 구성원의 소득 균등화까지 이르지는 못한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2020-5", subject:"재정학", year:2020, no:5, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"조세의 법적 귀착과 경제적 귀착이 일치하는 경우는?",
  choices:["수요곡선은 우상향하고 공급곡선은 우하향할 때, 소비자에게 과세하는 경우","수요곡선은 우하향하고 공급곡선은 우상향할 때, 생산자에게 과세하는 경우","수요곡선은 수직이고 공급곡선은 우상향할 때, 소비자에게 과세하는 경우","수요 및 공급의 탄력성이 모두 단위탄력적일 때, 생산자에게 과세하는 경우","수요곡선은 우하향하고 공급곡선이 수평일 때, 생산자에게 과세하는 경우"],
  answer:3, status:"clear", note:"" },
{ id:"jj2020-6", subject:"재정학", year:2020, no:6, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"일반적으로 조세는 시장의 자원배분을 왜곡하여 초과부담을 발생시킨다. 다음 중 조세의 초과부담이 발생하지 않을 상황을 모두 고른 것은?\n\nㄱ. 고가부동산 거래에 고율 과세하는 경우\nㄴ. 부유층이 주로 소비하는 재화에 10%의 소비세를 부과하는 경우\nㄷ. 대기오염을 발생시키는 제품의 사회적 최적생산수준에서 한계환경피해비용과 세율이 같아지도록 과세하는 경우\nㄹ. 공급은 완전비탄력적이고 수요는 완전탄력적일 때, 생산자에게 과세하는 경우",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"jj2020-7", subject:"재정학", year:2020, no:7, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"래퍼곡선(Laffer curve)에 관한 설명으로 옳은 것은?",
  choices:["세율을 높임에 따라 조세수입이 계속 증가한다는 것을 보여준다.","특정한 조세수입액에 대하여 한 개의 세율만 존재한다.","세율을 가로축에, 조세수입을 세로축에 두고 래퍼곡선을 그리면 단조증가하는 형태가 된다.","세율이 적정 수준보다 높아지는 경우에는 조세 수입이 감소한다.","조세의 효율성보다는 형평성과 관련된 논의이다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2020-8", subject:"재정학", year:2020, no:8, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"calc",
  stem:"다음은 순수독점의 형태로 운영되고 있는 시장의 수요함수이다.\nQ = 200 - 4P\n그리고 이 시장의 독점공급자인 A사의 총비용함수는 다음과 같다.\nTC = (1/4)Q² + 10Q + 75\n정부가 소비자에게 단위당 10만큼의 물품세를 부과한다고 할 때, 다음 설명으로 옳은 것을 모두 고른 것은? (단, Q는 수량, P는 가격, TC는 총비용이다.)\n\nㄱ. 독점공급자는 조세부담을 전가시킬 수 있으므로 세금은 모두 소비자가 부담한다.\nㄴ. 독점공급자의 조세부담이 소비자의 조세부담보다 3배 더 크다.\nㄷ. 조세부담의 크기는 소비자와 공급자가 동일하다.\nㄹ. 독점공급자의 조세부담이 소비자의 조세부담의 1/3이다.\nㅁ. 동일한 세금을 소비자 대신 공급자에게 부과해도 조세부담 귀착의 결과는 같다.",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㅁ","ㄹ, ㅁ"],
  answer:4, status:"clear", note:"" },
{ id:"jj2020-9", subject:"재정학", year:2020, no:9, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"콜렛-헤이그(Corlett-Hague) 조세원칙에 관한 설명으로 옳지 않은 것은?",
  choices:["여가에 보완적인 상품과 서비스에 대한 과세를 통해 간접적으로 여가에 과세가 가능하다.","효율성 제고를 위해서는 여가에 대해서도 과세를 해야 한다.","여가에 대한 직접적인 과세가 불가능한 경우에 대한 원칙이다.","여가에 보완적인 상품에 대해 보다 높은 세율로 과세하는 것이 바람직하다.","동일한 세율을 적용하는 소득세가 세율의 차등을 두는 물품세보다 우월할 수 있다는 것을 의미한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2020-10", subject:"재정학", year:2020, no:10, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"A와 B, C와 D는 각각 부부이며, 두 가구의 소득과 소득세액은 다음의 표와 같다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?\n가구1: A 개인소득 1억원, 개인소득세액 4천만원 / B 개인소득 2천만원, 개인소득세액 1백만원 / 가구총소득 1억2천만원, 개인소득세액합계 4천1백만원, 가구합산시세액 4천9백만원\n가구2: C 개인소득 6천만원, 개인소득세액 1천2백만원 / D 개인소득 6천만원, 개인소득세액 1천2백만원 / 가구총소득 1억2천만원, 개인소득세액합계 2천4백만원, 가구합산시세액 4천9백만원\n\nㄱ. 가구합산을 하는 경우, 결혼세(marriage tax)의 문제가 발생한다.\nㄴ. 세율 체계의 누진성, 조세부담의 수평적 형평성, 결혼에 대한 중립성은 동시에 만족될 수 없다.\nㄷ. 결혼세의 문제는 세율체계의 누진성 때문에 발생한다.",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:5, status:"clear", note:"" },

{ id:"jj2020-13", subject:"재정학", year:2020, no:13, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",

{ id:"jj2020-14", subject:"재정학", year:2020, no:14, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"피셔(I. Fisher)의 시점간 자원배분 모형에서 이자소득세에 관한 설명으로 옳은 것은? (단, 현재소비와 미래소비는 둘 다 정상재이다.)",
  choices:["미래소비는 감소하게 된다.","저축은 반드시 감소한다.","현재소비에 대한 대체효과는 현재소비를 감소시킨다.","현재소비에 대한 소득효과는 현재소비를 증가시킨다.","이자소득세를 부과하면 현재 소비의 상대가격이 높아진다."],

{ id:"jj2020-15", subject:"재정학", year:2020, no:15, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"소득세에 관한 설명으로 옳은 것은?",
  choices:["여가가 정상재일 경우, 소득세 부과의 노동 공급에 대한 대체효과와 소득효과는 같은 방향으로 작용한다.","헤이그-사이먼즈(Haig-Simons)의 포괄적 소득 정의에 따르면, 소비도 소득세의 과세대상이 된다.","비례소득세는 수직적 공평성을 제고시킨다.","이자소득세를 부과할 경우, 소득효과는 저축에 대한 매력을 상대적으로 감소시켜 저축의욕을 떨어뜨린다.","수평적 공평성을 중시하는 누진적인 소득세에서는 과세기준이 되는 소득이 증가하면, 세금부담액은 증가하고 평균세율은 감소한다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2020-16", subject:"재정학", year:2020, no:16, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"최적과세론에 관한 설명으로 옳은 것은?",
  choices:["램지원칙에 의하면, 생활필수품은 수요가 가격에 대해서 비탄력적이기 때문에 상대적으로 높은 세율이 부과되게 된다.","램지원칙에 의하면, 수요의 가격 탄력성과 관계없이 모든 재화에 대해서 동일한 세율이 적용된다.","램지원칙에 의하면, 사치품은 수요가 가격에 대해서 탄력적이기 때문에 상대적으로 높은 세율이 부과된다.","스턴(N. Stern)의 최적선형누진세에 따르면, 공평성을 선호할수록 최고한계세율이 낮아진다.","램지원칙은 공평성의 제고를 위한 과세원칙이다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2020-17", subject:"재정학", year:2020, no:17, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"다음은 근로장려세제와 관련한 어떤 연구의 실증분석 결과이다.\n(가) 한부모 여성가구주(single mother)의 노동공급은 증가하였다.\n(나) 부부의 경우, 주소득자의 노동공급에는 거의 영향을 미치지 못했으나, 부소득자의 노동공급은 크게 감소하였다.\n(다) 근로장려세제 대상자들 전체의 노동공급에는 별다른 변화가 없었다.\n실증분석 결과에 대해 유추 가능한 다음의 해석으로 옳은 것을 모두 고른 것은?\n\nㄱ. (가)의 해석: 한부모 여성가구주들은 제도 도입 전에 주로 무노동계층이었거나, 점증구간에 속해 있었을 것이다.\nㄴ. (나)의 해석: 가구 주소득자의 노동공급의 임금탄력성은 매우 작은 반면, 부소득자의 임금탄력성은 클 것이다.\nㄷ. (다)의 해석: 당초의 의도와는 달리 정책도입 후 실제로 노동공급 증가량과 노동공급 감소량은 대체로 비슷하게 발생하였다.",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:5, status:"clear", note:"" },
{ id:"jj2020-18", subject:"재정학", year:2020, no:18, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"탈세와 절세에 관한 설명으로 옳지 않은 것은?",
  choices:["절세는 합법적으로 세금을 절약하는 것이다.","알링햄-샌드모(M. Allingham-A. Sandmo)에 따르면, 탈세의 편익은 세율로 표현될 수 있으며, 세율이 낮을수록 탈세는 늘어나게 된다.","절대위험기피도가 체감하는 개인은 세율이 오르면 탈루소득의 크기를 줄인다.","탈세로 인한 심리적 비용이 클수록 탈세 규모는 감소한다.","알링햄-샌드모에 따르면, 세율을 일정한 수준에서 유지하고 감사확률과 벌금을 적절하게 조절하여 탈세를 방지하는 것이 바람직하다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2020-19", subject:"재정학", year:2020, no:19, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"한 개인은 소득 M으로 사치재 X와 필수재 Y만을 소비한다. 이 사람의 예산선 기울기에 영향을 미치는 설명은?",

{ id:"jj2020-21", subject:"재정학", year:2020, no:21, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"기술적 외부성에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 자원 배분의 비효율성은 발생하지 않는다.\nㄴ. 화학공장이 강 상류에 폐수를 방출하였다.\nㄷ. 대규모 건설공사로 인한 건축자재 가격 상승으로 다른 건축업자가 피해를 입었다.\nㄹ. 양봉업이 인근 과수원의 생산에 영향을 미쳤다.",

{ id:"jj2020-22", subject:"재정학", year:2020, no:22, law:"재정학", unit:"7편 재정학의 기타주제", kind:"calc",
  stem:"다음은 고령화가 급격히 진행되면서 복지지출이 지속적으로 증가하는 한 국가의 최근 10년간 조세부담률과 국민부담률의 추이이다. 이에 관한 해석으로 옳은 것을 모두 고른 것은?\n(연도별 조세부담률 %: 2010=18.4, 2011=18.7, 2012=18.2, 2013=18.0, 2014=18.5, 2015=18.4, 2016=18.6, 2017=18.4, 2018=18.5, 2019=18.6)\n(연도별 국민부담률 %: 2010=24.2, 2011=24.8, 2012=24.7, 2013=25.7, 2014=26.4, 2015=27.5, 2016=28.3, 2017=29.0, 2018=29.4, 2019=30.1)\n\nㄱ. 사회보장성 기여금 부담이 매년 증가하고 있다.\nㄴ. 최근 10년간 GDP 증가율이 매년 1%로 표준화되었다고 할 때, 2014년 대비 2015년도의 조세의 세수탄력성(세수변화율/GDP변화율)은 1보다 크다.\nㄷ. 조세부담률이 전년도와 동일하다면, 조세수입은 경제성장률만큼 증가한다.",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:3, status:"clear", note:"" },
{ id:"jj2020-23", subject:"재정학", year:2020, no:23, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"자연독점 하의 공기업에서 공공요금 결정에 관한 설명으로 옳은 것은?",
  choices:["규모의 경제를 활용하여 평균비용을 낮추기 위해 하나가 아닌 여러 공기업에서 생산하는 것이 바람직하다.","민간기업이 생산하고 가격규제를 하지 않으면 사회적 최적생산량 달성이 가능하다.","이부가격제도(two-part tariff)를 도입하면, 생산량 자체는 효율적이다.","한계비용가격 설정을 사용하는 경우 해당 공기업의 경제적 이윤이 0이 된다.","평균비용가격 설정을 사용하는 경우 사회적 최적 생산량을 달성할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2020-24", subject:"재정학", year:2020, no:24, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"긍정적 외부성이 있는 재화의 수요함수가 Q=10-p이고, 한계편익함수는 Q=5-p이다. 한계생산비용이 7.5라면 사회적 최적 생산량은? (단, Q는 수량, p는 가격이다.)",
