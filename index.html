{ id:"hg2021-32", subject:"회계학개론", year:2021, no:32, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 정상개별원가계산을 사용하고 있으며, 제조간접원가는 직접노무시간을 기준으로 배부하고, 제조간접원가 배부차이는 전액 매출원가에 조정하고 있다. 당기의 직접재료매입액은 ￦21,000이고, 제조간접원가 배부차이는 ￦7,000(과소배부)이며, 제조간접원가 배부차이 조정 전 매출원가는 ￦90,000이다. 당기 재고자산 관련 자료는 다음과 같다.\n구분 / 직접재료 / 재공품 / 제품\n기초재고 ￦3,000 / ￦50,000 / ￦70,000\n기말재고 4,000 / 45,000 / 60,000\n직접노무원가가 기초원가(prime cost)의 60%인 경우, 당기에 실제 발생한 제조간접원가는?",
  choices:["￦18,000","￦25,000","￦30,000","￦32,000","￦37,000"],
  answer:4, status:"clear", note:"" },
{ id:"hg2021-33", subject:"회계학개론", year:2021, no:33, law:"회계학개론", unit:"불확실성하의사결정", kind:"calc",
  stem:"(주)세무는 기존에 생산중인 티셔츠 제품계열에 새로운 색상인 하늘색과 핑크색 중 한 가지 제품을 추가할 것을 고려중이다. 추가될 제품은 현재의 시설로 생산가능하지만, 각각 ￦200,000의 고정원가 증가가 요구된다. 두 제품의 판매단가는 ￦10, 단위당 변동원가는 ￦8으로 동일하다. 마케팅부서는 두 제품의 시장수요에 대해 다음과 같은 확률분포를 제공하였다.\n수요량 / 하늘색 기대확률 / 핑크색 기대확률\n50,000단위 0.0 / 0.1\n100,000 0.2 / 0.1\n200,000 0.2 / 0.2\n300,000 0.4 / 0.2\n400,000 0.2 / 0.4\n(주)세무의 기대영업이익을 최대화하는 관점에서 두 제품 중 상대적으로 유리한 제품과 유리한 영업이익차이 모두를 올바르게 나타낸 것은?",
  choices:["핑크색, ￦30,000","하늘색, ￦32,000","핑크색, ￦34,000","하늘색, ￦36,000","핑크색, ￦38,000"],

{ id:"hg2021-34", subject:"회계학개론", year:2021, no:34, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"올해 창업한 (주)세무는 처음으로 A광역시로부터 도로청소 특수차량 4대의 주문을 받았다. 이 차량은 주로 수작업을 통해 제작되며, 소요될 원가자료는 다음과 같다.\n○ 1대당 직접재료원가: ￦85,000 ○ 첫 번째 차량 생산 직접노무시간: 100시간 ○ 직접노무원가: 직접노무시간당 ￦1,000 ○ 제조간접원가: 직접노무시간당 ￦500\n위의 자료를 바탕으로 계산된 특수차량 4대에 대한 총제조원가는? (단, 직접노무시간은 80% 누적평균시간학습모형을 고려하여 계산한다.)",

  stem:"(주)세무는 온라인 교육을 확대하기 위해 새로운 온라인 강의설비를 ￦280,000에 구입할 것을 검토하고 있다. 이 설비는 향후 5년에 걸쳐서 강사료, 시설관리비 등에서 ￦330,000의 현금절감효과를 가진다. 현금절감액은 연중 균일하게 발생하지만, 연도별 현금흐름은 다음과 같이 균일하지 않다. 이러한 상황에서 설비투자에 대한 회수기간은?\n연도 1 2 3 4 5\n현금절감액 ￦100,000 / ￦80,000 / ￦60,000 / ￦50,000 / ￦40,000",

{ id:"hg2021-36", subject:"회계학개론", year:2021, no:36, law:"회계학개론", unit:"제조원가의 흐름", kind:"calc",
  stem:"손세정제를 제조하는 (주)세무의 20×1년도 직접재료예산과 관련된 자료는 다음과 같다. 이를 바탕으로 구한 2분기의 직접재료구매예산액은?\n○ 판매예산에 따른 각 분기별 제품판매량: 1분기 1,000통 / 2분기 3,000통 / 3분기 5,000통 / 4분기 2,000통\n○ 각 분기별 기말목표 제품재고량은 다음 분기 판매량의 20%로 한다.\n○ 각 분기별 기말목표 재료재고량은 다음 분기 제품생산량에 필요한 재료량의 10%로 한다.\n○ 손세정제 1통을 만드는데 20kg의 재료가 필요하다. ○ 재료의 구입단가는 kg당 ￦2이다.",

{ id:"hg2021-37", subject:"회계학개론", year:2021, no:37, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 제품 A와 제품 B를 생산하고 있는데, (주)대한으로부터 제품 A 전량을 단위당 ￦18에 공급하는 제안을 받았다. 이 제안을 검토하기 위해 (주)세무의 회계부서에서 분석한 제품 A에 대한 원가자료는 다음과 같다.\n구분 / 단가 / 1,000단위\n직접재료원가 ￦5 / ￦5,000\n직접노무원가 4 / 4,000\n변동제조간접원가 1 / 1,000\n감독자급여 3 / 3,000\n특수기계감가상각비 2 / 2,000\n공통간접원가배분액 5 / 5,000\n제조원가합계 ￦20 / ￦20,000\n제품 A를 생산하지 않을 경우 제품 A 감독자는 추가비용 없이 해고가능하고, 특수기계는 제품 A 제조에만 사용되는 전용기계이다. 공통간접원가는 공장임대료 등으로 제품 A 생산라인을 폐쇄하더라도 감소하지 않는다. 제품 A를 생산하지 않을 경우 그에 대한 여유생산 능력으로 제품 B를 추가 생산할 수 있는데, 이로 인해 증가되는 수익은 ￦5,000이고 증가되는 원가는 ￦3,000이다. (주)세무가 (주)대한의 제안을 받아들이면 자가생산하는 것보다 얼마나 유리(불리)한가?",
  choices:["￦3,000 유리","￦3,000 불리","￦4,000 유리","￦4,000 불리","￦5,000 불리"],

{ id:"hg2021-38", subject:"회계학개론", year:2021, no:38, law:"회계학개론", unit:"품질원가", kind:"calc",
  stem:"(주)세무는 에어컨을 제조하는데, 에어컨의 품질원가를 파악하기 위해 다음의 자료를 수집하였다. 품질원가에 관한 설명으로 옳지 않은 것은?\n○ 생산판매단위: 6,000개 ○ 판매단가: ￦1,500 ○ 단위당 변동원가: ￦800\n○ 제품설계시간: 1,000시간 ○ 제품설계 노무임률: ￦80\n○ 단위당 시험검사시간: 0.5시간 ○ 시험검사 노무임률: ￦60\n○ 재작업율: 10% ○ 단위당 재작업원가: ￦400\n○ 보증수리비율: 5% ○ 단위당 수리원가: ￦500\n○ 품질로 인해 상실된 추정판매량: 400개",
  choices:["예방원가는 ￦80,000이다.","평가원가는 ￦180,000이다.","내부실패원가는 ￦240,000이다.","외부실패원가는 ￦150,000이다.","총품질원가는 ￦930,000이다."],

{ id:"hg2021-39", subject:"회계학개론", year:2021, no:39, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 CCTV 장비를 제조하여 고객에게 설치판매하는 사업을 하고 있다. 장비제조는 제조부서에서 장비설치는 설치부서에서 수행하는데, 장비설치에 대한 수요는 연간처리능력을 초과하고 있다. 따라서 (주)세무는 제약자원개념하에서 운영개선을 검토하기로 하고, 다음의 자료를 수집했다.\n구분 / 장비제조 / 장비설치\n연간처리능력 400개 / 300개\n연간제조설치량 300개 / 300개\n장비의 단위당 설치판매 가격은 ￦40,000이고, 단위당 직접재료원가는 ￦30,000이다. 직접재료원가 이외의 모든 원가는 고정되어 있고 장비설치 오류시 해당 장비는 폐기된다. 이와 같은 상황하에서 (주)세무가 영업이익 증가를 위해 취하는 행동으로 옳은 것은?",
  choices:["장비설치 부서에 두 명의 작업자를 고정배치하여 연간 설치수량을 20개 증가시키고, 이로 인해 두 명의 작업자에 대해서 연간 ￦300,000의 추가적 원가가 발생한다.","직접재료는 (주)세무가 제공하는 조건으로 개당 ￦10,000에 30개의 장비를 제조해주겠다는 외주업체의 제안을 받아들인다.","연간 ￦550,000의 추가원가를 투입하여 설치시간을 단축함으로써 설치부서의 연간 설치수량을 50개 더 증가시킨다.","장비는 (주)세무가 제공하는 조건으로 개당 ￦12,000에 30개의 장비설치를 해주겠다는 외주업체의 제안을 받아들인다.","연간 ￦700,000의 추가원가를 투입하여 오류 설치수량을 연간 20개 줄인다."],
  answer:5, status:"clear", note:"" },
{ id:"hg2021-40", subject:"회계학개론", year:2021, no:40, law:"회계학개론", unit:"책임회계·대체가격", kind:"calc",
  stem:"(주)세무는 사업부의 성과를 평가하기 위해 각 사업부의 EVA(경제적부가가치)를 계산하려고 하는데, 사업부 중 한 곳인 남부사업부의 재무상황은 총자산 ￦2,000,000, 유동부채 ￦500,000, 영업이익 ￦400,000이다. (주)세무의 두 가지 자금원천 중 하나인 타인자본의 시장가치는 ￦6,000,000이고, 그에 대한 이자율은 10%이다. 나머지 원천인 자기자본의 시장가치는 ￦9,000,000이고 그에 대한 자본비용은 15%이다. (주)세무에게 적용되는 법인세율은 40%이다. 각 사업부의 EVA 계산은 기업전체의 가중평균자본비용을 적용한다. 이러한 상황에서 계산된 남부사업부의 EVA는?",

{ id:"hs2021-42", subject:"행정소송법", year:2021, no:42, law:"행정소송법", unit:"민중소송·기관소송", kind:"concept",
  stem:"기관소송 및 민중소송에 관한 설명으로 옳지 않은 것은?",
  choices:["민중소송은 국가 또는 공공단체의 기관이 법률에 위반되는 행위를 한 때에 직접 자기의 법률상 이익과 관계없이 그 시정을 구하기 위하여 제기하는 소송이다.","기관소송은 국가 또는 공공단체의 기관 상호간에 있어서의 권한의 존부 또는 그 행사에 관한 다툼이 있을 때에 이에 대하여 제기하는 소송이다.","민중소송으로써 처분등의 효력 유무 또는 존재 여부의 확인을 구하는 소송에는 그 성질에 반하지 아니하는 한 무효등 확인소송에 관한 규정을 준용한다.","기관소송으로써 부작위의 위법의 확인을 구하는 소송에는 그 성질에 반하지 아니하는 한 부작위위법확인소송에 관한 규정을 준용한다.","「행정소송법」에는 당사자소송에 관한 규정을 민중소송에 준용하는 조항이 없다."],

{ id:"hs2021-43", subject:"행정소송법", year:2021, no:43, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"당사자소송에 관한 설명으로 옳지 않은 것은?",
  choices:["당사자소송은 행정청의 처분등을 원인으로 하는 법률관계에 관한 소송 그 밖에 공법상의 법률관계에 관한 소송으로서 그 법률관계의 한쪽 당사자를 피고로 하는 소송이다.","「행정소송법」은 국가를 상대로 하는 당사자소송의 경우에도 가집행선고를 할 수 있다고 규정하고 있다.","당사자소송은 국가·공공단체 그 밖의 권리주체를 피고로 한다.","당사자소송에 관하여 법령에 제소기간이 정하여져 있는 때에는 그 기간은 불변기간으로 한다.","소의 변경에 관한 「행정소송법」제21조의 규정은 당사자소송을 항고소송으로 변경하는 경우에 준용한다."],

{ id:"hs2021-44", subject:"행정소송법", year:2021, no:44, law:"행정소송법", unit:"부작위위법확인소송", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["신청권의 존부는 본안판단의 문제이다.","부작위위법확인소송은 행정청의 부작위가 위법하다는 것을 확인하는 소송이므로 부작위위법확인소송으로는 작위의무확인을 구할 수 없다.","부작위위법확인소송은 처분의 신청을 한 자로서 부작위의 위법의 확인을 구할 법률상 이익이 있는 자만이 제기할 수 있다.","부작위위법확인소송의 계속중 당사자소송으로 소의 변경이 가능하다.","부작위란 행정청이 당사자의 신청에 대하여 상당한 기간내에 일정한 처분을 하여야 할 법률상 의무가 있음에도 불구하고 이를 하지 아니하는 것을 말한다."],

{ id:"hs2021-45", subject:"행정소송법", year:2021, no:45, law:"행정소송법", unit:"무효등확인소송", kind:"concept",
  stem:"무효등 확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",

{ id:"hs2021-48", subject:"행정소송법", year:2021, no:48, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"판례상 납세의무자에 대한 국가의 부가가치세 환급세액 지급의무에 대응하는 국가에 대한 납세의무자의 부가가치세 환급세액 지급청구는 어떤 소송의 절차에 따라야 하는가?",
  choices:["항고소송","민사소송","당사자소송","기관소송","민중소송"],
  answer:3, status:"clear", note:"" },
{ id:"hs2021-49", subject:"행정소송법", year:2021, no:49, law:"행정소송법", unit:"민중소송·기관소송", kind:"concept",
  stem:"「지방자치법」상 공금의 지출에 관한 사항을 감사청구한 주민은 일정한 경우에 그 감사청구한 사항과 관련이 있는 위법한 행위나 업무를 게을리 한 사실에 대하여 해당 지방자치단체의 장을 상대방으로 하여 소송을 제기할 수 있다. 이러한 소송은 어떤 유형에 속하는가?",
  choices:["기관소송","민중소송","당사자소송","항고소송","취소소송"],
  answer:2, status:"clear", note:"" },
{ id:"hs2021-50", subject:"행정소송법", year:2021, no:50, law:"행정소송법", unit:"부작위위법확인소송", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["당사자의 신청은 반드시 내용상 적법하여야 한다.","상당한 기간이 경과하도록 아무런 처분이 없을 때 부작위는 위법한 것이 된다.","부작위는 행정청이 어떠한 처분을 하여야 할 법률상 의무가 있음에도 행정청이 처분을 하지 않는 경우에 성립하게 된다.","거부처분의 경우 부작위위법확인소송은 적법하지 않다.","소제기 이후 판결시까지 행정청이 그 신청에 대하여 적극 또는 소극의 처분을 함으로써 부작위상태가 해소되면 대상적격은 상실하게 된다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2021-51", subject:"행정소송법", year:2021, no:51, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송에 대한 대법원 판결에 의하여 명령·규칙이 헌법 또는 법률에 위반된다는 것이 확정된 경우에는 대법원은 지체없이 그 사유를 누구에게 통보하여야 하는가?",
  choices:["행정안전부장관","법무부장관","법제처장","국민권익위원회","감사원"],
  answer:1, status:"clear", note:"" },
{ id:"hs2021-52", subject:"행정소송법", year:2021, no:52, law:"행정소송법", unit:"제소기간", kind:"concept",
  stem:"취소소송의 제기기간에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 「행정소송법」상 '처분등이 있음을 안 날'은 유효한 행정처분이 있음을 안 날을 의미하고, '처분등이 있은 날'은 행정처분의 효력이 발생한 날을 의미한다.\nㄴ. 처분의 통지가 도달한 때 그 처분이 있음을 알았다고 간주한다.\nㄷ. 특정인에 대한 행정처분을 「행정절차법」에 따른 공시송달의 방법으로 공고한 경우에는 공고가 있은 날부터 14일이 경과한 때에 그 행정처분이 있음을 알았다고 보아야 한다.",
  choices:["ㄱ","ㄴ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:1, status:"clear", note:"" },
{ id:"hs2021-53", subject:"행정소송법", year:2021, no:53, law:"행정소송법", unit:"제소기간", kind:"concept",
  stem:"행정소송의 제기기간에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정심판에 의한 감액명령재결에 따른 감액처분이 있은 경우 취소소송의 제소기간은 감액처분이 있음을 안 날로부터 90일 이내이다.","소의 종류가 변경된 경우에는 새로운 소에 대한 제소기간의 준수는 소의 변경이 허가된 때를 기준으로 하여야 한다.","행정심판을 거친 후 부작위위법확인소송을 제기하는 경우 행정심판재결서 정본을 송달받은 날로부터 90일 이내에 소를 제기하여야 한다.","필요적 행정심판전치주의하에서 행정심판이 제기된 후 30일이 지나도 재결이 없는 경우 언제든지 취소소송을 제기할 수 있다.","무효선언을 구하는 취소소송의 경우 제소기간의 제한이 없다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2021-54", subject:"행정소송법", year:2021, no:54, law:"행정소송법", unit:"행정심판전치주의", kind:"concept",
  stem:"필요적 행정심판전치주의가 적용되는 경우, 다음 설명 중 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 국세의 납세고지처분에 대하여 적법한 전심절차를 거쳤다면 가산금 및 중가산금 징수처분에 대하여 별도로 전심절차를 거치지 않아도 된다.\nㄴ. 행정심판전치의 요건은 사실심 변론종결시까지 충족하면 된다.\nㄷ. 동일한 행정처분에 의하여 여러 사람이 동일한 의무를 부담하는 경우 그 중 한 사람이 행정심판을 제기하여 기각재결을 받은 때 나머지 사람은 행정심판 제기 없이 행정소송을 제기할 수 있다.",
  choices:["ㄱ","ㄴ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:5, status:"clear", note:"" },
{ id:"hs2021-55", subject:"행정소송법", year:2021, no:55, law:"행정소송법", unit:"피고적격", kind:"concept",
  stem:"취소소송의 피고에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["교육조례에 대한 무효확인소송의 경우 의결기관인 지방의회가 아니라 시·도교육감이 피고가 된다.","행정심판의 재결이 항고소송의 대상이 되는 경우에는 재결을 한 행정심판위원회가 피고가 된다.","세무서장의 위임에 의하여 한국자산관리공사가 한 공매처분에 대하여 세무서장을 피고로 하여 취소소송을 제기한 경우 법원은 석명권을 행사하여 피고를 한국자산관리공사로 경정하게 하여야 한다.","내부위임의 경우 처분권한이 이전되지 않으므로 수임기관이 자신의 이름으로 처분을 하였더라도 위임청이 피고가 된다.","토지수용위원회가 처분청인 경우 토지수용위원회 위원장이 아니라 토지수용위원회가 피고가 된다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2021-56", subject:"행정소송법", year:2021, no:56, law:"행정소송법", unit:"재판관할", kind:"concept",
  stem:"행정소송의 관할에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["특허심판원의 심결에 불복하는 경우 그 취소를 구하는 소송은 서울행정법원에 제기하여야 한다.","고의 또는 중과실 없이 행정소송으로 제기하여야 할 사건을 민사소송으로 잘못 제기한 경우, 나머지 소송요건을 모두 갖추었더라도 법원은 각하해야 한다.","민사소송으로 제기할 것을 당사자소송으로 행정법원에 제기하고 피고가 관할위반이라고 항변하지 아니하고 본안에 대한 변론을 한 경우, 행정법원에 변론관할이 생겼다고 본다.","국가의 사무를 위탁받은 공공단체를 피고로 하여 취소소송을 제기하는 경우 대법원소재지를 관할하는 행정법원에 제기하는 것은 관할 위반이다.","항고소송을 제기할 것을 민사소송으로 잘못 제기한 경우 수소법원이 그 항고소송에 대한 관할도 동시에 가지고 있다면 민사소송으로 심리·판단할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2021-57", subject:"행정소송법", year:2021, no:57, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"소의 변경에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["청구를 이유 있게 하기 위한 공격·방어 방법의 변경은 소의 변경에 포함되지 않는다.","당사자소송을 취소소송으로 변경하는 경우 취소소송의 제소기간 등 소송요건을 갖추어야 한다.","행정청이 처분을 변경한 경우 법원은 직권으로 청구취지 또는 청구원인을 변경할 수 있다.","처분변경으로 인한 소의 변경은 부작위위법확인소송에는 적용되지 않는다.","민사소송을 항고소송으로 변경하는 것은 허용될 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2021-58", subject:"행정소송법", year:2021, no:58, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송상 당사자능력에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 「행정소송법」은 행정소송에서의 당사자능력에 관하여 규정하고 있지 않다.\nㄴ. 구청장이 업무처리지침 시달로 담당 신고접수사무를 동장에게 위임한 경우 동장은 행정소송의 당사자능력을 갖는다.\nㄷ. 국민권익위원회가 소방청장에게 인사에 관한 부당한 지시를 취소하라는 조치요구를 통지한 경우 소방청장은 그 조치요구의 취소를 구할 당사자능력을 갖는다.",
  choices:["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:3, status:"clear", note:"" },
{ id:"hs2021-59", subject:"행정소송법", year:2021, no:59, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"항고소송상 원고적격에 관한 판례의 입장으로 옳지 않은 것은?",
  choices:["채석허가를 받은 자에 대한 관할 행정청의 채석허가취소처분에 대하여 수허가자의 지위를 양수한 양수인은 그 처분의 취소를 구할 원고적격이 있다.","환경부장관이 생태·자연도 1등급 지역을 2등급으로 변경하는 처분에 대해 1등급 권역 인근주민은 이 처분의 무효확인을 구할 원고적격이 없다.","대한의사협회는 보건복지부 고시인 '건강보험요양급여행위 및 그 상대가치점수 개정'의 취소를 구할 원고적격이 없다.","이른바 예탁금회원제 골프장의 기존회원은 골프장시설업자의 회원모집계획서에 대한 시·도지사의 검토결과통보의 취소를 구할 원고적격이 없다.","전국고속버스운송사업조합은 도지사의 시외버스운송사업자에 대한 사업계획변경인가처분의 취소를 구할 원고적격이 없다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2021-60", subject:"행정소송법", year:2021, no:60, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례의 입장에 따를 때 원고적격이 인정되지 않는 자는?",
  choices:["공공건설임대주택에 대한 분양전환가격 산정의 위법을 이유로 임대사업자에 대한 분양전환승인의 효력을 다투고자 하는 경우, 임차인","자신과 동일한 사업구역 내에서 동종의 사업용화물자동차면허 대수를 늘리는 보충인가처분의 취소를 구하고자 하는 경우, 기존 개별화물자동차운송사업자","자신의 영업허가지역 내로 영업소 이전을 허가하는 약종상영업소이전허가처분의 취소를 구하고자 하는 경우, 기존 약종상 영업자","개발제한구역 중 일부 취락을 개발제한구역에서 해제하는 내용의 도시관리계획변경결정의 취소를 구하고자 하는 경우, 개발제한구역 해제대상에서 누락된 토지의 소유자","광업권설정허가처분의 취소를 구하려는 경우, 광산개발로 재산상·환경상의 이익을 침해당할 우려가 있는 토지 소유자"],
  answer:4, status:"clear", note:"" },
{ id:"hs2021-61", subject:"행정소송법", year:2021, no:61, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"「행정소송법」상 법률상 이익 유무에 관한 판례의 입장으로 옳은 것은?",
  choices:["「산업집적활성화 및 공장설립에 관한 법률」에 따라 공장설립승인처분 후에 공장건축허가처분이 있은 경우, 공장설립승인처분이 취소된 이후에는 공장건축허가처분의 취소를 구할 이익이 없다.","과세관청이 직권으로 「법인세법」상 소득처분을 경정하면서 일부 항목은 증액을 하고 동시에 다른 항목은 감액을 한 결과 전체로서 소득처분금액이 감소된 경우, 소득금액변동통지의 취소를 구할 이익이 있다.","파면처분이 있은 후에 금고 이상의 형을 선고받아 당연퇴직사유가 발생한 경우, 파면처분의 취소를 구할 이익이 없다.","주유소 운영사업자 선정처분이 내려진 경우, 불선정된 사업자는 경원관계에 있는 사업자에 대한 선정처분의 취소를 구하지 않고 자신에 대한 불선정처분의 취소를 구할 이익이 있다.","행정청이 공무원에 대하여 직위해제처분을 한 후 다시 새로운 직위해제사유에 기한 직위해제처분을 한 경우, 이전에 한 직위해제처분의 취소를 구할 이익이 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2021-62", subject:"행정소송법", year:2021, no:62, law:"행정소송법", unit:"선결문제", kind:"concept",
  stem:"처분의 효력 유무 또는 존재 여부가 민사소송의 선결문제로 되어 당해 민사소송의 수소법원이 이를 심리·판단하는 경우에 관한 설명으로 옳지 않은 것은?",
  choices:["법원은 필요하다고 인정할 때에는 직권으로 증거조사를 할 수 있다.","법원은 당사자의 신청에 의하여 다른 행정청을 소송에 참가시킬 수 있다.","법원은 당사자의 신청이 있는 때에는 재결을 행한 행정청에 대하여 행정심판에 관한 기록의 제출을 명할 수 있다.","법원은 처분이 위법하다고 판단하는 때에는 이를 취소할 수 있다.","소송비용에 관한 재판이 확정된 때에는 참가인이었던 행정청이 소속하는 국가에 그 효력을 미친다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2021-63", subject:"행정소송법", year:2021, no:63, law:"행정소송법", unit:"제소기간", kind:"concept",
  stem:"유흥주점을 운영하고 있는 甲은 유흥주점영업허가 취소처분이 있음을 2021.5.24. 알게 되었고, 2021.8.15.(일요일) 그 처분이 위법함을 알게 되었다. 이 경우 甲이 적법하게 취소소송을 제기할 수 있는 마지막 날은 2021.8.( )이다. ( )에 들어갈 날짜는?",
  choices:["22","23","24","25","26"],
  answer:2, status:"clear", note:"" },
{ id:"hs2021-64", subject:"행정소송법", year:2021, no:64, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"취소소송의 제1심 수소법원이 직권으로 할 수 없는 행위는?",
  choices:["처분 후 처분청이 없게 된 경우에 피고를 경정하는 행위","집행정지의 결정이 확정된 후 집행정지사유가 없어졌다는 이유로 집행정지의 결정을 취소하는 행위","소송의 결과에 따라 권리 또는 이익의 침해를 받을 제3자를 그 소송에 참가시키는 행위","피고가 아닌 다른 행정청을 소송에 참가시키는 행위","행정청이 거부처분취소판결에 따른 재처분의무를 이행하지 않아 그 지연기간에 따라 일정한 배상을 할 것을 명하는 행위"],
  answer:5, status:"clear", note:"" },
{ id:"hs2021-65", subject:"행정소송법", year:2021, no:65, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"소의 변경에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분변경으로 인한 소의 변경 신청은 처분이 변경된 날로부터 60일 이내에 하여야 한다.","항고소송에서 당사자소송으로 소의 종류를 변경함으로써 피고의 변경이 있는 경우 법원은 종전의 피고에 대한 소를 각하하여야 한다.","「행정소송법」이 정하는 소의 변경은 그 법조에 의하여 특별히 인정되는 것으로서 「민사소송법」상의 소의 변경을 배척한다.","청구의 원인을 변경하는 형태의 소의 변경은 허용되지 아니한다.","사실심의 변론이 일단 종결되었더라도 그 후 변론이 재개되었다면 사실심 법원은 소의 변경을 허가할 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2021-66", subject:"행정소송법", year:2021, no:66, law:"행정소송법", unit:"원처분주의·재결주의", kind:"concept",
  stem:"교원 징계에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["사립학교 교원에 대한 학교법인의 징계처분은 취소소송의 대상이다.","사립학교 교원 징계와 국립학교 교원 징계 모두 취소소송에 있어 원처분주의가 적용된다.","학교법인에 의하여 징계처분을 받은 사립학교 교원은 민사소송을 제기하여 권리구제를 받을 수도 있다.","사립학교 교원 징계에 대한 교원소청심사위원회의 결정은 행정심판의 재결에 해당하지 않는다.","사립학교 교원 징계에 대한 교원소청심사위원회 결정의 기속력은 그 결정의 주문에 포함된 사항뿐 아니라 그 전제가 된 요건사실의 인정과 판단에까지 미친다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2021-67", subject:"행정소송법", year:2021, no:67, law:"행정소송법", unit:"원처분주의·재결주의", kind:"concept",
  stem:"취소소송의 대상에 있어 재결주의가 적용되는 것을 모두 고른 것은?\nㄱ. 「국가공무원법」상 소청심사위원회의 결정\nㄴ. 「감사원법」상 감사원의 재심의판정\nㄷ. 「특허법」상 특허심판원의 심결\nㄹ. 「국세기본법」상 심판청구에 대한 결정",
  choices:["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],
  answer:2, status:"clear", note:"" },
{ id:"hs2021-68", subject:"행정소송법", year:2021, no:68, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"항고소송의 대상이 되는 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 공정거래위원회의 표준약관 사용권장행위\nㄴ. 조달청이 물품구매계약의 상대방에게 한 나라장터 종합쇼핑몰 거래정지 조치\nㄷ. 방송통신심의위원회가 「방송통신위원회의 설치 및 운영에 관한 법률」에 따라 서비스제공자에게 한 시정요구\nㄹ. 교도소장이 수형자에게 한 접견내용 녹음·녹화 및 접견 시 교도관 참여대상자 지정행위",
  choices:["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"hs2021-69", subject:"행정소송법", year:2021, no:69, law:"행정소송법", unit:"소송참가", kind:"concept",
  stem:"甲이 A행정청을 피고로 하여 제기한 취소소송에서, 乙은 그 소송의 결과에 따라 권리의 침해를 받을 수 있다. 乙과 피고가 아닌 B행정청의 소송참가에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원이 B행정청의 소송참가를 결정할 때에는 甲과 A행정청의 의견을 들어야 할 뿐 B행정청의 의견까지 들어야 하는 것은 아니다.","B행정청은 「행정소송법」상 행정청의 소송참가를 할 수 있을 뿐 「민사소송법」상 보조참가를 할 수는 없다.","乙의 소송참가는 당사자의 신청 또는 법원의 직권에 의하여 할 수 있을 뿐 乙 자신이 소송참가를 신청할 수는 없다.","乙은 「행정소송법」상 제3자의 소송참가를 할 수 있을 뿐 「민사소송법」상 보조참가의 요건을 갖추었더라도 「민사소송법」상 보조참가를 할 수는 없다.","乙을 소송에 참가시키는 법원의 결정이 있었을 뿐 乙이 현실적으로 소송에 참가하여 소송행위를 하지 않았다면 乙에게는 판결의 효력이 미치지 않는다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2021-70", subject:"행정소송법", year:2021, no:70, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"판례상 허용되는 유형의 소송으로 집행정지가 인정되는 소송을 모두 고른 것은?\nㄱ. 무효확인소송 ㄴ. 예방적 부작위소송 ㄷ. 처분부존재확인소송 ㄹ. 당사자소송",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ"],

{ id:"hs2021-71", subject:"행정소송법", year:2021, no:71, law:"행정소송법", unit:"위법판단 기준시", kind:"concept",
  stem:"甲은 2021.5.24. 영업허가거부처분을 받고 그 다음 날 그 처분에 대해 취소소송을 제기하였다. 법원은 심리를 진행한 후 2021.12.3. 변론을 종결하였고, 선고기일은 2021.12.17.이다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["甲은 사실상태에 대한 입증을 2021.12.17.까지 할 수 있다.","법원은 2021.12.17. 당시의 법령과 사실상태를 기준으로 하여 처분의 위법 여부를 판단하여야 한다.","법원은 2021.12.3. 당시의 법령과 사실상태를 기준으로 하여 처분의 위법 여부를 판단하여야 한다.","법원은 2021.5.24. 당시 존재하였던 자료나 행정청에 제출되었던 자료만으로 2021.5.24. 당시 존재하였던 객관적 사실을 확정하고 그 사실에 기초하여 처분의 위법 여부를 판단하여야 한다.","법원은 2021.12.3.까지 제출된 모든 자료를 종합하여 2021.5.24. 당시 존재하였던 객관적 사실을 확정하고 그 사실에 기초하여 처분의 위법 여부를 판단할 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2021-72", subject:"행정소송법", year:2021, no:72, law:"행정소송법", unit:"사정판결", kind:"concept",
  stem:"사정판결에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["징계면직된 검사의 복직이 검찰조직의 안정과 인화를 저해할 우려가 있다는 사정은 현저히 공공복리에 반하는 사유라고 볼 수 없다.","법원은 판결의 주문에서 처분등이 위법함을 명시하여야 한다.","법원은 원고에 대하여 상당한 구제방법을 취하거나 상당한 구제방법을 취할 것을 피고에게 명할 수 있다.","사정판결에 관하여는 당사자의 명백한 주장이 없는 경우에도 기록에 나타난 여러 사정을 기초로 직권으로 판단할 수 있다.","당연무효의 행정처분을 소송목적물로 하는 행정소송에서는 사정판결을 할 수 없다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2021-73", subject:"행정소송법", year:2021, no:73, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"취소소송의 소송물에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["조세의 종목과 과세기간에 의하여 구분되는 각 과세단위에 관한 개개의 부과처분이 조세소송의 소송물이 된다.","과세관청은 소송 중 사실심 변론종결시까지 당해 처분에서 인정한 과세표준 또는 세액의 정당성을 뒷받침할 수 있는 새로운 자료를 제출할 수 있다.","감액경정청구에 대한 거부처분 취소소송에서 과세표준 및 세액의 인정이 위법이라고 내세우는 개개의 위법사유는 공격방어방법에 불과하다.","부당해고 등의 구제신청에 관한 중앙노동위원회의 재심판정 취소소송에서 법원은 중앙노동위원회가 재심판정에서 인정한 징계사유에 한하여 심리한다.","특허심판원의 심결에 대한 취소소송에서 당사자는 심결에서 판단되지 않은 처분의 위법사유도 주장·입증할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2021-74", subject:"행정소송법", year:2021, no:74, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"확정판결의 기속력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정청은 취소판결의 기속력에 따라 위법한 결과를 제거하는 조치를 할 의무가 있다.","종전 처분 사유와 기본적 사실관계에서 동일성이 인정되지 않는 다른 사유를 들어서 새로이 처분을 하는 것은 기속력에 저촉되지 않는다.","거부처분 후에 법령이 개정·시행된 경우에는 개정된 법령을 새로운 사유로 들어 다시 이전의 신청에 대한 거부처분을 할 수 있다.","절차상 하자로 인하여 무효인 행정처분이 있은 후 행정청이 관계 법령에서 정한 절차를 갖추어 다시 동일한 행정처분을 하였다면 당해 행정처분은 종전의 무효인 행정처분과 관계없는 새로운 행정처분이다.","행정청이 취소판결의 기속력에 반하는 행정처분을 하는 것은 허용되지 않지만 그 하자가 중대하고 명백한 것은 아니다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2021-75", subject:"행정소송법", year:2021, no:75, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"부작위위법확인판결이 확정된 경우에 그 효력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["제3자에 대하여도 효력이 있다.","그 사건에 관하여 당사자인 행정청과 그 밖의 관계행정청을 기속한다.","행정청은 판결의 취지에 따라 다시 이전의 신청에 대한 처분을 하여야 한다.","행정청이 이전에 신청한 내용대로 처분을 하지 아니하는 경우에 법원은 상당한 기간을 정하고 그 기간 내에 이행하지 아니하는 때에는 배상금을 명할 수 있다.","제3자에 의한 재심청구는 확정판결이 있음을 안 날로부터 30일 이내, 판결이 확정된 날로부터 1년 이내에 제기하여야 한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2021-76", subject:"행정소송법", year:2021, no:76, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"확정판결의 기판력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["소송요건의 흠결에 관한 전소 확정판결의 기판력은 후소에 미친다.","공사중지명령의 상대방은 그 명령의 취소를 구한 소송에서 그 명령이 적법함을 이유로 패소하여 확정된 이후에도 그 명령의 해제신청을 거부한 처분의 취소를 구하는 소송에서 그 명령의 적법성을 다툴 수 있다.","어떠한 행정처분이 후에 항고소송에서 취소되었다고 할지라도 그 기판력에 의하여 곧바로 그 행정처분이 공무원의 고의 또는 과실로 인한 불법행위를 구성한다고 단정할 수 없다.","취소판결의 기판력은 소송물로 된 행정처분의 위법성 존부에 관한 판단 그 자체에만 미친다.","확정판결은 주문에 포함된 것에 한하여 기판력을 가진다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2021-77", subject:"행정소송법", year:2021, no:77, law:"행정소송법", unit:"판결 일반", kind:"concept",
  stem:"일부취소판결에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["개발부담금부과처분 취소소송에 있어 적법하게 부과될 정당한 부과금액을 산출할 수 있는 경우에는 그 정당한 금액을 초과하는 부분만 취소하여야 한다.","재량행위인 과징금부과처분이 법이 정한 한도액을 초과하여 위법할 경우 그 한도액을 초과한 부분만을 취소할 수 없다.","수개의 위반행위에 대하여 하나의 과징금납부명령을 한 경우 일부의 위반행위만이 위법하더라도 그 일부의 위반행위를 기초로 한 과징금액을 산정할 수 없다면 과징금납부명령 전부를 취소할 수밖에 없다.","하나의 행정처분이라 하더라도 가분성이 있다면 그 일부의 취소는 당해 취소부분에 관하여 효력이 생긴다.","여러 처분사유에 관하여 하나의 제재처분을 하였을 때 그중 일부가 적법하지 않다면 나머지 처분사유만으로 정당성이 인정되더라도 그 처분을 취소해야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2021-78", subject:"행정소송법", year:2021, no:78, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"판결에 의한 취소에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정처분을 취소하는 판결이 확정되면 당해 행정처분의 효력은 처분 시에 소급하여 소멸하고 처음부터 당해 처분이 행하여지지 않았던 것과 같은 상태로 된다.","조합설립인가처분이 판결에 의하여 취소된 경우에 주택재개발사업조합이 그 취소판결 전에 사업시행자로서 한 처분은 달리 특별한 사정이 없는 한 소급하여 효력을 상실한다.","수익적 행정처분에 대한 취소판결은 기득권의 침해를 정당화할 만한 중대한 공익상의 필요 또는 제3자의 이익보호의 필요가 있는 때에 한하여 허용될 수 있다.","처분등을 취소하는 확정판결은 제3자에 대하여도 효력이 있다.","취소판결 자체의 효력으로써 행정처분을 기초로 하여 새로 형성된 제3자의 권리까지 당연히 그 행정처분 전의 상태로 환원되는 것은 아니다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2021-79", subject:"행정소송법", year:2021, no:79, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"재량처분의 취소에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["영업정지 기간의 감경에 관한 참작 사유가 있음에도 이를 전혀 고려하지 않은 나머지 영업정지 기간을 감경하지 아니하였다면 그 영업정지 처분은 위법하다.","공무원에 대한 징계처분에는 공무원 승진임용처분에서와 비교할 수 없을 정도의 광범위한 재량이 부여되어 있다.","재량행위에 대한 사법심사에서는 법원은 독자의 결론을 도출함이 없이 당해 행위에 재량권의 일탈·남용이 있는지 여부만을 심사하게 된다.","재량권을 일탈·남용한 특별한 사정이 있다는 점은 이를 주장하는 자가 증명하여야 한다.","허가 기준에 맞지 않는다고 판단하여 개발행위허가신청을 불허가하였다면 이에 앞서 도시계획위원회의 심의를 거치지 않았다는 사정만으로 곧바로 그 불허가처분에 취소사유가 있다고 보기는 어렵다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2021-80", subject:"행정소송법", year:2021, no:80, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"甲은 중앙토지수용위원회의 수용재결에 대하여 이의신청을 하거나 수용재결의 취소를 구하거나 보상금의 증액을 청구하는 소송을 제기하고자 한다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["甲은 중앙토지수용위원회에 이의신청을 할 수 있다.","甲은 중앙토지수용위원회를 피고로 수용재결취소소송을 제기할 수 있다.","甲은 사업시행자를 피고로 보상금증액청구소송을 제기할 수 있다.","보상금증액청구소송은 당사자소송에 해당한다.","수용재결취소소송과 보상금증액청구소송은 병합하여 제기할 수 없다."],
  answer:5, status:"clear", note:"" },

{ id:"hg2022-1", subject:"회계학개론", year:2022, no:1, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"유용한 재무정보의 질적 특성에 관한 설명으로 옳지 않은 것은?",
  choices:["재무보고서는 경제적 현상을 글과 숫자로 나타내는 것이다.","재무정보가 과거 평가에 대해 피드백을 제공한다면(과거 평가를 확인하거나 변경시킨다면) 확인가치를 갖는다.","중립적 정보는 목적이 없거나 행동에 대한 영향력이 없는 정보를 의미한다.","회계기준위원회는 중요성에 대한 획일적인 계량 임계치를 정하거나 특정한 상황에서 무엇이 중요한 것인지를 미리 결정할 수 없다.","합리적인 추정치의 사용은 재무정보의 작성에 필수적인 부분이며, 추정이 명확하고 정확하게 기술되고 설명되는 한 정보의 유용성을 저해하지 않는다."],
  answer:3, status:"clear", note:"" },
{ id:"hg2022-2", subject:"회계학개론", year:2022, no:2, law:"회계학개론", unit:"무형자산", kind:"concept",
  stem:"무형자산 회계처리에 관한 설명으로 옳은 것은?",
  choices:["내용연수가 비한정인 무형자산의 비한정 내용연수를 유한 내용연수로 변경하는 것은 회계정책의 변경이다.","자산을 운용하는 직원의 교육훈련과 관련된 지출은 내부적으로 창출한 내용연수가 비한정인 무형자산의 원가에 포함한다.","내부적으로 창출한 브랜드, 제호, 출판표제, 고객 목록과 이와 실질이 유사한 항목은 내용연수가 비한정인 무형자산으로 인식한다.","내용연수가 유한한 무형자산을 내용연수 종료 시점에 제3자가 구입하기로 약정한 경우, 잔존가치는 영(0)으로 보지 않는다.","경제적 효익이 소비될 것으로 예상되는 형태를 신뢰성 있게 결정할 수 없는 내용연수가 비한정인 무형자산은 정액법을 적용하여 상각한다."],
  answer:4, status:"clear", note:"" },
{ id:"hg2022-3", subject:"회계학개론", year:2022, no:3, law:"회계학개론", unit:"금융부채·사채", kind:"calc",
  stem:"(주)세무는 20×1년 1월 1일 상각후원가로 측정하는 금융부채에 해당하는 다음과 같은 조건의 연속상환사채를 발행하였다. 20×2년 말 재무상태표상 동 상각후원가측정 금융부채의 장부금액은? (단, 현재가치 계산 시 다음에 제시된 현가계수표를 이용한다.)\n○ 액면금액: ￦1,200,000 ○ 이자지급: 연 5%의 이자율을 적용하여 매년 12월 31일에 지급\n○ 상환: 20×2년부터 20×4년까지 매년 12월 31일에 ￦400,000씩 연속상환 ○ 발행당시 유효이자율: 연 6%\n구분 / 단일금액￦1 현가(5%) / (6%) / 정상연금￦1 현가(5%) / (6%)\n1년 0.9524 / 0.9434 / 0.9524 / 0.9434\n2년 0.9070 / 0.8900 / 1.8954 / 1.8334\n3년 0.8638 / 0.8396 / 2.7232 / 2.6730\n4년 0.8227 / 0.7921 / 3.5459 / 3.4651",
  choices:["￦396,221","￦788,896","￦796,221","￦988,221","￦1,188,896"],
  answer:2, status:"clear", note:"" },
{ id:"hg2022-4", subject:"회계학개론", year:2022, no:4, law:"회계학개론", unit:"투자부동산", kind:"concept",
  stem:"투자부동산의 분류에 관한 설명으로 옳은 것은?",
  choices:["통상적인 영업과정에서 가까운 장래에 개발하여 판매하기 위해 취득한 부동산은 투자부동산으로 분류한다.","토지를 자가사용할지 통상적인 영업과정에서 단기간에 판매할지를 결정하지 못한 경우 자가사용부동산으로 분류한다.","호텔을 소유하고 직접 경영하는 경우 투숙객에게 제공하는 용역이 전체 계약에서 유의적인 비중을 차지하므로 투자부동산으로 분류한다.","지배기업 또는 다른 종속기업에게 부동산을 리스하는 경우 당해 부동산을 연결재무제표에 투자부동산으로 분류할 수 없고 자가사용부동산으로 분류한다.","사무실 건물의 소유자가 그 건물을 사용하는 리스이용자에게 경미한 비중의 보안과 관리용역을 제공하는 경우 부동산 보유자는 당해 부동산을 자가사용부동산으로 분류한다."],
  answer:4, status:"clear", note:"" },
{ id:"hg2022-5", subject:"회계학개론", year:2022, no:5, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무는 20×1년 1월 1일 기계장치(내용연수 4년, 잔존가치 ￦0, 정액법 상각, 원가모형 적용)를 ￦240,000에 취득하여 기계장치가 정상적으로 작동되는지 여부를 시험한 후 즉시 사용하고 있다. 시험하는 과정에서 시운전비 ￦40,000이 발생하였고, 시험하는 과정에서 생산된 시제품은 시험 종료 후 즉시 전부 판매하고 ￦20,000을 현금으로 수취하였다. (주)세무는 20×1년 7월 1일 동 기계장치를 재배치하기 위해 운반비 ￦50,000과 설치원가 ￦50,000을 추가 지출하였다. 20×1년 말 기계장치에 대한 순공정가치와 사용가치는 각각 ￦150,000과 ￦120,000으로 손상이 발생하였으며, 20×2년 말 순공정가치와 사용가치는 각각 ￦160,000과 ￦170,000으로 회복되었다. 위 거래와 관련하여 (주)세무의 기계장치 회계처리에 관한 설명으로 옳은 것은? (단, 감가상각은 월할 계산한다.)",

{ id:"hg2022-6", subject:"회계학개론", year:2022, no:6, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무는 20×1년 7월 1일 공장건물 신축을 시작하여 20×2년 12월 31일에 공사를 완료하였다. 동 공장건물은 차입원가를 자본화하는 적격자산이다. 공장건물 신축을 위해 20×1년 7월 1일에 ￦12,000,000, 그리고 20×2년에 ￦10,000,000을 각각 지출하였다. (주)세무는 20×1년 7월 1일 공장건물 신축을 위한 특정차입금 ￦2,000,000(이자율 연 5%, 2년 후 일시 상환)을 차입하였다. (주)세무는 특정차입금 중 ￦1,000,000을 연 2% 이자지급조건의 정기예금에 20×1년 8월 1일부터 20×1년 10월 31일까지 예치하였다. (주)세무가 20×1년에 공장건물 신축과 관련하여 자본화한 차입원가는 ￦150,000일 때, 20×1년 일반차입금에 대한 자본화이자율은? (단, 특정차입금으로 사용하지 않은 지출액은 일반차입금으로 지출되었으며, 20×1년도에 일반차입금에서 발생한 실제 차입원가는 ￦520,000이다. 연평균 지출액과 이자비용은 월할 계산한다.)",

{ id:"hg2022-7", subject:"회계학개론", year:2022, no:7, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",

{ id:"hg2022-10", subject:"회계학개론", year:2022, no:10, law:"회계학개론", unit:"유형자산", kind:"calc",

{ id:"hg2022-11", subject:"회계학개론", year:2022, no:11, law:"회계학개론", unit:"금융부채·사채", kind:"calc",

  stem:"다음은 (주)세무 및 그 종속기업인 (주)한국과 관련된 자료이다. 다음의 설명 중 옳은 것은?\n○ (주)세무는 20×1년 1월 1일 (주)한국의 의결권 있는 보통주식의 60%를 ￦700,000에 취득하여 지배력을 획득하였다.\n○ 취득일 현재 (주)한국의 재무상태표상 자본총액은 ￦1,000,000(자본금 ￦700,000, 이익잉여금 ￦300,000)이다.\n○ 취득일 현재 공정가치와 장부금액이 서로 다른 자산은 재고자산(장부금액 ￦300,000, 공정가치 ￦350,000)이 유일하고, 부채의 공정가치는 장부금액과 동일하다.\n○ (주)한국은 상기 재고자산의 70%를 20×1년도 중 연결실체 외부에 판매하였고, 나머지는 20×1년 말까지 보유하고 있다.\n○ 20×1년도 (주)한국의 당기순이익은 ￦50,000이고, 취득일 이후 (주)세무와 (주)한국 간의 내부거래는 없다.\n○ (주)세무가 20×1년도 연결포괄손익계산서에 표시한 연결당기순이익은 ￦100,000이다.\n○ 영업권과 관련된 손상차손은 고려하지 않으며, 비지배지분은 종속기업의 식별가능한 순자산 공정가치에 비례하여 결정하기로 한다.\n○ 20×1년 말 현재 (주)한국은 (주)세무의 유일한 종속기업이다.",
  choices:["(주)세무가 20×1년 말 연결재무상태표에 표시할 영업권은 ￦100,000이다.","(주)세무가 20×1년도 연결포괄손익계산서에 표시할 연결당기순이익 중 비지배주주에 귀속되는 부분은 ￦15,000이다.","(주)세무가 20×1년도 연결포괄손익계산서에 표시할 연결당기순이익 중 지배기업소유주에 귀속되는 부분은 ￦85,000이다.","(주)세무가 종속기업에 대한 투자를 원가법을 적용하여 표시한 20×1년도의 별도재무제표상 당기순이익은 ￦91,000이다.","(주)세무가 종속기업에 대한 투자를 지분법을 적용하여 표시한 20×1년도의 별도재무제표상 당기순이익은 ￦94,000이다."],

{ id:"hg2022-14", subject:"회계학개론", year:2022, no:14, law:"회계학개론", unit:"주식기준보상", kind:"calc",
  stem:"(주)세무는 20×1년 1월 1일 현재 근무 중인 임직원 300명에게 20×4년 12월 31일까지 의무적으로 근무할 것을 조건으로 임직원 1명당 주식선택권 10개씩을 부여하였다. 주식선택권 부여일 현재 동 주식선택권의 단위당 공정가치는 ￦200이다. 동 주식선택권은 20×5년 1월 1일부터 행사할 수 있다. 20×2년 1월 1일 (주)세무는 주가가 크게 하락하여 주식선택권의 행사가격을 조정하였다. 이러한 조정으로 주식선택권의 단위당 공정가치는 ￦20 증가하였다. (주)세무는 20×1년 말까지 상기 주식선택권을 부여받은 종업원 중 20%가 퇴사할 것으로 예상하여, 주식선택권의 가득률을 80%로 추정하였으나, 20×2년 말에는 향후 2년 내 퇴사율을 10%로 예상함에 따라 주식선택권의 가득률을 90%로 추정하였다. 부여한 주식선택권과 관련하여 (주)세무가 20×2년에 인식할 주식보상비용은?",
  choices:["￦120,000","￦150,000","￦168,000","￦240,000","￦270,000"],
  answer:3, status:"clear", note:"" },
{ id:"hg2022-15", subject:"회계학개론", year:2022, no:15, law:"회계학개론", unit:"재무회계개념체계", kind:"calc",
  stem:"(주)세무의 20×1년 초 자본총계는 ￦3,000,000이었다. 20×1년 중 자본과 관련된 자료가 다음과 같을 때, 20×1년 말 자본총계는?\n○ 4월 1일: 1주당 액면금액 ￦5,000인 보통주 100주를 1주당 ￦12,000에 발행하였다.\n○ 7월 30일: 이사회에서 총 ￦200,000의 중간배당을 결의하고 즉시 현금으로 지급하였다.\n○ 10월 1일: 20주의 보통주(자기주식)를 1주당 ￦11,000에 취득하였다.\n○ 11월 30일: 10월 1일에 취득하였던 보통주(자기주식) 중에서 10주는 1주당 ￦13,000에 재발행하였고, 나머지 10주는 소각하였다.\n○ 12월 31일: 20×1년도의 당기순이익과 기타포괄이익으로 각각 ￦850,000과 ￦130,000을 보고하였다.",
  choices:["￦4,040,000","￦4,470,000","￦4,690,000","￦4,760,000","￦4,890,000"],
  answer:5, status:"clear", note:"" },
{ id:"hg2022-16", subject:"회계학개론", year:2022, no:16, law:"회계학개론", unit:"수익인식", kind:"concept",
  stem:"(주)세무는 고객에게 제품을 이전하기로 한 약속을 수행의무로 식별하고, 제품을 고객에게 이전할 때 각각의 수행의무에 대한 수익을 인식하고 있다. (주)세무는 (주)한국에게 제품A와 제품B를 이전하기로 하는 계약을 20×1년 12월 1일에 체결하였고, 동 계약에 따라 받기로 한 대가는 총 ￦10,000이다. 동 계약에 따르면, 제품A를 먼저 인도한 후 제품B를 나중에 인도하기로 하였지만, 대가 ￦10,000은 모든 제품(제품A와 제품B)을 인도한 이후에만 받을 권리가 생긴다. (주)세무는 20×1년 12월 15일에 제품A를 인도하였고, 제품B에 대한 인도는 20×2년 1월 10일에 이루어졌으며, 20×2년 1월 15일에 대가 ￦10,000을 수령하였다. (주)세무는 제품A를 개별적으로 판매할 경우 ￦8,000에 판매하고 있지만, 제품B는 판매경험 및 유사제품에 대한 시장정보가 없어 개별판매가격을 알지 못한다. 따라서 잔여접근법으로 거래가격을 배분하기로 한다. (주)세무의 상기거래에 관한 설명으로 옳지 않은 것은? (단, 제시된 거래의 효과만을 반영하기로 한다.)",
  choices:["20×1년 말 (주)세무의 재무상태표에 표시할 수취채권의 금액은 영(0)이다.","20×1년 말 (주)세무의 재무상태표에 표시할 계약자산의 금액은 ￦8,000이다.","(주)세무가 20×1년도 포괄손익계산서에 수익으로 인식할 금액은 ￦8,000이다.","20×1년 말 (주)세무의 재무상태표에 표시할 계약부채는 없다.","(주)세무의 20×2년 1월 10일 회계처리로 인하여 계약자산은 ￦2,000 증가한다."],
  answer:5, status:"clear", note:"" },
{ id:"hg2022-17", subject:"회계학개론", year:2022, no:17, law:"회계학개론", unit:"리스", kind:"concept",
  stem:"리스부채의 측정에 관한 설명으로 옳지 않은 것은?",
  choices:["리스부채의 최초 측정시 리스료의 현재가치는 리스이용자의 증분차입이자율을 사용하여 산정한다. 다만, 증분차입이자율을 쉽게 산정할 수 없는 경우에는 리스의 내재이자율로 리스료를 할인한다.","리스개시일에 리스부채의 측정치에 포함되는 리스료는 리스기간에 걸쳐 기초자산을 사용하는 권리에 대한 지급액 중 그날 현재 지급되지 않은 금액으로 구성된다.","리스가 리스기간 종료시점 이전에 리스이용자에게 기초자산의 소유권을 이전하는 경우에, 리스이용자는 리스개시일부터 기초자산의 내용연수 종료시점까지 사용권자산을 감가상각한다.","리스이용자는 리스개시일 후에 리스부채에 대한 이자를 반영하여 리스부채의 장부금액을 증액하고, 지급한 리스료를 반영하여 리스부채의 장부금액을 감액한다.","리스개시일 후 리스료에 변동이 생기는 경우, 리스이용자는 사용권자산을 조정하여 리스부채의 재측정 금액을 인식하지만, 사용권자산의 장부금액이 영(0)으로 줄어들고 리스부채 측정치가 그보다 많이 줄어드는 경우에는 나머지 재측정 금액을 당기손익으로 인식한다."],
  answer:1, status:"clear", note:"" },
{ id:"hg2022-18", subject:"회계학개론", year:2022, no:18, law:"회계학개론", unit:"주당이익", kind:"calc",
  stem:"(주)세무의 20×1년도 주당이익 계산과 관련된 자료는 다음과 같다. (주)세무의 20×1년도 기본주당순이익은?\n○ (주)세무의 20×1년 초 유통보통주식수는 800주이며, 우선주는 모두 비참가적, 비누적적 우선주이다.\n○ (주)세무는 20×1년 4월 1일 유상증자를 실시하여 보통주 300주를 추가발행하였다. 동 유상증자시 발행금액은 1주당 ￦1,000이었으나, 유상증자 전일의 보통주 종가는 1주당 ￦1,500이었다.\n○ (주)세무는 20×1년 10월 1일 보통주(자기주식) 60주를 취득하여 20×1년 말까지 보유하고 있다.\n○ 20×1년도 우선주에 대하여 지급하기로 결의된 배당금은 ￦50,000이다.\n○ (주)세무의 20×1년도 당기순이익은 ￦575,300이다.\n○ 가중평균유통보통주식수는 월할계산하고, 유상증자의 경우 발행금액 전액이 발행일에 납입완료되었다.",
  choices:["￦495","￦498","￦500","￦505","￦510"],
  answer:5, status:"clear", note:"" },
{ id:"hg2022-19", subject:"회계학개론", year:2022, no:19, law:"회계학개론", unit:"금융자산", kind:"concept",
  stem:"다음은 금융자산의 분류 및 재분류 등에 관한 설명이다. 옳은 설명을 모두 고른 것은?\nㄱ. 계약상 현금흐름을 수취하기 위해 보유하는 것이 목적인 사업모형 하에서 금융자산을 보유하고, 금융자산의 계약 조건에 따라 특정일에 원금과 원금잔액에 대한 이자 지급만으로 구성되어 있는 현금흐름이 발생하는 금융자산은 상각후원가로 측정한다.\nㄴ. 계약상 현금흐름의 수취와 금융자산의 매도 둘 다를 통해 목적을 이루는 사업모형 하에서 금융자산을 보유하고, 금융자산의 계약 조건에 따라 특정일에 원금과 원금잔액에 대한 이자 지급만으로 구성되어 있는 현금흐름이 발생하는 금융자산은 당기손익-공정가치로 측정한다.\nㄷ. 서로 다른 기준에 따라 자산이나 부채를 측정하거나 그에 따른 손익을 인식한 결과로 발생한 인식이나 측정의 불일치를 제거하거나 유의적으로 줄이는 경우에는 최초 인식시점에 해당 금융자산을 당기손익-공정가치 측정항목으로 지정할 수 있다.\nㄹ. 금융자산을 기타포괄손익-공정가치 측정 범주에서 당기손익-공정가치 측정 범주로 재분류하는 경우, 재분류 전에 인식한 기타포괄손익누계액은 재분류일에 자본의 다른 항목으로 직접 대체한다.",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],
  answer:2, status:"clear", note:"" },
{ id:"hg2022-20", subject:"회계학개론", year:2022, no:20, law:"회계학개론", unit:"금융부채·사채", kind:"calc",
  stem:"(주)세무는 20×1년 1월 1일 다음과 같은 조건의 신주인수권부사채를 액면발행하였다.\n○ 액면금액: ￦100,000 ○ 표시이자율: 연 4% ○ 사채발행시 신주인수권이 부여되지 않은 일반사채의 시장이자율: 연 6%\n○ 이자지급일: 매년 12월 31일 ○ 행사가격: 1주당 ￦1,000 ○ 만기상환일: 20×3년 12월 31일\n○ 상환조건: 신주인수권 미행사시 상환기일에 액면금액의 105%를 일시상환\n20×2년 초 상기 신주인수권의 60%가 행사되어 주식 60주가 발행되었다. 20×2년 초 상기 신주인수권의 행사로 인한 (주)세무의 자본총계 증가액은? (단, 상기 신주인수권은 지분상품에 해당하며, 현재가치 계산이 필요한 경우 다음에 제시된 현가계수표를 이용한다.)\n기간 / 단일금액￦1 현가(4%) / (6%) / 정상연금￦1 현가(4%) / (6%)\n1년 / 0.9615 / 0.9434 / 0.9615 / 0.9434\n2년 / 0.9246 / 0.8900 / 1.8861 / 1.8334\n3년 / 0.8890 / 0.8396 / 2.7751 / 2.6730",
  choices:["￦60,000","￦62,670","￦63,000","￦63,700","￦65,000"],
  answer:2, status:"clear", note:"" },
{ id:"hg2022-21", subject:"회계학개론", year:2022, no:21, law:"회계학개론", unit:"금융부채·사채", kind:"calc",
  stem:"(주)세무는 20×1년 초에 사채(상각후원가로 측정하는 금융부채)를 발행하였다. 20×1년 말 장부마감 과정에서 동 사채의 회계처리와 관련한 다음과 같은 중요한 오류를 발견하였다.\n○ 사채의 발행일에 사채발행비 ￦9,500이 발생하였으나 이를 사채의 발행금액에서 차감하지 않고, 전액 20×1년도의 당기비용으로 처리하였다.\n○ 20×1년 초 사채의 발행금액(사채발행비 차감전)은 ￦274,000이고, (주)세무는 동 발행금액에 유효이자율 연 10%를 적용하여 20×1년도 이자비용을 인식하였다.\n○ 상기 사채발행비를 사채 발행금액에서 차감할 경우 사채발행시점의 유효이자율은 연 12%로 증가한다.\n(주)세무의 오류수정 전 20×1년도의 당기순이익이 ￦100,000인 경우, 오류를 수정한 후의 20×1년도 당기순이익은?",
  choices:["￦90,500","￦95,660","￦104,340","￦105,160","￦109,500"],
  answer:4, status:"clear", note:"" },
{ id:"hg2022-22", subject:"회계학개론", year:2022, no:22, law:"회계학개론", unit:"현금흐름표", kind:"calc",
  stem:"(주)세무의 20×1년도 현금흐름표를 작성하기 위한 자료는 다음과 같다. (주)세무가 20×1년도 현금흐름표에 보고할 영업활동순현금유입액은?\n○ 법인세비용차감전순이익: ￦1,000,000\n○ 법인세비용: ￦120,000 (20×1년 중 법인세납부액과 동일)\n○ 이자비용: ￦30,000 (모두 사채의 이자비용이며, 사채할인발행차금 상각액을 포함함)\n○ 자산과 부채의 증감: 계정과목 / 기초금액 / 기말금액\n매출채권 ￦200,000 / ￦210,000\n재고자산 280,000 / 315,000\n건물 1,200,000 / 1,150,000\n건물감가상각누계액 (380,000) / (370,000)\n사채 300,000 / 300,000\n사채할인발행차금 (15,000) / (10,000)\n○ 20×1년 중 건물관련 거래가 (주)세무의 순현금흐름을 ￦30,000 증가시켰다.\n○ 20×1년 중 사채관련 거래가 (주)세무의 순현금흐름을 ￦25,000 감소시켰으며, 20×1년 중 사채의 발행 및 상환은 없었다.\n○ (주)세무는 간접법을 사용하여 영업활동현금흐름을 산출하며, 이자지급 및 법인세납부는 영업활동으로 구분한다.",
  choices:["￦850,000","￦880,000","￦890,000","￦930,000","￦970,000"],
  answer:1, status:"clear", note:"" },
{ id:"hg2022-23", subject:"회계학개론", year:2022, no:23, law:"회계학개론", unit:"법인세회계", kind:"calc",
  stem:"(주)세무의 20×2년도 법인세 관련 자료가 다음과 같을 때, 20×2년도 법인세비용은?\n○ 20×2년도 법인세비용차감전순이익 ￦500,000\n○ 세무조정사항 - 전기 감가상각비 한도초과액 ￦(80,000) - 접대비한도초과액 ￦130,000\n○ 감가상각비 한도초과액은 전기 이전 발생한 일시적차이의 소멸분이고, 접대비한도초과액은 일시적차이가 아니다.\n○ 20×2년 말 미소멸 일시적차이(전기 감가상각비 한도초과액)는 ￦160,000이고, 20×3년과 20×4년에 각각 ￦80,000씩 소멸될 것으로 예상된다.\n○ 20×1년 말 이연법인세자산은 ￦48,000이고, 이연법인세부채는 없다.\n○ 차감할 일시적차이가 사용될 수 있는 과세소득의 발생가능성은 매우 높다.\n○ 적용될 법인세율은 매년 20%로 일정하고, 언급된 사항 이외의 세무조정 사항은 없다.",
  choices:["￦94,000","￦110,000","￦126,000","￦132,000","￦148,000"],

{ id:"hg2022-24", subject:"회계학개론", year:2022, no:24, law:"회계학개론", unit:"종업원급여", kind:"calc",
  stem:"(주)세무는 확정급여제도를 채택하여 시행하고 있으며, 관련 자료는 다음과 같다. (주)세무의 확정급여채무 및 사외적립자산과 관련된 회계처리가 20×1년도의 기타포괄이익에 미치는 영향은?\n○ 20×1년 초 확정급여채무와 사외적립자산의 잔액은 각각 ￦1,000,000과 ￦600,000이다.\n○ 확정급여채무의 현재가치 계산에 적용할 할인율은 연 10%이다.\n○ 20×1년도의 당기근무원가 발생액은 ￦240,000이고, 20×1년 말 퇴직한 종업원에게 ￦100,000을 사외적립자산에서 지급하였다.\n○ 20×1년 말 현금 ￦300,000을 사외적립자산에 출연하였다.\n○ 20×1년 말 현재 확정급여채무의 현재가치와 사외적립자산의 공정가치는 각각 ￦1,200,000과 ￦850,000이다.",
  choices:["￦30,000 감소","￦10,000 감소","￦10,000 증가","￦30,000 증가","￦40,000 증가"],
  answer:4, status:"clear", note:"" },
{ id:"hg2022-25", subject:"회계학개론", year:2022, no:25, law:"회계학개론", unit:"제조원가의 흐름", kind:"calc",
  stem:"(주)세무의 20×1년 1월의 재고자산 자료는 다음과 같다.\n직접재료 / 재공품 / 제품\n20×1.1.1. ￦80,000 / ￦100,000 / ￦125,000\n20×1.1.31. 60,000 / 75,000 / 80,000\n20×1년 1월 중 직접재료의 매입액은 ￦960,000이고, 직접노무원가는 제조간접원가의 40%이다. 1월의 매출액은 ￦2,500,000이며, 매출총이익률은 16%이다. 20×1년 1월의 기본원가(prime costs)는?",
  choices:["￦1,050,000","￦1,160,000","￦1,280,000","￦1,380,000","￦1,430,000"],

{ id:"hg2022-26", subject:"회계학개론", year:2022, no:26, law:"회계학개론", unit:"종합원가계산", kind:"calc",
  stem:"(주)세무는 종합원가계산제도를 채택하고 있다. 직접재료는 공정의 초기에 전량 투입되며, 전환원가(conversion costs)는 공정 전반에 걸쳐 균등하게 발생한다. 당기 제조활동과 관련하여 가중평균법과 선입선출법에 의해 각각 계산한 직접재료원가와 전환원가의 완성품환산량은 다음과 같다.\n직접재료원가 완성품환산량 / 전환원가 완성품환산량\n가중평균법 3,000단위 / 2,400단위\n선입선출법 2,000단위 / 1,800단위\n기초재공품의 전환원가 완성도는?",
  choices:["20%","30%","40%","50%","60%"],
  answer:5, status:"clear", note:"" },
{ id:"hg2022-27", subject:"회계학개론", year:2022, no:27, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 제조부문인 절단부문과 조립부문을 통해 제품을 생산하고 있으며, 동력부문을 보조부문으로 두고 있다. 각 부문에서 발생한 제조간접원가 및 각 제조부문의 전력 실제사용량과 최대사용가능량에 관한 자료는 다음과 같다.\n구분 / 동력부문 / 절단부문 / 조립부문 / 합계\n변동제조간접원가 ￦240,000 / ￦400,000 / ￦650,000 / ￦1,290,000\n고정제조간접원가 300,000 / 700,000 / 750,000 / 1,750,000\n실제사용량 - / 500kW / 300kW / 800kW\n최대사용가능량 - / 600kW / 600kW / 1,200kW\n절단부문에 배부되는 동력부문의 원가는 이중배분율법을 적용하는 경우, 단일배분율법과 비교하여 얼마만큼 차이가 발생하는가?",
  choices:["￦30,000","￦32,500","￦35,000","￦37,500","￦40,000"],
  answer:4, status:"clear", note:"" },
{ id:"hg2022-28", subject:"회계학개론", year:2022, no:28, law:"회계학개론", unit:"활동기준원가계산", kind:"concept",
  stem:"활동기준원가계산(ABC)에 관한 설명으로 옳지 않은 것은?",
  choices:["제조기술이 발달되고 공장이 자동화되면서 증가되는 제조간접원가를 정확하게 제품에 배부하고 효과적으로 관리하기 위한 원가계산기법이다.","설비유지원가(facility sustaining cost)는 원가동인을 파악하기가 어려워 자의적인 배부기준을 적용하게 된다.","제품의 생산과 서비스 제공을 위해 수행하는 다양한 활동을 분석하고 파악하여, 비부가가치활동을 제거하거나 감소시킴으로써 원가를 효율적으로 절감하고 통제할 수 있다.","원가를 소비하는 활동보다 원가의 발생행태에 초점을 맞추어 원가를 집계하여 배부하기 때문에 전통적인 원가계산보다 정확한 제품원가 정보를 제공한다.","고객별·제품별로 공정에서 요구되는 활동의 필요량이 매우 상이한 경우에 적용하면 큰 효익을 얻을 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hg2022-29", subject:"회계학개론", year:2022, no:29, law:"회계학개론", unit:"결합원가계산", kind:"calc",
  stem:"(주)세무는 원유를 투입하여 결합제품 A를 1,000단위, B를 1,500단위 생산하였다. 분리점 이전에 발생한 직접재료원가는 ￦1,690,000, 직접노무원가는 ￦390,000, 제조간접원가는 ￦520,000이다. 제품 A와 B는 분리점에 시장이 형성되어 있지 않아서 추가가공한 후에 판매하였는데, 제품 A는 추가가공원가 ￦850,000과 판매비 ￦125,000이 발생하며, 제품 B는 추가가공원가 ￦1,100,000과 판매비 ￦200,000이 발생하였다. 추가가공 후 최종 판매가치는 제품 A가 단위당 ￦2,000이며, 제품 B는 단위당 ￦3,000이다. 균등매출총이익률법에 따라 결합원가를 각 제품에 배부할 때, 제품 A에 배부되는 결합원가는?",
  choices:["￦525,000","￦550,000","￦554,000","￦600,000","￦604,000"],
  answer:2, status:"clear", note:"" },
{ id:"hg2022-30", subject:"회계학개론", year:2022, no:30, law:"회계학개론", unit:"표준원가계산", kind:"calc",
  stem:"(주)세무는 20×1년에 영업을 시작하였으며, 표준원가계산제도를 적용하고 있다. 20×2년의 제품 단위당 표준원가는 20×1년과 동일하게 다음과 같이 설정하였다. 직접재료는 공정의 초기에 전량 투입되며, 전환원가(conversion costs)는 공정 전반에 걸쳐 균등하게 발생한다.\n직접재료원가 4kg × ￦6 = ￦24\n직접노무원가 2시간 × ￦4 = 8\n변동제조간접원가 2시간 × ￦4 = 8\n고정제조간접원가 2시간 × ￦5 = 10\n합계 ￦50\n(주)세무의 20×2년 기초재공품은 1,000단위(완성도 40%), 당기 완성량은 5,500단위이며, 기말재공품은 700단위(완성도 60%)이다. 표준종합원가계산 하에서 완성품원가와 기말재공품원가는? (단, 원가흐름은 선입선출법을 가정하고, 공손 및 감손은 없다.)",
  choices:["완성품원가 ￦225,000 / 기말재공품원가 ￦21,000","완성품원가 ￦240,600 / 기말재공품원가 ￦27,720","완성품원가 ￦240,600 / 기말재공품원가 ￦28,420","완성품원가 ￦275,000 / 기말재공품원가 ￦21,000","완성품원가 ￦275,000 / 기말재공품원가 ￦27,720"],
  answer:5, status:"clear", note:"" },
{ id:"hg2022-31", subject:"회계학개론", year:2022, no:31, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 20×1년에 영업을 시작하였으며, 정상원가계산을 적용하고 있다. 다음은 (주)세무의 20×1년 배부차이를 조정하기 전의 제조간접원가 계정과 기말재공품, 기말제품 및 매출원가에 관한 자료이다.\n제조간접원가 630,000(실제발생액)\n기말재공품 / 기말제품 / 매출원가\n직접재료원가 ￦225,000 / ￦250,000 / ￦440,000\n직접노무원가 125,000 / 150,000 / 210,000\n제조간접원가(예정배부) 150,000 / 200,000 / 250,000\n합계 ￦500,000 / ￦600,000 / ￦900,000\n제조간접원가의 배부차이를 매출원가조정법으로 회계처리하는 경우, 총원가비례배분법에 비해 당기순이익이 얼마나 증가(혹은 감소)하는가?",
  choices:["￦16,500 감소","￦13,500 감소","￦13,500 증가","￦16,500 증가","￦30,000 증가"],

{ id:"hg2022-32", subject:"회계학개론", year:2022, no:32, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 제품 A와 B를 생산하고 있으며, 제품 생산에 관한 자료는 다음과 같다.\n구분 / 제품A / 제품B\n제품 단위당 공헌이익 ￦30 / ￦50\n제품 단위당 기계시간 0.5시간 / 1시간\n제품 단위당 노무시간 1.5시간 / 2시간\n월간 이용가능한 기계시간은 1,000시간, 노무시간은 2,400시간으로 제한되어 있다. 월간 고정원가는 ￦20,000으로 매월 동일하고, 제품 A와 B의 시장수요는 무한하다. (주)세무가 이익을 극대화하기 위해서는 제품 A와 B를 각각 몇 단위 생산해야 하는가?",
  choices:["제품A 0단위 / 제품B 1,000단위","제품A 800단위 / 제품B 500단위","제품A 800단위 / 제품B 600단위","제품A 900단위 / 제품B 500단위","제품A 1,600단위 / 제품B 0단위"],
  answer:3, status:"clear", note:"" },
{ id:"hg2022-33", subject:"회계학개론", year:2022, no:33, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 단일제품을 생산·판매하고 있다. 제품 단위당 판매가격은 ￦7,500으로 매년 일정하게 유지되고, 모든 제품은 생산된 연도에 전량 판매된다. 최근 2년간 생산량과 총제조원가에 관한 자료는 다음과 같다. 20×2년 1월 1일에 인력조정 및 설비투자가 있었고, 이로 인해 원가구조가 달라진 것으로 조사되었다.\n기간 / 생산량 / 총제조원가\n20×1년 상반기 200단위 / ￦1,200,000\n20×1년 하반기 300 / 1,650,000\n20×2년 상반기 350 / 1,725,000\n20×2년 하반기 400 / 1,900,000\n다음 중 옳은 것은? (단, 20×2년 초의 인력조정 및 설비투자 이외에 원가행태를 변화시키는 요인은 없으며, 고저점법으로 원가함수를 추정한다.)",
  choices:["20×2년의 영업레버리지도는 2.5이다.","20×2년의 안전한계율은 약 33%이다.","20×1년에 비해 20×2년의 영업레버리지도는 증가하였다.","20×1년에 비해 20×2년에 연간 총고정제조원가는 ￦200,000 증가하였다.","20×1년에 비해 20×2년의 연간 손익분기점 판매량은 50단위 증가하였다."],
  answer:5, status:"clear", note:"" },
{ id:"hg2022-34", subject:"회계학개론", year:2022, no:34, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 A부품을 매년 1,000단위씩 자가제조하여 제품생산에 사용하고 있다. A부품을 연간 1,000단위 생산할 경우 단위당 원가는 다음과 같다.\n구분 / 단위당 원가\n변동제조원가 ￦33\n고정제조간접원가 5\n합계 ￦38\n최근에 외부의 공급업자로부터 A부품 1,000단위를 단위당 ￦35에 납품하겠다는 제안을 받았다. A부품을 전량 외부에서 구입하면 연간 총고정제조간접원가 중 ￦400이 절감되며, A부품 생산에 사용하던 설비를 다른 부품생산에 활용함으로써 연간 ￦200의 공헌이익을 추가로 얻을 수 있다. (주)세무가 외부 공급업자의 제안을 수락하면, A부품을 자가제조할 때보다 연간 영업이익은 얼마나 증가(혹은 감소)하는가?",
  choices:["￦1,400 감소","￦1,400 증가","￦3,600 감소","￦3,600 증가","￦4,800 감소"],
  answer:1, status:"clear", note:"" },
{ id:"hg2022-35", subject:"회계학개론", year:2022, no:35, law:"회계학개론", unit:"표준원가계산", kind:"calc",
  stem:"(주)세무는 표준원가계산제도를 사용하고 있으며, 매월 동일한 표준원가를 적용한다. 20×1년 5월과 6월의 실제 제품 생산량은 각각 100단위와 120단위이었고, 다음과 같은 조업도차이가 발생했다.\n기간 / 조업도차이\n5월 ￦1,000(불리)\n6월 ￦600(불리)\n(주)세무의 고정제조간접원가 월간 예산은?",

{ id:"hg2022-36", subject:"회계학개론", year:2022, no:36, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 최근에 신제품을 개발하여 처음으로 10단위를 생산했으며, 추가로 10단위를 생산하는데 필요한 직접노무시간은 처음 10단위 생산에 소요된 직접노무시간의 60%인 것으로 나타났다. (주)세무의 신제품 생산에 누적평균시간 학습모형이 적용된다면 학습률은?",

{ id:"hg2022-37", subject:"회계학개론", year:2022, no:37, law:"회계학개론", unit:"책임회계·대체가격", kind:"calc",
  stem:"(주)세무는 분권화된 사업부 A와 B를 각각 이익중심점으로 설정하여 운영하고 있다. 현재 사업부A는 부품X를 매월 40,000단위 생산하여 단위당 ￦50에 전량 외부시장에 판매하고 있다. 사업부A의 부품X 생산에 관한 원가자료는 다음과 같다.\n구분 / 금액/단위\n단위당 변동제조원가 ￦35\n월간 최대생산능력 50,000단위\n사업부B는 최근에 신제품을 개발했으며, 신제품 생산을 위해서 사업부A에 성능이 향상된 부품Xplus를 매월 20,000단위 공급해 줄 것을 요청했다. 사업부A가 부품Xplus 1단위를 생산하기 위해서는 부품X 2단위를 포기해야 하며, 부품X의 변동제조원가에 단위당 ￦20의 재료원가가 추가로 투입된다. 부품X의 외부 수요량은 매월 40,000단위로 제한되어 있다. 사업부A가 현재의 영업이익을 감소시키지 않기 위해 사업부B에 요구해야 할 부품Xplus의 단위당 최소대체가격은?",
  choices:["￦66.25","￦75.50","￦77.50","￦80.25","￦85.50"],
  answer:3, status:"clear", note:"" },
{ id:"hg2022-38", subject:"회계학개론", year:2022, no:38, law:"회계학개론", unit:"제조원가의 흐름", kind:"calc",
  stem:"(주)세무는 상품매매업을 영위하고 있으며, 20×2년 1분기의 매출액 예산은 다음과 같다.\n구분 / 1월 / 2월 / 3월\n매출액 ￦100,000 / ￦120,000 / ￦150,000\n매출원가율 80% / 75% / 70%\n(주)세무의 20×1년 말 재무상태표에 표시된 상품재고는 ￦10,000이고, 매입채무는 ￦42,400이다. (주)세무는 20×2년에 매월 기말재고로 다음 달 예상 매출원가의 10%를 보유한다. 매월 상품매입은 현금매입 40%와 외상매입 60%로 구성되며, 외상매입대금은 그 다음 달에 모두 지급한다. 상품매입으로 인한 2월의 현금지출예산은?",
  choices:["￦74,000","￦84,000","￦85,500","￦91,500","￦95,000"],
  answer:2, status:"clear", note:"" },
{ id:"hg2022-39", subject:"회계학개론", year:2022, no:39, law:"회계학개론", unit:"표준원가계산", kind:"calc",
  stem:"(주)세무는 표준원가계산제도를 채택하고 있으며, 상호 대체가능한 원재료 A와 B를 이용하여 제품을 생산한다. 원재료 투입량과 표준가격은 다음과 같다.\n원재료 / 실제투입량 / 표준투입량 / kg당 표준가격\nA 150kg / 120kg / ￦30\nB 150kg / 180kg / ￦20\n재료원가 차이분석에 관한 설명으로 옳은 것은? (단, 표준투입량은 실제생산량에 허용된 원재료 투입량을 의미하며, 원가차이의 유리(혹은 불리) 여부도 함께 판단할 것)",
  choices:["원재료 A와 B에서 발생한 수량차이(능률차이)는 총 ￦300 유리하다.","배합차이로 인해 재료원가가 예상보다 ￦600 더 발생했다.","배합차이로 인해 원재료 A의 원가는 예상보다 ￦900 적게 발생했다.","수율차이(순수수량차이)는 발생하지 않았다.","원재료 A와 B의 실제투입량 합계가 300kg에서 400kg으로 증가하면 유리한 수율차이가 발생한다."],
  answer:4, status:"clear", note:"" },
{ id:"hg2022-40", subject:"회계학개론", year:2022, no:40, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 제품 A와 B를 생산·판매하고 있다. 제품별 판매 및 원가에 관한 자료는 다음과 같다.\n구분 / 제품A / 제품B / 합계\n판매량 ? / ? / 100단위\n매출액 ￦200,000 / ￦300,000 / ￦500,000\n변동비 ? / ? / ￦375,000\n고정비 ￦150,000\n제품A의 단위당 판매가격은 ￦4,000이다. 손익분기점에 도달하기 위한 제품B의 판매량은? (단, 매출배합은 일정하다고 가정한다.)",
  choices:["55단위","60단위","80단위","85단위","90단위"],
  answer:2, status:"clear", note:"" },

{ id:"hs2022-41", subject:"행정소송법", year:2022, no:41, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송법에 관한 설명으로 옳은 것은?",
  choices:["공공단체의 기관은 법령에 의하여 행정권한의 위탁을 받은 경우에도 행정청에 포함되지 않는다.","기관소송은 헌법재판소법 제2조의 규정에 의하여 헌법재판소의 관장사항으로 되는 소송도 포함한다.","특정의 장소에 관계되는 처분등에 대한 취소소송은 그 장소의 소재지를 관할하는 행정법원에 이를 제기할 수 있다.","수인에 대한 청구가 처분등의 취소청구와 관련되지 않는 청구인 경우에도 그 수인은 취소소송의 공동소송인이 될 수 있다.","행정청의 재량에 속하는 처분은 재량권의 남용이 있더라도 법원은 이를 취소할 수 없다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2022-42", subject:"행정소송법", year:2022, no:42, law:"행정소송법", unit:"무효등확인소송", kind:"concept",
  stem:"행정소송법상 취소소송에 관한 규정 중 무효등 확인소송에는 준용되나 부작위위법확인소송에는 준용되지 않는 것은?",
  choices:["처분변경으로 인한 소의 변경","재판관할","제3자의 소송참가","공동소송","행정청의 소송참가"],
  answer:1, status:"clear", note:"" },
{ id:"hs2022-43", subject:"행정소송법", year:2022, no:43, law:"행정소송법", unit:"민중소송·기관소송", kind:"concept",
  stem:"행정소송법상 기관소송에 관한 설명으로 옳은 것은?",
  choices:["처분의 취소를 구하는 취지의 소송일지라도 취소소송에 관한 제소기간의 규정은 준용되지 않는다.","법률에 정함이 없는 경우에도 정당한 이익이 있으면 제기할 수 있다.","국가기관과 지방자치단체 간에 권한의 유무 또는 범위에 관하여 다툼이 있을 때에 제기하는 소송이다.","공공단체의 기관이 법률에 위반되는 행위를 한 때에 직접 자기의 법률상 이익과 관계없이 그 시정을 구하기 위하여 제기하는 소송이다.","교육·학예에 관한 시·도의회의 재의결에 대하여 교육감이 대법원에 제기하는 소송은 기관소송의 일종이다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2022-44", subject:"행정소송법", year:2022, no:44, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송법 규정이다. ( )에 들어갈 숫자로 옳은 것은?\n이 법에 의한 기간의 계산에 있어서 국외에서의 소송행위추완에 있어서는 그 기간을 14일에서 ( ㄱ )일로, 제3자에 의한 재심청구에 있어서는 그 기간을 30일에서 ( ㄴ )일로, 소의 제기에 있어서는 그 기간을 60일에서 ( ㄷ )일로 한다.",
  choices:["ㄱ: 30, ㄴ: 60, ㄷ: 90","ㄱ: 30, ㄴ: 60, ㄷ: 180","ㄱ: 30, ㄴ: 90, ㄷ: 180","ㄱ: 60, ㄴ: 60, ㄷ: 90","ㄱ: 60, ㄴ: 90, ㄷ: 180"],

{ id:"hs2022-45", subject:"행정소송법", year:2022, no:45, law:"행정소송법", unit:"행정소송의 종류·한계", kind:"concept",
  stem:"행정소송법상 명시되어 있는 행정소송을 모두 고른 것은?\nㄱ. 무효등 확인소송 ㄴ. 부작위위법확인소송 ㄷ. 예방적 부작위청구소송 ㄹ. 당사자소송",

  answer:4, status:"clear", note:"" },
{ id:"hs2022-46", subject:"행정소송법", year:2022, no:46, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송법상 준용규정에 관한 설명으로 옳지 않은 것은?",
  choices:["행정소송에 관하여 행정소송법에 특별한 규정이 없는 사항에 대하여는 법원조직법과 민사소송법 및 민사집행법의 규정을 준용한다.","취소소송에 참가한 행정청에 대하여는 민사소송법 제76조(참가인의 소송행위)의 규정을 준용한다.","취소소송에서의 소의 변경에 관한 규정(제21조)은 부작위위법확인소송을 취소소송으로 변경하는 경우에 준용한다.","취소소송에서의 피고적격에 관한 규정은 무효등 확인소송의 경우에 준용한다.","취소소송에서의 행정심판과의 관계에 관한 규정은 무효등 확인소송의 경우에 준용한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2022-47", subject:"행정소송법", year:2022, no:47, law:"행정소송법", unit:"민중소송·기관소송", kind:"concept",
  stem:"행정소송법상 민중소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["민중소송은 주관적 소송이다.","민중소송으로써 처분등의 취소를 구하는 소송에는 그 성질에 반하지 아니하는 한 취소소송에 관한 규정을 준용한다.","「지방자치법」상 주민소송은 민중소송에 해당하지 않는다.","당사자소송에 관한 규정은 민중소송에 준용될 수 없다.","「공직선거법」제222조의 선거소송은 민중소송에 해당하지 않는다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2022-48", subject:"행정소송법", year:2022, no:48, law:"행정소송법", unit:"선결문제", kind:"concept",
  stem:"행정소송법상 처분등의 효력 유무 또는 존재 여부가 민사소송의 선결문제로 되어 당해 민사소송의 수소법원이 이를 심리·판단하는 경우에 준용되는 취소소송에 관한 규정이 아닌 것은?",
  choices:["행정청의 소송참가에 관한 규정","행정심판기록의 제출명령에 관한 규정","제3자의 소송참가에 관한 규정","직권심리에 관한 규정","소송비용에 관한 재판의 효력에 관한 규정"],
  answer:3, status:"clear", note:"" },
{ id:"hs2022-49", subject:"행정소송법", year:2022, no:49, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"항고소송의 대상에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["조례는 집행행위의 개입 없이도 그 자체로서 직접 국민의 구체적인 권리의무에 영향을 미치는 법률상 효과를 발생하는 경우에도 항고소송의 대상이 되지 아니한다.","국회의원의 제명처분은 항고소송의 대상이 되지 아니한다.","공법상의 구체적인 법률관계가 아닌 사실관계에 관한 확인을 구하는 것은 항고소송의 대상이 되지 아니한다.","공정거래위원회의 고발조치는 항고소송의 대상이 아니다.","행정행위의 부관 중 부담은 항고소송의 대상이 될 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2022-50", subject:"행정소송법", year:2022, no:50, law:"행정소송법", unit:"재판관할", kind:"concept",
  stem:"행정소송법상 재판관할에 관한 설명으로 옳지 않은 것은?",
  choices:["국가의 사무를 위탁받은 공공단체를 피고로 하여 취소소송을 제기하는 경우 대법원소재지를 관할하는 행정법원에 제기할 수 있다.","중앙행정기관을 피고로 하여 취소소송을 제기하는 경우 대법원소재지를 관할하는 행정법원에 제기할 수 있다.","취소소송의 제1심관할법원은 원고의 소재지를 관할하는 행정법원으로 한다.","중앙행정기관의 부속기관을 피고로 하여 취소소송을 제기하는 경우 대법원소재지를 관할하는 행정법원에 제기할 수 있다.","취소소송의 재판관할에 관한 규정을 당사자소송에 준용하는 경우, 국가 또는 공공단체가 피고인 때에는 관계행정청의 소재지를 피고의 소재지로 본다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2022-51", subject:"행정소송법", year:2022, no:51, law:"행정소송법", unit:"원처분주의·재결주의", kind:"concept",
  stem:"행정심판의 재결을 거쳐 취소소송을 제기하는 경우에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["지방노동위원회의 처분에 대한 중앙노동위원회의 재심판정에 불복하려면 중앙노동위원회의 재심판정을 대상으로 취소소송을 제기하여야 한다.","재결에 대한 취소소송은 재결 자체에 고유한 위법이 있음을 이유로 하는 경우에 제기할 수 있다.","원처분의 상대방이 아닌 제3자가 행정심판을 청구하여 재결청이 원처분을 취소하는 형성재결을 한 경우에 원처분의 상대방이 그 재결의 취소를 구하는 것은 원처분에 없는 재결 고유의 위법을 주장하는 것이 된다.","행정심판청구가 부적법하지 않음에도 각하한 재결은 원처분에 없는 고유한 하자가 있는 경우에 해당한다.","행정청이 영업자에게 제재처분을 한 후 그 처분을 영업자에게 유리하게 변경하는 처분을 하였다면, 변경처분으로 유리하게 변경된 제재가 위법하다 하여 그 취소를 구하는 경우 취소소송의 대상은 변경된 내용의 당초 처분이 아니라 변경처분이다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2022-52", subject:"행정소송법", year:2022, no:52, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"취소소송에서의 소의 이익에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정청이 공무원에 대하여 새로운 직위해제사유에 기하여 직위해제처분을 한 경우, 그 공무원에게는 이전의 직위해제처분의 취소를 구할 소의 이익이 인정된다.","건물의 신축과정에서 피해를 입은 인접주택 소유자는 신축건물에 대한 사용검사(사용승인)처분의 취소를 구할 소의 이익이 있다.","해임처분 취소소송 계속 중 임기가 만료된 경우에도 그 취소로 해임처분일부터 임기만료일까지 기간에 대한 보수지급을 구할 수 있는 경우라면 해임처분의 취소를 구할 소의 이익이 인정된다.","가중 제재처분 규정이 있는 의료법에 의해 의사면허자격정지처분을 받은 경우 자격정지기간이 지난 후에는 의사면허자격정지처분의 취소를 구할 소의 이익이 인정되지 아니한다.","치과의사국가시험에 불합격한 후 새로 실시된 국가시험에 합격한 경우에도 명예 등의 인격적 이익이 침해되었음을 이유로 불합격처분의 취소를 구할 소의 이익이 인정된다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2022-53", subject:"행정소송법", year:2022, no:53, law:"행정소송법", unit:"제소기간", kind:"concept",
  stem:"취소소송의 제소기간에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송은 처분등이 있음을 안 날로부터 90일 이내에 제기하여야 하며, 법원은 직권으로 이 기간을 늘이거나 줄일 수 없다.","조세심판에서의 재결청의 재조사결정에 따른 행정소송의 제소기간의 기산점은 후속처분의 통지를 받은 날이다.","처분등이 있음을 안 날로부터 90일, 처분등이 있은 날로부터 1년 중 어느 하나의 기간이 만료되면 제소기간은 종료된다.","고시에 의하여 불특정다수인을 대상으로 행정처분을 하는 경우, 그 행정처분에 이해관계를 갖는 자는 고시가 있었다는 사실을 현실적으로 안 날에 행정처분이 있음을 알았다고 보아야 한다.","제소기간의 준수 여부는 법원의 직권조사사항이다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2022-54", subject:"행정소송법", year:2022, no:54, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"신청에 대한 행정청의 거부행위가 취소소송의 대상이 되는지 여부에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["거부행위가 취소소송의 대상이 되기 위해 필요한 신청권에는 조리상의 신청권도 포함된다.","거부행위가 취소소송의 대상이 되기 위해 필요한 신청권은 신청인이 그 신청에 따른 단순한 응답을 받을 권리를 넘어서 신청의 인용이라는 만족적 결과를 얻을 권리를 의미하는 것은 아니다.","본인의 의사와 무관하게 주민등록번호가 유출된 사람의 주민등록번호변경신청에 대한 구청장의 거부행위는 처분에 해당한다.","도시계획구역 내 토지 등을 소유하고 있는 주민의 도시시설계획 변경신청에 대한 거부행위는 처분에 해당한다.","기간제로 임용되어 임용기간이 만료된 조교수에 대하여 재임용을 거부하는 취지로 한 임용기간만료의 통지는 항고소송의 대상이 되는 행정처분에 해당하지 않는다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2022-55", subject:"행정소송법", year:2022, no:55, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"행정소송법상 소의 변경에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송을 제기하였다가 나중에 당사자소송으로 변경하는 경우, 당초의 취소소송이 적법한 기간 내에 제기된 경우에는 당사자소송의 제소기간을 준수한 것으로 본다.","무효등 확인소송이나 부작위위법확인소송을 취소소송 또는 당사자소송으로 변경할 수 없다.","동일한 행정처분에 대하여 무효확인의 소를 제기하였다가 그 후 그 처분의 취소를 구하는 소를 추가적으로 병합한 경우, 주된 청구인 무효확인의 소가 취소소송의 제소기간 내에 제기되었다면 추가로 병합된 취소청구의 소도 적법하게 제기된 것으로 본다.","청구취지를 교환적으로 변경하여 종전의 소가 취하되고 새로운 소가 제기된 것으로 보게 되는 경우에 새로운 소에 대한 제소기간의 준수는 원칙적으로 소의 변경이 있은 때를 기준으로 하여 판단된다.","청구취지를 추가한 경우 추가된 청구취지에 대한 제소기간의 준수는 원칙적으로 청구취지의 추가·변경 신청이 있는 때를 기준으로 판단하여야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2022-56", subject:"행정소송법", year:2022, no:56, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"판례상 항고소송의 대상인 처분으로 인정된 것을 모두 고른 것은?\nㄱ. 진실·화해를 위한 과거사정리위원회의 진실규명결정\nㄴ. 「건축법」상 건축협의의 취소\nㄷ. 강원도지사의 혁신도시 최종입지선정행위\nㄹ. 보건복지부고시인 약제급여·비급여목록 및 급여상한금액표",
  choices:["ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],
  answer:4, status:"clear", note:"" },
{ id:"hs2022-57", subject:"행정소송법", year:2022, no:57, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 항고소송에서 제3자의 원고적격이 부정된 것은?",
  choices:["임대주택 분양전환승인처분에 대하여 취소를 구하는 임차인대표회의","약사들에 대한 한약조제시험 합격처분의 무효확인을 구하는 한의사","환경영향평가 대상사업 허가처분의 무효확인을 구하는 당해 환경영향평가 대상지역 안의 주민","시외버스를 시내버스로 전환하는 사업계획변경인가처분으로 인하여 노선이 중복되어 그 인가처분의 취소를 구하는 기존의 시내버스운송업자","공장설립으로 수질오염발생 우려가 있는 취수장에서 물을 공급받는 주민이 당해 공장설립 승인처분의 취소를 구하는 경우"],
  answer:2, status:"clear", note:"" },
{ id:"hs2022-58", subject:"행정소송법", year:2022, no:58, law:"행정소송법", unit:"소송요건", kind:"concept",
  stem:"취소소송의 제기요건에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["「하수도법」에 의하여 기존의 하수도정비기본계획을 변경하여 광역 하수종말처리시설(공공하수처리시설)을 설치하는 내용으로 수립한 하수도정비기본계획은 항고소송의 대상이 되지 아니한다.","「국가공무원법」에 따른 징계처분에 대하여는 소청심사위원회의 심사 결정을 거치지 않더라도 취소소송을 제기할 수 있다.","필요적 행정심판전치주의가 적용되는 경우, 동종사건에 관하여 이미 기각재결이 있은 때에도 행정심판을 제기하지 않고 바로 취소소송을 제기할 수는 없다.","취소소송은 구술로도 제기할 수 있다.","행정심판을 거친 후 취소소송을 제기하는 경우에는 재결서 정본을 발송한 날이 제소기간의 기산점이 된다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2022-59", subject:"행정소송법", year:2022, no:59, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"\"취소소송은 처분등의 취소를 구할 법률상 이익이 있는 자가 제기할 수 있다.\"라는 행정소송법 규정에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["당해 처분의 근거 법률에 의하여 보호되는 직접적이고 구체적인 이익이 있는 경우 법률상 이익이 인정될 수 있다.","원고적격은 사실심 변론종결시는 물론 상고심에서도 존속하여야 하고 이를 흠결하면 부적법한 소가 된다.","대학교 총학생회는 교육부장관의 해당 대학교 학교법인의 임시이사선임처분의 취소를 구할 법률상 이익이 있다.","처분의 상대방이 위명(僞名)을 사용한 사람인 경우에는 처분의 취소를 구할 법률상 이익이 인정되지 않는다.","헌법재판소에 따르면, 일반법규에서 경쟁자를 보호하는 규정을 별도로 두고 있지 않은 경우에도 기본권인 경쟁의 자유가 바로 행정청의 지정행위의 취소를 구할 법률상의 이익이 된다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2022-60", subject:"행정소송법", year:2022, no:60, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"행정소송법상 집행정지에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["공공복리에 중대한 영향을 미칠 우려가 있을 때에는 허용되지 아니한다.","처분의 효력정지는 처분등의 집행 또는 절차의 속행을 정지함으로써 목적을 달성할 수 있는 경우에는 허용되지 아니한다.","처분등이나 그 집행 또는 절차의 속행으로 인하여 생길 중대한 손해를 예방하기 위하여 긴급한 필요가 있을 때에 인정된다.","집행정지의 결정이 확정된 후 그 정지사유가 없어진 경우 직권에 의하여 결정으로써 집행정지의 결정을 취소할 수 있다.","신청인의 본안청구가 이유 없음이 명백할 때에는 집행정지를 명할 수 없다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2022-61", subject:"행정소송법", year:2022, no:61, law:"행정소송법", unit:"소송참가", kind:"concept",
  stem:"A가 관할 행정청 B에 대하여 「여객자동차운수사업법」에 따른 운수사업면허를 신청하여 B가 면허처분을 하였는데, 이에 대하여 경업자 C가 면허처분취소소송을 제기하였다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["절차의 위법을 이유로 취소판결이 확정된 경우 B는 판결의 취지에 따라 다시 이전의 신청에 대한 처분을 할 필요가 없다.","A가 소송에 참가할 경우, 면허처분을 취소하는 확정판결은 A에 대해서는 효력이 없다.","법원이 직권으로 A를 소송에 참가시키는 결정을 하고자 할 때에는 미리 A, B, C의 의견을 들어야 한다.","기각판결이 확정된 경우 그 판결은 B를 기속한다.","소송 계속 중 B가 면허처분을 직권으로 취소하더라도 원칙적으로 소의 이익이 소멸하지 않는다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2022-62", subject:"행정소송법", year:2022, no:62, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"행정소송법상 소의 변경(제21조)에 관한 설명으로 옳지 않은 것은?",
  choices:["청구의 기초에 변경이 없어야 소의 변경이 가능하다.","법원이 소의 변경을 허가하는 경우 피고를 달리하게 될 때에는 새로이 피고로 될 자의 의견을 들어야 한다.","소의 변경 허가결정에 대하여는 즉시항고할 수 있다.","원고의 신청이 없더라도 법원은 직권에 의하여 소의 변경을 결정할 수 있다.","사실심의 변론종결시까지 소의 변경이 가능하다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2022-63", subject:"행정소송법", year:2022, no:63, law:"행정소송법", unit:"무효등확인소송", kind:"concept",
  stem:"무효등 확인소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["무효등 확인소송에서는 처분의 존재 여부가 심리의 대상이 될 수 없다.","작위의무확인소송은 무효등 확인소송의 일종으로 허용된다.","무효확인소송에서는 그 제기요건으로 보충성이 요구되므로, 행정처분의 무효를 전제로 한 이행소송 등과 같은 직접적인 구제수단이 있는지 여부를 따질 필요가 있다.","처분의 당연무효를 선언하는 의미에서 그 취소를 구하는 행정소송을 제기한 경우 제소기간의 제한이 없다.","행정처분의 무효확인을 구하는 청구에는 특별한 사정이 없는 한 그 처분의 취소를 구하는 취지까지도 포함되어 있다고 볼 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2022-64", subject:"행정소송법", year:2022, no:64, law:"행정소송법", unit:"피고적격", kind:"concept",
  stem:"항고소송의 피고적격에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송은 다른 법률에 특별한 규정이 없는 한 그 처분등을 행한 행정청을 피고로 한다.","처분등이 있은 뒤에 그 처분등에 관계되는 권한이 다른 행정청에 승계된 때에는 이를 승계한 행정청을 피고로 한다.","대리기관이 대리관계를 표시하고 피대리 행정청을 대리하여 행정처분을 한 때에는 피대리 행정청이 피고로 되어야 한다.","사인은 법령에 의하여 행정권한의 위탁을 받은 경우에도 취소소송의 피고가 될 수 없다.","지방법무사회는 무효등 확인소송의 피고가 될 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2022-65", subject:"행정소송법", year:2022, no:65, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"행정소송법상 처분등에 대한 집행정지가 인정되는 소송을 모두 고른 것은?\nㄱ. 무효등 확인소송 ㄴ. 부작위위법확인소송 ㄷ. 당사자소송",
  choices:["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:1, status:"clear", note:"" },
{ id:"hs2022-66", subject:"행정소송법", year:2022, no:66, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"당사자소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["당사자소송의 피고는 행정청이 된다.","공무원의 지위를 확인하는 소송은 당사자소송의 절차에 따라야 한다.","당사자소송에 대하여는 민사집행법상 가처분에 관한 규정이 준용되지 않는다.","사인을 피고로 하는 당사자소송은 허용되지 않는다.","토지수용재결이 있은 후 토지소유자가 사업시행자를 피고로 하여 제기하는 보상금증액청구소송은 당사자소송이 아니다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2022-67", subject:"행정소송법", year:2022, no:67, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송법상 행정소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분의 취소소송에서 청구가 기각된 확정판결의 기판력은 그 처분의 무효확인을 구하는 소송에도 미친다.","의무이행소송에 관한 명문의 규정은 없지만 판례는 이를 인정한다.","부작위위법확인소송이란 행정청의 부작위 또는 거부처분이 위법하다는 것을 확인하는 소송이다.","취소소송에는 처분등의 일부 취소 및 적극적 변경을 구하는 소송이 포함된다.","검사의 불기소처분은 항고소송의 대상이 될 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2022-68", subject:"행정소송법", year:2022, no:68, law:"행정소송법", unit:"부작위위법확인소송", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송의 직권심리에 관한 규정은 부작위위법확인소송에 준용된다.","행정청의 응답을 신속하게 하여 부작위 내지 무응답이라는 소극적인 위법상태 제거를 목적으로 한다.","소제기의 전후를 통하여 판결시까지 행정청이 신청에 대하여 소극의 처분을 하여 부작위상태가 해소된 때에는 소의 이익을 상실하게 된다.","행정심판 등 전심절차를 거친 경우 제소기간의 제한을 받지 않는다.","부작위란 행정청이 당사자의 신청에 대하여 상당한 기간내에 일정한 처분을 하여야 할 법률상 의무가 있음에도 불구하고 이를 하지 아니하는 것을 말한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2022-69", subject:"행정소송법", year:2022, no:69, law:"행정소송법", unit:"처분사유의 추가·변경", kind:"concept",
  stem:"취소소송에 있어서 처분사유의 추가·변경에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["그 허용 기준이 되는 처분사유의 동일성 유무는 사회적 사실관계의 동일성이 아니라 법적으로 평가할 때 동일한지 여부에 따라 결정된다.","행정청은 처분 이후에 발생한 새로운 사유를 들어 처분사유를 추가·변경할 수는 없다.","처분서에 다소 불명확하게 기재하였던 당초 처분사유를 좀 더 구체적으로 설명한 것은 새로운 처분사유를 추가로 주장한 것이 아니다.","행정소송법은 처분사유의 추가·변경에 관하여 명문의 규정을 두고 있지 않다.","처분사유의 추가·변경은 사실심 변론종결시까지만 허용된다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2022-70", subject:"행정소송법", year:2022, no:70, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"취소소송의 심리 및 판결에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["직권주의가 가미되어 있다고 하더라도 여전히 변론주의를 기본구조로 한다.","직권조사사항을 제외하고는 취소를 구하는 자가 위법사유에 해당하는 구체적 사실을 먼저 주장하여야 한다.","법원은 필요하다고 인정할 때에는 직권으로 증거조사를 할 수 있다.","법원은 필요하다고 인정할 때에는 당사자가 주장하지 아니하는 사실에 대하여도 판단할 수 있다.","불고불리의 원칙이 적용되지 않으므로 법원은 당사자가 청구한 범위를 넘어서까지 판결을 할 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2022-71", subject:"행정소송법", year:2022, no:71, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"행정소송법상 확정판결의 기속력에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분을 취소하는 확정판결의 기속력은 당사자인 행정청에 대해서만 미친다.","기속력은 판결주문의 전제가 되는 처분등의 구체적 위법사유에 관한 이유 중의 판단에 대하여도 인정된다.","거부처분을 취소하는 판결이 확정된 경우 처분청이 사실심 변론종결 이후의 사유를 내세워 다시 거부처분을 하는 것은 기속력에 저촉된다.","기속력에 저촉되는 행정처분이 당연무효인 것은 아니다.","무효등 확인소송의 기각판결은 기속력이 있다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2022-72", subject:"행정소송법", year:2022, no:72, law:"행정소송법", unit:"재심", kind:"concept",
  stem:"행정소송법상 판결 및 재심청구에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["부적법한 소로서 그 흠을 보정할 수 없는 경우에는 판결로 청구를 기각한다.","취소판결이 확정되면 당사자가 사실심의 변론종결시를 기준으로 그때까지 제출하지 않은 공격방어방법은 그 뒤 다시 동일한 소송을 제기하여 이를 주장할 수 없다.","당사자소송의 인용판결에 대하여 제3자는 확정판결이 있음을 안 날로부터 30일 이내에 재심을 청구할 수 있다.","자기에게 책임있는 사유로 취소소송에 참가하지 못했던 제3자도 판결의 결과에 영향을 미칠 공격 또는 방어방법을 제출하지 못한 때에는 재심을 청구할 수 있다.","무효확인판결이 확정된 날로부터 180일이 지나면 제3자는 재심을 청구할 수 없다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2022-73", subject:"행정소송법", year:2022, no:73, law:"행정소송법", unit:"소송비용", kind:"concept",
  stem:"행정소송법상 소송비용에 관한 설명으로 옳지 않은 것은?",
  choices:["취소소송 계속 중 행정청이 처분등을 취소하여 그 청구가 각하된 경우에 소송비용은 피고의 부담으로 한다.","사정판결을 한 경우 소송비용은 피고의 부담으로 한다.","소송비용에 관한 재판이 확정된 때에는 피고였던 행정청이 소속하는 국가에 효력을 미친다.","소송참가인이었던 행정청이 소속하는 공공단체에는 소송비용 재판의 효력이 미치지 않는다.","소송비용에 관한 행정소송법의 규정은 당사자소송에도 준용된다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2022-74", subject:"행정소송법", year:2022, no:74, law:"행정소송법", unit:"판결 일반", kind:"concept",
  stem:"법령을 위반한 폐기물처리업자 甲에 대하여 A군수가 3개월의 영업정지 처분을 하자 甲은 취소소송을 제기하였다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송을 제기한 때부터 처분의 효력은 정지된다.","3개월의 영업정지 기간이 재량권을 넘는 과도한 것이라면 법원은 적정하다고 인정되는 기간을 초과한 부분에 한하여 처분을 취소하여야 한다.","소송이 제기된 후 A군수가 영업정지 기간을 1개월로 변경한 경우 그 날로부터 60일 이내에 甲은 처분변경으로 인한 소의 변경을 신청할 수 있다.","취소판결이 확정되면 A군수는 판결에 기속되나, 그 밖에 위법한 결과가 있더라도 이를 제거하는 조치를 할 의무는 없다.","재량권 일탈·남용에 해당하는 특별한 사정은 이를 주장하는 甲이 증명하여야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2022-75", subject:"행정소송법", year:2022, no:75, law:"행정소송법", unit:"판결 일반", kind:"concept",
  stem:"행정소송법상 '처분을 취소 또는 변경하는 소송'의 판결에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분이 위법하지는 않더라도 부당하다고 인정할 때에는 일부 취소의 판결을 할 수 있다.","법원은 행정처분 당시 행정청이 알고 있었던 자료만을 종합하여 처분 당시 존재하였던 객관적 사실을 확정하고 그 사실에 기초하여 판단하여야 한다.","하나의 제재처분의 사유가 된 여러 개의 위반행위 중 일부의 위반행위에 대한 제재처분 부분만이 위법하더라도 법원은 제재처분의 가분성에 관계없이 그 전부를 취소하여야 한다.","여러 개의 상이에 대한 국가유공자 요건 비해당결정처분에서 그중 일부 상이에 대해서만 국가유공자 요건이 인정될 경우 법원은 비해당결정처분 전부를 취소하여야 한다.","과세처분취소소송에서 적법하게 부과될 정당한 세액이 산출되는 때에는 그 정당한 세액을 초과하는 부분만 취소하여야 할 것이고 전부를 취소할 것이 아니다."],

{ id:"hs2022-76", subject:"행정소송법", year:2022, no:76, law:"행정소송법", unit:"사정판결", kind:"concept",

  var TRAP_NOTE = {

  /* 시험 회차: 2016년 제53회부터 매년 1씩 증가 */
  var ROUND_OF = (function () {

  var STATUS_LABEL = { clear: "개정영향 없음", note: "참고사항 있음", revised: "2027 개정판" };

  var TOP_SUBJECTS = ["세법학개론", "재정학", "회계학개론", "행정소송법"];

  /* ---------------- state ---------------- */
  var loadedTopSubjects = TOP_SUBJECTS.filter(function (s) {

  function loadedLawsOf(topSubject) {

  var initialLaws = loadedLawsOf(initialTopSubject);
  var state = {

  var STORAGE_KEY = "semusa_study_v1";

  function loadLocal() {
    try {

        }

    } catch (e) { /* ignore */ }
  }
  function saveLocal() {

  }

  /* ---------------- cross-device sync (db capability) ---------------- */
  var dbDoc = null;
  var writeChain = Promise.resolve();
  var lastWrittenJSON = null;

  function setSyncUI(live, label) {

  function persist() {
    saveLocal();

    var json = JSON.stringify(state.answers);
    if (json === lastWrittenJSON) return;

    writeChain = writeChain.then(function () {

  async function initSync() {

  /* ---------------- derived ---------------- */
  function isAnswered(q) { return state.answers[q.id] !== undefined; }
  function pickOf(q) { return state.picks[q.id]; }
  /* 선택은 했지만 아직 제출(채점)하지 않은 문항 */
  function pendingList() {

  function submitOne(q) {

  }
  function submitAll() {
    var items = pendingList();

    var correct = 0;
    items.forEach(function (q) {
      state.answers[q.id] = state.picks[q.id];

    });
    state.lastBatch = { total: items.length, correct: correct };
    persist();

  }
  /* 공식정답 표기 (복수정답이면 ①·④ 처럼 모두 표시) */
  function officialAnswerLabel(q) {

  function scoreText() {

  function belongsToLaw(q, law) {

  function matchesKind(q) {

  function matchesFilters(q) {
    return q.subject === state.topSubject &&

  function subjectList() {

  function visibleList() {

    } else if (state.mode === "trap") {

    }
    if (state.sort === "unit") {
      // 한 단원을 3개년 통째로 이어서 풀 수 있도록 단원 -> 연도 -> 번호 순으로 정렬
      var order = unitsOf(state.topSubject, state.subject);
      base = base.slice().sort(function (a, b) {

  /* 현재 정렬 기준에 따라 레일을 묶을 그룹 키 목록과 분류 함수 */
  function railGroups(list) {

    /* 조세범처벌법 */ "조세범처벌법",
    /* 법인세법 */ "법인세 총칙","세무조정과 소득처분","익금과 익금불산입","손금과 손금불산입","손익의 귀속시기","자산과 부채의 평가","감가상각비","충당금과 준비금","부당행위계산의 부인","과세표준","세액계산","합병 및 분할 특례","법인세 절차규정","기타 법인세","연결납세방식",
    /* 소득세법 */ "소득세 총칙","이자소득과 배당소득","사업소득","근로소득, 연금소득 및 기타소득","소득금액 계산 및 세액계산 특례","종합소득공제","종합소득 세액계산","퇴직소득세","양도소득세","소득세 절차규정과 외국법인·비거주자","동업기업과세특례",
    /* 부가가치세법 */ "부가가치세 총칙","과세거래","영세율과 면세","과세표준과 매출세액","매입세액과 차가감납부세액","과세·면세 겸영사업자의 세액계산 특례","세금계산서 및 절차규정","간이과세"
  ];
  function unitRank(u) {
    var i = UNIT_ORDER.indexOf(u);
    if (i !== -1) return i;
    /* "3편 ...", "2023년" 처럼 앞에 숫자가 붙은 단원은 숫자 순 */
    var m = /^(\d+)/.exec(u);
    if (m) return 1000 + parseInt(m[1], 10);
    return 9000;
  }
  function unitsOf(topSubject, law) {
    var seen = [];
    QUESTIONS.forEach(function (q) {
      if (q.subject === topSubject && belongsToLaw(q, law) && q.unit && seen.indexOf(q.unit) === -1) {
        seen.push(q.unit);
      }
    });
    seen.sort(function (a, b) {
      var ra = unitRank(a), rb = unitRank(b);
      return ra !== rb ? ra - rb : a.localeCompare(b, "ko");
    });
    return seen;
  }

  /* ---------------- render ---------------- */
  function renderTopSubjects() {
    var wrap = document.getElementById("topSubjects");
    wrap.innerHTML = "";
    TOP_SUBJECTS.forEach(function (subject) {
      var has = loadedTopSubjects.indexOf(subject) !== -1;
      var pill = document.createElement(has ? "button" : "span");
      var cls = "top-subject-pill";
      if (has) cls += " clickable";
      if (has && subject === state.topSubject) cls += " active";
      if (!has) cls += " soon";
      pill.className = cls;
      if (has) {
        var laws = loadedLawsOf(subject);
        var sc = scoreFor(subject, laws.length ? laws[0] : subject, "all");
        var total = QUESTIONS.filter(function (q) { return q.subject === subject; }).length;
        pill.textContent = subject + " · " + total + "문항";
        pill.addEventListener("click", function () {
          state.topSubject = subject;
          var newLaws = loadedLawsOf(subject);
          state.subject = newLaws.length ? newLaws[0] : subject;
          state.unit = "all";
          state.currentIndex = 0;
          renderAll();
        });
      } else {
        pill.textContent = subject + " · 준비중";
      }
      wrap.appendChild(pill);
    });
  }

  function renderSubjects() {
    var wrap = document.getElementById("subjects");
    wrap.innerHTML = "";
    var laws = loadedLawsOf(state.topSubject);
    if (!laws.length) { wrap.style.display = "none"; return; }
    wrap.style.display = "";
    laws.forEach(function (law) {
      var pill = document.createElement("button");
      var cls = "subject-pill clickable";
      if (law === state.subject) cls += " active";
      pill.className = cls;
      var sc = scoreFor(state.topSubject, law, "all");
      pill.textContent = law + " · " + sc.total + "문항";
      pill.addEventListener("click", function () {
        state.subject = law;
        state.unit = "all";
        state.currentIndex = 0;
        renderAll();
      });
      wrap.appendChild(pill);
    });
  }

  function renderUnits() {
    var wrap = document.getElementById("units");
    wrap.innerHTML = "";
    var units = unitsOf(state.topSubject, state.subject);
    if (!units.length) { wrap.style.display = "none"; return; }
    wrap.style.display = "";
    var allPill = document.createElement("button");
    allPill.className = "unit-pill" + (state.unit === "all" ? " active" : "");
    allPill.textContent = "전체 단원";
    allPill.addEventListener("click", function () {
      state.unit = "all";
      state.currentIndex = 0;
      renderAll();
    });
    wrap.appendChild(allPill);
    units.forEach(function (unit) {
      var pill = document.createElement("button");
      var cls = "unit-pill" + (unit === state.unit ? " active" : "");
      pill.className = cls;
      var sc = scoreFor(state.topSubject, state.subject, unit);
      pill.textContent = unit + " (" + sc.total + ")";
      pill.addEventListener("click", function () {
        state.unit = unit;
        state.currentIndex = 0;
        renderAll();
      });
      wrap.appendChild(pill);
    });
  }

  function renderKindTabs() {
    var wrap = document.getElementById("kindTabs");
    var cfg = SUBJECT_CONFIG[state.topSubject];
    var hasCalc = cfg ? cfg.hasCalc : true;
    wrap.style.display = hasCalc ? "" : "none";
    if (!hasCalc && state.kind !== "all") {
      state.kind = "all";
      document.querySelectorAll("[data-kind]").forEach(function (b) { b.classList.remove("active"); });
      document.querySelector('[data-kind="all"]').classList.add("active");
    }
  }

  function renderRail() {
    var rail = document.getElementById("rail");
    rail.innerHTML = "";
    var list = visibleList();
    rail.setAttribute("data-sort", state.sort);
    document.documentElement.setAttribute("data-sort", state.sort);
    railGroups(list).forEach(function (g) {
      if (!g.items.length) return;
      var group = document.createElement("div");
      group.className = "rail-group";
      var label = document.createElement("div");
      label.className = "rail-year";
      label.textContent = g.label;
      label.title = g.label;
      group.appendChild(label);
      var grid = document.createElement("div");
      grid.className = "rail-grid";
      g.items.forEach(function (q) {
        var btn = document.createElement("button");
        var cls = "q-chip";
        if (list.indexOf(q) === state.currentIndex) cls += " current";
        if (isAnswered(q)) cls += isCorrect(q) ? " correct" : " wrong";
        btn.className = cls;
        // 단원순일 때는 연도가 섞이므로 칩에 연도 끝 2자리를 함께 표시
        btn.textContent = state.sort === "unit" ? (String(q.year).slice(2) + "-" + q.no) : q.no;
        btn.title = q.year + "년 " + q.no + "번 · " + q.unit;
        btn.addEventListener("click", function () {
          state.currentIndex = visibleList().indexOf(q);
          renderAll();
        });
        grid.appendChild(btn);
      });
      group.appendChild(grid);
      rail.appendChild(group);
    });
  }

  function choiceLabel(i) {
    return ["①", "②", "③", "④", "⑤"][i];
  }

  function renderPanel() {
    var panel = document.getElementById("panel");
    panel.innerHTML = "";
    var list = visibleList();
    if (!list.length) {
      var empty = document.createElement("div");
      empty.className = "card empty-state";
      empty.textContent = state.mode === "trap"
        ? "이 과목·단원에는 함정문제로 표시된 문항이 없어요."
        : "오답노트가 비어 있어요. 틀린 문제가 생기면 여기 쌓여요.";
      panel.appendChild(empty);
      return;
    }
    if (state.currentIndex >= list.length) state.currentIndex = list.length - 1;
    if (state.currentIndex < 0) state.currentIndex = 0;
    var q = list[state.currentIndex];

    var card = document.createElement("div");
    card.className = "card";

    var meta = document.createElement("div");
    meta.className = "card-meta";
    var kind = q.kind || "concept";
    meta.innerHTML =
      '<span class="qno">' + q.year + "년 제" + ROUND_OF[q.year] + "회 · " + q.no + "번</span>" +
      '<span class="tag law">' + q.law + "</span>" +
      '<span class="tag">' + KIND_LABEL[kind] + "</span>" +
      '<span class="tag badge-' + q.status + '">' + STATUS_LABEL[q.status] + "</span>" +
      (q.trap !== undefined ? '<span class="tag badge-trap">함정 · ' + choiceLabel(q.trap - 1) + '로 틀리기 쉬움</span>' : "");
    card.appendChild(meta);

    var stem = document.createElement("p");
    stem.className = "stem";
    stem.textContent = q.stem;
    card.appendChild(stem);

    var choicesWrap = document.createElement("div");
    choicesWrap.className = "choices";
    var answered = isAnswered(q);
    q.choices.forEach(function (text, i) {
      var idx = i + 1;
      var btn = document.createElement("button");
      var cls = "choice";
      if (answered) {
        if (correctSet(q).indexOf(idx) !== -1) cls += " reveal-correct";
        else if (idx === state.answers[q.id]) cls += " reveal-wrong";
      }
      if (!answered && pickOf(q) === idx) cls += " picked";
      btn.className = cls;
      btn.disabled = answered;
      btn.innerHTML = '<span class="num">' + choiceLabel(i) + "</span><span>" + text.replace(/\n/g, "<br>") + "</span>";
      btn.addEventListener("click", function () {
        if (isAnswered(q)) return;
        if (state.picks[q.id] === idx) delete state.picks[q.id];
        else state.picks[q.id] = idx;
        state.lastBatch = null;
        saveLocal();
        renderAll();
      });
      choicesWrap.appendChild(btn);
    });
    card.appendChild(choicesWrap);

    if (answered) {
      var ok = isCorrect(q);
      var result = document.createElement("div");
      result.className = "result-line " + (ok ? "ok" : "ng");
      result.innerHTML =
        "<b>" + (ok ? "정답입니다" : "오답입니다") + "</b> — 공식정답 " + officialAnswerLabel(q) + "번" +
        (q.note ? '<br><span class="note-label">개정 검토</span> ' + q.note : "");
      card.appendChild(result);
      if (q.trap !== undefined && TRAP_NOTE[q.id]) {
        var tw = document.createElement("div");
        tw.className = "trap-note";
        tw.innerHTML = '<b>왜 ' + choiceLabel(q.trap - 1) + '로 틀리기 쉬운가</b><br>' + TRAP_NOTE[q.id];
        card.appendChild(tw);
      }
    } else {
      var submitRow = document.createElement("div");
      submitRow.className = "submit-row";
      var sBtn = document.createElement("button");
      sBtn.className = "submit-btn";
      var hasPick = pickOf(q) !== undefined;
      sBtn.textContent = hasPick ? "제출" : "보기를 고르세요";
      sBtn.disabled = !hasPick;
      sBtn.addEventListener("click", function () { submitOne(q); });
      submitRow.appendChild(sBtn);
      card.appendChild(submitRow);
    }

    var nav = document.createElement("div");
    nav.className = "card-nav";
    var prevBtn = document.createElement("button");
    prevBtn.className = "nav-btn";
    prevBtn.textContent = "← 이전";
    prevBtn.disabled = state.currentIndex === 0;
    prevBtn.addEventListener("click", function () { state.currentIndex--; renderAll(); });
    var nextBtn = document.createElement("button");
    nextBtn.className = "nav-btn";
    nextBtn.textContent = "다음 →";
    nextBtn.disabled = state.currentIndex >= list.length - 1;
    nextBtn.addEventListener("click", function () { state.currentIndex++; renderAll(); });
    nav.appendChild(prevBtn);
    nav.appendChild(nextBtn);
    card.appendChild(nav);

    panel.appendChild(card);
  }

  function renderScore() {
    document.getElementById("scoreNum").textContent = scoreText();

    var sa = document.getElementById("submitAll");
    var pending = pendingList().length;
    sa.hidden = pending === 0;
    sa.textContent = "전체 제출 (" + pending + "문항)";

    var bs = document.getElementById("batchSummary");
    if (state.lastBatch) {
      var lb = state.lastBatch;
      var wrong = lb.total - lb.correct;
      bs.hidden = false;
      bs.className = "batch-summary" + (wrong === 0 ? " all-ok" : "");
      bs.innerHTML = "<b>" + lb.total + "문항 제출</b> — 정답 " + lb.correct + " · 오답 " + wrong +
        (wrong ? ' <button class="link-btn" id="goWrong">오답만 보기</button>' : "");
      var gw = document.getElementById("goWrong");
      if (gw) gw.addEventListener("click", function () {
        document.querySelectorAll("[data-mode]").forEach(function (b) { b.classList.remove("active"); });
        var wb = document.querySelector('[data-mode="wrong"]');
        if (wb) wb.classList.add("active");
        state.mode = "wrong";
        state.currentIndex = 0;
        state.lastBatch = null;
        renderAll();
      });
    } else {
      bs.hidden = true;
    }
  }

  function renderAll() {
    renderTopSubjects();
    renderSubjects();
    renderUnits();
    renderKindTabs();
    renderRail();
    renderPanel();
    renderScore();
  }

  /* ---------------- events ---------------- */
  document.querySelectorAll("[data-mode]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-mode]").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      state.mode = btn.getAttribute("data-mode");
      state.currentIndex = 0;
      renderAll();
    });
  });
  document.querySelectorAll("[data-kind]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-kind]").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      state.kind = btn.getAttribute("data-kind");
      state.currentIndex = 0;
      renderAll();
    });
  });

  document.getElementById("submitAll").addEventListener("click", submitAll);

  document.querySelectorAll("[data-sort]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-sort]").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      state.sort = btn.getAttribute("data-sort");
      state.currentIndex = 0;
      saveLocal();
      renderAll();
    });
  });

  loadLocal();
  document.querySelectorAll("[data-sort]").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-sort") === state.sort);
  });
  renderAll();
  if (window.claude && typeof window.claude.use === "function") {
    initSync();
  } else {
    setSyncUI(false, "이 기기에만 저장됨");
  }
})();
</script>

</body>
</html>
