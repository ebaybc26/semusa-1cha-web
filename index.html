{ id:"hs2018-46", subject:"행정소송법", year:2018, no:46, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송법에 관한 설명으로 옳지 않은 것은?",
  choices:["「행정소송법」을 적용함에 있어서 행정청에는 법령에 의하여 행정권한의 위임 또는 위탁을 받은 행정기관, 공공단체 및 그 기관 또는 사인이 포함된다.","각급법원 판결에 의하여 명령·규칙이 헌법에 위반된다는 것이 확정된 경우에는 각급법원은 그 사유를 행정안전부장관에게 통보한다.","행정소송에 관하여 「행정소송법」에 특별한 규정이 없는 사항에 대하여는 「법원조직법」과 「민사소송법」 및 「민사집행법」의 규정을 준용한다.","취소소송 계속 중 행정청이 처분등을 취소하여 그 청구가 각하 또는 기각된 경우에 소송비용은 피고의 부담으로 한다.","항고소송의 소송비용에 관한 재판이 확정된 때에는 피고 또는 참가인이었던 행정청이 소속하는 국가 또는 공공단체에 그 효력을 미친다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2018-47", subject:"행정소송법", year:2018, no:47, law:"행정소송법", unit:"민중소송·기관소송", kind:"concept",
  stem:"기관소송에 관한 설명으로 옳지 않은 것은?",
  choices:["「헌법재판소법」에 의하여 헌법재판소의 관장사항으로 되는 소송은 제외한다.","「지방자치법」상 주민소송은 기관소송에 해당하지 않는다.","기관소송에는 취소소송에 관한 규정이 준용되지 않는다.","기관소송은 법률이 정한 경우에 한하여 제기할 수 있다.","기관소송의 원고적격은 법률에서 따로 정한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2018-48", subject:"행정소송법", year:2018, no:48, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"항고소송의 심리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["불고불리의 원칙이 적용된다.","제소 당시 소송요건을 충족하여도 사실심의 변론종결시 그 요건이 결여되면 각하판결을 한다.","처분청의 처분권한 유무는 직권조사사항이 아니다.","제소 당시 소송요건이 흠결되었으면 사실심의 변론종결시까지 이를 구비하더라도 적법한 소가 되지 않는다.","소송요건은 직권조사사항이다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2018-49", subject:"행정소송법", year:2018, no:49, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"다음은 행정소송법 조문 중 일부이다. ( )안에 들어갈 숫자를 옳게 나열한 것은?\n이 법에 의한 기간의 계산에 있어서 국외에서의 소송행위추완에 있어서는 그 기간을 14일에서 ( ㄱ )일로, 제3자에 의한 재심청구에 있어서는 그 기간을 30일에서 ( ㄴ )일로, 소의 제기에 있어서는 그 기간을 60일에서 90일로 한다.",
  choices:["ㄱ: 28, ㄴ: 60","ㄱ: 30, ㄴ: 45","ㄱ: 30, ㄴ: 60","ㄱ: 45, ㄴ: 60","ㄱ: 45, ㄴ: 90"],
  answer:3, status:"clear", note:"" },
{ id:"hs2018-50", subject:"행정소송법", year:2018, no:50, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"원고적격 등에 관한 설명으로 옳지 않은 것은?",
  choices:["취소소송은 처분등의 취소를 구할 법률상 이익이 있는 자가 제기할 수 있다.","무효등확인소송은 처분등의 효력 유무 또는 존재 여부의 확인을 구할 법률상 이익이 있는 자가 제기할 수 있다.","부작위위법확인소송은 처분의 신청을 한 자로서 부작위의 위법의 확인을 구할 법률상 이익이 있는 자만이 제기할 수 있다.","민중소송은 직접 법률상 이익이 있는 자만이 제기할 수 있다.","처분등의 효과가 소멸된 뒤에도 그 처분등의 취소로 인하여 회복되는 법률상 이익이 있는 자는 그 처분등에 대하여 취소소송을 제기할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2018-51", subject:"행정소송법", year:2018, no:51, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"과세관청이 甲에게 2018.2.1. 500만원의 당초 과세처분을 하였다가 2018.3.15. 700만원으로 증액하는 경정처분을 하고, 다시 2018.4.20. 600만원으로 감액하는 재경정처분을 하였다. 이 경우 甲이 제기하는 항고소송의 대상은? (다툼이 있으면 판례에 따름)",
  choices:["2018.2.1. 600만원의 처분","2018.3.15. 600만원의 처분","2018.3.15. 700만원의 처분","2018.4.20. 600만원의 처분","2018.4.20. 700만원의 처분"],
  answer:2, status:"clear", note:"" },
{ id:"hs2018-52", subject:"행정소송법", year:2018, no:52, law:"행정소송법", unit:"민중소송·기관소송", kind:"concept",
  stem:"민중소송에 관한 설명으로 옳은 것은?",
  choices:["국가 또는 공공단체의 기관이 법률에 위반되는 행위를 한 때에 그 시정을 구하기 위해서 제기하는 공익소송이다.","개인의 법적 이익의 구제를 목적으로 하므로 법률상 이익이 침해되는 경우에만 제기할 수 있다.","선거인이라는 지위만 있으면 기본권의 주체로서 제기할 수 있는 주관적 소송이다.","법률상 특별한 요건이 규정되어 있지 않고 주권자로서의 지위만 있으면 제기할 수 있다.","처분의 취소를 구하는 민중소송에는 당사자소송에 관한 규정을 준용한다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2018-53", subject:"행정소송법", year:2018, no:53, law:"행정소송법", unit:"처분사유의 추가·변경", kind:"concept",
  stem:"판례상 처분사유의 추가·변경이 인정된 것은?",
  choices:["시세완납증명서발급거부처분 사유로서, 중기취득세체납에서 자동차세체납으로 변경","종합소득세 부과처분에서 과세대상 소득에 대하여 이자소득이 아니라 대금업에 의한 사업소득으로 변경","주류도매업허가의 취소사유로서, 무자료 주류판매에서 무면허판매업자에 대한 판매로 변경","입찰참가자격의 제한사유로서, 정당한 이유없이 계약을 이행하지 않았다는 것에서 계약이행과 관련하여 관계공무원에게 뇌물을 주었다고 변경","온천발견신고수리의 거부사유로서, 규정온도 미달에서 공공사업에의 지장등으로 변경"],
  answer:2, status:"clear", note:"" },
{ id:"hs2018-54", subject:"행정소송법", year:2018, no:54, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 소의 이익이 부정된 경우는?",
  choices:["지방의회 의원 제명의결 취소소송 계속중 지방의회 의원의 임기가 만료되었으나 월정수당을 받고자 하는 경우","고등학교에서 퇴학처분을 받은 자가 고등학교졸업학력검정고시에 합격한 이후 퇴학처분취소소송을 제기한 경우","치과의사국가시험 불합격처분을 받은 자가 새로 실시된 국가시험에 합격한 이후 불합격처분취소소송을 제기한 경우","파면처분을 받은 공무원이 일반사면을 받은 이후 파면처분취소소송을 제기한 경우","서울대학교 불합격처분의 취소소송 계속중 당해 연도의 입학시기가 지난 경우"],
  answer:3, status:"clear", note:"" },
{ id:"hs2018-55", subject:"행정소송법", year:2018, no:55, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"기판력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["기판력은 당해 처분이 귀속되는 국가 또는 공공단체에 미친다.","과세처분취소소송에서 청구가 기각된 확정판결의 기판력은 그 과세처분의 무효확인을 구하는 소송에도 미친다.","「행정소송법」은 기판력에 관한 명문의 규정을 두고 있다.","취소판결의 기판력은 소송물로 된 행정처분의 위법성 존부에 관한 판단 그 자체에만 미친다.","확정된 종국판결은 그 기판력으로서 당사자가 사실심의 변론종결시를 기준으로 그때까지 제출하지 않은 공격방어방법은 그 뒤 다시 동일한 소송을 제기하여 이를 주장할 수 없다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2018-56", subject:"행정소송법", year:2018, no:56, law:"행정소송법", unit:"부작위위법확인소송", kind:"concept",
  stem:"판례상 부작위위법확인소송에 관한 설명으로 옳은 것은?",
  choices:["행정청의 부작위에 대한 제3자는 법률상 이익이 있는 경우에도 원고적격을 갖지 못한다.","검사가 피압수자의 압수물 환부신청에 대하여 아무런 결정이나 통지도 하지 않는 부작위는 부작위위법확인소송의 대상이 된다.","부작위위법확인의 소제기 후 판결시까지 행정청이 신청에 대한 거부처분을 한 경우에 소의 이익은 상실되지 않는다.","독립운동자들에 대한 국가보훈처장의 보상급여의무의 확인을 구하는 청구는 부작위위법확인소송의 대상이 된다.","행정심판 등 전심절차를 거친 경우에는 「행정소송법」 제20조의 제소기간 내에 부작위위법확인의 소를 제기하여야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2018-57", subject:"행정소송법", year:2018, no:57, law:"행정소송법", unit:"소송참가", kind:"concept",
  stem:"판례상 행정소송에 있어서 제3자의 소송참가의 성질은?",
  choices:["공동소송","보조참가","공동소송참가","독립당사자 참가","공동소송적 보조참가"],
  answer:5, status:"clear", note:"" },
{ id:"hs2018-58", subject:"행정소송법", year:2018, no:58, law:"행정소송법", unit:"위법판단 기준시", kind:"concept",
  stem:"행정소송에서 위법판단의 기준시에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["부작위위법확인소송의 위법판단의 기준시는 판결시이다.","처분시를 기준으로 하면 행정청이 처분 당시 보유하였던 자료만으로 위법판단을 해야 한다.","거부처분취소소송에서의 위법판단의 기준시는 처분시이다.","난민인정거부처분이후 국적국의 정치적 상황이 변화하였다고 하여도 처분시를 기준으로 처분의 위법성을 판단해야 한다.","공정거래위원회의 과징금 납부명령은 다른 특별한 사정이 없는 한 납부명령이 행하여진 의결일 당시의 사실상태와 법령을 기준으로 판단한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2018-59", subject:"행정소송법", year:2018, no:59, law:"행정소송법", unit:"제소기간", kind:"concept",
  stem:"취소소송의 제소기간에 관한 설명으로 옳지 않은 것은?",
  choices:["행정심판을 거친 경우에는 재결서 정본을 송달받은 날이 제소기간의 기산점이다.","취소소송은 처분이 있음을 안 날부터 90일 이내에 제기하여야 한다.","제소기간 준수 여부는 법원의 직권조사사항이다.","경미하지 않은 변경처분의 취소를 구하는 취소소송의 제소기간은 변경전 당초 처분이 있음을 안 날 또는 있은 때를 기산점으로 한다.","처분의 무효를 주장하며 취소소송을 제기하는 경우 제소기간의 제한이 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2018-60", subject:"행정소송법", year:2018, no:60, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"항고소송의 효력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소판결이 확정되면 당해 처분은 처분청의 취소를 기다릴 필요 없이 당연히 효력이 상실된다.","취소판결은 대세적 효력을 가진다.","과세처분을 취소하는 판결이 확정되면 그 과세처분은 처분시에 소급하여 소멸한다.","무효등을 확인하는 확정판결은 제3자에 대하여도 효력이 있다.","집행정지결정의 취소결정은 제3자에 대하여 효력이 없다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2018-61", subject:"행정소송법", year:2018, no:61, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"다음 사례에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)\nA회사는 관할 세무서장에게 부가가치세환급 확정신고를 하였다. A회사는 확정신고에 따른 부가가치세 환급세액을 지급받지 못하여, 국가를 상대로 부가가치세 환급세액 지급청구 소송을 제기하려 한다.",
  choices:["A회사에 대한 국가의 부가가치세 환급세액 지급의무는 부가가치세법령의 규정에 의하여 직접 발생한다.","A회사에 대한 국가의 부가가치세 환급세액 지급의무는 공법상 의무이다.","A회사의 부가가치세 환급세액 지급청구는 당사자소송 절차에 따라야 한다.","A회사가 갖는 부가가치세 환급세액 지급청구권의 법적 성질은 민법상 부당이득반환청구권이다.","국가의 부가가치세 환급세액 지급의무는 A회사로부터 어느 과세기간에 과다하게 거래징수된 세액 상당을 국가가 실제로 납부받았는지와는 관계없다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2018-62", subject:"행정소송법", year:2018, no:62, law:"행정소송법", unit:"관련청구의 이송·병합", kind:"concept",
  stem:"행정소송법상 관련청구소송에 해당하는 것을 모두 고른 것은?\nㄱ. 행정처분 취소소송과 그 위법한 행정처분으로 인하여 손해를 입었음을 이유로 국가배상을 구하는 소\nㄴ. 행정처분 취소소송과 그 처분의 취소를 선결문제로 하는 부당이득의 반환을 구하는 소\nㄷ. 수인이 각각 별도로 제기한 동일한 처분의 취소를 구하는 소\nㄹ. 경원자에 대한 면허처분의 취소를 구하는 소와 자신에 대한 면허거부처분의 취소를 구하는 소",
  choices:["ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"hs2018-63", subject:"행정소송법", year:2018, no:63, law:"행정소송법", unit:"부작위위법확인소송", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳지 않은 것은?",
  choices:["부작위가 성립하기 위해서는 당사자에게 법규상 혹은 조리상 신청권이 있어야 한다.","처분에 대한 신청이 없으면 부작위위법확인소송의 대상이 되는 부작위가 아니다.","집행정지에 관한 규정은 준용된다.","신청에 대한 거부처분은 행정청의 부작위에 해당하지 않는다.","사정판결에 관한 규정은 준용되지 않는다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2018-64", subject:"행정소송법", year:2018, no:64, law:"행정소송법", unit:"판결 일반", kind:"concept",
  stem:"행정소송의 판결에 관한 설명으로 옳지 않은 것은?",
  choices:["소각하판결은 소송판결이다.","본안판결은 내용에 따라 인용판결과 기각판결로 나뉜다.","취소소송에서 인용판결은 형성력을 갖는다.","항고소송에는 이행판결이 존재한다.","무효등확인소송에서의 인용판결은 확인판결이다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2018-65", subject:"행정소송법", year:2018, no:65, law:"행정소송법", unit:"피고적격", kind:"concept",
  stem:"취소소송의 당사자에 관한 설명으로 옳은 것은?",
  choices:["원고가 피고를 잘못 지정한 때에는 법원은 직권에 의하여 피고를 경정할 수 있다.","수인의 청구 또는 수인에 대한 청구가 처분등의 취소청구와 관련되는 청구인 경우에 한하여 그 수인은 공동소송인이 될 수 있다.","법원은 소송의 결과에 따라 권리의 침해를 받을 제3자가 있는 경우에는 제3자의 신청이 있는 경우에 한하여 그 제3자를 소송에 참가시킬 수 있다.","법원은 다른 행정청의 신청이 있는 경우에 한하여 그 행정청을 소송에 참가시킬 수 있다.","행정청이 없게 된 때에는 그 처분에 관한 사무가 귀속되는 국가 또는 공공단체에 속한 다른 행정청을 피고로 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2018-66", subject:"행정소송법", year:2018, no:66, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"행정소송법상 소의 종류의 변경에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["항고소송과 당사자소송간의 변경이 가능하다.","상고심에서도 소의 변경이 허용된다.","소변경허가결정이 확정되면 신소(新訴)는 구소(舊訴)를 제기한 때에 제기된 것으로 본다.","법원의 허가결정이 있어야 한다.","원고의 신청없이 법원이 직권으로 변경하는 것은 허용되지 않는다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2018-67", subject:"행정소송법", year:2018, no:67, law:"행정소송법", unit:"간접강제", kind:"concept",
  stem:"간접강제에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["간접강제는 판결의 기속력 확보수단이다.","간접강제결정에 기한 배상금은 확정판결의 취지에 따른 재처분의 지연에 대한 제재이다.","간접강제 신청은 제1심 수소법원에 하여야 한다.","간접강제의 결정은 변론 없이 할 수 있다.","간접강제가 허용되기 위해서는 거부처분취소판결이나 부작위위법확인판결이 확정되어야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2018-68", subject:"행정소송법", year:2018, no:68, law:"행정소송법", unit:"피고적격", kind:"concept",
  stem:"판례상 피고적격에 관한 설명으로 옳은 것은?",
  choices:["항고소송은 소송의 대상인 처분등을 외부적으로 그의 명의로 행한 행정청을 피고로 한다.","조례에 대한 항고소송은 지방의회가 피고가 된다.","법령에 의한 행정권한의 위임에 따라 수임청이 행한 처분에 대한 취소소송의 피고는 위임기관이 된다.","상급행정청으로부터 내부위임을 받은데 불과한 하급행정청이 권한 없이 자신의 명의로 처분을 한 경우에 그 처분에 대한 취소소송의 피고는 상급행정청이 된다.","납세의무부존재확인의 소는 과세관청을 피고로 한다."],
  answer:1, status:"clear", note:"" },

{ id:"hs2018-71", subject:"행정소송법", year:2018, no:71, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"다음 사례에서 甲이 제기할 수 있는 소송으로 적법한 것은? (다툼이 있으면 판례에 따름)\nA시의 일정구역의 주민들은 주택재개발을 위하여 추진위원회를 구성하여 조합설립 준비를 하였다. 추진위원회는 해당 주민 등의 동의를 얻어 설립결의를 거쳐 설립인가를 신청하였고, A시의 시장 乙은 조합설립을 인가하였다. 주민 甲 등 일부 주민은 동의를 얻는 과정에서 하자가 있음을 주장하고 있다.",

{ id:"hs2018-76", subject:"행정소송법", year:2018, no:76, law:"행정소송법", unit:"행정심판전치주의", kind:"concept",

{ id:"hs2018-77", subject:"행정소송법", year:2018, no:77, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"당사자소송에 관한 설명으로 옳은 것은?",
  choices:["확정판결은 제3자에 대하여도 효력이 있다.","국가를 상대로 하는 토지의 수용에 관계되는 당사자소송은 관계행정청의 소재지를 관할하는 행정법원에 제기하여야 한다.","국가·공공단체를 상대로 하는 당사자소송의 경우에는 가집행선고를 할 수 없다.","법원은 당사자의 신청 또는 직권에 의하여 결정으로써 재결을 행한 행정청에 대하여 행정심판에 관한 기록의 제출을 명할 수 있다.","확정판결은 그 사건에 관하여 당사자인 행정청과 그 밖의 관계행정청을 기속한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2018-78", subject:"행정소송법", year:2018, no:78, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"집행정지에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["집행정지결정의 취소결정에 대한 즉시항고는 취소결정의 집행을 정지하는 효력이 있다.","무효등확인소송에는 집행정지 규정이 준용된다.","집행정지결정의 요건으로 본안소송이 계속될 필요가 없다.","공공복리에 중대한 영향을 미칠 우려에 대한 주장·소명책임은 신청인에게 있다.","법원의 직권에 의한 집행정지결정은 불가능하다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2018-79", subject:"행정소송법", year:2018, no:79, law:"행정소송법", unit:"재판관할", kind:"concept",
  stem:"행정소송의 재판관할에 관한 설명으로 옳지 않은 것은?",
  choices:["세무서장의 과세처분에 대한 취소소송의 제1심 관할법원은 원칙적으로 당해 세무서의 소재지를 관할하는 행정법원이 된다.","서울중앙지방법원은 계쟁사건의 관할이 행정법원인 경우 당해 사건을 서울행정법원으로 이송하여야 한다.","취소소송의 재판관할에 관한 규정은 당사자소송에도 준용된다.","당사자소송으로 제기할 사건을 민사소송으로 서울중앙지방법원에 제기하여 판결이 난 경우에는 관할위반이다.","관할위반여부는 소 제기요건으로서 제1심 법원의 전속심판사항이다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2018-80", subject:"행정소송법", year:2018, no:80, law:"행정소송법", unit:"판결 일반", kind:"concept",
  stem:"취소소송에서 일부취소가 가능한 경우만을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 초과된 양도소득세부과처분에 대해 당사자가 제출한 자료에 의해 적법하게 부과될 정당한 세액이 산출될 수 있는 경우\nㄴ. 초과된 개발부담금부과처분에 대해 당사자가 제출한 자료에 의해 적법하게 부과될 정당한 부과금액이 산출될 수 있는 경우\nㄷ. 제1종 보통, 대형 및 특수면허를 가지고 있는 자가 레이카크레인을 음주운전하여 적발되어 3종의 면허가 모두 취소된 경우\nㄹ. 영업정지처분이 재량권 남용에 해당한다고 판단되어 취소하는 경우",
  choices:["ㄱ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],
  answer:3, status:"clear", note:"" },

{ id:"hg2019-1", subject:"회계학개론", year:2019, no:1, law:"회계학개론", unit:"재고자산", kind:"calc",
  stem:"상품매매업을 하는 (주)세무의 20×1년 기말 재고자산 관련 자료는 다음과 같다.\n조구분 / 종목구분 / 장부수량 / 실제수량 / 단위당원가 / 단위당순실현가능가치\nI: 상품A 150개 / 140개 / ￦1,000 / ￦900\nI: 상품B 180개 / 180개 / 500 / 450\nII: 상품C 200개 / 190개 / 750 / 650\nII: 상품D 430개 / 400개 / 1,200 / 1,300\n종목별기준 저가법을 적용할 경우 20×1년도 포괄손익계산서에 표시되는 매출원가가 ￦8,000,000일 때, 조별기준 저가법을 적용할 경우 20×1년도 포괄손익계산서에 표시되는 매출원가는? (단, 재고자산평가손실은 매출원가에 포함한다.)",
  choices:["￦7,958,000","￦7,981,000","￦8,000,000","￦8,040,000","￦8,043,000"],
  answer:2, status:"clear", note:"" },
{ id:"hg2019-2", subject:"회계학개론", year:2019, no:2, law:"회계학개론", unit:"수익인식", kind:"concept",
  stem:"(주)세무는 20×1년 12월 31일 개당 원가 ￦150인 제품 100개를 개당 ￦200에 현금 판매하였다. (주)세무는 판매 후 30일 이내에 고객이 반품하면 전액 환불해주고 있다. 반품률은 5%로 추정되며, 반품제품 회수비용, 반품제품 가치하락 및 판매당일 반품은 없다. 동 거래에 관한 설명으로 옳지 않은 것은?",
  choices:["20×1년 인식할 매출액은 ￦19,000이다.","20×1년 인식할 이익은 ￦4,750이다.","'환불이 발생할 경우 고객으로부터 제품을 회수할 권리'를 20×1년 말 자산으로 인식하며, 그 금액은 ￦750이다.","동 거래의 거래가격은 변동대가에 해당하기 때문에 받을 권리를 갖게 될 금액을 추정하여 수익으로 인식한다.","20×1년 말 인식할 부채는 ￦250이다."],
  answer:5, status:"clear", note:"" },
{ id:"hg2019-3", subject:"회계학개론", year:2019, no:3, law:"회계학개론", unit:"금융부채·사채", kind:"calc",
  stem:"(주)세무는 20×1년 1월 1일 액면 ￦100,000(표시이자율 6% 매년 말 지급, 만기 3년)인 전환사채를 ￦100,000에 발행하였다. 발행 당시 일반사채의 유효이자율은 12%이다. 전환조건은 전환사채 액면 ￦800당 보통주 1주(액면 ￦500)이며, 만기일까지 전환권이 행사되지 않은 경우에는 액면의 113.24%를 지급한다. 동 전환사채와 관련된 설명으로 옳지 않은 것은?\n기간 / 단일금액￦1 현가(12%) / 정상연금￦1 현가(12%)\n1년 / 0.8929 / 0.8929\n2년 / 0.7972 / 1.6901\n3년 / 0.7118 / 2.4018",
  choices:["전환사채 발행시점 부채요소의 장부금액은 ￦95,015이다.","20×1년 12월 31일 전환사채의 자본요소는 ￦4,985이다.","20×2년 부채 증가금액은 ￦6,050이다.","20×3년 1월 1일 전환사채 액면 ￦40,000의 전환청구가 이루어지면 전환권대가 ￦1,994을 자본잉여금으로 대체할 수 있다.","20×3년 1월 1일 전환사채 전부를 ￦100,000에 상환할 경우 인식할 사채상환이익은 ￦11,452이다."],

{ id:"hg2019-16", subject:"회계학개론", year:2019, no:16, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"일반목적재무보고에 관한 설명으로 옳지 않은 것은?",
  choices:["현재 및 잠재적 투자자, 대여자 및 기타채권자에 해당하지 않는 기타 당사자들(예를 들어, 감독당국)이 일반목적재무보고서가 유용하다고 여긴다면 이들도 일반목적재무보고의 주요 대상에 포함된다.","일반목적재무보고서는 현재 및 잠재적 투자자, 대여자 및 기타 채권자가 필요로 하는 모든 정보를 제공하지는 않으며 제공할 수도 없다. 그 정보이용자들은, 예를 들어, 일반 경제적 상황 및 기대, 정치적 사건과 정치 풍토, 산업 및 기업 전망과 같은 다른 원천에서 입수한 관련 정보를 고려할 필요가 있다.","재무보고서는 정확한 서술보다는 상당 부분 추정, 판단 및 모형에 근거한다.","일반목적재무보고서는 보고기업의 가치를 보여주기 위해 고안된 것이 아니다. 그러나 그것은 현재 및 잠재적 투자자, 대여자 및 기타 채권자가 보고기업의 가치를 추정하는 데 도움이 되는 정보를 제공한다.","일반목적재무보고의 목적은 현재 및 잠재적 투자자, 대여자 및 기타 채권자가 기업에 자원을 제공하는 것에 대한 의사결정을 할 때 유용한 보고기업 재무정보를 제공하는 것이다. 그 의사결정은 지분상품 및 채무상품을 매수, 매도 또는 보유하는 것과 대여 및 기타 형태의 신용을 제공 또는 결제하는 것을 포함한다."],
  answer:1, status:"clear", note:"" },
{ id:"hg2019-17", subject:"회계학개론", year:2019, no:17, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무는 20×1년 4월 1일에 공장건물 신축을 시작하여 20×2년 9월 30일에 공사를 완료하였다. 동 공장건물은 차입원가를 자본화하는 적격자산이며, 공장건물 신축 관련 공사비 지출 내역은 다음과 같다.\n구분 / 20×1년 4월 1일 / 20×1년 6월 1일 / 20×2년 2월 1일\n공사대금 지출액 ￦2,000,000 / ￦4,800,000 / ￦900,000\n모든 차입금은 매년 말 이자지급 조건이며, 특정차입금과 일반차입금에서 발생한 일시적 투자수익은 없다. (주)세무의 차입금 내역은 다음과 같다.\n차입금 / 차입일 / 차입금액 / 상환일 / 연이자율\n특정차입금 / 20×1.4.1 / ￦1,000,000 / 20×2.9.30 / 5%\n일반차입금 / 20×1.1.1 / ￦1,500,000 / 20×3.12.31 / 8%\n일반차입금 / 20×1.3.1 / ￦1,800,000 / 20×2.12.31 / 12%\n20×1년 공장건물과 관련하여 자본화할 차입원가는? (단, 연평균지출액과 이자비용은 월할 계산한다.)",

{ id:"hg2019-18", subject:"회계학개론", year:2019, no:18, law:"회계학개론", unit:"투자부동산", kind:"calc",
  stem:"(주)세무는 20×1년 말에 취득한 건물(취득원가 ￦1,000,000, 내용연수 12년, 잔존가치 ￦0)을 투자부동산으로 분류하고 공정가치모형을 적용하였다. 20×2년 7월 1일부터 동 건물 전부를 본사사옥으로 전환하여 사용하고 있다. 20×2년 7월 1일 현재 동 건물의 잔존내용연수를 10년, 잔존가치를 ￦0으로 추정하였으며, 정액법으로 감가상각하기로 결정하였다. 아래 표는 동 건물의 공정가치 변동 현황이다.\n구분 / 20×1년 12월 31일 / 20×2년 7월 1일 / 20×2년 12월 31일\n공정가치 ￦1,000,000 / ￦1,200,000 / ￦1,000,000\n20×2년 12월 31일 동 건물을 원가모형에 따라 회계처리 하였을 경우 20×2년 당기순이익은 ￦750,000이다. 재평가모형을 적용하였을 경우 (주)세무의 20×2년 당기순이익은?",

{ id:"hg2019-19", subject:"회계학개론", year:2019, no:19, law:"회계학개론", unit:"무형자산", kind:"concept",
  stem:"무형자산의 회계처리에 관한 설명으로 옳지 않은 것은?",
  choices:["사업결합 과정에서 피취득자가 진행하고 있는 연구·개발 프로젝트가 무형자산의 정의를 충족한다면 사업결합 전에 그 자산을 피취득자가 인식하였는지 여부에 관계없이, 취득자는 취득일에 피취득자의 무형자산을 영업권과 분리하여 인식한다.","무형자산의 인식기준을 충족하지 못하여 비용으로 인식한 지출은 그 이후에 무형자산의 원가로 인식할 수 없다.","내용연수가 비한정인 무형자산을 유한 내용연수로 재평가하는 것은 그 자산의 손상을 시사하는 징후에 해당하지 않으므로 손상차손을 인식하지 않는다.","상각하지 않는 무형자산에 대하여 사건과 상황이 그 자산의 내용연수가 비한정이라는 평가를 계속하여 정당화하는지를 매 회계기간에 검토하며, 사건과 상황이 그러한 평가를 정당화하지 않는 경우에 비한정 내용연수를 유한 내용연수로 변경하는 것은 회계추정의 변경으로 회계처리한다.","내부적으로 창출한 브랜드, 제호, 출판표제, 고객 목록과 이와 실질이 유사한 항목은 무형자산으로 인식하지 않는다."],
  answer:3, status:"clear", note:"" },

{ id:"hg2019-26", subject:"회계학개론", year:2019, no:26, law:"회계학개론", unit:"제조원가의 흐름", kind:"calc",

  stem:"(주)세무는 고객별 수익성 분석을 위하여 판매관리비에 대해 활동기준원가계산을 적용한다. 당기 초에 수집한 관련 자료는 다음과 같다.\n(1) 연간 판매관리비 예산 ￦3,000,000(급여 ￦2,000,000, 기타 ￦1,000,000)\n(2) 자원소비단위(활동)별 판매관리비 배분비율\n급여: 고객주문처리 40% / 고객관계관리 60%\n기타: 고객주문처리 20% / 고객관계관리 80%\n(3) 활동별 원가동인과 연간 활동량\n고객주문처리: 원가동인 고객주문횟수 / 활동량 2,000회\n고객관계관리: 원가동인 고객수 / 활동량 100명\n(주)세무는 당기 중 주요 고객인 홍길동이 30회 주문할 것으로 예상하고 있다. 홍길동의 주문 1회당 예상되는 (주)세무의 평균 매출액은 ￦25,000이며 매출원가는 매출액의 60%이다. 활동기준원가계산을 적용하여 판매관리비를 고객별로 배분하는 경우, (주)세무가 당기에 홍길동으로부터 얻을 것으로 예상되는 영업이익은?",

{ id:"hg2019-37", subject:"회계학개론", year:2019, no:37, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",

{ id:"hg2019-38", subject:"회계학개론", year:2019, no:38, law:"회계학개론", unit:"품질원가", kind:"calc",
  stem:"(주)세무의 품질관리 활동원가는 다음과 같다. 품질관리 활동원가 중 예방원가(prevention cost)와 평가원가(appraisal cost)의 계산결과를 비교한 것으로 옳은 것은?\n원재료 검사 ￦40 / 반품 재작업 10 / 재공품 검사 50 / 납품업체 평가 90 / 공손품 재작업 10\n설계엔지니어링 ￦20 / 보증수리원가 70 / 예방적 설비유지 30 / 반품 재검사 20 / 품질교육훈련 60",
  choices:["예방원가가 평가원가보다 ￦110 더 크다.","예방원가가 평가원가보다 ￦90 더 크다.","예방원가가 평가원가보다 ￦50 더 작다.","예방원가가 평가원가보다 ￦70 더 작다.","예방원가가 평가원가보다 ￦90 더 작다."],
  answer:1, status:"clear", note:"" },
{ id:"hg2019-39", subject:"회계학개론", year:2019, no:39, law:"회계학개론", unit:"불확실성하의사결정", kind:"calc",
  stem:"(주)세무는 공정이 정상인지에 대해 조사 여부를 결정하고자 한다. 공정 조사비용은 ￦20,000이며, 조사 후 공정이 비정상 상태일 때 교정비용은 ￦30,000이다. 공정이 비정상인데 조사하지 않으면 손실 ￦90,000이 발생한다. 공정이 정상일 확률은 60%, 비정상일 확률은 40%이다. 공정 상태에 대해 완전한 예측을 해주는 완전정보시스템이 있다면 그 완전정보를 얻기 위해 지불가능한 최대금액은?",
  choices:["￦4,000","￦12,000","￦16,000","￦20,000","￦32,000"],
  answer:2, status:"clear", note:"" },
{ id:"hg2019-40", subject:"회계학개론", year:2019, no:40, law:"회계학개론", unit:"책임회계·대체가격", kind:"calc",
  stem:"(주)세무는 이익중심점으로 지정된 A, B 두 개의 사업부로 구성되어 있다. A사업부는 부품을 생산하고, B사업부는 부품을 추가가공하여 완제품을 생산하여 판매한다. A사업부의 부품 최대생산능력은 5,000단위이고, 단위당 변동원가는 ￦100이다. A사업부는 부품의 단위당 판매가격을 ￦200으로 책정하여 외부에 3,000단위 판매하거나 단위당 판매가격을 ￦180으로 책정하여 외부에 4,000단위 판매할 수 있을 것으로 기대한다. 다만, A사업부가 외부시장에서 2가지 판매가격을 동시에 사용할 수는 없다. 이 같은 상황에서 B사업부가 A사업부에게 부품 2,000단위를 내부대체해 줄 것을 요청하였다. 2,000단위를 전량 대체하는 경우 A사업부의 단위당 최소대체가격은?",
  choices:["￦80","￦100","￦110","￦120","￦180"],
  answer:3, status:"clear", note:"" },

{ id:"hs2019-41", subject:"행정소송법", year:2019, no:41, law:"행정소송법", unit:"행정소송의 종류·한계", kind:"concept",
  stem:"행정소송의 유형 등에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송은 행정청의 위법한 처분등을 취소 또는 변경하는 소송이다.","기관소송은 법률이 정한 경우에 법률에 정한 자에 한하여 제기할 수 있다.","거부처분에 대한 가처분도 가능하다.","무효등 확인소송은 항고소송의 일종이다.","공법상 신분·지위 확인소송은 당사자소송에 의한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2019-42", subject:"행정소송법", year:2019, no:42, law:"행정소송법", unit:"선결문제", kind:"concept",
  stem:"처분등의 효력 유무 또는 존재 여부가 민사소송의 선결문제로 되어 당해 민사소송의 수소법원이 이를 심리·판단하는 경우에 준용되는 행정소송법 규정이 아닌 것은?",
  choices:["직권심리","공동소송","행정청의 소송참가","소송비용에 관한 재판의 효력","행정심판기록의 제출명령"],
  answer:2, status:"clear", note:"" },
{ id:"hs2019-43", subject:"행정소송법", year:2019, no:43, law:"행정소송법", unit:"행정소송의 종류·한계", kind:"concept",
  stem:"행정소송의 한계에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["특별권력관계 내부의 행위는 행정소송의 대상이 될 수 없다.","지방의회의원에 대한 징계의결은 사법심사의 대상이 아니다.","처분적 법규명령은 그 자체가 항고소송의 대상이 된다.","군의관의 신체등위판정은 이에 근거하여 병역의무의 종류가 정해지므로 항고소송의 대상이 된다.","국가보훈처장에게 독립운동가들에 대한 서훈추천을 다시 할 의무가 있음의 확인을 구하는 것은 항고소송의 대상이 된다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2019-44", subject:"행정소송법", year:2019, no:44, law:"행정소송법", unit:"민중소송·기관소송", kind:"concept",
  stem:"민중소송에 관한 설명으로 옳지 않은 것은?",
  choices:["국민투표의 효력에 관하여 이의가 있는 투표인이 대법원에 제기하는 소송은 민중소송이다.","민중소송으로써 처분등의 취소를 구하는 소송에는 그 성질에 반하지 아니하는 한 취소소송에 관한 규정을 준용한다.","「지방자치법」상의 주민소송은 민중소송의 일종이다.","19세 이상의 주민이 일정한 요건을 갖추어 조례의 개정을 청구하는 것은 민중소송의 일종이다.","직접 자기의 법률상 이익과 관계없이 제기하는 민중소송은 객관적 소송이다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2019-45", subject:"행정소송법", year:2019, no:45, law:"행정소송법", unit:"민중소송·기관소송", kind:"concept",
  stem:"기관소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["교육·학예에 관한 시·도의회의 재의결에 대하여 교육감이 대법원에 제기하는 소송은 기관소송의 일종이다.","지방자치단체의 장이 자치사무에 관한 감독청의 명령이나 처분의 취소 또는 정지에 대하여 대법원에 제기하는 소송은 기관소송의 일종이다.","기관소송은 국가기관과 지방자치단체 간에 권한의 유무 또는 범위에 관하여 다툼이 있을 때에 제기하는 소송이다.","기관소송으로써 처분등의 존재 여부의 확인을 구하는 소송에는 그 성질에 반하지 아니하는 한 무효등 확인소송에 관한 규정을 준용한다.","기관소송으로서 항고소송에 관한 규정을 준용하는 소송 외의 소송에는 그 성질에 반하지 아니하는 한 당사자소송에 관한 규정을 준용한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2019-46", subject:"행정소송법", year:2019, no:46, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송법상 항고소송과 당사자소송에 공통으로 적용되는 것이 아닌 것은?",

{ id:"hs2019-47", subject:"행정소송법", year:2019, no:47, law:"행정소송법", unit:"재심", kind:"concept",
  stem:"제3자에 의한 재심청구에 관하여 ( )안에 들어갈 내용을 옳게 나열한 것은?\n제3자에 의한 재심청구는 확정판결이 있음을 안 날로부터 ( ㄱ ) 이내, 판결이 확정된 날로부터 ( ㄴ ) 이내에 제기하여야 한다.",
  choices:["ㄱ: 14일, ㄴ: 30일","ㄱ: 14일, ㄴ: 60일","ㄱ: 30일, ㄴ: 90일","ㄱ: 30일, ㄴ: 1년","ㄱ: 60일, ㄴ: 1년"],

{ id:"hs2019-48", subject:"행정소송법", year:2019, no:48, law:"행정소송법", unit:"행정심판전치주의", kind:"concept",
  stem:"행정심판과 행정소송의 관계에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["공무원파면처분 취소소송에는 임의적 행정심판전치주의가 적용된다.","운전면허정지처분 취소소송에는 필요적 행정심판전치주의가 적용되지 아니한다.","필요적 행정심판전치주의가 적용되는 경우 행정소송의 제기시에는 전치요건을 구비하지 못하였더라도 사실심 변론종결시까지 구비하면 된다.","임의적 행정심판전치주의가 적용되는 경우 행정심판을 거쳤는지 여부는 법원의 직권조사사항이다.","필요적 행정심판전치주의가 적용되는 경우 동종사건에 이미 행정심판의 기각재결이 있은 때에는 행정심판의 제기만 있으면 취소소송을 제기할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2019-49", subject:"행정소송법", year:2019, no:49, law:"행정소송법", unit:"소송비용", kind:"concept",
  stem:"행정소송에 있어서 소송비용의 부담주체가 다른 하나는?\nㄱ. 취소소송의 청구인용 판결의 경우\nㄴ. 취소청구가 사정판결에 의하여 기각된 경우\nㄷ. 행정청이 처분을 변경함으로 인하여 청구가 기각된 경우\nㄹ. 행정청이 처분을 취소함으로 인하여 청구가 각하된 경우\nㅁ. 취소사유만 있음에도 무효확인소송을 제기하여 청구가 기각된 경우",
  choices:["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ"],
  answer:5, status:"clear", note:"" },
{ id:"hs2019-50", subject:"행정소송법", year:2019, no:50, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"행정청에 대한 신청의 거부행위의 처분성에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["신청한 행위가 공권력의 행사 또는 이에 준하는 행정작용이어야 한다.","거부행위가 신청인의 법률관계에 어떤 변동을 일으켜야 하는데, 권리행사에 중대한 지장을 초래하는 것도 포함된다.","행정청에 대하여 행위발동을 요구할 법규상 또는 조리상 신청권이 요구된다.","신청권은 일반 국민에게 그러한 신청권을 인정하고 있는가를 살펴 추상적으로 결정된다.","신청권은 신청의 인용이라는 만족적 결과를 얻을 권리를 의미한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2019-51", subject:"행정소송법", year:2019, no:51, law:"행정소송법", unit:"무효등확인소송", kind:"concept",
  stem:"무효확인소송의 본안판단 사항에 해당하는 것은?",

  answer:3, status:"clear", note:"" },
{ id:"hs2019-52", subject:"행정소송법", year:2019, no:52, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"판례상 공부(公簿)상의 기재변경과 관련하여 처분성이 인정되지 않는 것은?",
  choices:["지적공부 소관청의 지목변경신청 반려행위","소관청의 토지대장상 소유자명의변경신청 거부행위","행정청의 건축물대장상 건축주명의변경신고에 대한 수리거부행위","1필지의 일부가 소유자가 다르게 되었음을 이유로 한 지적공부상 토지분할신청에 대한 지적 소관청의 거부행위","건축물대장 소관청의 건축물대장의 용도변경신청 거부행위"],

{ id:"hs2019-53", subject:"행정소송법", year:2019, no:53, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"판례상 취소소송의 대상인 것을 모두 고른 것은?\nㄱ. 「건축법」상 착공신고 반려행위\nㄴ. 「국가공무원법」상 당연퇴직의 인사발령\nㄷ. 운전면허 행정처분처리대장상 벌점의 배점\nㄹ. 본인의 의사와 무관하게 유출된 주민등록번호의 변경신청에 대한 구청장의 거부행위",

{ id:"hs2019-54", subject:"행정소송법", year:2019, no:54, law:"행정소송법", unit:"원처분주의·재결주의", kind:"concept",
  stem:"행정소송법상 재결취소소송과 재결 자체의 고유한 위법에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["재결서에 주문만 기재되고 이유의 기재가 없는 경우 재결 자체의 고유한 하자가 인정된다.","복효적 행정행위에 대한 행정심판의 인용재결로 불이익을 입은 자는 인용재결의 취소를 구할 수 있다.","행정심판청구가 부적법하여 각하하여야 함에도 인용재결을 한 경우 재결취소소송이 허용된다.","행정심판청구가 부적법하지 않음에도 각하한 재결에 대해서는 취소소송을 제기할 수 있다.","행정심판의 재결에 이유모순의 위법이 있는 경우 원처분의 취소를 구하는 소송에서 위법사유로서 재결 자체의 고유한 하자를 주장할 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2019-55", subject:"행정소송법", year:2019, no:55, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"국가·공공단체 그 밖의 권리주체를 피고로 하는 소송에 해당하지 않는 것은? (다툼이 있으면 판례에 따름)",
  choices:["구 「광주민주화운동 관련자 보상 등에 관한 법률」에 의한 보상금청구소송","퇴직연금 결정 후의 공무원연금관리공단에 대한 미지급퇴직연금지급청구소송","조세부과처분이 당연무효임을 전제로 하여 이미 납부한 세금의 반환을 청구하는 소송","국가에 대한 납세의무자의 부가가치세 환급세액 지급청구소송","「도시 및 주거환경정비법」 상의 주택재건축정비사업조합을 상대로 관리처분계획안에 대한 조합 총회결의의 효력을 다투는 소송"],
  answer:3, status:"clear", note:"" },
{ id:"hs2019-56", subject:"행정소송법", year:2019, no:56, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 취소소송에서 소의 이익이 인정되지 않는 경우는?",
  choices:["원자로시설부지사전승인처분 취소소송 중 건설허가처분이 있게 되었을 때 부지사전승인처분 취소소송의 경우","기간을 정한 제재처분 취소소송에서 집행정지결정이 있었으나 집행정지 중 처분이 정한 기간이 경과한 경우","현역병입영통지처분의 취소를 구하는 자가 현실적으로 입영한 경우","파면처분을 받은 공무원이 일반사면을 받은 이후 파면처분취소소송을 제기한 경우","공무원의 해임처분취소소송 중 임기가 만료되었으나 그 취소로 해임처분일부터 임기만료일까지 기간에 대한 보수지급을 구할 수 있는 경우"],
  answer:1, status:"clear", note:"" },
{ id:"hs2019-57", subject:"행정소송법", year:2019, no:57, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"항공사인 甲과 乙은 각각 A국제항공노선에 대한 운수권배분을 신청하였으나, 국토교통부장관은 내부지침에 따라서 甲에 대해서만 운수권배분을 행하고 乙에 대해서는 아무런 조치를 취하지 않았다. 乙은 이에 불복하여 행정소송을 제기하고자 한다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["甲에 대한 운수권배분이 행정규칙에 근거하였더라도 이는 행정처분에 해당한다.","甲에 대한 운수권배분처분에는 乙에 대한 운수권배분거부처분이 포함되어 있다.","乙은 자신에 대한 운수권배분거부처분의 취소를 구할 원고적격이 있다.","운수권배분처분은 甲에 대한 것이고 乙은 그 처분의 직접 상대방이 아니므로, 乙은 운수권배분처분의 취소를 구할 원고적격이 없다.","乙이 자신에 대한 운수권배분거부처분에 대하여 효력정지를 구할 이익은 인정되지 않는다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2019-58", subject:"행정소송법", year:2019, no:58, law:"행정소송법", unit:"피고적격", kind:"concept",
  stem:"행정소송의 피고적격에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송은 그 처분을 행한 정당한 권한을 가진 행정청을 피고로 한다.","공무수탁사인이 자신의 이름으로 처분을 한 경우에는 공무수탁사인이 피고가 된다.","대외적으로 의사를 표시할 수 없는 내부기관은 실질적인 의사가 그 기관에 의하여 결정되더라도 피고적격을 갖지 못한다.","교육에 관한 조례의 무효확인소송의 피고는 교육감이다.","지방의회의장 불신임결의에 대한 취소소송의 피고는 지방의회이다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2019-59", subject:"행정소송법", year:2019, no:59, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 보다 실효적인 권리구제절차가 있음을 이유로 소의 이익이 부정되는 경우가 아닌 것은?",
  choices:["거부처분이 재결에서 취소되었을 때 재결에 따른 후속처분이 아니라 그 재결의 취소를 구하는 경우","재단법인의 정관변경 결의의 하자를 이유로 정관변경 인가처분의 취소를 구하는 경우","「도시 및 주거환경정비법」 상 주택재건축사업시행계획의 하자를 이유로 사업시행인가처분의 취소를 구하는 경우","「도시 및 주거환경정비법」 상 주택재건축조합설립결의의 하자를 이유로 조합설립인가처분의 취소를 구하는 경우","학교법인의 임원선임행위에 하자가 있음을 이유로 감독청의 취임승인처분의 취소를 구하는 경우"],
  answer:4, status:"clear", note:"" },
{ id:"hs2019-60", subject:"행정소송법", year:2019, no:60, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"변경처분이 있는 경우의 항고소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["증액경정처분이 있는 경우 당초처분의 절차적 하자는 증액경정처분에 승계되지 않는다.","당초처분을 전부 변경하는 변경처분에 대한 취소소송의 제소기간은 변경처분시를 기준으로 한다.","후행처분이 선행처분의 내용을 일부 소폭 변경하는 경우, 선행처분취소소송에 후행처분취소청구를 추가하여 청구를 변경하였다면 후행처분에 관한 제소기간 준수는 청구변경 당시를 기준으로 판단한다.","과징금 부과처분을 한 후 부과처분의 하자를 이유로 감액처분을 하면 감액처분이 항고소송의 대상이 된다.","대규모점포에 대한 종전 영업시간 제한 및 의무휴업일 지정 처분의 내용 중 영업시간 제한 부분만을 일부 변경하는 후속처분이 있는 경우, 종전 처분도 여전히 항고소송의 대상이 된다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2019-61", subject:"행정소송법", year:2019, no:61, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"판례상 행정소송의 대상이 되는 행정처분으로 인정되지 않는 것으로만 연결된 것은?",
  choices:["법인세 과세표준 결정 - 친일반민족행위자재산조사위원회의 재산조사개시결정","「건축법」 상 이행강제금 납부의 최초 독촉 - 보건복지부 고시인 약제급여·비급여목록 및 급여상한금액표","해양수산부장관의 항만 명칭결정 - 과세관청의 소득금액변동통지","금융감독위원회의 부실금융기관에 대한 파산신청 - 진실·화해를 위한 과거사정리위원회의 진실규명결정","어업권면허에 선행하는 우선순위결정 - 행정청의 과태료 부과처분"],
  answer:5, status:"clear", note:"" },
{ id:"hs2019-62", subject:"행정소송법", year:2019, no:62, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"취소소송의 심리절차상 원칙에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 필요하다고 인정할 때에는 직권으로 증거조사를 할 수 있으나, 당사자가 주장하지 아니한 사실에 대하여는 판단할 수 없다.","법원이 원고가 청구하지 아니한 개별토지가격결정처분에 대하여 판결하는 것은 처분권주의에 반한다.","명의신탁등기 과징금 부과처분에 대하여 장기미등기 과징금 부과처분 사유가 존재한다는 이유로 적법하다고 판단하는 것은 직권심사주의 원칙상 허용된다.","기록상 자료가 나타나 있다 하더라도 당사자가 주장하지 않으면 판단할 수 없다.","처분청의 처분권한유무는 직권조사사항이다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2019-63", subject:"행정소송법", year:2019, no:63, law:"행정소송법", unit:"처분사유의 추가·변경", kind:"concept",
  stem:"처분사유의 사후변경에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["당초 처분의 근거로 삼은 사유와 기본적 사실관계가 동일하다고 인정되는 한도 내에서만 다른 처분사유로 변경할 수 있다.","사실심 변론종결시까지만 허용된다.","당사자가 처분시에 존재하였음을 알고 있는 사유에 대해서만 인정된다.","처분사유로 제시한 구체적 사실을 변경하지 않는 한 처분의 근거가 된 법령만을 변경할 수 있다.","소송물의 동일성을 해하지 아니하는 범위 안에서 인정될 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2019-64", subject:"행정소송법", year:2019, no:64, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"행정소송에서 입증책임에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["소송요건에 대한 입증책임은 원고가 부담한다.","과세처분취소소송에서 처분의 적법성 및 과세요건사실의 존재와 관련하여 경험칙상 이례에 속하는 특별한 사정의 존재에 관하여는 납세의무자에게 입증책임이 있다.","과세대상이 된 토지가 비과세라는 점은 이를 주장하는 납세의무자에게 입증책임이 있다.","행정소송에서 사실의 증명은 추호의 의혹도 없어야 한다는 자연과학적 증명일 것을 요한다.","항고소송에서 피고가 주장하는 일정한 처분의 적법성에 관하여 합리적으로 수긍할만한 증명이 있는 경우 처분은 정당하며, 이와 상반되는 주장과 증명은 원고에게 책임이 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2019-65", subject:"행정소송법", year:2019, no:65, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"행정소송의 심리의 범위에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["무효확인소송에서 사정판결 여부는 심판의 대상이 되지 않는다.","법원은 원고의 청구범위를 초월하여 판결할 수 없다.","행정청의 재량에 속하는 처분이라도 재량권의 일탈·남용이 있는 때에는 법원은 이를 취소할 수 있다.","행정청이 신청권이 인정되는 상대방의 신청에 대하여 아무런 처분을 하지 않고 있는 이상 행정청의 부작위는 그 자체로 위법하다.","부작위위법확인소송에서의 심리의 범위에 대하여 판례는 실체적 심리설을 취한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2019-66", subject:"행정소송법", year:2019, no:66, law:"행정소송법", unit:"위법판단 기준시", kind:"concept",
  stem:"취소소송의 위법성판단의 기준시에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송에서 행정처분의 위법 여부는 행정처분이 있을 때의 법령과 사실상태를 기준으로 판단한다.","난민인정거부처분취소소송에 있어서 거부처분을 한 후 국적국의 정치적 상황이 변화하였다고 하여 처분의 적법여부가 달라지는 것은 아니다.","법원은 사실심 변론종결시까지 제출된 모든 자료를 종합하여 처분의 위법 여부를 판단할 수 있다.","판결시기준설은 판결을 처분의 사후심사가 아니라 처분에 계속적으로 효력을 부여할 것인가의 문제로 본다.","교원소청심사 결정 전의 사유라 하더라도 소청심사 단계에서 주장하지 아니한 사유에 대해서 법원은 심리·판단할 수 없다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2019-67", subject:"행정소송법", year:2019, no:67, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"행정소송상 소의 변경에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["원고가 고의 또는 중대한 과실 없이 행정소송으로 제기할 사건을 민사소송으로 제기한 경우라도 행정소송으로의 소의 변경은 허용되지 않는다.","소의 종류의 변경은 청구의 기초에 변경이 없을 것이 요구된다.","무효등 확인소송이나 부작위위법확인소송을 취소소송 또는 당사자소송으로 변경할 수 있다.","당사자소송을 항고소송으로 변경하는 경우 피고의 변경이 수반된다.","소의 변경시 제소기간은 처음에 소를 제기한 때를 기준으로 한다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2019-68", subject:"행정소송법", year:2019, no:68, law:"행정소송법", unit:"위법판단 기준시", kind:"concept",
  stem:"항고소송중 위법성판단의 기준시점이 판결시인 것만을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 부작위위법확인소송 ㄴ. 거부처분취소소송 ㄷ. 무효확인소송",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:1, status:"clear", note:"" },
{ id:"hs2019-69", subject:"행정소송법", year:2019, no:69, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"취소소송의 원고적격에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송은 처분등의 취소를 구할 법률상 이익이 있는 자가 제기할 수 있다.","원고적격은 소송요건의 하나이므로 사실심 변론종결시는 물론 상고심에서도 존속하여야 한다.","법률상 보호되는 이익은 당해 처분의 근거법규 및 관련법규가 보호하는 개별적·직접적·구체적 이익이 있는 경우를 말한다.","위명(僞名)으로 난민신청을 하여 난민불인정 처분을 받은 자는 그 처분의 취소를 구할 원고적격이 있다.","기존 담배 일반소매인은 신규 구내소매인 지정처분의 취소를 구할 원고적격이 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2019-70", subject:"행정소송법", year:2019, no:70, law:"행정소송법", unit:"피고적격", kind:"concept",
  stem:"다음 각 처분에 대한 취소소송의 피고가 옳게 연결된 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. A시장으로부터 권한을 위임받은 B공사의 이주대책에 관한 처분 - B공사\nㄴ. A시장으로부터 내부위임을 받은 C공원 관리사업소장이 자신의 명의로 행한 사용료 부과처분 - C공원 관리사업소장\nㄷ. A시장으로부터 내부위임을 받은 D공원 관리사업소장이 A시장 명의로 행한 사용료 부과처분 - A시장",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:5, status:"clear", note:"" },
{ id:"hs2019-71", subject:"행정소송법", year:2019, no:71, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 취소소송의 원고적격에 관한 설명으로 옳지 않은 것은?",
  choices:["은행의 주주는 은행이 업무정지처분 등으로 더 이상 영업 전부를 행할 수 없더라도 그 처분 등을 다툴 원고적격이 없다.","처분을 다툴 법률상 이익이 있는지에 관한 당사자의 주장에 관하여 법원이 판단하지 않았다 하더라도 판단유탈은 아니다.","구 「자동차운수사업법」 상 자동차운송사업의 면허와 관련하여 당해 노선에 관한 기존업자는 노선연장인가처분의 취소를 구할 법률상 이익이 있다.","지방자치단체는 건축법령상 건축협의의 취소에 대한 취소를 구할 법률상 이익이 있다.","대학교 총학생회는 교육부장관의 해당 대학교 학교법인의 임시이사선임처분의 취소를 구할 원고적격이 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2019-72", subject:"행정소송법", year:2019, no:72, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"행정소송상 처분변경으로 인한 소의 변경에 관한 설명으로 옳지 않은 것은?",
  choices:["원고의 신청에 의하여 법원의 결정으로 허가한다.","처분의 변경이 있음을 안 날로부터 60일 이내에 하여야 한다.","소의 변경을 위해서는 소가 계속중이고 사실심 변론종결전이어야 한다.","처분변경으로 인한 새로운 청구는 행정심판의 전치가 요구되는 경우에도 행정심판전치요건을 갖춘 것으로 본다.","당사자소송에서는 인정되지 않는다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2019-73", subject:"행정소송법", year:2019, no:73, law:"행정소송법", unit:"피고적격", kind:"concept",
  stem:"행정소송의 피고에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분이 있은 뒤에 그 처분에 관계되는 권한이 다른 행정청에 승계된 때에는 이를 승계한 행정청을 피고로 한다.","대통령이 행한 공무원의 징계처분에 관한 행정소송의 피고는 소속장관이다.","재결이 항고소송의 대상이 되는 경우에는 재결을 한 행정심판기관이 피고가 된다.","피고를 잘못 지정한 경우 고의 또는 중대한 과실이 있으면 법원은 피고의 경정을 허가할 수 없다.","소의 종류의 변경에 따른 피고의 변경은 교환적 변경에 한한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2019-74", subject:"행정소송법", year:2019, no:74, law:"행정소송법", unit:"피고적격", kind:"concept",
  stem:"행정소송법상 피고경정에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["원고가 피고를 잘못 지정한 경우에는 법원은 원고의 신청에 의하여 결정으로써 피고의 경정을 허가할 수 있다.","피고경정신청의 각하결정에 대하여 원고는 즉시항고할 수 있다.","피고경정결정이 있는 때에는 종전의 피고에 대한 소송은 취하된 것으로 본다.","피고경정결정에 대하여 경정 전의 피고는 즉시항고할 수 있다.","피고경정은 사실심 변론종결시까지 가능하다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2019-75", subject:"행정소송법", year:2019, no:75, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"행정소송법상 당사자소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["원고가 고의 또는 중대한 과실 없이 당사자소송으로 제기하여야 할 것을 항고소송으로 제기한 경우 당사자소송의 소송요건을 갖추었다면 법원은 당사자소송으로 소를 변경하도록 하여야 한다.","당사자소송은 취소소송의 원고적격 규정을 준용한다.","당사자소송은 국가·공공단체 그 밖의 권리주체를 피고로 한다.","당사자소송에서는 피고경정이 가능하다.","지방자치단체에 대하여 재산권의 청구를 인용하는 판결을 하는 경우 가집행선고를 할 수 있다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2019-76", subject:"행정소송법", year:2019, no:76, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"행정소송상 집행정지에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["집행정지의 소극적 요건은 신청인이 주장·소명하는 반면, 적극적 요건은 행정청이 주장·소명해야 한다.","집행정지결정을 한 후에는 본안소송이 취하되어도 집행정지결정의 효력은 유지된다.","본안소송이 부작위위법확인소송인 경우 집행정지가 가능하다.","집행정지결정은 당해 사건에 관하여 당사자인 행정청과 관계행정청을 기속한다.","집행정지 사건 자체에 의하여도 신청인의 본안청구가 적법한 것이어야 한다는 것은 집행정지의 요건이 아니다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2019-77", subject:"행정소송법", year:2019, no:77, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송법상 원고의 신청에 의하여만 가능한 행위는?",
  choices:["피고경정","관련청구소송의 이송","집행정지의 취소","제3자의 소송참가","행정청의 소송참가"],
  answer:1, status:"clear", note:"" },
{ id:"hs2019-78", subject:"행정소송법", year:2019, no:78, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"행정소송에서의 가구제에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["재량행위의 경우 처분의 일부에 대한 집행정지는 허용되지 않는다.","형사피고인을 현재 수감 중인 교도소에서 타교도소로 이송함으로써 발생할 수 있는 피해는 집행정지의 요건인 회복하기 어려운 손해에 해당한다.","집행정지의 결정에 대한 즉시항고에는 결정의 집행을 정지하는 효력이 없다.","「민사집행법」 상의 가처분으로써 행정청의 행정행위의 금지를 구하는 것은 허용되지 않는다.","당사자소송에서는 집행정지가 인정되지 않는다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2019-79", subject:"행정소송법", year:2019, no:79, law:"행정소송법", unit:"소송참가", kind:"concept",
  stem:"행정소송법상 소송참가에 관한 설명으로 옳지 않은 것은?",
  choices:["행정소송법은 제3자의 소송참가와 행정청의 소송참가를 규정하고 있다.","취소소송에서의 행정청의 소송참가 규정은 민중소송에는 준용되지 아니한다.","제3자의 소송참가가 허용되기 위하여는 당해 소송의 결과에 따라 제3자의 권리 또는 이익이 침해되어야 한다.","제3자의 소송참가는 당사자 또는 제3자의 신청 또는 직권에 의하여 법원이 결정한다.","참가행정청의 소송행위가 피참가인의 소송행위와 어긋나는 때에는 그 효력이 없다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2019-80", subject:"행정소송법", year:2019, no:80, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"확정된 취소판결의 효력에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["기속력은 인용판결에 인정되고, 형성력과 기판력은 인용판결과 기각판결 모두에 대해서 인정된다.","운전면허취소처분을 취소하는 판결이 확정된 경우 운전면허취소처분은 행정행위의 공정력으로 인하여 장래에 향하여서만 효력을 잃게 된다.","임용기간이 만료된 국립대학 교원의 재임용거부처분이 판결로 취소되면 임용권자는 다시 재임용 여부를 결정할 의무를 부담할 뿐이고, 교원의 신분관계가 소급하여 회복되는 것은 아니다.","판결의 기속력에 위반하여 한 행정청의 행위는 그 하자가 중대하지만 명백하지 아니하여 취소사유가 된다.","처분을 취소하는 확정판결의 기속력은 당사자인 행정청에 대해서만 미친다."],
  answer:3, status:"clear", note:"" },

{ id:"hg2020-1", subject:"회계학개론", year:2020, no:1, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"유용한 재무정보의 질적특성에 관한 설명으로 옳지 않은 것은?",
  choices:["재무정보가 예측가치를 갖기 위해서 그 자체가 예측치 또는 예상치일 필요는 없다.","하나의 경제적 현상은 여러 가지 방법으로 충실하게 표현될 수 있으나, 동일한 경제적 현상에 대해 대체적인 회계처리방법을 허용하면 비교가능성이 감소한다.","목적적합하지 않은 현상에 대한 표현충실성과 목적적합한 현상에 대한 충실하지 못한 표현 모두 이용자들이 좋은 결정을 내리는 데 도움이 되지 않는다.","회계기준위원회는 중요성에 대한 획일적인 계량 임계치를 정하거나 특정한 상황에서 무엇이 중요한 것인지를 미리 결정할 수 없다.","보강적 질적특성은 정보가 목적적합하지 않거나 나타내고자 하는 바를 충실하게 표현하지 않더라도 그 정보를 유용하게 만들 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hg2020-2", subject:"회계학개론", year:2020, no:2, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"자산의 인식과 측정에 관한 설명으로 옳지 않은 것은?",
  choices:["자산의 정의를 충족하는 항목만이 재무상태표에 자산으로 인식된다.","합리적인 추정의 사용은 재무정보 작성의 필수적인 부분이며 추정치를 명확하고 정확하게 기술하고 설명한다면 정보의 유용성을 훼손하지 않는다.","사용가치는 기업이 자산의 사용과 궁극적인 처분으로 얻을 것으로 기대하는 현금흐름 또는 그 밖의 경제적효익의 현재가치이다.","공정가치는 자산을 취득할 때 발생한 거래원가로 인해 증가하지 않는다.","경제적효익의 유입가능성이 낮으면 자산으로 인식해서는 안된다."],
  answer:5, status:"clear", note:"" },
{ id:"hg2020-3", subject:"회계학개론", year:2020, no:3, law:"회계학개론", unit:"수익인식", kind:"concept",
  stem:"수익의 인식에 관한 설명으로 옳지 않은 것은?",
  choices:["거래가격은 고객에게 약속한 재화나 용역을 이전하고 그 대가로 기업이 받을 권리를 갖게 될 것으로 예상하는 금액이며, 제삼자를 대신해서 회수한 금액(예: 일부 판매세)은 제외한다.","약속한 재화나 용역이 구별되지 않는다면, 구별되는 재화나 용역의 묶음을 식별할 수 있을 때까지 그 재화나 용역을 약속한 다른 재화나 용역과 결합한다.","변동대가(금액)는 기댓값 또는 가능성이 가장 높은 금액 중에서 고객이 받을 권리를 갖게 될 대가(금액)를 더 잘 예측할 것으로 예상하는 방법을 사용하여 추정한다.","계약의 각 당사자가 전혀 수행되지 않은 계약에 대해 상대방(들)에게 보상하지 않고 종료할 수 있는 일방적이고 집행 가능한 권리를 갖는다면, 그 계약은 존재하지 않는다고 본다.","계약을 개시한 다음에는 계약 당사자들이 수행의무를 실질적으로 변경하는 계약변경을 승인하지 않는 한, 자산이 기업에 대체 용도가 있는지를 다시 판단하지 않는다."],
  answer:3, status:"clear", note:"" },
{ id:"hg2020-4", subject:"회계학개론", year:2020, no:4, law:"회계학개론", unit:"유형자산", kind:"calc",

{ id:"hg2020-9", subject:"회계학개론", year:2020, no:9, law:"회계학개론", unit:"현금흐름표", kind:"calc",

{ id:"hg2020-10", subject:"회계학개론", year:2020, no:10, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무는 20×1년 1월 1일 사용목적으로 건물(취득원가 ￦2,000,000, 내용연수 10년, 잔존가치 ￦400,000, 정액법 감가상각)을 취득하고 원가모형을 적용하고 있다. 20×2년 말과 20×4년 말 동 건물의 순공정가치와 사용가치가 다음과 같을 때, 20×4년도 손상차손환입액은?\n구분 / 20×2년 말 / 20×4년 말\n순공정가치 ￦1,200,000 / ￦1,500,000\n사용가치 1,400,000 / 1,300,000",

{ id:"hg2020-11", subject:"회계학개론", year:2020, no:11, law:"회계학개론", unit:"금융자산", kind:"concept",

{ id:"hg2020-15", subject:"회계학개론", year:2020, no:15, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"보고기간 후 사건에 관한 설명으로 옳은 것은?",
  choices:["보고기간 후에 발생한 상황을 나타내기 위하여, 재무제표에 인식된 금액을 수정한다.","보고기간말과 재무제표 발행승인일 사이에 투자자산의 공정가치가 하락한다면, 재무제표에 투자자산으로 인식된 금액을 수정한다.","보고기간 후에 지분상품 보유자에 대해 배당을 선언한 경우, 그 배당금을 보고기간말의 부채로 인식하지 아니한다.","보고기간말에 존재하였던 상황에 대한 정보를 보고기간 후에 추가로 입수한 경우에도 그 정보를 반영하여 공시 내용을 수정하지 않는다.","경영진이 보고기간 후에, 기업을 청산하거나 경영활동을 중단할 의도를 가지고 있거나, 청산 또는 경영활동의 중단 외에 다른 현실적 대안이 없다고 판단하는 경우에도 계속기업의 기준에 따라 재무제표를 작성할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hg2020-16", subject:"회계학개론", year:2020, no:16, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"중간재무보고에 관한 내용으로 옳은 것은?",
  choices:["한국채택국제회계기준에 따라 중간재무보고서를 작성한 경우, 그 사실을 공시할 필요는 없다.","중간재무보고서상의 재무상태표는 당해 중간보고기간 말과 직전연도 동일 기간 말을 비교하는 형식으로 작성한다.","중간재무보고서상의 포괄손익계산서는 당해 중간기간과 당해 회계연도 누적기간을 직전 회계연도의 동일기간과 비교하는 형식으로 작성한다.","중간재무보고서를 작성할 때 인식, 측정, 분류 및 공시와 관련된 중요성의 판단은 직전 회계연도의 재무자료에 근거하여 이루어져야 한다.","중간재무보고서상의 재무제표는 연차재무제표보다 더 많은 정보를 제공하므로 신뢰성은 높고, 적시성은 낮다."],
  answer:3, status:"clear", note:"" },
{ id:"hg2020-17", subject:"회계학개론", year:2020, no:17, law:"회계학개론", unit:"리스", kind:"concept",
  stem:"리스에 관한 설명으로 옳은 것은?",
  choices:["제조자 또는 판매자인 리스제공자의 운용리스 체결은 운용리스 체결 시점에 매출이익을 인식한다.","금융리스로 분류되는 경우 리스제공자는 자신의 리스총투자 금액에 일정한 기간수익률을 반영하는 방식으로 리스기간에 걸쳐 금융수익을 인식한다.","리스제공자는 운용리스 체결 과정에서 부담하는 리스개설직접원가를 기초자산의 장부금액에 더하고 리스료 수익과 같은 기준으로 리스기간에 걸쳐 비용으로 인식한다.","기초자산의 소유에 따른 위험과 보상의 대부분을 이전하는 리스는 운용리스로 분류하고, 기초자산의 소유에 따른 위험과 보상의 대부분을 이전하지 않는 리스는 금융리스로 분류한다.","제조자 또는 판매자인 리스제공자의 금융리스 체결은 금융리스 체결 시점에 기초자산의 원가(원가와 장부금액이 다를 경우에는 장부금액)에서 보증잔존가치를 뺀 금액을 매출원가로 인식한다."],
  answer:3, status:"clear", note:"" },
{ id:"hg2020-18", subject:"회계학개론", year:2020, no:18, law:"회계학개론", unit:"금융부채·사채", kind:"calc",
  stem:"(주)세무는 20×1년 1월 1일 액면금액 ￦1,000,000인 신주인수권부사채(만기 3년, 표시이자율 연 7%, 매년 말 이자지급)를 액면발행 하였다. 동 신주인수권부사채 발행 당시 동일한 조건의 일반사채의 유효이자율은 연 12%이다. 동 사채는 발행일로부터 18개월이 경과한 시점부터 상환기일 30일 전까지 사채의 액면금액 ￦10,000당 보통주 1주(주당 액면금액 ￦5,000)를 인수할 수 있는 권리가 부여되어 있다. 만기까지 신주인수권을 행사하지 않을 경우 액면금액의 113.5%를 보장한다. (주)세무의 20×1년도 이자비용은? (단, 계산금액은 소수점 이하 첫째자리에서 반올림한다.)",
  choices:["￦70,000","￦117,122","￦122,777","￦135,000","￦158,981"],
  answer:2, status:"clear", note:"" },
{ id:"hg2020-19", subject:"회계학개론", year:2020, no:19, law:"회계학개론", unit:"금융부채·사채", kind:"calc",
  stem:"(주)세무는 20×1년 1월 1일 (주)대한에게 사채A(액면금액 ￦1,000,000, 만기 5년, 표시이자율 연 5%, 매년 말 이자지급)를 발행하고 상각후원가측정금융부채로 분류하였다. 사채발행 시점의 유효이자율은 연 10%이고, 사채할인발행차금을 유효이자율법으로 상각하고 있다. 20×4년 1월 1일 유효이자율이 연 8%로 하락함에 따라 (주)민국에게 새로운 사채B(액면금액 ￦1,000,000, 만기 2년, 표시이자율 연 3%, 매년 말 이자지급)를 발행하여 수취한 현금으로 사채A를 조기상환 하였다. (주)세무가 20×4년 1월 1일 인식할 사채A의 상환손익과 사채B의 발행금액은? (단, 계산금액은 소수점 이하 첫째자리에서 반올림한다.)",
  choices:["사채A 상환손익 손실 ￦2,396 / 사채B 발행금액 ￦878,465","사채A 상환손익 손실 ￦2,396 / 사채B 발행금액 ￦913,195","사채A 상환손익 손실 ￦2,396 / 사채B 발행금액 ￦915,591","사채A 상환손익 이익 ￦2,396 / 사채B 발행금액 ￦910,799","사채A 상환손익 이익 ￦2,396 / 사채B 발행금액 ￦1,000,000"],
  answer:4, status:"clear", note:"" },
{ id:"hg2020-20", subject:"회계학개론", year:2020, no:20, law:"회계학개론", unit:"법인세회계", kind:"calc",
  stem:"20×1년 초에 설립된 (주)세무의 20×1년도 포괄손익계산서상 법인세비용차감전순이익은 ￦700,000이고, 법인세율은 20%이다. 당기 법인세부담액을 계산하기 위한 세무조정사항 및 이연법인세자산(부채) 자료가 다음과 같을 때, 20×1년도 법인세비용은?\n○ 20×1년도에 당기손익-공정가치측정금융자산평가손실로 ￦100,000을 인식하였으며, 동 금융자산은 20×2년에 처분한다.\n○ 20×1년 세법상 손금한도를 초과하여 지출한 접대비는 ￦100,000이다.\n○ 20×1년 정기예금(만기 20×2년)에서 발생한 이자 ￦20,000을 미수수익으로 인식하였다.\n○ 20×2년 법인세율은 18%로 예상된다.\n○ 일시적 차이가 사용될 수 있는 미래 과세소득의 발생가능성은 높다.",
  choices:["￦158,000","￦161,600","￦176,000","￦179,600","￦190,400"],
  answer:2, status:"clear", note:"" },
{ id:"hg2020-21", subject:"회계학개론", year:2020, no:21, law:"회계학개론", unit:"충당부채", kind:"calc",
  stem:"(주)세무는 20×1년부터 제품을 판매하기 시작하고 3년간 품질을 보증하며, 품질보증기간이 지나면 보증의무는 사라진다. 과거의 경험에 의하면 제품 1단위당 ￦200의 제품보증비가 발생하며, 판매량의 5%에 대하여 품질보증요청이 있을 것으로 추정된다. 20×3년 말 현재 20×1년에 판매한 제품 중 4%만 실제 제품보증활동을 수행하였다. 20×1년부터 20×3년까지의 판매량과 보증비용 지출액 자료는 다음과 같다.\n연도 / 판매량(대) / 보증비용 지출액\n20×1년 3,000 / ￦20,000\n20×2년 4,000 / 30,000\n20×3년 6,000 / 40,000\n(주)세무가 제품보증과 관련하여 충당부채를 설정한다고 할 때, 20×3년 말 제품보증충당부채는? (단, 모든 보증활동은 현금지출로 이루어진다.)",
  choices:["￦10,000","￦14,000","￦20,000","￦34,000","￦40,000"],
  answer:5, status:"clear", note:"" },
{ id:"hg2020-22", subject:"회계학개론", year:2020, no:22, law:"회계학개론", unit:"주당이익", kind:"calc",
  stem:"(주)세무의 20×1년 초 유통보통주식수는 8,000주(1주당 액면금액 ￦100)이다. 20×1년도 희석주당이익 계산을 위한 자료는 다음과 같다.\n○ 4월 1일 유상증자로 보통주 3,000주 발행(신주 발행금액은 주당 ￦400으로 유상증자일 직전 종가 ￦600보다 현저히 낮았음)\n○ 9월 1일 자기주식 300주 취득\n○ 10월 1일 옵션 600개 발행(옵션 1개당 1주의 보통주 발행, 행사가격은 1주당 ￦300, 보통주 1주의 평균주가는 ￦500)\n○ 12월 31일 전년도 발행 전환사채(액면금액 ￦500,000, 액면금액 ￦10,000당 1주의 보통주로 전환가능)는 전환되지 않았음\n20×1년도 희석주당이익 계산을 위해 가중평균한 유통보통주식수와 잠재적보통주식수의 합계는? (단, 주식수는 월수계산하고, 소수점 이하 첫째자리에서 반올림한다.)",
  choices:["10,150주","10,260주","10,310주","10,460주","10,850주"],
  answer:4, status:"clear", note:"" },
{ id:"hg2020-23", subject:"회계학개론", year:2020, no:23, law:"회계학개론", unit:"종업원급여", kind:"calc",
  stem:"(주)세무는 확정급여제도를 채택하여 시행하고 있다. 20×1년 초 확정급여채무의 현재가치는 ￦900,000이고, 사외적립자산의 공정가치는 ￦720,000이다. 20×1년 동안 당기근무원가는 ￦120,000이다. 20×1년 9월 1일 퇴직한 종업원에게 ￦90,000의 퇴직급여가 사외적립자산에서 지급되었으며, 20×1년 10월 1일 사외적립자산에 대한 기여금 ￦60,000을 납부하였다. 20×1년 말 순확정급여부채는? (단, 우량회사채의 시장수익률은 연 10%이고, 이자원가 및 이자수익은 월할계산한다.)",
  choices:["￦240,000","￦256,500","￦258,000","￦316,500","￦318,000"],
  answer:2, status:"clear", note:"" },
{ id:"hg2020-24", subject:"회계학개론", year:2020, no:24, law:"회계학개론", unit:"수익인식", kind:"calc",
  stem:"(주)세무는 20×1년 초 (주)대한과 건설계약(공사기간 3년, 계약금액 ￦850,000)을 체결하였다. 관련 자료가 다음과 같을 때, 20×1년 말 미청구공사금액(또는 초과청구공사금액)과 20×2년도 공사이익은? (단, 진행기준으로 수익을 인식하고 진행률은 누적발생계약원가를 추정총계약원가로 나눈 비율로 측정한다.)\n구분 / 20×1년 / 20×2년 / 20×3년\n누적발생계약원가 ￦432,000 / ￦580,000 / ￦740,000\n추정총계약원가 720,000 / 725,000 / 740,000\n계약대금청구금액 390,000 / 310,000 / 150,000\n계약대금수령금액 450,000 / 200,000 / 200,000",
  choices:["초과청구공사 ￦0 / 20×2년도 공사이익 ￦78,000","초과청구공사 ￦20,000 / 20×2년도 공사이익 ￦22,000","초과청구공사 ￦20,000 / 20×2년도 공사이익 ￦78,000","미청구공사 ￦120,000 / 20×2년도 공사이익 ￦22,000","미청구공사 ￦120,000 / 20×2년도 공사이익 ￦78,000"],
  answer:4, status:"clear", note:"" },
{ id:"hg2020-25", subject:"회계학개론", year:2020, no:25, law:"회계학개론", unit:"사업결합·연결", kind:"calc",
  stem:"(주)세무는 20×1년 7월 1일 (주)대한을 현금 ￦1,200,000에 흡수합병하였다. (주)대한이 보유하고 있는 건물(장부금액 ￦430,000, 공정가치 ￦410,000, 순공정가치 ￦400,000)은 취득일에 매각예정비유동자산으로 분류되었다. 취득일 현재 건물을 제외한 (주)대한의 자산, 부채 장부금액과 공정가치는 다음과 같다.\n계정과목 / 장부금액 / 공정가치\n현금 ￦100,000 / ￦100,000\n매출채권 100,000 / 100,000\n제품 200,000 / 240,000\n투자부동산 320,000 / 250,000\n토지 200,000 / 300,000\n매입채무 50,000 / 50,000\n사채 170,000 / 170,000\n20×1년 7월 1일 합병 시 (주)세무가 인식할 영업권은?",
  choices:["￦0","￦20,000","￦30,000","￦70,000","￦100,000"],
  answer:3, status:"clear", note:"" },
{ id:"hg2020-26", subject:"회계학개론", year:2020, no:26, law:"회계학개론", unit:"종합원가계산", kind:"calc",
  stem:"(주)세무는 종합원가계산제도를 채택하고 있다. (주)세무의 20×1년 당기제조착수량은 100단위, 기말재공품은 40단위(전환원가 완성도 25%)이며, 당기투입원가는 직접재료원가 ￦40,000, 전환원가(conversion cost) ￦70,000이다. 직접재료는 공정이 시작되는 시점에서 전량 투입되며, 전환원가는 공정전반에 걸쳐 균등하게 발생할 때, 기말재공품의 원가는? (단, 기초재공품, 공손 및 감손은 없다.)",
  choices:["￦10,000","￦16,000","￦26,000","￦28,000","￦56,000"],

{ id:"hg2020-27", subject:"회계학개론", year:2020, no:27, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 20×1년 연간 최대생산량이 8,000단위인 생산설비를 보유하고 있다. (주)세무는 당기에 제품 7,000단위를 단위당 ￦1,000에 판매할 것으로 예상하며, 단위당 변동제조원가는 ￦500, 단위당 변동판매관리비는 ￦100이다. (주)세무는 거래처로부터 제품 2,000단위를 판매할 수 있는 특별주문을 받았으며, 단위당 변동제조원가와 단위당 변동판매관리비는 변화가 없다. 이 특별주문을 수락한다면, 예상 판매량 중 1,000단위를 포기해야 한다. 이 때, 특별주문 제품의 단위당 최저 판매가격은?",

{ id:"hg2020-28", subject:"회계학개론", year:2020, no:28, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 단일 제품을 생산하며, 정상원가계산제도를 채택하고 있다. 제조간접원가는 기계시간을 기준으로 배부한다. 20×1년 제조간접원가 예산은 ￦40,000이고, 예정 기계시간은 2,000시간이다. 20×1년 실제 기계시간은 2,100시간, 제조간접원가 과대배부액은 ￦3,000이다. 20×1년 (주)세무의 제조간접원가 실제발생액은?",

{ id:"hg2020-29", subject:"회계학개론", year:2020, no:29, law:"회계학개론", unit:"활동기준원가계산", kind:"calc",

{ id:"hg2020-30", subject:"회계학개론", year:2020, no:30, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 개별원가계산제도를 채택하고 있으며, 제품A와 제품B를 생산하고 있다. 기초재공품은 없으며, 제품이 모두 기말에 완성되었다. (주)세무의 20×1년 원가자료는 다음과 같다. 제조간접원가를 직접노무원가 발생액에 비례하여 배부하는 경우, 제품A와 제품B의 제조원가는?\n제품A: 직접재료원가(기초재고액￦20,000, 당기매입액40,000, 기말재고액10,000), 직접노무원가(전기말미지급액￦22,000, 당기지급액45,000, 당기말미지급액20,000)\n제품B: 직접재료원가(기초재고액￦10,000, 당기매입액30,000, 기말재고액15,000), 직접노무원가(전기말미지급액￦30,000, 당기지급액60,000, 당기말미지급액27,000)\n제조간접원가 총액 ￦30,000",
  choices:["제품A ￦94,900 / 제품B ￦110,100","제품A ￦99,100 / 제품B ￦105,900","제품A ￦105,900 / 제품B ￦94,900","제품A ￦105,900 / 제품B ￦99,100","제품A ￦110,100 / 제품B ￦94,900"],

{ id:"hg2020-31", subject:"회계학개론", year:2020, no:31, law:"회계학개론", unit:"종합원가계산", kind:"calc",
  stem:"(주)세무는 종합원가계산제도를 채택하고 있다. 직접재료는 공정이 시작되는 시점에서 전량 투입되며, 전환원가는 공정전반에 걸쳐서 균등하게 발생한다. 당기완성품환산량 단위당 원가는 직접재료원가 ￦2,000, 전환원가 ￦500이었다. 생산 공정에서 공손품이 발생하는데 이러한 공손품은 제품을 검사하는 시점에서 파악된다. 공정의 50% 시점에서 검사를 수행하며, 정상공손수량은 검사 시점을 통과한 합격품의 10%이다. (주)세무의 생산활동 자료가 다음과 같을 때, 정상공손원가는?\n○ 기초재공품: 500단위(전환원가 완성도 30%) ○ 당기완성량: 1,800단위 ○ 당기착수량: 2,000단위 ○ 기말재공품: 400단위(전환원가 완성도 70%)",
  choices:["￦440,000","￦495,000","￦517,000","￦675,000","￦705,000"],
  answer:2, status:"clear", note:"" },
{ id:"hg2020-32", subject:"회계학개론", year:2020, no:32, law:"회계학개론", unit:"결합원가계산", kind:"calc",
  stem:"(주)세무는 20×1년 원재료 X를 가공하여 연산품A와 연산품B를 생산하는데 ￦36,000의 결합원가가 발생하였다. 분리점 이후 최종제품 생산을 위해서는 각각 추가가공원가가 발생한다. 균등매출총이익률법으로 결합원가를 연산품에 배부할 때, 연산품B에 배부되는 결합원가는? (단, 공손 및 감손은 없으며, 기초 및 기말재공품은 없다.)\n제품 / 생산량 / 최종 판매단가 / 최종판매가액 / 추가가공원가(총액)\nA 1,000리터 / ￦60 / ￦60,000 / ￦8,000\nB 500리터 / ￦40 / ￦20,000 / ￦4,000\n합계 1,500리터 / / ￦80,000 / ￦12,000",

{ id:"hg2020-33", subject:"회계학개론", year:2020, no:33, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 제조부문(금형, 조립)과 보조부문(유지, 동력)을 이용하여 제품을 생산하고 있다. 유지부문원가는 기계시간, 동력부문원가는 전력량을 기준으로 단계배부법을 사용하여 보조부문원가를 제조부문에 배부한다. 보조부문원가를 배부하기 위한 20×1년 원가자료와 배부기준은 다음과 같다.\n구분 / 보조부문(유지/동력) / 제조부문(금형/조립)\n부문개별원가 ￦120,000 / ￦80,000 / ￦200,000 / ￦300,000\n부문공통원가(합계) ￦200,000\n기계시간(시간) - / 200 / 400 / 400\n전력량(kWh) 100 / - / 300 / 200\n점유면적(㎡) 10 / 20 / 30 / 40\n(주)세무의 부문공통원가 ￦200,000은 임차료이며, 이는 점유면적을 기준으로 각 부문에 배부한다. 20×1년 (주)세무의 배부 후, 금형부문의 총원가는? (단, 보조부문원가는 유지부문, 동력부문의 순으로 배부한다.)",
  choices:["￦144,800","￦148,800","￦204,800","￦344,800","￦404,800"],

{ id:"hg2020-34", subject:"회계학개론", year:2020, no:34, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 외부 판매대리점을 통해 건강보조식품을 판매하고 있는데, 20×1년도 손익계산서 자료는 다음과 같다.\n매출액 ￦100,000 / 변동매출원가 ￦45,000 / 고정매출원가 ￦15,000 / 변동판매비와관리비(판매대리점 수수료) ￦18,000 / 고정판매비와관리비 ￦4,000 / 영업이익 ￦18,000\n(주)세무는 20×1년에 판매대리점에게 매출액의 18%를 판매대리점 수수료로 지급하였는데, 20×2년에는 판매대리점 대신 회사 내부판매원을 통해 판매하려고 한다. 이 경우, 내부판매원에게 매출액의 15%에 해당하는 수수료와 고정급여 ￦8,000이 지출될 것으로 예상된다. (주)세무가 20×2년에 내부판매원을 통해 20×1년과 동일한 영업이익을 얻기 위해 달성해야 할 매출액은?",
  choices:["￦75,000","￦81,818","￦90,000","￦100,000","￦112,500"],
  answer:5, status:"clear", note:"" },
{ id:"hg2020-35", subject:"회계학개론", year:2020, no:35, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 제약자원인 특수기계를 이용하여 제품A, 제품B, 제품C를 생산·판매한다. 제품의 생산·판매와 관련된 자료는 다음과 같다.\n구분 / 제품A / 제품B / 제품C\n단위당 판매가격 ￦50 / ￦60 / ￦120\n단위당 변동원가 20 / 36 / 60\n단위당 특수기계 이용시간 2시간 / 1시간 / 3시간\n특수기계의 최대이용가능시간이 9,000시간이고, 각각의 제품에 대한 시장수요가 1,000단위(제품A), 3,000단위(제품B), 2,000단위(제품C)로 한정되어 있을 때, (주)세무가 달성할 수 있는 최대공헌이익은?",

{ id:"hg2020-36", subject:"회계학개론", year:2020, no:36, law:"회계학개론", unit:"전부원가·변동원가계산", kind:"calc",
  stem:"(주)세무는 단일 제품을 생산·판매하고 있으며, 3년간의 자료는 다음과 같다.\n구분 / 20×1년 / 20×2년 / 20×3년\n기초제품재고량(단위) - / 20,000 / 10,000\n당기생산량(단위) 60,000 / 30,000 / 50,000\n당기판매량(단위) 40,000 / 40,000 / 40,000\n기말제품재고량(단위) 20,000 / 10,000 / 20,000\n3년간 판매가격과 원가구조의 변동은 없다. 20×1년 전부원가계산하의 영업이익은 ￦800,000이고, 고정원가가 ￦600,000일 때, 20×3년 전부원가계산하의 영업이익은? (단, 원가흐름은 선입선출법을 가정하며, 기초 및 기말 재공품은 없다.)",

{ id:"hg2020-37", subject:"회계학개론", year:2020, no:37, law:"회계학개론", unit:"표준원가계산", kind:"calc",
  stem:"(주)세무는 표준원가계산제도를 채택하고 있으며, 직접노무시간을 기준으로 제조간접원가를 배부한다. 20×1년의 생산 및 원가 자료가 다음과 같을 때, 변동제조간접원가 소비차이는?\n변동제조간접원가 실제발생액 ￦130,000 / 실제총직접노무시간 8,000시간 / 당기제품생산량 3,600단위 / 제품당 표준직접노무시간 2시간 / 변동제조간접원가 능률차이 ￦8,000(불리)",

{ id:"hg2020-38", subject:"회계학개론", year:2020, no:38, law:"회계학개론", unit:"제조원가의 흐름", kind:"calc",
  stem:"다음은 (주)세무의 20×1년도 2/4분기 판매량 예산이다. 월말 제품재고는 다음 달 판매량의 10%를 보유하는 정책을 유지하고 있으며, 제품 단위당 직접노무시간은 4월 3시간, 5월 3시간, 6월에는 4시간 소요될 것으로 예상하고 있다. 시간당 임금이 4월에 ￦50, 5월부터 매월 ￦5씩 상승한다고 할 때, 6월의 직접노무원가예산은? (단, 7월의 판매량 예산은 5,000단위이다.)\n4월: 3,000단위 5월: 4,000단위 6월: 4,000단위",

{ id:"hg2020-39", subject:"회계학개론", year:2020, no:39, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 20×1년에 오토바이를 생산·판매하고 있다. 오토바이 1대당 판매가격은 ￦200이며, 단위당 제조원가 내역은 다음과 같다.\n직접재료원가 ￦86 / 직접노무원가 45 / 변동제조간접원가 9 / 고정제조간접원가 42 / 단위당 제조원가 ￦182\n(주)세무는 경찰청으로부터 순찰용 오토바이 100대를 1대당 ￦180에 공급해달라는 특별주문을 받았다. 특별주문에 대해서는 오토바이를 순찰용으로 변경하기 위해 네비게이션을 장착하는데 1대당 ￦10의 원가가 추가적으로 발생한다. 또한 경찰청 로고 제작을 위해 디자인 스튜디오에 ￦1,200을 지급해야 한다. 현재 (주)세무의 생산능력은 최대생산능력에 근접해 있으므로 특별주문을 수락하면 기존 오토바이 10대의 생산을 포기해야 한다. (주)세무가 경찰청의 특별주문을 수락할 때, 증분이익은?",
  choices:["￦0","증분이익 ￦800","증분이익 ￦1,000","증분이익 ￦1,200","증분이익 ￦1,400"],
  answer:4, status:"clear", note:"" },
{ id:"hg2020-40", subject:"회계학개론", year:2020, no:40, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 사무실용과 가정용 공기청정기를 판매한다. 다음은 (주)세무의 20×1년 예산과 실제결과에 대한 자료이다.\n(20×1년 예산)\n제품 / 단위당 판매가격 / 단위당 변동원가 / 판매수량\n사무실용 공기청정기 ￦180 / ￦120 / 30,000대\n가정용 공기청정기 ￦135 / ￦90 / 90,000대\n(20×1년 실제결과)\n제품 / 단위당 판매가격 / 단위당 변동원가 / 판매수량\n사무실용 공기청정기 ￦165 / ￦112.5 / 37,800대\n가정용 공기청정기 ￦120 / ￦82.5 / 88,200대\n20×1년도 공기청정기의 전체 실제시장규모는 1,050,000대이며, (주)세무의 시장점유율차이는 ￦1,023,750(유리)이다. (주)세무가 예상한 20×1년도 전체 공기청정기의 시장규모는?",
  choices:["857,143대","923,077대","1,100,000대","1,150,000대","1,200,000대"],

{ id:"hs2020-41", subject:"행정소송법", year:2020, no:41, law:"행정소송법", unit:"행정소송의 종류·한계", kind:"concept",
  stem:"행정소송의 한계에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["특별권력관계 내에서의 행위는 처분이라도 사법심사의 대상이 될 수 없다.","행정상 방침만을 정하는 훈시규정의 준수와 실현을 행정소송으로 주장할 수 있다.","민중소송은 개인의 구체적인 권리·의무에 직접 관련되므로 법률규정과 무관하게 인정된다.","과거의 역사적 사실관계의 존부확인을 구하는 것은 행정소송의 대상이 된다.","국회의원의 징계처분은 행정소송의 대상이 되지 아니한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2020-42", subject:"행정소송법", year:2020, no:42, law:"행정소송법", unit:"행정소송의 종류·한계", kind:"concept",
  stem:"의무이행소송과 예방적 부작위소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정청에게 행정에 대한 1차적 판단권이 귀속되어야 한다는 점은 의무이행소송 및 예방적 부작위소송의 부정설이 취하는 논거이다.","국민건강보험공단이 보건복지부고시를 적용하여 요양급여비용을 결정하여서는 아니된다는 내용의 소송은 허용되지 아니한다.","현행 「행정소송법」상 행정청으로 하여금 일정한 행정처분을 하도록 명하는 이행판결을 구하는 소송은 허용되지 아니한다.","현행 「행정소송법」상 법원으로 하여금 행정청이 일정한 행정처분을 행한 것과 같은 효과가 있는 행정처분을 직접 행하도록 하는 형성판결을 구하는 소송은 허용된다.","건축건물의 준공처분을 하여서는 아니 된다는 내용의 청구는 행정소송에서 허용되지 아니한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2020-43", subject:"행정소송법", year:2020, no:43, law:"행정소송법", unit:"무효등확인소송", kind:"concept",
  stem:"무효등확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["과세처분무효확인소송에서 당사자가 청구원인에서 무효사유로 내세운 개개의 주장은 공격방어방법에 불과하다.","무효등확인소송은 처분등의 효력 유무 또는 존재 여부의 확인을 구할 법률상 이익이 있는 자가 제기할 수 있다.","과세처분의 취소소송에서 청구가 기각된 확정판결의 기판력은 다시 그 과세처분의 무효확인을 구하는 소송에도 미친다.","무효등확인소송의 경우에 집행부정지원칙은 적용되지 아니한다.","재결무효등확인소송의 경우 재결 자체에 고유한 위법이 있음을 이유로 하는 경우에 한한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2020-44", subject:"행정소송법", year:2020, no:44, law:"행정소송법", unit:"부작위위법확인소송", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["부작위의 전제가 되는 작위의무의 확인을 구하는 소송은 항고소송으로서 허용된다.","검사의 불기소처분에 대하여 부작위위법확인소송을 제기할 수 있다.","추상적인 법령의 제정 여부에 관한 분쟁은 부작위위법확인소송의 대상이 될 수 있다.","기관소송으로써 부작위의 위법의 확인을 구하는 소송에는 그 성질에 반하지 아니하는 한 부작위위법확인소송에 관한 규정을 준용한다.","형사본안사건에서 무죄가 선고되어 확정됨에 따라 압수물의 환부를 피압수자가 신청하였는데 검사가 아무런 결정이나 통지를 하지 않고 있으면 그와 같은 검사의 부작위는 부작위위법확인소송의 대상이 될 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2020-45", subject:"행정소송법", year:2020, no:45, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"판례상 당사자소송에 해당하는 것을 모두 고른 것은?\nㄱ. 명예퇴직한 법관이 미지급 명예퇴직수당의 지급을 구하는 소송\nㄴ. 지방자치단체가 보조사업자에게 보조금 지급결정을 하면서 부관으로 보조금 반환의무를 부가한 경우, 해당 지방자치단체가 그 부관에 따라 보조금 반환청구를 구하는 소송\nㄷ. 구 「도시 및 주거환경정비법」 상 재개발조합과 조합장 또는 조합임원 사이의 선임·해임 등을 둘러싼 법률관계에 관한 소송\nㄹ. 「도시 및 주거환경정비법」 상 주택재건축정비사업조합을 상대로 관리처분계획안에 대한 조합 총회결의의 효력을 다투는 소송",
  choices:["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:2, status:"clear", note:"" },
{ id:"hs2020-46", subject:"행정소송법", year:2020, no:46, law:"행정소송법", unit:"무효등확인소송", kind:"concept",
  stem:"「행정소송법」상 취소소송에 관한 규정 중 무효등확인소송에 준용되지 않는 것은?",
  choices:["공동소송","제3자에 의한 재심청구","사정판결","행정심판기록의 제출명령","제3자의 소송참가"],
  answer:3, status:"clear", note:"" },
{ id:"hs2020-47", subject:"행정소송법", year:2020, no:47, law:"행정소송법", unit:"부작위위법확인소송", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["부작위위법의 확인을 구하는 취지의 행정심판을 거친 경우 「행정소송법」 제20조가 정한 제소기간 내에 부작위위법확인의 소를 제기하여야 하는 것은 아니다.","사정판결이 인정되지 않는다.","집행정지가 인정되지 않는다.","부작위위법확인소송의 계속중 소극적 처분이 있게 되면 그 부작위위법확인소송은 소의 이익을 잃는다.","부작위의 직접상대방이 아닌 제3자라도 부작위위법확인을 받을 법률상의 이익이 있는 경우에는 원고적격이 인정된다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2020-48", subject:"행정소송법", year:2020, no:48, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"당사자소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["사인을 피고로 하는 당사자소송은 제기될 수 없다.","원고가 피고를 잘못 지정한 경우 법원은 원고의 신청에 의하여 결정으로써 피고의 경정을 허가할 수 없다.","당사자소송은 취소소송의 제소기간에 따라 제기되어야 한다.","당사자소송에 대하여는 「민사집행법」상 가처분에 관한 규정이 적용되지 아니한다.","공법상 당사자소송에서 재산권의 청구를 인용하는 판결을 하는 경우 법원은 가집행선고를 할 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2020-49", subject:"행정소송법", year:2020, no:49, law:"행정소송법", unit:"무효등확인소송", kind:"concept",
  stem:"무효등확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["무효확인소송의 보충성은 요구되지 아니한다.","처분등의 효력유무를 민사소송의 수소법원이 선결문제로 심리·판단하는 경우에 행정청의 소송참가 규정이 적용된다.","행정처분이 무효인 사유는 피고에게 입증책임이 있다.","처분등의 무효를 확인하는 확정판결은 그 사건에 관하여 당사자인 행정청과 그 밖의 관계행정청을 기속한다.","집행행위의 개입 없이도 그 자체로서 직접 국민의 구체적인 권리의무에 영향을 미치는 조례는 무효확인소송의 대상이 된다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2020-50", subject:"행정소송법", year:2020, no:50, law:"행정소송법", unit:"부작위위법확인소송", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["「행정소송법」상의 부작위의 개념상 전제되는 의무는 법률상 의무일 필요는 없다.","부작위위법여부의 판단 기준시는 사실심의 구두변론종결시로서 판결시이다.","부작위위법확인소송은 부작위 내지 무응답이라고 하는 소극적인 위법상태를 제거하는 것을 목적으로 한다.","부작위위법확인소송의 청구를 인용하는 판결이 확정된 경우 행정청은 거부처분을 하여도 처분의무를 이행한 것이 된다.","부작위가 위법함을 확인하는 확정판결은 제3자에 대하여도 효력이 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2020-51", subject:"행정소송법", year:2020, no:51, law:"행정소송법", unit:"제소기간", kind:"concept",
  stem:"취소소송의 제소기간에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정심판을 거친 경우에는 재결서 정본을 발송한 날이 제소기간의 기산점이 된다.","동일한 행정처분에 대하여 무효확인의 소를 제기하였다가 그 후 그 처분의 취소를 구하는 소를 추가적으로 병합한 경우, 주된 청구인 무효확인의 소가 취소소송의 제소기간 내에 제기되었다면 추가로 병합된 취소청구의 소도 적법하게 제기된 것으로 본다.","제소기간의 준수 여부는 소제기의 효과를 주장하는 원고가 입증책임을 진다.","처분이 있음을 안 날부터 100일이 지났더라도 처분이 있은 날부터 1년을 넘지 않았다면 취소소송의 제기는 적법하다.","고시 또는 공고에 의하여 불특정다수인을 대상으로 행정처분을 하는 경우에는, 그 행정처분에 이해관계를 갖는 자가 고시 또는 공고가 있었다는 사실을 현실적으로 알았을 때를 제소기간의 기산점으로 본다."],
  answer:[2,3], status:"note", note:"⚠️ 복수정답(②③)" },
{ id:"hs2020-52", subject:"행정소송법", year:2020, no:52, law:"행정소송법", unit:"행정심판전치주의", kind:"concept",
  stem:"필요적 행정심판전치주의 사항에 해당하지 않는 것은?",
  choices:["「식품위생법」에 따른 영업허가취소처분","「도로교통법」에 따른 운전면허취소처분","「국세기본법」에 따른 국세부과처분","「지방공무원법」에 따른 징계처분","「관세법」에 따른 관세부과처분"],
  answer:1, status:"clear", note:"" },
{ id:"hs2020-53", subject:"행정소송법", year:2020, no:53, law:"행정소송법", unit:"행정심판전치주의", kind:"concept",
  stem:"국가공무원인 甲은 「국가공무원법」상 성실의무를 위반하여 2개월의 정직처분을 받았다. 甲은 이 같은 징계처분이 비위사실에 비해 너무 가혹하다고 생각하여 그 처분에 대해 항고소송을 제기하고자 한다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["甲은 소청심사를 거치지 아니하고는 소송을 제기할 수 없다.","소청의 제기기간을 도과하여 소청을 제기하였으나 이를 간과하여 실질적 재결이 이루어졌다면 적법하게 행정심판전치의 요건은 충족된다고 본다.","법원은 2개월의 정직처분을 2개월 감봉처분으로 변경할 것을 명하는 판결을 할 수 없다.","필요한 행정심판을 거쳤는지의 여부는 법원의 직권조사사항이다.","소청심사위원회의 심사·결정을 거치지 아니한 채 소송을 제기하였으나 소송계속중 소청을 제기하여 기각결정을 받았다면 행정심판전치요건은 충족되었다고 볼 것이다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2020-54", subject:"행정소송법", year:2020, no:54, law:"행정소송법", unit:"재판관할", kind:"concept",
  stem:"취소소송의 관할법원에 관한 설명으로 옳지 않은 것은?",
  choices:["세무서장의 과세처분에 대한 취소소송의 제1심관할법원은 원칙적으로 당해 세무서의 소재지를 관할하는 행정법원이 된다.","관할이송은 원고가 중대한 과실 없이 취소소송을 심급을 달리하는 법원에 잘못 제기한 경우에도 인정된다.","토지의 수용재결에 대한 취소소송은 당사자 간의 합의 없이도 그 토지의 소재지를 관할하는 행정법원에 제기할 수 있다.","당사자가 합의하면 원고 소재지 관할법원을 제1심관할법원으로 할 수 있다.","중앙행정기관의 장이 피고인 취소소송은 피고의 소재지를 관할하는 행정법원을 제1심관할법원으로 할 수 없다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2020-55", subject:"행정소송법", year:2020, no:55, law:"행정소송법", unit:"소송참가", kind:"concept",
  stem:"제3자의 소송참가에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["제3자의 소송참가는 타인의 취소소송이 적법하게 제기되고 있어야 하나 소송이 어느 심급에 있는가는 불문한다.","참가하는 제3자에는 국가 또는 지방자치단체도 포함될 수 있다.","법원은 소송의 결과에 따라 권리를 침해 받을 제3자가 있는 경우에는 당사자의 신청에 의하여 결정으로써 그 제3자를 소송에 참가시킬 수 있다.","참가하는 제3자는 그 신청을 각하한 결정에 대하여 즉시항고할 수 있다.","제3자의 소송참가가 허용되기 위하여는 당해 소송의 결과에 따라 제3자의 권리 또는 이익이 침해되어야 하고, 이 때의 이익은 법률상 이익 및 단순한 사실상의 이익을 포함한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2020-56", subject:"행정소송법", year:2020, no:56, law:"행정소송법", unit:"소송참가", kind:"concept",
  stem:"행정청의 소송참가에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정심판의 재결이 취소소송의 대상이 된 경우 원처분청을 소송에 참가시킬 수 있다.","법원이 행정청의 소송참가를 결정하고자 할 때에는 당사자 및 당해 행정청의 의견을 들어야 한다.","참가인은 참가할 때의 소송의 진행정도에 따라 할 수 없는 소송행위를 제외하고, 소송에 관하여 공격·방어·이의·상소, 그 밖의 모든 소송행위를 할 수 있다.","참가인의 소송행위가 피참가인의 소송행위에 어긋나는 경우에는 그 참가인의 소송행위는 효력을 가지지 아니한다.","행정청의 소송참가는 당사자의 신청이나 법원의 직권에 의해 결정되나 당해 행정청이 소송참가를 신청할 수는 없다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2020-57", subject:"행정소송법", year:2020, no:57, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"소의 변경에 관한 설명으로 옳은 것은?",
  choices:["항고소송을 당사자소송으로 변경을 허가하는 경우 피고의 변경이 수반되는데, 이 경우 법원은 새로이 피고로 될 자의 의견을 들어야 한다.","소의 변경은 상고심에서도 가능하다.","청구의 기초에 변경이 있더라도 소의 변경은 가능하다.","소의 변경의 결정이 있은 때에는 새로운 피고에 대한 소송은 원고가 소의 변경을 신청한 때에 제기된 것으로 본다.","소의 변경의 결정이 있은 때에는 종전의 피고에 대한 소송은 각하된 것으로 본다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2020-58", subject:"행정소송법", year:2020, no:58, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"처분변경으로 인한 소의 변경에 관한 설명으로 옳지 않은 것은?",
  choices:["판례는 피고가 하천점용료 부과처분을 하였다가 절차상 하자를 이유로 이를 취소한 후 다시 동일한 내용의 하천점용료 부과처분을 한 경우, 원고가 당초의 부과처분에 대한 취소청구를 새로운 부과처분에 대한 취소청구로 변경하는 것을 인정한다.","처분변경으로 인한 소의 변경에 관한 규정은 부작위위법확인소송에는 준용되지 않는다.","소가 제기된 후 행정청이 소송대상인 처분을 변경한 경우 법원은 직권으로 소를 변경할 수 있다.","처분변경으로 인한 소의 변경에 관한 규정은 당사자소송에 준용된다.","처분변경으로 인한 소의 변경신청은 처분의 변경이 있음을 안 날로부터 60일 이내에 하여야 한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2020-59", subject:"행정소송법", year:2020, no:59, law:"행정소송법", unit:"관련청구의 이송·병합", kind:"concept",
  stem:"항고소송에 있어 관련청구소송의 이송·병합에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["피고외의 자를 상대로 한 관련청구소송을 취소소송이 계속된 법원에 병합하여 제기할 수 있다.","취소소송을 관련청구소송에 병합하기 위하여 취소소송을 관련청구소송이 계속된 법원으로 이송할 수 있다.","취소소송과 당해 처분등과 관련되는 부당이득반환청구소송은 병합이 가능하다.","관련청구소송의 병합은 주된 청구가 사실심의 변론종결 전이어야 가능하다.","주된 취소소송과 관련청구소송은 각각 소송요건을 갖추어야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2020-60", subject:"행정소송법", year:2020, no:60, law:"행정소송법", unit:"소송요건", kind:"concept",
  stem:"항고소송의 소송요건에 관한 설명으로 옳은 것은?",
  choices:["원고적격의 흠결로 인한 소송판결은 중간판결의 일종이다.","소송요건이 흠결된 경우에도 처분이 위법하면 기각판결을 하여야 한다.","소송요건의 심사는 본안심리 중에는 이를 할 수 없다.","소송요건의 흠결로 각하판결이 선고된 경우, 원고는 흠결된 요건을 보완하여 다시 소를 제기할 수 있다.","소송요건을 엄격하게 요구하면 국민의 재판청구권을 강화하지만 법원의 부담을 가중한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2020-61", subject:"행정소송법", year:2020, no:61, law:"행정소송법", unit:"소송요건", kind:"concept",
  stem:"항고소송 제기시 각하사유에 해당하는 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 행정청에 대하여 특정인의 토지소유권에 불리한 영향을 미치는 도시·군관리계획을 결정하지 말 것을 요구하는 소송\nㄴ. 기존 노선버스사업자가 자신의 노선과 중복되는 신규 노선버스운송사업 인가처분의 취소를 청구하는 소송\nㄷ. 구 「공유수면매립법」상 공유수면매립면허처분에 대하여 당해 환경영향평가 대상지역 내에 사는 주민이 제기한 면허처분무효확인소송",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:1, status:"clear", note:"" },
{ id:"hs2020-62", subject:"행정소송법", year:2020, no:62, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"판례상 항고소송의 대상이 되는 행정처분에 해당하지 않는 것은?",
  choices:["항정신병 치료제의 요양급여에 관한 보건복지부 고시","원천징수의무자인 법인에 대한 과세관청의 소득처분에 따른 소득금액변동통지","한국마사회의 조교사 및 기수 면허 부여 또는 취소","조달청이 계약상대자에 대하여 나라장터 종합쇼핑몰에서의 거래를 일정기간 정지하는 조치","부당한 공동행위 자진신고자 등의 과징금 감면신청에 대한 공정거래위원회의 감면불인정 통지"],
  answer:3, status:"clear", note:"" },
{ id:"hs2020-63", subject:"행정소송법", year:2020, no:63, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"판례상 취소소송의 대상이 되지 않는 것을 모두 고른 것은?\nㄱ. 공정거래위원회의 고발조치\nㄴ. 소관청의 토지대장상의 소유자명의변경신청 거부행위\nㄷ. 국세환급금결정이나 이 결정을 구하는 신청에 대한 환급거부결정\nㄹ. 국민건강보험공단의 '직장가입자 자격상실 및 자격변동 안내' 통보",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"hs2020-64", subject:"행정소송법", year:2020, no:64, law:"행정소송법", unit:"원처분주의·재결주의", kind:"concept",
  stem:"「행정소송법」상 재결취소소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["인용재결에 대한 항고소송의 피고는 인용재결을 한 행정심판위원회이다.","행정심판청구가 부적법하여 각하하여야 함에도 인용재결을 한 경우 재결취소소송이 인정된다.","재결 자체의 고유한 위법에는 재결 자체의 주체, 절차, 형식상의 위법뿐만 아니라 재결 자체의 내용상 위법도 포함된다.","재결 자체에 고유한 위법이 없는 경우에는 각하판결을 하여야 한다.","인용재결의 취소를 구하는 소송에서 법원은 행정심판위원회가 원처분의 취소 근거로 내세운 판단사유의 당부뿐만 아니라 행정심판위원회가 심판청구인의 심판청구원인사유를 배척한 판단 부분이 정당한가도 심리·판단하여야 한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2020-65", subject:"행정소송법", year:2020, no:65, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"공법상 당사자소송의 대상이 되는 것으로만 연결된 것은? (다툼이 있으면 판례에 따름)",
  choices:["민간투자사업 실시협약에 따른 재정지원금의 지급을 구하는 소송 - 구청장의 주민등록번호 변경신청 거부행위를 다투는 소송","읍·면장에 의한 이장의 임명 및 면직 - 「국토의 계획 및 이용에 관한 법률」에 따른 토지의 일시 사용에 대한 동의의 의사표시를 할 의무의 존부를 다투는 소송","구 「특수임무수행자 보상에 관한 법률」상 보상금 지급대상자의 기각결정을 다투는 소송 - 「도시 및 주거환경정비법」상 청산금지급청구소송","부가가치세 환급세액 지급청구소송 - 공무원연금관리공단의 공무원연금 지급거부를 다투는 소송","구 「산업집적활성화 및 공장설립에 관한 법률」에 따른 입주계약의 취소를 다투는 소송 - 「부패방지법」에 따른 보상금지급거부를 다투는 소송"],
  answer:2, status:"clear", note:"" },
{ id:"hs2020-66", subject:"행정소송법", year:2020, no:66, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 항고소송의 원고적격에 관한 설명으로 옳지 않은 것은?",
  choices:["추상적 기본권의 침해만으로는 원고적격이 인정되지 않는다.","원고적격은 사실심 변론종결시는 물론 상고심에서도 존속하여야 한다.","사실상 이익 또는 반사적 이익의 침해만으로도 원고적격이 인정된다.","구 「건축법」상 지방자치단체장이 국가와의 건축협의를 거부한 행위에 대해 국가는 항고소송을 제기할 수 있다.","처분의 상대방이 허무인(虛無人)이 아니라 위명(僞名)을 사용한 사람인 경우에도 처분의 취소를 구할 법률상 이익이 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2020-67", subject:"행정소송법", year:2020, no:67, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 항고소송의 원고적격이 인정되는 것은?",
  choices:["구 「담배사업법」에 따른 기존 일반소매인이 신규 구내소매인 지정처분의 취소를 구하는 경우","숙박업구조변경허가처분에 대하여 인근의 기존 숙박업자가 그 취소를 구하는 경우","재단법인인 수녀원이 공유수면매립목적 변경 승인처분에 대하여 환경상 이익의 침해를 이유로 무효확인을 구하는 경우","구 「임대주택법」상 임차인대표회의가 임대주택 분양전환승인처분에 대하여 취소를 구하는 경우","외국인이 사증발급 거부처분에 대하여 취소를 구하는 경우"],
  answer:4, status:"clear", note:"" },
{ id:"hs2020-68", subject:"행정소송법", year:2020, no:68, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"항고소송의 소의 이익에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["'법률상 이익'에는 취소를 통하여 구제되는 기본적인 법률상 이익뿐만 아니라 부수적인 법률상 이익도 포함된다.","취소소송에 의해 보호되는 이익은 현실적인 이익이어야 한다.","원자로건설허가처분이 있은 후에 원자로부지 사전승인처분의 취소소송을 제기하는 경우 소의 이익이 인정되지 않는다.","강학상 인가의 경우 기본행위의 하자를 이유로 인가처분의 취소를 구하는 소송은 소의 이익이 인정되지 않는다.","원고가 처분이 위법하다는 점에 대한 취소판결을 받아 피고에 대한 손해배상청구소송에서 이를 원용할 수 있는 이익은 소의 이익에 해당한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2020-69", subject:"행정소송법", year:2020, no:69, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 취소소송의 소의 이익이 인정되지 않는 것은?",
  choices:["현역병입영대상자가 입영한 후에 현역입영통지처분의 취소를 구하는 경우","지방의회 의원에 대한 제명의결처분 취소소송 계속 중 그 의원의 임기가 만료된 경우","행정청이 과징금 부과처분을 한 후 부과처분의 하자를 이유로 감액처분을 한 경우, 감액된 부분에 대한 부과처분의 취소를 구하는 경우","행정처분에 대한 취소소송 계속중 처분청이 다툼의 대상이 되는 행정처분을 직권취소하였음에도 불구하고 완전한 원상회복이 이루어지지 않아 취소로써 회복할 수 있는 다른 권리나 이익이 남아 있는 경우","경원관계에서 경원자에 대한 수익적 처분의 취소를 구하지 아니하고 자신에 대한 거부처분의 취소만을 구하는 경우"],
  answer:3, status:"clear", note:"" },
{ id:"hs2020-70", subject:"행정소송법", year:2020, no:70, law:"행정소송법", unit:"피고적격", kind:"concept",
  stem:"행정소송의 피고적격에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분청과 그 처분을 통지한 자가 다른 경우 처분청이 취소소송의 피고가 된다.","대리기관이 대리관계를 표시하고 피대리 행정청을 대리하여 행정처분을 한 때에는 피대리 행정청이 취소소송의 피고가 된다.","합의제 행정청이 처분청인 경우에는 합의제 행정청이 피고가 되므로, 중앙노동위원회의 처분에 대한 취소소송의 피고는 중앙노동위원회이다.","지방의회의장선거에 대한 취소소송의 피고는 지방의회이다.","당사자소송은 국가·공공단체 그 밖의 권리주체를 피고로 한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2020-71", subject:"행정소송법", year:2020, no:71, law:"행정소송법", unit:"제소기간", kind:"concept",
  stem:"취소소송의 제소기간에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["변경명령재결에 따른 변경처분의 경우 제소기간은 그 변경처분이 있음을 안 날로부터 90일 이내이다.","처분서가 처분상대방의 주소지에 송달되는 등 사회통념상 처분이 있음을 처분상대방이 알 수 있는 상태에 놓인 때에는 반증이 없는 한 처분상대방이 처분이 있음을 알았다고 추정할 수 있다.","행정심판제기기간을 넘긴 것을 이유로 한 각하재결이 있은 후 취소소송을 제기하는 경우에는 「행정소송법」제20조 제1항 단서가 적용되지 아니한다.","특정인에 대한 행정처분을 주소불명 등의 이유로 송달할 수 없어 관보·공보·게시판·일간신문 등에 공고한 경우에는, 상대방이 당해 처분이 있었다는 사실을 현실적으로 안 날에 그 처분이 있음을 알았다고 보아야 한다.","무효등확인소송의 경우에는 제소기간의 제한이 없지만, 무효선언을 구하는 취소소송의 경우에는 제소기간의 제한이 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2020-72", subject:"행정소송법", year:2020, no:72, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"취소소송의 직권심리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 필요하다고 인정할 때에는 직권으로 증거조사를 할 수 있다.","법원은 필요하다고 인정할 때에는 당사자가 주장하지 아니하는 사실에 대하여도 판단할 수 있다.","직권심리는 행정소송의 특수성에서 연유하는 당사자주의, 변론주의에 대한 일부 예외규정이다.","법원은 직권심리를 할 때 원고의 청구범위를 유지할 필요는 없다.","「행정소송법」제26조의 직권심리주의는 공법상 당사자소송에 준용된다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2020-73", subject:"행정소송법", year:2020, no:73, law:"행정소송법", unit:"처분사유의 추가·변경", kind:"concept",
  stem:"처분사유의 추가·변경에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분사유의 추가·변경은 판결시에 객관적으로 존재하는 사유에 한정된다.","처분사유의 추가·변경에 관한 「행정소송법」상 근거 규정은 없다.","처분사유의 추가·변경은 사실심 변론종결시까지 허용된다.","처분사유의 추가·변경은 처분의 상대방의 신뢰를 보호하기 위하여 제한적으로 인정되어야 한다.","처분청이 처분 당시 적시한 구체적 사실을 변경하지 아니하는 범위 내에서 처분의 근거 법령만을 추가하는 것은 허용된다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2020-74", subject:"행정소송법", year:2020, no:74, law:"행정소송법", unit:"판결 일반", kind:"concept",
  stem:"취소소송의 판결에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["판결의 주문은 그 내용이 특정되어야 하고 그 주문 자체에 의해 특정할 수 있어야 한다.","사정판결을 할 경우 인용판결을 하여야 한다.","처분의 무효선언을 하는 취소판결도 인정된다.","계쟁처분이 위법하지 않고 단순 부당한 경우에는 기각판결을 하여야 한다.","과징금부과처분이 법이 정한 한도액을 초과하여 위법할 경우 법원은 그 전부를 취소하여야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2020-75", subject:"행정소송법", year:2020, no:75, law:"행정소송법", unit:"간접강제", kind:"concept",
  stem:"<보기>와 같은 판결 주문례에 관한 설명으로 옳지 않은 것은?\n<보기> 주문\n피신청인은 이 결정의 정본을 받은 날로부터 00일 이내에 신청인에 대하여 이 법원 2006구합127 XX거부처분취소사건의 확정판결의 취지에 따른 처분을 하지 않을 때에는 신청인에 대하여 위 기간이 마치는 다음날부터 처분시까지 1일 금 000원의 비율에 의한 금원을 지급하라.",
  choices:["간접강제에 관한 주문이다.","「행정소송법」제30조 제2항의 재처분의무를 전제로 한다.","제1심수소법원은 당사자의 신청에 따라 위와 같은 명령을 할 수 있다.","주문에서 정한 기간을 경과한 재처분은 무효이다.","<보기>의 배상금은 재처분의 이행에 관한 심리적 강제수단에 해당한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2020-76", subject:"행정소송법", year:2020, no:76, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"취소소송의 집행정지에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분의 효력정지는 처분의 집행의 속행을 정지함으로써 목적을 달성할 수 있는 경우에는 허용되지 아니한다.","집행정지의 결정을 신청함에 있어서는 그 이유에 대한 소명이 있어야 한다.","집행정지 결정에 대해서는 즉시항고할 수 있고, 즉시항고에는 결정의 집행을 정지하는 효력이 있다.","집행정지를 구하는 신청사건에서는 행정처분 자체의 적법 여부는 원칙적으로 법원의 판단의 대상이 아니다.","집행정지의 요건인 '회복하기 어려운 손해'라 함은 금전보상이 불능인 경우뿐만 아니라 금전보상으로는 사회관념상 행정처분을 받은 당사자가 참고 견딜 수 없거나 또는 참고 견디기가 현저히 곤란한 경우의 유형, 무형의 손해를 일컫는다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2020-77", subject:"행정소송법", year:2020, no:77, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"집행정지결정의 효력에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["효력정지결정은 장래효와 소급효를 모두 가진다.","집행정지결정은 당해 사건에 관하여 당사자인 행정청과 모든 국가기관을 기속한다.","집행정지결정을 한 후 본안소송이 취하되더라도 집행정지결정은 그 효력을 유지한다.","효력정지결정의 효력은 결정주문에서 정한 시기까지 존속하고 그 시기의 도래와 동시에 효력이 당연히 소멸한다.","집행정지결정이 공공복리에 중대한 영향을 미치더라도 법원은 당사자의 신청이 있어야 그 결정을 취소할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2020-78", subject:"행정소송법", year:2020, no:78, law:"행정소송법", unit:"민중소송·기관소송", kind:"concept",
  stem:"민중소송 및 기관소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["기관소송은 법률이 정한 경우에 법률에 정한 자에 한하여 제기할 수 있다.","민중소송은 국가 또는 공공단체의 기관이 위법한 행위를 한 때에 제기하는 소송이다.","「공직선거법」제222조의 선거소송은 민중소송이다.","「지방자치법」상 주민소송은 민중소송이다.","기관소송은 객관적 소송이므로 처분의 취소를 구하는 취지의 소송일지라도 취소소송에 관한 제소기간의 규정은 준용되지 않는다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2020-79", subject:"행정소송법", year:2020, no:79, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"법원은 지방자치단체장 A가 공무원 甲에게 한 파면처분이 재량권의 범위를 벗어나 위법한 처분이라는 이유로 취소판결을 하였고 이 판결은 확정되었다. 그 후 A는 다시 인사위원회의 의결을 거쳐 동일한 사유로 甲에게 해임처분을 하였다. 이에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. A가 한 해임처분은 확정판결의 효력에 저촉된다고 볼 수 없다.\nㄴ. 甲은 해임처분에 대해 취소소송을 제기할 수 있다.\nㄷ. 확정판결의 기속력은 A만 기속할 뿐 관계행정기관을 기속하지는 않는다.",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],

{ id:"hg2021-1", subject:"회계학개론", year:2021, no:1, law:"회계학개론", unit:"재고자산", kind:"concept",
  stem:"재고자산에 관한 설명으로 옳지 않은 것은?",
  choices:["재고자산의 취득원가는 매입원가, 전환원가 및 재고자산을 현재의 장소에 현재의 상태로 이르게 하는 데 발생한 기타 원가 모두를 포함한다.","완성될 제품이 원가 이상으로 판매될 것으로 예상하는 경우에는 그 생산에 투입하기 위해 보유하는 원재료 및 기타 소모품을 감액하지 아니한다.","후속 생산단계에 투입하기 전에 보관이 필요한 경우 이외의 보관원가는 재고자산의 취득원가에 포함한다.","통상적으로 상호교환 가능한 대량의 재고자산 항목에 개별법을 적용하는 것은 적절하지 아니하다.","성격과 용도 면에서 유사한 재고자산에는 동일한 단위원가 결정방법을 적용하여야 하며, 성격이나 용도 면에서 차이가 있는 재고자산에는 서로 다른 단위원가 결정방법을 적용할 수 있다."],

{ id:"hg2021-8", subject:"회계학개론", year:2021, no:8, law:"회계학개론", unit:"재고자산", kind:"calc",
  stem:"20×1년 초에 설립한 (주)세무는 유사성이 없는 두 종류의 상품 A와 상품 B를 판매하고 있다. (주)세무는 20×1년 중 상품 A 200단위(단위당 취득원가 ￦1,000)와 상품 B 200단위(단위당 취득원가 ￦2,000)를 매입하였으며, 20×1년 말 상품재고와 관련된 자료는 다음과 같다.\n구분 / 장부수량 / 실제수량 / 단위당 취득원가 / 단위당 예상 판매가격\n상품A 50 / 30 / ￦1,000 / ￦1,300\n상품B 100 / 70 / 2,000 / 2,200\n상품 A의 재고 중 20단위는 (주)대한에 단위당 ￦900에 판매하기로 한 확정판매계약을 이행하기 위해 보유 중이다. 확정판매계약에 의한 판매시에는 판매비용이 발생하지 않으나, 일반판매의 경우에는 상품 A와 상품 B 모두 단위당 ￦300의 판매비용이 발생할 것으로 예상된다. (주)세무가 20×1년도에 인식할 매출원가는? (단, 정상감모손실과 재고자산평가손실은 매출원가에 가산하며, 상품 A와 상품 B 모두 감모의 70%는 정상감모이다.)",

{ id:"hg2021-10", subject:"회계학개론", year:2021, no:10, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"재무제표 표시에 관한 설명으로 옳은 것은?",
  choices:["재무제표는 동일한 문서에 포함되어 함께 공표되는 그 밖의 정보와 명확하게 구분되고 식별되어야 한다.","각각의 재무제표는 전체 재무제표에서 중요성에 따라 상이한 비중으로 표시한다.","상이한 성격이나 기능을 가진 항목은 구분하여 표시하므로 중요하지 않은 항목이라도 성격이나 기능이 유사한 항목과 통합하여 표시할 수 없다.","동일 거래에서 발생하는 수익과 관련비용의 상계표시가 거래나 그 밖의 사건의 실질을 반영하더라도 그러한 거래의 결과는 상계하여 표시하지 않는다.","공시나 주석 또는 보충 자료를 통해 충분히 설명한다면 부적절한 회계정책도 정당화될 수 있다."],

{ id:"hg2021-11", subject:"회계학개론", year:2021, no:11, law:"회계학개론", unit:"사업결합·연결", kind:"calc",
  stem:"20×1년 초 (주)세무는 (주)대한의 주주들에게 현금 ￦700,000을 지급하고 (주)대한을 흡수합병하였다. 합병당시 (주)대한의 자산과 부채의 장부금액과 공정가치는 다음과 같다.\n구분 / 장부금액 / 공정가치\n자산 ￦3,000,000 / ￦3,200,000\n부채 2,700,000 / 2,800,000\n한편, 합병일 현재 (주)세무는 (주)대한이 자산으로 인식하지 않았으나, 자산의 정의를 충족하고 식별가능한 진행 중인 연구개발프로젝트를 확인하였다. 또한, 해당 프로젝트의 공정가치를 ￦50,000으로 신뢰성 있게 측정하였다. 20×1년 초 (주)세무가 합병 시 인식할 영업권은?",

{ id:"hg2021-12", subject:"회계학개론", year:2021, no:12, law:"회계학개론", unit:"투자부동산", kind:"calc",
  stem:"제조업을 영위하는 (주)세무는 20×1년 4월 1일 시세차익을 위하여 건물을 ￦2,000,000에 취득하였다. 그러나 (주)세무는 20×2년 4월 1일 동 건물을 자가사용으로 용도를 전환하고 동 일자에 영업지점으로 사용하기 시작하였다. 20×2년 4월 1일 현재 동 건물의 잔존내용연수는 5년, 잔존가치는 ￦200,000이며, 정액법으로 감가상각(월할 상각)한다. 동 건물의 일자별 공정가치는 다음과 같다.\n20×1.12.31. ￦2,400,000 / 20×2.4.1. ￦2,600,000 / 20×2.12.31. ￦2,200,000\n동 건물관련 회계처리가 (주)세무의 20×2년도 당기순이익에 미치는 영향은? (단, (주)세무는 투자부동산에 대해서는 공정가치모형을 적용하고 있으며, 유형자산에 대해서는 원가모형을 적용하고 있다.)",

{ id:"hg2021-13", subject:"회계학개론", year:2021, no:13, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"측정기준에 관한 설명으로 옳지 않은 것은?",
  choices:["자산을 취득하거나 창출할 때의 역사적 원가는 자산의 취득 또는 창출에 발생한 원가의 가치로서, 자산을 취득 또는 창출하기 위하여 지급한 대가와 거래원가를 포함한다.","부채가 발생하거나 인수할 때의 역사적 원가는 발생시키거나 인수하면서 수취한 대가에서 거래원가를 차감한 가치이다.","공정가치는 측정일에 시장참여자 사이의 정상거래에서 자산을 매도할 때 받거나 부채를 이전할 때 지급하게 될 가격이다.","사용가치와 이행가치는 자산을 취득하거나 부채를 인수할 때 발생하는 거래원가를 포함한다.","자산의 현행원가는 측정일 현재 동등한 자산의 원가로서 측정일에 지급할 대가와 그 날에 발생할 거래원가를 포함한다."],

{ id:"hg2021-14", subject:"회계학개론", year:2021, no:14, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"일반목적재무보고서가 제공하는 정보에 관한 설명으로 옳지 않은 것은?",
  choices:["보고기업의 경제적자원 및 청구권의 성격 및 금액에 대한 정보는 이용자들이 기업의 경제적자원에 대한 경영진의 수탁책임을 평가하는 데 도움이 될 수 있다.","보고기업의 재무성과에 대한 정보는 그 기업의 경제적자원에서 해당 기업이 창출한 수익을 이용자들이 이해하는 데 도움을 준다.","보고기업의 경제적자원 및 청구권은 그 기업의 재무성과 그리고 채무상품이나 지분상품의 발행과 같은 그 밖의 사건이나 거래에서 발생한다.","보고기업의 과거 재무성과와 그 경영진이 수탁책임을 어떻게 이행했는지에 대한 정보는 기업의 경제적자원에서 발생하는 미래 수익을 예측하는 데 일반적으로 도움이 된다.","한 기간의 보고기업의 재무성과에 투자자와 채권자에게서 직접 추가 자원을 획득한 것이 아닌 경제적자원 및 청구권의 변동이 반영된 정보는 기업의 과거 및 미래 순현금유입 창출 능력을 평가하는 데 유용하다."],
  answer:3, status:"clear", note:"" },

  stem:"(주)세무는 20×1년 1월 1일 종업원 100명에게 각각 현금결제형 주가차액보상권 10개씩 부여하였다. 주가차액보상권은 3년간 종업원이 용역을 제공하는 조건으로 부여되었으며, 주가차액보상권과 관련된 자료는 다음과 같다. (주)세무가 20×3년도에 인식할 당기비용은?\n○ 20×1년 실제퇴사자는 10명이며, 미래 예상퇴사자는 15명이다.\n○ 20×2년 실제퇴사자는 12명이며, 미래 예상퇴사자는 8명이다.\n○ 20×3년 실제퇴사자는 5명이며, 주가차액보상권 최종 가득자는 73명이다.\n○ 20×3년 말 주가차액보상권을 행사한 종업원 수는 28명이다.\n○ 매 연도말 주가차액보상권에 대한 현금지급액과 공정가치는 다음과 같다.\n연도 / 현금지급액 / 공정가치\n20×1 - / ￦1,000\n20×2 - / 1,260\n20×3 ￦1,200 / 1,400",

{ id:"hg2021-18", subject:"회계학개론", year:2021, no:18, law:"회계학개론", unit:"리스", kind:"calc",

{ id:"hg2021-19", subject:"회계학개론", year:2021, no:19, law:"회계학개론", unit:"현금흐름표", kind:"concept",
  stem:"현금흐름표에 관한 설명으로 옳지 않은 것은?",
  choices:["영업활동 현금흐름은 일반적으로 당기순손익의 결정에 영향을 미치는 거래나 그 밖의 사건의 결과로 발생한다.","법인세로 인한 현금흐름은 별도로 공시하며, 재무활동과 투자활동에 명백히 관련되지 않는 한 영업활동 현금흐름으로 분류한다.","현금및현금성자산의 사용을 수반하지 않는 투자활동과 재무활동 거래는 현금흐름표에서 제외한다.","이자와 배당금의 수취 및 지급에 따른 현금흐름은 각각 별도로 공시한다. 각 현금흐름은 매 기간 일관성 있게 영업활동, 투자활동 또는 재무활동으로 분류한다.","단기매매목적으로 보유하는 유가증권의 취득과 판매에 따른 현금흐름은 투자활동으로 분류한다."],

{ id:"hg2021-22", subject:"회계학개론", year:2021, no:22, law:"회계학개론", unit:"수익인식", kind:"calc",
  stem:"(주)세무는 20×1년 초 (주)한국과 건설계약(공사기간 3년, 계약금액 ￦600,000)을 체결하였다. (주)세무의 건설용역에 대한 통제는 기간에 걸쳐 이전된다. (주)세무는 발생원가에 기초한 투입법으로 진행률을 측정한다. 건설계약과 관련된 자료는 다음과 같다. (주)세무의 20×2년도 공사이익은?\n○ 20×1년 말 공사완료시까지의 추가소요원가를 추정할 수 없어 합리적으로 진행률을 측정할 수 없었으나, 20×1년 말 현재 이미 발생한 원가 ￦120,000은 모두 회수할 수 있다고 판단하였다.\n○ 20×2년 말 공사완료시까지 추가소요원가를 ￦200,000으로 추정하였다.\n○ 연도별 당기발생 공사원가: 20×1년 ￦120,000 / 20×2년 ￦180,000 / 20×3년 ￦200,000",
  choices:["￦0","￦40,000","￦60,000","￦120,000","￦180,000"],
  answer:3, status:"clear", note:"" },
{ id:"hg2021-23", subject:"회계학개론", year:2021, no:23, law:"회계학개론", unit:"주당이익", kind:"calc",
  stem:"(주)세무의 20×1년 초 유통보통주식수는 10,000주이고, 유통우선주식수는 3,000주(1주당 액면금액 ￦100, 연 배당률 10%)로 우선주 2주당 보통주 1주로 전환이 가능하다. (주)세무의 20×1년도 당기순이익은 ￦1,335,600이며, 주당이익과 관련된 자료는 다음과 같다.\n○ 4월 1일 전년도에 발행한 전환사채(액면금액 ￦20,000, 전환가격 ￦50) 중 40%가 보통주로 전환되었다. 20×1년 말 전환사채에서 발생한 이자비용은 ￦1,200이며, 법인세율은 20%이다.\n○ 7월 1일 자기주식 250주를 취득하였다.\n○ 10월 1일 우선주 1,000주가 보통주로 전환되었다.\n(주)세무의 20×1년도 기본주당이익은? (단, 기중에 전환된 전환우선주에 대해서 우선주배당금을 지급하지 않으며, 가중평균주식수는 월할계산한다.)",
  choices:["￦110","￦120","￦130","￦140","￦150"],
  answer:3, status:"clear", note:"" },
{ id:"hg2021-24", subject:"회계학개론", year:2021, no:24, law:"회계학개론", unit:"리스", kind:"calc",
  stem:"(주)세무리스는 20×1년 1월 1일(리스개시일)에 (주)한국에게 건설장비를 5년 동안 제공하고 고정리스료로 매년 말 ￦2,000,000씩 수취하는 금융리스계약을 체결하였다. 체결당시 (주)세무리스는 리스개설직접원가 ￦50,000을 지출하였으며, 건설장비의 공정가치는 ￦8,152,500이다. 리스개시일 당시 (주)세무리스의 내재이자율은 10%이다. 리스기간 종료시 (주)한국은 건설장비를 반환하는 조건이며, 예상잔존가치 ￦1,000,000 중 ￦600,000을 보증한다. (주)세무리스는 20×3년 1월 1일 무보증잔존가치의 추정을 ￦200,000으로 변경하였다. (주)세무리스가 20×3년도에 인식해야할 이자수익은?\n기간 / 단일금액￦1 현가(10%) / 정상연금￦1 현가(10%)\n3년 / 0.7513 / 2.4868\n5년 / 0.6209 / 3.7908",

  answer:2, status:"clear", note:"" },
{ id:"hg2021-25", subject:"회계학개론", year:2021, no:25, law:"회계학개론", unit:"결합원가계산", kind:"calc",
  stem:"(주)세무는 결합공정을 통하여 연산품 A, B를 생산한다. 제품 B는 분리점에서 즉시 판매되고 있으나, 제품 A는 추가가공을 거친 후 판매되고 있으며, 결합원가는 순실현가치에 의해 배분되고 있다. 결합공정의 직접재료는 공정 초에 전량 투입되며, 전환원가는 공정 전반에 걸쳐 균등하게 발생한다. 당기 결합공정에 기초재공품은 없었으며, 직접재료 5,000kg을 투입하여 4,000kg을 제품으로 완성하고 1,000kg은 기말재공품(전환원가 완성도 30%)으로 남아 있다. 당기 결합공정에 투입된 직접재료원가와 전환원가는 ￦250,000과 ￦129,000이다. (주)세무의 당기 생산 및 판매 자료는 다음과 같다.\n구분 / 생산량 / 판매량 / 추가가공원가총액 / 단위당판매가격\n제품A 4,000단위 / 2,500단위 / ￦200,000 / ￦200\n제품B 1,000 / 800 / - / 200\n제품 A의 단위당 제조원가는? (단, 공손 및 감손은 없다.)",
  choices:["￦98","￦110","￦120","￦130","￦150"],
  answer:2, status:"clear", note:"" },
{ id:"hg2021-26", subject:"회계학개론", year:2021, no:26, law:"회계학개론", unit:"표준원가계산", kind:"concept",
  stem:"다음 표준원가계산과 관련된 원가차이조정에 관한 설명으로 옳지 않은 것은? (단, 모든 재고자산의 기말잔액과 원가차이계정은 0이 아니다.)",
  choices:["직접재료원가 가격차이를 원재료 사용(투입)시점에 분리하는 경우, 직접재료원가 가격차이는 원가차이조정시 원재료계정에 영향을 미치지 않는다.","직접재료원가 가격차이를 원재료 구입시점에 분리하는 경우, 직접재료원가 능률차이는 실제 구입량이 아니라 실제 사용량(투입량)을 기초로 계산한다.","총원가비례배분법에 의해 원가차이조정을 하는 경우, 직접재료원가 구입가격차이는 직접재료원가 능률차이계정에 영향을 미친다.","직접재료원가 가격차이를 원재료 구입시점에 분리하는 경우, 원재료계정은 표준원가로 기록된다.","원가요소별비례배분법에 의해 원가차이조정을 하는 경우, 직접재료원가 구입가격차이는 원재료계정 기말잔액에 영향을 미친다."],
  answer:3, status:"clear", note:"" },
{ id:"hg2021-27", subject:"회계학개론", year:2021, no:27, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무의 20×1년 매출액은 ￦3,000,000이고 세후이익은 ￦360,000이며, 연간 고정비의 30%는 감가상각비이다. 20×1년 (주)세무의 안전한계율은 40%이고 법인세율이 25%일 경우, 법인세를 고려한 현금흐름분기점 매출액은? (단, 감가상각비를 제외한 수익발생과 현금유입시점은 동일하고, 원가(비용)발생과 현금유출시점도 동일하며, 법인세 환수가 가능하다.)",

{ id:"hg2021-28", subject:"회계학개론", year:2021, no:28, law:"회계학개론", unit:"종합원가계산", kind:"calc",
  stem:"(주)세무는 단일제품을 생산하고 있으며, 선입선출법에 의한 종합원가계산을 적용하고 있다. 직접재료 A는 공정초기에 전량 투입되고, 직접재료 B는 품질검사 직후 전량 투입되며, 전환원가는 공정 전반에 걸쳐 균등하게 발생한다. 품질검사는 공정의 80% 시점에서 이루어지며, 당기 검사를 통과한 합격품의 10%를 정상공손으로 간주한다. 당기 생산 및 원가 자료는 다음과 같다.\n구분 / 물량(전환원가완성도)\n기초재공품 500단위(60%) / 당기착수 4,500 / 당기완성 3,500 / 기말재공품 1,000(60%)\n구분 / 직접재료A / 직접재료B / 전환원가\n기초재공품원가 ￦11,200 / ￦0 / ￦18,000\n당기발생원가 90,000 / 87,500 / 210,000\n정상공손원가 배분 후, (주)세무의 당기 완성품원가는?",

  answer:4, status:"clear", note:"" },
{ id:"hg2021-29", subject:"회계학개론", year:2021, no:29, law:"회계학개론", unit:"표준원가계산", kind:"calc",
  stem:"(주)세무는 표준원가계산제도를 채택하고 있으며, 당기 직접노무원가와 관련된 자료는 다음과 같다.\n제품 실제생산량 1,000단위 / 직접노무원가 실제 발생액 ￦1,378,000 / 단위당 표준직접노무시간 5.5시간 / 직접노무원가 능률차이 ￦50,000(유리) / 직접노무원가 임률차이 ￦53,000(불리)\n(주)세무의 당기 직접노무시간당 실제임률은?",

{ id:"hg2021-30", subject:"회계학개론", year:2021, no:30, law:"회계학개론", unit:"전부원가·변동원가계산", kind:"calc",
  stem:"(주)세무는 단일제품을 생산·판매하고 있으며, 선입선출법에 의한 종합원가계산을 적용하고 있다. 직접재료는 공정 초에 전량 투입되며, 전환원가는 공정 전반에 걸쳐 균등하게 발생한다. 당기 재고자산 관련 자료는 다음과 같다.\n구분 / 기초재고 / 기말재고\n재공품(전환원가완성도) 1,500단위(40%) / 800단위(50%)\n제품 800 / 1,000\n(주)세무는 당기에 8,500단위를 제조공정에 투입하여 9,200단위를 완성하였고, 완성품환산량 단위당 원가는 직접재료원가 ￦50, 전환원가 ￦30으로 전기와 동일하다. (주)세무의 당기 전부원가계산에 의한 영업이익이 ￦315,000일 경우, 초변동원가계산에 의한 영업이익은?",
  choices:["￦300,000","￦309,000","￦315,000","￦321,000","￦330,000"],
  answer:3, status:"clear", note:"" },
{ id:"hg2021-31", subject:"회계학개론", year:2021, no:31, law:"회계학개론", unit:"전부원가·변동원가계산", kind:"calc",
  stem:"20×1년에 영업을 개시한 (주)세무는 단일제품을 생산·판매하고 있으며, 전부원가계산제도를 채택하고 있다. (주)세무는 20×1년 2,000단위의 제품을 생산하여 단위당 ￦1,800에 판매하였으며, 영업활동에 관한 자료는 다음과 같다.\n○ 제조원가: 단위당 직접재료원가 ￦400 / 단위당 직접노무원가 300 / 단위당 변동제조간접원가 200 / 고정제조간접원가 250,000\n○ 판매관리비: 단위당 변동판매관리비 ￦100 / 고정판매관리비 150,000\n(주)세무의 20×1년 영업이익이 변동원가계산에 의한 영업이익보다 ￦200,000이 많을 경우, 판매수량은? (단, 기말재공품은 없다.)",
  choices:["200단위","400단위","800단위","1,200단위","1,600단위"],
