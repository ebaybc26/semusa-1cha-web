{ id:"jj2020-25", subject:"재정학", year:2020, no:25, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"지방분권제도가 중앙집권제도보다 더 바람직한 경우에 관한 설명으로 옳은 것은?",
  choices:["세금 징수에 있어서 규모의 경제가 존재한다.","공공재 공급에 있어서 규모의 경제가 존재한다.","공공재에 대한 선호가 모든 지역에서 동일하다.","주민들의 지역 간 이동비용이 낮다.","공공재와 세금에 대한 정보를 획득하는 비용이 높다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2020-26", subject:"재정학", year:2020, no:26, law:"재정학", unit:"1편 재정학의 개요", kind:"concept",
  stem:"보상기준에 관한 설명으로 옳지 않은 것은?",
  choices:["효용가능곡선이 교차하지 않는 경우, 보상기준이 충족되면 잠재적으로 사회후생이 증가된다.","스키토브스키(T. Scitovsky)기준은 칼도-힉스(Kaldo-Hicks)기준의 모순을 보완하기 위한 기준이다.","파레토기준은 칼도-힉스의 보상기준을 충족한다.","칼도기준은 상태 변경으로 이득을 얻는 사람의 이득으로 손해 보는 사람의 손실을 보상하고도 남는 경우를 말한다.","힉스(J. R. Hicks) 기준은 상태 변경으로 손해를 보는 사람이 이득을 얻는 사람을 매수하는 데 실패하는 경우에 해당한다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2020-27", subject:"재정학", year:2020, no:27, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"calc",
  stem:"어떤 시장에 공급함수와 수요함수가 각각 다음과 같이 주어졌다고 하자.\nP = aQ_S + 10,  P = 100 - bQ_D\n초기 균형 상태에서 정부가 공급자에게 단위당 10만큼의 세금을 부과할 경우, 세수와 자중손실(deadweight loss)의 비(세수:자중손실)는 얼마인가? (단, P는 가격이고 Q_S는 공급량, Q_D는 수요량이고 a>0, b>0이다.)",
  choices:["20:1","16:1","12:1","8:1","3.7:1"],
  answer:2, status:"clear", note:"" },
{ id:"jj2020-28", subject:"재정학", year:2020, no:28, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"정부 간 재원 이전제도인 교부금에 관한 설명으로 옳지 않은 것은?",
  choices:["보조금이 지급될 경우, 지방세가 줄어들어 그로 인해 민간지출이 증가하기보다 지방정부의 지출이 더 많이 늘어나는 현상을 끈끈이 효과로 볼 수 있다.","대응교부금의 경우, 공공재 선택에서 대체효과를 발생시키기 때문에 비효율적이다.","무조건부 교부금의 경우, 소득효과만을 발생시키기 때문에 비효율을 억제할 수 있다.","우리나라의 국고 보조금과 보통 교부세는 조건부 교부금이다.","지방자치단체의 후생수준 증가라는 측면에서 볼 때, 무조건부 교부금은 최소한 대응교부금보다 우월하다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2020-29", subject:"재정학", year:2020, no:29, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"다음은 강 상류에 위치한 화학공장 A와 하류의 양식장 B로 구성된 경제에 관한 상황이다. A는 제품생산 공정에서 수질오염을 발생시키고, 이로 인해 B에게 피해비용이 발생한다. A의 한계편익(MB_A)과 A의 생산으로 인한 B의 한계피해비용(MD_B)은 다음과 같다.\nMB_A = 90 - (1/2)Q,  MD_B = (1/4)Q\nQ에 대한 A의 한계비용과 B의 한계편익은 0이며, 협상이 개시되는 경우 협상비용도 0이라고 가정하자. 다음 설명으로 옳지 않은 것은? (단, Q는 A의 생산량이다.)",
  choices:["강의 소유권이 A에게 있고 양자 간의 협상이 없다면, A의 생산량은 180, A의 총편익은 8,100, B의 총비용은 4,050이다.","강의 소유권이 B에게 있고, 양자 간의 협상이 없다면, A의 생산량은 0, A의 총편익은 0, B의 총비용은 0이다.","이 경제에서 사회적으로 바람직한 A의 생산량은 120, A의 총편익은 7,200, B의 총비용은 1,800이다.","강의 소유권이 A에게 있고 양자 간 협상이 성립하여 사회적으로 바람직한 생산량이 달성된다면, A가 B로부터 받는 보상의 범위는 최소 900 이상, 최대 2,250 이하가 될 것이다.","강의 소유권이 B에게 있고 양자 간의 협상이 개시되어 사회적으로 바람직한 산출량이 달성된다면, B가 A로부터 받는 보상의 범위는 최소 1,800 이상 최대 4,050 이하가 될 것이다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2020-30", subject:"재정학", year:2020, no:30, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"빈곤에 관한 아래의 정의식에 근거하여 다음 설명으로 옳은 것을 모두 고른 것은?\no 빈곤율 = 빈곤층의 인구 / 전체인구\no 빈곤갭 = 빈곤층 인구수 × (빈곤선 - 빈곤층 인구의 평균소득)\no 소득갭비율 = (빈곤선 - 빈곤층 인구의 평균소득) / 빈곤선\n\nㄱ. 빈곤율은 빈곤 완화를 위해 필요한 재원규모에 대한 정보를 알려주지 못한다.\nㄴ. 빈곤갭은 빈곤층 내부의 소득재분배에 영향을 받지 않는다.\nㄷ. 소득갭비율은 정부의 정책으로 빈곤층 인구의 평균소득을 증가시키면 늘어난다.",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:2, status:"clear", note:"" },
{ id:"jj2020-31", subject:"재정학", year:2020, no:31, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"A, B, C 세 가지 선택대상에 대한 갑, 을, 병 3인의 선호순위가 다음의 표와 같이 주어져 있다.\n갑: 1순위 A, 2순위 B, 3순위 C / 을: 1순위 B, 2순위 C, 3순위 A / 병: 1순위 C, 2순위 A, 3순위 B\n다수결에 의해 결정할 경우 꽁도세(Condorcet) 승자에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. A와 B를 먼저 비교할 경우, 최종적으로 B가 선택된다.\nㄴ. A와 C를 먼저 비교할 경우, 최종적으로 B가 선택된다.\nㄷ. B와 C를 먼저 비교할 경우, 최종적으로 B가 선택된다.\nㄹ. 이 상황에서는 사회적 선호가 이행성을 만족시킨다.\nㅁ. 이 상황에서는 사회적 선호가 이행성을 만족시키지 않는다.",
  choices:["ㄱ, ㄹ","ㄱ, ㅁ","ㄴ, ㄹ","ㄴ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:4, status:"clear", note:"" },
{ id:"jj2020-32", subject:"재정학", year:2020, no:32, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"외부성에 관한 설명으로 옳지 않은 것은?",
  choices:["생산과 관련된 현상으로 소비와 관련되어 나타날 수 없다.","외부불경제가 존재하면 사회적 최적에 비하여 과다생산된다.","외부성을 내부화하기 위해 조세 또는 보조금을 사용한다.","배출권 거래제는 공해 물질에 대한 시장을 조성한 것으로 볼 수 있다.","재산권을 통해 외부성을 내부화한 경우, 소득분배의 방향과 관계없이 효율성 달성이 가능하다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2020-33", subject:"재정학", year:2020, no:33, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"사회보험과 공공부조에 관한 설명으로 옳지 않은 것은?",
  choices:["사회보험으로 국민기초생활보장제도의 재원을 충당한다.","공공부조는 원칙적으로 정부의 예산으로 충당한다.","부과방식의 사회보험은 수지균형을 원칙으로 한다.","공공부조의 수혜 대상 결정은 소득·재산조사를 근거로 한다.","사회보험의 재원은 원칙적으로 보험료로 충당한다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2020-34", subject:"재정학", year:2020, no:34, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"국민연금의 재정적자를 줄이기 위한 조치와 효과로 옳지 않은 것은?",
  choices:["보험료율의 인상은 저소득근로자들에게 부담이 되지 않는다.","보험료율의 인상은 개인들의 현재 가처분소득을 줄일 것이다.","보험료 부과 상한이 월 급여 400만원에서 450만원으로 인상된다면 월 급여 200만원인 근로자의 납입보험료는 영향을 받지 않는다.","연금수급연령의 상향 조정은 단기적으로 연금수급자 수를 줄인다.","연금수급연령이 65세이고 평균수명이 80세라고 가정할 때, 연금수급연령을 1년 상향 조정하면 재정적자를 줄일 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2020-35", subject:"재정학", year:2020, no:35, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"의료보험의 도덕적 해이에 관한 설명으로 옳지 않은 것은?",
  choices:["의료보험에 가입하면 개인들은 건강관리를 철저히 하지 않는 경향이 있다.","민간 의료보험의 경우, 건강관리를 등한시하는 사람의 가입이 증가한다.","의료보험에 가입하면 본인부담 진료비가 줄어들어 병원에 자주 간다.","실손 민간 의료보험의 경우, 고가의 치료 방식을 선호하는 경향으로 인하여 보험금 지출이 늘어난다.","의료 서비스에 대한 실제 비용보다 환자의 지불액이 낮을 때, 발생한다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2020-36", subject:"재정학", year:2020, no:36, law:"재정학", unit:"3편 공공지출이론", kind:"calc",
  stem:"아래와 같은 비용과 편익이 발생하는 공공사업의 순편익의 현재가치는? (단, 할인율은 10%이다.)\n0기: 비용 1,400, 편익 0\n1기: 비용 0, 편익 550\n2기: 비용 0, 편익 1,210",
  choices:["-330","-100","0","100","330"],

{ id:"jj2020-37", subject:"재정학", year:2020, no:37, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"린달모형(Lindahl model)에 관한 설명으로 옳은 것은?",
  choices:["공공재에 관한 진정한 선호를 표출하기 때문에 무임승차의 문제가 생기지 않는다.","자발적 교환을 통한 공공재의 공급문제를 다루고 있다.","린달모형은 개인 간 갈등해소를 위해 정부가 적극적으로 개입해야 함을 시사한다.","개별 소비자의 공공재 비용 분담 비율은 소비자의 소득에 의해서 결정된다.","린달모형에서는 파레토 최적이 달성되지 않는다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2020-38", subject:"재정학", year:2020, no:38, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"경제적 타당성 분석기간이 30년으로 설정된 어떤 공공투자 사업은 첫 해에 비용이 모두 발생하는 반면, 편익은 분석의 전 기간에 걸쳐 매년 동일한 크기로 발생한다. 사회적 할인율이 r일 때, 비용편익분석 결과 순편익의 현재가치는 0이다. 다음 설명으로 옳지 않은 것을 모두 고른 것은?\n\nㄱ. 만약 r보다 높은 사회적 할인율을 적용하면, 이 사업의 편익/비용 비율은 1보다 더 커질 것이다.\nㄴ. 만약 r보다 높은 사회적 할인율을 적용하면, 이 사업의 순편익의 현재가치는 0보다 더 커질 것이다.\nㄷ. 만약 r보다 높은 사회적 할인율을 적용하면, 이 사업의 내부수익률은 더 작아질 것이다.",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:5, status:"clear", note:"" },
{ id:"jj2020-39", subject:"재정학", year:2020, no:39, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"소득의 불평등도 측정에 관한 설명으로 옳지 않은 것은?",
  choices:["두 로렌츠곡선이 서로 교차하는 경우, 소득 불평등도를 서로 비교할 수 없다.","지니계수는 대각선과 로렌츠곡선 사이의 면적을 로렌츠곡선 아래의 면적으로 나눈 값이다.","균등분배 대등소득과 평균 소득이 일치하면 앳킨슨지수는 0이 된다.","5분위배율은 소득 분배의 불평등도가 커질수록 값이 커진다.","달튼(H. Dalton)의 평등지수는 0에 가까울수록 불평등한 상태를 의미한다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2020-40", subject:"재정학", year:2020, no:40, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"국가채무에 관한 설명으로 옳지 않은 것은?",
  choices:["리카도 대등정리가 성립하면, 국채상환에 대비한 저축이 증가하여 이자율이 오르지 않아서 구축효과가 발생하지 않는다.","국채발행이 증가하면 이자율이 상승하고, 원화 환율이 하락하여 경상수지가 악화된다.","러너(A. Lerner)로 대표되는 국채에 관한 전통적인 견해에 따르면, 내부채무의 경우 미래세대로 부담이 전가된다.","이자율 하락은 국채의 시장가치를 상승시켜 정부부채를 증가시키는 효과가 있다.","중복세대모형에 따르면, 국가 채무는 미래세대로 부담이 전가된다."],
  answer:3, status:"clear", note:"" },

{ id:"hg2016-1", subject:"회계학개론", year:2016, no:1, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"재무제표 표시에 관한 설명으로 옳지 않은 것은?",
  choices:["한국채택국제회계기준서는 재무제표에 표시되어야 할 항목의 순서나 형식을 규정하지 아니한다.","충당부채와 관련된 지출을 제3자와의 계약관계에 따라 보전 받는 경우, 당해 지출과 보전받는 금액은 상계하여 표시할 수 있다.","기업이 기존의 대출계약조건에 따라 보고기간 후 적어도 12개월 이상 부채를 차환하거나 연장할 것으로 기대하고 있지만, 그런 재량권이 없다면 차환가능성을 고려하지 않고 유동부채로 분류한다.","매도가능금융자산의 재측정손익, 확정급여제도의 재측정요소, 현금흐름위험회피파생상품의 평가손익 중 효과적인 부분은 재분류조정이 되는 기타포괄손익이다.","회계정책을 적용하는 과정에서 추정에 관련된 공시와는 별도로, 재무제표에 인식되는 금액에 유의적인 영향을 미친 경영진이 내린 판단은 유의적인 회계정책 또는 기타 주석 사항과 함께 공시한다."],
  answer:4, status:"clear", note:"" },
{ id:"hg2016-2", subject:"회계학개론", year:2016, no:2, law:"회계학개론", unit:"현금흐름표", kind:"calc",
  stem:"㈜세무의 20×1년도 재무제표의 상품매매와 관련된 자료이다. 20×1년도 ㈜세무의 상품매입과 관련된 현금유출액은?\n기초매출채권 ￦40,000 / 기말매출채권 ￦50,000 / 기초상품재고액 30,000 / 기말상품재고액 28,000\n기초매입채무 19,000 / 기말매입채무 20,000 / 기초선수금 20,000 / 기말선수금 15,000\n기초선급금 10,000 / 기말선급금 5,000 / 매출액 400,000 / 매출원가 240,000\n환율변동이익* 4,000\n* 환율변동이익은 매입채무에 포함된 외화외상매입금에서만 발생함",

{ id:"hg2016-3", subject:"회계학개론", year:2016, no:3, law:"회계학개론", unit:"유형자산", kind:"concept",
  stem:"정부보조금의 회계처리에 관한 설명으로 옳지 않은 것은?",
  choices:["정부보조금에 부수되는 조건의 준수와 보조금 수취에 대한 합리적인 확신이 있을 경우에만 정부보조금을 인식한다.","자산의 취득과 이와 관련된 보조금의 수취는 재무상태표에 보조금이 관련 자산에서 차감하여 표시되는지와 관계없이 현금흐름표에 별도 항목으로 표시한다.","정부보조금을 인식하는 경우, 비상각자산과 관련된 정부보조금이 일정한 의무의 이행도 요구한다면 그 의무를 충족시키기 위한 원가를 부담하는 기간에 그 정부보조금을 당기손익으로 인식한다.","정부보조금을 인식하는 경우, 수익관련보조금은 당기손익의 일부로 별도의 계정이나 기타수익과 같은 일반계정으로 표시한다. 대체적인 방법으로 관련비용에서 보조금을 차감할 수도 있다.","정부보조금을 인식한 후에 상환의무가 발생하면 회계정책의 변경으로 회계처리한다."],
  answer:5, status:"clear", note:"" },

  stem:"㈜세무리스는 ㈜한국과 운용리스계약을 체결하고, 20×2년 10월 1일 생산설비(취득원가 ￦800,000, 내용연수 10년, 잔존가치 ￦0, 정액법 감가상각)를 취득과 동시에 인도하였다. 리스기간은 3년이고, 리스료는 매년 9월 30일에 수령한다. ㈜세무리스가 리스료를 다음과 같이 수령한다면, 동 거래가 20×2년 ㈜세무리스와 ㈜한국의 당기순이익에 미치는 영향은 각각 얼마인가?(단, 리스와 관련된 효익의 기간적 형태를 더 잘 나타내는 다른 체계적인 인식기준은 없고, 리스료와 감가상각비는 월할 계산한다.)\n일자 / 리스료\n20×3년 9월 30일 / ￦100,000\n20×4년 9월 30일 / 120,000\n20×5년 9월 30일 / 140,000\n(㈜세무리스 / ㈜한국 순서)",

{ id:"hg2016-5", subject:"회계학개론", year:2016, no:5, law:"회계학개론", unit:"재고자산", kind:"calc",
  stem:"㈜세무는 20×1년 설립이후 재고자산 단위원가 결정방법으로 가중평균법을 사용하여 왔다. 그러나 선입선출법이 보다 목적적합하고 신뢰성있는 정보를 제공할 수 있다고 판단하여, 20×4년 초에 단위원가 결정방법을 선입선출법으로 변경하였다. ㈜세무가 재고자산 단위원가 결정방법을 선입선출법으로 변경하는 경우, 다음 자료를 이용하여 20×4년도 재무제표에 비교정보로 공시될 20×3년 매출원가와 20×3년 기말이익잉여금은?\n20×1년 / 20×2년 / 20×3년\n가중평균법적용 기말재고자산 ￦10,000 / ￦11,000 / ￦12,000\n선입선출법적용 기말재고자산 12,000 / 14,000 / 16,000\n회계정책 변경 전 매출원가 ￦50,000 / ￦60,000 / ￦70,000\n회계정책 변경 전 기말이익잉여금 100,000 / 300,000 / 600,000",
  choices:["매출원가 ￦61,000 / 기말이익잉여금 ￦607,000","매출원가 ￦61,000 / 기말이익잉여금 ￦604,000","매출원가 ￦69,000 / 기말이익잉여금 ￦599,000","매출원가 ￦69,000 / 기말이익잉여금 ￦604,000","매출원가 ￦71,000 / 기말이익잉여금 ￦599,000"],

{ id:"hg2016-6", subject:"회계학개론", year:2016, no:6, law:"회계학개론", unit:"주식기준보상", kind:"calc",
  stem:"㈜세무는 20×3년 1월 1일 종업원 40명에게 1인당 주식선택권 40개씩 부여하였다. 동 주식선택권은 종업원이 향후 3년 동안 ㈜세무에 근무해야 가득된다. 20×3년 1월 1일 현재 주식선택권의 단위당 공정가치는 ￦300으로 추정되었으며, 행사가격은 단위당 ￦600이다. 각 연도말 주식선택권의 공정가치와 퇴직종업원수는 다음과 같다.\n연도 말 / 주식선택권 단위당 공정가치 / 실제 퇴직자 / 추가 퇴직 예상자\n20×3 / ￦300 / 2명 / 6명\n20×4 / 400 / 4 / 2\n20×5 / 500 / 1 / -\n20×6년 초에 가득된 주식선택권의 50%가 행사되어 ㈜세무가 주식(단위당 액면금액 ￦500)을 교부하였다면, 주식선택권 행사로 인해 증가되는 자본은?",

{ id:"hg2016-7", subject:"회계학개론", year:2016, no:7, law:"회계학개론", unit:"리스", kind:"calc",
  stem:"㈜세무리스는 20×1년 1월 1일에 ㈜한국과 해지불능 금융리스계약을 체결하였다. 관련 자료는 다음과 같다.\n○ 리스자산 : 내용연수 5년, 잔존가치 ￦100,000, 정액법 감가상각\n○ 리스기간 : 리스기간개시일(20×1년 1월 1일)부터 5년\n○ 연간리스료 : 매년 12월 31일 지급\n○ 리스개설직접원가 : ㈜세무리스와 ㈜한국 모두 없음\n○ 내재이자율 : 연 10%, ㈜한국은 ㈜세무리스의 내재이자율을 알고 있음\n○ ㈜세무리스는 리스기간개시일에 리스채권으로 ￦19,016,090(리스기간개시일의 리스자산 공정가치와 동일)을 인식함\n○ ㈜한국은 리스기간개시일에 리스자산으로 ￦18,991,254를 인식함\n○ 특약사항 : 리스기간 종료시 반환조건이며, ㈜한국은 리스기간 종료시 예상 잔존가치 ￦100,000 중 일부를 보증함\n㈜한국이 동 리스와 관련하여 보증한 잔존가치는? (단, 기간 5년, 할인율 연 10%일 때, 단위금액 ￦1의 현재가치 계수는 0.6209, 정상연금 ￦1의 현재가치 계수는 3.7908이다. 단수차이로 인한 오차는 가장 근사치를 선택한다.)",
  choices:["￦18,955","￦40,000","￦60,000","￦81,045","￦100,000"],

{ id:"hg2016-8", subject:"회계학개론", year:2016, no:8, law:"회계학개론", unit:"금융자산", kind:"concept",
  stem:"㈜세무는 20×1년 1월 1일에 ㈜한국이 발행한 채권을 ￦927,910에 취득하였다. 동 채권의 액면금액은 ￦1,000,000, 표시이자율은 연 10%(매년 말 지급)이며, 취득 당시 유효이자율은 연 12%이었다. 20×1년 말 동 채권의 이자수취 후 공정가치는 ￦990,000이며, ㈜세무는 20×2년 3월 31일에 발생이자를 포함하여 ￦1,020,000에 동 채권을 처분하였다. ㈜세무의 동 채권과 관련된 회계처리에 관한 설명으로 옳지 않은 것은? (단, 채권 취득과 직접 관련된 거래원가는 없다.)",
  choices:["단기매매금융자산으로 분류한 경우나 매도가능금융자산으로 분류한 경우, 20×1년 말 재무상태표상에 표시되는 금융자산은 ￦990,000으로 동일하다.","단기매매금융자산으로 분류한 경우, 20×1년 당기순이익은 ￦162,090 증가한다.","단기매매금융자산으로 분류한 경우나 매도가능금융자산으로 분류한 경우, 20×1년 총포괄손익금액에 미치는 영향은 동일하다.","단기매매금융자산으로 분류한 경우, 20×2년 당기순이익은 ￦30,000 증가한다.","매도가능금융자산으로 분류한 경우, 20×2년 당기순이익은 ￦75,741 증가한다."],
  answer:5, status:"clear", note:"" },
{ id:"hg2016-9", subject:"회계학개론", year:2016, no:9, law:"회계학개론", unit:"금융부채·사채", kind:"concept",
  stem:"전환사채 회계처리에 관한 설명으로 옳지 않은 것은?",
  choices:["전환사채 발행자는 재무상태표에 부채요소와 자본요소를 분리하여 표시한다.","전환조건이 변경되면 발행자는 '변경된 조건에 따라 전환으로 보유자가 수취하게 되는 대가의 공정가치'와 '원래의 조건에 따라 전환으로 보유자가 수취하였을 대가의 공정가치'의 차이를 조건이 변경되는 시점에 당기손익으로 인식한다.","전환사채를 취득하는 경우 만기 이전에 지분증권으로 전환하는 권리인 전환권 특성에 대해 대가를 지급하기 때문에 일반적으로 전환사채를 만기보유금융상품으로 분류할 수 없다.","복합금융상품의 발행과 관련된 거래원가는 배분된 발행금액에 비례하여 부채요소와 자본요소로 배분한다.","전환권을 행사할 가능성이 변동하는 경우에는 전환상품의 부채요소와 자본요소의 분류를 수정한다."],
  answer:5, status:"clear", note:"" },
{ id:"hg2016-10", subject:"회계학개론", year:2016, no:10, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"자산 또는 부채의 측정에 관한 설명으로 옳지 않은 것은?",
  choices:["거래원가가 존재하는 경우 자산이나 부채의 공정가치를 측정하기 위해서는 주된 시장의 가격에서 동 거래원가를 조정해야 한다. 이때, 거래원가는 운송원가를 포함하지 않는다.","부채의 현행원가는 현재시점에서 그 의무를 이행하는데 필요한 현금이나 현금성자산의 할인하지 아니한 금액을 의미한다.","자산의 역사적 원가는 자산취득의 대가로 취득 당시에 지급한 현금 또는 현금성자산이나 그 외 대가의 공정가치를 의미한다.","자산이나 부채의 교환 거래에서 자산을 취득하거나 부채를 인수하는 경우에, 거래가격은 자산을 취득하면서 지급하거나 부채를 인수하면서 받는 가격이다.","동일한 자산이나 부채의 가격이 관측가능하지 않을 경우 관련된 관측가능한 투입변수의 사용을 최대화하고 관측가능하지 않은 투입변수의 사용을 최소화하는 다른 가치평가기법을 이용하여 공정가치를 측정한다."],
  answer:1, status:"clear", note:"" },
{ id:"hg2016-11", subject:"회계학개론", year:2016, no:11, law:"회계학개론", unit:"주당이익", kind:"calc",
  stem:"㈜세무의 20×6년 당기순이익은 ￦2,450,000이며, 기초 유통보통주식수는 1,800주이다. 20×6년 9월 1일 주주우선배정 방식으로 보통주 300주를 유상증자하였다. 이때 발행금액은 주당 ￦40,000이며, 유상증자 직전 종가는 주당 ￦60,000이다. ㈜세무의 20×6년 기본주당순이익은? (단, 가중평균유통보통주식수는 월할계산한다.)",

  choices:["관계기업이나 공동기업에 대한 투자를 최초 인식시 원가로 인식한다.","취득일 이후에 발생한 피투자자의 당기순손익 중 투자자의 몫은 투자자의 당기순손익으로 인식한다.","기업은 투자가 관계기업이나 공동기업의 정의를 충족하지 못하게 된 시점부터 지분법의 사용을 중단한다.","지분법의 사용을 중단한 경우, 그 투자와 관련하여 기타포괄손익으로 인식한 모든 금액에 대하여 기업은 피투자자가 관련 자산이나 부채를 직접 처분한 경우의 회계처리와 동일한 기준으로 회계처리한다.","관계기업 투자가 공동기업 투자로 되거나 공동기업 투자가 관계기업 투자로 되는 경우, 기업은 지분법을 계속 적용하며 잔여 보유 지분을 재측정한다."],

  choices:["일반적인 목적으로 차입한 자금을 적격자산 취득에 사용하였다면 관련 차입원가를 자본화하되, 동 차입금과 관련하여 자본화기간 내에 발생한 일시적 투자수익을 자본화가능차입원가에서 차감한다.","일반적인 목적으로 차입한 자금의 자본화가능차입원가를 결정할 때, 적용되는 자본화이자율은 회계기간동안 차입한 자금(적격자산을 취득하기 위해 특정 목적으로 차입한 자금 제외)으로부터 발생된 차입원가를 가중평균하여 산정한다.","적격자산과 관련하여 수취하는 정부보조금과 건설 등의 진행에 따라 수취하는 금액은 적격자산에 대한 지출액에서 차감한다.","적격자산에 대한 적극적인 개발활동을 중단한 기간에는 차입원가의 자본화를 중단한다.","적격자산을 의도된 용도로 사용하거나 판매가능한 상태에 이르게 하는 데 필요한 대부분의 활동이 완료된 시점에 차입원가의 자본화를 종료한다."],

  choices:["완성될 제품이 원가 이상으로 판매될 것으로 예상되더라도 생산에 투입하기 위해 보유한 원재료 가격이 현행대체원가 보다 하락한다면 평가손실을 인식한다.","후속 생산단계에 투입하기 전에 보관이 필요한 경우 이외의 보관원가는 재고자산의 취득원가에 포함할 수 없으며 발생기간의 비용으로 인식한다.","재고자산을 후불조건으로 취득하는 경우 계약이 실질적으로 금융요소를 포함하고 있다면, 해당 금융요소는 금융이 이루어지는 기간 동안 이자비용으로 인식한다.","재고자산을 순실현가능가치로 감액한 평가손실과 모든 감모손실은 감액이나 감모가 발생한 기간에 비용으로 인식한다.","당기에 비용으로 인식하는 재고자산 금액은 일반적으로 매출원가로 불리우며, 판매된 재고자산의 원가와 배분되지 않은 제조간접원가 및 제조원가 중 비정상적인 부분의 금액으로 구성된다."],

  stem:"㈜세무는 단일 제품C를 생산하며, 변동원가계산을 적용한다. 20×2년 제품C의 생산량과 판매량은 1,000개로 동일하고, 기초 및 기말재공품은 없다. 20×2년 제품C의 생산 및 판매와 관련된 자료는 다음과 같다. 감가상각비를 제외하고, 수익발생과 현금유입 시점은 동일하며 원가(비용)발생과 현금유출 시점도 동일하다.\n○ 단위당 판매가격 ￦6,000 ○ 단위당 변동제조원가 3,200 ○ 단위당 변동판매관리비 1,600\n○ 연간 고정제조간접원가 242,000 (기계 감가상각비 ￦72,000 포함)\n○ 연간 고정판매관리비 206,800 (매장건물 감가상각비 ￦64,800 포함) ○ 법인세율 25%\n○ 기계와 매장건물은 20×0년에 취득하였다.\n㈜세무의 세후현금흐름분기점 판매량(A)과 판매량이 1,000개인 경우의 세후영업이익(B)은?",

{ id:"hg2016-36", subject:"회계학개론", year:2016, no:36, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"㈜세무는 개별원가계산방법을 적용한다. 제조지시서#1은 전기부터 작업이 시작되었고, 제조지시서#2와 #3은 당기 초에 착수되었다. 당기 중 제조지시서#1과 #2는 완성되었으나, 당기말 현재 제조지시서#3은 미완성이다. 당기 제조간접원가는 직접노무원가에 근거하여 배부한다. 당기에 제조지시서#1 제품은 전량 판매되었고, 제조지시서#2 제품은 전량 재고로 남아있다. 다음 자료와 관련된 설명으로 옳지 않은 것은?\n구분 / #1 / #2 / #3 / 합계\n기초금액 ￦450 / - / - / -\n[당기투입액]\n직접재료원가 ￦6,000 / ￦2,500 / ( ) / ￦10,000\n직접노무원가 500 / ( ) / ( ) / 1,000\n제조간접원가 ( ) / 1,000 / ( ) / 4,000",
  choices:["당기제품제조원가는 ￦12,250이다.","당기총제조원가는 ￦15,000이다.","기초재공품은 ￦450이다.","기말재공품은 ￦2,750이다.","당기매출원가는 ￦8,950이다."],

{ id:"hg2016-37", subject:"회계학개론", year:2016, no:37, law:"회계학개론", unit:"책임회계·대체가격", kind:"calc",
  stem:"㈜세무는 분권화된 A사업부와 B사업부가 있다. A사업부는 반제품M을 최대 3,000단위 생산할 수 있으며, 현재 단위당 판매가격 ￦600으로 2,850단위를 외부에 판매하고 있다. B사업부는 A사업부에 반제품M 300단위를 요청하였다. A사업부 반제품M의 단위당 변동원가는 ￦300(변동판매관리비는 ￦0)이며, 사내대체를 하여도 외부판매가격과 단위당 변동원가는 변하지 않는다. A사업부는 사내대체를 전량 수락하든지 기각하여야 하며, 사내대체 수락시 외부시장 판매를 일부 포기하여야 한다. A사업부가 사내대체 전 이익을 감소시키지 않기 위해 제시할 수 있는 최소 사내대체가격은?",

{ id:"hg2016-38", subject:"회계학개론", year:2016, no:38, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"concept",
  stem:"부문별 원가계산에 관한 설명으로 옳지 않은 것은?",
  choices:["단계배부법은 보조부문의 배부순서가 달라져도 배부금액은 차이가 나지 않는다.","단계배부법은 보조부문 간의 서비스 제공을 한 방향만 고려하여 그 방향에 따라 보조부문의 원가를 단계적으로 배부한다.","상호배부법은 보조부문 간의 상호배부를 모든 방향으로 반영한다.","단계배부법은 한 번 배부된 보조부문의 원가는 원래 배부한 보조부문에는 다시 배부하지 않고 다른 보조부문과 제조부문에 배부한다.","직접배부법은 보조부문 간에 주고받는 서비스 수수관계를 전부 무시한다."],
  answer:1, status:"clear", note:"" },
{ id:"hg2016-39", subject:"회계학개론", year:2016, no:39, law:"회계학개론", unit:"종합원가계산", kind:"calc",

  choices:["물량기준법은 모든 연산품의 물량 단위당 결합원가 배부액이 같아진다.","분리점판매가치법(상대적 판매가치법)은 분리점에서 모든 연산품의 매출총이익률을 같게 만든다.","균등이익률법은 추가가공 후 모든 연산품의 매출총이익률을 같게 만든다.","순실현가치법은 추가가공 후 모든 연산품의 매출총이익률을 같게 만든다.","균등이익률법과 순실현가치법은 추가가공을 고려한 방법이다."],

{ id:"hs2016-42", subject:"행정소송법", year:2016, no:42, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"취소소송의 제기 및 심리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["소가 제기되면 법원은 이를 심리·판결하여야 한다.","법원은 취소소송이 제기되기 전이라도 처분의 집행정지결정을 할 수 있다.","소가 제기되어 계속중이면 중복제소가 금지된다.","행정심판 등 전심절차에서의 주장과 행정소송에서의 주장이 전혀 별개의 것이 아닌 한 그 주장이 반드시 일치하여야 하는 것은 아니다.","소가 제기되면 관련청구소송의 이송 및 병합이 가능해진다."],

{ id:"hs2016-43", subject:"행정소송법", year:2016, no:43, law:"행정소송법", unit:"판결 일반", kind:"concept",
  stem:"취소소송의 인용판결 중 일부취소에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["일부취소되는 부분은 분리가능하고 명확히 확정할 수 있어야 한다.","과세처분취소소송에서 정당한 부과금액을 확정할 수 있으면 그 금액을 초과하는 부분만을 취소하여야 한다.","영업정지처분취소소송에서 일정기간의 영업정지가 정당하다고 판단되면 그 기간을 초과하는 부분만을 취소하여야 한다.","개발부담금부과처분취소소송에서 정당한 부과금액을 산출할 수 없으면 그 전부를 취소하여야 한다.","재량이 인정되는 과징금납부명령에 대한 취소소송에서 정당한 부과금액을 산출할 수 있어도 그 전부를 취소하여야 한다."],

{ id:"hs2016-44", subject:"행정소송법", year:2016, no:44, law:"행정소송법", unit:"행정소송의 종류·한계", kind:"concept",

  choices:["ㄱ, ㄴ, ㅁ","ㄱ, ㄹ, ㅁ","ㄴ, ㄷ, ㅂ","ㄴ, ㄹ, ㅁ","ㄹ, ㅁ, ㅂ"],
  answer:4, status:"clear", note:"" },
{ id:"hs2016-45", subject:"행정소송법", year:2016, no:45, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"판결의 효력인 기속력에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["당사자인 행정청을 기속하지만 그 밖의 관계행정청을 기속하지는 않는다.","종전 거부처분 후에 발생한 새로운 사유를 내세워 다시 하는 거부처분은 기속력의 내용으로서 재처분에 해당할 수 없다.","기속력은 판결의 주문에만 미치고, 그 전제가 되는 처분 등의 구체적 위법사유에 관한 이유 중의 판단에 대하여는 미치지 않는다.","기속력에 반하는 처분은 취소사유에 해당한다.","거부처분이 절차의 하자를 이유로 취소된 경우, 처분청은 적법한 절차를 거쳐 다시 거부처분을 할 수 있다."],

{ id:"hs2016-46", subject:"행정소송법", year:2016, no:46, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 취소소송의 원고적격을 인정하지 않은 것은?",
  choices:["다른 공동상속인의 상속세에 대한 연대납부의무를 지는 상속인이 제기하는 다른 공동상속인에 대한 상속세 과세처분 자체의 취소소송","국세체납을 원인으로 한 부동산 압류처분 후에 압류부동산을 매수한 자가 제기하는 압류처분 취소소송","환경영향평가대상지역 내에 사는 주민이 제기하는 당해 환경영향평가대상사업 허가처분 취소소송","방사성물질에 의하여 보다 직접적이고 중대한 피해를 입으리라고 예상되는 지역 내의 주민들이 제기하는 원자로시설부지 사전승인처분 취소소송","담배 일반소매인으로 지정되어 영업을 하고 있는 기존업자가 제기하는 경업자에 대한 면허나 인·허가 등의 수익적 행정처분 취소소송"],

{ id:"hs2016-47", subject:"행정소송법", year:2016, no:47, law:"행정소송법", unit:"무효등확인소송", kind:"concept",
  stem:"무효등확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["유효확인소송은 무효등확인소송에 포함된다.","무효확인소송에서 처분이 무효인 사유를 주장·입증할 책임은 원고에게 있다.","처분등의 효력 유무 또는 존재 여부의 확인을 구할 법률상 이익이 있는 자가 제기할 수 있다.","작위의무확인소송은 무효등확인소송에 포함된다.","무효등확인소송의 제기요건으로서 보충성이 요구되지 않는다."],

{ id:"hs2016-48", subject:"행정소송법", year:2016, no:48, law:"행정소송법", unit:"처분사유의 추가·변경", kind:"concept",
  stem:"판례상 과세처분취소소송에서 과세관청이 처분사유를 추가·변경하는 것에 관한 설명으로 옳지 않은 것은?",
  choices:["과세관청은 사실심변론종결시까지 처분사유를 추가할 수 있다.","과세관청은 당해 처분에서 인정한 과세표준 및 세액의 정당성을 뒷받침하는 새로운 자료를 제출할 수 있다.","과세관청은 처분 당시 제시했던 처분사유만을 주장할 수 있는 것은 아니다.","과세관청은 처분의 동일성이 유지되는 범위 내에서 그 사유를 변경할 수 있다.","과세원인이 되는 기초사실이 같은 객관적 사실관계에 관하여 과세요건의 구성과 법적 평가만을 달리하는 처분사유의 추가는 허용되지 않는다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2016-49", subject:"행정소송법", year:2016, no:49, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"당사자소송에 관한 설명으로 옳지 않은 것은?",
  choices:["다른 법률에 특별한 규정이 없는 한 그 처분등을 행한 행정청을 피고로 한다.","법령에 제소기간이 정하여져 있는 때에는 그 기간은 불변기간으로 한다.","법원은 필요하다고 인정할 때에는 당사자가 주장하지 아니한 사실에 대하여도 판단할 수 있다.","취소판결의 간접강제에 관한 규정이 준용되지 않는다.","법원은 재결을 행한 행정청에 대하여 행정심판기록 제출을 명할 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2016-50", subject:"행정소송법", year:2016, no:50, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"행정소송상 심리에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["직권탐지주의가 원칙이고, 변론주의는 예외이다.","법원이 당사자에게 새로운 청구를 할 것을 권유하는 것이 석명권의 한계를 넘어서는 것은 아니다.","법원은 필요하다고 인정할 때에는 직권으로 증거조사를 할 수 있다.","법원은 행정소송에 있어서 원고의 청구범위를 초월하여 그 이상의 청구를 인용할 수 있다.","법원은 당사자가 주장하지 아니한 사실에 대해서는 판단할 수 없다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2016-51", subject:"행정소송법", year:2016, no:51, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 항고소송의 소의 이익을 인정한 것은?",
  choices:["가중 제재처분규정이 있는 의료법에 의한 의사면허자격정지처분에서 정한 자격정지기간이 지난 후 그 처분의 취소를 구하는 소송","사법시험 제1차시험 불합격처분 후 새로 실시된 제1차시험에 합격한 경우, 그 불합격처분의 취소를 구하는 소송","공정거래위원회가 부당한 공동행위를 한 사업자에게 과징금 부과처분을 한 뒤, 다시 자진신고 등을 이유로 감면처분을 한 경우, 선행 부과처분의 취소를 구하는 소송","건축허가를 받아 건축공사를 완료한 경우 그 허가처분의 취소를 구하는 소송","행정대집행이 실행완료된 경우 대집행계고처분의 취소를 구하는 소송"],
  answer:1, status:"clear", note:"" },
{ id:"hs2016-52", subject:"행정소송법", year:2016, no:52, law:"행정소송법", unit:"부작위위법확인소송", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["부작위위법확인소송에서 법원은 부작위의 효력이나 그 집행 또는 절차의 속행의 정지를 결정할 수 있다.","부작위위법확인소송의 제기 전후를 통하여 판결시까지 행정청이 그 신청에 대하여 적극 또는 소극의 처분을 한 때에는 소의 이익을 상실한다.","부작위위법확인판결의 효력으로서 재처분의무는 어떠한 처분을 하기만 하면 되는 게 아니라 당초 신청된 특정 처분을 해야 하는 것이다.","부작위위법확인소송에서 사정판결을 할 수 있다.","부작위위법확인판결의 효력은 제3자에게는 미칠 수 없다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2016-53", subject:"행정소송법", year:2016, no:53, law:"행정소송법", unit:"선결문제", kind:"concept",
  stem:"처분등의 효력 유무 또는 존재 여부가 민사소송의 선결문제로 되어 당해 민사소송의 수소법원이 이를 심리·판단하는 경우에 준용되는 행정소송법 규정을 모두 고른 것은?\nㄱ. 재판관할\nㄴ. 직권심리\nㄷ. 사정판결\nㄹ. 행정청의 소송참가\nㅁ. 행정심판기록의 제출명령",
  choices:["ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㅁ","ㄴ, ㄹ, ㅁ","ㄷ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ, ㅁ"],
  answer:3, status:"clear", note:"" },
{ id:"hs2016-54", subject:"행정소송법", year:2016, no:54, law:"행정소송법", unit:"관련청구의 이송·병합", kind:"concept",
  stem:"행정소송법상 관련청구소송의 병합에 관한 설명으로 옳은 것은?",
  choices:["원상회복청구소송은 당해 처분등과 관련되는 경우라도 관련청구소송에 해당되지 않는다.","관련청구소송의 병합은 사실심변론종결 이후에도 가능하다.","피고외의 자를 상대로 한 관련청구소송도 병합의 대상이 될 수 있다.","처분의 취소소송은 처분과 관련된 부당이득반환청구소송이 계속된 법원에 병합해야 한다.","취소소송의 소송요건이 갖추어졌다면 관련청구소송은 소송요건을 갖추지 않아도 된다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2016-55", subject:"행정소송법", year:2016, no:55, law:"행정소송법", unit:"소송요건", kind:"concept",
  stem:"항고소송의 소송요건 흠결에 관한 설명으로 옳지 않은 것은?",
  choices:["소송요건의 흠결로 각하판결이 선고된 경우 원고는 흠결된 요건을 보완하여 다시 소를 제기할 수 있다.","원고적격의 흠결로 인한 소송판결은 종국판결의 일종이다.","소송요건의 구비 여부는 직권조사사항이다.","소송요건이 흠결된 경우에도 처분이 위법하면 기각판결을 하여야 한다.","본안심리 중 소송요건의 흠결이 있는 경우에 법원은 소송요건에 관하여 판단할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2016-56", subject:"행정소송법", year:2016, no:56, law:"행정소송법", unit:"소송요건", kind:"concept",
  stem:"항고소송의 소송요건에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["소송요건은 불필요한 소송을 배제하고 법원의 부담을 경감하는 기능이 있다.","취소소송의 토지관할은 전속관할이라 할 수 없다.","검사의 불기소처분은 항고소송으로 다툴 수 있다.","법원은 원고의 고의 또는 중대한 과실없이 행정소송이 심급을 달리하는 법원에 잘못 제기된 경우에는 결정으로 이를 관할법원에 이송한다.","중앙행정기관에 대한 취소소송은 서울행정법원에 제기할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2016-57", subject:"행정소송법", year:2016, no:57, law:"행정소송법", unit:"피고적격", kind:"concept",
  stem:"항고소송의 피고에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["지방의회의 의장선임의결에 대한 항고소송에서는 지방의회가 피고가 된다.","처분에 관계되는 권한이 다른 행정청에 승계된 때에는 이를 승계한 행정청을 피고로 한다.","행정청이 없게 된 때에는 그 처분등에 관한 사무가 귀속되는 국가 또는 공공단체를 피고로 한다.","조례가 항고소송의 대상이 되는 경우 조례를 의결한 지방의회가 피고가 된다.","검사임용거부처분에 대한 취소소송에서는 법무부장관이 피고가 된다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2016-58", subject:"행정소송법", year:2016, no:58, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"판례상 다음 ( )안에 들어갈 내용을 바르게 나열한 것은?\n○ 국가의 납세의무자에 대한 부가가치세 환급세액 지급의무는 부가가치세법령의 규정에 의하여 직접 발생하는 것으로서, 납세의무자의 국가에 대한 부가가치세 환급세액 지급청구는 ( ㄱ )의 절차에 따라야 한다.\n○ 민주화운동관련자 명예회복 및 보상 등에 관한 법률에서 말하는 보상금 등의 지급에 관한 소송은 '민주화운동관련자 명예회복 및 보상 심의위원회'의 보상금 등의 지급신청에 관하여 전부 또는 일부를 기각하는 결정에 대한 불복을 구하는 소송이므로 ( ㄴ )을 의미한다.",
  choices:["ㄱ: 당사자소송, ㄴ: 당사자소송","ㄱ: 취소소송, ㄴ: 취소소송","ㄱ: 당사자소송, ㄴ: 민사소송","ㄱ: 취소소송, ㄴ: 당사자소송","ㄱ: 당사자소송, ㄴ: 취소소송"],
  answer:5, status:"clear", note:"" },
{ id:"hs2016-59", subject:"행정소송법", year:2016, no:59, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"항고소송의 대상적격에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["도시기본계획은 장기발전방향을 제시하는 종합계획으로서 처분이다.","폐기물관리법상 폐기물처리업의 허가를 위한 사업계획에 대한 부적정통보는 처분이 아니다.","행정행위의 부관 중 부담은 항고소송의 대상이 될 수 없다.","지방병무청장이 공익근무요원 소집통지를 한 후 직권으로 그 기일을 연기한 다음 다시 한 공익근무요원 소집통지는 처분이 아니다.","국가인권위원회의 성희롱결정과 시정조치의 권고는 성희롱 행위자와 사용자에게 법률상의 의무를 부담시키지만 권고이어서 처분이 아니다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2016-60", subject:"행정소송법", year:2016, no:60, law:"행정소송법", unit:"행정심판전치주의", kind:"concept",
  stem:"취소소송과 행정심판의 관계에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["필요적 행정심판전치가 적용되는 경우, 처분을 행한 행정청이 행정심판을 거칠 필요가 없다고 잘못 알린 때에는 행정심판을 제기함이 없이 취소소송을 제기할 수 있다.","행정심판청구가 부적법하지 않음에도 각하한 재결은 취소소송의 대상이 될 수 없다.","행정심판의 인용재결은 제3자가 제기하는 취소소송의 대상이 될 수 있다.","필요적 행정심판전치가 적용되는 경우, 동종사건에 관하여 이미 행정심판의 기각재결이 있은 때에는 행정심판을 제기함이 없이 취소소송을 제기할 수 있다.","원처분보다 청구인에게 불리하게 변경된 재결은 취소소송의 대상이 될 수 있다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2016-61", subject:"행정소송법", year:2016, no:61, law:"행정소송법", unit:"판례 종합", kind:"concept",
  stem:"과세처분에 대한 항고소송의 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["과세처분 후 감액경정결정된 경우 취소소송의 대상은 당초의 부과처분 중 경정결정에 의하여 취소되지 않고 남은 부분이다.","일반적으로 과세처분취소소송에서 과세요건사실에 관한 입증책임은 원고에게 있다.","과세처분 후 증액경정처분이 있는 경우 증액경정처분이 항고소송의 대상이 된다.","과세처분의 무효확인청구소송에서는 제소기간의 제한에 관한 규정은 적용되지 아니한다.","부가가치세부과처분의 무효선언을 구하는 의미에서 취소를 구하는 소송인 경우에는 전심절차를 거쳐야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2016-62", subject:"행정소송법", year:2016, no:62, law:"행정소송법", unit:"위법판단 기준시", kind:"concept",
  stem:"다음 ( )안에 들어갈 내용을 바르게 나열한 것은? (다툼이 있으면 판례에 따름)\n○ 거부처분취소소송에서는 ( ㄱ )의 법령과 사실상태를 기준으로 행정처분의 위법 여부를 판단한다.\n○ 부작위위법확인소송에서는 ( ㄴ )의 법령과 사실상태를 기준으로 부작위의 위법 여부를 판단한다.",
  choices:["ㄱ: 판결시, ㄴ: 처분시","ㄱ: 처분시, ㄴ: 신청시","ㄱ: 신청시, ㄴ: 처분시","ㄱ: 처분시, ㄴ: 판결시","ㄱ: 판결시, ㄴ: 판결시"],
  answer:4, status:"clear", note:"" },
{ id:"hs2016-63", subject:"행정소송법", year:2016, no:63, law:"행정소송법", unit:"제소기간", kind:"concept",
  stem:"취소소송의 제소기간에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분등이 있음을 안 날부터 90일, 처분등이 있은 날부터 1년 중 먼저 도래한 날이 경과되면 제소기간이 도과된다.","적법한 행정심판청구가 있은 때의 제소기간은 재결신청일부터 기산한다.","처분등이 있음을 안 날부터 90일이라는 제소기간은 불변기간이 아니다.","취소소송의 제소기간의 규정은 당사자소송에 적용된다.","특정인에 대한 처분을 주소불명의 이유로 송달할 수 없어 관보에 공고한 경우 공고가 효력을 발생하는 날에 상대방이 그 처분이 있음을 알았다고 보아야 한다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2016-64", subject:"행정소송법", year:2016, no:64, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"행정소송법상 처분의 변경으로 인한 소의 변경에 관한 설명으로 옳지 않은 것은?",
  choices:["행정청이 소송의 대상인 처분을 소가 제기된 후 변경한 경우 적용된다.","처분의 변경이 있음을 안 날로부터 60일 이내에 원고가 신청해야 한다.","변경되는 청구는 필요적 행정심판전치의 요건을 갖춘 것으로 본다.","법원은 결정으로써 청구의 취지 또는 원인의 변경을 허가할 수 있다.","처분의 변경으로 인한 소변경이 있으면 종전의 소는 기각된 것으로 본다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2016-65", subject:"행정소송법", year:2016, no:65, law:"행정소송법", unit:"부작위위법확인소송", kind:"concept",
  stem:"부작위위법확인소송의 소송요건과 관련된 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["부작위의 개념은 국민의 권리구제의 확대를 위하여 거부처분을 포함하는 넓은 의미로 이해하여야 한다.","부작위위법확인소송을 제기하였다가 취소소송으로 변경한 경우, 부작위위법확인소송이 적법한 제소기간 내에 제기되었다면 제소기간을 준수한 것으로 본다.","부작위위법의 확인을 구할 법률상 이익이 있는 자는 신청을 하지 않았더라도 부작위위법확인소송을 제기할 수 있다.","행정심판 등 전심절차를 거친 경우 부작위위법확인소송은 제소기간의 제한이 없다.","부작위의 상태가 계속되는 경우에는 법원은 결정으로써 상당한 기간을 제소기간으로 정할 수 있다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2016-66", subject:"행정소송법", year:2016, no:66, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 항고소송의 원고적격을 인정하지 않은 것은?",
  choices:["불이익처분의 상대방","처분의 근거 법규 및 관련 법규에 의하여 보호되는 개별적·직접적·구체적 이익이 있는 자","생태·자연도 1등급이었던 지역을 2등급 또는 3등급으로 변경한 경우, 그 등급변경처분의 무효확인을 청구한 인근 주민","A 국가기관의 조치요구를 다툴 별다른 방법이 없고, 조치요구에 대한 취소소송이 유효·적절한 수단인 경우에 그 조치요구의 상대방인 B 국가기관","직행형 시외버스운송사업자에 대한 사업계획변경인가처분의 취소를 구하는 기존의 고속형 시외버스운송사업자"],
  answer:3, status:"clear", note:"" },
{ id:"hs2016-67", subject:"행정소송법", year:2016, no:67, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"판례상 신청 또는 청구에 대한 거부가 항고소송의 대상이 아닌 것은?",
  choices:["국가지정문화재의 보호구역에 인접한 나대지 소유자의 건물 신축을 위한 국가지정문화재 현상변경 신청","문화재보호구역 내 토지소유자의 문화재보호구역 지정해제 신청","도시계획구역 내 토지를 소유하고 있는 주민의 도시계획입안권자에 대한 도시계획입안 신청","경정청구기간을 도과한 후에 납세자가 제기한 경정청구","도시계획구역 내 토지를 소유하고 있는 주민의 도시시설계획결정권자에 대한 도시시설계획변경 신청"],
  answer:4, status:"clear", note:"" },
{ id:"hs2016-68", subject:"행정소송법", year:2016, no:68, law:"행정소송법", unit:"간접강제", kind:"concept",
  stem:"다음 설명에 해당하는 행정소송법상 제도는?\n행정청이 거부처분취소판결의 취지에 따라 다시 처분을 하지 아니하는 때에는 제1심수소법원은 당사자의 신청에 의하여 결정으로써 상당한 기간을 정하고 행정청이 그 기간내에 이행하지 아니하는 때에는 그 지연기간에 따라 일정한 배상을 할 것을 명하거나 즉시 손해배상을 할 것을 명할 수 있다.",
  choices:["행정강제","국가배상","즉시강제","직접강제","간접강제"],
  answer:5, status:"clear", note:"" },
{ id:"hs2016-69", subject:"행정소송법", year:2016, no:69, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"당사자소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소원인인 하자가 있는 처분의 효력을 다툴 수 있다.","토지소유자가 사업시행자를 피고로 하여 토지수용위원회가 정한 보상금의 증액을 구하는 소송은 당사자소송이다.","처분으로 형성된 법률관계에 대하여는 허용되지 않는다.","관련 민사소송을 병합할 수 없다.","주로 확인소송의 성격을 가지며, 권력분립의 원칙상 이행소송은 허용되지 않는다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2016-70", subject:"행정소송법", year:2016, no:70, law:"행정소송법", unit:"사정판결", kind:"concept",
  stem:"사정판결에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["무효등확인소송에서도 사정판결을 할 수 있다.","당사자의 명백한 주장이 없으면 법원이 직권으로 판단할 수 없다.","공공복리를 위한 사정판결의 필요성은 처분시를 기준으로 판단한다.","사정판결을 하는 법원은 그 판결의 주문에 그 처분의 위법함을 명시할 필요는 없다.","사정판결을 하는 법원은 미리 원고가 그로 인하여 입게 될 손해의 정도와 배상방법 그 밖의 사정을 조사하여야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2016-71", subject:"행정소송법", year:2016, no:71, law:"행정소송법", unit:"소송비용", kind:"concept",
  stem:"행정소송법상 다음 ( )안에 들어갈 내용을 바르게 나열한 것은?\n취소청구가 사정판결에 의하여 ( ㄱ )되거나 행정청이 처분등을 취소 또는 변경함으로 인하여 청구가 ( ㄴ )된 경우에는 소송비용은 피고의 부담으로 한다.",
  choices:["ㄱ: 기각, ㄴ: 인용","ㄱ: 인용, ㄴ: 인용","ㄱ: 기각, ㄴ: 각하 또는 기각","ㄱ: 각하, ㄴ: 각하 또는 기각","ㄱ: 인용, ㄴ: 각하 또는 기각"],
  answer:3, status:"clear", note:"" },
{ id:"hs2016-72", subject:"행정소송법", year:2016, no:72, law:"행정소송법", unit:"무효등확인소송", kind:"concept",
  stem:"무효등확인소송에서 취소소송 규정의 준용에 관한 설명으로 옳은 것은?",
  choices:["취소판결의 기속력에 관한 규정은 준용되지만, 재처분의무에 따른 간접강제에 관한 규정은 준용되지 않는다.","무효등확인소송의 전심절차로서 행정심판을 거친 경우에는 제소기간의 규정이 준용된다.","가처분이 이용될 수 있어, 집행정지의 규정이 준용되지 않는다.","취소소송 대상에 관한 규정이 준용되지 않아 취소소송에 비하여 대상적격이 넓게 인정된다.","피고적격에 관한 규정이 준용되지 않아, 무효등확인소송의 피고는 국가·공공단체 그 밖의 권리주체가 된다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2016-73", subject:"행정소송법", year:2016, no:73, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"집행정지에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["집행정지결정사건은 본안이 계속된 제1심 법원의 전속관할이다.","집행정지의 결정에 대한 즉시항고에는 결정의 집행을 정지하는 효력이 있다.","본안청구가 이유 없음이 명백한 경우에도 법정요건이 충족되면 집행정지는 인정된다.","회복하기 어려운 손해의 주장·소명책임은 처분청에 있다.","처분의 효력정지는 처분등의 집행 또는 절차의 속행을 정지함으로써 목적을 달성할 수 있는 경우에는 허용되지 아니한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2016-74", subject:"행정소송법", year:2016, no:74, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"행정소송상 판결의 기판력에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송의 기각판결에는 기판력이 인정되지 않는다.","행정소송법은 기판력을 명시적으로 규정하고 있다.","기판력은 판결이유에 설시된 그 전제가 되는 법률관계의 존부에까지 미친다.","기판력은 소송물로 된 행정처분의 위법성 존부에 관한 판단 그 자체에만 미친다.","기판력은 당해 처분이 귀속되는 국가 또는 공공단체에는 미치지 않는다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2016-75", subject:"행정소송법", year:2016, no:75, law:"행정소송법", unit:"민중소송·기관소송", kind:"concept",
  stem:"민중소송 및 기관소송에 관한 설명으로 옳은 것은?",
  choices:["기관소송은 법률이 정한 경우에 법률에 정한 자에 한하여 제기할 수 있다.","민중소송은 국가 또는 공공단체의 기관의 행위에 대하여 자기의 법률상 이익이 있는 자가 제기하는 소송이다.","지방자치법상 주민소송은 기관소송에 해당한다.","민중소송에는 그 성질에 반하지 아니하는 한 취소소송에 관한 규정을 준용하지만, 기관소송의 경우에는 그러하지 아니하다.","기관소송은 헌법재판소법상 헌법재판소의 관장사항으로 되는 소송을 포함한다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2016-76", subject:"행정소송법", year:2016, no:76, law:"행정소송법", unit:"소송참가", kind:"concept",
  stem:"행정소송법상 소송참가에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 직권으로 제3자의 소송참가를 결정할 수 있다.","제3자의 소송참가는 소송이 어느 심급에 있는가는 불문한다.","법원이 제3자의 소송참가를 결정할 때에는 미리 당사자의 동의를 얻어야 한다.","소송결과에 대하여 사실상의 이해관계가 있다는 것만으로는 소송참가가 인정되지 않는다.","소송참가를 신청한 제3자는 그 신청을 각하한 결정에 대하여 즉시항고할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2016-77", subject:"행정소송법", year:2016, no:77, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"취소소송과 관련하여 기속력이 인정되는 경우로만 묶인 것은?",
  choices:["인용판결, 집행정지결정","각하판결, 기각판결","인용판결, 기각판결","각하판결, 인용판결","기각판결, 집행정지결정"],
  answer:1, status:"clear", note:"" },
{ id:"hs2016-78", subject:"행정소송법", year:2016, no:78, law:"행정소송법", unit:"소의 변경", kind:"concept",
  stem:"행정소송법상 소의 종류의 변경에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 청구의 기초에 변경이 없어야 한다.\nㄴ. 사실심의 변론개시전까지 신청하여야 한다.\nㄷ. 법원은 결정으로써 소의 변경을 허가할 수 있다.\nㄹ. 피고의 변경이 있는 경우 새로운 피고에 대한 소송은 소변경 신청이 있은 때에 제기된 것으로 본다.",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],
  answer:2, status:"clear", note:"" },
{ id:"hs2016-79", subject:"행정소송법", year:2016, no:79, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송에 대한 대법원판결에 의하여 소득세법시행규칙이 헌법 또는 법률에 위반된다는 것이 확정된 경우, 행정소송법상 대법원이 이를 통보해야 하는 기관은?",
  choices:["법무부장관","법제처장","국세청장","기획재정부장관","행정자치부장관"],
  answer:5, status:"clear", note:"" },
{ id:"hs2016-80", subject:"행정소송법", year:2016, no:80, law:"행정소송법", unit:"처분성", kind:"concept",

{ id:"hg2017-1", subject:"회계학개론", year:2017, no:1, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무는 20×1년 초 친환경 영업용 차량(내용연수 5년, 잔존가치 ￦0)을 공정가치 ￦10,000,000에 취득하면서, 자산취득에 따른 정부보조금으로 ￦5,000,000을 수취하였다. 동 차량을 중도처분할 경우 내용연수 미사용 기간에 비례하여 정부보조금 잔액을 즉시 상환한다. 감가상각방법은 정액법(월할상각)을 적용하였으며, 20×3년도 7월 1일에 동 자산을 ￦4,000,000에 처분하였다. 자산관련 정부보조금의 표시방법으로 장부금액에서 차감 표시하는 방법을 사용할 때, 동 차량의 회계처리에 관한 설명으로 옳지 않은 것은?",
  choices:["20×1년 말 차량의 장부금액은 ￦4,000,000이다.","20×2년 말 정부보조금 잔액은 ￦3,000,000이다.","20×2년도의 동 차량과 관련하여 인식할 당기손익은 (-)￦2,000,000이다.","20×3년 처분에 따른 유형자산처분이익은 ￦1,500,000이다.","20×3년 정부보조금 상환금액은 ￦2,500,000이다."],
  answer:3, status:"clear", note:"" },
{ id:"hg2017-2", subject:"회계학개론", year:2017, no:2, law:"회계학개론", unit:"금융자산", kind:"concept",
  stem:"금융자산의 손상에 관한 설명으로 옳지 않은 것은?",
  choices:["금융자산이 손상되었다는 객관적인 증거가 있으며, 그 손상사건이 신뢰성 있게 추정할 수 있는 금융자산의 유효이자율에 영향을 미친 경우에 당해 금융자산은 손상된 것이다.","미래 사건의 결과로 예상되는 손상차손은 아무리 발생가능성이 높다 하더라도 인식하지 아니한다.","지분상품의 공정가치가 원가 이하로 유의적으로 또는 지속적으로 하락하는 경우는 손상이 발생하였다는 객관적인 증거가 된다.","금융상품이 더 이상 공개적으로 거래되지 않아 활성시장이 소멸하더라도 그것이 반드시 손상의 증거가 되는 것은 아니다.","이자지급이나 원금상환의 불이행이나 지연과 같은 계약 위반 등은 금융자산이 손상되었다는 객관적인 증거가 된다."],
  answer:1, status:"clear", note:"" },

{ id:"hg2017-5", subject:"회계학개론", year:2017, no:5, law:"회계학개론", unit:"충당부채", kind:"concept",
  stem:"충당부채의 변동과 변제에 관한 설명으로 옳지 않은 것은?",
  choices:["어떤 의무를 제삼자와 연대하여 부담하는 경우에 이행하여야 하는 전체 의무 중에서 제삼자가 이행할 것으로 예상되는 정도까지만 충당부채로 처리한다.","의무를 이행하기 위하여 경제적 효익이 있는 자원을 유출할 가능성이 높지 않게 된 경우에는 관련 충당부채를 환입한다.","충당부채를 현재가치로 평가하여 표시하는 경우에는 장부금액을 기간 경과에 따라 증액하고 해당 증가 금액은 차입원가로 인식한다.","충당부채를 결제하기 위하여 필요한 지출액의 일부나 전부를 제삼자가 변제할 것으로 예상되는 경우에는 기업이 의무를 이행한다면 변제를 받을 것이 거의 확실하게 되는 때에만 변제금액을 별도의 자산으로 인식하고 회계처리한다.","보고기간 말마다 충당부채의 잔액을 검토하고, 보고기간 말 현재 최선의 추정치를 반영하여 조정한다."],
  answer:1, status:"clear", note:"" },
{ id:"hg2017-6", subject:"회계학개론", year:2017, no:6, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"중간재무보고에 관한 설명으로 옳지 않은 것은?",
  choices:["직전 연차재무보고서를 연결기준으로 작성하였다면 중간재무보고서도 연결기준으로 작성해야 한다. 연차보고기간말에 연결재무제표를 작성할 때에 자세하게 조정되는 일부 내부거래 잔액은 중간보고기간말에 연결재무제표를 작성할 때는 덜 자세하게 조정될 수 있다.","중간재무보고서는 당해 중간보고기간말과 직전 연차보고기간말을 비교하는 형식으로 작성한 재무상태표, 당해 중간기간과 당해 회계연도 누적기간을 직전 회계연도의 동일기간과 비교하는 형식으로 작성한 포괄손익계산서, 당해 회계연도 누적기간을 직전 회계연도의 동일기간과 비교하는 형식으로 작성한 자본변동표와 현금흐름표를 포함한다.","계절적, 주기적 또는 일시적으로 발생하는 수익은 연차보고기간말에 미리 예측하여 인식하거나 이연하는 것이 적절하지 않은 경우 중간보고기간말에도 미리 예측하여 인식하거나 이연하여서는 아니된다. 배당수익, 로열티수익 및 정부보조금 등이 예이다.","중간재무보고서를 작성할 때 인식, 측정, 분류 및 공시와 관련된 중요성의 판단은 연차재무보고서의 재무자료에 근거하여 이루어져야 한다. 중요성을 평가하는 과정에서 중간기간의 측정은 연차재무자료의 측정에 비하여 추정에 의존하는 정도가 크다는 점을 고려하여야 한다.","중간기간의 법인세비용은 기대총연간이익에 적용될 수 있는 법인세율, 즉 추정평균연간유효법인세율을 중간기간의 세전이익에 적용하여 계산한다. 세무상결손금의 소급공제 혜택은 관련 세무상결손금이 발생한 중간기간에 반영한다."],
  answer:4, status:"clear", note:"" },
{ id:"hg2017-7", subject:"회계학개론", year:2017, no:7, law:"회계학개론", unit:"재고자산", kind:"calc",

{ id:"hg2017-8", subject:"회계학개론", year:2017, no:8, law:"회계학개론", unit:"재고자산", kind:"calc",
  stem:"(주)세무의 20×1년 재고자산 관련 현황이 다음과 같을 때, 20×1년 말 재무상태표의 재고자산은?\n○ 20×1년 말 재고실사를 한 결과 (주)세무의 창고에 보관 중인 재고자산의 원가는 ￦100,000이다.\n○ 20×1년도 중 고객에게 원가 ￦80,000 상당의 시송품을 인도하였으나, 기말 현재까지 매입의사를 표시하지 않았다.\n○ 20×1년도 중 운영자금 차입목적으로 은행에 원가 ￦80,000의 재고자산을 담보로 인도하였으며, 해당 재고자산은 재고실사 목록에 포함되지 않았다.\n○ (주)한국과 위탁판매계약을 체결하고 20×1년도 중 원가 ￦100,000 상당의 재고자산을 (주)한국으로 운송하였으며, 이 중 기말 현재 미판매되어 (주)한국이 보유하고 있는 재고자산의 원가는 ￦40,000이다.\n○ (주)대한으로부터 원가 ￦65,000의 재고자산을 도착지인도조건으로 매입하였으나 20×1년 말 현재 운송중이다.",
  choices:["￦220,000","￦260,000","￦300,000","￦320,000","￦365,000"],
  answer:3, status:"clear", note:"" },

{ id:"hg2017-11", subject:"회계학개론", year:2017, no:11, law:"회계학개론", unit:"수익인식", kind:"calc",
  stem:"(주)세무는 20×1년 초 (주)한국과 건설계약(공사기간 4년, 계약금액 ￦2,000,000)을 체결하였으며, 관련 자료는 다음과 같다.\n20×1년 / 20×2년 / 20×3년 / 20×4년\n누적발생계약원가 ￦280,000 / ￦960,000 / ￦1,280,000 / ￦1,600,000\n추정총계약원가 1,400,000 / 1,600,000 / 1,600,000 / 1,600,000\n(주)세무는 20×1년에 건설계약의 결과를 신뢰성 있게 추정하였으나, 20×2년 초부터 시작된 (주)한국의 재무상태 악화로 20×2년에 건설계약의 결과를 신뢰성 있게 추정할 수 없게 되었고 계약금액 중 보험에 가입된 ￦800,000만 회수할 수 있다고 판단하였다. 하지만 20×3년 초 (주)한국의 재무상태가 다시 정상화됨에 따라 계약금액 전액을 회수할 수 있다면, (주)세무가 20×1년, 20×2년 및 20×3년에 인식할 공사손익은? (단, (주)세무는 진행기준으로 수익을 인식하고 진행률은 누적발생계약원가를 추정총계약원가로 나눈 비율로 측정한다.)",
  choices:["￦120,000 이익 / ￦280,000 손실 / ￦480,000 이익","￦120,000 이익 / ￦120,000 손실 / ￦320,000 이익","￦120,000 이익 / ￦0 / ￦200,000 이익","￦120,000 이익 / ￦120,000 이익 / ￦80,000 이익","￦0 / ￦0 / ￦320,000 이익"],

{ id:"hg2017-12", subject:"회계학개론", year:2017, no:12, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"재무정보의 질적 특성에 관한 설명으로 옳지 않은 것은?",
  choices:["유용한 재무정보의 근본적 질적 특성은 목적적합성과 표현충실성이다. 유용한 재무정보의 질적 특성은 재무제표에서 제공되는 재무정보에도 적용되며, 그 밖의 방법으로 제공되는 재무정보에도 적용된다.","비교가능성, 검증가능성, 적시성 및 이해가능성은 목적적합하고 충실하게 표현된 정보의 유용성을 보강시키는 질적 특성이다. 보강적 질적 특성을 적용하는 것은 어떤 규정된 순서를 따르지 않는 반복적인 과정이다. 때로는 하나의 보강적 질적 특성이 다른 질적 특성의 극대화를 위해 감소되어야 할 수도 있다.","검증가능성은 합리적인 판단력이 있고 독립적인 서로 다른 관찰자가 어떤 서술이 표현충실성이라는 데, 비록 반드시 완전히 일치하지는 못하더라도, 의견이 일치할 수 있다는 것을 의미한다. 계량화된 정보가 검증가능하기 위해서 단일 점 추정치이어야 한다.","표현충실성은 모든 면에서 정확한 것을 의미하지는 않는다. 오류가 없다는 것은 현상의 기술에 오류나 누락이 없고, 보고 정보를 생산하는 데 사용되는 절차의 선택과 적용 시 절차 상 오류가 없음을 의미한다. 이 맥락에서 오류가 없다는 것은 모든 면에서 완벽하게 정확하다는 것을 의미하지는 않는다.","목적적합한 재무정보는 정보이용자의 의사결정에 차이가 나도록 할 수 있다. 재무정보에 예측가치, 확인가치 또는 이 둘 모두가 있다면 그 재무정보는 의사결정에 차이가 나도록 할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hg2017-13", subject:"회계학개론", year:2017, no:13, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무는 20×1년 초 토지를 ￦1,000,000에 취득하여 영업활동에 사용해 오던 중 20×4년 초에 동 토지를 ￦1,150,000에 처분하였다. 취득 후 각 보고기간 말 토지의 공정가치가 다음과 같을 때, 토지의 처분과 관련하여 20×4년도 포괄손익계산서에 인식해야 할 당기손익과 기타포괄손익은? (단, (주)세무는 취득시점부터 동 토지에 대해 재평가모형을 매년 적용하고 있으며, 토지와 관련하여 자본에 계상된 재평가잉여금은 토지를 제거할 때 이익잉여금으로 대체하는 회계처리를 한다.)\n20×1년 말 ￦1,100,000 / 20×2년 말 ￦900,000 / 20×3년 말 ￦1,200,000",
  choices:["당기손익 ￦50,000 이익 / 기타포괄손익 ￦0","당기손익 ￦50,000 이익 / 기타포괄손익 ￦200,000 손실","당기손익 ￦0 / 기타포괄손익 ￦150,000 손실","당기손익 ￦50,000 손실 / 기타포괄손익 ￦0","당기손익 ￦50,000 손실 / 기타포괄손익 ￦200,000 손실"],

{ id:"hg2017-14", subject:"회계학개론", year:2017, no:14, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무와 (주)한국은 20×1년 초에 모든 조건이 동일한 영업용 차량(내용연수 4년, 잔존가치 ￦500,000)을 ￦9,000,000에 각각 취득하였다. 두 회사가 동 차량에 대하여 각 보고기간별로 다음과 같이 감가상각방법을 적용하던 중, 두 회사 모두 20×4년 초 현금 ￦3,000,000에 동 차량을 매각하였다.\n20×1년 / 20×2년 / 20×3년\n(주)세무: 정률법 / 정률법 / 정액법\n(주)한국: 정액법 / 연수합계법 / 연수합계법\n두 회사의 총수익 및 동 차량에서 발생한 감가상각비를 제외한 총비용이 동일하다고 가정할 경우 옳은 설명은? (단, (주)세무와 (주)한국은 동 차량에 대해 원가모형을 적용하고 있으며, 정률법 상각률은 55%이다.)",
  choices:["20×1년도 당기순이익은 (주)한국이 더 작다.","20×4년 초에 인식하는 유형자산처분이익은 (주)세무가 더 크다.","(주)세무의 20×2년도 감가상각비는 ￦4,675,000이다.","(주)한국의 20×3년 말 차량 장부금액은 ￦1,145,833이다.","(주)세무의 20×3년도 감가상각비는 ￦330,625이다."],
  answer:2, status:"clear", note:"" },
{ id:"hg2017-15", subject:"회계학개론", year:2017, no:15, law:"회계학개론", unit:"사업결합·연결", kind:"calc",
  stem:"(주)세무는 20×1년 초에 (주)한국의 주식 25%를 ￦1,000,000에 취득하면서 유의적인 영향력을 행사할 수 있게 되었다. 취득일 현재 (주)한국의 순자산 장부금액은 ￦4,000,000이며, 자산 및 부채의 장부금액은 공정가치와 동일하다. (주)한국은 20×1년도 총포괄이익 ￦900,000(기타포괄이익 ￦100,000 포함)을 보고하였다. (주)세무가 20×1년 중에 (주)한국으로부터 중간배당금 ￦60,000을 수취하였다면, (주)세무가 20×1년도 당기손익으로 인식할 지분법이익은?",

{ id:"hg2017-16", subject:"회계학개론", year:2017, no:16, law:"회계학개론", unit:"재무회계개념체계", kind:"calc",
  stem:"(주)세무의 20×1년 중 자본 관련 자료가 다음과 같을 때, 20×1년도 자본 증가액은? (단, (주)세무는 주당 액면금액이 ￦1,000인 보통주만을 발행하고 있다.)\n○ 2월 1일: 보통주 200주를 주당 ￦1,500에 유상증자\n○ 3월 31일: 자기주식 50주를 주당 ￦1,000에 취득\n○ 5월 10일: 3월 31일에 취득한 자기주식 중 20주를 소각\n○ 7월 1일: 상장기업 A사 주식 150주를 주당 ￦1,500에 취득하여 매도가능금융자산으로 분류\n○ 8월 25일: 보통주 50주를 무상감자\n○ 9월 1일: 보통주 100주를 주당 ￦800에 유상감자\n○ 12월 31일: 상장기업 A사 주식 공정가치 주당 ￦1,200",

{ id:"hg2017-17", subject:"회계학개론", year:2017, no:17, law:"회계학개론", unit:"주당이익", kind:"calc",
  stem:"(주)세무의 20×1년 초 유통보통주식수는 15,000주였다. 20×1년 중 보통주식수의 변동내역이 다음과 같다면, 20×1년도 기본주당이익 계산을 위한 가중평균유통보통주식수는? (단, 가중평균유통보통주식수는 월할계산한다.)\n○ 2월 1일: 유상증자(발행가격: 공정가치) 20%\n○ 7월 1일: 주식배당 10%\n○ 9월 1일: 자기주식 취득 1,800주\n○ 10월 1일: 자기주식 소각 600주\n○ 11월 1일: 자기주식 재발행 900주",

{ id:"hg2017-18", subject:"회계학개론", year:2017, no:18, law:"회계학개론", unit:"종업원급여", kind:"calc",

{ id:"hg2017-19", subject:"회계학개론", year:2017, no:19, law:"회계학개론", unit:"재고자산", kind:"calc",
  stem:"(주)세무의 20×1년도 및 20×2년도 상품 관련 자료는 다음과 같다.\n○ 20×1년도 기말재고자산: ￦4,000,000(단위당 원가 ￦1,000)\n○ 20×2년도 매입액: ￦11,500,000(단위당 원가 ￦1,250)\n○ 20×2년도 매출액: ￦15,000,000\n20×2년 말 장부상 상품수량은 4,000개였으나, 실지재고조사 결과 기말수량은 3,500개로 확인되었다. 20×2년 말 현재 보유하고 있는 상품의 예상 판매가격은 단위당 ￦1,500이며, 단위당 ￦300의 판매비용이 예상된다. (주)세무가 선입선출법을 적용할 때, 20×2년도에 인식할 당기손익은?",
  choices:["￦3,000,000 이익","￦3,700,000 이익","￦3,875,000 이익","￦4,300,000 이익","￦4,500,000 이익"],
  answer:2, status:"clear", note:"" },
{ id:"hg2017-20", subject:"회계학개론", year:2017, no:20, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"특수관계자공시에 관한 설명으로 옳지 않은 것은?",
  choices:["지배기업과 종속기업 간의 관계는 거래유무에 관계없이 공시한다. 기업은 지배기업의 명칭을 공시한다.","연결실체 내 다른 기업들과의 특수관계자거래와 채권·채무 잔액은 기업의 재무제표에 공시한다. 투자기업과, 공정가치로 측정하여 당기손익에 반영하는 그 종속기업 간을 제외하고 연결실체 내 기업 간 특수관계자거래와 채권·채무 잔액은 그 연결실체의 연결재무제표를 작성할 때 제거된다.","보고기업에 유의적인 영향력이 있는 개인이나 그 개인의 가까운 가족은 보고기업의 특수관계자로 본다. 이 때 개인의 가까운 가족의 범위는 자녀 및 배우자로 한정한다.","주요 경영진에 대한 보상의 총액과 분류별 금액을 공시한다. 분류별 금액에는 단기종업원급여, 퇴직급여, 기타 장기급여, 해고급여, 주식기준보상이 해당된다.","특수관계는 기업의 당기순손익과 재무상태에 영향을 미칠 수 있다. 또한 특수관계자거래가 없더라도 특수관계 자체가 기업의 당기순손익과 재무상태에 영향을 줄 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hg2017-21", subject:"회계학개론", year:2017, no:21, law:"회계학개론", unit:"재무회계개념체계", kind:"calc",
  stem:"(주)세무는 (가)~(바) 영업부문을 가지고 있으며, 부문수익(내부 및 외부) 및 부문당기손익과 부문자산의 내역은 다음과 같다.\n부문 / 부문수익 / 부문당기이익(손실) / 부문자산\n가 ￦360,000 / ￦20,000 / ￦324,000\n나 250,000 / 10,000 / 261,000\n다 90,000 / (10,000) / 81,000\n라 120,000 / (5,000) / 81,000\n마 130,000 / 4,000 / 99,000\n바 50,000 / 6,000 / 54,000\n합계 ￦1,000,000 / ￦25,000 / ￦900,000\n양적기준에 따라 (주)세무가 영업부문에 대한 정보를 별도로 보고해야 하는 부문으로 옳은 것들로만 모두 고른 것은? (단, 영업부문에 대한 정보를 별도로 보고하기 위한 다른 기준들은 모두 충족된다고 가정한다.)",
  choices:["가, 나","가, 나, 마, 바","나, 다, 라, 마","가, 나, 다, 라, 바","가, 나, 다, 라, 마, 바"],
  answer:5, status:"clear", note:"" },
{ id:"hg2017-22", subject:"회계학개론", year:2017, no:22, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"재무제표 표시에 관한 설명으로 옳지 않은 것은?",
  choices:["기업은 비용의 성격별 또는 기능별 분류방법 중에서 신뢰성 있고 더욱 목적적합한 정보를 제공할 수 있는 방법을 적용하여 당기손익으로 인식한 비용의 분석내용을 표시한다.","상법 등 관련 법규에서 이익잉여금처분계산서의 작성을 요구하는 경우에는 재무상태표의 이익잉여금에 대한 보충정보로서 이익잉여금처분계산서를 주석으로 공시한다.","영업이익에 포함되지 않은 항목 중 기업의 영업성과를 반영하는 그 밖의 수익 또는 비용 항목이 있다면 이러한 항목을 추가하여 조정영업이익 등의 명칭을 사용하여 주석으로 공시할 수 있다.","이익의 분배에 대해 서로 다른 권리를 가지는 보통주 종류별로 이에 대한 기본주당이익과 희석주당이익을 포괄손익계산서에 표시한다. 그러나 기본주당이익과 희석주당이익이 부의 금액(즉, 주당손실)인 경우에는 표시하지 않는다.","기업이 상당 기간 계속 사업이익을 보고하였고, 보고기간말 현재 경영에 필요한 재무자원을 확보하고 있는 경우에는 자세한 분석이 없이도 계속기업을 전제로 한 회계처리가 적절하다는 결론을 내릴 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hg2017-23", subject:"회계학개론", year:2017, no:23, law:"회계학개론", unit:"현금흐름표", kind:"calc",
  stem:"(주)세무의 현금흐름표 작성을 위한 20×1년 자료가 다음과 같을 때, (주)세무의 20×1년도 투자활동순현금흐름과 재무활동순현금흐름은? (단, (주)세무는 이자의 지급, 이자 및 배당금의 수입은 영업활동으로, 배당금의 지급은 재무활동으로 분류하고 있다.)\n○ 유상증자로 ￦250,000, 장기차입금으로 ￦300,000을 조달하였다.\n○ 20×1년 초 매출채권 잔액은 ￦300,000이었고, 여기에 대손충당금 잔액이 ￦20,000 설정되어 있다. 20×1년 말 매출채권 잔액은 ￦500,000이며, 대손추정을 통하여 기말 대손충당금 잔액이 ￦50,000으로 증가하였다.\n○ 20×0년 경영성과에 대해 20×1년 3월 주주총회 결의를 통해 주주들에게 배당금으로 ￦200,000을 지급하였다.\n○ 기초와 기말의 법인세 부채는 각각 ￦300,000과 ￦400,000이었다.\n○ 당기에 유형자산을 총원가 ￦1,500,000에 취득하였으며, 이 중에서 ￦900,000은 금융리스로 취득하였다. 나머지 ￦600,000은 현금으로 지급하였다. 금융리스부채의 상환은 20×2년 초부터 이루어진다.\n○ 취득원가가 ￦800,000이고 감가상각누계액이 ￦500,000인 공장 설비를 현금매각하고, 유형자산처분이익 ￦100,000을 인식하였다.",
  choices:["투자활동 ￦200,000 유출 / 재무활동 ￦350,000 유입","투자활동 ￦200,000 유출 / 재무활동 ￦550,000 유입","투자활동 ￦400,000 유입 / 재무활동 ￦200,000 유출","투자활동 ￦600,000 유출 / 재무활동 ￦350,000 유입","투자활동 ￦600,000 유출 / 재무활동 ￦550,000 유입"],
  answer:1, status:"clear", note:"" },
{ id:"hg2017-24", subject:"회계학개론", year:2017, no:24, law:"회계학개론", unit:"재고자산", kind:"calc",
  stem:"(주)세무의 20×1년도 회계자료가 다음과 같을 때, 20×1년의 재고자산평균보유기간은? (단, 재고자산회전율 계산 시 평균재고자산을 사용하며, 1년은 360일로 가정한다.)\n○ 매출총이익: ￦106,000 ○ 당기 현금매출액: ￦45,000 ○ 기초 매출채권: ￦60,000\n○ 기말 매출채권: ￦105,000 ○ 당기 매출채권 회수액: ￦250,000 ○ 기초 상품재고: ￦150,000 ○ 당기 상품매입액: ￦194,000",
  choices:["200일","210일","220일","230일","240일"],
  answer:1, status:"clear", note:"" },
{ id:"hg2017-25", subject:"회계학개론", year:2017, no:25, law:"회계학개론", unit:"사업결합·연결", kind:"concept",
  stem:"사업결합의 회계처리에 관한 설명으로 옳지 않은 것은?",
  choices:["이전한 자산이나 부채가 사업결합을 한 후에도 결합기업에 여전히 남아 있고, 취득자가 그 자산이나 부채를 계속 통제하는 경우에는, 취득자는 그 자산과 부채를 취득일의 공정가치로 측정하고, 그 자산과 부채에 대한 차손익을 당기손익으로 인식한다.","취득자가 피취득자에 대한 지배력을 획득한 날은 일반적으로 취득자가 법적으로 대가를 이전하여, 피취득자의 자산을 취득하고 부채를 인수한 날인 종료일이다. 그러나 취득자는 종료일보다 이른 날 또는 늦은 날에 지배력을 획득하는 경우도 있다.","취득자와 피취득자가 지분만을 교환하여 사업결합을 하는 경우에 취득일에 피취득자 지분의 공정가치가 취득자 지분의 공정가치보다 더 신뢰성 있게 측정되는 경우가 있다. 이 경우에 취득자는 이전한 지분의 취득일 공정가치 대신에 피취득자 지분의 취득일 공정가치를 사용하여 영업권의 금액을 산정한다.","과거사건에서 생긴 현재의무이고 그 공정가치를 신뢰성 있게 측정할 수 있다면, 해당 의무를 이행하기 위하여 경제적 효익이 있는 자원이 유출될 가능성이 높지 않더라도 취득자는 취득일에 사업결합으로 인수한 우발부채를 인식한다.","공정가치로 측정한 보상자산의 경우에 회수 가능성으로 인한 미래현금흐름의 불확실성 영향을 공정가치 측정에 포함하였으므로 별도의 평가충당금은 필요하지 않다."],
  answer:1, status:"clear", note:"" },
{ id:"hg2017-26", subject:"회계학개론", year:2017, no:26, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무의 지난 6개월간 기계가동시간과 기계수선비에 대한 자료는 다음과 같다. (주)세무가 고저점법을 사용하여 7월의 기계수선비를 ￦2,019,800으로 추정하였다면, 예상 기계가동시간은? (단, 기계수선비의 원가동인은 기계가동시간이다.)\n월 / 기계가동시간 / 기계수선비\n1 / 3,410시간 / ￦2,241,000\n2 / 2,430 / 1,741,000\n3 / 3,150 / 1,827,000\n4 / 3,630 / 2,149,000\n5 / 2,800 / 2,192,500\n6 / 2,480 / 1,870,000",

  answer:3, status:"clear", note:"" },
{ id:"hg2017-27", subject:"회계학개론", year:2017, no:27, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 주문을 받고 생산하여 판매하는 기업이다. 단위당 직접재료원가 ￦6,200, 단위당 변동 가공원가(전환원가) ￦11,800이며 연간 고정제조간접원가는 ￦4,200,000이다. 20×0년도에 280개를 주문 받아 판매하였으며, 매출총이익률은 25%였다. 판매가격과 원가구조가 20×0년과 동일하다면 20×1년도에 ￦1,000,000 이상의 매출총이익을 얻기 위한 최소 판매량은?",
  choices:["160개","170개","180개","190개","200개"],
  answer:5, status:"clear", note:"" },
{ id:"hg2017-28", subject:"회계학개론", year:2017, no:28, law:"회계학개론", unit:"결합원가계산", kind:"calc",
  stem:"(주)세무는 결합원가 ￦15,000으로 제품 A와 제품 B를 생산한다. 제품 A와 제품 B는 각각 ￦7,000과 ￦3,000의 추가 가공원가(전환원가)를 투입하여 판매된다. 순실현가치법을 사용하여 결합원가를 배분하면 제품 B의 총제조원가는 ￦6,000이며 매출총이익률은 20%이다. 제품 A의 매출총이익률은?",
  choices:["23%","24%","25%","26%","27%"],

{ id:"hg2017-29", subject:"회계학개론", year:2017, no:29, law:"회계학개론", unit:"표준원가계산", kind:"calc",
  stem:"표준원가를 사용하는 (주)세무의 20×1년 직접노무원가에 대한 자료가 다음과 같을 때, 20×1년 예상 제품생산량은?\n직접노무원가 고정예산 ￦896,400 / 직접노무원가 실제발생액 ￦1,166,400\n단위당 표준 직접노무시간 83시간 / 단위당 실제 직접노무시간 81시간\n실제 제품생산량 300개 / 임률차이 ￦437,400(불리)",
  choices:["300개","350개","360개","400개","450개"],
  answer:3, status:"clear", note:"" },
{ id:"hg2017-30", subject:"회계학개론", year:2017, no:30, law:"회계학개론", unit:"전부원가·변동원가계산", kind:"calc",
  stem:"다음은 (주)세무의 공헌이익 손익계산서와 전부원가 손익계산서이다. 고정판매관리비가 ￦94,000이고 제품의 판매가격이 단위당 ￦1,500일 때, 전부원가계산에 의한 기말제품재고는? (단, 기초 및 기말재공품, 기초제품은 없다.)\n공헌이익 손익계산서: 매출액 ￦1,200,000 / 변동원가 456,000 / 공헌이익 744,000 / 고정원가 766,000 / 영업이익(손실) (22,000)\n전부원가 손익계산서: 매출액 ￦1,200,000 / 매출원가 937,600 / 매출총이익 262,400 / 판매관리비 150,000 / 영업이익(손실) 112,400",
  choices:["￦154,000","￦171,300","￦192,000","￦214,500","￦234,400"],
  answer:5, status:"clear", note:"" },
{ id:"hg2017-31", subject:"회계학개론", year:2017, no:31, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 가공부문(도색 및 조립)과 보조부문(수선 및 동력)으로 구성된다. 다음의 서비스 공급량 자료를 이용하여 상호배부법으로 보조부문의 원가를 가공부문에 배부한다.\n보조부문(수선/동력) → 가공부문(도색/조립)\n수선: 도색 75시간 / 조립 45시간, (수선 자체) / 동력 30시간\n동력: 도색 200kw / 조립 100kw, / 동력 자체 200kw\n수선부문과 동력부문에 각각 집계된 원가는 ￦300,000과 ￦200,000이다. 가공부문에 배부된 원가는 도색 횟수와 조립시간에 비례하여 각각 제품 A와 제품 B에 전액 배부된다. 제품 A와 제품 B에 사용된 도색 횟수와 조립시간이 다음과 같을 때, 제품 B에 배부되는 보조부문의 총원가는?\n제품A: 도색횟수 10회 / 조립시간 200시간\n제품B: 도색횟수 13회 / 조립시간 100시간",
  choices:["￦210,000","￦220,000","￦240,000","￦250,000","￦280,000"],
  answer:2, status:"clear", note:"" },
{ id:"hg2017-32", subject:"회계학개론", year:2017, no:32, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 기존 제품에 추가하여 새로운 제품 F(단위당 변동제조원가 ￦34)를 생산·판매하려고 한다. 이 경우 기존 제품의 총공헌이익이 연간 ￦80,000 감소할 것으로 예상된다. 제품 F를 생산하면, 연간 총고정제조간접원가 중 ￦55,000이 제품 F에 배부되며, 기존에 납부하던 연간 유휴토지부담금 ￦25,000이 전액 면제된다. 제품 F를 판매할 경우, 판매 대리점에 지급하는 기존 제품에 대한 연간 고정판매비를 ￦35,000만큼 줄이는 대신에 제품 F의 판매비를 단위당 ￦4씩 지급하게 된다. 제품 F의 연간 판매량이 4,000단위로 예상될 때, (주)세무의 연간 총손익에 변화가 없으려면 제품 F의 단위당 판매가격은?",
  choices:["￦13","￦23","￦35","￦43","￦55"],
  answer:4, status:"clear", note:"" },
{ id:"hg2017-33", subject:"회계학개론", year:2017, no:33, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"concept",
  stem:"(주)세무는 흠집이 있는 제품 C를 5개 보유하고 있다. 흠집이 없는 정상적 제품 C의 판매가격은 ￦300이다. 제품 C의 생산에는 단위당 변동제조원가 ￦80과 단위당 고정제조원가 ￦20이 투입되었다. 흠집이 있는 제품 C를 외부에 단위당 ￦150에 처분하려면 단위당 판매관리비가 ￦12이 소요될 것으로 추정된다. 이 의사결정에 고려될 관련 항목은?",
  choices:["단위당 판매관리비 ￦12","단위당 변동제조원가 ￦80","단위당 고정제조원가 ￦20","단위당 제조원가 ￦100","정상 판매가격 ￦300"],
  answer:1, status:"clear", note:"" },
{ id:"hg2017-34", subject:"회계학개론", year:2017, no:34, law:"회계학개론", unit:"종합원가계산", kind:"calc",
  stem:"(주)세무는 가중평균법을 적용한 종합원가계산으로 제품원가를 계산한다. 기말재공품의 물량은 8,000단위이고, 직접재료원가 완성도는 70%이며 가공원가(전환원가) 완성도는 75%이다. 기말재공품의 원가가 ￦220,000이고 완성품 환산량 단위당 직접재료원가가 ￦20이라면, 완성품 환산량 단위당 가공원가(전환원가)는?",

  choices:["당사자소송을 항고소송으로 변경할 수 있다.","변경의 대상이 되는 소는 사실심변론종결 전이어야 한다.","소의 변경을 허가하는 결정에 대하여는 즉시항고할 수 있다.","소의 변경을 허가하는 결정이 확정되면 새로운 소는 제소기간과 관련하여 원칙적으로 소가 변경된 때에 제기된 것으로 본다.","피고의 변경이 있는 경우 종전의 피고에 대한 소송은 취하된 것으로 본다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2017-54", subject:"행정소송법", year:2017, no:54, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송법상 각종 시점에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["소송요건은 사실심변론종결시는 물론 상고심에서도 존속하여야 한다.","처분사유의 추가·변경은 사실심변론종결시까지 허용된다.","처분의 변경으로 인한 소의 변경 시 그 변경이 있음을 안 날로부터 60일 이내에 소의 변경을 신청하여야 한다.","처분 당시의 사실상태에 대한 입증은 사실심변론종결시까지 할 수 있다.","집행정지결정의 효력은 정지결정의 대상인 처분의 발령시점에 소급한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2017-55", subject:"행정소송법", year:2017, no:55, law:"행정소송법", unit:"사정판결", kind:"concept",
  stem:"<보기>와 같은 판결 주문에 관한 설명으로 옳지 않은 것은?\n<보기> 주문\n1. 원고의 청구를 기각한다.\n2. 다만, 피고가 2017. 2. 1. 원고에 대하여 한 OO처분은 위법하다.\n3. 소송비용은 피고의 부담으로 한다.",
  choices:["취소소송의 경우에는 허용되나 무효확인소송의 경우에는 허용되지 않는다.","법원은〈보기〉와 같은 판결을 함에 있어서 사실심변론종결시를 기준으로 하여 공익성 판단을 하여야 한다.","원고가 손해배상청구를 병합하지 않은 경우에 법원이〈보기〉와 같은 판결을 함에 있어 그로 인하여 원고가 입게 될 손해의 정도와 배상방법 그 밖의 사정을 미리 조사하여야 하는 것은 아니다.","당사자의 명백한 주장이 없는 경우에도 법원은 기록에 나타난 여러 사정을 기초로 하여 직권으로〈보기〉와 같은 판결을 할 수 있다.","원고가 적당한 구제방법의 청구를 간과하였음이 분명하다면, 법원은 적절하게 석명권을 행사하여 그에 관한 의견을 진술할 수 있는 기회를 주어야 한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2017-56", subject:"행정소송법", year:2017, no:56, law:"행정소송법", unit:"소송참가", kind:"concept",
  stem:"소송참가에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["제3자의 소송참가를 위해 요구되는 이익에는 단순한 경제상의 이익도 포함된다.","제3자의 소송참가에서 제3자에 국가 또는 지방자치단체는 포함되지 아니한다.","부작위위법확인소송에서 제3자의 소송참가는 허용되지 아니한다.","행정청은「민사소송법」상 보조참가를 할 수 없고「행정소송법」상 행정청의 소송참가를 할 수 있을 뿐이다.","행정소송 사건에서 참가인이 한 보조참가는「행정소송법」상 제3자의 소송참가에 해당하지 않는다면「민사소송법」상 보조참가의 요건을 갖춘 경우라도 허용되지 아니한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2017-57", subject:"행정소송법", year:2017, no:57, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"취소판결의 기속력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["기속력에 위반되는 처분은 무효이다.","기속력은 인용판결과 기각판결에서는 인정되나 각하판결에서는 인정되지 않는다.","기속력은 판결의 주문뿐만 아니라 이유에서 판단된 처분의 구체적 위법사유에도 미친다.","취소판결이 처분의 절차상 위법을 이유로 하는 경우, 행정청이 적법한 절차를 밟아 동일한 내용의 처분을 하더라도 기속력에 반하지 않는다.","기본적 사실관계가 다르면, 처분 당시에 있었던 사유로 재처분하여도 기속력 위반은 아니다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2017-58", subject:"행정소송법", year:2017, no:58, law:"행정소송법", unit:"집행정지", kind:"concept",
  stem:"집행정지에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["본안이 계속중이라는 점에 대한 주장·소명책임은 원칙적으로 신청인에게 있다.","집행정지의 결정에 대한 즉시항고에는 결정의 집행을 정지하는 효력이 없다.","집행정지결정이 있은 후 본안소송이 취하된 경우, 법원은 집행정지결정을 취소하여야 한다.","집행정지의 결정이 확정된 후라 할지라도 법원은 집행정지가 공공복리에 중대한 영향을 미친다는 이유로 집행정지의 결정을 취소할 수 있다.","집행정지의 요건인 '회복하기 어려운 손해'에는 금전으로 보상할 수 없는 유형의 손해뿐만 아니라 무형의 손해도 포함된다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2017-59", subject:"행정소송법", year:2017, no:59, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"항고소송의 대상이 되는 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 세무조사결정\nㄴ. 토지대장을 직권으로 말소한 행위\nㄷ. 공정거래위원회의 고발조치\nㄹ. 「청소년 보호법」에 따른 청소년유해매체물 결정·고시",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],
  answer:4, status:"clear", note:"" },
{ id:"hs2017-60", subject:"행정소송법", year:2017, no:60, law:"행정소송법", unit:"부작위위법확인소송", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["부작위위법확인소송 중 피고가 원고의 해당 신청에 대해 거부처분을 한 경우라도 소의 이익이 상실되지 않는다.","원고에게 법규상 또는 조리상의 신청권이 있는지의 여부는 문제되지 않는다.","법원이 위법성 여부를 판단하는 기준시점은 처분시이다.","부작위위법확인소송에 대해서는 행정심판의 전치에 관한 규정이 준용되지 않는다.","인용판결이 확정되면 피고는 판결의 취지에 따라 이전의 신청에 대한 처분을 하여야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2017-61", subject:"행정소송법", year:2017, no:61, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"항고소송의 대상에 해당하지 않는 것은? (다툼이 있으면 판례에 따름)",
  choices:["개별공시지가결정","공정거래위원회의 '표준약관 사용권장행위'","「질서위반행위규제법」에 따른 행정청의 과태료 부과처분","과세처분 이후 감액경정처분이 있는 경우, 처음의 과세처분 중 감액경정처분에 의하여 취소되지 않고 남은 부분","과세처분 이후 증액경정처분이 있는 경우, 증액경정처분"],
  answer:3, status:"clear", note:"" },
{ id:"hs2017-62", subject:"행정소송법", year:2017, no:62, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"실질적 당사자소송에 해당하는 소송을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 지방자치단체가 보조사업자에 대해 지급한 보조금의 반환을 청구하는 소송\nㄴ. 지방소방공무원이 소속 지방자치단체를 상대로 초과근무수당의 지급을 청구하는 소송\nㄷ. 명예퇴직한 법관이 미지급 명예퇴직수당액의 지급을 청구하는 소송\nㄹ. 주택재건축정비사업조합을 상대로 사업시행계획의 인가·고시 전에 사업시행계획 결의의 효력을 다투는 소송",
  choices:["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"hs2017-63", subject:"행정소송법", year:2017, no:63, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"항고소송의 소의 이익이 인정되는 경우는? (다툼이 있으면 판례에 따름)",
  choices:["강학상 인가의 경우 기본행위의 하자를 이유로 인가처분의 취소를 구하는 소송","입주자가 건축물 사용검사처분의 취소를 구하는 소송","행정청이 공무원에 대하여 새로운 직위해제사유에 기한 직위해제처분을 한 경우, 그 이전 직위해제처분의 취소를 구하는 소송","사업양도계약의 무효를 주장하는 양도인이 지위승계신고 수리처분의 취소를 구하는 소송","치과의사국가시험 불합격처분 이후 새로 실시된 같은 국가시험에 합격한 자가 불합격처분의 취소를 구하는 소송"],
  answer:4, status:"clear", note:"" },
{ id:"hs2017-64", subject:"행정소송법", year:2017, no:64, law:"행정소송법", unit:"관련청구의 이송·병합", kind:"concept",
  stem:"행정소송법상 이송 및 병합에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분에 관련된 원상회복청구소송이 계속된 법원은 그 처분을 대상으로 한 취소소송이 계속된 법원으로 원상회복청구소송을 이송할 수 있다.","무효확인청구와 취소청구의 단순병합은 허용되지 아니한다.","법원은 관련청구소송의 이송을 당사자의 신청과 무관하게 직권으로는 할 수 없다.","취소소송에 부당이득반환청구가 병합된 경우에 부당이득반환청구가 인용되려면 취소판결이 확정되어야 하는 것은 아니다.","취소소송에는 피고 외의 자를 상대로 한 당해 처분등과 관련되는 취소소송을 병합하여 제기할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2017-65", subject:"행정소송법", year:2017, no:65, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"취소소송 심리의 일반원칙에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원이 원고가 취소를 청구하지도 않은 행정처분에 대하여 취소판결을 한 것은 처분권주의에 반하여 위법하다.","자유심증주의는 인정되지 아니한다.","서면심리주의를 원칙으로 한다.","법원이 소송절차를 직권으로 진행시키는 직권주의는 인정되지 아니한다.","공개주의는 원칙적으로 인정되지 아니한다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2017-66", subject:"행정소송법", year:2017, no:66, law:"행정소송법", unit:"행정소송 총칙", kind:"concept",
  stem:"행정소송법의 규정내용으로 옳지 않은 것은?",
  choices:["국가를 상대로 하는 당사자소송의 경우에는 가집행선고를 할 수 있다.","소송비용에 관한 재판이 확정된 때에는 피고였던 행정청이 소속하는 국가에 그 효력이 미친다.","수인의 청구 또는 수인에 대한 청구가 처분등의 취소청구와 관련되는 청구인 경우에 한하여 그 수인은 공동소송인이 될 수 있다.","'처분등'에는 행정심판에 대한 재결이 포함된다.","기관소송으로써 처분의 취소를 구하는 소송에는 그 성질에 반하지 아니하는 한 취소소송에 관한 규정을 준용한다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2017-67", subject:"행정소송법", year:2017, no:67, law:"행정소송법", unit:"제소기간", kind:"concept",
  stem:"항고소송의 제소기간에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["제소기간의 준수 여부는 소송요건으로서 법원의 직권조사사항이다.","처분의 무효를 주장하며 취소소송을 제기하는 경우 제소기간의 제한이 있다.","특정인에 대한 행정처분을 주소불명 등의 이유로 송달할 수 없어 관보 등에 공고한 경우에는 상대방이 당해 처분이 있었다는 사실을 현실적으로 안 날에 그 처분이 있음을 알았다고 보아야 한다.","고시 또는 공고에 의하여 불특정다수인을 대상으로 행정처분을 하는 경우에는 고시 또는 공고의 효력발생일에 그 행정처분이 있음을 알았다고 보아야 한다.","부작위위법확인소송은 그 특성상 행정심판을 거친 경우에도 제소기간의 제한을 받지 아니한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2017-68", subject:"행정소송법", year:2017, no:68, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 취소소송의 소의 이익이 부정되는 경우는?",
  choices:["「건축법」소정의 이격거리를 두지 않아 위법한 건축물의 공사가 완료된 이후 이웃주민이 건축허가처분의 취소를 구하는 경우","지방의회의원에 대한 제명의결 취소소송 중 그 의원의 임기가 만료된 경우","국립대학교 불합격처분에 대한 취소소송 중 당해 연도의 입학시기가 지난 경우","감봉처분이 있은 이후 자진퇴직하여 공무원의 신분이 상실된 자가 감봉처분을 다투는 경우","영치품에 대한 사용신청 불허처분 취소소송 중 다른 교도소로 이송된 경우"],
  answer:1, status:"clear", note:"" },
{ id:"hs2017-69", subject:"행정소송법", year:2017, no:69, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"행정심판기록의 제출명령에 관한「행정소송법」의 규정내용으로 옳지 않은 것은?",
  choices:["당사자는 법원에 제출명령을 신청할 수 있다.","법원은 직권으로 제출을 명할 수 있다.","공법상 당사자소송에 준용된다.","법원이 재결을 행한 행정청에 대하여 결정으로써 행한다.","제출명령을 받은 재결청은 지체없이 당해 행정심판에 관한 기록을 법원에 제출하여야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2017-70", subject:"행정소송법", year:2017, no:70, law:"행정소송법", unit:"당사자소송", kind:"concept",
  stem:"당사자소송의 재판에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["확인판결뿐만 아니라 이행판결도 가능하다.","확정판결은 자박력, 확정력, 기속력을 가진다.","세무서장을 피고로 하여 납세의무부존재확인을 구하는 경우에는 피고의 경정을 허가할 수 있다.","행정청의 처분을 대상으로 하지 않은 경우에는 각하판결을 하여야 한다.","당사자소송에 관련청구소송을 병합한 경우, 당사자소송이 부적법하여 각하되면 관련청구소송도 각하하여야 한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2017-71", subject:"행정소송법", year:2017, no:71, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"항고소송의 심리의 범위에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송에서 처분의 동일성 내에서 개개의 위법사유는 심리의 범위에 속한다.","처분의 부당 여부는 심리의 범위를 벗어난다.","취소소송에서 사정판결을 할 것인지의 여부는 심리의 대상에 포함되지 아니한다.","무효등확인소송에서는 처분의 존재 여부가 심리의 대상이 될 수 있다.","부작위위법확인소송에서 부작위의 위법 여부에서 더 나아가 신청에 따른 처분의무가 있는지는 심리의 범위에 포함되지 아니한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2017-72", subject:"행정소송법", year:2017, no:72, law:"행정소송법", unit:"판결 일반", kind:"concept",
  stem:"행정소송의 판결에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["피고 행정청이 없게 된 경우, 법원은 소송종료를 선언하여야 한다.","무효인 처분에 대해 취소소송이 제기된 경우, 법원은 취소판결을 할 수 있다.","행정청이 처분을 취소 또는 변경함으로 인하여 청구가 각하 또는 기각된 경우, 소송비용은 패소자인 원고의 부담으로 한다.","행정소송에 대한 대법원판결에 의하여 명령·규칙이 법률에 위반된다는 것이 확정된 경우, 대법원은 그 사유를 법무부장관에게 통보하여야 한다.","취소판결에 의하여 권리 또는 이익의 침해를 받은 제3자가 그 확정판결에 대해 재심을 청구할 경우, 확정판결이 있음을 안 날로부터 90일 이내, 판결이 확정된 날로부터 1년 이내에 제기하여야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2017-73", subject:"행정소송법", year:2017, no:73, law:"행정소송법", unit:"처분사유의 추가·변경", kind:"concept",
  stem:"처분사유의 추가·변경에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["추가·변경의 대상이 되는 처분사유는 처분시에 존재하던 사유이어야 한다.","이유제시의 하자의 치유는 처분시에 존재하는 하자가 사후에 보완되어 없어지게 된다는 점에서 처분사유의 추가·변경과 구별된다.","위법판단의 기준시와 관련하여 판결시설을 취하는 경우, 피고인 처분청은 소송계속중 처분 이후의 사실적·법적 상황을 주장할 수 있다.","처분사유의 추가·변경을 부정적으로 보는 입장은 원고의 방어권과 신뢰의 침해를 근거로 제시한다.","처분의 사실관계에 변경이 없는 경우, 처분의 근거법령만을 변경하는 것은 허용되지 않는다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2017-74", subject:"행정소송법", year:2017, no:74, law:"행정소송법", unit:"무효등확인소송", kind:"concept",
  stem:"甲은 과세관청으로부터 과세처분을 받고 일단 그 세액의 일부를 자진 납부하였으나, 그 과세처분은 그 전부가 무효의 것임이 판명되었다. 이에 甲은 과세관청에 대하여 환급신청을 하였으나 과세관청은 환급거부결정을 하였다. 甲이 환급거부결정을 대상으로 하여 취소소송을 제기한 경우, 법원이 하여야 하는 판결은? (다툼이 있으면 판례에 따름)",
  choices:["각하판결","취소판결","일부취소판결","일부무효확인판결","의무이행판결"],
  answer:1, status:"clear", note:"" },
{ id:"hs2017-75", subject:"행정소송법", year:2017, no:75, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"취소소송의 직권심리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 필요하다고 인정할 때에는 직권으로 증거조사를 할 수 있다.","취소소송의 직권심리에 관하여 규정하고 있는「행정소송법」제26조는 공법상 당사자소송에 준용된다.","법원은 기록상 자료가 나타나 있는 사항에 관해서는 당사자가 이를 주장하지 않았더라도 판단할 수 있다.","직권탐지주의설은 행정의 적법성 통제도 행정소송의 목적이라는 것을 강조한다.","처분청의 처분권한 유무는 직권조사사항이다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2017-76", subject:"행정소송법", year:2017, no:76, law:"행정소송법", unit:"판결의 효력", kind:"concept",
  stem:"과세처분에 대한 취소소송에서 판결의 기판력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["기판력은 사실심변론종결시를 기준으로 하여 발생한다.","기판력은 과세처분의 위법성 존부에 관한 판단에 미친다.","행정청을 피고로 하는 취소소송에 있어서의 기판력은 당해 과세처분이 귀속하는 국가 또는 지방자치단체에도 미친다.","전소에서 기각판결이 확정된 경우, 그 과세처분의 무효확인을 구하는 후소에는 기판력이 미치지 않는다.","전소의 확정판결의 존재를 원고가 후소의 사실심변론종결시까지 주장하지 않았더라도 후소의 상고심에서 새로이 이를 주장·입증할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2017-77", subject:"행정소송법", year:2017, no:77, law:"행정소송법", unit:"심리(직권심리·입증책임)", kind:"concept",
  stem:"항고소송에서 주장·입증책임에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["직권탐지주의 하에서 주장책임의 의미는 완화된다.","허가신청에 대하여 허가기준 미달을 이유로 불허가한 처분이 적법하다는 주장·입증책임은 처분청에게 있다.","과세대상이 된 토지가 비과세대상이라는 점에 대해서는 이를 주장하는 납세의무자에게 입증책임이 있다.","정보공개거부처분 취소소송에서 비공개사유의 주장·입증책임은 원고에게 있다.","무효확인소송에서 무효원인에 대한 주장·입증책임은 원고가 부담한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2017-78", subject:"행정소송법", year:2017, no:78, law:"행정소송법", unit:"간접강제", kind:"concept",
  stem:"간접강제에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["간접강제는 판결의 기속력과 관련된다.","거부처분에 대한 무효확인판결이 확정되었음에도 행정청이 아무런 처분을 하지 않는 경우, 간접강제가 허용된다.","거부처분에 대한 취소판결이 확정된 뒤 행정청이 재처분을 하였지만 그것이 취소판결의 기속력에 반하는 경우, 간접강제가 허용된다.","간접강제 신청은 제1심수소법원에 하여야 한다.","간접강제결정에서 정한 이행기간이 경과한 후에 재처분의무를 이행한 경우 처분상대방은 더 이상 배상금을 추심할 수 없다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2017-79", subject:"행정소송법", year:2017, no:79, law:"행정소송법", unit:"재판관할", kind:"concept",
  stem:"행정소송의 재판관할에 관한 설명으로 옳지 않은 것은?",
  choices:["국가의 사무를 위탁받은 공공단체를 피고로 하는 경우, 대법원의 소재지를 관할하는 행정법원은 관할법원이 아니다.","취소소송의 제1심 관할법원은 피고의 소재지를 관할하는 행정법원으로 한다.","특정의 장소에 관계되는 처분에 대한 취소소송은 그 장소의 소재지를 관할하는 행정법원에 이를 제기할 수 있다.","당사자소송의 피고가 국가 또는 공공단체인 경우, 관계행정청의 소재지를 관할하는 행정법원이 관할법원으로 된다.","당사자소송으로 서울행정법원에 제기할 것을 민사소송으로 지방법원에 제기하여 판결이 난 경우에는 전속관할 위반이라는 것이 판례의 입장이다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2017-80", subject:"행정소송법", year:2017, no:80, law:"행정소송법", unit:"행정심판전치주의", kind:"concept",
  stem:"행정소송법상 행정심판전치주의에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["지방세부과처분에 대한 이의신청 및 심사청구는 필요적 전치절차이다.","국세부과처분에 대하여 감사원에 심사청구를 한 자가 그 심사청구의 결정에 불복하는 경우에는 곧바로 행정소송을 제기할 수 있다.","행정심판전치주의는 무효확인소송에도 적용된다.","행정심판전치주의의 예외가 되는 사유는 피고가 이를 소명하여야 한다.","부적법한 행정심판청구가 있었음에도 재결청이 과오로 본안에 대하여 재결한 때에는 행정심판을 거친 것으로 보아야 한다."],
  answer:2, status:"clear", note:"" },

{ id:"hg2018-1", subject:"회계학개론", year:2018, no:1, law:"회계학개론", unit:"투자부동산", kind:"concept",
  stem:"투자부동산의 분류에 관한 설명으로 옳지 않은 것은?",
  choices:["통상적인 영업과정에서 단기간에 판매하기 위하여 보유하지 않고 장기 시세차익을 얻기 위하여 보유하고 있는 토지는 투자부동산으로 분류한다.","종업원으로부터 시장가격에 해당하는 임차료를 받고 있는 경우에도 종업원이 사용하는 부동산은 자가사용부동산이며 투자부동산으로 분류하지 않는다.","장래 자가사용할지 또는 통상적인 영업과정에서 단기간에 판매할지를 결정하지 못한 토지는 자가사용부동산이며 투자부동산으로 분류하지 않는다.","건물의 소유자가 그 건물 전체를 사용하는 리스이용자에게 보안과 관리용역을 제공하는 경우에는 당해 건물을 투자부동산으로 분류한다.","투자부동산을 개발하지 않고 처분하기로 결정하는 경우에는 그 부동산이 제거될 때까지 투자부동산으로 계속 분류한다."],
  answer:3, status:"clear", note:"" },
{ id:"hg2018-2", subject:"회계학개론", year:2018, no:2, law:"회계학개론", unit:"유형자산", kind:"concept",
  stem:"유형자산의 회계처리에 관한 설명으로 옳지 않은 것은?",
  choices:["토지의 원가에 해체, 제거 및 복구원가가 포함된 경우에는 그러한 원가를 관련 경제적효익이 유입되는 기간에 감가상각한다.","사용정도에 따라 감가상각하는 경우가 아니라면, 감가상각은 자산이 매각예정자산으로 분류되는 날과 제거되는 날 중 이른 날에 중단한다.","손상, 소실 또는 포기된 유형자산에 대해 제3자로부터 받을 보상금은 취득시점의 추정금액을 취득원가에 조정한다.","유형자산의 장부금액은 처분하는 때 또는 사용이나 처분을 통하여 미래경제적효익이 기대되지 않을 때에 제거한다.","감가상각방법, 내용연수, 잔존가치의 변경은 회계추정의 변경으로 회계처리한다."],
  answer:3, status:"clear", note:"" },
{ id:"hg2018-3", subject:"회계학개론", year:2018, no:3, law:"회계학개론", unit:"사업결합·연결", kind:"concept",
  stem:"연결재무제표에 관한 설명으로 옳지 않은 것은?",
  choices:["투자기업의 지배기업은 자신이 투자기업이 아닐 경우에는, 종속기업인 투자기업을 통해 지배하는 기업을 포함하여 지배하는 모든 종속기업을 공정가치로 측정하여 당기손익에 반영한다.","지배기업은 비슷한 상황에서 발생한 거래와 그 밖의 사건에 동일한 회계정책을 적용하여 연결재무제표를 작성한다.","지배기업은 비지배지분을 연결재무상태표에서 자본에 포함하되 지배기업의 소유주지분과는 구분하여 별도로 표시한다.","지배기업이 소유한 종속기업 지분이 변동되더라도 지배기업이 종속기업에 대한 지배력을 상실하지 않는다면, 그것은 자본거래이다.","피투자자와의 연결은 투자자가 피투자자에 대한 지배력을 획득하는 날부터 시작되어 투자자가 피투자자에 대한 지배력을 상실할 때에 중지된다."],
  answer:1, status:"clear", note:"" },

{ id:"hg2018-10", subject:"회계학개론", year:2018, no:10, law:"회계학개론", unit:"재고자산", kind:"concept",

  choices:["상각후원가측정금융자산을 당기손익-공정가치측정금융자산으로 재분류할 경우 재분류일의 공정가치로 측정하고, 재분류 전 상각후원가와 공정가치의 차이를 당기손익으로 인식한다.","상각후원가측정금융자산을 기타포괄손익-공정가치측정금융자산으로 재분류할 경우 재분류일의 공정가치로 측정하고, 재분류 전 상각후원가와 공정가치의 차이를 기타포괄손익으로 인식하며, 재분류에 따라 유효이자율과 기대신용손실 측정치는 조정하지 않는다.","기타포괄손익-공정가치측정금융자산을 당기손익-공정가치측정금융자산으로 재분류할 경우 계속 공정가치로 측정하고, 재분류 전에 인식한 기타포괄손익누계액은 재분류일에 이익잉여금으로 대체한다.","기타포괄손익-공정가치측정금융자산을 상각후원가측정금융자산으로 재분류할 경우 재분류일의 공정가치로 측정하고, 재분류 전에 인식한 기타포괄손익누계액은 자본에서 제거하고 재분류일의 금융자산의 공정가치에서 조정하며, 재분류에 따라 유효이자율과 기대신용손실 측정치는 조정하지 않는다.","당기손익-공정가치측정금융자산을 기타포괄손익-공정가치측정금융자산으로 재분류할 경우 계속 공정가치로 측정하고, 재분류일의 공정가치에 기초하여 유효이자율을 다시 계산한다."],
  answer:3, status:"clear", note:"" },

{ id:"hg2018-23", subject:"회계학개론", year:2018, no:23, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"자본 및 자본유지개념에 관한 설명으로 옳지 않은 것은?",
  choices:["자본유지개념은 이익이 측정되는 준거기준을 제공하며, 기업의 자본에 대한 투자수익과 투자회수를 구분하기 위한 필수요건이다.","자본을 투자된 화폐액 또는 투자된 구매력으로 보는 재무적 개념 하에서 자본은 기업의 순자산이나 지분과 동의어로 사용된다.","자본을 불변구매력 단위로 정의한 재무자본유지개념 하에서는 일반물가수준에 따른 가격상승을 초과하는 자산가격의 증가 부분만이 이익으로 간주된다.","재무자본유지개념을 사용하기 위해서는 현행원가기준에 따라 측정해야 하며, 실물자본유지개념은 특정한 측정기준의 적용을 요구하지 아니한다.","자본을 실물생산능력으로 정의한 실물자본유지개념 하에서 기업의 자산과 부채에 영향을 미치는 모든 가격변동은 해당 기업의 실물생산능력에 대한 측정치의 변동으로 간주되어 이익이 아니라 자본의 일부로 처리된다."],
  answer:4, status:"clear", note:"" },

  choices:["발행 당시 전환권대가는 ￦103,086이다.","20×1년도 전환권조정 상각액은 ￦31,753이다.","20×2년 초 장부금액은 ￦928,667이다.","20×2년 전환사채의 조기상환일에 부채요소의 공정가치는 ￦821,168이다.","20×2년 전환사채의 조기상환과 관련하여 당기손익에 반영되는 사채상환손실은 ￦38,247이다."],

{ id:"hg2018-25", subject:"회계학개론", year:2018, no:25, law:"회계학개론", unit:"생물자산", kind:"concept",

  choices:["최초의 인식시점에 생물자산의 공정가치를 신뢰성 있게 측정할 수 없다면, 원가에서 감가상각누계액 및 손상차손누계액을 차감한 금액으로 측정한다.","생물자산을 이전에 순공정가치로 측정하였다면 처분시점까지 계속하여 당해 생물자산을 순공정가치로 측정한다.","수확물을 최초 인식시점에 순공정가치로 인식하여 발생하는 평가손익은 발생한 기간의 당기손익에 반영한다.","목재로 사용하기 위해 재배하는 나무와 같이 수확물로 수확하기 위해 재배하는 식물은 생산용식물이 아니다.","과일과 목재 모두를 얻기 위해 재배하는 나무는 생산용식물이다."],

{ id:"hg2018-26", subject:"회계학개론", year:2018, no:26, law:"회계학개론", unit:"전부원가·변동원가계산", kind:"calc",
  stem:"(주)세무는 20×1년 초에 영업을 개시하였다. 20×1년에는 4,000단위를 생산하였고, 20×2년에는 전부원가계산에 의한 영업이익이 변동원가계산에 의한 영업이익보다 ￦25,000 많았다. 20×2년의 생산 및 원가자료는 다음과 같다.\n기초제품 수량 ( )단위 / 생산량 4,000단위 / 기말제품 수량 1,200단위\n제품 단위당: 판매가격 ￦250 / 직접재료원가 80 / 직접노무원가 40 / 변동제조간접원가 30 / 변동판매관리비 10\n고정제조간접원가(총액) ￦200,000 / 고정판매관리비(총액) 100,000\n(주)세무의 20×2년도 기초제품 수량은? (단, 20×1년과 20×2년의 제품 단위당 판매가격과 원가구조는 동일하고, 기초 및 기말 재공품은 없다.)",
  choices:["500단위","650단위","700단위","950단위","1,700단위"],
  answer:3, status:"clear", note:"" },
{ id:"hg2018-27", subject:"회계학개론", year:2018, no:27, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 정상원가계산을 적용하고 있으며, 제조간접원가는 기본원가(prime costs)의 50%를 예정 배부한다. (주)세무는 제조간접원가 배부차이를 원가요소기준 비례배부법으로 조정한다. 9월의 기본원가, 매출액과 배부차이 조정 후 기말재고자산은 다음과 같다.\n기본원가 ￦750,000 / 매출액 ￦1,000,000\n기말재공품 120,000 / 기말제품 180,000\n9월의 배부차이 조정 후 매출원가율이 80%일 때, 배부차이는? (단, 기초재고자산은 없다.)",
  choices:["￦10,000 과대배부","￦15,000 과소배부","￦15,000 과대배부","￦25,000 과소배부","￦25,000 과대배부"],

{ id:"hg2018-28", subject:"회계학개론", year:2018, no:28, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 원가행태를 추정하기 위해 고저점법을 적용한다. (주)세무의 경영자는 추정된 원가함수를 토대로 7월의 목표이익을 ￦167,500으로 설정하였다. 목표이익을 달성하기 위한 추정 목표매출액은? (단, 당월 생산된 제품은 당월에 전량 판매되고, 추정 목표매출액은 관련범위 내에 있다.)\n월 / 총원가 / 총매출액\n3월 ￦887,000 / ￦980,000\n4월 791,000 / 855,000\n5월 985,500 / 1,100,000\n6월 980,000 / 1,125,000",

  answer:5, status:"clear", note:"" },
{ id:"hg2018-29", subject:"회계학개론", year:2018, no:29, law:"회계학개론", unit:"종합원가계산", kind:"calc",
  stem:"(주)세무는 가중평균법에 의한 종합원가계산제도를 채택하고 있다. 직접재료는 공정초기에 전량 투입되고, 전환원가(conversion costs)는 공정 전반에 걸쳐 균등하게 발생한다. 20×1년 직접재료원가에 대한 총완성품환산량은 20,000단위, 전환원가에 대한 총완성품환산량은 18,000단위, 완성품 수량은 15,000단위이다. 20×1년 기말재공품의 전환원가 완성도는?",
  choices:["50%","60%","75%","80%","90%"],
  answer:2, status:"clear", note:"" },
{ id:"hg2018-30", subject:"회계학개론", year:2018, no:30, law:"회계학개론", unit:"전부원가·변동원가계산", kind:"calc",
  stem:"(주)세무는 20×1년 초에 영업을 개시하였다. (주)세무는 전부원가계산을 적용하고 있으며, 재고자산의 원가흐름가정은 선입선출법이다. 20×1년과 20×2년의 생산 및 원가자료는 다음과 같다.\n항목 / 20×1년 / 20×2년\n제품 생산량 1,500단위 / 1,750단위\n제품 판매량 1,200단위 / ( )단위\n기말제품 수량 ( )단위 / 150단위\n제품단위당 변동제조원가 ￦38 / ￦40\n고정제조간접원가 ￦48,000 / ￦70,000\n(주)세무의 20×2년도 매출원가는? (단, 기초 및 기말 재공품은 없다.)",

{ id:"hg2018-31", subject:"회계학개론", year:2018, no:31, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 보조부문 A, B와 제조부문 P, Q를 운영하고 있으며, 각 부문의 용역수수관계와 각 보조부문에서 발생한 원가는 다음과 같다.\n제공부문·사용부문 / A / B / P / Q / 용역생산량\nA / 10% / 40% / 20% / 30% / 1,000단위\nB / 20% / 10% / 40% / 30% / 2,000단위\n○ 보조부문 A의 원가: ￦50,000 + ￦70 × 1,000단위\n○ 보조부문 B의 원가: ￦30,000 + ￦150 × 2,000단위\n(주)세무는 현재 운영하고 있는 보조부문을 폐쇄하는 방안을 고려하던 중, (주)한국으로부터 보조부문 A가 생산하던 용역을 단위당 ￦150에, (주)대한으로부터는 보조부문 B가 생산하던 용역을 단위당 ￦200에 공급하겠다는 제의를 받았다. (주)세무가 보조부문의 용역을 외부에서 구입하더라도 각 보조부문에서 발생하는 고정원가를 회피할 수 없다. 다음 설명 중 옳은 것은?",
  choices:["(주)세무는 보조부문 A와 B를 계속해서 유지하는 것이 유리하다.","(주)세무가 보조부문 A를 폐쇄하고 (주)한국의 제의를 수락할 경우, 영업이익이 ￦7,000 증가한다.","(주)세무가 보조부문 B를 폐쇄하고 (주)대한의 제의를 수락할 경우, 영업이익이 ￦20,000 감소한다.","(주)세무가 보조부문 A의 용역을 외부로부터 구입할 경우, 지불할 수 있는 최대 가격은 단위당 ￦120이다.","(주)세무가 보조부문 B의 용역을 외부로부터 구입할 경우, 지불할 수 있는 최대 가격은 단위당 ￦170이다."],
  answer:2, status:"clear", note:"" },
{ id:"hg2018-32", subject:"회계학개론", year:2018, no:32, law:"회계학개론", unit:"결합원가계산", kind:"calc",
  stem:"(주)세무는 주산품 A, B와 부산품 S를 생산한다. 당기 중 발생한 결합원가는 ￦9,500이다. 결합원가는 분리점에서 순실현가능가치(NRV)를 기준으로 각 제품에 배부하며, 당기의 생산 및 원가자료는 다음과 같다.\n제품 / 분리점 이후 추가가공원가(총액) / 추가가공 후 단위당 판매가격 / 생산량 / 판매량\nA ￦2,000 / ￦40 / 200단위 / 180단위\nB 1,000 / 20 / 250 / 200\nS 500 / 15 / 100 / 90\n주산품B의 매출총이익은? (단, 기초 재고자산은 없으며, 부산품S는 생산시점에서 순실현가능가치로 인식한다.)",
  choices:["￦480","￦560","￦580","￦750","￦810"],
  answer:1, status:"clear", note:"" },
{ id:"hg2018-33", subject:"회계학개론", year:2018, no:33, law:"회계학개론", unit:"전부원가·변동원가계산", kind:"calc",
  stem:"(주)세무는 20×1년 초에 영업을 개시하였다. 20×2년도 기초제품 수량은 100단위, 생산량은 2,000단위, 판매량은 1,800단위이다. 20×2년의 제품 판매가격 및 원가자료는 다음과 같다.\n제품 단위당: 판매가격 ￦250 / 직접재료원가 30 / 직접노무원가 50 / 변동제조간접원가 60 / 변동판매관리비 15\n고정제조간접원가(총액) ￦50,000 / 고정판매관리비(총액) 10,000\n20×2년도 변동원가계산에 의한 영업이익과 초변동원가계산(throughput costing)에 의한 영업이익의 차이금액은? (단, 20×1년과 20×2년의 제품 단위당 판매가격과 원가구조는 동일하고, 기초 및 기말 재공품은 없다.)",
  choices:["￦10,000","￦11,000","￦20,000","￦22,000","￦33,000"],
  answer:4, status:"clear", note:"" },
{ id:"hg2018-34", subject:"회계학개론", year:2018, no:34, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 직접재료를 투입하여 두 개의 공정을 거쳐 제품을 생산하고 있다. 제1공정에서는 직접재료 1톤을 투입하여 제품A 400kg과 중간제품M 600kg을 생산하며, 제2공정에서는 중간제품M을 가공하여 제품B 600kg을 생산한다. 직접재료는 제1공정 초기에 전량 투입되고, 전환원가는 공정 전반에 걸쳐 균등하게 발생하며, 모든 공정에서 공손 및 감손은 발생하지 않는다. 제1공정에서는 변동전환원가가 ￦200/톤, 고정원가는 ￦70,000이 발생하였으며, 제2공정에서는 변동전환원가가 ￦1,200/톤, 고정원가는 ￦58,000이 발생하였다. 직접재료 구입원가는 ￦2,000/톤이며, 제품 A와 B의 판매가격은 각각 ￦3,000/톤, ￦5,000/톤이다. 생산된 모든 제품이 전량 판매된다고 가정할 경우, 각 제품의 손익분기점 판매량은?",
  choices:["제품A 40톤 / 제품B 60톤","제품A 48톤 / 제품B 72톤","제품A 50톤 / 제품B 75톤","제품A 60톤 / 제품B 90톤","제품A 80톤 / 제품B 120톤"],
  answer:1, status:"clear", note:"" },
{ id:"hg2018-35", subject:"회계학개론", year:2018, no:35, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 두 종류의 제품 A와 B를 생산·판매한다. 두 제품의 월간 예상판매 및 원가자료는 다음과 같다.\n항목 / 제품A / 제품B\n판매가격 ￦50 / ￦45\n변동제조원가 32 / 25\n고정제조간접원가 5 / 7\n변동판매관리비 8 / 5\n고정판매관리비 2 / 2\n기계시간당 생산량 4단위 / 2단위\n월간 예상수요량 120단위 / 80단위\n(주)세무의 월간 최대 사용가능한 기계시간은 50시간이다. (주)세무가 영업이익을 극대화할 수 있는 월 최적 제품배합은? (단, 월간 고정원가 총액은 일정하다.)",
  choices:["제품A 40단위 / 제품B 80단위","제품A 60단위 / 제품B 70단위","제품A 80단위 / 제품B 60단위","제품A 100단위 / 제품B 50단위","제품A 120단위 / 제품B 40단위"],
  answer:5, status:"clear", note:"" },
{ id:"hg2018-36", subject:"회계학개론", year:2018, no:36, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 20×1년에 제품A를 5,000단위 생산하여 전량 국내시장에 판매할 계획이다. 제품A의 단위당 판매가격은 ￦10,000, 단위당 변동제조원가는 ￦7,000, 단위당 변동판매관리비는 ￦1,000이다. (주)세무는 20×1년 초에 해외 거래처로부터 제품A 3,000단위를 단위당 ￦8,000에 구입하겠다는 특별주문을 받았다. 해외 거래처의 주문을 수락하기 위해서는 제품A 1단위당 부품B(단위당 외부구입가격: ￦500) 1단위를 추가로 투입해야 하고, 20×1년도 국내시장 판매량을 350단위 감소시켜야 한다. 특별주문과 관련된 판매관리비는 주문수량에 관계없이 ￦300,000 발생한다. (주)세무가 특별주문을 수락할 경우, 20×1년도 예산이익의 증가(또는 감소) 금액은? (단, 특별주문은 전량 수락하든지 기각해야 한다.)",
  choices:["￦300,000 증가","￦420,000 증가","￦500,000 증가","￦550,000 감소","￦800,000 감소"],
  answer:3, status:"clear", note:"" },
{ id:"hg2018-37", subject:"회계학개론", year:2018, no:37, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 20×1년 초에 설립되어 인공지능을 이용한 스피커를 생산하고 있다. 스피커의 단위당 변동원가는 ￦6,000이며 연간 고정원가 총액은 ￦1,500,000이다. (주)세무는 당기에 국내시장에서 스피커 300단위를 판매하고, 국내시장에서 판매하고 남는 스피커는 해외시장에 판매할 계획이다. 스피커의 국내 판매가격은 단위당 ￦10,000이며, 해외 판매가격은 단위당 ￦9,000이다. 해외시장에 판매하더라도 원가구조에는 변함이 없으며, 국내시장에 미치는 영향은 없다. 법인세율이 20%일 경우 손익분기점 판매량은?",
  choices:["350단위","375단위","400단위","450단위","500단위"],
  answer:3, status:"clear", note:"" },
{ id:"hg2018-38", subject:"회계학개론", year:2018, no:38, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 세 개의 제조부문(P1, P2, P3)과 두 개의 보조부문(S1, S2)을 운영하고 있으며, 보조부문원가를 상호배분법에 의해 제조부문에 배분하고 있다. 각 부문의 용역수수관계는 다음과 같다.\n사용부문(제공부문S1) → P1 40% / P2 20% / P3 20% / S2 20%\n사용부문(제공부문S2) → P1 30% / P2 30% / P3 30% / S1 10%\n두 개의 보조부문(S1, S2)으로부터 제조부문 P1, P2, P3 에 배분된 금액이 각각 ￦150,000, ￦120,000, ￦120,000일 경우, 보조부문원가를 배분하기 이전의 각 보조부문 S1과 S2에 집계된 원가는?",
  choices:["S1 ￦100,000 / S2 ￦290,000","S1 ￦120,000 / S2 ￦270,000","S1 ￦150,000 / S2 ￦300,000","S1 ￦270,000 / S2 ￦120,000","S1 ￦300,000 / S2 ￦150,000"],
  answer:2, status:"clear", note:"" },
{ id:"hg2018-39", subject:"회계학개론", year:2018, no:39, law:"회계학개론", unit:"표준원가계산", kind:"calc",
  stem:"(주)세무는 표준원가계산제도를 도입하고 있다. 20×1년의 변동제조간접원가 예산은 ￦300,000이고, 고정제조간접원가 예산은 ￦800,000이다. (주)세무는 제조간접원가 배부기준으로 직접노무시간을 사용하고 있다. 기준조업도는 직접노무시간 1,000시간이고, 20×1년에 실제로 투입된 직접노무시간은 850시간이다. 20×1년의 고정제조간접원가 조업도차이가 ￦80,000(불리)할 경우 변동제조간접원가 능률차이는?",
  choices:["￦15,000 유리","￦45,000 유리","￦10,000 불리","￦15,000 불리","￦45,000 불리"],
  answer:1, status:"clear", note:"" },
{ id:"hg2018-40", subject:"회계학개론", year:2018, no:40, law:"회계학개론", unit:"종합원가계산", kind:"calc",
  stem:"(주)세무는 직접재료를 가공하여 제품을 생산하고 있다. 직접재료는 공정 초기에 전량 투입되며, 전환원가는 공정 전반에 걸쳐 균등하게 발생한다. 직접재료의 20%가 제조과정에서 증발되는데, 이러한 증발은 정상적이며 제조과정에서 평균적으로 발생한다. 완성품 1단위에는 직접재료 0.1kg이 포함되어 있고, 당기에 2,000단위가 완성되었다. 당기에 투입된 직접재료는 190kg, 기말재공품(전환원가 완성도 25%)은 38kg, 기초재공품은 90kg이 있다. 기초재공품의 전환원가 완성도는? (단, 공손은 발생하지 않는다.)",
  choices:["25%","30%","40%","50%","60%"],
  answer:4, status:"clear", note:"" },

{ id:"hs2018-41", subject:"행정소송법", year:2018, no:41, law:"행정소송법", unit:"판결 일반", kind:"concept",
  stem:"취소소송의 판결에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분의 무효를 선언하는 취소판결도 있다.","계쟁처분이 위법하지는 않지만 부당인 경우는 부분인용판결을 한다.","판결서의 형식은 「행정소송법」에 규정되어 있다.","효력은 판결문이 당사자들에게 도달한 날에 발생한다.","취소소송의 일부를 종료시키는 판결은 종국판결이 아니다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2018-42", subject:"행정소송법", year:2018, no:42, law:"행정소송법", unit:"원고적격·법률상 이익", kind:"concept",
  stem:"판례상 항고소송에 관한 설명으로 옳은 것은?",
  choices:["국토이용계획과 관련한 지방자치단체의 장의 기관위임사무의 처리에 관하여 국가가 지방자치단체의 장을 상대로 한 취소소송은 허용된다.","처분청이 그 처분에 관하여 행한 행정심판위원회의 인용재결에 대하여 제기한 항고소송은 허용된다.","구(舊)「자연환경보전법」에 따라 1등급 권역의 인근 주민들이 갖는 생활환경상 이익은 법률상 이익이다.","기존 목욕장영업장 부근에 신설 영업장을 허가한 경우 기존 영업자는 허가처분의 취소소송을 제기할 법률상 이익이 있다.","당사자가 행정청에 어떠한 행정행위를 요구할 수 있는 법규상 또는 조리상 권리를 갖지 않는 경우 그 행정행위에 대한 부작위위법확인의 소는 허용되지 않는다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2018-43", subject:"행정소송법", year:2018, no:43, law:"행정소송법", unit:"위법판단 기준시", kind:"concept",
  stem:"처분의 위법성 판단에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["「국민건강보험법」상 과다본인부담금확인 처분 등의 위법여부에 관하여 진료행위시와 처분시 사이 요양급여기준이 개정되었을 경우 처분시의 법령을 적용하여야 한다.","개발부담금의 부과에 있어서는 특별한 사정이 없는 한 개발사업이 종료될 당시의 법률이 적용된다.","「산업재해보상보험법」상 장해급여 지급에 관한 처분은 수급권자가 지급청구권을 취득할 당시의 법령에 따르는 것이 원칙이다.","「국민연금법」상 장애연금 지급을 위한 장애등급결정은 가입자가 지급청구권을 취득할 당시의 법령에 따르는 것이 원칙이다.","세금의 부과는 특별한 사정이 없는 한 납세의무의 성립시에 유효한 법령의 규정에 의한다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2018-44", subject:"행정소송법", year:2018, no:44, law:"행정소송법", unit:"원처분주의·재결주의", kind:"concept",
  stem:"취소소송의 대상에서 원처분주의와 재결주의가 올바르게 연결된 것만을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 감사원의 변상판정에 대한 재심의 판정에 대한 불복 - 원처분주의\nㄴ. 노동위원회의 처분에 대한 중앙노동위원회의 재심 판정에 대한 불복 - 재결주의\nㄷ. 중앙토지수용위원회의 이의재결에 대한 불복 - 원처분주의\nㄹ. 교원소청심사위원회의 결정에 대한 불복 - 재결주의",
  choices:["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],
  answer:2, status:"clear", note:"" },
{ id:"hs2018-45", subject:"행정소송법", year:2018, no:45, law:"행정소송법", unit:"처분성", kind:"concept",
  stem:"판례상 처분에 해당하는 것은?",
  choices:["「국가공무원법」상 결격사유가 있는 자에 대한 당연퇴직인사발령","무허가건물관리대장 등재 삭제행위","공정거래위원회의 '표준약관 사용권장행위'","재개발조합의 조합원 분양계약에 대한 안내서 발송행위","「질서위반행위규제법」에 따른 과태료 부과처분"],
