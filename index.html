  stem:"(주)세무는 정상원가계산을 사용하며, 20x1년 재고자산 및 원가자료는 다음과 같다.\n\n구분/기초/기말: 직접재료 ￦20,000/￦30,000, 재공품 25,000/38,000, 제품 44,000/32,000\n\n○ 당기의 직접재료 매입액은 ￦90,000이다.\n○ 당기의 직접노무원가 발생액은 ￦140,000이다.\n○ 직접노무시간당 직접노무원가는 ￦40이다.\n○ 당기의 매출액은 ￦300,000이며, 매출총이익률은 20%이다.\n직접노무시간을 기준으로 제조간접원가를 예정배부할 때, 20x1년 제조간접원가 예정배부율은?",

{ id:"hg2023-29", subject:"회계학개론", year:2023, no:29, law:"회계학개론", unit:"활동기준원가계산", kind:"calc",
  stem:"(주)세무는 20x1년 제품 A와 B를 각각 1,800개와 3,000개를 생산ㆍ판매하였다. 각 제품은 배치(batch)로 생산되고 있으며, 제품 A와 B의 배치당 생산량은 각각 150개와 200개이다. 활동원가는 총 ￦1,423,000이 발생하였다.\n\n활동/원가동인/활동원가: 재료이동/이동횟수/￦189,000, 재료가공/기계작업시간/1,000,000, 품질검사/검사시간/234,000, 합계/-/￦1,423,000\n\n○ 제품 A와 B 모두 재료이동은 배치당 2회씩 이루어진다.\n○ 제품 A와 B의 총 기계작업시간은 각각 300시간과 500시간이다.\n○ 제품 A와 B 모두 품질검사는 배치당 2회씩 이루어지며, 제품 A와 B의 1회 검사시간은 각각 2시간과 1시간이다.\n제품 A에 배부되는 활동원가는? (단, 재공품은 없다.)",

  stem:"(주)세무는 제조간접원가를 직접노무시간당 ￦160씩 예정배부하고 있다. 20x1년 실제발생한 제조간접원가는 ￦180,000이다. 제조간접원가 배부차이는 기말재고자산(재공품과 제품)과 매출원가에 비례하여 안분한다. 20x1년의 제조간접원가 배부차이 가운데 30%에 해당하는 ￦6,000을 기말재고자산에서 차감하도록 배분하였다. 20x1년 실제발생한 직접노무시간은?",

{ id:"hg2023-31", subject:"회계학개론", year:2023, no:31, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",

{ id:"hg2023-32", subject:"회계학개론", year:2023, no:32, law:"회계학개론", unit:"결합원가계산", kind:"calc",
  stem:"(주)세무는 결합공정을 거쳐 분리점에서 주산물 A와 B, 부산물 C를 생산하고 있다. 20x1년 결합공정에 투입된 원재료는 2,200kg이며, 결합원가는 ￦31,960 발생하였다. 제품 A와 부산물 C는 추가가공을 필요로 하지 않지만, 제품 B는 추가가공하여 최종 완성된다. 부산물의 원가는 생산기준법(생산시점의 순실현가치법)을 적용하여 인식한다.\n\n/생산량/추가가공원가/단위당 판매가격/결합원가 배분액\n제품A 1,350kg/-/￦100/￦13,950\n제품B 550/￦11,000/320/?\n부산물C 300/-/?/?\n합계 2,200kg/ / /￦31,960\n\n순실현가치법으로 결합원가를 배분할 때 제품 A에는 ￦13,950이 배분되었다. 부산물 C의 단위당 판매가격은? (단, 재공품은 없다.)",
  choices:["￦3.0","￦3.2","￦3.4","￦3.6","￦3.8"],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-33", subject:"회계학개론", year:2023, no:33, law:"회계학개론", unit:"품질원가", kind:"calc",
  stem:"(주)세무의 품질관리 활동원가는 다음과 같다.\n\n공손품재작업 ￦400, 납품업체평가 500, 불량품폐기 600, 완제품검사 700, 보증수리원가 2,000, 반품재작업 1,000, 품질교육훈련 1,000, 재공품검사 300\n\n위 원가(비용)를 다양한 유형별로 구분하여 자세히 분석한 결과, 예방원가(prevention cost)를 현재보다 50% 증가시키면 외부실패원가(external failure cost)를 현재보다 40% 절감할 수 있을 것으로 예상하였다. 이를 실행할 경우, 회사의 이익은 얼마나 증가하는가?",
  choices:["￦400","￦450","￦690","￦700","￦850"],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-34", subject:"회계학개론", year:2023, no:34, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 단일 제품을 생산ㆍ판매한다. 제품 단위당 판매가격은 ￦100, 단위당 변동원가는 ￦60으로 일정하나, 고정원가는 제품 생산범위에 따라 상이하다. 제품 생산범위가 첫 번째 구간(1∼1,000단위)에서 두 번째 구간(1,001∼2,000단위)으로 넘어가면 고정원가가 ￦17,600 증가한다. 첫 번째 구간의 손익분기점이 860단위인 경우, 두 번째 구간의 손익분기점은 몇 단위인가?",
  choices:["1,150단위","1,200단위","1,250단위","1,300단위","1,440단위"],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-35", subject:"회계학개론", year:2023, no:35, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 A, B, C 세 종류의 제품을 생산ㆍ판매하고 있으며, 관련 자료는 다음과 같다.\n\n/제품A/제품B/제품C\n매출액 ￦100,000/￦200,000/￦150,000\n변동원가 70,000/110,000/130,000\n고정원가 20,000/40,000/30,000\n이익 10,000/50,000/(10,000)\n\n각 제품별 고정원가는 회사 전체적으로 발생하는 고정원가 ￦90,000을 각 제품의 매출액에 비례하여 배분한 것으로, 제품 생산 여부나 생산 및 판매 수량에 관계없이 일정하게 발생한다. 손실이 발생하고 있는 제품 C의 생산을 중단하는 경우 제품 A의 매출액은 50% 증가하고, 제품 B의 매출액은 변화 없을 것으로 예상된다. 제품 C의 생산을 중단하면 회사 전체 이익은 얼마나 감소하는가?",
  choices:["￦1,000","￦3,000","￦5,000","￦7,000","￦9,000"],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-36", subject:"회계학개론", year:2023, no:36, law:"회계학개론", unit:"책임회계·대체가격", kind:"calc",
  stem:"(주)세무는 사업부 A와 B를 이익중심점으로 두고 있다. 사업부 A는 부품 S를 생산하여 사업부 B에 대체하거나 외부에 판매할 수 있으며, 사업부 B는 완제품 생산을 위해 필요한 부품 S를 사업부 A에서 구입하거나 외부에서 구입할 수 있다. 부품 S 1,000단위를 대체하는 경우 사업부 A의 단위당 최소대체가격은 ￦160이다. 부품 S 1,000단위를 내부대체하면 대체하지 않는 것에 비해 회사 전체 이익이 ￦50,000 증가한다. 이 경우 부품 S 1,000단위에 대한 사업부 B의 단위당 최대대체가격(M)과 대체로 인하여 증가하는 이익을 두 사업부가 균등하게 나눌 수 있는 대체가격(E)의 합(M+E)은?",
  choices:["￦370","￦380","￦385","￦390","￦395"],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-37", subject:"회계학개론", year:2023, no:37, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 두 공정을 거쳐 제품을 생산ㆍ판매하며, 각 공정별 자료는 다음과 같다.\n\n/최대생산능력/총고정원가/단위당 변동원가\n제1공정 8,000단위/￦400,000/￦20\n제2공정 10,000단위/￦200,000/￦10\n\n제1공정 완성품은 외부 판매시장이 존재하지 않지만, 제2공정에서 추가가공하여 완제품(양품)을 생산한 후 단위당 ￦120에 모두 판매할 수 있다. 제1공정에서는 공손이 발생하지 않지만, 제2공정 투입량의 5%는 제2공정 종점에서 공손이 되며, 공손품의 처분가치는 없다. ￦80,000을 추가 투입하여 제1공정의 최대생산능력을 1,000단위 증가시킬 수 있다면, 회사 이익은 얼마나 증가하는가?",
  choices:["￦4,000","￦4,500","￦10,000","￦10,500","￦14,500"],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-38", subject:"회계학개론", year:2023, no:38, law:"회계학개론", unit:"불확실성하의사결정", kind:"calc",
  stem:"(주)세무는 기계 A, B 중 하나를 구입하고, 이를 사용하여 신제품을 생산하려 한다. 관련 자료를 근거로 작성한 성과표(payoff table)는 다음과 같다. 성과표에서 P(Si)는 확률을 의미하고, 금액은 이익을 의미한다.\n\n/S1=호황 P=0.4/S2=불황 P=0.6\n기계A ￦9,000/￦1,000\n기계B 7,000/K\n\n기계 A의 기대이익이 기계 B의 기대이익보다 더 크며, 호황일 때는 기계 A의 이익이 더 크고 불황일 때는 기계 B의 이익이 더 크다. 완전정보의 기대가치(EVPI)가 ￦600인 경우, 성과표에서 K는 얼마인가?",
  choices:["￦1,500","￦2,000","￦2,200","￦2,300","￦2,500"],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-39", subject:"회계학개론", year:2023, no:39, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 단일 제품을 생산하여 판매한다. 제품 단위당 판매가격은 ￦1,000, 단위당 변동원가는 ￦600, 총 고정원가는 ￦1,900,000으로 예상된다. 세법에 의할 경우 총 고정원가 중 ￦100,000과 단위당 변동원가 중 ￦50은 세법상 손금(비용)으로 인정되지 않을 것으로 예상된다. (주)세무에 적용될 세율이 20%인 경우 세후순이익 ￦41,000을 얻기 위한 제품의 판매수량은?",
  choices:["4,050단위","4,450단위","4,750단위","5,000단위","5,100단위"],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-40", subject:"회계학개론", year:2023, no:40, law:"회계학개론", unit:"전부원가·변동원가계산", kind:"calc",
  stem:"(주)세무는 당기에 영업을 처음 시작하였으며, 실제원가계산을 사용한다. 당기 제품 생산량은 2,000단위이다. 제품 단위당 판매가격은 ￦1,000, 단위당 직접재료원가는 ￦280, 단위당 직접노무원가는 ￦320이고, 당기 총 고정제조간접원가는 ￦200,000, 총 고정판매관리비는 ￦300,000이다. 변동제조간접원가와 변동판매관리비는 존재하지 않는다. 변동원가계산에 의한 손익분기점은 전부원가계산에 의한 손익분기점보다 몇 단위 더 많은가?",
  choices:["100단위","150단위","200단위","250단위","300단위"],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-1", subject:"회계학개론", year:2024, no:1, law:"회계학개론", unit:"회계변경과 오류수정", kind:"concept",
  stem:"한국채택국제회계기준에서 인정하는 회계정책의 변경에 해당하는 것을 모두 고른 것은?\n\nㄱ. 과거에 발생한 거래와 실질이 다른 거래, 기타 사건 또는 상황에 대하여 다른 회계정책을 적용하는 경우\nㄴ. 한국채택국제회계기준의 요구에 따라 회계정책을 변경하는 경우\nㄷ. 회계정책의 변경을 반영한 재무제표가 거래, 기타 사건 또는 상황이 재무상태, 재무성과 또는 현금흐름에 미치는 영향에 대하여 신뢰성 있고 더 목적적합한 정보를 제공하는 경우\nㄹ. 과거에 발생하지 않았거나 발생하였어도 중요하지 않았던 거래, 기타 사건 또는 상황에 대하여 새로운 회계정책을 적용하는 경우\nㅁ. 한국채택국제회계기준에서 인정되지 않는 회계정책을 적용하다가 이를 한국채택국제회계기준에서 허용하는 방법으로 변경하는 경우",
  choices:["ㄱ, ㄴ","ㄱ, ㅁ","ㄴ, ㄷ","ㄷ, ㄹ","ㄹ, ㅁ"], answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-2", subject:"회계학개론", year:2024, no:2, law:"회계학개론", unit:"재무회계개념체계", kind:"calc",
  stem:"(주)세무는 20×1년 초에 상품매매업을 영위할 목적으로 현금 ￦100,000을 납입받아 설립되었다. 회사는 20×1년 초에 상품 40단위를 단위당 ￦2,000에 현금으로 구입하였으며, 20×1년 말까지 단위당 ￦3,000에 모두 현금 판매하였다. 동 상품은 20×1년 말 단위당 ￦2,500에 구입가능하다. 20×1년 초 물가지수를 100이라고 할 때 20×1년 말 물가지수는 120이다. 실물자본유지개념을 적용하여 산출한 20×1년 말에 인식할 이익과 자본유지조정 금액은?",
  choices:["이익 ￦10,000, 자본유지조정 ￦30,000","이익 ￦15,000, 자본유지조정 ￦25,000","이익 ￦20,000, 자본유지조정 ￦20,000","이익 ￦25,000, 자본유지조정 ￦15,000","이익 ￦30,000, 자본유지조정 ￦10,000"],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-3", subject:"회계학개론", year:2024, no:3, law:"회계학개론", unit:"현금흐름표", kind:"calc",
  stem:"(주)세무의 기계장치와 관련된 내역은 다음과 같다. 기계장치는 원가모형을 적용한다.\n\n계정과목/기초금액/기말금액: 기계장치 ￦400,000/￦410,000, 감가상각누계액 55,000/65,000\n\n한편, 당기 중에 기계장치를 ￦100,000에 취득하였으며, 포괄손익계산서에는 기계장치처분이익 ￦10,000과 감가상각비(기계장치) ￦40,000이 보고되었다. 당기 중 취득 및 처분거래는 모두 현금거래이다. (주)세무의 당기 중 기계장치 관련 거래가 현금흐름표상 투자활동 현금흐름에 미치는 순효과는?",
  choices:["현금유출 ￦30,000","현금유출 ￦60,000","현금유출 ￦70,000","현금유입 ￦30,000","현금유입 ￦70,000"],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-4", subject:"회계학개론", year:2024, no:4, law:"회계학개론", unit:"금융부채·사채", kind:"calc",
  stem:"(주)세무는 20×1년 초 상각후원가로 측정하는 금융부채에 해당하는 사채(액면금액 ￦1,000,000, 표시이자율 8%, 만기 5년, 매년 말 원금 ￦200,000씩 연속 상환, 매년 말 이자지급)를 발행하였다. 20×1년 말과 20×2년 말 원금과 이자는 정상적으로 지급하였으나 20×3년 초 재무위기가 발생하여 채권자들의 동의를 받아 사채의 조건을 변경(무이자로 20×5년 말 원금 ￦600,000 일시 상환)하였다. 시장이자율이 각각 20×1년 초 10%, 20×3년 초 12%이고 조건변경과 관련한 수수료는 발생하지 않았을 때, 동 사채에 관한 설명으로 옳은 것은? (단, 사채발행시 거래원가는 발생하지 않았으며, 현가계수표 1~5기간 제시)",
  choices:["20×1년 초 사채의 발행금액은 ￦924,164이다.","20×2년도 인식할 이자비용은 ￦96,681이다.","20×3년 초 조건 변경 시 제거될 사채의 장부금액은 ￦601,920이다.","20×3년 초 조건 변경 시 새로 인식할 사채의 장부금액은 ￦450,780이다.","20×3년 초 조건 변경으로 인해 인식될 조정이익은 ￦152,401이다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-5", subject:"회계학개론", year:2024, no:5, law:"회계학개론", unit:"금융부채·사채", kind:"calc",
  stem:"(주)세무는 20×1년 초 다음과 같은 조건의 비분리형 신주인수권부사채를 액면발행하였다.\n\n○ 액면금액: ￦1,000,000 ○ 표시이자율: 5%(매년 말 지급) ○ 사채발행시 신주인수권이 부여되지 않은 일반사채의 시장이자율: 10% ○ 만기상환일: 20×3년 말 ○ 행사가격: 사채액면금액 ￦20,000당 보통주 1주(액면금액 ￦10,000)를 ￦20,000에 인수 ○ 행사기간: 발행일로부터 12개월이 경과한 날부터 상환기일 30일 전까지 ○ 상환조건: 신주인수권 미행사시 상환기일에 액면금액의 115%를 일시상환 ○ 신주인수권(지분상품에 해당)이 행사된 부분은 주식발행초과금으로 대체되며, 만기 때까지 신주인수권부사채는 상환되지 않음\n\n20×2년 초 상기 신주인수권의 40%가 행사되었으며, 이후 신주인수권이 행사되지 않았을 때, 동 사채에 관한 설명으로 옳은 것은? (현가계수표 1~3기간 제시: 단일금액 5%=0.9524/0.9070/0.8638, 10%=0.9091/0.8265/0.7513, 정상연금 5%=0.9524/1.8594/2.7233, 10%=0.9091/1.7355/2.4869)",
  choices:["20×1년 초 인식된 신주인수권대가는 ￦124,355이다.","20×1년도 이자비용은 ￦87,565이다.","20×2년 초 신주인수권 행사시 자본 증가액은 ￦454,254이다.","20×2년 초 신주인수권 행사 직후 상환할증금을 포함한 사채의 장부금액은 ￦1,037,174이다.","20×2년도 이자비용은 ￦98,758이다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-6", subject:"회계학개론", year:2024, no:6, law:"회계학개론", unit:"주식기준보상", kind:"calc",
  stem:"(주)세무는 20×1년 초 종업원 100명에게 각각 주식선택권을 10개씩 부여하였다. 주식선택권은 3년간 종업원이 용역을 제공하는 조건으로 부여되었으며, 주식선택권의 만기는 6년이다. 주식의 주당 액면금액은 ￦40이고, 주식선택권의 행사가격은 ￦50, 부여일 현재 기업의 주가도 주당 ￦50이다. (주)세무는 부여일 현재 종업원으로부터 제공받는 근로용역의 공정가치와 주식선택권의 공정가치를 신뢰성 있게 측정할 수 없다고 판단하여 내재가치법을 적용하기로 하였다. 행사된 주식선택권은 모두 회계연도 말에 행사되었으며, 주식선택권과 관련된 자료가 다음과 같을 때, (주)세무가 (A)20×3년도에 인식할 보상비용과 (B)20×4년 말 재무상태표에 보고할 주식선택권은?\n\n○ 20×1년 중 실제퇴사자는 5명이며, 20×1년 말 추정한 미래 예상퇴사자는 12명이다.\n○ 20×2년 중 실제퇴사자는 8명이며, 20×2년 말 추정한 미래 예상퇴사자는 7명이다.\n○ 20×3년 중 실제퇴사자는 15명이며, 주식선택권 최종 가득자는 72명이다.\n○ 매 연도말 주가와 행사된 주식선택권 수량: 20×1년 ￦53/-, 20×2년 55/-, 20×3년 60/-, 20×4년 70/400개, 20×5년 65/100, 20×6년 80/220",
  choices:["(A)￦3,000 (B)￦6,400","(A)￦4,533 (B)￦6,400","(A)￦4,533 (B)￦7,200","(A)￦7,200 (B)￦10,400","(A)￦7,200 (B)￦14,400"],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-7", subject:"회계학개론", year:2024, no:7, law:"회계학개론", unit:"사업결합·연결", kind:"concept",
  stem:"투자자의 피투자자에 대한 지배력을 설명한 것으로 옳지 않은 것은?",
  choices:["투자자는 피투자자에 관여함에 따라 변동이익에 노출되거나 변동이익에 대한 권리가 있고, 피투자자에 대한 자신의 힘으로 변동이익에 영향을 미치는 능력이 있을 때 피투자자를 지배한다.","둘 이상의 투자자가 관련 활동을 지시하기 위해 함께 행동해야 하는 경우 어떠한 투자자도 다른 투자자의 협력 없이 관련 활동을 지시할 수 없으므로 어느 누구도 개별적으로 피투자자를 지배하지 못한다.","투자자가 피투자자의 이익에 유의적으로 영향을 미치는 활동 등 관련 활동을 지시하는 현재의 능력을 갖게 하는 현존 권리를 보유하고 있을 때, 투자자는 피투자자에 대한 힘이 있다.","투자자는 피투자자에 대한 힘이 있거나 투자자의 이익금액에 영향을 미치기 위하여 피투자자에 대한 자신의 힘을 사용하는 능력이 있을 때 피투자자를 지배한다.","둘 이상의 투자자 각각이 다른 관련 활동을 지시하는 일방적인 능력을 갖게 하는 현존 권리를 보유하는 경우, 피투자자의 이익에 가장 유의적으로 영향을 미치는 활동을 지시하는 현재의 능력이 있는 투자자는 피투자자에 대한 힘이 있다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-8", subject:"회계학개론", year:2024, no:8, law:"회계학개론", unit:"수익인식", kind:"calc",
  stem:"(주)세무는 제품 A를 ￦2,000에 판매하기로 계약을 체결하였으며, 이 계약의 일부로 앞으로 30일 이내에 ￦2,000 한도의 구매에 대해 30% 할인권을 고객에게 주었다. (주)세무는 계절 판촉활동을 위해 앞으로 30일 동안 모든 판매에 대해 10% 할인을 제공할 계획인데, 10% 할인은 30% 할인권에 추가하여 사용할 수 없다. (주)세무는 고객의 80%가 할인권을 사용하고 추가 제품을 평균 ￦1,500에 구매할 것이라고 추정하였을 때, 제품 판매 시 배분될 계약부채(할인권)는? (단, 제시된 거래의 효과만을 반영하기로 한다.)",
  choices:["￦214","￦240","￦305","￦400","￦500"],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-9", subject:"회계학개론", year:2024, no:9, law:"회계학개론", unit:"재고자산", kind:"concept",
  stem:"재고자산 회계처리에 관한 설명으로 옳은 것은?",
  choices:["재고자산의 매입원가는 매입가격에 수입관세와 제세금, 매입운임, 하역료 그리고 완제품, 원재료 및 용역의 취득과정에 직접 관련된 기타 원가, 리베이트 및 기타 유사한 항목을 가산한 금액이다.","재고자산을 후불조건으로 취득할 때 그 계약이 실질적인 금융요소를 포함하고 있다면, 정상신용조건의 매입가격과 실제 지급액간의 차이는 재고자산의 취득원가에 가산한다.","확정판매계약 또는 용역계약만을 이행하기 위하여 보유하는 재고자산의 순실현가능가치는 일반 판매가격에 기초하여 추정한다.","원재료 가격이 하락하여 원재료 원가가 순실현가능가치를 초과할 것으로 예상된다면 완성될 제품이 원가 이상으로 판매되더라도 해당 원재료를 현행대체원가로 측정된 순실현가능가치로 감액한다.","재고자산의 감액을 초래했던 상황이 해소되거나 경제상황의 변동으로 순실현가능가치가 상승한 명백한 증거가 있는 경우 최초의 장부금액을 초과하지 않는 범위 내에서 평가손실을 환입한다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-10", subject:"회계학개론", year:2024, no:10, law:"회계학개론", unit:"재고자산", kind:"calc",
  stem:"20×1년 초 설립된 (주)세무는 단일상품만 판매하고 있으며, 재고자산에 대하여 가중평균법(실지재고조사법)을 적용하고 있고, 기말 장부상재고와 실제재고를 함께 확인한다.\n\n일자/적요/수량/단위당원가: 1월10일 매입 300개/￦100, 3월20일 매출 200개/-, 6월15일 매입 300/120, 10월16일 매입 400/130, 12월7일 매출 400/-\n\n20×1년 말 재고자산의 단위당 순실현가능가치는 ￦110이며, 20×1년도 재고자산평가손실은 ￦2,960일 때, (주)세무가 20×1년도 재무제표에 보고할 매출원가는? (단, 감모의 80%는 정상감모이며, 정상감모손실과 재고자산평가손실은 매출원가에 반영하고, 비정상감모손실은 기타비용으로 처리한다.)",
  choices:["￦70,800","￦71,508","￦73,632","￦76,592","￦77,300"],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-11", subject:"회계학개론", year:2024, no:11, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무는 20×1년 12월 말에 다음의 자산집단을 매각방식으로 처분하기로 하였고, 이는 매각예정의 분류기준을 충족한다. 처분자산집단에 속한 자산은 다음과 같이 측정한다.\n\n구분/매각예정 분류 전 12월말 장부가액/매각예정 분류 직전 재측정한 장부가액\n재고자산 ￦1,100/￦1,000, 기타포괄손익-공정가치측정 금융자산 1,300/1,000, 유형자산I(재평가액) 1,200/1,000, 유형자산II(원가) 3,400/3,000, 영업권 1,000/1,000, 합계 ￦8,000/￦7,000\n\n한편, (주)세무는 매각예정으로 분류하는 시점에서 처분자산집단의 순공정가치를 ￦4,000으로 추정하였다. 20×1년 12월 말 손상차손 배분 후, 재고자산과 유형자산Ⅱ의 장부금액은?",
  choices:["재고자산￦500, 유형자산Ⅱ￦1,500","재고자산￦500, 유형자산Ⅱ￦2,500","재고자산￦500, 유형자산Ⅱ￦3,000","재고자산￦1,000, 유형자산Ⅱ￦1,500","재고자산￦1,000, 유형자산Ⅱ￦2,500"],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-12", subject:"회계학개론", year:2024, no:12, law:"회계학개론", unit:"투자부동산", kind:"concept",
  stem:"투자부동산의 회계처리에 관한 설명으로 옳지 않은 것은?",
  choices:["투자부동산의 손상, 멸실 또는 포기로 제3자에게서 받는 보상은 받을 수 있게 되는 시점에 당기손익으로 인식한다.","투자부동산을 후불조건으로 취득하는 경우의 원가는 취득시점의 현금가격상당액으로 하고, 현금가격상당액과 실제 총지급액의 차액은 신용기간 동안의 이자비용으로 인식한다.","지배기업이 보유하고 있는 건물을 종속기업에게 리스하여 종속기업의 본사 건물로 사용하는 경우 그 건물은 지배기업의 연결재무제표상에서 투자부동산으로 분류할 수 없다.","부동산 중 일부는 시세차익을 얻기 위하여 보유하고, 일부분은 재화의 생산에 사용하기 위하여 보유하고 있으나, 이를 부분별로 나누어 매각할 수 없다면, 재화의 생산에 사용하기 위하여 보유하는 부분이 중요하다고 하더라도 전체 부동산을 투자부동산으로 분류한다.","투자부동산을 공정가치로 측정해 온 경우라면 비교할만한 시장의 거래가 줄어들거나 시장가격 정보를 쉽게 얻을 수 없게 되더라도, 당해 부동산을 처분할 때까지 또는 자가사용부동산으로 대체하거나 통상적인 영업과정에서 판매하기 위하여 개발을 시작하기 전까지는 계속하여 공정가치로 측정한다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-13", subject:"회계학개론", year:2024, no:13, law:"회계학개론", unit:"무형자산", kind:"concept",
  stem:"무형자산의 회계처리에 관한 설명으로 옳지 않은 것은?",
  choices:["무형자산의 미래경제적효익은 제품의 매출, 용역수익, 원가절감 또는 자산의 사용에 따른 기타 효익의 형태로 발생할 수 있다.","내부적으로 창출한 영업권은 원가를 신뢰성 있게 측정할 수 없고 기업이 통제하고 있는 식별가능한 자원이 아니기 때문에 자산으로 인식하지 아니한다.","자산의 사용에서 발생하는 미래경제적효익의 유입에 대한 확실성 정도에 대한 평가는 무형자산을 최초로 인식하는 시점에서 이용 가능한 증거에 근거하며, 외부 증거에 비중을 더 크게 둔다.","계약상 권리 또는 기타 법적 권리로부터 발생하는 무형자산의 내용연수는 그러한 계약상 권리 또는 기타 법적 권리의 기간을 초과할 수는 없지만, 자산의 예상사용기간에 따라 더 짧을 수는 있다.","개별 취득하는 무형자산의 원가는 그 자산을 경영자가 의도하는 방식으로 운용될 수 있는 상태에 이를 때까지 인식하므로 무형자산을 사용하거나 재배치하는 데 발생하는 원가도 자산의 취득원가에 포함한다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-14", subject:"회계학개론", year:2024, no:14, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"도소매업을 영위하는 (주)세무는 20×1년 1월 1일 기계장치를 ￦2,000(잔존가치 ￦200, 내용연수 5년, 정액법 상각)에 취득하고 재평가모형을 적용한다. 기계장치의 20×1년 말 공정가치와 회수가능액은 각각 ￦1,800으로 동일하였으나, 20×2년 말 공정가치는 ￦1,300이고 회수가능액은 ￦1,100으로 자산손상이 발생하였다. 동 기계장치와 관련하여 (주)세무가 20×2년도 포괄손익계산서에 당기비용으로 인식할 금액은? (단, 재평가잉여금은 이익잉여금으로 대체하지 아니하며, 처분부대원가는 무시할 수 없는 수준이다.)",

  stem:"도소매업을 영위하는 (주)세무는 20×1년 1월 1일 지방자치단체로부터 자금을 전액 차입하여 기계장치를 ￦50,000에 구입하였다. 지방자치단체로부터 수령한 차입금은 20×5년 12월 31일에 상환해야 하며, 매년 말에 연 1% 이자율로 계산한 액면이자를 지급하는 조건이다. (주)세무가 구입한 기계장치에 원가모형을 적용하고, 추정내용연수는 5년, 잔존가치는 ￦0이며 정액법으로 감가상각한다. 20×1년 1월 1일 구입당시의 시장이자율은 10%이다. (주)세무가 20×3년도 포괄손익계산서에 당기비용으로 인식할 금액은? (단, 현가계수표: 5기간 단일금액10%=0.6209, 정상연금10%=3.7908. 정부보조금은 전액 기계장치의 구입에만 사용하여야 하며, 자산의 취득원가에서 차감하는 원가(자산)차감법을 사용하여 표시한다.)",

{ id:"hg2024-16", subject:"회계학개론", year:2024, no:16, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무는 20×1년 4월 1일부터 공장건물 신축공사를 실시하여 20×2년 10월 31일에 해당 공사를 완료하였다. 동 공장건물은 차입원가를 자본화하는 적격자산이다.\n\n구분/공사대금 지출액: 20×1.4.1. ￦100,000, 20×1.11.1. ￦30,000, 20×2.2.1. ￦20,000, 20×2.7.1. ￦20,000\n\n종류/차입금액/차입기간/이자율: 특정차입금A ￦90,000/20×1.4.1~20×2.10.31/3%, 일반차입금B 60,000/20×1.5.1~20×2.8.30/5%, 일반차입금C 30,000/20×1.9.1~20×2.4.30/10%\n\n(주)세무는 특정차입금 중 ￦30,000을 연 2% 이자지급조건의 정기예금에 20×1년 5월 1일부터 20×1년 7월 31일까지 예치하였다. (주)세무가 20×1년도와 20×2년도에 자본화할 차입원가는? (단, 연평균지출액과 이자비용은 월할 계산하며, 자본화한 차입원가는 연평균지출액 계산 시 포함하지 아니한다.)",
  choices:["20×1년￦3,075, 20×2년￦5,250","20×1년￦3,075, 20×2년￦5,550","20×1년￦4,875, 20×2년￦4,875","20×1년￦4,875, 20×2년￦5,250","20×1년￦4,875, 20×2년￦5,550"],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-17", subject:"회계학개론", year:2024, no:17, law:"회계학개론", unit:"충당부채", kind:"calc",
  stem:"(주)세무는 20×1년 초에 한정 생산ㆍ판매한 제품에 대하여 3년 동안 품질을 보증하기로 하였다. 20×1년 중 실제 발생한 품질보증비는 ￦10,000이다. (주)세무는 기대가치를 계산하는 방식으로 최선의 추정치 개념을 사용하여 충당부채를 인식한다. (주)세무는 이 제품의 품질보증과 관련하여 20×1년 말에 20×2년 및 20×3년에 발생할 것으로 예상되는 품질보증비 및 예상확률을 다음과 같이 추정하였다.\n\n20×2년: 품질보증비￦1,800(20%), 3,000(50%), 7,000(30%)\n20×3년: 품질보증비￦3,000(30%), 4,000(60%), 5,000(10%)\n\n(주)세무는 20×2년 및 20×3년에 발생할 것으로 예상되는 품질보증비에 대해 설정하는 충당부채를 10%의 할인율을 적용하여 현재가치로 측정하기로 하였다. 또한 (주)세무는 20×2년도에 ￦1,000의 영업손실이 발생할 것으로 예상하고 있다. (주)세무의 20×1년 말 재무상태표에 보고될 제품보증충당부채는? (현가계수표 10%: 1기간0.9091, 2기간0.8264, 3기간0.7513. 20×2년과 20×3년에 발생할 것으로 예상되는 품질보증비는 각 회계연도말에 발생한다고 가정한다.)",
  choices:["￦6,360","￦6,740","￦7,360","￦7,740","￦8,360"],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-18", subject:"회계학개론", year:2024, no:18, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무는 20×1년 7월 1일에 순장부금액이 ￦7,000인 기계장치를 (주)국세의 기계장치(순장부금액 ￦8,000, 공정가치 ￦9,000)와 교환하면서 현금 ￦500을 추가로 지급하였으며, 유형자산처분손실로 ￦1,000을 인식하였다. (주)세무는 20×1년 7월 1일에 교환으로 취득한 기계장치와 관련하여 설치장소 준비원가 ￦500과 설치원가 ￦500을 지출하고 즉시 사용하였다. 한편, (주)세무는 취득한 기계장치의 잔존가치와 내용연수를 각각 ￦500과 3년으로 추정하였으며, 연수합계법으로 감가상각하고 원가모형을 적용한다. (주)세무의 20×2년도 기계장치 감가상각비는? (단, 동 자산의 교환은 상업적 실질이 있으며, (주)세무의 기계장치 공정가치는 신뢰성 있게 측정가능하고 (주)국세의 기계장치 공정가치보다 명백하다고 가정한다. 감가상각은 월할 계산한다.)",
  choices:["￦1,750","￦2,000","￦2,333","￦2,917","￦3,500"],

{ id:"hg2024-19", subject:"회계학개론", year:2024, no:19, law:"회계학개론", unit:"주당이익", kind:"calc",
  stem:"(주)세무의 20×1년도 당기순이익은 ￦10,000,000이며, 주당이익과 관련된 자료는 다음과 같다.\n\n○ 20×1년 초 유통보통주식수는 10,000주(주당 액면금액 ￦5,000)이고, 유통우선주식수는 5,000주(주당 액면금액 ￦5,000)이다.\n○ 상기 우선주는 전환우선주로서 누적적이며 배당률은 10%이다.\n○ 3월 1일 주주총회에서 보통주 8,000주의 주식배당을 의결하고 즉시 발행하였다.\n○ 4월 1일에 유상증자를 실시하여 보통주 4,000주가 증가하였다. 동 유상증자에 대한 주당 발행금액은 ￦5,000이며, 유상증자 직전 공정가치는 주당 ￦10,000이다. 발행금액 전액이 발행일에 납입완료되었다.\n○ 9월 1일에 자기주식 4,350주를 취득하여 20×1년 말까지 보유하고 있다.\n○ 12월 31일 상기 전환우선주 전액이 주식으로 전환청구되어 보통주 5,000주를 발행하였다.\n○ 기중에 전환된 전환우선주에 대해서는 전환일까지의 기간에 대해 우선주 배당금을 지급한다.\n\n(주)세무의 20×1년도 기본주당이익은? (단, 가중평균유통보통주식수는 월할 계산한다.)",
  choices:["￦375","￦384","￦405","￦500","￦512"],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-20", subject:"회계학개론", year:2024, no:20, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"중간재무보고에 관한 설명으로 옳지 않은 것은?",
  choices:["직전 연차재무보고서를 연결기준으로 작성하였다면 중간재무보고서도 연결기준으로 작성해야 한다.","중간재무보고서에 포함해야 하는 최소한의 구성요소는 요약재무상태표, 요약된 하나 또는 그 이상의 포괄손익계산서, 요약자본변동표, 요약현금흐름표이다.","중간재무보고서에는 직전 연차보고기간말 후 발생한 재무상태와 경영성과의 변동을 이해하는 데 유의적인 거래나 사건에 대한 설명을 포함한다.","중요성을 평가하는 과정에서 중간기간의 측정은 연차재무자료의 측정에 비하여 추정치에 의존하는 정도가 크다는 점을 고려하여야 한다.","계절적, 주기적 또는 일시적으로 발생하는 수익은 연차보고기간말에 미리 예측하여 인식하거나 이연하는 것이 적절하지 않은 경우 중간보고기간말에도 미리 예측하여 인식하거나 이연하여서는 아니된다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-21", subject:"회계학개론", year:2024, no:21, law:"회계학개론", unit:"리스", kind:"calc",
  stem:"(주)세무는 20×1년 1월 1일 (주)대한리스로부터 기계장치(기초자산)를 리스하는 해지금지조건의 금융리스계약을 체결하였다. 계약상 리스개시일은 20×1년 1월 1일, 리스기간은 20×1년 1월 1일부터 20×3년 12월 31일, 내재이자율은 연 10%, 고정리스료는 매년 말 일정금액을 지급한다. (주)대한리스의 동 기계장치 취득금액은 ￦2,000,000으로 리스개시일의 공정가치이다. 동 기계장치의 내용연수는 4년, 내용연수 종료시점의 잔존가치는 없고, 정액법으로 감가상각한다. (주)세무는 리스기간 종료시점에 매수선택권을 ￦400,000에 행사할 것이 리스약정일 현재 상당히 확실하다. (주)대한리스가 리스기간 동안 매년 말 수취하는 연간 고정리스료는? (현가계수표 10%: 3기간 단일금액0.7513/정상연금2.4869, 4기간 단일금액0.6830/정상연금3.1699)",
  choices:["￦544,749","￦630,935","￦683,373","￦804,214","￦925,055"],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-22", subject:"회계학개론", year:2024, no:22, law:"회계학개론", unit:"법인세회계", kind:"concept",
  stem:"법인세회계에 관한 설명으로 옳지 않은 것은?",
  choices:["이연법인세자산은 차감할 일시적차이, 미사용 세무상결손금의 이월액, 미사용 세액공제 등의 이월액과 관련하여 미래 회계기간에 회수될 수 있는 법인세 금액이다.","매 보고기간말에 인식되지 않은 이연법인세자산에 대하여 재검토하며, 미래 과세소득에 의해 이연법인세자산이 회수될 가능성이 높아진 범위까지 과거 인식되지 않은 이연법인세자산을 인식한다.","당기법인세자산과 부채는 기업이 인식된 금액에 대한 법적으로 집행가능한 상계권리를 가지고 있는 경우 또는 순액으로 결제하거나, 자산을 실현하고 부채를 결제할 의도가 있는 경우에 상계한다.","과세대상수익의 수준에 따라 적용되는 세율이 다른 경우에는 일시적차이가 소멸될 것으로 예상되는 기간의 과세소득(세무상결손금)에 적용될 것으로 기대되는 평균세율을 사용하여 이연법인세 자산과 부채를 측정한다.","사업결합에서 발생한 영업권을 최초로 인식하는 경우에는 이연법인세부채를 인식하지 않는다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-23", subject:"회계학개론", year:2024, no:23, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"일반목적재무보고에 관한 설명으로 옳지 않은 것은?",
  choices:["일반목적재무보고의 목적은 현재 및 잠재적 투자자, 대여자와 그 밖의 채권자가 기업에 자원을 제공하는 것과 관련된 의사결정을 할 때 유용한 보고기업 재무정보를 제공하는 것이다.","일반목적재무보고서는 보고기업의 가치를 보여주기 위해 고안된 것이 아니지만 현재 및 잠재적 투자자, 대여자와 그 밖의 채권자가 보고기업의 가치를 추정하는 데 도움이 되는 정보를 제공한다.","한 기간의 보고기업의 재무성과에 투자자와 채권자에게서 직접 추가 자원을 획득한 것이 아닌 경제적자원 및 청구권의 변동이 반영된 정보는 기업의 과거 및 미래 순현금유입 창출 능력을 평가하는 데 유용하다.","많은 현재 및 잠재적 투자자, 대여자 및 그 밖의 채권자는 정보를 제공하도록 보고기업에 직접 요구하고, 그들이 필요로 하는 재무정보의 많은 부분을 일반목적재무보고서에 의존하는 것은 아니다.","재무보고서는 정확한 서술보다는 상당 부분 추정, 판단 및 모형에 근거한다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-24", subject:"회계학개론", year:2024, no:24, law:"회계학개론", unit:"자본", kind:"calc",

{ id:"hg2024-26", subject:"회계학개론", year:2024, no:26, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 두 개의 보조부문(S1, S2)과 두 개의 제조부문(P1, P2)을 운영하고 있고, 보조부문의 원가를 상호배분법에 의해 배부하고 있다. 각 보조부문의 용역제공비율과 부문에서 발생한 원가는 다음과 같다.\n\n제공\\사용/S1/S2/P1/P2/부문원가: S1 -/20%/40%/40%/￦250,000, S2 20%/-/?/?/￦400,000. 제조부문원가: P1 ￦600,000, P2 ￦500,000.\n\n제조부문 P1과 P2가 보조부문으로부터 배부받은 금액이 각각 ￦231,250과 ￦418,750일 때 보조부문 S2가 제조부문인 P1과 P2에 제공한 용역비율은 각각 얼마인가?",

{ id:"hg2024-27", subject:"회계학개론", year:2024, no:27, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 정상원가계산을 사용하고 있으며, 제조간접원가는 직접노무원가의 50%를 예정배부한다. (주)세무의 20×1년 매출액은 ￦100,000이며, 공장에서 20×1년에 발생한 원가관련 자료는 다음과 같다.\n\n재고자산 현황(기초/기말): 원재료￦5,000/￦10,000, 재공품10,000/25,000, 제품15,000/20,000\n\n○ 당기 중 원재료 구입액은 ￦40,000이다.\n○ 미지급임금의 기초잔액은 ￦10,000이며, 기말잔액은 ￦20,000이다.\n○ 20×1년에 지급한 임금은 ￦40,000이다.\n○ 공장에서 발생한 임금의 80%는 직접노무원가이다.\n○ 20×1년에 발생한 제조경비는 ￦15,000이며, 전액 제조간접원가이다.\n○ 20×1년의 배부차이 조정전 매출원가는 ￦70,000이다.\n(주)세무가 20×1년 말에 제조간접원가 배부차이를 전액 매출원가에서 조정할 경우, 배부차이 조정후 매출총이익은?",
  choices:["￦15,000","￦20,000","￦25,000","￦30,000","￦35,000"],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-28", subject:"회계학개론", year:2024, no:28, law:"회계학개론", unit:"활동기준원가계산", kind:"calc",
  stem:"(주)세무는 제품 A와 B를 생산하고 있으며 직접노무원가를 기준으로 제조간접원가를 배부하고 있다. 배부해야 할 제조간접원가는 ￦81,600이고, 제품 A와 B에 대한 자료는 다음과 같다.\n\n/제품A/제품B: 단위당직접재료원가￦150/￦250, 단위당직접노무원가60/90, 단위당직접노무시간1시간/1시간\n\n(주)세무는 활동기준원가계산의 도입을 고려하고 있으며, 활동/활동원가/원가동인/사용량(A,B): 재료이동￦21,000/이동횟수/50회,20회, 작업준비21,600/작업준비시간/80시간,100시간, 검사39,000/생산량/200단위,400단위\n\n(주)세무가 활동기준원가계산을 도입할 경우, 기존의 제조간접원가 배부방법에 비해 제품 A의 단위당 제조간접원가는 얼마나 증가하는가?",

{ id:"hg2024-29", subject:"회계학개론", year:2024, no:29, law:"회계학개론", unit:"종합원가계산", kind:"calc",
  stem:"(주)세무는 단일제품을 생산하고 있으며 가중평균법으로 종합원가계산을 적용하고 있다. 전환원가는 공정 전반에 걸쳐 균등하게 발생하며 당기 생산관련 자료는 다음과 같다.\n\n○ 기초재공품: 1,000단위(전환원가 완성도 20%)\n○ 당기착수량: 7,000\n○ 당기완성량: 6,000\n○ 기말재공품: 2,000(전환원가 완성도 40%)\n\n기초 및 기말재공품에 포함된 전환원가가 각각 ￦65,000 및 ￦260,000일 때, 당기에 발생한 전환원가는?",

{ id:"hg2024-30", subject:"회계학개론", year:2024, no:30, law:"회계학개론", unit:"종합원가계산", kind:"calc",
  stem:"(주)세무는 단일제품을 생산하고 있으며, 선입선출법에 의한 종합원가계산을 사용하고 있다. 제품제조를 위해 원재료 A와 원재료 B가 사용되는데 원재료 A는 공정초에 전량 투입되며, 원재료 B는 공정 완료시점에 전량 투입된다. 전환원가는 공정 전반에 걸쳐 균등하게 발생한다. 품질검사는 공정의 50% 시점에서 이루어지며, 당기 검사를 통과한 합격품의 10%를 정상공손으로 간주한다. 공손품의 처분가치는 없다.\n\n구분/물량(전환원가완성도): 기초재공품 1,000단위(60%), 당기착수 9,000, 기말재공품 1,000(60%)\n\n구분/원재료A/원재료B/전환원가: 기초재공품￦30,000/￦0/￦33,500, 당기발생원가180,000/80,000/255,000\n\n당기에 착수하여 당기에 완성된 제품이 7,000단위일 때, (주)세무의 정상공손원가 배분 후 당기 완성품원가는?",
  choices:["￦466,500","￦523,500","￦530,000","￦533,500","￦540,000"],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2024-31", subject:"회계학개론", year:2024, no:31, law:"회계학개론", unit:"결합원가계산", kind:"calc",
  stem:"(주)세무는 결합공정을 통하여 주산품 X, Y와 부산품 B를 생산하고 있다. 당기 중 발생한 결합원가는 ￦20,000이며, 결합원가는 분리점에서 순실현가능가치(NRV)를 기준으로 각 제품에 배부한다. 부산품 B는 생산기준법(생산시점에서 순실현가능가치로 인식)을 적용하며, 부산품 B의 단위당 판매비는 ￦5이다.\n\n제품/분리점이후추가가공원가(총액)/단위당최종판매가격/생산량/판매량: X ￦4,000/￦60/200단위/180단위, Y 2,000/40/250/200, B -/15/200/150\n\n(주)세무의 기말재고자산 금액은? (단, 기초재고와 기말재공품은 없다.)",

{ id:"hg2024-33", subject:"회계학개론", year:2024, no:33, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 당기에 신제품을 개발하여 지금까지 2,000단위를 생산 및 판매하였으며, 처음 1,000단위 생산에 소요된 원가는 다음과 같다.\n\n○ 직접재료원가 ￦400,000 ○ 직접노무원가(1,000시간×￦2,000) 2,000,000 ○ 변동제조간접원가(직접노무원가의 50%) 1,000,000 ○ 고정제조간접원가 3,200,000\n\n(주)세무의 제품 생산은 80%의 누적평균시간 학습곡선을 따른다고 가정한다. 최근 공공기관으로부터 신제품 2,000단위를 주문받았다. 이 주문에 대해 발생할 것으로 예상되는 변동제조원가 총액은?",

{ id:"hg2024-34", subject:"회계학개론", year:2024, no:34, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 제품 X와 Y를 생산 및 판매하고 있으며, 제품에 관한 자료는 다음과 같다.\n\n/제품X/제품Y: 판매량배합비율 20%/80%, 단위당공헌이익￦300/￦200, 손익분기점판매량 600단위/2,400단위\n\n(주)세무는 신제품 Z를 개발하여 생산 및 판매할 계획을 수립하고 있다. 제품 Z의 단위당 공헌이익은 ￦220이며 제품 X, Y, Z의 판매량 배합비율은 각각 30%, 20%, 50%일 것으로 예상된다. 제품 Z를 추가 생산할 경우 제품 Y의 손익분기점 판매량은? (단, 제품 Z를 생산하더라도 제품 X와 제품 Y의 단위당 공헌이익, 고정원가 총액은 변하지 않는다.)",

  stem:"(주)세무는 고급생수를 단위당 ￦2,000에 판매하려 한다. 단위당 변동원가는 ￦1,000이며, 월간 고정원가는 ￦3,000,000이다. 고급생수의 수요량은 불확실하지만 월간 기대판매량이 4,200개, 표준편차는 800개의 정규분포를 따른다고 가정할 때, 월간 목표영업이익이 ￦400,000 이상 발생할 확률은? (표준정규분포표: z=0.5→0.691, 1.0→0.841, 1.5→0.933, 2.0→0.977, 2.5→0.994, 3.0→0.999)",

{ id:"hg2025-7", subject:"회계학개론", year:2025, no:7, law:"회계학개론", unit:"생물자산", kind:"concept",
  stem:"생물자산의 인식과 측정에 관한 설명으로 옳지 않은 것은?",
  choices:["생물자산이나 수확물을 미래 일정시점에 판매하는 계약을 체결할 경우, 공정가치는 시장에 참여하는 구매자와 판매자가 거래하게 될 현행시장의 상황을 반영하기 때문에 계약가격이 공정가치의 측정에 반드시 목적적합한 것은 아니다.","생물자산의 공정가치에서 처분부대원가를 뺀 금액을 산정할 때에 추정 매각부대원가를 차감하기 때문에 생물자산의 최초 인식시점에 손실이 발생할 수 있다.","당해 자산에 대한 자금 조달 또는 수확 후 생물자산의 복구 관련 현금흐름은 생물자산의 원가에 포함된다.","생물자산을 최초 인식시점에 공정가치에서 처분부대원가를 뺀 금액으로 인식하여 발생하는 평가손익과 생물자산의 공정가치에서 처분부대원가를 뺀 금액의 변동으로 발생하는 평가손익은 발생한 기간의 당기손익에 반영한다.","기업이 특정 농림어업활동에 종사하지 못하게 요구하는 경우를 포함하여 공정가치에서 처분부대원가를 뺀 금액으로 측정하는 생물자산과 관련된 정부보조금에 부수되는 조건이 있는 경우에는 그 조건을 충족하는 시점에만 당기손익으로 인식하되, 시간의 경과에 따라 보조금의 일부가 기업에 귀속될 수 있는 경우에는 시간의 경과에 따라 그 정부보조금을 당기손익으로 인식한다."],
  answer:3, status:"clear", note:"" },

{ id:"hg2025-9", subject:"회계학개론", year:2025, no:9, law:"회계학개론", unit:"주식기준보상", kind:"concept",
  stem:"주식기준보상에 관한 설명으로 옳지 않은 것은?",
  choices:["주식결제형 주식기준보상거래에서 시장조건이 아닌 가득조건이 충족되지 못하여 부여한 지분상품이 가득되지 못한다면, 누적기준으로 볼 때 제공받은 재화나 용역에 대해 어떠한 금액도 인식하지 아니한다.","주식결제형 주식기준보상거래에서 시장조건이 있는 지분상품을 부여한 때에는 그 시장조건이 충족되는지에 관계없이 다른 모든 가득조건을 충족하는 거래상대방에게서 제공받는 재화나 용역을 인식한다.","주식결제형 주식기준보상거래에서 비가득조건이 있는 지분상품을 부여하면 그러한 비가득조건이 충족되는지에 관계없이 시장조건이 아닌 모든 가득조건을 충족하는 거래상대방에게서 제공받는 재화나 용역을 인식한다.","가득기간 이후에 현금결제형 주식기준보상거래의 조건이 변경되어 주식결제형으로 변경되는 경우, 그 주식결제형 주식기준보상거래에서 지분상품은 가득기간 종료일을 기준으로 공정가치를 측정하여 자본으로 회계처리한다.","기업이 현금이나 지분상품발행으로 결제할 수 있는 선택권을 갖는 조건이 있는 주식기준보상거래의 경우에는, 현금을 지급해야 하는 현재의무가 있는지를 결정하고 그에 따라 주식기준보상거래를 회계처리한다."],
  answer:4, status:"clear", note:"" },
{ id:"hg2025-10", subject:"회계학개론", year:2025, no:10, law:"회계학개론", unit:"충당부채", kind:"concept",
  stem:"구조조정 관련 충당부채에 관한 설명으로 옳은 것은?",
  choices:["새로운 제도와 물류체계의 구축에 대한 투자원가는 구조조정충당부채에 포함한다.","구조조정의 일환으로 자산의 매각을 계획하는 경우 구조조정과 관련하여 예상되는 자산 처분이익은 구조조정충당부채 측정 시 구조조정충당부채로 인식할 수 있는 지출과 상계한다.","기업의 계속적인 활동과 관련한 지출은 구조조정충당부채로 인식할 수 있는 지출에 포함한다.","구조조정에서 생기는 간접비용은 구조조정충당부채로 인식할 수 있는 지출에 포함한다.","구조조정을 완료하는 날까지 생길 것으로 예상되는 영업손실은 충당부채로 인식하지 않지만, 손실부담계약과 관련된 예상 영업손실은 충당부채로 인식한다."],
  answer:5, status:"clear", note:"" },
{ id:"hg2025-11", subject:"회계학개론", year:2025, no:11, law:"회계학개론", unit:"종업원급여", kind:"concept",
  stem:"종업원급여에 관한 설명으로 옳지 않은 것은?",
  choices:["단기종업원급여에 해당하는 누적 유급휴가의 예상원가는 종업원이 휴가를 실제로 사용할 때 인식한다.","이익분배제도와 상여금제도에 따라 기업이 부담하는 의무는 종업원이 제공하는 근무용역에서 생기는 것이지 주주와의 거래에서 생기는 것은 아니므로, 이익분배제도와 상여금제도와 관련된 원가는 이익분배가 아닌 당기 비용으로 인식한다.","퇴직급여채무를 할인하기 위해 사용하는 할인율은 보고기간 말 현재 우량회사채의 시장수익률을 참조하여 결정하되, 그러한 우량회사채에 대해 거래층이 두터운 해당 통화의 시장이 없는 경우에는 보고기간 말 현재 그 통화로 표시된 국공채의 시장수익률을 사용한다.","자산인식상한효과의 이자는 순확정급여부채(자산)의 순이자에 포함되며, 당기손익으로 인식한다.","퇴직급여가 아닌 기타장기종업원급여의 재측정요소는 기타포괄손익으로 인식하지 않는다."],
  answer:1, status:"clear", note:"" },

  stem:"(주)세무의 당기손익-공정가치 측정 금융자산과 관련된 자료가 다음과 같을 때, 동 금융자산에 대한 회계처리가 20×1년도와 20×2년도의 당기순이익에 미치는 영향의 합계액은? (단, 금융자산의 단가 계산 시 이동평균법을 적용한다.)\n\n일자 / 내역\n20×1년 12월 1일 / A사가 발행한 A주식(주당 액면금액 ￦3,000) 100주를 주당 ￦4,000(공정가치)에 현금으로 구입하고, 취득수수료로 주당 ￦80을 별도로 지급함\n20×1년 12월 31일 / A주식의 기말 주당 공정가치는 ￦5,000, 예상 처분 관련 거래원가는 주당 ￦100임\n20×2년 3월 15일 / A사는 현금배당(주당 ￦150)과 주식배당(주당 0.2주)을 결의 및 실시하였으며, 이에 따라 (주)세무는 현금 ￦15,000과 A주식 20주를 수령함. 당일 A주식의 주당 공정가치는 ￦5,000임\n20×2년 7월 1일 / A주식의 50%를 주당 ￦6,000에 현금으로 처분하였으며, 처분 관련 거래원가로 주당 ￦120을 별도로 지급함\n20×2년 10월 1일 / A사는 무상증자(주당 0.1주)를 결의 및 실시하였으며, 이에 따라 (주)세무가 현재 보유한 A주식의 수가 10% 증가함. 당일 A주식의 주당 공정가치는 ￦6,000임\n20×2년 12월 31일 / A주식의 기말 주당 공정가치는 ￦7,000, 예상 처분 관련 거래원가는 주당 ￦140임",

  stem:"(주)세무의 20×1년도 주당이익과 관련된 자료는 다음과 같다.\n\n○ 20×1년 1월 1일 (주)세무의 유통보통주식수는 10,000주이다.\n○ (주)세무는 20×1년 1월 1일 사업결합과 관련하여 20×1년도와 20×2년도의 당기순이익 평균이 ￦1,050,000을 초과하면, 매 초과액 ￦3,000당 보통주 1주를 발행하기로 합의하였다.\n○ 20×1년 1월 1일 (주)세무는 신주인수권 1,000개를 부여하였으며, 동 신주인수권 1개당 보통주 1주를 인수할 수 있다. 신주인수권의 개당 행사가격은 ￦4,000이고 20×1년도 보통주식의 주당 시장가격은 다음과 같다.\n  4월 1일 종가 ￦4,000 / 12월 31일 종가 ￦6,000 / 1월 1일 ~ 12월 31일 평균주가 ￦5,000\n  20×1년 9월 1일에 신주인수권 600개가 행사되어 (주)세무는 보통주 600주를 발행하였다.\n○ 20×1년도 당기순이익은 ￦1,470,000이다.\n\n(주)세무의 20×1년도 포괄손익계산서에 표시될 희석주당이익은? (단, 가중평균유통보통주식수는 월할 계산한다.)",

{ id:"hg2025-20", subject:"회계학개론", year:2025, no:20, law:"회계학개론", unit:"수익인식", kind:"calc",
  stem:"(주)세무는 20×1년 초 고객에게 기계장치를 납품하고 기계장치에 대해 유지보수용역을 5년간 제공하기로 약속하였다. (주)세무는 기계장치와 유지보수용역을 보통 따로 판매하지는 않으며, 기계장치와 5년간의 유지보수용역을 함께 제공하는 조건으로 고객과 거래가격을 ￦1,800,000으로 합의하였다. 기계장치와 5년간 유지보수용역의 개별 판매가격은 다음과 같다.\n\n구분 / 기계장치 / 5년간 유지보수용역\n개별 판매가격 / ￦1,500,000 / ￦500,000\n\n(주)세무는 20×1년 초 고객에게 기계장치의 통제를 이전하였으며, 20×1년 말까지 유지보수용역도 계약대로 이행하였다. 20×2년 초 (주)세무와 고객은 4년의 잔여기간 동안 제공할 유지보수용역의 빈도와 범위를 축소하기로 합의하고, 4년간 제공할 유지보수용역을 ￦200,000으로 결정하였다. 축소된 유지보수용역은 4년간 매년 동일하게 제공된다. 계약변경일 이후에 제공할 유지보수용역은 기계장치의 납품과 구별되며, 계약변경 전에 제공한 유지보수용역과도 구별된다. (주)세무가 20×1년도와 20×2년도에 인식할 수익은?",
  choices:["20×1년 ￦1,440,000 / 20×2년 ￦50,000","20×1년 ￦1,440,000 / 20×2년 ￦90,000","20×1년 ￦1,590,000 / 20×2년 ￦50,000","20×1년 ￦1,590,000 / 20×2년 ￦90,000","20×1년 ￦1,590,000 / 20×2년 ￦100,000"],
  answer:1, status:"clear", note:"" },
{ id:"hg2025-21", subject:"회계학개론", year:2025, no:21, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"재무제표 표시에 관한 설명으로 옳지 않은 것은?",
  choices:["한국채택국제회계기준에서 요구하거나 허용하지 않는 한 자산과 부채 그리고 수익과 비용은 상계하지 아니한다.","재무제표의 목적은 광범위한 정보이용자의 경제적 의사결정에 유용한 기업의 재무상태, 재무성과와 재무상태변동에 관한 정보를 제공하는 것이다.","부적절한 회계정책은 이에 대하여 공시나 주석 또는 보충 자료를 통해 설명하더라도 정당화될 수 없다.","계속기업의 가정이 적절한지의 여부를 평가할 때 경영진은 적어도 보고기간말로부터 향후 12개월 기간에 대하여 이용가능한 모든 정보를 고려한다.","일부 한국채택국제회계기준에서는 재무제표(주석 포함)에 포함하도록 요구하는 정보를 명시하고 있으므로, 한국채택국제회계기준의 요구에 따라 공시되는 정보가 중요하지 않더라도 그 공시를 제공해야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"hg2025-22", subject:"회계학개론", year:2025, no:22, law:"회계학개론", unit:"사업결합·연결", kind:"concept",
  stem:"사업결합에 관한 설명으로 옳지 않은 것은?",
  choices:["사업은 투입물 그리고 그 투입물에 적용하여 산출물의 창출에 기여할 수 있는 과정으로 구성되며, 사업의 3가지 요소는 투입물, 과정, 산출물이다.","취득자는 식별할 수 있는 취득 자산과 인수 부채를 취득일의 공정가치로 측정한다.","취득자는 때로 대가를 이전하지 않고 피취득자에 대한 지배력을 획득하는 경우에는 사업결합 회계처리방법인 취득법을 적용한다.","취득자가 피취득자에 대한 지배력을 획득한 날은 일반적으로 취득자가 법적으로 대가를 이전하여, 피취득자의 자산을 취득하고 부채를 인수한 날인 종료일이므로, 취득자는 종료일보다 이른 날 또는 늦은 날에 지배력을 획득할 수 없다.","과거사건에서 생긴 현재의무이고 그 공정가치를 신뢰성 있게 측정할 수 있다면, 해당 의무를 이행하기 위하여 경제적 효익이 있는 자원이 유출될 가능성이 높지 않더라도 취득자는 취득일에 사업결합으로 인수한 우발부채를 인식한다."],
  answer:4, status:"clear", note:"" },
{ id:"hg2025-23", subject:"회계학개론", year:2025, no:23, law:"회계학개론", unit:"재무회계개념체계", kind:"concept",
  stem:"재무보고를 위한 개념체계 중 인식기준에 관한 설명으로 옳지 않은 것은?",
  choices:["자산이나 부채를 인식할 때 효익을 초과하지 않는 원가로 재무제표이용자들에게 유용한 정보를 제공하게 되는 시점을 정확하게 정하는 것은 불가능하다.","자산이나 부채의 정의를 충족하는 항목이 인식되지 않더라도, 기업은 해당 항목에 대한 정보를 주석에 제공해야 할 수도 있다.","자산, 부채, 자본, 수익과 비용에 대한 정보는 재무제표이용자들에게 목적적합하나, 특정 자산이나 부채의 인식과 이에 따른 결과로 발생하는 수익, 비용 또는 자본변동을 인식하는 것이 항상 목적적합한 정보를 제공하는 것은 아닐 수 있다.","경제적효익의 유입가능성이 낮다면, 그 자산에 대해 가장 목적적합한 정보는 발생가능한 유입의 크기, 발생가능한 시기 및 발생가능성에 영향을 미치는 요인에 대한 정보이더라도 이러한 정보는 주석으로 기재하지 않는다.","특정 자산이나 부채를 인식하는 것은 목적적합한 정보를 제공할 뿐만 아니라 해당 자산이나 부채 및 이에 따른 결과로 발생하는 수익, 비용 또는 자본변동에 대한 충실한 표현을 제공할 경우에 적절하다."],
  answer:4, status:"clear", note:"" },
{ id:"hg2025-24", subject:"회계학개론", year:2025, no:24, law:"회계학개론", unit:"현금흐름표", kind:"concept",
  stem:"현금흐름표에 관한 설명으로 옳은 것은?",
  choices:["역사적 현금흐름정보는 미래현금흐름의 금액, 시기 및 확실성에 대한 지표로 자주 사용되고, 과거에 추정한 미래현금흐름의 정확성을 검증하며, 수익성과 순현금흐름 간의 관계 및 물가 변동의 영향을 분석하는 데 유용하다.","현금흐름정보는 동일한 거래와 사건에 대하여 서로 다른 회계처리를 적용함에 따라 발생하는 영향을 제거하지만, 영업성과에 대한 기업 간의 비교가능성은 떨어진다.","현금및현금성자산을 구성하는 항목 간 이동은 영업활동, 투자활동 및 재무활동의 일부이므로 이러한 항목 간의 변동은 현금흐름에 포함한다.","역사적 영업현금흐름의 특정 구성요소에 대한 정보를 다른 정보와 함께 사용하면, 미래 영업현금흐름을 예측하는 데 유용하지 않다.","기업은 단기매매목적으로 유가증권을 보유할 수 있으며, 이 때 유가증권은 판매를 목적으로 취득한 재고자산과 보유목적이 다르므로, 단기매매목적으로 보유하는 유가증권의 취득과 판매에 따른 현금흐름은 투자활동으로 분류한다."],
  answer:1, status:"clear", note:"" },
{ id:"hg2025-25", subject:"회계학개론", year:2025, no:25, law:"회계학개론", unit:"제조원가의 흐름", kind:"calc",
  stem:"(주)세무의 20×1년 재고자산 및 전환원가에 관련된 자료는 다음과 같다. 20×1년 직접재료 매입액은 ￦90,000이며, 매출액은 ￦300,000이다.\n\n[재고자산] 구분 / 기초 / 기말\n직접재료 / ￦20,000 / ￦30,000\n재공품 / 25,000 / 34,000\n제품 / 44,000 / 20,000\n\n[전환원가] 구분 / 당기 지급액 / 기초 미지급비용 / 기초 선급비용 / 기말 선급비용 / 기말 미지급비용\n직접노무원가 / ￦25,000 / ￦2,500 / – / ￦1,500 / –\n수도광열비 / 30,000 / 2,500 / – / – / ￦10,000\n복리후생비 / 15,000 / – / ￦3,500 / – / 8,000\n\n(주)세무의 20×1년 매출총이익은?",
  choices:["￦110,000","￦120,000","￦156,000","￦180,000","￦190,000"],
  answer:2, status:"clear", note:"" },
{ id:"hg2025-26", subject:"회계학개론", year:2025, no:26, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 20×1년 초에 영업을 개시하였다. (주)세무는 정상원가계산을 적용하고 있으며, 제조간접원가 배부기준은 직접노무시간이다. (주)세무는 20×1년 초에 연간 제조간접원가를 ￦100,000으로, 직접노무시간을 4,000시간으로 예상하고 있다. 20×1년 생산·판매 관련 자료는 다음과 같다.\n\n○ 20×1년 중 작업 #201, #202, #203을 착수하였다.\n○ 20×1년 중 작업별 실제발생한 원가 및 직접노무시간은 다음과 같다.\n구분 / #201 / #202 / #203 / 합계\n직접재료원가 / ￦27,500 / ￦28,000 / ￦4,500 / ￦60,000\n직접노무원가 / ￦50,000 / ￦54,000 / ￦26,000 / ￦130,000\n직접노무시간 / 2,000시간 / 2,000시간 / 1,000시간 / 5,000시간\n\n○ 20×1년 실제발생한 제조간접원가는 총 ￦120,000이다.\n○ 20×1년 중 작업 #201과 #202는 완성되었으나, #203은 20×1년 말 현재 작업 중이다.\n○ 작업 #201은 20×1년 중에 판매되었으나, #202는 20×1년 말 현재 판매되지 않았다.\n\n(주)세무가 제조간접원가 배부차이를 원가요소기준 비례배부법으로 조정할 경우, 20×1년 기말 제품재고금액은?",
  choices:["￦125,500","￦129,500","￦130,000","￦132,000","￦134,000"],
  answer:3, status:"clear", note:"" },
{ id:"hg2025-27", subject:"회계학개론", year:2025, no:27, law:"회계학개론", unit:"표준원가계산", kind:"calc",
  stem:"(주)세무는 20×1년 초에 영업을 개시하였으며, 표준원가계산제도를 채택하고 있다. 직접재료와 관련된 자료는 다음과 같다.\n\n○ 제품 단위당 직접재료 표준투입량: 2.5kg\n○ 직접재료 표준가격: ￦10/kg\n○ 직접재료 실제 구입가격: ￦15/kg\n○ 직접재료 구입가격차이: ￦12,500(불리)\n○ 직접재료 능률차이: ￦5,000(유리)\n\n20×1년 기말 직접재료 재고량이 500kg일 때, 실제 제품 생산량은? (단, 기말 재공품은 없다.)",
  choices:["400단위","600단위","800단위","1,000단위","1,200단위"],
  answer:4, status:"clear", note:"" },
{ id:"hg2025-28", subject:"회계학개론", year:2025, no:28, law:"회계학개론", unit:"종합원가계산", kind:"calc",
  stem:"(주)세무는 단일제품을 생산하고 있으며, 선입선출법에 의한 종합원가계산을 적용하고 있다. 직접재료는 공정초기에 전량 투입되고, 전환원가는 공정 전반에 걸쳐 균등하게 발생한다. 직접재료의 10%가 제조과정에서 증발되는데, 이러한 증발은 정상적이며 제조과정에서 평균적으로 발생한다. 당기 생산 및 원가 관련 자료는 다음과 같다.\n\n구분 / 물량(전환원가 완성도)\n기초재공품 / 4,750kg(50%)\n당기 착수 / 45,000\n당기 완성 / 36,000\n기말재공품 / 9,400(60%)\n\n구분 / 직접재료원가 / 전환원가\n기초재공품 / ￦11,200 / ￦18,000\n당기발생원가 / 90,000 / 195,750\n\n(주)세무의 기말재공품 원가는?",
  choices:["￦47,000","￦57,800","￦83,000","￦93,800","￦108,200"],
  answer:1, status:"clear", note:"" },
{ id:"hg2025-29", subject:"회계학개론", year:2025, no:29, law:"회계학개론", unit:"결합원가계산", kind:"calc",
  stem:"(주)세무는 결합공정을 거쳐 분리점에서 주산물 A, B와 부산물 C를 생산하고 있다. 결합공정에서 기초재공품은 없고, 당기투입원가는 ￦60,500이며, 기말재공품원가는 ￦4,500이다. 부산물 C는 추가가공이 필요하지 않지만, 제품 A와 B는 추가가공하여 최종 완성된다. 부산물 C는 생산기준법(생산시점의 순실현가치로 인식)을 적용하며, 부산물 C의 단위당 판매비는 ￦5이다. 당기의 생산·판매 관련 자료는 다음과 같다.\n\n구분 / 생산량 / 판매량 / 분리점 이후 추가가공원가(총액) / 단위당 최종 판매가격\n제품 A / 2,000단위 / 1,800단위 / ￦40,000 / ￦70\n제품 B / 2,500 / 2,100 / 25,000 / 30\n부산물 C / 200 / 200 / – / 15\n\n(주)세무가 순실현가치로 결합원가를 배분할 경우, 제품 A의 매출원가는? (단, 공손 및 감손은 없다.)",
  choices:["￦6,880","￦7,600","￦36,120","￦68,400","￦71,100"],
  answer:4, status:"clear", note:"" },
{ id:"hg2025-30", subject:"회계학개론", year:2025, no:30, law:"회계학개론", unit:"표준원가계산", kind:"calc",
  stem:"(주)세무는 표준원가계산제도를 채택하고 있으며, 전기와 당기의 표준원가는 동일하다. 관련 자료는 다음과 같다.\n\n<직접재료 표준원가> 구분 / 표준수량 / kg당 표준가격 / 제품 단위당 표준원가\n직접재료 A / 2.0kg / ￦10 / ￦20\n직접재료 B / 1.2 / 20 / 24\n\n<직접재료 구입 및 투입> 구분 / 구입량 / 투입량 / kg당 구입가격\n직접재료 A / 10,000kg / 9,000kg / ￦12\n직접재료 B / 5,000 / 3,000 / 18\n\n당기에 직접재료 A는 공정초기에 전량 투입되고, 직접재료 B는 공정의 60% 시점에 전량 투입된다. 기초재공품은 1,000단위(공정의 완성도 40%)이었고 당기완성품은 3,500단위이며, 기말재공품은 1,500단위(공정의 완성도 50%)이었다. (주)세무가 선입선출법을 적용할 경우, 직접재료원가 능률차이는? (단, 공손 및 감손은 없다.)",
  choices:["￦10,000 유리","￦10,000 불리","￦14,000 유리","￦14,000 불리","￦24,000 불리"],
  answer:3, status:"clear", note:"" },
{ id:"hg2025-31", subject:"회계학개론", year:2025, no:31, law:"회계학개론", unit:"원가배분과 정상원가계산", kind:"calc",
  stem:"(주)세무는 두 개의 제조부문(P1, P2)과 두 개의 보조부문(S1, S2)을 운영하고 있으며, 보조부문원가를 상호배분법에 의해 제조부문에 배분하고 있다. 각 부문의 용역수수관계는 다음과 같다.\n\n구분 / 제조부문 P1 / 제조부문 P2 / 보조부문 S1 / 보조부문 S2\nS1 / 40% / 30% / – / 30%\nS2 / 40% / 40% / 20% / –\n\n두 개의 보조부문(S1, S2)으로부터 제조부문 P1, P2에 배분된 금액이 각각 ￦140,000과 ￦130,000일 경우, 보조부문원가를 배분하기 이전의 보조부문 S1에 집계된 원가는?",
  choices:["￦50,000","￦100,000","￦220,000","￦250,000","￦270,000"],
  answer:1, status:"clear", note:"" },
{ id:"hg2025-32", subject:"회계학개론", year:2025, no:32, law:"회계학개론", unit:"활동기준원가계산", kind:"calc",
  stem:"(주)세무는 활동기준원가계산에 의하여 판매관리비를 고객별로 배부한다. 활동기준원가계산을 적용하기 위해 20×1년 초에 수집한 연간 예산 및 관련 자료는 다음과 같다.\n\n○ 연간 판매관리비 예산: ￦500,000(급여 ￦300,000, 기타 ￦200,000)\n○ 자원소비단위(활동)별 판매관리비 배분비율\n구분 / 고객주문처리 / 고객관계관리 / 계\n급여 / 60% / 40% / 100%\n기타 / 70% / 30% / 100%\n\n○ 활동별 원가동인과 연간 활동량\n활동 / 원가동인 / 활동량\n고객주문처리 / 고객주문횟수 / 80회\n고객관계관리 / 고객수 / 30명\n\n20×1년 중 주요 고객 A가 12회 주문할 경우, 이 고객에게 배부될 판매관리비는?",
  choices:["￦6,000","￦8,000","￦14,000","￦48,000","￦54,000"],
  answer:5, status:"clear", note:"" },
{ id:"hg2025-33", subject:"회계학개론", year:2025, no:33, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 두 공정을 통해 제품을 생산·판매하며, 각 공정별 자료는 다음과 같다.\n\n구분 / A공정 / B공정\n최대생산능력 / 7,000단위 / 9,000단위\n총 고정원가 / ￦188,000 / ￦160,000\n단위당 변동원가 / ￦12 / ￦20\n\nA공정 완성품(양품)은 바로 판매할 수 없고, B공정에서 추가가공하여 완제품 생산 후에 단위당 ￦100에 전량 판매할 수 있다. A공정에서는 투입량의 10%가 A공정 종점에서 공손이 되지만, B공정에서는 공손이 발생하지 않는다. 모든 공손은 정상공손이고 정상공손원가는 양품에 배분하며, 공손품은 처분가치도 폐기비용도 없다. B공정 완제품의 손익분기점 판매량은?",
  choices:["5,220단위","5,400단위","5,800단위","6,000단위","6,120단위"],
  answer:1, status:"clear", note:"" },
{ id:"hg2025-34", subject:"회계학개론", year:2025, no:34, law:"회계학개론", unit:"전부원가·변동원가계산", kind:"calc",
  stem:"(주)세무는 당기 초에 영업을 개시하였다. (주)세무는 단일 제품을 생산·판매하며, 실제원가계산을 적용한다. 당기 생산량은 5,000단위이고, 단위당 판매가격은 ￦500이다. 관련 자료는 다음과 같다.\n\n총 고정제조간접원가 ￦300,000 / 단위당 직접노무원가 ￦150\n총 고정판매관리비 324,000 / 단위당 변동제조간접원가 50\n단위당 직접재료원가 100 / 단위당 변동판매관리비 50\n\n(주)세무의 초변동원가계산에 의한 손익분기점 판매량은?",
  choices:["4,160단위","4,460단위","4,600단위","4,640단위","4,680단위"],
  answer:4, status:"clear", note:"" },
{ id:"hg2025-35", subject:"회계학개론", year:2025, no:35, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 단일 제품을 생산·판매하는데 단위당 판매가격은 ￦400이고 단위당 변동원가는 ￦220이며, 총 고정원가는 ￦1,080,000이다. 당기 예상 매출액은 ￦1,000,000부터 ￦3,000,000 사이에서 균등분포(uniform distribution)를 이룬다. 3,000단위 이하 판매될 확률(a)과 손실이 발생하지 않을 확률(b)의 합(a+b)은?",
  choices:["40%","50%","60%","70%","80%"],
  answer:1, status:"clear", note:"" },
{ id:"hg2025-36", subject:"회계학개론", year:2025, no:36, law:"회계학개론", unit:"불확실성하의사결정", kind:"calc",
  stem:"(주)세무는 공정이 정상인지에 대해 조사 여부를 결정하고자 한다. 공정 조사비용은 ￦10,000이고, 조사 후 공정이 비정상 상태이면 교정비용이 추가로 발생하며, 공정이 비정상인데 조사하지 않으면 손실 ￦70,000이 발생한다. 공정을 조사하는 경우의 기대비용은 ￦19,000이고 공정을 조사하지 않는 경우의 기대비용은 ￦21,000이다. 공정 전문가 L씨에게 상담을 받으면 공정 상태에 대한 완전정보를 얻을 수 있다고 한다. 이 경우 공정 상태에 대한 완전정보의 대가로 L씨에게 지불할 수 있는 최대금액은?",
  choices:["￦2,000","￦3,000","￦7,000","￦8,000","￦9,000"],
  answer:3, status:"clear", note:"" },
{ id:"hg2025-37", subject:"회계학개론", year:2025, no:37, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 두 개의 보조부문(S1, S2)과 두 개의 제조부문(A, B)을 통해 제품을 생산하고 있다. 각 보조부문에서 다른 부문에 공급하는 연간 예상 용역량은 다음과 같다.\n\n구분 / 보조부문 S1 / 보조부문 S2 / 제조부문 A / 제조부문 B / 합계\nS1 / – / 200kW / 500kW / 300kW / 1,000kW\nS2 / 300시간 / – / 450시간 / 250시간 / 1,000시간\n\nS1이 제공하는 전력의 kW당 변동원가는 ￦100이고, S2가 제공하는 서비스의 시간당 변동원가는 ￦80이다. (주)세무는 (주)한국으로부터 전력을 kW당 ￦120에 공급하겠다는 제안을 받았다. (주)세무가 이 제안을 받아들여 S1을 폐지하고 필요한 전력을 전량 (주)한국으로부터 공급받는 경우, 이익 증가액은?",
  choices:["￦4,000","￦11,200","￦12,800","￦13,600","￦14,400"],
  answer:2, status:"clear", note:"" },
{ id:"hg2025-38", subject:"회계학개론", year:2025, no:38, law:"회계학개론", unit:"의사결정(특별주문·사업부폐지 등)", kind:"calc",
  stem:"(주)세무는 특수기계를 이용하여 A, B, C 세 가지 제품을 생산·판매할 수 있다. 이 특수기계의 최대이용가능시간은 10,000시간으로 제한되어 있으며, 관련 자료는 다음과 같다.\n\n구분 / 제품 A / 제품 B / 제품 C\n단위당 판매가격 / ￦400 / ￦500 / ￦700\n단위당 변동원가 / ￦160 / ￦200 / ￦380\n단위당 특수기계 이용시간 / 2시간 / 3시간 / 4시간\n제품별 정규 시장수요 / 3,000단위 / 1,000단위 / 500단위\n\n(주)세무가 최대 달성가능한 이익을 기준으로 생산·판매 계획을 수립한 직후에 그 동안 거래가 전혀 없던 (주)한국으로부터 제품 A를 단위당 ￦360에 800단위 구입하겠다는 특별주문을 받았다. 이 특별주문을 수락하는 경우, (주)세무의 이익 증가액은? (단, 특별주문은 정규 시장수요에 영향을 미치지 않는다.)",
  choices:["￦50,000","￦42,000","￦38,000","￦25,000","￦20,000"],
  answer:5, status:"clear", note:"" },
{ id:"hg2025-39", subject:"회계학개론", year:2025, no:39, law:"회계학개론", unit:"CVP분석", kind:"calc",
  stem:"(주)세무는 단일 제품을 생산·판매한다. 제품 단위당 판매가격은 ￦200, 단위당 변동원가는 ￦150으로 일정하나, 고정원가는 제품 생산량이 일정 범위를 넘어가면 계단형으로 증가한다. 제품 생산량이 첫 번째 구간(1 ~ 1,000단위)일 때 손익분기점은 840단위이고, 두 번째 구간(1,001 ~ 2,500단위)일 때 손익분기점은 2,400단위이다. 첫 번째 구간에서 두 번째 구간으로 넘어갈 때 증가하는 고정원가(a)와 달성가능한 최대이익(b)은? (단, 첫 번째 구간과 두 번째 구간만 고려할 것)",
  choices:["(a) ￦78,000 / (b) ￦5,000","(a) ￦78,000 / (b) ￦8,000","(a) ￦82,000 / (b) ￦5,000","(a) ￦82,000 / (b) ￦8,000","(a) ￦92,000 / (b) ￦5,000"],
  answer:2, status:"clear", note:"" },
{ id:"hg2025-40", subject:"회계학개론", year:2025, no:40, law:"회계학개론", unit:"책임회계·대체가격", kind:"calc",
  stem:"(주)세무는 이익중심점인 A, B 두 개의 사업부로 구성되어 있다. A사업부는 부품을 생산하여 외부시장에 판매할 수도 있고, B사업부에 내부대체할 수도 있다. A사업부의 부품 최대생산능력은 4,000단위이고, 단위당 변동원가는 ￦600이며, 외부시장에 단위당 ￦1,000에 3,000단위를 판매할 것으로 예상된다. 이 같은 상황에서 A사업부는 B사업부로부터 1,600단위를 내부대체해 줄 것을 요청받았다. 다만, 내부대체 수량에 대해서는 A사업부의 변동원가가 단위당 ￦50 감소한다. A사업부가 1,600단위를 전량 대체하는 경우, 단위당 최소대체가격은?",
  choices:["￦600","￦650","￦700","￦750","￦800"],
  answer:3, status:"clear", note:"" },
{ id:"hs2023-41", subject:"행정소송법", year:2023, no:41, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"행정소송의 한계에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정청의 단순한 부작위도 취소소송의 대상이 된다.","행정청의 재량에 속하는 처분이라도 재량권의 한계를 넘거나 그 남용이 있는 때에는 법원은 이를 취소할 수 있다.","법원이 법규명령의 위헌ㆍ위법 여부를 심사하려면 그것이 재판의 전제가 되어야 한다.","객관소송은 법률에 특별한 규정이 없는 한 인정되지 않는다.","행정소송에 있어 반사적 이익의 침해는 소송의 대상이 되지 않는다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2023-42", subject:"행정소송법", year:2023, no:42, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"행정소송과 행정심판과의 관계에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정심판전치주의는 행정행위의 특수성, 전문성 등에 비추어 처분행정청으로 하여금 스스로 재고, 시정할 수 있는 기회를 부여하기 위함이다.","필요적 행정심판전치가 적용되는 경우 그 요건을 구비했는가 여부는 법원의 직권조사사항이다.","처분을 행한 행정청이 행정심판을 거칠 필요가 없다고 잘못 알린 때에는 행정심판을 제기함이 없이 소송을 제기할 수 있다.","행정심판 전치요건은 행정소송 제기 이전에 반드시 갖추어야 하는 것은 아니고 사실심 변론종결시까지 갖추면 된다.","동종사건에 관하여 이미 행정심판의 기각재결이 있은 때에도 행정심판을 거쳐야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2023-43", subject:"행정소송법", year:2023, no:43, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"행정소송법 조문의 일부이다. (  )에 들어갈 용어를 옳게 나열한 것은?\n\n행정소송에 관하여 이 법에 특별한 규정이 없는 사항에 대하여는 ( ㄱ )과 민사소송법 및 ( ㄴ )의 규정을 준용한다.",
  choices:["ㄱ: 민법, ㄴ: 민사집행법","ㄱ: 민법, ㄴ: 행정심판법","ㄱ: 법원조직법, ㄴ: 행정심판법","ㄱ: 법원조직법, ㄴ: 민사집행법","ㄱ: 민사집행법, ㄴ: 행정심판법"],
  answer:4, status:"clear", note:"" },
{ id:"hs2023-44", subject:"행정소송법", year:2023, no:44, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"재판관할에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["토지의 수용에 관계되는 처분등에 대한 취소소송은 그 부동산 소재지를 관할하는 행정법원에 제기할 수 있다.","법원은 소송의 전부에 대하여 관할권이 없다고 인정하는 경우에는 결정으로 이를 관할법원에 이송한다.","원고가 고의 또는 중대한 과실 없이 행정소송으로 제기할 사건을 민사소송으로 잘못 제기한 경우 수소법원이 행정소송의 관할권이 없으면 관할법원에 이송하여야 한다.","민사소송으로 제기할 것을 당사자소송으로 행정법원에 제기한 경우 피고가 관할위반이라고 항변하지 않고 본안에 대한 변론을 한 경우 법원에 변론관할이 생겼다고 본다.","소송당사자에게 관할위반을 이유로 하는 이송신청권을 인정하고 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2023-45", subject:"행정소송법", year:2023, no:45, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"행정소송의 이송ㆍ병합에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송에 부당이득반환청구소송이 병합된 경우 부당이득반환청구가 인용되려면 취소판결이 확정되어야 한다.","민사소송이 행정소송에 관련청구로 병합되기 위해서는 원칙적으로 그 청구의 발생원인 등이 처분 등과 법률상 또는 사실상 공통되거나, 그 처분의 효력이나 존부 유무가 선결문제로 되는 등의 관계가 있어야 한다.","취소소송에는 사실심의 변론종결시까지 관련청구소송을 병합하여 제기할 수 있다.","국가유공자 비해당결정처분과 보훈보상대상자 비해당결정처분의 취소를 청구하는 것은 동시에 인정될 수 없는 양립불가능한 관계에 있다.","행정처분에 대한 무효확인과 취소청구는 서로 양립할 수 없는 청구로 단순 병합은 허용되지 않는다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2023-46", subject:"행정소송법", year:2023, no:46, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"농림축산식품부장관이 甲에 대한 농지보전부담금 부과처분을 한다는 의사표시가 담긴 납부통지서를 수납업무 대행자인 한국농어촌공사를 통해 甲에게 전달하였다. 甲이 그 부과처분에 대하여 항고소송을 제기한다면 피고는? (다툼이 있으면 판례에 따름)",
  choices:["농림축산식품부","한국농어촌공사 및 농림축산식품부","한국농어촌공사","한국농어촌공사사장","농림축산식품부장관"],
  answer:5, status:"clear", note:"" },
{ id:"hs2023-47", subject:"행정소송법", year:2023, no:47, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"항고소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["무효인 처분을 취소소송으로 다투는 경우 취소청구에는 엄밀한 의미의 취소뿐 아니라 무효를 선언하는 의미의 취소를 구하는 취지가 포함되어 있어야 한다.","소송요건의 구비 여부는 법원에 의한 직권조사사항이다.","검사의 공소에 대하여는 행정소송의 방법으로 공소의 취소를 구할 수 있다.","군의관이 하는 「병역법」상 신체등위 판정은 항고소송의 대상이 되는 처분이 아니다.","행정청의 거부처분이 있은 후 당사자가 다시 신청을 한 경우에는 그 내용이 새로운 신청을 하는 취지라면 행정청이 이를 다시 거절하는 것은 새로운 거부처분으로 봄이 원칙이다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2023-48", subject:"행정소송법", year:2023, no:48, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"취소소송에 있어 원고적격에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송은 처분등의 취소를 구할 법률상 이익이 있는 자가 제기할 수 있다.","국가는 국토이용계획과 관련한 지방자치단체장의 기관위임사무 처리에 관하여 지방자치단체장을 상대로 취소소송을 제기할 수 있다.","구속된 피고인은 교도소장의 접견허가거부처분의 취소를 구할 원고적격을 가진다.","원고적격은 사실심 변론종결시는 물론 상고심에서도 존속하여야 한다.","환경영향평가대상지역에 거주하는 원자로시설부지 인근 주민들은 원자로시설부지사전승인처분의 취소를 구할 원고적격이 있다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2023-49", subject:"행정소송법", year:2023, no:49, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"행정소송에 있어 소송참가에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 소송의 결과에 따라 권리의 침해를 받을 제3자가 있는 경우 그 제3자를 소송에 참가시킬 수 있다.","법원이 제3자를 소송에 참가시킬 결정을 하고자 할 때에는 미리 당사자 및 제3자의 의견을 들어야 한다.","행정소송 사건에서 「민사소송법」상 보조참가의 요건을 갖춘 경우에도 「민사소송법」상 보조참가가 허용되는 것은 아니다.","제3자가 참가신청을 하였으나 각하된 경우 그 제3자는 각하결정에 대하여 즉시항고할 수 있다.","특정 소송사건에서 당사자 일방을 보조하기 위해 보조참가를 하려면 소송결과에 법률상 이해관계가 있어야 한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2023-50", subject:"행정소송법", year:2023, no:50, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"행정소송법상 소송의 종류에 해당하지 않는 것은?",
  choices:["항고소송","당사자소송","민중소송","기관소송","예방적부작위청구소송"],
  answer:5, status:"clear", note:"" },
{ id:"hs2023-51", subject:"행정소송법", year:2023, no:51, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"소의 변경에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 소의 청구취지변경을 불허하는 결정에 대해서는 독립하여 항고할 수 있다.\nㄴ. 처분변경으로 인한 소의 변경 신청은 처분의 변경이 있음을 안 날로부터 60일 이내에 하여야 한다.\nㄷ. 소의 변경을 허가하는 결정에 대하여 새로운 소의 피고는 즉시항고할 수 없다.\nㄹ. 처분 변경으로 인한 소의 변경은 취소소송, 무효등 확인소송 및 당사자소송에서 인정된다.",
  choices:["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:2, status:"clear", note:"" },
{ id:"hs2023-52", subject:"행정소송법", year:2023, no:52, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"국민의 신청행위에 대한 거부행위가 처분이 되기 위한 요건에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["신청한 행위가 공권력의 행사 또는 이에 준하는 행정작용이어야 한다.","신청권의 존부는 관계 법규의 해석에 의하여 국민에게 신청권이 인정되는지 여부를 살펴 추상적으로 결정되는 것이고, 특정인의 신청이 인용될 수 있는가 하는 점은 본안에서 판단하여야 할 사항이다.","행정청의 행위발동을 요구할 신청권은 법규상 또는 조리상 인정되어야 한다.","직권취소를 할 수 있다는 사정만으로 이해관계인에게 처분청에 대하여 그 취소를 요구할 신청권이 부여된 것으로 볼 수는 없다.","공사중지명령의 상대방은 명령 이후에 그 원인사유가 소멸하였음을 들어 그 명령의 철회를 요구할 수 있는 조리상의 신청권이 없다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2023-53", subject:"행정소송법", year:2023, no:53, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"행정소송법상 기관소송에 관한 설명으로 옳지 않은 것은?",
  choices:["충청남도와 세종특별자치시 간의 권한쟁의심판은 기관소송에 해당한다.","국가 또는 공공단체의 기관 상호간에 있어서의 권한의 존부 또는 그 행사에 관한 다툼이 있을 때 제기하는 소송이다.","교육ㆍ학예에 관한 시ㆍ도의회의 재의결에 대하여 교육감이 대법원에 제기하는 소송은 기관소송의 일종이다.","기관소송으로써 처분의 취소를 구하는 소송에는 그 성질에 반하지 아니하는 한 취소소송에 관한 규정이 준용된다.","기관소송으로써 부작위의 위법의 확인을 구하는 소송에는 그 성질에 반하지 아니하는 한 부작위위법확인소송에 관한 규정이 준용된다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2023-54", subject:"행정소송법", year:2023, no:54, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"판례상 다음 사안에 공통적으로 적용되는 소송의 종류는?\n\n○ 서울특별시립무용단 단원의 해촉\n○ 지방전문직공무원인 공중보건의사의 채용계약해지\n○ 법령에 의해 확정된 부가가치세 환급세액 지급청구",
  choices:["당사자소송","취소소송","민중소송","의무이행소송","부작위위법확인소송"],
  answer:1, status:"clear", note:"" },
{ id:"hs2023-55", subject:"행정소송법", year:2023, no:55, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"병무청장 A가 법무부장관 B에게 ‘재외동포 가수 甲의 입국 자체를 금지해 달라’고 요청함에 따라 B가 甲의 입국금지 결정을 하고, 그 정보를 내부전산망인 ‘출입국관리정보시스템’에 입력하였으나, 甲에게는 통보하지 않았다. 이후 甲이 체류자격의 사증발급을 신청하자 재외공관장 C는 전화로 사증발급이 불허되었음을 통지하였다. 이 사안과 관련한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["B의 입국금지결정은 항고소송의 대상인 처분이다.","재외동포에 대한 사증발급은 A의 기속행위이다.","C의 사증발급 불허 통지는 상급행정기관의 지시를 따른 것이라면 적법하다.","B의 입국금지결정에는 공정력과 불가쟁력이 있다.","처분청이 甲에 대한 입국금지결정을 함에 있어 공익과 甲이 입게 되는 불이익을 전혀 비교형량 하지 않았다면 이는 위법하다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2023-56", subject:"행정소송법", year:2023, no:56, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"집행정지의 효력과 불복에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["집행정지결정의 효력은 집행정지기간이 만료되면 소급하여 효력을 상실한다.","집행정지결정은 관계행정기관에는 미치지 않는다.","집행정지신청에 대한 기각의 결정에 대하여는 즉시항고 할 수 없다.","무효등 확인소송에도 집행정지규정이 준용된다.","집행정지결정을 한 후 본안소송이 취하되어도 집행정지결정의 효력은 결정 주문에서 정한 기간까지 존속한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2023-57", subject:"행정소송법", year:2023, no:57, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"위법판단의 기준시에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["원칙적으로 항고소송에서 행정처분의 위법 여부는 행정처분이 있을 때의 법령과 사실상태를 기준으로 판단한다.","원칙적으로 항고소송에서 처분의 위법여부는 처분 후에 생긴 법령의 개폐나 사실 상태의 변동에 영향을 받지 않는다.","허가신청 후 허가기준이 변경되었다 하더라도 그 허가관청이 허가신청을 수리하고도 정당한 이유 없이 그 처리를 늦추어 그 사이에 허가기준이 변경된 것이 아닌 이상 변경된 허가기준에 따라서 처분을 하여야 한다.","법원은 처분 당시 존재하였던 자료나 행정청에 제출되었던 자료만으로 위법 여부를 판단하여야 한다.","과징금 부과기준에 관한 처분시의 시행령이 행위시의 시행령보다 불리하게 개정되었고 적용법령에 대한 특별한 규정이 없다면 행위시의 시행령을 적용하여야 한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2023-58", subject:"행정소송법", year:2023, no:58, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"처분사유의 추가ㆍ변경에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["「행정소송법」상 명문의 근거규정이 존재한다.","행정청의 처분사유의 추가ㆍ변경시한은 사실심 변론종결시까지이다.","처분사유의 추가ㆍ변경을 제한하는 취지는 행정처분의 상대방의 방어권을 보장함으로써 실질적 법치주의를 구현하는 것이다.","항고소송에 있어서 처분청이 당초 처분의 근거로 삼은 사유와 기본적 사실관계의 동일성이 인정되지 않는 별개의 사실을 들어 처분사유로서 주장할 수는 없다.","처분사유의 추가ㆍ변경의 제한은 상대방의 신뢰보호와도 관련이 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2023-59", subject:"행정소송법", year:2023, no:59, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"주장책임과 입증책임에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["항고소송에 있어서 원고는 전심절차에서 주장하지 아니한 공격방어방법을 소송절차에서 주장할 수 있다.","취소소송에서 처분사유에 관한 입증책임은 행정청에게 있다.","행정처분의 당연무효를 주장하여 그 무효확인을 구하는 행정소송에 있어서는 피고에게 그 행정처분이 무효가 아니라는 것을 입증할 책임이 있다.","정보공개거부처분 취소소송에서 비공개사유의 주장ㆍ입증책임은 피고에게 있다.","과세대상이 된 토지가 비과세대상이라는 점은 이를 주장하는 납세의무자에게 입증책임이 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2023-60", subject:"행정소송법", year:2023, no:60, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"취소소송에서 집행정지에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송의 제기는 처분등의 효력에 영향을 주지 아니한다.","집행정지는 공공복리에 중대한 영향을 미칠 우려가 있을 때에는 허용되지 아니한다.","집행정지신청이 신청요건을 결여하여 부적법하면 법원은 그 신청을 기각하여야 한다.","거부처분에 대해서는 집행정지가 인정되지 않는다.","집행정지 결정에는 기속력에 관한 행정소송법 제30조제1항의 규정이 준용된다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2023-61", subject:"행정소송법", year:2023, no:61, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"판례상 일부취소가 가능한 경우를 모두 고른 것은?\n\nㄱ. 조세부과처분과 같은 금전부과처분이 기속행위인 경우로서 당사자가 제출한 자료에 의해 정당한 부과금액을 산정할 수 있는 경우\nㄴ. 재량행위인 자동차운수사업면허조건 등을 위반한 사업자에 대한 과징금부과처분이 법정 최고한도액을 초과하여 위법한 경우\nㄷ. 개발부담금부과처분 취소소송에서 제출한 자료에 의하여 적법하게 부과될 부과금액이 산출될 수 없는 경우\nㄹ. 제1종 보통, 대형 및 특수면허를 가지고 있는 자가 레이카크레인을 음주운전한 행위에 대해서 위 3종의 면허를 모두 취소한 경우",
  choices:["ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:2, status:"clear", note:"" },
{ id:"hs2023-62", subject:"행정소송법", year:2023, no:62, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"영업정지 1개월 처분을 받은 甲은 처분에 대한 취소를 구하고 당해 영업정지로 발생하는 영업피해도 구제받고자 한다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["甲은 민사법원에 영업정지처분의 취소를 병합하여 제기할 수 있다.","甲이 제기하는 국가배상소송과 취소소송은 행정법원에서 다루어지므로 소의 이송문제가 발생하지 않는다.","甲이 제기한 취소소송의 확정판결이 나오지 않았다면 사실심 변론종결후라도 손해배상소송이 사후병합될 수 있다.","甲은 취소소송과 영업피해에 대한 소송을 관할 행정법원에 병합하여 제기할 수 있다.","甲이 제기하는 국가배상소송이 인용되려면 영업정지처분의 취소가 확정되어야 한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2023-63", subject:"행정소송법", year:2023, no:63, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"사정판결에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분이 적법한 경우에는 사정판결의 대상이 되지 않는다.","사정판결을 하는 경우 법원은 그 판결의 주문에서 그 처분등이 위법함을 명시하여야 한다.","사정판결의 적용은 극히 엄격한 요건 아래 제한적으로 하여야 한다.","공공복리를 위한 사정판결의 필요성은 처분시를 기준으로 판단한다.","피고인 행정청의 청구에 의해 사정판결이 행해질 수도 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2023-64", subject:"행정소송법", year:2023, no:64, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"甲에 대한 처분을 다투는 항고소송이 A 행정법원에 계속 중이며 당해 처분과 관련되는 부당이득반환소송이 B 지방법원에 계속되는 경우 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["두 소송이 관련청구이면 A 행정법원에 자동이송된다.","법원은 甲의 신청이 없다면 이송결정을 할 수 없다.","甲의 이송신청에 대하여 B 지방법원이 각하결정을 하였다고 하더라도 즉시항고 할 수 없다.","소송을 이송받은 법원은 사건을 다시 다른 법원에 이송하지 못한다.","甲이 무효확인소송을 제기한 경우 B 지방법원은 직권으로 이송결정을 할 수 없다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2023-65", subject:"행정소송법", year:2023, no:65, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"행정소송에 적용되는 심리원칙으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["공개심리주의","쌍방심리주의","처분권주의","구술심리주의","직권탐지우선주의"],
  answer:5, status:"clear", note:"" },
{ id:"hs2023-66", subject:"행정소송법", year:2023, no:66, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"제3자에 의한 재심청구에 관하여 (  )에 들어갈 내용을 옳게 나열한 것은?\n\n처분등을 취소하는 판결에 의하여 권리 또는 이익의 침해를 받은 제3자는 자기에게 책임없는 사유로 소송에 참가하지 못함으로써 판결의 결과에 영향을 미칠 공격 또는 방어방법을 제출하지 못한 때에는 이를 이유로 확정된 종국판결에 대하여 확정판결이 있음을 안 날로부터 ( ㄱ ) 이내, 판결이 확정된 날로부터 ( ㄴ ) 이내에 제기하여야 한다.",
  choices:["ㄱ: 30일, ㄴ: 60일","ㄱ: 30일, ㄴ: 90일","ㄱ: 30일, ㄴ: 1년","ㄱ: 60일, ㄴ: 120일","ㄱ: 60일, ㄴ: 1년"],
  answer:3, status:"clear", note:"" },
{ id:"hs2023-67", subject:"행정소송법", year:2023, no:67, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"행정소송법상 간접강제에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["간접강제는 모든 항고소송에 준용된다.","간접강제 결정은 변론없이 할 수 있다.","당사자가 제1심수소법원에 신청하여야 한다.","간접강제 결정시 지연기간에 따라 일정한 배상을 할 것을 명하거나 즉시 손해배상을 할 것을 명할 수 있다.","간접강제 결정은 피고 또는 참가인이었던 행정청이 소속하는 국가 또는 공공단체에 그 효력을 미친다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2023-68", subject:"행정소송법", year:2023, no:68, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"당사자소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["「공법」상 법률관계에 관한 소송이라는 점에서 민사소송과 구별된다.","「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」에 따른 수용재결에 의한 보상금증감청구소송은 형식적 당사자소송에 해당한다.","공무수탁사인은 당사자소송의 피고가 될 수 없다.","제3자에 의한 재심청구 규정은 당사자소송에 준용되지 않는다.","재판관할에 관하여 취소소송 규정이 준용된다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2023-69", subject:"행정소송법", year:2023, no:69, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"소송비용에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["무효확인소송을 제기하였으나 청구가 기각된 경우에는 소송비용은 원고가 부담한다.","취소청구가 사정판결에 의해 기각된 경우에는 소송비용은 원고가 부담한다.","취소소송에서 청구가 전부인용된 경우에는 소송비용은 피고가 부담한다.","행정청이 처분을 변경함으로 인하여 청구가 기각된 경우에는 소송비용은 피고가 부담한다.","행정청이 처분을 취소함으로 인하여 청구가 각하된 경우에는 소송비용은 피고가 부담한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2023-70", subject:"행정소송법", year:2023, no:70, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"판례상 당사자소송에 해당하는 것을 모두 고른 것은?\n\nㄱ. 구「도시 및 주거환경정비법」상 주택재건축정비사업조합을 상대로 관리처분계획안에 대한 조합 총회결의의 효력을 다투는 소송\nㄴ. 구「도시 및 주거환경정비법」상 재개발조합과 조합장 사이의 선임ㆍ해임을 둘러싼 법률관계에 관한 소송\nㄷ. 재개발조합의 관리처분계획의 취소를 구하는 소송\nㄹ. 명예퇴직한 법관이 미지급 명예퇴직수당의 지급을 구하는 소송",
  choices:["ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:2, status:"clear", note:"" },
{ id:"hs2023-71", subject:"행정소송법", year:2023, no:71, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"현행 행정소송제도에서 허용되는 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 행정처분이 있은 후 2년이 지난 경우에 청구하는 무효확인소송\nㄴ. 검사에게 압수물 환부를 이행할 것을 청구하는 소송\nㄷ. 신축건축물에 대해 준공처분을 하지 말 것을 청구하는 소송\nㄹ. 행정청에게 작위의무가 있다는 확인을 구하는 소송",
  choices:["ㄱ","ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],
  answer:1, status:"clear", note:"" },
{ id:"hs2023-72", subject:"행정소송법", year:2023, no:72, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"무효등 확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정처분에 대한 무효확인과 취소청구는 서로 양립할 수 없는 청구로서 주위적ㆍ예비적 청구로서만 병합이 가능하고 선택적 병합은 허용되지 않는다.","행정처분의 무효확인을 구하는 소에는 그 처분이 당연무효가 아니라면 그 취소를 구하는 취지도 포함되어 있는 것으로 볼 수 있다.","무효확인소송의 전심절차로서 행정심판을 거친 경우에는 제소기간을 준수하여야 한다.","취소소송의 집행정지에 관한 규정은 무효등 확인소송에도 준용된다.","무효등 확인소송의 인용판결에 대해서는 제3자의 재심청구 규정이 준용된다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2023-73", subject:"행정소송법", year:2023, no:73, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"민중소송에 관한 설명으로 옳은 것은?",
  choices:["위법행정의 시정을 구하는 자는 누구나 개별법률의 근거가 없더라도 행정소송법에 따라 일반적으로 민중소송을 제기할 수 있다.","법률상 이익이 있는 자만이 제기할 수 있다.","「지방자치법」상 지방의회재의결에 대한 지방자치단체장의 소송은 민중소송이다.","취소소송에 관한 규정은 준용되지 않는다.","「국민투표법」상 국민투표무효소송은 민중소송이다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2023-74", subject:"행정소송법", year:2023, no:74, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"무효등 확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정청의 처분등의 효력 유무 또는 존재 여부를 확인하는 소송이다.","처분등의 실효확인소송은 무효등 확인소송의 일종이 아니다.","무효확인소송의 제기는 처분등의 집행에 영향을 주지 아니한다.","관련청구소송의 이송 및 병합의 규정은 무효등 확인소송의 경우에도 준용된다.","거부처분에 대해 무효확인 판결이 내려진 경우에는 이에 대한 간접강제는 허용되지 않는다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2023-75", subject:"행정소송법", year:2023, no:75, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정청의 부작위가 위법하다는 것을 확인하는 항고소송이다.","부작위위법확인소송에서 인용판결의 기속력으로서 재처분의무는 신청에 따른 특정한 내용의 처분의무를 의미한다.","당사자의 신청에 대한 행정청의 거부처분이 있는 경우에는 부작위위법확인소송은 허용되지 않는다.","행정심판 등 전심절차를 거친 경우에는 행정소송법상 제소기간을 준수하여 소를 제기하여야 한다.","행정청의 부작위가 위법하다는 것은 사실심의 구두변론종결시를 기준으로 확인한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2023-76", subject:"행정소송법", year:2023, no:76, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"판례상 항고소송의 대상에 해당하지 않는 것은?",
  choices:["「국토의 계획 및 이용에 관한 법률」상 토지거래계약에 관한 허가구역의 지정","소유권자가 신청한 건축물 대장의 용도변경신청을 거부한 행위","금융감독위원회의 부실금융기관에 대한 파산신청","군수의 개별공시지가의 결정","원천징수의무자인 법인에 대한 과세관청의 소득처분에 따른 소득금액변동통지"],
  answer:3, status:"clear", note:"" },
{ id:"hs2023-77", subject:"행정소송법", year:2023, no:77, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"판례상 항고소송의 대상에 해당하는 것을 모두 고른 것은?\n\nㄱ. 도지사가 지방의료원을 폐업하겠다는 결정\nㄴ. 국가인권위원회의 성희롱결정 및 시정조치권고\nㄷ. 5개 중앙부처가 합동으로 발표한 ‘4대강 살리기 마스터플랜’\nㄹ. 공공기관이 공개청구의 대상이 된 정보를 청구인이 신청한 공개방법 이외의 방법으로 공개하기로 하는 결정",
  choices:["ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],
  answer:4, status:"clear", note:"" },
{ id:"hs2023-78", subject:"행정소송법", year:2023, no:78, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"행정소송법상 소의 제기에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["특정인에 대한 행정처분을 주소불명 등의 이유로 송달할 수 없어 관보에 공고한 경우에는, 공고가 효력을 발생하는 날에 상대방이 그 행정처분이 있음을 알았다고 보아야 한다.","고시에 의해 불특정 다수인에게 행정처분을 하는 경우에는 그 행정처분에 이해관계를 갖는 자는 고시가 있었다는 사실을 현실적으로 알았는지 여부에 관계없이 고시가 효력을 발생하는 날에 행정처분이 있음을 알았다고 보아야 한다.","처분서가 처분상대방의 주소지에 송달되는 등 사회통념상 처분이 있음을 처분상대방이 알 수 있는 상태에 놓인 때에는 반증이 없는 한 처분상대방이 처분이 있음을 알았다고 추정할 수 있다.","행정소송법에는 행정소송의 제기에 필요한 사항의 고지의무에 관한 규정이 없다.","처분 등이 있음을 안 날부터 90일 이내에 제기하여야 한다는 취소소송의 제소기간은 불변기간이다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2023-79", subject:"행정소송법", year:2023, no:79, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"취소소송 규정의 준용에 관한 설명으로 옳지 않은 것은?",
  choices:["피고적격은 당사자소송에는 준용되지 않는다.","제3자의 재심청구는 당사자소송에는 준용되지 않는다.","제소기간의 제한은 당사자소송에는 준용되지 않는다.","간접강제는 무효등 확인소송에 준용된다.","행정심판과의 관계규정은 무효등 확인소송에는 준용되지 않는다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2023-80", subject:"행정소송법", year:2023, no:80, law:"행정소송법", unit:"2023년", kind:"concept",
  stem:"A시장은 청소년에게 주류를 판매하였다는 이유로 식품위생법령에 따라 甲에게 영업정지 2개월에 해당하는 처분(이하, ‘이 사건 처분’)을 하였다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["甲은 행정심판을 거치지 아니하고는 이 사건 처분에 대한 취소소송을 제기할 수 없다.","甲은 이 사건 처분에 대해 취소소송과 무효확인소송을 단순 병합하여 제기할 수 없다.","甲이 제기한 행정심판에서 이 사건 처분이 1개월로 감경된 후 취소소송을 제기할 경우 소송의 대상은 2개월에 해당하는 처분이다.","A시가 이 사건 처분에 대한 취소소송의 피고이다.","행정소송법상 이 사건 처분과 같은 청소년에 관한 사건에 대해서는 행정소송법상 집행정지가 인정되지 않는다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2024-41", subject:"행정소송법", year:2024, no:41, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"취소소송의 심리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 당사자가 주장하지 아니한 법률효과에 관한 요건사실이나 독립된 공격방어방법을 시사하여 그 제출을 권유할 수 있다.","법원은 당사자의 신청이 있는 때에는 결정으로써 재결을 행한 행정청에 대하여 행정심판에 관한 기록의 제출을 명할 수 있다.","행정소송에 있어서 직권주의가 가미되어 있다고 하더라도 기본구조는 변론주의이다.","법원은 필요하다고 인정할 때에는 직권으로 증거조사를 할 수 있다.","법원은 필요하다고 인정할 때에는 당사자가 주장하지 아니하는 사실에 대하여도 판단할 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2024-42", subject:"행정소송법", year:2024, no:42, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정청 乙은 사업자 甲에 대하여 ‘정당한 이유 없이 계약을 이행하지 않았다’는 사실을 사유로 부정당업자제재처분을 하였다. 甲이 그 처분의 취소를 구하는 소를 적법하게 제기하여 법원이 이를 심리하는 경우에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["乙은 소송계속 중 기본적 사실관계의 동일성을 해치지 않는 범위 내에서 처분사유를 변경할 수 있다.","처분사유의 추가ㆍ변경은 사실심 변론종결시까지 허용된다.","처분사유의 추가ㆍ변경에 관해서는 「행정소송법」에 명문의 규정이 없다.","乙은 소송계속 중 ‘甲이 계약의 이행과 관련하여 공무원에게 뇌물을 주었다’는 사실을 처분사유로 추가할 수 있다.","乙이 처분서에 다소 불명확하게 기재하였던 ‘당초 처분사유’를 좀 더 구체적으로 설명한 경우 이는 새로운 처분사유의 추가가 아니다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2024-43", subject:"행정소송법", year:2024, no:43, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"항고소송에서 위법판단의 기준시에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분 후 법령의 개정이 있었다면 그 개정 법령을 기준으로 처분의 위법을 판단해야 한다.","법원은 사실심 변론종결시까지 제출된 모든 자료를 종합하여 처분의 위법 여부를 판단할 수 있다.","거부처분 취소소송에서 위법판단의 기준시는 판결시이다.","행정심판의 재결을 거친 부작위위법확인소송에서 위법판단의 기준시는 처분시이다.","계속효가 있는 처분에 대한 취소소송의 경우에는 판결시를 기준으로 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2024-44", subject:"행정소송법", year:2024, no:44, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"항고소송에서의 주장ㆍ증명책임 등에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["당사자는 소송변론종결시까지 주장과 증거를 제출할 수 있다.","처분이 재량권을 일탈ㆍ남용하였다는 사정은 처분의 효력을 다투는 자가 주장ㆍ증명하여야 한다.","원고는 전심절차에서 주장하지 아니한 공격방어방법을 소송절차에서 주장할 수 없다.","과세처분 취소소송에서 처분의 적법성에 관하여는 원칙적으로 과세청인 피고가 그 증명책임을 부담한다.","집행정지의 소극적 요건에 대한 주장ㆍ소명책임은 행정청에게 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2024-45", subject:"행정소송법", year:2024, no:45, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"사정판결에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 신청이 있는 경우에만 사정판결을 할 수 있으며, 직권으로 할 수는 없다.","사정판결에서 ‘공공복리’의 판단 기준시는 처분시이다.","법원은 사정판결의 이유에서 처분등이 위법함을 나타내었다면, 그 판결의 주문에서 처분등이 위법함을 명시할 필요는 없다.","법원은 사정판결을 함에 있어서는 미리 원고가 그로 인하여 입게 될 손해의 정도와 배상방법 그 밖의 사정을 조사하여야 한다.","원고는 손해배상이 필요하더라도 손해배상청구소송을 당해 취소소송이 계속된 법원에 병합하여 제기할 수 없다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2024-46", subject:"행정소송법", year:2024, no:46, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"판례상 일부취소판결을 할 수 있는 경우를 모두 고른 것은?\n\nㄱ. 6월의 영업정지처분을 재량권의 일탈ㆍ남용을 이유로 취소하는 경우\nㄴ. 명의신탁자에 대한 과징금부과처분을 재량권의 일탈ㆍ남용을 이유로 취소하는 경우\nㄷ. 외형상 하나의 행정처분이지만 각 세대별로 가분될 수 있는 여러 세대의 임대주택분양전환승인에 대해 일부 세대가 그 승인의 취소를 구하는 경우\nㄹ. 비공개대상 정보에 해당하는 부분과 그와 분리될 수 있는 공개가 가능한 부분이 혼합되어 있는 정보의 공개 거부처분을 취소하는 경우",
  choices:["ㄱ","ㄱ, ㄴ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:3, status:"clear", note:"" },
{ id:"hs2024-47", subject:"행정소송법", year:2024, no:47, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"취소판결의 기속력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송에서 기각판결이 내려진 후에도 처분청은 해당 처분을 직권취소할 수 있다.","기속력은 당사자인 원고에게는 미치지 아니한다.","기속력에 따라 행정청은 위법한 결과를 제거하는 조치를 할 의무가 있다.","기속력은 기판력 있는 전소 판결의 소송물과 동일한 후소를 허용하지 않는 효력과는 다르다.","신청에 대한 인용처분이 실체적 위법을 이유로 취소되는 경우에 그 처분을 행한 행정청은 판결의 취지에 따라 다시 이전의 신청에 대한 처분을 하여야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2024-48", subject:"행정소송법", year:2024, no:48, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"취소소송 판결 및 집행정지 결정의 효력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분등을 취소하는 확정판결은 제3자에 대하여도 효력이 있다.","집행정지의 결정은 제3자에 대하여도 효력이 있다.","집행정지결정의 취소결정은 제3자에 대하여도 효력이 있다.","과세처분 취소청구를 기각하는 판결이 확정되면 그 처분이 적법하다는 점에 관하여 기판력이 생긴다.","과세처분의 취소소송에서 청구가 기각된 확정판결의 기판력은 그 과세처분의 무효확인을 구하는 소송에는 미치지 아니한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2024-49", subject:"행정소송법", year:2024, no:49, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정소송법상 민중소송에 관한 설명으로 옳지 않은 것은?",
  choices:["객관소송의 일종이다.","민중소송은 법률이 정한 경우에 인정되지만, 법률에 정한 자에 한하여 제기할 수 있는 소송은 아니다.","민중소송으로서 처분등의 취소를 구하는 소송에는 그 성질에 반하지 아니하는 한 취소소송에 관한 규정을 준용한다.","민중소송으로서 부작위의 위법의 확인을 구하는 소송에는 그 성질에 반하지 아니하는 한 부작위위법확인소송에 관한 규정을 준용한다.","「지방자치법」상 주민소송은 민중소송에 해당한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2024-50", subject:"행정소송법", year:2024, no:50, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"甲이 행정청 乙을 상대로 제기한 거부처분 취소소송에서 인용판결이 확정된 경우에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["판결은 관계행정청을 기속하지 않는다.","乙은 처분 후에 발생한 새로운 사유를 내세워 다시 처분을 할 수 없다.","판결의 기속력은 처분의 구체적 위법사유에 관한 이유 중의 판단에 대하여는 인정되지 아니한다.","乙이 재처분의무를 이행하지 않을 경우 법원은 직접처분으로 판결의 실효성을 확보할 수 있다.","乙은 종전 처분의 처분사유와 기본적 사실관계가 동일하지 않은 사유가 종전 처분 당시 이미 존재하고 있었고 당사자가 이를 알고 있었더라도 이를 내세워 새로이 처분을 할 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2024-51", subject:"행정소송법", year:2024, no:51, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"무효등 확인소송의 유형으로서 허용되지 않는 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분의 유효확인소송","처분의 작위의무확인소송","행정심판 재결의 무효확인소송","처분의 실효확인소송","처분의 부존재확인소송"],
  answer:2, status:"clear", note:"" },
{ id:"hs2024-52", subject:"행정소송법", year:2024, no:52, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"甲은 X처분에 대해 무효확인소송을 제기하였다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 X처분의 일부에 대해 무효확인판결을 할 수도 있다.","甲이 제기한 소송에 대해서는 민사소송에서의 ‘확인의 이익’이 요구된다.","甲이 제기한 소송에 X처분의 취소청구를 선택적 청구로서 병합할 수 있다.","甲이 제기한 소송에서 무효사유가 증명되지 아니하였다면 법원은 취소사유의 유무까지 심리할 필요는 없다.","X처분이 甲에 대한 처분이 아닌 경우 甲에게는 원고적격이 인정되지 않는다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2024-53", subject:"행정소송법", year:2024, no:53, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["부작위위법확인소송의 대상인 부작위가 되기 위해서는 당사자의 신청은 내용적으로 적법한 것이어야 한다.","부작위위법확인소송이 적법하게 제기되었다면 소송계속 중 신청에 대한 거부처분이 있더라도 해당 소송은 적법하게 유지된다.","행정입법 제정의무가 있는 경우 입법부작위도 부작위위법확인소송의 대상이 된다.","부작위위법확인소송에는 처분변경으로 인한 소의 변경에 관한 「행정소송법」 제22조가 준용되지 않는다.","부작위의 위법을 확인하는 법원의 판결이 확정되면 행정청은 원고의 신청대로 처분하여야 할 의무가 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2024-54", subject:"행정소송법", year:2024, no:54, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"제소기간에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분에 대한 무효확인의 소에 그 처분의 취소를 구하는 소를 추가적으로 병합하는 경우, 추가로 병합된 취소청구의 소는 제소기간의 제한을 받지 않는다.","부작위상태가 계속되는 한 행정심판을 거쳐 부작위위법확인소송을 제기하는 경우에도 제소기간의 제한을 받지 않는다.","민사소송으로 잘못 제기하였다가 이송결정에 따라 관할법원으로 이송하여 취소소송으로 소를 변경한 경우, 제소기간의 준수 여부는 민사소송을 제기한 때를 기준으로 한다.","행정청이 처분을 하면서 법정 제소기간보다 긴 기간으로 제소기간을 고지하였다면 그 기간 내에 제기된 소는 제소기간을 준수한 것이 된다.","당사자소송에 관하여 법령에 제소기간을 정한 경우, 그 기간은 불변기간이 아니므로 법원은 정당한 사유가 있다면 제소기간을 연장할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2024-55", subject:"행정소송법", year:2024, no:55, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"당사자소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["사인을 피고로 하는 당사자소송은 허용되지 않는다.","부가가치세 환급세액의 지급청구는 과세행정청을 피고로 하여 당사자소송으로 하여야 한다.","당사자소송과 관련청구소송이 각각 다른 법원에 계속되고 있는 경우 당사자의 신청이 없으면 법원은 직권으로 관련청구소송을 이송할 수 없다.","당사자소송으로서 확인소송을 제기하는 경우에는 민사소송에서의 ‘확인의 이익’이 요구된다.","회복하기 어려운 손해를 예방하기 위하여 긴급한 필요가 있는 경우 당사자소송을 제기하면서 집행정지를 신청할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2024-56", subject:"행정소송법", year:2024, no:56, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"판례에 의할 때 당사자소송의 대상이 되는 경우를 모두 고른 것은?\n\nㄱ. 명예퇴직한 법관이 미지급명예퇴직수당액의 지급을 구하는 경우\nㄴ. 「도시 및 주거환경정비법」상 재개발조합을 상대로 조합임원 선임결의의 무효확인을 구하는 경우\nㄷ. 「도시 및 주거환경정비법」상 재건축조합을 상대로 관리처분계획에 대한 관할 행정청의 인가ㆍ고시가 있은 후에 그 관리처분계획에 대한 조합 총회결의의 무효확인을 구하는 경우\nㄹ. 이주자가 이주대책대상자 결정이 있기 이전에 사업시행자를 상대로 이주대책상의 수분양권의 확인을 구하는 경우\nㅁ. 지방자치단체가 보조금 지급결정을 하면서 일정한 기한 내 보조금 반환을 교부조건으로 부가하였고, 그 부관상 의무에 따라 보조사업자에 대하여 보조금의 반환을 청구하는 경우",
  choices:["ㄱ, ㅁ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㅁ","ㄱ, ㄷ, ㄹ"],
  answer:1, status:"clear", note:"" },
{ id:"hs2024-57", subject:"행정소송법", year:2024, no:57, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정소송법상 허용되는 것은? (다툼이 있으면 판례에 따름)",
  choices:["거부처분에 대한 의무이행소송","공법상 사실관계에 대한 부존재확인소송","처분의 부작위에 대한 작위의무확인소송","장래 처분에 대한 예방적 확인소송","공법상 계약에 따른 의무에 대한 이행청구소송"],
  answer:5, status:"clear", note:"" },
{ id:"hs2024-58", subject:"행정소송법", year:2024, no:58, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"甲이 거부처분에 대해 제기한 항고소송(X)에서 인용판결이 확정되었으나 재처분의무가 이행되고 있지 않다. 간접강제와 관련한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["X가 취소소송인 경우, 甲은 제1심수소법원에 간접강제결정을 신청할 수 있다.","X가 무효확인소송인 경우, 甲은 간접강제결정을 신청할 수 없다.","간접강제결정에서 정한 의무이행기한이 경과한 후라도 재처분의 이행이 있으면 甲은 더 이상 배상금을 추심할 수 없다.","간접강제결정은 피고 행정청 외에 그가 속하는 국가 또는 공공단체에는 효력을 미치지 않는다.","X가 취소소송인 경우, 만약 재처분을 하였더라도 기속력에 반하는 것이라면 甲은 간접강제결정을 신청할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2024-59", subject:"행정소송법", year:2024, no:59, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"제3자에 의한 재심청구에 관한 설명으로 옳은 것은?",
  choices:["제3자의 재심청구에 관한 규정은 당사자소송에는 준용되지 않는다.","재심청구는 확정판결이 있음을 안 날로부터 90일 이내에 제기하여야 한다.","소송에 참가한 자라도 자기에게 책임없는 사유로 공격 또는 방어방법을 제출하지 못한 제3자는 재심을 청구할 수 있다.","부작위위법확인소송의 경우에는 재심청구가 인정되지 않는다.","‘판결이 확정된 날로부터 1년 이내’라는 재심청구기간은 불변기간이 아니다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2024-60", subject:"행정소송법", year:2024, no:60, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"다음 사례에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)\n\n○ A행정청은 자신의 명의로 甲에 대해 중대명백한 하자가 있는 X처분을 하였다.\n○ 법령상 X처분에 대한 권한은 B행정청에 있고 A행정청에 내부위임되어 있다.",
  choices:["甲이 X처분에 대해 취소소송을 제기하는 경우 제소기간의 제한이 없다.","甲이 X처분에 대해 이의신청을 거쳐 취소소송을 제기하는 경우 제소기간의 기산점은 X처분이 있음을 안 날이다.","甲이 X처분에 대해 무효확인소송을 제기하는 경우 A행정청을 피고로 하여야 한다.","甲이 X처분에 대해 제기한 무효확인소송에서 기각판결이 있은 경우 기판력에 의해 甲은 X처분에 대해 다시 취소소송을 제기할 수 없다.","X처분이 甲에 대한 징계처분인 경우 X처분을 취소하는 판결이 확정되면 A행정청은 기속력에 따라 재처분을 하여야 한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2024-61", subject:"행정소송법", year:2024, no:61, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정소송의 원고적격에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["「행정소송법」은 당사자소송의 원고적격에 관하여 규정하고 있지 않다.","행정처분의 직접 상대방이 아닌 제3자라고 하더라도 당해 행정처분으로 인하여 법률상 보호되는 이익을 침해당한 경우에는 취소소송을 제기할 수 있다.","사실적ㆍ경제적 이해관계를 갖는 데 불과한 경우에도 무효등 확인소송의 원고적격은 인정된다.","행정주체에 대해서도 항고소송의 원고적격이 인정될 수 있다.","원고적격은 법원의 직권조사사항이다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2024-62", subject:"행정소송법", year:2024, no:62, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"항고소송의 피고적격에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["국회의 기관은 피고적격이 인정될 수 없다.","대외적으로 의사를 표시하지 않은 내부기관은 실질적인 의사가 그 기관에 의하여 결정되더라도 피고적격을 갖지 못한다.","피고적격이 인정되는 행정청에는 합의제 행정청도 포함된다.","중앙노동위원회의 처분에 대한 취소소송의 피고는 중앙노동위원회 위원장이다.","법령에 의하여 행정권한의 위탁을 받은 사인도 피고가 될 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2024-63", subject:"행정소송법", year:2024, no:63, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정소송법상 피고경정에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["피고경정은 사실심 변론종결시까지 허용된다.","피고경정신청을 인용한 결정에 대하여는 종전 피고는 항고제기의 방법으로 불복신청할 수 없다.","관련청구의 병합이 있는 경우 법원의 피고경정결정을 받아야 한다.","원고가 피고를 잘못 지정하였다면 법원으로서는 석명권을 행사하여 원고로 하여금 피고를 경정하게 하여 소송을 진행케 하여야 한다.","피고경정의 결정이 있은 때에는 종전의 피고에 대한 소송은 취하된 것으로 본다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2024-64", subject:"행정소송법", year:2024, no:64, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정소송법상 소송참가에 관한 설명으로 옳지 않은 것은?",
  choices:["법원은 다른 행정청을 당사자 또는 당해 행정청의 신청 또는 직권에 의하여 결정으로써 소송에 참가시킬 수 있다.","소송참가는 상고심에서도 가능하다.","법원은 제3자의 소송참가를 결정하고자 할 때에는 미리 당사자 및 제3자의 의견을 들어야 한다.","소송에 참가한 제3자는 단순한 보조참가인으로서 소송수행을 한다.","소송참가 신청을 한 제3자는 그 신청을 각하한 결정에 대하여 즉시항고할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2024-65", subject:"행정소송법", year:2024, no:65, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정소송법상 취소소송과 그 관련청구소송의 이송에 관한 설명으로 옳지 않은 것은?",
  choices:["취소소송과 관련청구소송이 각각 다른 법원에 계속되어야 한다.","관련청구소송이 계속된 법원이 이송이 상당하다고 인정하여야 한다.","당사자의 신청 또는 법원의 직권에 의해 이송결정이 있어야 한다.","이송받은 법원은 이를 다시 다른 법원에 이송할 수 없다.","취소소송을 관련청구소송이 계속된 법원으로 이송할 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2024-66", subject:"행정소송법", year:2024, no:66, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정소송에 관하여 적용ㆍ준용되지 않는 것은?",
  choices:["행정소송규칙","행정심판법","민사소송법","민사집행법","법원조직법"],
  answer:2, status:"clear", note:"" },
{ id:"hs2024-67", subject:"행정소송법", year:2024, no:67, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정소송법상 확정판결에 기속력이 인정되는 것을 모두 고른 것은?\n\nㄱ. 취소소송의 각하판결\nㄴ. 취소소송의 일부취소판결\nㄷ. 무효확인소송의 무효확인판결\nㄹ. 취소소송의 사정판결\nㅁ. 당사자소송의 이행판결",
  choices:["ㄱ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㅁ","ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],
  answer:3, status:"clear", note:"" },
{ id:"hs2024-68", subject:"행정소송법", year:2024, no:68, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"취소소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송이란 위법한 처분등을 취소 또는 변경하는 소송이며, 여기서 ‘변경’이란 적극적 의미의 변경을 의미한다.","인허가가 의제된 처분의 경우 주된 인허가처분 외에 의제된 인허가처분만의 취소를 구할 수 있다.","과세표준과 세액을 증액하는 증액경정처분의 경우 증액경정처분이 취소소송의 대상이 된다.","「행정대집행법」상 제2차의 계고처분은 대집행기한의 연기통지에 불과하므로 행정처분이 아니다.","지방법무사회는 취소소송의 피고가 될 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2024-69", subject:"행정소송법", year:2024, no:69, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정소송법 제6조의 내용으로 (  )에 들어갈 용어로 옳은 것은?\n\n행정소송에 대한 ( ㄱ )에 의하여 ( ㄴ )이 헌법 또는 법률에 위반된다는 것이 확정된 경우에는 대법원은 지체없이 그 사유를 ( ㄷ )에게 통보하여야 한다.",
  choices:["ㄱ: 판결, ㄴ: 명령ㆍ규칙, ㄷ: 법제처장","ㄱ: 판결, ㄴ: 대통령령, ㄷ: 행정안전부장관","ㄱ: 대법원판결, ㄴ: 명령ㆍ규칙, ㄷ: 행정안전부장관","ㄱ: 대법원판결, ㄴ: 명령ㆍ규칙, ㄷ: 법제처장","ㄱ: 대법원판결, ㄴ: 대통령령, ㄷ: 행정안전부장관"],

{ id:"hs2024-70", subject:"행정소송법", year:2024, no:70, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정소송법상 재결취소소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["행정심판의 재결을 거친 경우에는 원칙적으로 재결을 취소소송의 대상으로 하여야 한다.","재결의 고유한 위법에는 내용상의 위법은 포함되지 않는다.","변경재결이 있는 경우 원처분을 소송대상으로 행정심판위원회를 피고로 취소소송을 제기하여야 한다.","적법한 행정심판청구를 각하한 재결은 재결에 고유한 위법이 있는 경우에 해당한다.","재결취소소송을 제기하였으나 재결에 고유한 위법이 없는 경우에는 각하판결을 하여야 한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2024-71", subject:"행정소송법", year:2024, no:71, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"소를 변경하는 경우 처음에 소를 제기한 때 제기된 것으로 보는 경우를 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 취소소송을 당사자소송으로 변경하는 경우\nㄴ. 무효확인소송을 취소소송으로 변경하는 경우\nㄷ. 당사자소송을 취소소송으로 변경하는 경우\nㄹ. 이송결정이 확정된 후 민사소송을 취소소송으로 변경하는 경우",
  choices:["ㄱ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"hs2024-72", subject:"행정소송법", year:2024, no:72, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"중앙토지수용위원회의 수용재결과 관련된 행정소송으로 그 피고가 나머지와 다른 것은?",

{ id:"hs2024-73", subject:"행정소송법", year:2024, no:73, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정청 A는 2024. 2. 1. 甲에게 1월의 영업정지처분을 하였다. 이에 대해 甲이 청구한 행정심판에서 영업정지 1월에 갈음하는 과징금으로 변경을 명하는 재결이 있었고, 이에 따라 A는 2024. 4. 29. 과징금 100만원을 부과하는 처분을 하였다. 이 경우 甲이 제기하는 취소소송의 대상과 제소기간 기산점이 옳게 연결된 것은? (다툼이 있으면 판례에 따름)",
  choices:["2024. 2. 1.자 1월의 영업정지처분 - 재결서의 정본을 송달받은 날","2024. 2. 1.자 100만원 과징금부과처분 - 재결서의 정본을 송달받은 날","2024. 2. 1.자 100만원 과징금부과처분 - 과징금 부과처분이 있음을 안 날","2024. 4. 29.자 100만원 과징금부과처분 - 재결서의 정본을 송달받은 날","2024. 4. 29.자 100만원 과징금부과처분 - 과징금 부과처분이 있음을 안 날"],
  answer:2, status:"clear", note:"" },
{ id:"hs2024-74", subject:"행정소송법", year:2024, no:74, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"필요적 행정심판전치주의의 경우 취소소송의 제기에 관하여 (  )에 들어갈 내용으로 옳은 것은?\n\n○ 행정심판의 청구가 있은 날부터 ( ㄱ )이 지나도 재결이 없는 때에는 행정심판의 재결을 거치지 아니하고 취소소송을 제기할 수 있다.\n○ 취소소송은 재결이 있은 날부터 ( ㄴ )을 경과하면 제기하지 못한다. 다만 정당한 사유가 있는 때에는 그러하지 아니하다.",
  choices:["ㄱ: 60일, ㄴ: 90일","ㄱ: 60일, ㄴ: 1년","ㄱ: 90일, ㄴ: 90일","ㄱ: 90일, ㄴ: 180일","ㄱ: 90일, ㄴ: 1년"],
  answer:2, status:"clear", note:"" },
{ id:"hs2024-75", subject:"행정소송법", year:2024, no:75, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"행정소송법상 ‘법률이 정한 경우에 법률에 정한 자에 한하여’ 제기할 수 있는 소송은? (다툼이 있으면 판례에 따름)",
  choices:["군수의 소속 공무원에 대한 승진임용처분을 도지사가 취소한 처분에 대해서 군수가 제기하는 소송","지방자치단체의 장이 건축협의를 취소한 것에 대해서 상대 지방자치단체가 제기하는 소송","지방자치단체의 장이 건축협의를 거부한 것에 대해서 국가가 제기하는 소송","보건소장의 국립대학교 보건진료소 직권폐업처분에 대해서 국가가 제기하는 소송","국민권익위원회가 시ㆍ도선거관리위원회 위원장에게 소속 직원에 대한 불이익처분을 하지 말 것을 요구하는 내용의 조치요구에 대해서 그 위원장이 제기하는 소송"],

{ id:"hs2024-76", subject:"행정소송법", year:2024, no:76, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"보조금 교부결정의 취소처분에 대한 취소소송에서 본안판결 선고시까지 그 효력을 정지하는 결정이 있는 경우에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["집행정지의 결정에 대한 즉시항고에는 그 결정의 집행을 정지하는 효력이 없다.","즉시항고는 재판이 고지된 날부터 1주 이내에 하여야 한다.","만약 집행정지의 결정 없이 본안소송에서 보조금 교부결정의 취소처분이 취소되어 확정되었다면 사후적으로 보조금을 지급하는 것이 취소판결의 기속력에 부합한다.","본안소송의 판결 선고에 의하여 집행정지결정의 효력은 소멸한다.","집행정지결정의 효력이 소멸하는 경우 특별한 사정이 없는 한 집행정지기간 동안 교부된 보조금의 반환을 명할 수 없다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2024-77", subject:"행정소송법", year:2024, no:77, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"국세 또는 지방세를 부과하는 처분에 대해서는 ‘행정심판’을 거치지 아니하면 취소소송을 제기할 수 없다. 여기서 ‘행정심판’에 해당하는 것으로 법률에서 정하고 있지 않은 것은?",

  choices:["ㄱ, ㄴ","ㄴ, ㅁ","ㄱ, ㄷ, ㄹ","ㄱ, ㄷ, ㅁ","ㄴ, ㄹ, ㅁ"],

{ id:"hs2024-79", subject:"행정소송법", year:2024, no:79, law:"행정소송법", unit:"2024년", kind:"concept",

  choices:["불가쟁력이 생긴 행정처분의 변경신청에 대해서 그 처분을 그대로 유지하기로 하는 거부결정","환경영향평가 대상지역 내 주민이 공유수면매립면허의 취소를 신청한 것에 대한 거부결정","건축물대장의 작성에 대한 신청을 반려하는 행위","개발부담금을 납부한 후 개발부담금에서 공제되어야 하는 학교용지부담금을 납부한 경우 그 금액에 대한 개발부담금의 환급을 신청한 것에 대한 거부결정","이주대책대상제외결정에 대한 이의신청을 새로운 신청으로 볼 수 있는 경우 그 이의신청에 대한 기각결정"],

{ id:"hs2024-80", subject:"행정소송법", year:2024, no:80, law:"행정소송법", unit:"2024년", kind:"concept",
  stem:"판례에 의할 때 특별한 사정이 없는 한 소의 이익이 인정되는 경우는?",

{ id:"hs2025-41", subject:"행정소송법", year:2025, no:41, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송의 구분에 관한 행정소송법 규정의 일부이다. (  )에 들어갈 내용으로 옳은 것은?\n\n○ 항고소송: 행정청의 ( ㄱ )이나 ( ㄴ )에 대하여 제기하는 소송\n○ 기관소송: 국가 또는 ( ㄷ )의 기관상호간에 있어서의 권한의 존부 또는 그 행사에 관한 다툼이 있을 때에 이에 대하여 제기하는 소송",
