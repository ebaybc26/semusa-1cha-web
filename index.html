  answer:3, status:"clear", note:"" },
{ id:"hs2025-42", subject:"행정소송법", year:2025, no:42, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"소송비용에 관한 설명으로 옳지 않은 것은?",
  choices:["취소청구가 사정판결에 의하여 기각된 경우 소송비용은 피고가 부담한다.","행정청이 처분을 취소함으로 인하여 청구가 각하된 경우 소송비용은 피고가 부담한다.","소송비용에 관한 재판이 확정된 때에는 참가인이었던 행정청이 소속하는 국가 또는 공공단체에 그 효력을 미친다.","소송비용에 관하여는 「행정소송법」의 규정 외에도 「민사소송법」 규정이 준용된다.","소송비용의 부담을 규정한 「행정소송법」 제32조는 당사자소송에 준용되지 않는다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-43", subject:"행정소송법", year:2025, no:43, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송의 재판관할에 관한 설명으로 옳지 않은 것은?",
  choices:["국가의 사무를 위탁받은 공공단체의 장을 피고로 하는 취소소송은 대법원소재지를 관할하는 행정법원에 제기할 수 있다.","중앙행정기관을 피고로 하는 취소소송은 대법원소재지를 관할하는 행정법원에 제기할 수 있다.","중앙행정기관의 부속기관을 피고로 하는 취소소송은 대법원소재지를 관할하는 행정법원에 제기할 수 있다.","특정의 장소에 관계되는 처분에 대한 취소소송은 그 장소의 소재지를 관할하는 행정법원에 제기할 수 있다.","취소소송의 제1심관할법원은 원고의 소재지를 관할하는 행정법원으로 한다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-44", subject:"행정소송법", year:2025, no:44, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"항고소송에 있어 관련청구소송의 이송ㆍ병합에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송과 당해 처분과 관련되는 부당이득반환 청구소송이 다른 법원에 계속되고 있는 경우 법원은 취소소송을 관련청구소송이 계속된 법원으로 이송할 수 있다.","관련청구소송의 이송은 법원이 상당하다고 인정하는 때에 한하여 허용된다.","관련청구소송의 이송은 법원의 직권으로도 할 수 있다.","취소소송의 피고 외의 자를 상대로 한 관련청구소송은 취소소송이 계속된 법원에 병합하여 제기할 수 있다.","관련청구소송의 병합은 사실심의 변론종결시까지 할 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-46", subject:"행정소송법", year:2025, no:46, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송법상 법률상 이익에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["당해 처분의 근거 법규와 관련 법규에 의하여 보호되는 개별적ㆍ직접적ㆍ구체적 이익이 있는 자는 법률상 이익이 인정된다.","부작위위법확인소송은 처분의 신청을 한 자로서 부작위의 위법의 확인을 구할 법률상 이익이 있는 자만이 제기할 수 있다.","개발제한구역 안에서의 공장설립을 승인한 처분이 쟁송취소되었다면, 그 승인처분에 기초한 공장건축허가처분이 잔존하더라도 인근 주민은 공장건축허가처분의 취소를 구할 법률상 이익이 없다.","사실심 변론종결시에 법률상 이익을 갖추었더라도 상고심에서 이를 흠결하면 부적법한 소가 된다.","처분의 효과가 소멸된 뒤에 취소소송을 제기하려면 그 처분의 취소로 인하여 회복되는 법률상 이익이 있어야 한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-47", subject:"행정소송법", year:2025, no:47, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"항고소송에서 원고적격이 인정되는 것은? (다툼이 있으면 판례에 따름)",
  choices:["대학교 직원 노동조합이 교육부장관의 학교법인 임시이사 선임처분의 취소를 구하는 경우","기존 담배 일반소매인이 신규 구내소매인 지정처분의 취소를 구하는 경우","대한의사협회가 보건복지부 고시인 ‘건강보험요양급여행위 및 그 상대가치점수 개정’의 취소를 구하는 경우","한의사가 한약조제시험을 통하여 한약조제권을 인정받은 약사에 대한 합격처분의 무효확인을 구하는 경우","지방자치단체가 건축물 소재지 관할 허가권자인 다른 지방자치단체의 장을 상대로 「건축법」상 건축협의 취소의 취소를 구하는 경우"],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-48", subject:"행정소송법", year:2025, no:48, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"항고소송의 피고에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["이해관계 있는 제3자도 피고경정을 신청할 수 있다.","피고경정 결정이 있은 때에는 종전의 피고에 대한 소송은 취하된 것으로 본다.","원고가 피고를 잘못 지정하여 피고경정 결정이 있은 때에는 새로운 피고에 대한 소송은 처음에 소를 제기한 때에 제기된 것으로 본다.","지방의회를 피고로 하여 제기한 조례무효확인소송은 부적법하다.","저작권심의조정위원회 위원장을 피고로 저작권 등록처분의 무효확인을 구하는 소는 부적법하다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-49", subject:"행정소송법", year:2025, no:49, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송법상 소송참가에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 당사자 또는 제3자의 신청 또는 직권에 의하여 결정으로써 그 제3자를 소송에 참가시킬 수 있다.","참가신청을 한 제3자는 그 신청을 각하한 결정에 대하여 즉시항고할 수 있다.","「행정소송법」상의 소송참가 외에 「민사소송법」에 따른 보조참가는 허용되지 않는다.","참가인은 소송에 관하여 공격ㆍ방어ㆍ이의ㆍ상소, 그 밖의 모든 소송행위를 할 수 있지만, 참가할 때의 소송의 진행정도에 따라 할 수 없는 소송행위는 그러하지 아니하다.","참가한 행정청의 소송행위가 피참가인의 소송행위에 어긋나는 경우에는 그 참가인의 소송행위는 효력을 가지지 아니한다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-50", subject:"행정소송법", year:2025, no:50, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"공부(公簿)상 기재행위와 관련하여 처분성이 인정되지 않는 것은? (다툼이 있으면 판례에 따름)",
  choices:["토지대장 직권말소행위","토지대장상의 소유자명의변경신청 거부행위","건축물대장 작성신청 반려행위","건축물대장 용도변경신청 거부행위","지적공부상 토지면적등록 정정신청 반려행위"],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-51", subject:"행정소송법", year:2025, no:51, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정심판전치주의에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["지방세 부과처분을 다투는 경우에는 필요적 행정심판전치주의가 적용된다.","전심절차에 있어서의 주장과 행정소송에 있어서의 주장은 일치하여야 하므로 전심절차에 있어서 주장하지 아니한 사항은 행정소송에서 주장할 수 없다.","행정심판전치주의는 부작위위법확인소송에 준용된다.","무효선언을 구하는 취지의 취소소송에는 행정심판전치주의가 적용된다.","필요적 행정심판전치주의의 경우 행정심판을 제기함이 없이 취소소송을 제기할 수 있는 사유는 원고가 이를 소명해야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-45", subject:"행정소송법", year:2025, no:45, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"처분의 효력 유무 또는 존재 여부가 민사소송의 선결문제로 되어 당해 민사소송의 수소법원이 이를 심리ㆍ판단하는 경우에 준용되는 행정소송법 규정이 아닌 것은?",
  choices:["피고경정","행정심판기록의 제출명령","직권심리","소송비용에 관한 재판의 효력","행정청의 소송참가"],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-52", subject:"행정소송법", year:2025, no:52, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송법상 취소소송에 규정된 사항으로 당사자소송에 준용되는 것을 모두 고른 것은?\n\nㄱ. 재판관할\nㄴ. 직권심리\nㄷ. 행정심판기록의 제출 명령\nㄹ. 집행정지",
  choices:["ㄱ","ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-53", subject:"행정소송법", year:2025, no:53, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"집행정지의 요건에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["집행정지의 소극적 요건인 ‘공공복리에 중대한 영향을 미칠 우려’에 대한 주장ㆍ소명책임은 원고에게 있다.","집행정지는 본안소송이 계속될 것을 요하나, 그 본안소송이 소송요건을 갖춘 적법한 것이어야 하는 것은 아니다.","본안 처분 자체의 적법 여부에 관하여 판단하지 않은 채 집행정지의 요건을 충족하지 않는다는 이유로 집행정지 신청을 배척하였더라도 위법하지 않다.","집행정지는 법원의 직권에 의하여 할 수 없다.","신청인의 본안청구가 이유 없음이 명백하지 않아야 한다는 것은 집행정지의 요건에 포함되지 않는다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-54", subject:"행정소송법", year:2025, no:54, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"집행정지에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["처분등의 효력의 일부에 대해서도 집행정지할 수 있다.","취소소송과 무효확인소송에서는 집행정지가 허용될 수 있다.","집행정지의 결정에 대하여는 즉시항고할 수 있으나 이 즉시항고에는 결정의 집행을 정지하는 효력이 없다.","본안에서 계쟁처분이 최종적으로 적법한 것으로 확정되면 집행정지결정의 효력은 소급하여 소멸한다.","일정한 납부기한을 정한 과징금부과처분에 대한 집행정지결정이 내려진 경우 그 집행정지기간 동안에는 납부기간이 진행되지 않는다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-55", subject:"행정소송법", year:2025, no:55, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"제소기간에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소소송에서 청구취지를 변경하여 구 소가 취하되고 새로운 소가 제기된 것으로 변경이 이루어진 경우 새로운 소에 대한 제소기간의 준수는 원칙적으로 소 변경이 있은 때를 기준으로 한다.","부작위위법확인소송의 경우 행정심판을 거쳤는지 여부를 묻지 않고 제소기간의 제한을 받지 않는다.","필요적 행정심판전치주의 하에서 행정심판 제기 후 30일이 지나도 재결이 없는 경우 언제든지 취소소송을 제기할 수 있다.","「행정소송법」에는 제소기간 불고지 및 오고지의 효과에 관하여 규정하고 있다.","행정심판 청구기간을 도과하여 각하된 후 재결서 송달일부터 90일 내에 취소소송을 제기하였다면 제소기간을 준수한 것으로 볼 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-56", subject:"행정소송법", year:2025, no:56, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"소의 변경에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법원은 청구의 기초에 변경이 없는 한 사실심의 변론종결시까지 소의 변경을 허가할 수 있다.","취소소송을 제기하였다가 당사자소송으로 소 변경을 허용할 경우 제소기간 준수여부 판단기준에는 변경된 당사자소송의 제소기간이 적용된다.","「행정소송법」은 행정소송과 민사소송 간 소 변경을 규정하고 있다.","소 변경은 원고의 신청 없이도 법원의 직권으로 할 수 있다.","처분변경으로 인한 소 변경의 신청은 처분의 변경이 있음을 안 날로부터 90일 이내에 하여야 한다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-57", subject:"행정소송법", year:2025, no:57, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"원처분주의 또는 재결주의의 연결이 옳지 않은 것은?",
  choices:["감사원의 변상판정에 대한 재심의 판정에 대한 불복 - 재결주의","지방노동위원회의 처분에 대한 중앙노동위원회의 재심판정에 대한 불복 - 재결주의","관할 지방토지수용위원회의 수용재결에 대한 중앙토지수용위원회의 이의재결에 대한 불복 - 원처분주의","공립학교 교원의 징계처분에 대한 교원소청심사위원회의 결정에 대한 불복 - 재결주의","특허출원에 대한 심사관의 거절결정에 대한 특허심판원의 심결에 대한 불복 - 재결주의"],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-58", subject:"행정소송법", year:2025, no:58, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"소송형식의 연결이 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["구 「산업집적활성화 및 공장설립에 관한 법률」에 따른 산업단지관리공단의 입주변경계약의 취소를 다투는 소송 - 당사자소송","국유재산 무단 점유자에 대한 변상금 부과처분의 취소를 다투는 소송 - 항고소송","구 「도시 및 주거환경정비법」상 재개발조합 조합장의 지위를 다투는 소송 - 민사소송","구 「공무원연금법」상 공무원연금관리공단의 급여 결정에 불복하는 소송 - 취소소송","국가의 훈기부상 화랑무공훈장을 수여받은 것으로 기재되어 있는 원고가 태극무공훈장을 수여받은 자임의 확인을 구하는 소송 - 당사자소송"],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-59", subject:"행정소송법", year:2025, no:59, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"항고소송의 대상인 처분에 해당하는 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 개별공시지가의 결정\nㄴ. 건축법상 이행강제금 납부의 최초 독촉\nㄷ. 지방의회의 의장선임의결\nㄹ. 금융기관의 임원에 대한 금융감독원장의 문책 경고",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-60", subject:"행정소송법", year:2025, no:60, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송에 관한 판례의 입장으로 옳지 않은 것은?",
  choices:["부작위위법확인소송으로 작위의무의 이행을 구할 수 없다.","상수원에서 급수를 받고 있는 지역주민들은 구 「수도법」상 상수원보호구역변경처분의 취소를 구할 법률상의 이익이 없다.","토지구획정리조합으로부터 조합원에 대한 구 「토지구획정리사업법」상의 청산금채권을 양수한 사람은 민사소송에 의하여 양수금의 지급을 구할 수 있다.","당사자소송에 있어서 원고가 피고를 잘못 지정한 때에 법원은 바로 각하할 것이 아니라 석명권을 행사하여 정당한 피고로 경정하게 해야 한다.","「병역법」상 군의관의 신체등위판정은 항고소송의 대상이 아니다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-61", subject:"행정소송법", year:2025, no:61, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"취소소송상 소송요건심리 단계에서 판단해야 할 사항이 아닌 것은? (다툼이 있으면 판례에 따름)",
  choices:["원고적격의 존재여부","소의 이익의 존재여부","전심절차의 준수여부","처분절차의 준수여부","처분성의 존재여부"],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-62", subject:"행정소송법", year:2025, no:62, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송상 특수한 소송심리 방법에 해당하는 것은?",
  choices:["공개심리주의","쌍방심리주의","구술심리주의","변론주의","직권심리주의"],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-63", subject:"행정소송법", year:2025, no:63, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"항고소송의 입증책임 또는 증명책임에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 처분의 적법성에 대한 입증책임은 일반적으로 원고가 진다.\nㄴ. 재량권의 일탈ㆍ남용은 원고가 증명한다.\nㄷ. 사실의 증명은 추호의 의혹도 없어야 한다는 자연과학적 증명에 따른다.\nㄹ. 허가기준 미달을 이유로 불허가한 경우 그 처분이 적법하다는 주장과 입증의 책임은 처분청에게 있다.",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-64", subject:"행정소송법", year:2025, no:64, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"처분사유의 추가ㆍ변경에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["「행정소송법」상 명문의 근거규정은 존재하지 않는다.","처분사유 자체가 아니라 처분사유의 근거가 되는 기초사실 내지 평가요소에 지나지 않는 사정은 추가로 주장할 수 있다.","처분의 사실관계에 변경이 없는 한 적용법령만을 추가하거나 변경하는 것은 가능하다.","행정청의 처분사유의 추가ㆍ변경은 사실심 개시전까지만 허용된다.","입찰참가자격을 제한시킨 당초의 처분 사유인 정당한 이유 없이 계약을 이행하지 않은 사실과 항고소송에서 새로 주장한 계약의 이행과 관련하여 관계 공무원에게 뇌물을 준 사실은 기본적 사실관계의 동일성이 없다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-65", subject:"행정소송법", year:2025, no:65, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송의 판결에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["청구의 전부 또는 일부를 인용하는 판결은 본안판결이다.","항고소송의 판결서는 「민사소송법」이 아닌 「행정소송법」에 규정된 특수한 기재방법을 준수해야 한다.","판결은 재판장이 판결원본에 따라 주문을 읽어 선고하며, 필요한 때에는 이유를 간략히 설명할 수 있다.","판결은 당사자가 출석하지 아니하여도 선고할 수 있다.","판결주문은 그 내용이 특정되어 있고 그 주문 자체에서 특정할 수 있어야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-66", subject:"행정소송법", year:2025, no:66, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"사정판결에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["사정판결은 중간판결에 해당한다.","사정판결에서 처분의 위법성 판단 기준시점은 처분시이다.","사정판결은 공공복리의 증진과 행정의 적법성 확보를 위하여 필요하다면 널리 사용되어져야 한다.","사정판결은 처분이 위법하지 않음이 확인되어도 가능하다.","사정판결은 당사자의 신청이 있는 경우에만 할 수 있다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-67", subject:"행정소송법", year:2025, no:67, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"판결에 의하지 않는 취소소송의 종료에 관한 설명으로 옳은 것은?",
  choices:["피고는 원고가 제기한 소의 일부를 인정하는 경우 소의 취하를 할 수 있다.","원고가 자기의 소송상 청구가 이유 없음을 자인하는 인낙은 사실심 종결후에도 가능하다.","재판장은 신속하고 공정한 분쟁 해결과 국민의 권익 구제를 위하여 필요하다고 인정하는 경우에는 소송계속 중인 사건에 대하여 직권으로 소의 취하, 처분등의 취소 또는 변경, 그 밖에 다툼을 적정하게 해결하기 위해 필요한 사항을 서면으로 권고할 수 있다.","재판장이 소송계속 중인 사건에 대하여 처분등의 취소를 구두로 권고하는 경우에는 이해관계인, 그 밖의 참고인을 심문하여야 한다.","청구의 포기는 원고 또는 피고가 할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-68", subject:"행정소송법", year:2025, no:68, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"판결의 효력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["취소판결의 기속력은 「행정소송법」에 규정되어 있다.","처분을 취소하는 확정판결의 효력은 소송에 참여한 당사자에게만 미친다.","과세처분의 취소소송에서 청구가 기각된 확정판결의 기판력은 그 과세처분의 무효확인을 구하는 소송에도 미친다.","확정판결은 주문에 포함된 것에 한하여 기판력을 가진다.","과세처분을 취소하는 판결이 확정된 후, 과세관청에서 그 과세처분을 경정하는 경정처분을 하였다면 당연무효의 처분이다."],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-69", subject:"행정소송법", year:2025, no:69, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송법상 간접강제에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["간접강제는 「행정소송법」에 규정되어 있으므로 「민사집행법」 제262조(채무자의 심문)의 규정은 준용될 수 없다.","행정처분에 대하여 무효확인 판결이 내려진 경우에는 그 행정처분이 거부처분인 경우에도 행정청에 판결의 취지에 따른 재처분의무가 인정될 뿐 그에 대하여 간접강제까지 허용되는 것은 아니다.","간접강제의 결정은 변론없이 할 수 있다.","간접강제 신청은 제1심수소법원에 하여야 한다.","간접강제결정에 기한 배상금은 확정판결의 취지에 따른 재처분의 지연에 대한 제재나 손해배상이 아니라 재처분의 이행에 관한 심리적 강제수단이다."],
  answer:1, status:"clear", note:"" },
{ id:"hs2025-70", subject:"행정소송법", year:2025, no:70, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송법상 제3자에 의한 재심청구에 관한 설명이다. (  )에 들어갈 내용으로 옳은 것은?\n\n재심청구는 확정판결이 있음을 안 날로부터 ( ㄱ ) 이내, 판결이 확정된 날로부터 ( ㄴ ) 이내에 제기하여야 하며, 이 기간은 ( ㄷ )으로 한다.",
  choices:["ㄱ: 30일, ㄴ: 60일, ㄷ: 시효기간","ㄱ: 30일, ㄴ: 1년, ㄷ: 불변기간","ㄱ: 60일, ㄴ: 90일, ㄷ: 시효기간","ㄱ: 60일, ㄴ: 1년, ㄷ: 불변기간","ㄱ: 90일, ㄴ: 1년, ㄷ: 시효기간"],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-71", subject:"행정소송법", year:2025, no:71, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"무효등확인소송에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["과세처분무효확인소송의 경우 소송물은 권리 또는 법률관계의 존부 확인을 구하는 것이다.","과세처분무효확인소송에서 당사자가 청구원인에서 무효사유로 내세운 개개의 주장은 공격방어방법에 불과하다.","무효등확인소송에는 취소소송의 공동소송에 관한 규정이 준용된다.","행정처분의 당연무효를 주장하여 그 무효확인을 구하는 원고에게 그 행정처분이 무효인 사유를 증명할 책임이 있다.","외형상 하나의 행정처분이라면 가분성이 있거나 그 처분대상의 일부가 특정될 수 있더라도 일부만의 무효확인은 할 수 없다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-72", subject:"행정소송법", year:2025, no:72, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송법상 취소소송에 관한 규정 중 무효등확인소송에 준용되는 것은?",
  choices:["제17조 (행정청의 소송참가)","제28조 (사정판결)","제32조 (소송비용의 부담)","제21조 (소의 변경)","제18조 (행정심판과의 관계)"],
  answer:[1,4], status:"note", note:"⚠️ 복수정답 문제입니다 — 공식적으로 ①과 ④ 모두 정답 처리됐습니다. 제17조(행정청의 소송참가)와 제21조(소의 변경) 모두 무효등확인소송에 준용됩니다." },
{ id:"hs2025-73", subject:"행정소송법", year:2025, no:73, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"부작위위법확인소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["형사본안사건에서 무죄가 선고되어 확정됨에 따라 압수물의 환부를 피압수자가 신청하였는데 검사가 아무런 결정이나 통지를 하지 않고 있으면 그와 같은 검사의 부작위는 부작위위법확인소송의 대상이 될 수 있다.","당사자의 신청에 대한 행정청의 거부처분은 부작위위법확인소송의 대상이 된다.","부작위위법확인판결이 확정되면 행정청은 판결의 취지에 따라 이전의 신청에 대한 처분을 할 의무를 진다.","부작위위법확인소송을 당사자소송으로 변경하는 것은 허용되지 않는다.","부작위위법확인소송에서는 취소소송에 있어서의 집행정지제도가 준용된다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-74", subject:"행정소송법", year:2025, no:74, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"부작위위법확인소송에서의 판결에 관한 설명으로 옳지 않은 것은?",
  choices:["부작위위법확인소송에서는 사정판결이 허용되지 않는다.","부작위위법확인판결의 기속력은 그 사건에 관하여 당사자인 행정청과 그 밖의 관계행정청에 미친다.","부작위위법을 확인하는 확정판결은 제3자에 대해서도 효력이 있다.","부작위위법확인판결에 대해서는 간접강제 규정이 준용되지 않는다.","법원은 부작위위법확인소송 계속 중 행정청이 당사자의 신청에 대하여 상당한 기간이 지난 후 처분등을 함에 따라 소를 각하하는 경우에는 소송비용의 전부 또는 일부를 피고가 부담하게 할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-75", subject:"행정소송법", year:2025, no:75, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"행정소송법상 허용되는 것은? (다툼이 있으면 판례에 따름)",
  choices:["장래에 행정청이 일정한 내용의 처분을 할 것을 구하는 소송","행정청이 일정한 행정처분을 하도록 명하는 이행판결을 구하는 소송","건축건물의 준공처분을 하여서는 아니된다는 내용의 부작위를 구하는 소송","법원으로 하여금 행정청이 일정한 행정처분을 행한 것과 같은 효과가 있는 행정처분을 직접 행하도록 하는 형성판결을 구하는 소송","명예퇴직한 법관이 미지급 명예퇴직수당액의 지급을 구하는 소송"],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-76", subject:"행정소송법", year:2025, no:76, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"당사자소송에 해당하지 않는 것은? (다툼이 있으면 판례에 따름)",
  choices:["국가에 대한 납세의무자의 부가가치세 환급세액 지급청구소송","구 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」에 규정된 환매권의 존부에 관한 확인을 구하는 소송","「도시 및 주거환경정비법」상의 주택재건축정비사업조합을 상대로 관리처분계획안에 대한 조합 총회결의의 효력을 다투는 소송","지방소방공무원이 자신이 소속된 지방자치단체를 상대로 초과근무수당의 지급을 구하는 청구에 관한 소송","국가 등 과세주체가 당해 확정된 조세채권의 소멸시효 중단을 위하여 납세의무자를 상대로 제기한 조세채권존재확인의 소송"],
  answer:2, status:"clear", note:"" },
{ id:"hs2025-77", subject:"행정소송법", year:2025, no:77, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"당사자소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["「행정소송법」에는 당사자소송의 원고적격에 관한 직접적인 규정이 있다.","당사자소송에서는 행정청이 피고가 된다.","당사자소송을 본안으로 하는 가처분에 대해서는 「민사집행법」상 가처분에 관한 규정이 준용된다.","당사자소송에서는 피고경정이 인정되지 않는다.","당사자소송의 확정판결은 제3자에 대하여도 효력이 있다."],
  answer:3, status:"clear", note:"" },
{ id:"hs2025-78", subject:"행정소송법", year:2025, no:78, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"민중소송에 관한 설명으로 옳지 않은 것은?",
  choices:["「국민투표법」상 국민투표의 효력에 관하여 이의가 있는 투표인이 대법원에 제기하는 소송은 민중소송이다.","민중소송은 직접 자기의 법률상 이익과 관계없이 제기하는 소송이다.","「행정소송법」에서는 민중소송에 대해서 당사자소송 준용규정을 두고 있다.","「공직선거법」 제222조의 선거소송은 당해 선거구선거관리위원회를 피고로 하여 행정법원에 제기하는 소송이다.","행정처분의 취소를 요구하는 주민소송에서 위법성 심사는 특별한 사정이 없는 한 취소소송에서의 위법성 심사와 같은 방식으로 이루어져야 한다."],
  answer:4, status:"clear", note:"" },
{ id:"hs2025-79", subject:"행정소송법", year:2025, no:79, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"기관소송에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["기관소송은 권한 침해의 구제를 목적으로 하는 주관적 소송이다.","처분의 부작위의 위법의 확인을 구하는 소송일지라도 부작위위법확인소송에 관한 규정은 준용되지 않는다.","「헌법재판소법」 제2조의 규정에 의하여 헌법재판소의 관장사항으로 되는 소송도 기관소송의 대상이 될 수 있다.","지방자치단체의 장이 지방의회의 재의결에 대하여 대법원에 제기하는 소송은 기관소송에 해당하지 않는다.","법률에 정한 자만이 기관소송을 제기할 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"hs2025-80", subject:"행정소송법", year:2025, no:80, law:"행정소송법", unit:"2025년", kind:"concept",
  stem:"A시의 시장은 감사원으로부터 감사원법에 따라 A시의 공무원 甲에 대한 징계 요구를 받게 되자 감사원에 징계 요구에 대한 재심의를 청구하였다. 그런데 감사원이 재심의청구를 기각하는 결정(이하 ‘재심의결정’)을 하자 甲은 감사원의 징계 요구 및 그에 대한 재심의결정의 취소를 구하였고, A시의 시장은 감사원의 재심의결정의 취소를 구하는 소를 제기하였다. 한편 요구받은 징계를 하지 않더라도 A시의 시장이 불이익을 받는 규정은 없다. 이에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 징계 요구 그 자체만으로 징계 요구 대상 공무원의 권리ㆍ의무에 직접적인 변동을 초래한다.\nㄴ. 감사원의 징계 요구는 A시의 시장에 대한 행정처분이다.\nㄷ. 감사원의 재심의결정은 행정처분이다.\nㄹ. A시의 시장이 기관소송으로서 제기한 소송은 허용되지 않는다.",
  choices:["ㄹ","ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:1, status:"clear", note:"" },
{ id:"2022-41", subject:"세법학개론", year:2022, no:41, law:"국세기본법", unit:"납세자의 권리", kind:"concept",
  stem:"국세기본법상 세무조사에 관한 설명으로 옳지 않은 것은?",
  choices:["납세자에 대한 구체적인 탈세 제보가 있는 경우로서 해당 탈세 혐의에 대한 확인이 필요한 사유로 인한 부분조사는 같은 세목 및 같은 과세기간에 대하여 2회를 초과하여 실시할 수 있다.","무자료거래, 위장ㆍ가공거래 등 거래 내용이 사실과 다른 혐의가 있어 실제 거래 내용에 대한 조사가 필요한 경우에는 세무조사 기간의 제한을 받지 아니한다.","세금탈루 혐의가 포착되거나 조사 과정에서「조세범 처벌절차법」에 따른 조세범칙조사를 개시하는 경우에는 세무조사 기간을 연장할 수 있다.","세무공무원은 정기선정에 의한 조사 외에 납세자에 대한 구체적인 탈세 제보가 있는 경우에는 세무조사를 할 수 있다.","세무공무원은 부분조사를 실시한 후 해당 조사에 포함되지 아니한 부분에 대하여 조사하는 경우에는 같은 세목 및 같은 과세기간에 대하여 재조사를 할 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"2022-42", subject:"세법학개론", year:2022, no:42, law:"국세기본법", unit:"국세환급금과 국세환급가산금", kind:"concept",
  stem:"국세기본법령상 국세환급금과 국세환급가산금에 관한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 명의대여자에 대한 과세를 취소하고 실질귀속자를 납세의무자로 하여 과세하는 경우 명의대여자 대신 실질귀속자가 납부한 것으로 확인된 금액은 실질귀속자의 기납부세액으로 먼저 공제하고 남은 금액이 있는 경우에는 실질귀속자에게 환급한다.\nㄴ. 적법하게 납부된 후 법률이 개정되어 발생한 국세환급금의 국세환급가산금 기산일은 개정된 법률의 시행일의 다음 날로 한다.\nㄷ. 국세환급금의 소멸시효는 세무서장이 납세자의 환급청구를 촉구하기 위하여 납세자에게 하는 환급청구의 안내ㆍ통지로 인하여 중단되지 아니한다.\nㄹ. 세무서장은 국세환급금으로 결정한 금액을 다른 세무서에 체납된 국세 및 강제징수비에 충당할 수 없다.",
  choices:["ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:3, status:"clear", note:"" },
{ id:"2022-43", subject:"세법학개론", year:2022, no:43, law:"국세기본법", unit:"조세구제제도", kind:"concept",
  stem:"국세기본법상 심판에 관한 설명으로 옳지 않은 것은?",
  choices:["조세심판관회의는 담당 조세심판관 3분의 2 이상의 출석으로 개의하고, 출석조세심판관 과반수의 찬성으로 의결한다.","원장이 아닌 상임ㆍ비상임조세심판관의 임기는 3년으로 하고 중임할 수 없다.","조세심판원장은 심판청구를 받으면 이에 관한 조사와 심리를 담당할 주심조세심판관 1명과 배석조세심판관 2명 이상을 지정하여 조세심판관회의를 구성하게 한다.","조세심판관합동회의는 조세심판원장과 상임조세심판관 모두와 상임조세심판관과 같은 수 이상으로 조세심판원장이 지정하는 비상임조세심판관으로 구성한다.","담당 조세심판관은 필요하다고 인정하면 여러 개의 심판사항을 병합하거나 병합된 심판사항을 여러 개의 심판사항으로 분리할 수 있다."],
  answer:2, status:"clear", note:"" },
{ id:"2022-44", subject:"세법학개론", year:2022, no:44, law:"국세기본법", unit:"조세구제제도", kind:"concept",
  stem:"국세기본법령상 과세전적부심사가 배제되는 경우를 모두 고른 것은?\n\nㄱ. 「국제조세조정에 관한 법률」에 따라 조세조약을 체결한 상대국이 상호합의절차의 개시를 요청한 경우\nㄴ. 세법에서 규정하는 수시부과의 사유가 있는 경우\nㄷ. 과세예고통지를 하는 날부터 국세부과 제척기간의 만료일까지의 기간이 3개월 이하인 경우\nㄹ. 「조세범 처벌법」위반으로 통고처분하는 경우",
  choices:["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },
{ id:"2022-45", subject:"세법학개론", year:2022, no:45, law:"국세징수법", unit:"국세징수법 총칙", kind:"concept",
  stem:"국세징수법령상 납세담보에 관한 설명으로 옳은 것은?",
  choices:["양도성 예금증서는 납세담보로 제공할 수 있는 유가증권에 해당하지 않는다.","납세담보로서 금전을 제공한 자는 그 금전으로 담보한 국세 및 강제징수비를 납부할 수 없다.","납세보증보험증권은 보험기간이 납세담보를 필요로 하는 기간에 20일을 더한 기간 이상인 것으로 한정한다.","납세담보를 토지로 제공하는 경우에는 담보할 국세의 100분의 110의 가액에 상당하는 담보를 제공할 수 있다.","납세담보를 현금화한 금전으로 징수해야 할 국세 및 강제징수비를 징수하고 남은 금전이 있는 경우 공매대금의 배분방법에 따라 배분한 후 납세자에게 지급한다."],
  answer:5, status:"clear", note:"" },
{ id:"2022-46", subject:"세법학개론", year:2022, no:46, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"국세징수법상 공매의 준비에 관한 설명으로 옳지 않은 것은?",
  choices:["공매보증에 있어 공매보증금액은 공매예정가격의 100분의 10 이상으로 한다.","공매보증은 금전, 국공채, 증권시장에 상장된 증권,「보험업법」에 따른 보험회사가 발행한 보증보험증권의 어느 하나에 해당하는 것으로 한다.","관할 세무서장은 공매재산에 압류와 관계되는 국세보다 우선하는 제한물권 등이 있는 경우 제한물권 등을 매수인에게 인수하게 하거나 매수대금으로 그 제한물권 등에 의하여 담보된 채권을 변제하는 데 충분하다고 인정된 경우가 아니면 그 재산을 공매하지 못한다.","체납자는 제3자의 명의나 계산으로 압류재산을 매수할 수 있다.","관할 세무서장은 거짓 명의로 매수신청을 한 사실이 있는 자에 대해서는 그 사실이 있은 후 2년간 공매장소 출입을 제한하거나 입찰에 참가시키지 아니할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"2022-47", subject:"세법학개론", year:2022, no:47, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"국세징수법상 강제징수에 관한 설명으로 옳지 않은 것은?",
  choices:["관할 세무서장은 재판상의 가압류 또는 가처분 재산이 강제징수 대상인 경우에도 국세징수법에 따른 강제징수를 한다.","체납자의 재산에 대하여 강제징수를 시작한 후 체납자인 법인이 합병으로 소멸된 경우에도 그 재산에 대한 강제징수는 계속 진행하여야 한다.","체납자 또는 제3자가 압류재산의 사용 또는 수익을 하는 경우 그 재산의 매각으로 인하여 권리를 이전하기 전까지 이미 거두어들인 천연과실에 대해서는 압류의 효력이 미치지 아니한다.","급료, 임금, 봉급, 세비, 퇴직연금 또는 그 밖에 계속적 거래관계에서 발생하는 이와 유사한 채권에 대한 압류의 효력은 체납액을 한도로 하여 압류 후에 발생할 채권에도 미친다.","관할 세무서장은 체납자가 국가 또는 지방자치단체의 재산을 매수한 경우 소유권 이전 전에는 그 재산에 관한 체납자의 국가 또는 지방자치단체에 대한 권리를 압류할 수 없다."],
  answer:5, status:"clear", note:"" },
{ id:"2022-48", subject:"세법학개론", year:2022, no:48, law:"국세징수법", unit:"국세징수법 보칙", kind:"concept",
  stem:"국세징수법상 고액ㆍ상습체납자의 감치와 관련된 설명 중 ㄱ~ㄷ에 들어갈 내용으로 옳은 것은?\n\n법원은 검사의 청구에 따라 체납자가 다음의 사유에 모두 해당하는 경우 결정으로 30일의 범위에서 체납된 국세가 납부될 때까지 그 체납자를 감치에 처할 수 있다.\n⑴ 국세를 ( ㄱ )회 이상 체납하고 있고, 체납 발생일부터 각 ( ㄴ )년이 경과하였으며, 체납된 국세의 합계액이 ( ㄷ )억원 이상인 경우\n⑵ 체납된 국세의 납부능력이 있음에도 불구하고 정당한 사유 없이 체납한 경우\n⑶ 「국세기본법」에 따른 국세정보위원회의 의결에 따라 해당 체납자에 대한 감치 필요성이 인정되는 경우",
  choices:["ㄱ : 2, ㄴ : 1, ㄷ : 1","ㄱ : 2, ㄴ : 2, ㄷ : 2","ㄱ : 2, ㄴ : 2, ㄷ : 3","ㄱ : 3, ㄴ : 1, ㄷ : 2","ㄱ : 3, ㄴ : 1, ㄷ : 3"],
  answer:4, status:"clear", note:"" },
{ id:"2022-49", subject:"세법학개론", year:2022, no:49, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"조세범 처벌법상 2년의 징역에 처하는 것이 가능한 행위를 모두 고른 것은?\n\nㄱ. 재화 또는 용역을 공급하지 아니하거나 공급받지 아니하고「부가가치세법」에 따른 세금계산서를 발급하거나 발급받은 행위\nㄴ. 「부가가치세법」에 따라 세금계산서를 발급하여야 할 자가 세금계산서를 발급하지 아니하거나 거짓으로 기재하여 발급한 행위\nㄷ. 「부가가치세법」에 따라 매출처별 세금계산서합계표를 제출하여야 할 자가 매출처별 세금계산서합계표를 거짓으로 기재하여 제출한 행위\nㄹ. 「부가가치세법」에 따라 매입처별 세금계산서합계표를 제출하여야 할 자가 통정하여 매입처별 세금계산서합계표를 거짓으로 기재하여 제출한 행위",
  choices:["ㄱ","ㄴ","ㄱ, ㄴ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],
  answer:1, status:"clear", note:"" },
{ id:"2022-50", subject:"세법학개론", year:2022, no:50, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"조세범 처벌법 제3조의 조세 포탈 등에 관한 설명으로 옳지 않은 것은?",
  choices:["포탈세액이 5억원 이상인 경우에는 3년 이하의 징역 또는 포탈세액의 3배 이하에 상당하는 벌금에 처한다.","조세 포탈의 죄를 범한 자에 대해서는 정상(情狀)에 따라 징역형과 벌금형을 병과할 수 있다.","조세 포탈의 죄를 범한 자가 포탈세액에 대하여「국세기본법」에 따라 법정신고기한이 지난 후 6개월 이내에 기한 후 신고를 하였을 때에는 형을 감경할 수 있다.","조세 포탈의 죄를 상습적으로 범한 자는 형의 3분의 1을 가중한다.","재산의 은닉으로서 조세의 부과와 징수를 불가능하게 하거나 현저히 곤란하게 하는 적극적 행위는 사기나 그 밖의 부정한 행위에 해당한다."],
  answer:4, status:"clear", note:"" },
{ id:"2022-51", subject:"세법학개론", year:2022, no:51, law:"소득세법", unit:"이자소득과 배당소득", kind:"calc",
  stem:"다음은 거주자 甲의 2022년 금융거래에서 발생한 소득 관련 자료이다. 甲의 종합소득금액에 합산할 이자소득금액과 배당소득금액의 합계액은? (단, 원천징수는 적법하게 이루어졌으며 제시된 금액은 원천징수 전의 금액이다. 주어진 자료 외의 다른 사항은 고려하지 않음)\n\n(1) 국내 상장법인으로부터 받은 현금배당: 8,000,000원\n(2) 공개시장에서 통합발행한 국채의 매각가액과 액면가액의 차액: 6,000,000원\n(3) 국내은행으로부터 받은 정기예금이자: 3,000,000원\n(4) 외국법인이 발행한 채권의 이자: 7,000,000원\n(5) 비영업대금의 이익: 5,000,000원\n(6) 법인과세 신탁재산으로부터 받는 배당금: 3,000,000원",
  choices:["23,330,000원","23,880,000원","26,660,000원","26,880,000원","32,880,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2022-52", subject:"세법학개론", year:2022, no:52, law:"소득세법", unit:"양도소득세", kind:"calc",
  stem:"다음은 거주자 甲의 2022년 주식양도 관련 자료이다. 甲의 양도소득세 산출세액은?\n\n(1) 甲의 주식양도 및 취득현황\n구분 / 실지양도가액 / 실지취득가액 / 양도일자 / 취득일자\n주식a / 500,000,000원 / 100,000,000원 / 2022.12.5. / 2017.5.7.\n주식b / 100,000,000원 / 148,000,000원 / 2022.10.3. / 2018.8.2.\n\n(2) 주식a는 제조업을 영위하는 중소기업인 국내 주권비상장법인 (주)A가 발행한 주식이며, 甲은 (주)A의 발행주식총수의 10%를 취득한 후 양도전까지 계속 보유하였다.\n(3) 주식b는 중소기업이 아닌 미국법인 (주)B가 발행하여 뉴욕증권거래소에 상장되어 있는 주식이다.\n(4) 주식a를 양도하기 위해 증권거래세 2,150,000원과 양도소득과세표준 신고서 작성비용 3,350,000원, 주식b를 양도하기 위해 증권회사 위탁매매수수료 3,000,000원을 직접 지출하였다(법정 증명서류를 수취ㆍ보관하거나 실제 지출사실이 금융거래 증명서류에 의해 확인됨).\n(5) 甲은 주식a와 주식b를 특수관계 없는 제3자에게 양도하였고 (주)A와 (주)B는 부동산을 보유하고 있지 않다.\n(6) 위에 주어진 자료 외의 다른 사항은 고려하지 않는다.",
  choices:["68,200,000원","70,250,000원","83,000,000원","85,250,000원","98,000,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2022-53", subject:"세법학개론", year:2022, no:53, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"calc",
  stem:"다음은 중소기업인 (주)A에 경리과장으로 근무하는 거주자 甲의 2022년 근로소득 관련 자료이다. 甲의 소득세법상 총급여액은? (단, 甲은 (주)A의 발행주식총수의 2%의 주식을 소유하고 있다. 주어진 자료 외의 다른 사항은 고려하지 않음)\n\n(1) 기본급과 상여: 50,000,000원\n(2) 시간외근무수당: 8,000,000원\n(3) (주)A의 소유주택을 무상으로 제공받음으로써 얻은 이익: 5,000,000원\n(4) 식사대: 2,400,000원 (월 200,000원×12개월, (주)A로부터 식사 기타 음식물을 제공받지 않음)\n(5) 甲의 8세 아들의 보육과 관련하여 (주)A로부터 지급받은 보육수당: 1,200,000원(월 100,000원×12개월)\n(6)「발명진흥법」에 따라 (주)A로부터 받은 직무발명보상금: 8,000,000원",
  choices:["60,400,000원","62,200,000원","63,400,000원","64,600,000원","68,400,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2022-54", subject:"세법학개론", year:2022, no:54, law:"소득세법", unit:"종합소득 세액계산", kind:"calc",
  stem:"다음은 근로소득이 있는 거주자 甲(일용근로자 아님)이 2022년 기본공제대상자를 위해 지출한 보험료와 교육비 관련 자료이다. 甲의 보험료세액공제액과 교육비세액공제액의 합계는?\n\n(1) 기본공제대상자 현황\n구분 / 나이 / 소득현황 / 지출내역\n본인 / 43세 / 총급여액 50,000,000원 / 국민건강보험료 2,000,000원, 일반보장성보험료(피보험자: 본인) 500,000원\n배우자 / 40세 / 총급여액 4,000,000원 / 대학원 박사과정 등록금 12,000,000원\n모친 / 65세 / 이자소득 5,000,000원 / 대학교 등록금 10,000,000원\n아들 / 18세 / 소득없음 / 고등학교 교복구입비용 1,000,000원, 사설 영어학원 수강료 3,000,000원\n딸 / 15세 / 소득없음 / 중학교 방과후 과정 특별활동비 2,000,000원, 장애인전용보장성보험료(수익자: 딸) 3,000,000원\n\n(2) 딸은 장애인이고, 본인 이외의 기본공제대상자는 「초ㆍ중등교육법」 또는 「고등교육법」상 학교에 다니고 있다.\n(3) 위에 주어진 자료 외의 다른 사항은 고려하지 않는다.",
  choices:["330,000원","585,000원","645,000원","660,000원","1,935,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2022-55", subject:"세법학개론", year:2022, no:55, law:"소득세법", unit:"소득세 총칙", kind:"concept",
  stem:"소득세법령상 납세의무 등에 관한 설명으로 옳지 않은 것은?",
  choices:["비거주자는 국내에 거소를 둔 기간이 183일이 되는 날에 거주자가 된다.","비거주자는 법령에 따른 납세지가 변경된 경우 변경된 날부터 15일 이내에 그 변경 후의 납세지 관할 세무서장에게 신고하여야 한다.","거주자의 사업소득에 대한 소득세 납세지는 주된 사업장 소재지로 한다.","신탁재산에 귀속되는 소득의 수익자가 특별히 정하여지지 아니한 경우에는 그 신탁재산에 귀속되는 소득은 위탁자에게 귀속되는 것으로 본다.","거주기간을 계산할 경우 국내에 거소를 둔 기간은 입국하는 날의 다음날부터 출국하는 날까지로 한다."],
  answer:3, status:"clear", note:"" },
{ id:"2022-56", subject:"세법학개론", year:2022, no:56, law:"소득세법", unit:"양도소득세", kind:"concept",
  stem:"소득세법령상 양도소득에 관한 설명으로 옳은 것은?",
  choices:["「도시개발법」에 따른 환지처분으로 지목이 변경되는 경우는 양도로 본다.","국가가 시행하는 사업으로 인하여 교환하는 농지로서 교환하는 쌍방 토지가액의 차액이 가액이 큰 편의 5분의 1인 농지의 교환으로 발생하는 소득은 양도소득세가 비과세된다.","파산선고에 의한 처분으로 발생하는 소득은 양도소득세가 과세된다.","취득에 관한 쟁송이 있는 자산에 대하여 그 소유권을 확보하기 위하여 직접 소요된 소송비용으로서 그 지출한 연도의 각 종합소득금액의 계산에 있어서 필요경비에 산입된 것은 양도차익 계산시 공제된다.","양도소득세 과세대상인 신탁 수익권을 양도한 경우 양도일이 속하는 반기의 말일부터 2개월 이내에 양도소득과세표준을 신고해야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"2022-57", subject:"세법학개론", year:2022, no:57, law:"소득세법", unit:"소득세 절차규정과 외국법인·비거주자", kind:"concept",
  stem:"소득세법령상 과세표준의 확정신고와 납부에 관한 설명으로 옳은 것은?",
  choices:["공적연금소득만 있는 거주자는 해당 소득에 대해 과세표준확정신고를 해야 한다.","과세표준확정신고를 하여야 할 거주자가 출국하는 경우에는 출국일이 속하는 과세기간의 과세표준을 출국일 전날까지 신고하여야 한다.","해당 과세기간의 종합소득금액이 있는 거주자가 종합소득과세표준이 없는 경우에는 종합소득과세표준 확정신고 의무가 없다.","세무사가 성실신고확인대상사업자에 해당하는 경우에도 자신의 사업소득금액의 적정성에 대하여 해당 세무사가 성실신고확인서를 작성ㆍ제출할 수 있다.","거주자로서 과세표준의 확정신고에 따라 납부할 세액이 1천8백만원인 자는 9백만원을 납부기한이 지난 후 90일 이내에 분납할 수 있다."],
  answer:2, status:"clear", note:"" },
{ id:"2022-58", subject:"세법학개론", year:2022, no:58, law:"소득세법", unit:"소득세 절차규정과 외국법인·비거주자", kind:"concept",
  stem:"소득세법령상 원천징수에 관한 설명으로 옳지 않은 것은?",
  choices:["일용근로자의 근로소득에 대한 원천징수세율은 100분의 6으로 한다.","근로소득을 지급하여야 할 원천징수의무자가 1월부터 11월까지의 근로소득을 해당 과세기간의 12월 31일까지 지급하지 아니한 경우에는 그 근로소득을 12월 31일에 지급한 것으로 보아 소득세를 원천징수한다.","법인이 합병한 경우에 합병으로 설립된 법인은 합병으로 소멸된 법인이 원천징수를 하여야 할 소득세를 납부하지 아니하면 그 소득세에 대한 납세의무를 진다.","연말정산 사업소득을 지급하는 원천징수의무자는 연말정산일이 속하는 달의 다음 달 말일까지 원천징수영수증을 해당 사업자에게 발급하여야 한다.","법령으로 정하는 봉사료에 대한 원천징수세율은 100분 10으로 한다."],
  answer:5, status:"clear", note:"" },
{ id:"2022-59", subject:"세법학개론", year:2022, no:59, law:"소득세법", unit:"사업소득", kind:"concept",
  stem:"소득세법령상 사업소득의 수입시기에 관한 설명으로 옳지 않은 것은?",
  choices:["제품의 판매: 그 제품을 인도한 날","제품의 위탁판매: 수탁자가 그 위탁품을 판매한 날","무인판매기에 의한 판매: 당해 사업자가 무인판매기에서 현금을 인출하는 때","한국표준산업분류상의 금융보험업에서 발생하는 이자: 결산을 확정할 때 이자를 수익으로 계상한 날","어음의 할인: 그 어음의 만기일로 하되, 만기 전에 그 어음을 양도하는 때에는 그 양도일"],
  answer:4, trap:3, status:"clear", note:"" },
{ id:"2022-60", subject:"세법학개론", year:2022, no:60, law:"소득세법", unit:"퇴직소득세", kind:"concept",
  stem:"소득세법령상 퇴직소득에 관한 설명으로 옳은 것은?",
  choices:["종교관련종사자가 현실적인 퇴직을 원인으로 종교단체로부터 지급받는 소득은 퇴직소득에 해당한다.","「과학기술인공제회법」제16조제1항제3호에 따라 지급받는 과학기술발전장려금은 퇴직소득에 해당하지 않는다.","계속근로기간 중에 「근로자퇴직급여보장법」에 따라 퇴직연금제도가 폐지되어 퇴직급여를 미리 지급받는 경우에도 그 지급받은 날에 퇴직한 것으로 보지 않는다.","거주자의 퇴직소득금액에 국외원천소득이 합산되어 있는 경우로서 외국에서 납부한 외국소득세액이 퇴직소득산출세액에서 공제할 수 있는 한도금액을 초과하는 경우 그 초과하는 금액은 이월공제기간으로 이월하여 그 이월된 과세기간의 공제한도금액 내에서 공제받을 수 있다.","「국민연금법」에 따라 받는 일시금으로써 2001년 12월 31일 이전에 납입된 연금 기여금 및 사용자부담금을 기초로 하여 받은 일시금은 퇴직소득에 해당한다."],
  answer:1, status:"clear", note:"" },
{ id:"2022-61", subject:"세법학개론", year:2022, no:61, law:"법인세법", unit:"법인세 절차규정", kind:"concept",
  stem:"법인세법령상 가산세에 관한 설명으로 옳지 않은 것은?",
  choices:["신용카드 및 현금영수증 발급 불성실 가산세는 신용카드 매출전표를 사실과 다르게 발급한 금액의 5%(건별로 계산한 금액이 5천원 미만이면 5천원으로 한다)이다.","업무용승용차 관련비용 등을 손금에 산입한 내국법인이 업무용승용차 관련비용 등에 관한 명세서를 제출하지 않은 경우 업무용승용차 관련비용 명세서 제출 불성실가산세가 적용된다.","주식등변동상황명세서를 제출해야하는 내국법인이 명세서를 제출하지 않은 경우 그 주식등의 액면금액의 1%에 해당하는 금액을 가산세로 한다.","기부금영수증을 발급하는 내국법인이 기부금영수증을 사실과 다르게 적어 발급한 경우 사실과 다르게 발급된 금액의 5%에 해당하는 금액을 가산세로 한다.","소비자상대업종을 영위하는 법인은 그 요건에 해당하는 날이 속하는 달의 말일부터 3개월 이내에 현금영수증가맹점으로 가입하지 않은 경우 가입하지 않은 사업연도의 수입금액의 3%에 해당하는 금액을 가산세로 한다."],
  answer:5, status:"clear", note:"" },
{ id:"2022-62", subject:"세법학개론", year:2022, no:62, law:"법인세법", unit:"익금과 익금불산입", kind:"calc",
  stem:"제조업을 영위하는 영리내국법인 (주)A는 제22기 사업연도(2022.1.1.~12.31.) 중 영리내국법인 (주)B가 잉여금의 자본금전입을 결의(2022.3.15.)함에 따라 무상주를 수령하였다. (주)B의 잉여금의 자본금전입 재원이 다음과 같을 경우 (주)A의 의제배당금액은? (단, (주)A는 (주)B의 발행주식총수의 15%를 소유하고 있으며, 수입배당금 익금불산입 규정은 무시하고 주어진 자료 이외에는 고려하지 않음)\n\n(1) (주)B의 잉여금의 자본금전입 재원\n- 주식발행초과금: 2,000,000원(채무의 출자전환시 채무면제이익 1,000,000원이 포함되어 있음)\n- 자기주식소각이익: 5,000,000원(소각 당시의 시가가 취득가액을 초과하였음)\n- 자기주식처분이익: 1,500,000원\n- 주식의 포괄적 교환차익: 3,000,000원\n- 주식의 포괄적 이전차익: 1,000,000원\n- 재평가적립금: 1,400,000원[토지분(재평가세 1% 과세분) 400,000원과 건물분(재평가세 3% 과세분) 1,000,000원으로 구성되어 있음]\n- 이월이익잉여금: 10,000,000원\n(2) (주)B가 보유한 자기주식은 없다.",
  choices:["1,785,000원","2,685,000원","2,835,000원","3,135,000원","3,435,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2022-63", subject:"세법학개론", year:2022, no:63, law:"법인세법", unit:"합병 및 분할 특례", kind:"concept",
  stem:"법인세법령상 합병 및 분할 등에 관한 특례의 내용으로 옳지 않은 것은?",
  choices:["적격합병이 아닌 경우 합병법인이 합병으로 피합병법인의 자산을 승계한 경우에는 그 자산을 피합병법인으로부터 합병등기일 현재의 시가로 양도받은 것으로 본다.","적격합병이 아닌 경우 합병법인이 피합병법인에게 지급한 양도가액과 피합병법인의 합병등기일 현재의 순자산 시가가 서로 일치하지 않으면, 그 차액은 합병매수차익 또는 합병매수차손으로 한다.","적격분할이 아닌 경우 분할신설법인등이 분할로 분할법인등의 자산을 승계한 경우에는 그 자산을 분할법인등으로부터 분할등기일 현재의 시가로 양도받은 것으로 본다.","적격합병을 한 합병법인은 피합병법인의 자산을 시가로 양도받은 것으로 하고, 양도받은 자산 및 부채의 가액을 합병등기일 현재의 장부가액으로 계상하되 시가에서 피합병법인의 장부상 장부가액을 뺀 금액은 자산조정계정으로 계상해야 한다.","중소기업간 적격합병인 경우 합병법인이 승계한 피합병법인의 결손금에 대한 공제는 피합병법인으로부터 승계받은 사업에서 발생한 소득금액의 100%를 한도로 한다."],
  answer:4, status:"clear", note:"" },
{ id:"2022-64", subject:"세법학개론", year:2022, no:64, law:"법인세법", unit:"세액계산", kind:"calc",
  stem:"다음은 영리내국법인 (주)A의 제22기 사업연도(2022.1.1.~12.31.)의 외국납부세액 관련 자료이다. (주)A는 외국에서 사업을 영위하는 외국자회사 (주)B의 의결권 있는 주식 30%를 보유하고 있다. 2020.1.1. (주)B의 주식을 취득한 이후 지분율에는 변동이 없는 상태이다. (주)A가 외국납부세액공제를 적용할 경우 제22기 법인세 산출세액에서 공제할 외국납부세액은? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) (주)B로부터 외국법인세 원천징수세액 200,000원 차감 후 배당금 1,800,000원을 수령하고 다음과 같이 회계처리하였다.\n  (차) 현금 1,800,000원 / 선급법인세 200,000원   (대) 배당금수익 2,000,000원\n(2) (주)B의 제22기 사업연도(2022.1.1.~12.31.) 소득금액은 5,000,000원이고, 이에 대한 외국법인세는 1,000,000원이다.\n(3) (주)A의 법인세비용차감전순이익은 150,000,000원이며, 세무상 이월결손금은 없다.",
  choices:["150,000원","170,000원","200,000원","250,000원","300,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2022-65", subject:"세법학개론", year:2022, no:65, law:"법인세법", unit:"손금과 손금불산입", kind:"calc",
  stem:"(주)A는 제조업을 영위하는 영리내국법인이다. (주)A의 제22기 사업연도(2022.1.1.~12.31.)의 임원전용 업무용승용차 관련 자료가 다음과 같을 경우 손금불산입금액은? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) (주)A는 업무전용 자동차보험에 가입하였고 업무용승용차 운행기록부를 작성ㆍ비치하고 있으며, 제22기 사업연도의 상시근로자 수는 10인이다.\n(2) (주)A는 리스회사인 (주)B에서 제22기 초에 운용리스(리스기간 3년)로 임원전용 업무용승용차를 임차하였다.\n(3) 제22기 사업연도에 발생한 업무용승용차 관련비용은 다음과 같다.\n구분 / 손익계산서에 계상한 비용\n리스료 / 30,000,000원\n(상기 리스료에 포함되어 있는 항목)\n - 자동차보험료 / 3,000,000원\n - 자동차세 / 2,000,000원\n - 수선유지비 / 1,750,000원\n기타 유지비 / 3,000,000원\n(4) 제22기 사업연도 운행기록: 총 주행거리 20,000km, 업무용 사용거리 15,000km",
  choices:["8,250,000원","10,750,000원","17,687,500원","18,750,000원","24,750,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2022-66", subject:"세법학개론", year:2022, no:66, law:"법인세법", unit:"법인세 총칙", kind:"concept",
  stem:"법인세법상 납세의무자와 과세소득의 범위에 관한 설명으로 옳지 않은 것은?",
  choices:["내국법인 중 국가와 지방자치단체는 그 소득에 대한 법인세를 납부할 의무가 없다.","비영리내국법인은 청산소득에 대한 법인세를 납부할 의무가 있다.","국내원천소득이 있는 외국법인은 법인세 납세의무가 있다.","「법인세법」에 따라 법인세를 원천징수하는 자는 해당 법인세를 납부할 의무가 있다.","비영리내국법인은 주식ㆍ신주인수권 또는 출자지분의 양도로 인한 수입에 대하여 법인세 납세의무가 있다."],
  answer:2, status:"clear", note:"" },
{ id:"2022-67", subject:"세법학개론", year:2022, no:67, law:"법인세법", unit:"세무조정과 소득처분", kind:"calc",
  stem:"한국채택국제회계기준을 적용하고 있는 영리내국법인 (주)A의 제22기 사업연도(2022.1.1.~12.31.)의 소득금액조정합계표상 손금산입 및 익금불산입 항목의 합계금액은? [단, 각 항목은 독립적이며 주어진 자료 이외(수입배당금 익금불산입 규정 포함)에는 고려하지 않음]\n\n(1) (주)A의 재무상태표 자산계정 중 매출채권은 150,000,000원이다. 이 금액에는 당기에 상법에 따른 소멸시효가 완성된 매출채권 2,000,000원이 포함되어 있다.\n(2) (주)A는 제22기에 토지를 100,000,000원에 매입하였는데 이에 대한 취득세 4,000,000원과 그 취득세에 관한 가산세 1,000,000원을 납부하고 다음과 같이 회계처리하였다.\n  (차) 토지 105,000,000원   (대) 현금 105,000,000원\n(3) (주)A는 2022년 초 (주)B의 의결권 있는 주식 30%를 30,000,000원에 취득하였다. 주식 취득일 현재 (주)B의 재무상태표상 순자산가액은 100,000,000원이고 순자산가액은 공정가치와 일치하였다. (주)A는 2022.5.18. (주)B로부터 현금배당 500,000원을 받았으며, 2022년 말 (주)B가 당기순이익을 보고함에 따라 다음과 같이 회계처리하였다.\n  <2022.5.18.> (차) 현금 500,000원   (대) 관계기업투자주식 500,000원\n  <2022.12.31.> (차) 관계기업투자주식 2,000,000원   (대) 지분법이익 2,000,000원",
  choices:["3,000,000원","5,000,000원","5,500,000원","7,000,000원","7,500,000원"],
  answer:2, trap:3, status:"clear", note:"" },
{ id:"2022-68", subject:"세법학개론", year:2022, no:68, law:"법인세법", unit:"감가상각비", kind:"calc",
  stem:"다음은 법인세가 감면되는 사업을 영위하는 영리내국법인 (주)A의 제22기 사업연도(2022.1.1.~12.31.) 기계장치와 관련된 자료이다. (주)A의 제22기 감가상각비 손금불산입액은? (단, (주)A는 매년 법인세를 감면받아 왔고, 계산결과는 원 단위 미만에서 절사하고 주어진 자료 이외에는 고려하지 않음)\n\n(1) 취득일: 2020.1.1.\n(2) 취득가액: 50,000,000원\n구분 / 제20기(2020.1.1.~12.31.) / 제21기(2021.1.1.~12.31.) / 제22기(2022.1.1.~12.31.)\n감가상각비 장부금액 / 20,000,000원 / 0원 / 8,000,000원\n(3) 기계장치에 대한 감가상각방법과 적용 내용연수를 신고한 바 없다.\n(4) 기준내용연수: 10년\n(5) 내용연수 10년의 감가상각률 — 정액법 0.100 / 정률법 0.259\n(6) 제20기와 제21기의 세무조정은 적정하게 이루어졌다.",
  choices:["889,402원","902,352원","1,804,402원","2,696,352원","2,980,402원"],
  answer:1, status:"clear", note:"" },
{ id:"2022-69", subject:"세법학개론", year:2022, no:69, law:"법인세법", unit:"손금과 손금불산입", kind:"concept",
  stem:"법인세법령상 접대비와 기부금에 관한 설명으로 옳지 않은 것은?",
  choices:["법인이 기부금의 지출을 위하여 어음을 발행한 경우에는 그 어음을 발행한 날에 지출한 것으로 본다.","법인이 기부금을 가지급금 등으로 이연계상한 경우에는 이를 그 지출한 사업연도의 기부금으로 하고 그 후의 사업연도에는 이를 기부금으로 보지 않는다.","내국법인이 한 차례의 접대에 지출한 접대비 중 3만원(경조금은 20만원)을 초과하는 접대비로서 증명서류를 수취하지 않은 것은 전액 손금불산입하고 대표자에 대한 상여로 처분한다.","재화 또는 용역을 공급하는 신용카드 등의 가맹점이 아닌 다른 가맹점의 명의로 작성된 매출전표 등을 발급받은 경우 해당 지출액은 신용카드 등을 사용하여 지출한 접대비로 보지 않는다.","법인이 특수관계인 외의 자에게 정당한 사유 없이 자산을 정상가액보다 낮은 가액으로 양도함으로써 실질적으로 증여한 것으로 인정되는 금액은 기부금으로 본다."],
  answer:1, trap:3, status:"clear", note:"" },
{ id:"2022-70", subject:"세법학개론", year:2022, no:70, law:"법인세법", unit:"손익의 귀속시기", kind:"concept",
  stem:"법인세법령상 손익의 귀속사업연도 및 자산ㆍ부채의 평가에 관한 설명으로 옳지 않은 것은?",
  choices:["중소기업인 법인이 수행하는 계약기간 1년 미만인 건설등의 경우에는 그에 대한 수익과 비용을 각각 그 목적물의 인도일이 속하는 사업연도의 익금과 손금에 산입할 수 있다.","「특정 금융거래정보의 보고 및 이용 등에 관한 법률」 제2조제3호에 따른 가상자산은 이동평균법에 따라 평가해야 한다.","결산을 확정할 때 이미 경과한 기간에 대응하는 임대료 상당액과 이에 대응하는 비용을 해당 사업연도의 수익과 손비로 계상한 경우 및 임대료 지급기간이 1년을 초과하는 경우 이미 경과한 기간에 대응하는 임대료 상당액과 비용은 이를 각각 해당 사업연도의 익금과 손금으로 한다.","투자회사 등이 결산을 확정할 때 증권 등의 투자와 관련된 수익 중 이미 경과한 기간에 대응하는 이자 및 할인액과 배당소득을 해당 사업연도의 수익으로 계상한 경우에는 그 계상한 사업연도의 익금으로 한다.","계약의 목적물을 인도하지 않고 목적물의 가액 변동에 따른 차액을 금전으로 정산하는 파생상품의 거래로 인한 손익은 그 거래에서 정하는 대금결제일이 속하는 사업연도의 익금과 손금으로 한다."],
  answer:2, status:"clear", note:"" },
{ id:"2022-71", subject:"세법학개론", year:2022, no:71, law:"부가가치세법", unit:"부가가치세 총칙", kind:"concept",
  stem:"부가가치세법령상 사업자등록에 관한 설명으로 옳지 않은 것은?",
  choices:["사업장이 둘 이상인 사업자는 사업자 단위로 해당 사업자의 본점 또는 주사무소 관할 세무서장에게 등록을 신청할 수 있다.","신규로 제조업을 시작하려는 자는 제조장별로 재화의 제조를 시작하는 날 이전이라도 사업자등록을 신청할 수 있다.","사업장 단위로 등록한 사업자가 사업자 단위 과세 사업자로 변경하려면 사업자 단위 과세 사업자로 적용받으려는 과세기간 개시 20일 전까지 사업장 관할 세무서장에게 변경등록을 신청하여야 한다.","사업자 단위로 등록신청을 한 사업자에게는 사업자 단위 과세 적용 사업장에 한 개의 등록번호를 부여한다.","사업자가 상호를 변경하는 경우에는 지체 없이 사업자의 인적사항, 사업자등록의 변경사항 및 그 밖의 필요한 사항을 적은 사업자등록 정정신고서를 관할 세무서장이나 그 밖에 신고인의 편의에 따라 선택한 세무서장에게 제출해야 한다."],
  answer:3, status:"clear", note:"" },
{ id:"2022-72", subject:"세법학개론", year:2022, no:72, law:"부가가치세법", unit:"과세거래", kind:"concept",
  stem:"부가가치세법령상 과세대상 거래가 아닌 것은?",
  choices:["사업자가 자기의 과세사업과 관련하여 취득하여 매입세액이 공제된 재화를 자기의 면세사업을 위하여 직접 사용하는 것","사업자가 외국으로부터 국내에 도착한 물품으로서 수입신고가 수리되기 전의 것을 국내에 반입하는 것","사업자가 특수관계인에게 사업용 부동산의 임대용역을 시가보다 낮은 대가를 받고 공급하는 것","사업자가 양도담보의 목적으로 부동산상의 권리를 제공하는 것","사업자가 현물출자에 따라 재화를 인도하는 것"],
  answer:4, status:"clear", note:"" },
{ id:"2022-73", subject:"세법학개론", year:2022, no:73, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"calc",
  stem:"다음은 부가가치세 과세사업을 영위하는 (주)A에 관한 자료이다. 2022년 제1기 예정신고기간(2022.1.1.~3.31.)의 부가가치세 과세표준에 포함될 금액은? (단, 다음 자료의 금액에는 부가가치세가 포함되어 있지 않으며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 공급단위를 구획할 수 없는 용역을 계속적으로 공급하고 2022.1.5.에 계약금으로 2,000,000원, 2022.2.20.에 중도금으로 4,000,000원, 2022.4.30.에 잔금으로 3,000,000원을 받기로 하고, 세금계산서는 대금을 받기로 한 날 발행하기로 하였다.\n(2) 특허권을 2022.4.2.부터 2년간 대여하기로 하고, 2022.3.30.에 대가의 일부로 받은 1,000,000원에 대하여 전자세금계산서를 발행하였다.\n(3) 2022.2.20.에 세금계산서를 발행하는 시기(2022.2.20.)와 대금의 지급시기(2022.4.5.)를 명시한 약정서를 작성하고 이에 따라 용역의 공급가액을 5,000,000원으로 하는 전자세금계산서를 발행하였다(용역제공을 완료한 때는 2022.7.10.임).\n(4) 2022.3.25.에 특수관계인에게 산업상의 지식에 관한 정보를 무상으로 제공하였으며, 그 시가는 3,000,000원이다.",
  choices:["4,000,000원","6,000,000원","7,000,000원","9,000,000원","12,000,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2022-74", subject:"세법학개론", year:2022, no:74, law:"부가가치세법", unit:"영세율과 면세", kind:"concept",
  stem:"부가가치세법령상 영세율과 면세에 관한 설명으로 옳지 않은 것은?",
  choices:["외국인도수출로서 국내 사업장에서 계약과 대가 수령 등 거래가 이루어지는 것은 영세율을 적용한다.","사업자가 비거주자 또는 외국법인이면 그 해당 국가에서 대한민국의 거주자 또는 내국법인에 대하여 동일하게 면세하는 경우에만 영세율을 적용한다.","외국에서 생산되어 식용으로 제공되지 아니하는 수산물로서 원생산물의 수입에 대해서는 면세를 적용한다.","수입하는 상품의 견본과 광고용 물품으로서 관세가 면제되는 재화의 수입에 대해서는 면세를 적용한다.","부가가치세가 면제되는 재화 또는 용역의 공급이 영세율의 적용 대상이 되는 것인 경우 면세의 포기를 신고하여 부가가치세의 면제를 받지 아니할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"2022-75", subject:"세법학개론", year:2022, no:75, law:"부가가치세법", unit:"과세·면세 겸영사업자의 세액계산 특례", kind:"calc",
  stem:"다음은 과세사업과 면세사업을 겸영하는 (주)A의 2022년 제1기 확정신고기간(2022.4.1.~6.30.)의 거래내역이다. 2022년 제1기 확정신고시 매출세액에서 공제되는 매입세액은? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 2022.4.20.에 법인사업자로부터 과세사업에 사용되는 재화를 매입하고 전자세금계산서 외의 세금계산서를 2022.7.5.에 발급받았고, 그 거래사실이 확인되는 것의 부가가치세 매입세액은 2,000,000원이다.\n(2) 2022.5.10.에 법인사업자로부터 매입한 면세사업에 사용되는 재화의 매입세액은 1,000,000원이다.\n(3) 2022.5.25.에 매입한 과세사업과 면세사업에 공통으로 사용될 기계설비의 매입세액은 5,000,000원이며, 과세사업과 면세사업의 공급가액(부가가치세 제외 금액)은 다음과 같다.\n과세기간 / 과세사업 공급가액 / 면세사업 공급가액\n2022.1.1.~3.31. / 160,000,000원 / 100,000,000원\n2022.4.1.~6.30. / 330,000,000원 / 110,000,000원",
  choices:["2,500,000원","4,500,000원","4,750,000원","5,500,000원","5,750,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2022-76", subject:"세법학개론", year:2022, no:76, law:"부가가치세법", unit:"매입세액과 차가감납부세액", kind:"calc",
  stem:"부가가치세 과세사업을 영위하는 (주)A에 관한 다음 자료에 따라 2022년 제1기 확정신고기간(2022.4.1.~6.30.)의 매입처별 세금계산서합계표 상 부가가치세 매입세액에 가감할 금액은? (단, 법령상 신고 등의 절차는 적법하게 이행되었으며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 2020.1.1.에 공급한 재화에 대한 매출채권 17,600,000원(부가가치세 포함)이 2022.4.5.에 부가가치세법에 따른 대손으로 확정되었다.\n(2) 2021.3.1.에 부가가치세법에 따른 대손으로 확정된 매출채권 27,500,000원(부가가치세 포함)을 2022.5.10.에 회수하였다.\n(3) 2021년 제1기 부가가치세 확정신고시 매입세액에서 차감한 대손세액은 1,980,000원이었고, 2022.6.15.에 해당 대손 금액 전부를 변제하였다.",
  choices:["520,000원 차감","1,080,000원 차감","1,800,000원 가산","1,980,000원 가산","3,580,000원 가산"],
  answer:4, status:"clear", note:"" },
{ id:"2022-77", subject:"세법학개론", year:2022, no:77, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"calc",
  stem:"다음은 일반사업자 (주)A가 (주)B에게 임대하고 있는 3층 건물(「국토의 계획 및 이용에 관한 법률」에 따른 도시지역 내에 소재)에 관한 자료이다. 2022년 제1기 과세기간의 부가가치세 과세표준은? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 임대현황(주택에 부가가치세가 과세되는 사업용 건물이 함께 설치되어 있음): 건물 1층 상가 100㎡, 건물 2층 주택 100㎡, 건물 3층 주택 100㎡, 부수토지 1,500㎡\n(2) 2022년 제1기 과세기간의 임대료로 30,000,000원(부가가치세 제외)을 수령하였으며 임대보증금은 438,000,000원이다(임대기간은 2021.1.1.~2022.12.31.이며, 임대료와 임대보증금의 건물과 부수토지에 대한 실지귀속은 불분명함).\n(3) 2022년 제1기 과세기간 종료일 현재 소득세법에 따른 기준시가: 건물 300,000,000원, 토지 500,000,000원\n(4) 2022년 제1기 과세기간 종료일 현재 계약기간 1년의 정기예금이자율은 3%로 가정한다.",
  choices:["15,215,000원","17,516,500원","19,455,000원","20,322,000원","22,822,500원"],
  answer:1, status:"clear", note:"" },
{ id:"2022-78", subject:"세법학개론", year:2022, no:78, law:"부가가치세법", unit:"세금계산서 및 절차규정", kind:"concept",
  stem:"부가가치세법령상 세금계산서에 관한 설명으로 옳은 것은?",
  choices:["공급하는 자의 주소, 공급품목, 단가와 수량, 작성 연월일이 기재되지 않은 세금계산서라도 그 매입세액은 매출세액에서 공제한다.","전자세금계산서를 발급하여야 하는 사업자가 아닌 사업자는 전자세금계산서를 발급하거나 전자세금계산서 발급명세를 전송할 수 없다.","처음 공급한 재화가 환입된 경우 재화가 환입된 날을 작성일로 적고 비고란에 처음 공급일을 덧붙여 적은 후 감소된 금액을 검정색 글씨로 쓰거나 음(陰)의 표시를 하여 수정세금계산서 또는 수정전자세금계산서를 발급한다.","직전 연도의 공급대가의 합계액이 4천800만원 미만인 간이과세자가 부가가치세가 과세되는 재화를 공급하는 경우에는 재화의 공급시기에 그 공급을 받은 자에게 영수증 또는 세금계산서를 발급할 수 있다.","세관장은 수입되는 재화에 대하여 부가가치세를 징수할 때(부가가치세법 제50조의2에 따라 부가가치세의 납부가 유예되는 때를 포함)에는 수입된 재화에 대한 세금계산서를 법령으로 정하는 바에 따라 수입하는 자에게 발급하여야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"2021-41", subject:"세법학개론", year:2021, no:41, law:"국세기본법", unit:"국세기본법 총칙", kind:"concept",
  stem:"「국세기본법」상 서류의 송달에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["세무공무원이 납세자를 방문해 서류를 교부하려고 하였으나 수취인이 부재중인 것으로 확인되어 납부기한까지 송달이 곤란하다고 인정되는 경우에는 공시송달을 할 수 있다.","납세의무자, 그 종업원 또는 동거인으로서 사리를 판별할 수 있는 사람이 부재하는 경우에는 송달할 장소에 서류를 둘 수 있다.","집배원이 아파트경비원에게 서류를 교부하는 방식의 송달은 적법한 송달이라고 볼 수 없다.","납부고지서의 우편송달은 등기우편으로만 하여야 한다.","「국세기본법」은 서류를 등기우편으로 송달하였으나 수취인이 부재중인 것으로 확인되어 반송됨으로써 납부기한 내에 송달이 곤란하다고 인정되는 경우에는 공시송달을 할 수 있다고 규정하고 있다."],
  answer:5, status:"clear", note:"" },
{ id:"2021-42", subject:"세법학개론", year:2021, no:42, law:"국세기본법·소득세법", unit:"납세의무", kind:"concept",
  stem:"(주)A는 제3기 사업연도(2014.1.1.~12.31.)의 매출기록을 조작하는 방식으로 매출을 일부 누락하여 법인세를 신고ㆍ납부하였다. 그 사실을 알게 된 과세관청은 2021.2.2. (주)A에게 법인세 부과처분을 함과 동시에 익금에 산입한 금액의 사외유출 귀속처가 불분명하다고 보아 대표이사인 甲에게 상여로 소득처분함을 내용으로 하는 소득금액변동통지를 하였다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["소득처분 관련 甲의 소득세 납세의무의 성립시기는 2014년이 끝나는 때이다.","甲이 사외유출된 금액이 자신에게 귀속되지 아니하였다는 점만을 입증하였다면 소득세 납세의무를 면할 수 없다.","(주)A에 대한 소득금액변동통지는 행정소송의 대상이 될 수 있는 “처분”에 해당한다.","甲이 스스로 부정행위를 하지 아니하였고 2014년 과세기간 귀속 소득의 소득세 신고를 법정신고기한까지 한 경우라면, 甲에 대한 소득세 부과제척기간의 만료일은 2020.5.31.이다.","甲에 대한 소득세 부과제척기간이 도과하였다면 (주)A에 대한 소득금액변동통지는 위법하다."],
  answer:4, status:"clear", note:"" },
{ id:"2021-43", subject:"세법학개론", year:2021, no:43, law:"국세기본법", unit:"조세채권 보전제도", kind:"concept",
  stem:"「국세기본법」상 국세의 우선에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["납세의무자의 재산양도일이 국세채권의 법정기일 이후인 경우 양수인은 물적납세의무를 부담한다.","「국세징수법」제7조제1항에 따라 양도담보권자에게 납부고지가 있은 후 납세자가 양도에 의하여 실질적으로 담보된 채무를 불이행하여 해당 재산이 양도담보권자에게 확정적으로 귀속되고 양도담보권이 소멸하는 경우에는 납부고지 당시의 양도담보재산이 계속하여 양도담보재산으로서 존속하는 것으로 본다(납부지연가산세는 감안하지 아니함).","현행법은「주택임대차보호법」에 따라 대항요건과 확정일자를 갖춘 임차권 관련 보증금채권(소액임대차보증금 아님)에 대한 특칙을 두고 있지 아니하므로 국세채권이 위 보증금채권에 우선한다.","납세의무자를 채무자로 하는 임금채권, 국세채권(법정기일 2016.3.), 근저당권부 채권(설정일 2016.2.)이 있는 경우 국세채권은 임금채권에 우선한다.","납세의무자를 채무자로 하는 국세채권(법정기일 2016.1., 압류 2016.5.) 100원, 근저당권부채권(근저당권설정일 2016.2.) 100원, 지방세채권(법정기일 2016.3., 압류 2016.3.) 100원이 있는 경우 압류재산 매각대금 150원의 배분은 국세채권 100원, 근저당권부채권 50원의 순으로 하여야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"2021-44", subject:"세법학개론", year:2021, no:44, law:"국세기본법", unit:"조세구제제도", kind:"concept",
  stem:"과세관청은 2016.3.2. (주)A에 대하여 매출누락을 이유로 제5기 사업연도(2014.1.1.~12.31.)의 법인세 금 20억원의 부과처분을 하였다. 그에 대하여 (주)A는 행정심판을 제기하지 아니하였다. 한편, 과세관청은 같은 과세기간에 대하여, 2017.4.4. 업무무관가지급금 인정이자 익금산입을 이유로 금 10억원의 증액경정처분을 하였다가, 당해 인정이자계산 상의 오류를 발견함에 따라 2017.5.6. 금 3억원의 감액경정처분을 하였다. (주)A는 2017.6.4. 조세심판원에 심판청구를 제기하여 2016.3.2.자 과세처분 사유인 매출누락 사실이 없음을 주장하였다. 그와 관련한 조세심판원의 결정에 대한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["2016.3.2.자 과세처분은 심판청구기간이 도과하여 불가쟁력이 발생하였으므로 심판청구 각하결정","(주)A의 주장이 맞다고 하더라도 금 20억원의 세액은 “당초 확정된 세액”에 해당하므로 심판의 이익이 없어 심판청구 각하결정","과세처분 취소결정이 필요한 경우 취소 대상으로 특정하여야 할 처분은 2016.3.2.자 과세처분이다.","(주)A의 주장이 맞다면 27억원의 부과처분 중 20억원을 넘는 부분의 부과처분 취소결정","(주)A의 주장이 맞다면 27억원의 부과처분 중 7억원을 넘는 부분의 부과처분 취소결정"],
  answer:4, status:"clear", note:"" },
{ id:"2021-45", subject:"세법학개론", year:2021, no:45, law:"국세징수법", unit:"국세징수법 보칙", kind:"concept",
  stem:"「국세징수법」상 납세증명서 등 제도에 관한 설명으로 옳지 않은 것은?",
  choices:["담보대출을 하고자 하는 은행이 납세의무자로부터 대출일 현재의 납세증명서를 전달받더라도 은행에 우선하는 국세채권의 존재를 확인할 수 없는 경우가 있다.","체납된 국세와 관련하여 심판청구가 계속 중인 경우에는 체납자의 인적사항 및 체납액 등을 공개할 수 없다.","미납국세의 열람 대상에는 아직 체납상태에 이르지 아니한 국세채권도 일부 포함되어 있다.","국세청장은 체납자 재산의 압류 및 담보 제공 등으로 출국금지 사유가 없어진 경우 즉시 법무부장관에게 출국금지의 해제를 요청하여야 한다.","「주택임대차보호법」제2조에 따른 주거용 건물을 임차하여 사용하려는 자는 건물 소유자의 동의 없이 국세체납액의 열람을 세무서장에게 신청할 수 있다."],
  answer:5, status:"clear", note:"" },
{ id:"2021-46", subject:"세법학개론", year:2021, no:46, law:"국세징수법", unit:"신고납부, 납부고지 등", kind:"concept",
  stem:"「국세징수법」상 납부고지 등 징수에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["체납액의 징수는 강제징수비, 가산세, 가산세를 제외한 국세의 순으로 한다.","독촉장을 발급하는 경우 독촉을 하는 날부터 30일 이내의 범위에서 기한을 정하여 발급한다.","제2차 납세의무자로부터 국세를 징수하고자 하는 경우 납부통지서를 발급하여야 한다.","하나의 납부고지서로 여러 종류의 가산세를 함께 부과하는 경우에는 그 가산세 종류별로 세액과 산출근거 등을 구분하여 기재하여야 한다.","국세를 포탈하려는 행위가 있다고 인정된다는 사유만으로는 납부기한 전 징수를 할 수 없다."],
  answer:4, status:"clear", note:"" },
{ id:"2021-47", subject:"세법학개론", year:2021, no:47, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"「국세징수법」상 강제징수절차에 관한 설명으로 옳지 않은 것은?",
  choices:["관할 세무서장은 압류한 재산에 대한 제3자의 소유권 주장 및 반환을 구하는 청구가 부당하다고 인정하는 경우 그 재산에 대한 강제징수를 정지하지 아니할 수 있다.","「국세기본법」은 세무공무원이 재산을 압류한 경우 체납자는 압류한 재산에 관하여 양도 등 처분을 할 수 없다고 규정하고 있다.","체납자는 관할 세무서장이 가치가 현저하게 줄어들 우려가 있다고 인정하여 제한할 경우를 제외하고는 압류된 자동차를 사용할 수 있다.","세무공무원은 체납자와 그 배우자의 공유재산으로서 양자가 공동 점유하고 있는 동산을 압류할 수 있다.","계속적 거래관계에서 발생하는 급료채권에 대한 압류의 효력은 체납액을 한도로 하여 압류 후에 발생할 급료채권에도 미친다."],
  answer:[1,2], status:"note", note:"⚠️ 복수정답 문제입니다 — 공식적으로 ①과 ② 모두 정답 처리됐습니다." },
{ id:"2021-48", subject:"세법학개론", year:2021, no:48, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"「국세징수법」상 교부청구, 참가압류 및 공매에 관한 설명으로 옳지 않은 것은?",
  choices:["관할 세무서장은 다른 관할 세무서장의 국세 체납자에 대한 강제징수가 시작된 경우 그 관할 세무서장에게 교부청구를 하여야 한다.","관할 세무서장의 선행압류기관에 대한 참가압류통지서 송달은 강제징수 시작 등 경우의 해당기관에 대한 교부청구를 갈음한다.","참가압류를 한 후에 선행압류기관이 압류한 부동산에 대한 압류를 해제한 경우 참가압류는 선행압류의 등기가 완료된 때로 소급하여 압류의 효력을 갖는다.","원칙적으로 행정소송이 계속 중인 국세의 체납으로 압류한 재산은 그 소(訴)에 대한 판결이 확정되기 전에는 공매할 수 없다.","세무공무원은 제3자의 명의로도 압류재산을 매수하지 못한다."],
  answer:3, status:"clear", note:"" },
{ id:"2021-49", subject:"세법학개론", year:2021, no:49, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"「조세범 처벌법」에 관한 설명으로 옳은 것은? (단, 다른 법률은 고려하지 아니하며 다툼이 있으면 판례에 따름)",
  choices:["「조세범 처벌법」상 “조세”란 관세를 제외한 국세를 말한다.","납세의무자의 위임을 받아, 대여받은 세무사 명의로, 납세의무자를 대리하여 세무신고를 하는 자가 조세의 부과를 면하게 하기 위하여 타인의 조세에 관하여 거짓으로 신고를 하였을 때에는 성실신고방해행위죄로 처벌할 수 없다.","조세의 원천징수의무자가 정당한 사유 없이 그 세금을 징수하지 아니한 행위는 징수한 세금을 정당한 사유 없이 납부하지 아니한 행위에 비하여 법정형량이 크다.","개인의 사용인이「조세범 처벌법」에서 규정하는 범칙행위를 하면, 그 개인에게도 사용인에게 과한 형과 같은 형을 과한다.","「조세범 처벌법」에 따른 범칙행위에 대한 공소제기는 세무서장 등의 고발을 요하지 아니한다."],
  answer:1, status:"clear", note:"" },
{ id:"2021-50", subject:"세법학개론", year:2021, no:50, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"「조세범 처벌법」상 조세포탈등죄의 요건인 “사기나 그 밖의 부정한 행위”란 (  )에 해당하는 행위로서 조세의 부과와 징수를 불가능하게 하거나 현저히 곤란하게 하는 적극적 행위를 말한다. 다음 중 (  )에 들어갈 수 있는 행위의 개수는? (단, 제시된 행위 이외의 다른 행위는 없으며 다툼이 있으면 판례에 따름)\n\n○ 고의 없이 장부를 작성하지 아니하는 행위\n○ 거짓 문서의 수취\n○ 허위의 신고행위\n○ 기록의 파기\n○ 위계에 의한 행위\n○ 납세신고를 하지 아니하는 행위",
  choices:["1개","2개","3개","4개","5개"],
  answer:3, status:"clear", note:"" },
{ id:"2021-51", subject:"세법학개론", year:2021, no:51, law:"소득세법", unit:"소득금액 계산 및 세액계산 특례", kind:"concept",
  stem:"「소득세법」상 결손금 또는 이월결손금에 관한 설명으로 옳은 것은?",
  choices:["사업소득금액을 계산할 때 발생한 결손금은 이자소득금액ㆍ배당소득금액ㆍ근로소득금액ㆍ연금소득금액ㆍ기타소득금액에서 순서대로 공제한다.","부동산임대업(주거용 건물 임대업 포함)에서 발생한 결손금은 종합소득 과세표준을 계산할 때 공제하지 않는다.","부동산임대업을 제외한 일반업종 사업소득에서 발생한 결손금은 부동산임대업에서 발생한 소득금액이 있는 경우에도 그 부동산임대업의 소득금액에서 공제하지 않는다.","소득금액을 추계신고하는 경우에는 이월결손금 공제규정을 적용하지 않는다. 다만, 천재지변으로 장부가 멸실되어 추계신고를 하는 경우라면 이월결손금 공제규정을 적용한다.","해당 과세기간 중 발생한 결손금과 이월결손금이 모두 존재하는 경우에는 이월결손금을 먼저 소득금액에서 공제한다."],
  answer:4, status:"clear", note:"" },
{ id:"2021-52", subject:"세법학개론", year:2021, no:52, law:"소득세법", unit:"소득금액 계산 및 세액계산 특례", kind:"concept",
  stem:"「소득세법」상 부당행위계산 부인에 관한 설명으로 옳지 않은 것은?",
  choices:["필요경비의 크기에 대하여 입증을 요구하지 않는 소득인 근로소득과 연금소득은 부당행위계산 부인의 대상이 되는 소득으로 규정되어 있지 않다.","배당소득과 이자소득은 필요경비가 인정되지 않는 소득이다. 따라서 배당소득과 이자소득 전체는 부당행위계산 부인의 대상이 되는 소득으로 규정되어 있지 않다.","과세표준의 계산과정이 세법의 규정대로 이루어지는 퇴직소득은 부당행위계산 부인의 대상이 되는 소득으로 규정되어 있지 않다.","직계존비속에게 주택을 무상으로 사용하게 하고 직계존비속이 그 주택에 실제로 거주하는 경우는 부당행위계산 부인의 대상에서 제외된다.","제조업 영위 개인사업자가 여유자금을 인출하여 부친에게 무상으로 대여한 경우에는 부당행위계산 부인의 대상이 되지 않으나 부친으로부터 높은 이자율(시가의 2배)로 사업자금을 차입하여 그 이자를 필요경비에 산입한 경우에는 부당행위계산 부인의 대상이 된다."],
  answer:2, status:"clear", note:"" },
{ id:"2021-53", subject:"세법학개론", year:2021, no:53, law:"소득세법", unit:"사업소득", kind:"calc",
  stem:"사업자인 甲의 다음 자료를 이용하여 계산한 초과인출금의 지급이자 필요경비 불산입액은? (단, 계산결과는 원 단위 미만에서 절사하고 주어진 자료 이외의 사항은 고려하지 않음)\n\n1. 월차 결산에 따른 자산과 부채의 현황은 다음과 같다.\n구분 / 사업용 자산 / 사업용 부채 / 세법상 충당금(부채에 포함됨)\n6월 / 150,000,000원 / 200,000,000원 / 20,000,000원\n7월 / 140,000,000원 / 160,000,000원 / 20,000,000원\n\n2. 지급이자와 관련된 자료는 다음과 같다.\n이자율 / 지급이자 / 차입금 적수\n연 20% / 400,000원* / 730,000,000원\n연 12% / 1,200,000원 / 3,650,000,000원\n* 이 금액 중 50%는 채권자 불분명사채의 이자이다.",
  choices:["313,823원","328,767원","375,890원","776,986원","856,986원"],
  answer:3, status:"clear", note:"" },
{ id:"2021-54", subject:"세법학개론", year:2021, no:54, law:"소득세법", unit:"사업소득", kind:"calc",
  stem:"거주자 甲의 2021년도 종합소득에 관한 자료가 다음과 같을 경우 분리과세 주택임대소득에 대한 사업소득금액은?\n\n1. 甲이 임대하고 있는 주택은「소득세법 시행령」제122조의2에 의한 등록임대주택이 아니다.\n2. 甲의 주택임대와 관련된 자료는 다음과 같다.\n구분 / A주택 / B주택\n임대료 수입 / 10,000,000원 / -\n간주임대료 / 4,000,000원 / 4,000,000원\n합계 / 14,000,000원 / 4,000,000원\n3. 甲의 종합소득금액은 상기의 주택임대소득을 제외하고 2천만원을 넘지 않는다.",
  choices:["3,200,000원","5,000,000원","5,200,000원","7,000,000원","9,000,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2021-55", subject:"세법학개론", year:2021, no:55, law:"소득세법", unit:"이자소득과 배당소득", kind:"calc",
  stem:"다음은 2021년도 거주자 甲의 금융소득에 관한 자료이다. 종합과세할 배당소득금액은? (단, 원천징수는 적법하게 이루어졌으며 제시된 금액은 원천징수 전의 금액이다. 주어진 자료 외의 사항은 고려하지 않음)\n\n○ 내국법인 A가 이익잉여금을 자본전입함에 따라 지급받은 무상주의 액면가액 5,000,000원\n○ 내국법인 B가 주식발행초과금을 자본전입함에 따라 지급받은 무상주의 액면가액 6,000,000원(자기주식에 배정되지 못하여 재배정함에 따라 지분율이 증가된 금액 2,000,000원 포함)\n○ 「소득세법 시행령」제26조의2제1항에 의한 집합투자기구(사모집합투자기구가 아님)로부터 받은 이익금 5,000,000원(증권시장에 상장된 제조업 영위 내국법인 주식의 매매차익 2,000,000원 포함)\n○ 국내은행으로부터 받은 이자 12,000,000원",
  choices:["8,220,000원","10,220,000원","10,550,000원","12,220,000원","22,220,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2021-56", subject:"세법학개론", year:2021, no:56, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"calc",
  stem:"2021년도 거주자 甲의 기타소득과 관련된 자료는 다음과 같다. 종합과세할 기타소득금액은? (단, 원천징수는 적법하게 이루어졌으며 제시된 금액은 원천징수 전의 금액이다. 주어진 자료 외의 사항은 고려하지 않음)\n\n○ 주택입주 지체상금 수령액: 3,000,000원\n○ 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」에 따른 공익사업과 관련하여 지상권을 대여함으로써 받은 금액: 15,000,000원\n○ 과세대상이 되는 서화를 반복적으로 판매함으로써 얻은 소득: 200,000,000원(단, 이와 관련하여 사업장을 갖추거나 사업자등록을 하지는 않았으며, 서화의 보유기간은 10년 미만이다.)\n○ 위 소득과 관련하여 확인된 필요경비는 없다.",
  choices:["3,600,000원","4,200,000원","6,600,000원","7,200,000원","36,600,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2021-57", subject:"세법학개론", year:2021, no:57, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"concept",
  stem:"근로소득에 관한 설명으로 옳지 않은 것은?",
  choices:["대기업의 종업원이 주택의 구입에 소요되는 자금을 무상으로 대여 받음으로써 얻는 이익은 근로소득에 포함된다.","공무원이 공무수행과 관련하여 국가로부터 받는 상금과 사기업체 종업원이 법에 따라 받는 직무발명보상금은 연 500만원까지 비과세한다.","일용근로자가 아닌 근로자의 경우 총급여액에서 공제하는 근로소득공제는 연간 2,000만원을 한도로 한다.","법인세법에 따라 처분된 인정상여의 귀속시기는 그 법인의 결산확정일이 아닌 근로자가 해당 사업연도 중 근로를 제공한 날로 한다.","근로를 제공하고 받은 대가라 하더라도 독립된 지위에서 근로를 제공하였다면 그 대가는 근로소득으로 보지 않는다."],
  answer:2, status:"clear", note:"" },
{ id:"2021-58", subject:"세법학개론", year:2021, no:58, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"concept",
  stem:"연금소득에 관한 설명으로 옳은 것은?",
  choices:["공적연금의 경우 2002.1.1.(과세기준일) 이후부터 과세로 전환되었으므로 연금수령액 중 과세연금액은 ‘과세기준일 이후 기여금 납입월수’가 ‘총 기여금 납입월수’에서 차지하는 비율에 따라서 분할하여 계산한다.","연금계좌에서 인출하는 금액이 연금수령요건을 충족한 경우 퇴직연금계좌 인출액이든 연금저축계좌 인출액이든 연금소득공제를 적용한다.","사망할 때까지 연금수령하는 종신계약에 따라 받는 연금소득의 경우 3%의 원천징수세율을 적용한다.","연금계좌에서 일부 금액이 인출되는 경우 인출순서는 이연퇴직소득 → 과세제외금액 → 연금계좌세액공제를 받은 납입액과 운용수익 순서로 인출되는 것으로 한다.","이연퇴직소득을 연금수령하는 경우로서 실제수령연차가 10년을 초과하는 경우 원천징수세율은 연금외수령 원천징수세율의 60%가 된다."],
  answer:5, status:"clear", note:"" },
{ id:"2021-59", subject:"세법학개론", year:2021, no:59, law:"소득세법", unit:"양도소득세", kind:"concept",
  stem:"양도소득세의 과세대상이 아닌 것은?",
  choices:["지상권의 양도로 발생하는 소득","지역권의 양도로 발생하는 소득","등기된 부동산임차권의 양도로 발생하는 소득","한국토지주택공사 발행 주택상환사채의 양도로 발생하는 소득","가액을 별도로 평가하지 않고 토지ㆍ건물과 함께 양도하는 이축권(개발제한구역 내의 건축물을 법에 따른 취락지구 등으로 이축할 수 있는 권리)의 양도로 발생하는 소득"],
  answer:2, status:"clear", note:"" },
{ id:"2021-60", subject:"세법학개론", year:2021, no:60, law:"소득세법", unit:"이자소득과 배당소득", kind:"concept",
  stem:"「소득세법」제16조제1항제10호에서 규정하는 직장공제회 초과반환금에 관한 설명으로 옳지 않은 것은?",
  choices:["소득세법령이 정하는 직장공제회 초과반환금은 이자소득에 해당한다.","과세대상이 되는 초과반환금에는 반환금에서 납입공제료를 뺀 금액인 “납입금 초과이익”만이 아니라 반환금 분할지급 시 발생하는 “반환금 추가이익”도 포함된다.","직장공제회 초과반환금은 종합소득 과세표준에 합산하지 않는다.","“납입금 초과이익”에 대한 산출세액은「소득세법」제63조제1항에서 규정하는 방식(연분연승 방식)에 따른다.","“반환금 추가이익”에 대한 산출세액은 해당 추가이익에 금융소득에 대한 원천징수세율인 14%의 세율을 적용하여 계산한다."],

{ id:"2021-61", subject:"세법학개론", year:2021, no:61, law:"법인세법", unit:"과세표준", kind:"calc",
  stem:"제조업을 영위하는 영리내국법인 (주)A(중소기업 및 회생계획을 이행 중인 기업은 아님)의 다음 자료에 따른 제21기 사업연도(2021.1.1.~12.31.) 법인세 과세표준은? (단, 전기 이전의 모든 세무조정은 적절하게 이루어졌으며, 주어진 자료 이외에는 고려하지 않는다. 또한 수입배당금액에 대한 익금불산입 규정은 적용하지 않음)\n\n(1) 제21기 사업연도 포괄손익계산서상 당기순이익은 300,000,000원이다.\n(2) 제21기 말 재무상태표에는 2020.1.1.에 (주)A의 대표이사로부터 현금을 지불하고 취득한 건물(취득가액: 400,000,000원)이 계상되어 있으며, (주)A는 동 건물에 대하여 정액법(매기 상각률: 0.05)에 따른 감가상각비를 제21기 포괄손익계산서에 비용으로 계상하였다. 동 건물의 취득 당시 시가는 350,000,000원, 신고내용연수는 20년이며 감가상각방법은 신고하지 않았다.\n(3) (주)A의 경영에 대해 사실상 영향력을 행사하고 있다고 인정되는 자의 배우자인 甲에게 (주)A의 업무와 관련 없이 대여한 5,000,000원이 회수불능하게 됨에 따라 전액 대손처리하고, 이를 제21기 포괄손익계산서에 비용으로 계상하였다. 단, (주)A는 동 대여금에 대해서「법인세법」상 시가를 초과하는 이자를 수령하고 있다.\n(4) (주)A는 (주)B가 발행한 주식 20,000주(주당 액면가액 5,000원)를 1주당 6,000원에 취득하여 보유하고 있었는데, 제21기 중 (주)B는 발행주식의 10%를 1주당 10,000원의 현금을 지급하고 일괄 매입하여 소각하였다. (주)A는 (주)B로부터 수취한 20,000,000원에 대하여 아무런 회계처리를 하지 않고 보유주식수만 감소시켰다.\n(5) (주)A는 제20기에「법인세법」상 결손금 200,000,000원이 발생하였으며, 자산수증이익 및 채무면제이익으로 충당된 결손금은 없다.",
  choices:["102,700,000원","110,500,000원","115,500,000원","126,200,000원","137,700,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2021-62", subject:"세법학개론", year:2021, no:62, law:"법인세법", unit:"세액계산", kind:"calc",

{ id:"2021-65", subject:"세법학개론", year:2021, no:65, law:"법인세법", unit:"손금과 손금불산입", kind:"calc",
  stem:"영리내국법인 (주)A의 포괄손익계산서 세금과공과 계정에는 다음의 금액이 포함되어 있다.『소득금액조정합계표』작성 시 ‘익금산입 및 손금불산입’에 포함되어야 할 금액의 합계는?\n\n○ 사계약상의 의무불이행으로 인하여 부담한 지체상금(구상권 행사 불가능): 1,000,000원\n○ 업무와 관련하여 발생한 교통사고 벌과금: 1,500,000원\n○ 전기요금의 납부지연으로 인한 연체가산금: 3,500,000원\n○ 「국민건강보험법」에 따라 징수하는 연체금: 4,000,000원\n○ 국유지 사용료의 납부지연으로 인한 연체료: 5,500,000원\n○ 외국의 법률에 따라 국외에서 납부한 벌금: 6,000,000원",

{ id:"2021-66", subject:"세법학개론", year:2021, no:66, law:"법인세법", unit:"합병 및 분할 특례", kind:"concept",
  stem:"「법인세법」상 합병시 피합병법인에 대한 과세와 관련하여 적격합병이 갖추어야 할「법인세법」제44조제2항제4호의 요건 중에는 다음의 내용이 포함된다.\n\n합병등기일 1개월 전 당시 피합병법인에 종사하는 대통령령으로 정하는 근로자 중 합병법인이 승계한 근로자의 비율이 100분의 80 이상이고, 합병등기일이 속하는 사업연도의 종료일까지 그 비율을 유지할 것\n\n위의 내용에서 밑줄로 표시된 대통령령으로 정하는 근로자란「근로기준법」에 따라 근로계약을 체결한 내국인 근로자를 말하지만 특정한 일부 근로자는 제외되는데, 이 경우 제외되는 근로자에 해당하지 않는 것은?",
  choices:["근로계약의 연속된 갱신으로 인하여 합병등기일 1개월 전 당시 그 근로계약의 총 기간이 1년 이상인 근로자","법인 이사회의 구성원에 해당하는 임원","합병등기일이 속하는 사업연도의 종료일 이전에「고용상 연령차별금지 및 고령자고용촉진에 관한 법률」에 따른 정년이 도래하여 퇴직이 예정된 근로자","「소득세법」에 따른 일용근로자","합병등기일이 속하는 사업연도의 종료일 이전에 사망한 근로자"],
