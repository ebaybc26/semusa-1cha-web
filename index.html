<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="세무사 1차 시험 기출 900문항(2016~2025) 과목·단원별 문제풀이">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  img{max-width:100%}
</style>
</head>
<body>
<title>세무사 1차 스터디</title>
<style>
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  :root {
    --ink: #1B2232;
    --ink-soft: #3C4356;
    --paper: #EAE7DC;
    --paper-raised: #F6F4EC;
    --paper-line: #D8D3C2;
    --brass: #96762F;
    --brass-soft: #E4D9B8;
    --jade: #2F6B4F;
    --jade-soft: #DCEAE2;
    --vermillion: #AD3B2B;
    --vermillion-soft: #F3DCD6;
    --shadow: 0 1px 2px rgba(27,34,50,0.06), 0 6px 20px rgba(27,34,50,0.07);
    --radius: 3px;
    --serif: "Noto Serif KR", "Source Serif 4", "Nanum Myeongjo", "Batang", serif;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E9E6DC;
      --ink-soft: #B6B1A0;
      --paper: #171B26;
      --paper-raised: #1F2434;
      --paper-line: #323A4E;
      --brass: #D3B86B;
      --brass-soft: #3A3522;
      --jade: #6FBE98;
      --jade-soft: #1C3A2C;
      --vermillion: #E08776;
      --vermillion-soft: #3D2322;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ink: #E9E6DC; --ink-soft: #B6B1A0; --paper: #171B26; --paper-raised: #1F2434;
    --paper-line: #323A4E; --brass: #D3B86B; --brass-soft: #3A3522; --jade: #6FBE98;
    --jade-soft: #1C3A2C; --vermillion: #E08776; --vermillion-soft: #3D2322;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"] {
    --ink: #1B2232; --ink-soft: #3C4356; --paper: #EAE7DC; --paper-raised: #F6F4EC;
    --paper-line: #D8D3C2; --brass: #96762F; --brass-soft: #E4D9B8; --jade: #2F6B4F;
    --jade-soft: #DCEAE2; --vermillion: #AD3B2B; --vermillion-soft: #F3DCD6;
    --shadow: 0 1px 2px rgba(27,34,50,0.06), 0 6px 20px rgba(27,34,50,0.07);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; }
  ::selection { background: var(--brass-soft); }

  a { color: inherit; }
  button { font-family: inherit; margin: 0; appearance: none; -webkit-appearance: none; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* ---- letterhead ---- */
  .letterhead {
    display: flex;
    align-items: center;
    gap: 18px;
    padding-bottom: 18px;
    border-bottom: 3px double var(--paper-line);
    margin-bottom: 22px;
  }
  .seal {
    flex: none;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2px solid var(--vermillion);
    color: var(--vermillion);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    transform: rotate(-6deg);
    writing-mode: vertical-rl;
    text-orientation: upright;
    line-height: 1;
    user-select: none;
  }
  .letterhead h1 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .letterhead p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .sync-pill {
    margin-left: auto;
    flex: none;
    font-size: 11.5px;
    color: var(--ink-soft);
    border: 1px solid var(--paper-line);
    border-radius: 999px;
    padding: 4px 10px;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--paper-line); flex: none; }
  .sync-pill[data-live="1"] .sync-dot { background: var(--jade); }

  /* ---- subject rail ---- */
  .subjects {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 18px;
  }
  .subject-pill {
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--paper-line);
    background: var(--paper-raised);
    color: var(--ink-soft);
    cursor: default;
  }
  .subject-pill.active {
    border-color: var(--brass);
    color: var(--ink);
    background: var(--brass-soft);
    font-weight: 600;
  }
  .subject-pill.soon { opacity: 0.55; }
  .subject-pill.clickable { cursor: pointer; }
  .subject-pill.clickable:hover { border-color: var(--brass); }

  .top-subjects {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-bottom: 14px;
  }
  .top-subject-pill {
    font-family: var(--serif);
    font-size: 16px;
    padding: 10px 18px;
    border-radius: var(--radius);
    border: 1px solid var(--paper-line);
    background: var(--paper-raised);
    color: var(--ink-soft);
  }
  .top-subject-pill.active {
    border-color: var(--brass);
    color: var(--ink);
    background: var(--brass-soft);
    font-weight: 700;
  }
  .top-subject-pill.soon { opacity: 0.55; }
  .top-subject-pill.clickable { cursor: pointer; }
  .top-subject-pill.clickable:hover { border-color: var(--brass); }

  .units {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 18px;
  }
  .unit-pill {
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--paper-line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .unit-pill.active {
    border-color: var(--jade);
    color: var(--ink);
    background: var(--jade-soft);
    font-weight: 600;
  }
  .unit-pill:hover { border-color: var(--jade); }

  /* ---- toolbar ---- */
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .tabs { display: flex; gap: 4px; background: var(--paper-raised); border: 1px solid var(--paper-line); border-radius: var(--radius); padding: 3px; }
  .tab-btn {
    border: none; background: transparent; color: var(--ink-soft);
    font-size: 13px; padding: 7px 14px; border-radius: 2px; cursor: pointer;
  }
  .tab-btn.active { background: var(--ink); color: var(--paper); }
  .score-box {
    margin-left: auto;
    display: flex; align-items: baseline; gap: 6px;
    font-family: var(--serif);
  }
  .score-box b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .score-box span { font-size: 12px; color: var(--ink-soft); }

  /* ---- layout: rail + panel ---- */
  .board {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 620px) {
    .board { grid-template-columns: 1fr; }
    .rail { order: 2; }
  }

  .rail {
    position: sticky; top: 16px;
    display: flex; flex-direction: column; gap: 14px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }
  .rail-year { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.08em; margin: 0 0 4px 2px; }
  .rail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  @media (max-width: 620px) {
    .rail { flex-direction: row; overflow-x: auto; overflow-y: visible; max-height: none; gap: 16px; padding-bottom: 6px; }
    .rail-group { flex: none; }
    .rail-grid { grid-template-columns: repeat(4, 26px); }
  }
  .q-chip {
    width: 100%; aspect-ratio: 1;
    border: 1px solid var(--paper-line);
    background: var(--paper-raised);
    color: var(--ink-soft);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    border-radius: 2px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .q-chip.current { border-color: var(--ink); color: var(--ink); font-weight: 700; }
  .q-chip.correct { background: var(--jade-soft); border-color: var(--jade); color: var(--jade); }
  .q-chip.wrong { background: var(--vermillion-soft); border-color: var(--vermillion); color: var(--vermillion); }

  /* ---- question card ---- */
  .card {
    background: var(--paper-raised);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 26px 22px;
  }
  .card-meta {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .tag {
    font-size: 11px; padding: 3px 8px; border-radius: 2px;
    border: 1px solid var(--paper-line); color: var(--ink-soft);
  }
  .tag.law { font-family: var(--serif); }
  .tag.badge-clear { color: var(--jade); border-color: var(--jade); }
  .tag.badge-note { color: var(--brass); border-color: var(--brass); }
  .tag.badge-revised { color: var(--vermillion); border-color: var(--vermillion); }
  .qno { font-family: var(--serif); font-size: 13px; color: var(--ink-soft); }

  .stem {
    font-size: 15.5px; line-height: 1.75;
    margin: 0 0 18px;
    white-space: pre-wrap;
    text-wrap: pretty;
  }

  .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
  .choice {
    display: flex; gap: 10px; align-items: flex-start;
    text-align: left;
    width: 100%;
    padding: 11px 14px;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 2px;
    cursor: pointer;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink);
  }
  .choice:hover { border-color: var(--brass); }
  .choice .num { font-family: var(--serif); flex: none; color: var(--ink-soft); }
  .choice.picked { border-color: var(--ink); }
  .choice.reveal-correct { background: var(--jade-soft); border-color: var(--jade); }
  .choice.reveal-correct .num { color: var(--jade); }
  .choice.reveal-wrong { background: var(--vermillion-soft); border-color: var(--vermillion); }
  .choice.reveal-wrong .num { color: var(--vermillion); }
  .choice[disabled] { cursor: default; }

  .result-line {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 2px;
    font-size: 13.5px;
    line-height: 1.7;
    border: 1px solid var(--paper-line);
    background: var(--paper);
  }
  .result-line.ok { border-color: var(--jade); }
  .result-line.ng { border-color: var(--vermillion); }
  .result-line b { font-family: var(--serif); }
  .result-line .note-label { color: var(--brass); font-weight: 600; }

  .card-nav {
    display: flex; justify-content: space-between; margin-top: 20px;
  }
  .nav-btn {
    font-size: 13px; padding: 8px 16px;
    border: 1px solid var(--paper-line); background: var(--paper-raised);
    color: var(--ink); border-radius: 2px; cursor: pointer;
  }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--ink-soft);
    font-size: 14px; line-height: 1.8;
  }

  footer.note {
    margin-top: 32px;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.8;
    border-top: 1px solid var(--paper-line);
    padding-top: 14px;
  }
  /* ---- 모바일 최적화 (휴대폰에서 문제 풀기) ---- */
  @media (max-width: 620px) {
    .wrap { padding: 16px 13px 56px; }
    .letterhead { gap: 12px; padding-bottom: 14px; margin-bottom: 16px; }
    .letterhead h1 { font-size: 19px; }
    .letterhead p { font-size: 12px; }
    .seal { width: 42px; height: 42px; font-size: 11px; }
    .sync-pill { display: none; }

    /* 과목 탭: 한 줄 가로 스크롤 */
    .top-subjects { flex-wrap: nowrap; overflow-x: auto; gap: 7px; margin-bottom: 10px; }
    .top-subjects::-webkit-scrollbar { display: none; }
    .top-subject-pill { flex: none; font-size: 14px; padding: 9px 14px; white-space: nowrap; }

    /* 단원 바: 여러 줄로 쌓이면 화면을 다 먹으므로 한 줄 가로 스크롤로 */
    .units {
      flex-wrap: nowrap; overflow-x: auto; gap: 6px;
      margin-bottom: 14px; padding-bottom: 3px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .units::-webkit-scrollbar { display: none; }
    .unit-pill { flex: none; white-space: nowrap; font-size: 13px; padding: 8px 13px; }

    .toolbar { gap: 8px; margin-bottom: 14px; }
    .tab-btn { padding: 9px 13px; font-size: 13px; }
    .score-box b { font-size: 18px; }

    /* 문제 카드: 여백 줄이고 글자 키움 */
    .card { padding: 18px 16px 16px; }
    .stem { font-size: 16px; line-height: 1.72; margin-bottom: 16px; }
    .choice { padding: 14px 13px; gap: 9px; font-size: 15px; line-height: 1.6; }

    /* 문항 번호 버튼: 터치하기 좋게 확대 */
    .rail-grid { grid-template-columns: repeat(5, 40px); gap: 7px; }
    .q-chip { font-size: 13px; }
  }

  /* ---- 단원순 정렬일 때 레일 ---- */
  :root[data-sort="unit"] .board { grid-template-columns: 138px 1fr; }
  :root[data-sort="unit"] .rail-grid { grid-template-columns: repeat(2, 1fr); gap: 4px; }
  :root[data-sort="unit"] .q-chip {
    aspect-ratio: auto; padding: 7px 2px; font-size: 11px; letter-spacing: -0.02em;
  }
  :root[data-sort="unit"] .rail-year {
    white-space: normal; line-height: 1.35; font-size: 10.5px;
    margin-bottom: 5px; word-break: keep-all;
  }
  :root[data-sort="unit"] .rail-group { margin-bottom: 2px; }
  @media (max-width: 620px) {
    :root[data-sort="unit"] .board { grid-template-columns: 1fr; }
    :root[data-sort="unit"] .rail-grid { grid-template-columns: repeat(3, 58px); gap: 6px; }
    :root[data-sort="unit"] .q-chip { font-size: 12px; padding: 9px 2px; }
    :root[data-sort="unit"] .rail-year { font-size: 11px; max-width: 186px; }
    /* 정렬 토글은 모바일에서도 보이게 */
    #sortTabs .tab-btn { padding: 9px 11px; font-size: 13px; }
  }

  /* ---- 제출 방식 채점 ---- */
  .choice.picked {
    border-color: var(--ink);
    background: var(--brass-soft);
    font-weight: 600;
  }
  .choice.picked .num { color: var(--ink); }

  .submit-row { margin-top: 16px; display: flex; justify-content: flex-end; }
  .submit-btn {
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-family: var(--serif);
    font-size: 15px;
    padding: 11px 30px;
    border-radius: 2px;
    cursor: pointer;
  }
  .submit-btn:hover { background: var(--ink-soft); border-color: var(--ink-soft); }
  .submit-btn[disabled] {
    background: transparent; color: var(--ink-soft);
    border-color: var(--paper-line); cursor: default; font-weight: 400;
  }

  .submit-all {
    border: 1px solid var(--brass);
    background: var(--brass-soft);
    color: var(--ink);
    font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 2px; cursor: pointer;
    white-space: nowrap;
  }
  .submit-all:hover { border-color: var(--ink); }

  .batch-summary {
    margin: 0 0 16px;
    padding: 12px 14px;
    border: 1px solid var(--vermillion);
    background: var(--vermillion-soft);
    border-radius: 2px;
    font-size: 13.5px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .batch-summary[hidden] { display: none; }
  .batch-summary.all-ok { border-color: var(--jade); background: var(--jade-soft); }
  .batch-summary b { font-family: var(--serif); }
  .link-btn {
    border: 1px solid currentColor; background: transparent; color: inherit;
    font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  }

  @media (max-width: 620px) {
    .submit-row { justify-content: stretch; }
    .submit-btn { width: 100%; padding: 14px; font-size: 16px; }
    .submit-all { padding: 9px 12px; font-size: 12.5px; }
    .batch-summary { font-size: 13px; margin-bottom: 12px; }
  }

  /* ---- 함정문제 ---- */
  .tag.badge-trap { color: var(--vermillion); border-color: var(--vermillion); background: var(--vermillion-soft); font-weight: 600; }
  .trap-note {
    margin-top: 10px; padding: 12px 14px; border-radius: 2px;
    border: 1px dashed var(--vermillion); background: var(--vermillion-soft);
    font-size: 13.5px; line-height: 1.75;
  }
  .trap-note b { font-family: var(--serif); display: inline-block; margin-bottom: 4px; }
  @media (max-width: 620px) { .trap-note { font-size: 13px; } }

</style>

<div class="wrap">
  <div class="letterhead">
    <div class="seal">모의</div>
    <div>
      <h1>세무사 1차 스터디</h1>
      <p>2016~2025년 기출 · 공식정답 전수 대조 · 2026년 개정세법 반영 검토</p>
    </div>
    <div class="sync-pill" id="syncPill" data-live="0">
      <span class="sync-dot"></span>
      <span id="syncLabel">기기 동기화 확인 중…</span>
    </div>
  </div>

  <div class="top-subjects" id="topSubjects"></div>
  <div class="subjects" id="subjects"></div>
  <div class="units" id="units"></div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab-btn active" data-mode="all">전체 풀기</button>
      <button class="tab-btn" data-mode="wrong">오답노트</button>
    
      <button class="tab-btn" data-mode="trap">함정문제</button>
    </div>
    <div class="tabs" id="kindTabs">
      <button class="tab-btn active" data-kind="all">전체</button>
      <button class="tab-btn" data-kind="concept">말문제</button>
      <button class="tab-btn" data-kind="calc">계산문제</button>
    </div>
    <div class="tabs" id="sortTabs">
      <button class="tab-btn active" data-sort="year">연도순</button>
      <button class="tab-btn" data-sort="unit">단원순</button>
    </div>
    <button class="submit-all" id="submitAll" hidden></button>
    <div class="score-box"><b id="scoreNum">0 / 12</b><span>채점 완료</span></div>
  </div>

  <div class="batch-summary" id="batchSummary" hidden></div>

  <div class="board">
    <nav class="rail" id="rail"></nav>
    <main id="panel"></main>
  </div>

  <footer class="note">
    공식정답 출처: 한국산업인력공단(큐넷) 공개 2023·2024·2025년 세무사 1차 최종정답 원문.
    2026년 개정 반영은 2025년 세법개정안(2025.12.2 국회 의결) 기준이며, 세무사 시험은 "시험 시행일 현재 시행 법령" 기준이므로
    2027년 응시 직전에 최신 법령으로 한 번 더 확인을 권장합니다.
  </footer>
</div>

<script>
(function () {
  "use strict";

  var QUESTIONS = [
    {
      id: "2023-41", unit: "납세의무", subject: "세법학개론", year: 2023, no: 41, law: "국세기본법",
      stem: "국세기본법령상 납세의무가 성립하는 때에 특별한 절차 없이 그 세액이 확정되는 국세가 아닌 것은?",
      choices: [
        "인지세",

  choices:["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"], answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-10", subject:"재정학", year:2023, no:10, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"근로소득세 부과가 노동시장에 미치는 효과에 관한 설명으로 옳지 않은 것은?",
  choices:["여가가 정상재일 경우 소득효과가 대체효과보다 크면 후방굴절형 노동공급곡선이 될 것이다.","여가가 정상재일 경우 비례소득세 부과로 인한 소득효과가 대체효과보다 작다면 노동공급은 줄어든다.","여가가 정상재일 경우 누진소득세 부과가 노동공급에 미치는 영향은 비례소득세 부과와 유사하지만 고소득자에게 유리하다.","여가가 열등재일 경우 비례소득세를 부과하면 노동공급은 감소한다.","여가가 열등재일 경우 정액세(lump-sum tax)를 부과하면 소득효과만 존재하여 노동공급은 감소한다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-11", subject:"재정학", year:2023, no:11, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"시점간(inter-temporal) 소비선택 모형에서 이자소득세의 부과에 관한 설명으로 옳은 것은? (단, 무차별곡선은 원점에 대해 강볼록하며, 미래소득은 영(0)이다. 그리고 현재소비와 미래소비는 모두 정상재이다.)",
  choices:["이자소득세 부과 시 현재소비의 상대가격은 상승하게 된다.","이자소득세 부과 시 저축은 반드시 감소하게 된다.","이자소득세 부과 시 민간저축은 감소하나 총저축의 증감여부는 불분명하다.","현재소비에 미치는 영향은 소득효과와 대체효과의 상대적인 크기에 의해 결정된다.","미래소비에 미치는 영향은 소득효과와 대체효과의 상대적인 크기에 의해 결정된다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-12", subject:"재정학", year:2023, no:12, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"한계실효세율(marginal effective tax rate)에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 투자수익에 조세가 부과되지 않으면 한계실효세율은 0이다.\nㄴ. 한계실효세율이 낮을수록 투자에 유리하다.\nㄷ. 한계실효세율이 음(-)인 경우, 조세가 투자를 촉진하는 결과를 가져온다.",
  choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"], answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-13", subject:"재정학", year:2023, no:13, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"자본의 사용자 비용(user cost of capital)을 낮추어 투자를 촉진할 수 있는 조세정책이 아닌 것은?",
  choices:["가속상각제도","투자세액공제","특정기간조세 감면","법인세율 인하","근로소득세 감면"], answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-14", subject:"재정학", year:2023, no:14, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"모딜리아니-밀러(Modigliani-Miller)의 제1명제에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 이 명제는 기업의 가치를 극대화하는 최적 자본구조의 존재를 증명한 것이다.\nㄴ. 이 명제에서는 기업의 수익에 조세가 과세되지 않는 것을 가정하고 있다.\nㄷ. 이 명제에서는 경영자가 주주의 재산을 극대화하려는 노력을 가정하고 있다.\nㄹ. 이 명제에서는 모든 투자자와 경영자가 같은 정보를 가지고 있음을 가정한다.",
  choices:["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"], answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-15", subject:"재정학", year:2023, no:15, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"재정적자의 경제적 효과에 관한 설명으로 옳은 것은?",
  choices:["통화주의학파는 국채발행이 구축효과를 가져와서 총수요를 증가시킨다고 하였다.","케인즈학파는 국채발행을 통해 조세부담을 경감시켜도 총수요는 변화가 없다고 하였다.","리카르도(D. Ricardo)는 재정적자를 국채로 충당하면 총수요를 감소시킨다고 하였다.","배로(R. Barro)는 정부지출이 일정하다면 재정적자를 조세로 조달하든 국채로 조달하든 총수요에 영향을 미치지 않는다고 하였다.","러너(A. Lerner)는 외부채무는 미래세대의 부담을 증가시키지 않는다고 하였다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-16", subject:"재정학", year:2023, no:16, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"자연독점인 공기업의 공공요금 결정에 관한 설명으로 옳은 것은?",
  choices:["규모의 경제가 존재하는 경우 하나의 공기업에서 생산하는 것이 더 낮은 비용으로 생산할 수 있다.","민간기업이 생산하고 가격규제를 하지 않으면 사회적 최적생산량 달성이 가능하다.","공공서비스의 경우 이부가격제도(two-part tariff)를 적용하면 결손을 줄일 수 있으나, 효율적 생산량에 도달하는 것은 불가능하다.","한계비용가격설정을 사용하는 경우 해당 공기업의 경제적 이윤은 양(+)이 된다.","평균비용가격설정을 사용하는 경우 해당 공기업의 경제적 이윤은 음(-)이 된다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-17", subject:"재정학", year:2023, no:17, law:"재정학", unit:"3편 공공지출이론", kind:"calc",
  stem:"독점적으로 가스를 공급하는 K가스공사는 동일 비용으로 가스를 생산하여 가정용과 산업용으로 구분하여 판매하고 있다. 산업용 가스의 시장수요의 가격탄력성은 3이고, 가정용 가스의 시장수요의 가격탄력성은 2라고 하자. 가정용 가스의 m³당 가격이 1,200원이라면 K가스공사가 이윤을 극대화할 수 있는 산업용 가스의 m³당 가격은? (단, 기타 비용은 0원이다.)",
  choices:["300원","400원","600원","900원","1,200원"], answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-18", subject:"재정학", year:2023, no:18, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"우리나라의 지방재정에 관한 설명으로 옳지 않은 것은?",
  choices:["지방세 규모는 국세 규모보다 작다.","중앙정부는 법률로 국세를 신설할 수 있으며 지방자치단체는 법률에 관계없이 조례로 지역에 필요한 지방세목을 신설할 수 있다.","지방재정조정제도에서 조정교부금제도는 상위지방자치단체가 하위지방자치단체에 지원하는 제도이다.","지방교부세는 재원의 사용 용도가 정해져 있지 않다.","부동산 경기변동은 지방재정의 규모와 안정성에 영향을 주게 된다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-19", subject:"재정학", year:2023, no:19, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"지방분권에 관한 설명으로 옳지 않은 것은?",
  choices:["지방분권의 정도를 간접적으로 파악할 수 있는 중앙집권화율은 중앙정부의 지출을 지방정부의 지출로 나누어 계산한다.","지방자치단체 간의 경쟁을 촉진하여 공공서비스의 효율적인 생산을 유도한다.","티부(C. Tiebout) 모형은 공공재 공급의 재원으로 재산세를 상정하고 있다.","중앙집권제도에 비해 공공재와 세금에 대한 정보확보비용이 증가하게 된다.","오우츠(W. Oates)에 의하면 공공재 공급비용이 동일하다면 지방공공재는 지방정부가 공급하는 것이 효율적이다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-20", subject:"재정학", year:2023, no:20, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"calc",
  stem:"소득세율이 소득구간에 따라 0원에서 1,200만원까지는 0%, 1,200만원 초과 3,000만원까지는 9%, 3,000만원 초과 5,000만원까지는 18%, 5,000만원 초과부터는 27%이다. K군의 총소득 5,500만원에서 각종 공제를 적용한 후 과세가능소득은 4,500만원이다. K군의 (A)한계세율과 (B)실효세율은? (단, 백분율(%)을 구할 때 소수점 셋째 자리에서 반올림한다.)",
  choices:["A: 9%, B: 7.85%","A: 9%, B: 9.60%","A: 18%, B: 7.85%","A: 18%, B: 9.60%","A: 27%, B: 9.60%"], answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-21", subject:"재정학", year:2023, no:21, law:"재정학", unit:"1편 재정학의 개요", kind:"calc",
  stem:"두 소비자 1과 2가 두 재화 x와 y를 소비하는 순수교환경제를 고려하자. 소비자 1의 부존은 (x̄₁,ȳ₁)=(18,12), 소비자 2의 부존은 (x̄₂,ȳ₂)=(22,8)이며, 소비자 i의 효용함수는 u^i(xᵢ,yᵢ)=xᵢyᵢ라고 하자(i=1,2). 다음의 배분 ((x₁,y₁),(x₂,y₂)) 중 파레토 개선이 가능하지 않은 것을 모두 고르면?\n\nㄱ. ((6,3),(34,17))\nㄴ. ((16,8),(22,11))\nㄷ. ((24,10),(16,10))\nㄹ. ((38,19),(2,1))",
  choices:["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"], answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-22", subject:"재정학", year:2023, no:22, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"두 사람으로 구성된 어느 경제의 효용가능경계와 사회후생함수 Wᴬ=U₁+U₂의 사회무차별곡선과의 접점을 A, 사회후생함수 Wᴮ=min{U₁,U₂}의 사회무차별곡선과의 접점을 B, 사회후생함수 Wᶜ=U₁U₂의 사회무차별곡선과의 접점을 C라고 하자. 이 접점들은 각 경우에 유일한 접점이라고 하자. 다음 중 옳은 것을 모두 고른 것은?\n\nㄱ. A와 B가 일치하면 C도 반드시 일치한다.\nㄴ. A와 C가 일치하면 B도 반드시 일치한다.\nㄷ. B와 C가 일치하면 A도 반드시 일치한다.\nㄹ. 세 접점이 모두 일치할 수는 없다.",
  choices:["ㄹ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"], answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-23", subject:"재정학", year:2023, no:23, law:"재정학", unit:"1편 재정학의 개요", kind:"concept",
  stem:"후생경제학의 기본 정리에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 제1정리는 완전경쟁시장에서 개인의 이기적인 선택의 결과가 사회적 관점에서도 효율적인 자원배분을 이루어낸다는 것을 의미한다.\nㄴ. 제2정리는 효율성이 공평한 자원배분을 보장한다는 의미를 갖는다.\nㄷ. 후생경제학의 제1정리와 제2정리의 결론은 소비자 선호의 볼록성과 무관하게 성립한다.",
  choices:["ㄱ","ㄴ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ"], answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-24", subject:"재정학", year:2023, no:24, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"긍정적 외부성이 있는 양봉업자가 생산하는 벌꿀에 대한 수요함수가 Q=10-2P이고, 외부한계편익함수는 Q=5-2P이다. 한계생산비용이 4라면 사회적 최적 생산량은?",
  choices:["2","3.5","4","5","10"], answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-25", subject:"재정학", year:2023, no:25, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"시장실패에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 시장실패는 정부개입의 충분조건이다.\nㄴ. 자연독점에 대한 평균비용가격설정은 독점으로 인한 비효율을 제거할 수 있다.\nㄷ. 정액세(lump-sum tax)는 민간부문의 의사결정을 왜곡하지 않는다.\nㄹ. 사회보험은 시장실패를 보완하는 기능을 수행한다.\nㅁ. 공공재는 배제성과 경합성의 특성으로 인하여 시장실패가 발생하게 된다.",
  choices:["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄷ, ㅁ","ㄹ, ㅁ"], answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-26", subject:"재정학", year:2023, no:26, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"공공재에 관한 설명으로 옳은 것은?",
  choices:["비경합성이 강한 공공재일수록 공공재가 주는 사회적 편익의 크기가 더 커진다.","현실에서 대부분의 공공재는 시장이 성립되지 못하는 순수공공재이다.","클럽재(club goods)는 배제성 적용이 불가능하다.","모든 공공재는 비배제성과 비경합성을 동시에 충족한다.","공공재의 소비자들은 자신의 선호를 정확하게 표출한다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-27", subject:"재정학", year:2023, no:27, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"9명의 투표자 중 A유형은 4명, B유형은 3명, C유형은 2명이며, 이들은 네 개의 대안 a,b,c,d를 놓고 선택하고자 한다. 각 유형의 대안에 대한 선호는 다음과 같다고 하자. 보다(Borda)투표제를 실시한다면, 어느 대안이 선택되겠는가? (단, 선호 조작은 없다고 가정한다.)\n\nA[4명]: a≻b≻c≻d\nB[3명]: b≻d≻a≻c\nC[2명]: c≻d≻b≻a",
  choices:["a","b","c","d","투표 결과를 특정할 수 없다."], answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-28", subject:"재정학", year:2023, no:28, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"다음 중 소득 분배상태가 완전 균등인 경우 그 값이 0인 경우를 모두 고른 것은?\n\nㄱ. 5분위분배율\nㄴ. 10분위분배율\nㄷ. 지니계수\nㄹ. 앳킨슨지수\nㅁ. 달튼지수",
  choices:["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄷ, ㄹ, ㅁ"], answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-29", subject:"재정학", year:2023, no:29, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"외부성에 관한 설명으로 옳지 않은 것은?",
  choices:["부정적 외부성이 있는 경우에 정부가 교정세를 부과하여도 효율적 자원배분을 이룰 수 없다.","연구기관의 연구개발 활동은 외부성의 특성을 가지고 있다.","코즈정리가 성립하려면 재산권이 명확하게 설정되어 있어야 한다.","어떤 행동이 상대가격의 변동을 가져와서 발생하는 외부성을 금전적 외부성이라 한다.","양봉업자가 인근 과수원의 생산에 영향을 준 것은 기술적 외부성에 해당한다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-30", subject:"재정학", year:2023, no:30, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"세 투표자 A,B,C가 세 가지 대안 a,b,c에 대하여 다음과 같은 선호를 가지고 있다고 할 때, 꽁도세 승자(Condorcet winner)는? (단, 선호 조작은 없다고 가정한다.)\n\nA: a≻b≻c\nB: b≻c≻a\nC: c≻b≻a",
  choices:["a","b","c","a, b, c","투표의 역설로 꽁도세 승자는 존재하지 않는다."], answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-31", subject:"재정학", year:2023, no:31, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"작은 섬나라 \"율도국\"에는 해안과 내륙지역에 각각 6명, 4명의 주민이 거주하고 있는데, 정부는 지진해일(Tsunami) 경보서비스를 제공하고 있다. 해안지역 주민의 개별수요함수는 Q=100-½P, 내륙지역 주민의 개별수요함수는 Q=50-⅓P로 표현된다. 경보서비스의 한계비용이 840일 때, 사회적으로 바람직한 경보서비스 수준과 해안과 내륙지역 주민 1명이 각각 부담해야 할 몫은? (단, Q는 경보서비스 수준, P는 주민 부담 몫이다.)",
  choices:["경보서비스 수준은 40, 해안지역 주민은 120, 내륙지역 주민은 30","경보서비스 수준은 40, 해안지역 주민은 126, 내륙지역 주민은 42","경보서비스 수준은 40, 해안지역 주민은 140, 내륙지역 주민은 0","경보서비스 수준은 50, 해안지역 주민은 60, 내륙지역 주민은 40","경보서비스 수준은 50, 해안지역 주민은 126, 내륙지역 주민은 42"],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-32", subject:"재정학", year:2023, no:32, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"최적 분배에 관한 설명으로 옳지 않은 것은?",
  choices:["공리주의적 견해에 의하면 바람직한 분배란 그 사회의 총체적 후생을 극대화할 수 있는 분배이어야 한다.","평등주의적 견해에 의하면 모든 사람에게 평등하게 분배하는 것이 정의롭다.","롤즈(J. Rawls)는 사회의 가장 가난한 사람의 후생을 극대화하도록 분배하는 것이 그 사회의 후생을 극대화하는 것이라 하였다.","자유주의적 견해에 의하면 정부의 간섭 없이 자유로운 시장의 힘에 의해 결정된 분배상태가 가장 바람직하다.","러너(A. Lerner)에 의하면 사람들의 효용함수가 서로 다르면 동등확률 하에서도 균등분배는 최적이 될 수 없다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-33", subject:"재정학", year:2023, no:33, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라의 사회보장제도 운영에 관한 설명으로 옳은 것은?",
  choices:["차상위계층이라 함은 소득이 최저생계비 130% 이하인 가구를 말한다.","기초연금제도 운영에 필요한 재원은 국민연금 보험료로 충당한다.","국민기초생활보장제도 수급자로서 급여를 받기 위해서는 부양의무자가 없거나 있어도 부양이 불가능하여야 하며, 자산조사 결과 최저생계비 이하이어야 한다.","사업장(직장)가입자의 모든 사회보험료는 고용주와 근로자가 각각 절반씩 분담한다.","건강보험제도 운영에 필요한 재원은 가입자 및 사용자로부터 징수한 보험료와 정부지원금으로 충당한다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-34", subject:"재정학", year:2023, no:34, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"현물보조에 관한 설명으로 옳지 않은 것은?",
  choices:["현물보조가 현금보조에 비하여 정책 목적 달성에 효율적이다.","현물보조 대상은 주로 해당 현물의 소비가 바람직하다고 생각하는 가치재들이다.","현물보조는 현금보조에 비하여 높은 행정비용과 운영비용을 수반한다.","생산에서 규모의 경제가 성립하는 재화는 현물보조가 더 효율적이다.","동일한 재정을 투입하는 경우 일반적으로 현물보조가 현금보조에 비하여 소비자 만족도가 높다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-35", subject:"재정학", year:2023, no:35, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라의 사회보험제도에 관한 설명으로 옳지 않은 것은?",
  choices:["우리나라에서 시행중인 사회보험은 연금보험, 건강보험, 산재보험, 고용보험, 노인장기요양보험으로 5가지이다.","사회보험제도의 도입으로 역선택을 방지할 수 있다.","우리나라 의료보장제도는 국민보건 서비스 방식이다.","사회보험제도의 운영에 필요한 재원 조달방식에는 적립방식과 부과방식의 두 가지가 있다.","국민연금은 현금급여, 건강보험은 현물급여가 원칙이다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-36", subject:"재정학", year:2023, no:36, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라의 연금보험제도에 관한 설명으로 옳지 않은 것은?",
  choices:["일반국민이 가입하는 국민연금과 공무원, 군인, 사립학교교직원이 가입하는 직역연금으로 구분된다.","국민연금은 기여원칙에 따른 적립방식을 채택하고 있으나 완전적립방식이 아니어서 세대 내 재분배효과뿐만 아니라 세대 간 재분배효과도 발생한다.","국민연금은 18세 이상 60세 미만으로 대한민국 국민이면 국외거주자도 가입할 수 있다.","국민연금의 연금급여에는 노령연금, 장애연금, 유족연금이 있다.","국민연금 보험료는 기준소득월액에 보험료율을 곱하여 산정한다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-37", subject:"재정학", year:2023, no:37, law:"재정학", unit:"7편 재정학의 기타주제", kind:"calc",
  stem:"한 국가의 민간소비(C), 조세(T), 정부지출(G), 투자(I)가 아래와 같고 재정은 균형상태이며 완전고용국민소득은 7,000이다. 정부지출과 조세를 통해서 국민소득을 조정하고자 할 경우에 관한 설명으로 옳지 않은 것은? (단, Y는 국민소득이다.)\n\nC=1,000+0.6(Y-T), G=1,000, I=1,000",
  choices:["완전고용 달성에 필요한 조세의 감소 규모는 600이다.","완전고용 달성에 필요한 정부지출의 증가액은 400이다.","정부지출 증가 시에 정부지출의 증가액보다 국민소득이 더 많이 증가한다.","조세 감세 시에 조세의 감세액보다 국민소득의 증가액이 더 크다.","경기침체 등으로 민간의 한계소비성향이 줄어들게 되면 정부지출이 유발하는 국민소득의 증가분은 줄어들게 된다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-38", subject:"재정학", year:2023, no:38, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"정부지출의 증가 원인에 관한 설명으로 옳은 것은?",
  choices:["바그너(A. Wagner)법칙에 의하면, 1인당 소비가 증가할 때 국민소득에서 차지하는 공공부문은 민간부문에 비례하여 성장한다.","보몰효과(Baumol effect)에 의하면, 정부가 생산·공급하는 서비스의 생산비용이 상대적으로 낮아지면 정부지출이 증가하게 된다.","부캐넌(J. Buchanan)은 현대의 대의민주체제가 본질적으로 정부부문의 팽창을 억제한다는 리바이어던가설(Leviathan hypothesis)을 제기하였다.","피코크-와이즈만(A. Peacock & J. Wiseman)에 의하면, 사회적 혼란기에는 전위효과(displacement effect)에 의하여 정부지출이 증가하게 된다.","브라운-잭슨(C. Brown & P. Jackson)에 의하면, 중위투표자의 공공서비스에 대한 수요의 소득탄력성이 줄어들게 되면 정부지출의 비중이 증가하게 된다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-39", subject:"재정학", year:2023, no:39, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공공사업의 비용-편익분석에 관한 설명으로 옳지 않은 것은?",
  choices:["사회적인 할인율이 높아질수록 초기에 편익이 집중되는 사업이 유리하다.","불완전경쟁시장에서는 재화의 시장가격이 기회비용을 적절히 반영하지 못하므로 잠재가격을 사용한다.","공공사업으로 시장가격이 낮아지는 경우라면 증가된 소비자잉여가 편익에 포함되어야 한다.","시장이자율이 사회적 할인율보다 높을 때 시장이자율을 할인율로 사용하면 공공사업의 경제성이 커질 수 있다.","공공사업에서 발생하는 무형의 편익에 대한 평가가 매우 힘든 경우 비용효과분석(cost-effectiveness analysis)을 이용할 수 있다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2023-40", subject:"재정학", year:2023, no:40, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"시장에서 거래되지 않는 재화(시간, 생명 등)의 가치평가에 관한 설명으로 옳지 않은 것은?",
  choices:["노동 자체로부터 만족을 얻는 사람의 시간가치는 임금률보다 더 높을 수 있다.","현재의 임금률로 더 일하고 싶어도 할 수 없는 사람의 시간가치는 임금률보다 더 높을 것이라 추정할 수 있다.","서로 다른 시간이 소요되는 교통수단에 지불되는 요금의 차이를 이용하여 시간의 가치를 추정할 수 있다.","사망 확률을 낮추기 위하여 지불할 용의가 있는 금액으로 생명의 가치를 평가하는 방법은 생명의 가치를 과소평가할 가능성이 있다.","사망에 따른 소득상실액으로 생명의 가치를 평가하는 방법은 노인이나 장애인의 생명가치를 적절히 평가하지 못하는 한계가 있다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-1", subject:"재정학", year:2024, no:1, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"바람직한 조세가 갖추어야 할 조건으로 옳지 않은 것은?",
  choices:["능력에 따른 조세부담이 이루어지는 공평성의 원칙","조세를 통한 재정수입을 극대화하는 수입성의 원칙","조세의 납부방법, 시기, 금액 등이 국민들이 이해할 수 있는 방식으로 제시되는 확실성의 원칙","조세의 납부방법이 납세자에게 가장 편리한 방식으로 이루어지는 편의성의 원칙","조세징수와 관련된 비용과 납세자의 경제활동에 주는 부담이 가장 적은 경제성의 원칙"],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-2", subject:"재정학", year:2024, no:2, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"조세의 공평성에 관한 설명으로 옳은 것은?",
  choices:["누진세의 도입은 2개 과세기간 이상의 평균소득이 동일한 개인사업자와 근로소득자 간의 수평적 공평성을 저해할 수 있다.","편익원칙에 따를 때, 누진세를 도입하는 경우 편익의 소득탄력성이 1보다 작으면 공평하다.","납세 전후로 개인 간 효용수준의 순위가 변하는 것이 바람직하다.","수평적 공평성의 개선을 위한 정책수단으로 포괄적 소득세는 바람직하지 않다.","소득세율의 누진성 강화는 납세자들 간의 수직적 공평성을 저해하게 된다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-3", subject:"재정학", year:2024, no:3, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"조세의 초과부담에 관한 설명으로 옳지 않은 것은?",
  choices:["수요의 가격탄력성이 클수록 초과부담은 커진다.","세율이 높아지면 초과부담이 늘어나고 조세수입도 늘어난다.","정액세(lump-sum tax) 부과는 초과부담을 발생시키지 않는다.","완전보완재인 두 재화 중 한 재화에 대한 과세는 초과부담을 발생시키지 않는다.","초과부담을 정확히 측정하려면 보상수요곡선을 이용해야 한다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-4", subject:"재정학", year:2024, no:4, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"단위당 일정액의 물품세를 부과할 때, 조세의 전가와 귀착에 관한 설명으로 옳은 것은?",
  choices:["수요가 탄력적일수록 정부의 조세 수입은 증가한다.","공급이 탄력적일수록 조세부과에 따른 후생손실은 커진다.","단위당 세액이 커지면 정부의 조세수입은 증가한다.","상대적으로 탄력성이 높은 쪽의 조세부담이 상대적으로 커진다.","수요가 완전비탄력적이면 생산자가 조세 전부를 부담한다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-5", subject:"재정학", year:2024, no:5, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"calc",
  stem:"커피우유의 수요함수와 공급함수가 각각 Qd=50-2P, Qs=3P-20이다. 정부가 단위당 10원의 물품세를 생산자에게 부과하는 경우, 다음 설명으로 옳지 않은 것은?",
  choices:["물품세 총액은 120원이다.","물품세 부과 전 균형가격은 14원, 균형거래량은 22이다.","물품세 부과 이후 균형가격은 20원, 균형거래량은 10이다.","소비자와 생산자 조세부담은 각각 단위당 6원과 4원이다.","사회적 후생손실은 60원이다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-6", subject:"재정학", year:2024, no:6, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"조세부과 시 납세자들의 공평한 조세부담의 평가기준으로 적합한 것은?\n\nㄱ. 능력원칙\nㄴ. 중립성 원칙\nㄷ. 효율성 원칙\nㄹ. 편익원칙\nㅁ. 최소징세비 원칙",
  choices:["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㅁ","ㄷ, ㅁ"], answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-7", subject:"재정학", year:2024, no:7, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"법인세와 소득세의 통합에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 자본이득방식(capital gains method) - 법인세를 폐지하고 실현여부와 관계없이 모든 자본이득에 소득세를 부과하는 방식으로 부분통합에 해당된다.\nㄴ. 조합방식(partnership method) - 배당이나 사내유보를 구분하지 않고 법인의 이윤을 모두 주주에게 귀속시켜 개인소득세로 부과하는 방식으로 완전통합에 해당된다.\nㄷ. 배당세액공제제도(dividend gross-up method) - 법인의 모든 이윤에 대해 법인세를 부과한 다음, 법인세 중 배당부분에 해당하는 금액을 개인소득세에서 세액공제해주는 방식으로 완전통합에 해당된다.\nㄹ. 차등세율제도(split rate system) - 법인의 이윤 중 배당금으로 지급되는 부분에 대해서는 사내유보가 되는 부분보다 더 낮은 법인세율을 적용해주는 방식으로 부분통합에 해당된다.",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"], answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-8", subject:"재정학", year:2024, no:8, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"소득세에 관한 설명으로 옳은 것은?",
  choices:["현재소비가 정상재인 경우에 이자소득세의 부과에 의한 소득효과는 저축의욕을 줄어들게 한다.","비례소득세는 조세부담의 수직적 공평성을 향상시킨다.","선형누진세는 소득의 증가에 따라서 평균세율은 올라가지만 한계세율은 변화하지 않는다.","소득공제는 조세의 부담에 있어서 저소득층이 고소득층에 비해 유리하다.","세액공제의 도입은 한계세율의 증가를 초래하게 된다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-9", subject:"재정학", year:2024, no:9, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"우리나라의 법인세와 부가가치세에 관한 설명으로 옳은 것은?",
  choices:["부가가치세는 조세부담이 누진적이다.","수출품의 부가가치세 부담은 국내 판매용 제품과 동일하다.","기업의 부채비중을 높이는 것이 법인세 절감에 유리하다.","기업이 자본재 구입 시에 투자세액공제를 적용하면 법인세 부담이 증가한다.","법인세는 법인의 자산을 과세대상으로 한다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-10", subject:"재정학", year:2024, no:10, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"알링햄-샌드모(M. Allingham and A. Sandmo)의 탈세모형에 관한 설명으로 옳지 않은 것은?",
  choices:["불확실성 하의 기대효용 극대화 관점에서 탈세 행위를 분석하고 있다.","납세자가 절대위험기피도 체감의 특성을 가진다고 가정한다.","세율 상승이 소득효과와 대체효과를 발생시켜 탈루소득을 더 크게 만든다고 분석하였다.","세율을 합리적인 수준으로 유지하고 감사의 확률이나 벌금률 조정을 탈세 방지의 수단으로 활용하는 것이 더 바람직하다.","행정비용을 절약한다는 측면에서 감사의 확률보다 벌금률을 높이는 것이 더 바람직한 탈세방지 수단이다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-11", subject:"재정학", year:2024, no:11, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"우리나라 조세 중 목적세가 아닌 것은?",
  choices:["담배소비세","지방교육세","지역자원시설세","농어촌특별세","교통·에너지·환경세"], answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-12", subject:"재정학", year:2024, no:12, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"시점간(inter-temporal) 소비선택 모형을 이용하여 이자소득세 부과가 개별 소비자에게 미치는 영향으로 옳은 설명을 모두 고른 것은? (단, 무차별곡선은 원점에 대해 강볼록하며, 미래소득은 영(0)이다. 그리고 현재소비와 미래소비 모두 정상재이다.)\n\nㄱ. 미래소비로 표시한 현재소비의 상대가격이 하락한다.\nㄴ. 대체효과에 의해 현재소비가 증가하므로 저축은 감소한다.\nㄷ. 소득효과에 의해 현재소비가 감소하고 미래소비도 감소한다.\nㄹ. 실질소득이 감소하므로 효용수준은 감소한다.",
  choices:["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"], answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-13", subject:"재정학", year:2024, no:13, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"calc",
  stem:"하루 T̄(T̄≤24)시간을 노동(H)과 여가(L)에 배분하는 근로자의 근로소득은 M, 시간당 임금률은 w이다. 세율 t의 근로소득세가 부과될 경우 다음 설명으로 옳지 않은 것은? (단, 근로소득 이외의 여타 소득은 없다고 가정한다. 그래프의 가로축은 여가이고 세로축은 근로소득이다.)",
  choices:["세금 부과 전의 예산선은 M=w(T̄-L)이다.","세금 부과 후 예산선의 세로축 절편은 (1-t)wT̄이다.","여가가 정상재라면, 노동공급은 증가, 감소 또는 불변일 수 있다.","여가가 정상재라면, 대체효과가 소득효과보다 클 경우 노동공급은 증가한다.","여가가 열등재라면, 대체효과와 소득효과 모두 노동공급을 감소시킨다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-14", subject:"재정학", year:2024, no:14, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"조세와 기업의 투자에 관한 설명으로 옳지 않은 것은?",
  choices:["자본의 사용자비용은 기업이 자본재를 보유하고 사용하는 데 소요되는 기회비용으로 해석할 수 있다.","가속감가상각을 채택하면 자본의 사용자비용을 낮춰 투자가 증가한다.","자본스톡의 사용자비용탄력성이 작을수록 조세제도상 투자 유인책의 효과는 커진다.","한계적인 투자계획에서 나오는 세전 실질수익률과 이 투자계획의 재원을 제공한 저축자에게 지급되는 세후 실질수익률이 같으면 한계실효세율은 영(0)이 된다.","한계실효세율이 높을수록 투자가 위축된다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-15", subject:"재정학", year:2024, no:15, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"정부지출 증대를 위한 국채발행이 경제에 미치는 영향으로 옳지 않은 것은?",
  choices:["통화주의자는 경기 침체기보다 호황기에 구축효과가 더 크게 발생한다고 주장한다.","국채발행으로 이자율이 상승하는데, 이로 인해 자본유입이 발생하면 환율이 평가절하되어 경상수지가 개선된다.","국채가 전액 시중에서 소화될 경우, 민간투자가 위축되는 구축효과가 발생한다.","중앙은행이 국채를 인수하면 통화량이 증가하여 인플레이션이 유발된다.","중앙은행이 국채를 인수하면 시중에서 소화되는 경우보다 총수요 증대효과가 더 크다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-16", subject:"재정학", year:2024, no:16, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공공요금이론에 관한 설명으로 옳은 것은?",
  choices:["수요가 가격에 대해 비탄력적인 필수품에 대한 램지가격설정은 분배 측면에서 문제를 일으킬 수 있다.","시설용량에 제한이 있는 시설에 초과수요가 발생하는 경우 한계비용에서 경제적 지대를 차감한 수준에서 가격을 결정해야 효율적이다.","공공요금은 소비과정에서의 효율성은 높여주나 생산과정에서의 효율성 개선과는 무관하다.","공평성의 관점에서 보면 능력원칙에 입각하여 요금을 부과해야 한다.","규모의 경제가 존재하는 경우 평균비용가격설정은 사회적 최적수준에 비해 과대생산을 유발한다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-17", subject:"재정학", year:2024, no:17, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"중앙정부가 지방재정조정제도를 통해서 지방정부에 재원을 이전하는 교부금의 유형별 경제적 효과에 관한 설명으로 옳은 것은? (단, 공공재와 사용재는 정상재이며, 지역주민들의 무차별곡선은 원점에 대해 강볼록함을 가정한다.)",
  choices:["조건부 비대응교부금의 경우에는 지역주민들의 공공재 소비와 후생수준이 증가하게 된다.","무조건부 교부금의 경우에는 지역주민들의 소득감소와 조세부담의 증가를 가져오게 된다.","지역주민들의 공공재 소비규모와 후생수준은 교부금의 유형과 관련이 없다.","무조건부 교부금의 경우에는 소득효과로 지역주민들의 공공재의 소비를 증가시키지만 사용재의 소비는 감소하게 된다.","조건부 대응교부금의 경우에는 소득효과와 대체효과에 의해서 지역주민들의 공공재의 소비 증가 여부를 알 수 없다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-18", subject:"재정학", year:2024, no:18, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"지방분권에 관한 설명으로 옳지 않은 것은?",
  choices:["티부(C. Tiebout)모형은 지방정부에 필요한 재원으로 재산세를 상정하고 있다.","분권화로 지역들의 특성이 차별화되고 주민들이 자신들이 원하는 지역으로의 이동이 자유로워지면 주민들의 후생이 증가할 수 있다.","어떤 한 지역의 공공재 공급이 다른 지역에 경제적 영향을 주는 외부성이 있는 경우에는 공공재 공급에 비효율성이 발생할 수 있다.","국방이나 우편서비스 등은 외부성과 규모의 경제 등으로 중앙정부에서 공급하는 것이 효율적이다.","지방정부가 보조금을 받아서 공공재를 공급하는 경우에는 중앙집권화의 정도가 과대평가된다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-19", subject:"재정학", year:2024, no:19, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"우리나라 지방교부세와 국고보조금에 관한 설명으로 옳은 것은?",
  choices:["지방교부세는 대응교부금이다.","국고보조금은 무조건부 교부금이다.","국고보조금은 지방정부의 자체재원이다.","지방정부의 자율적인 재정운영을 위해서는 지방교부세가 국고보조금보다 바람직하다.","지방교부세와 국고보조금은 지방정부의 재정자립도를 개선하는 효과가 있다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-20", subject:"재정학", year:2024, no:20, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"재정이론에 관한 설명으로 옳지 않은 것은?",
  choices:["중상주의 시대의 재정이론은 조세부과의 정당성, 조세수입의 원천 등 조세수입과 관련된 논의가 중심이었다.","아담스미스(A. Smith)에 의하면 가격기구에 의한 효율적인 자원배분이 가능하므로 재정의 역할은 치안, 국방 등 최소한에 머무는 것이 바람직하다.","바그너(A. Wagner)는 조세부과에 있어서 재정수입확보 기능뿐만 아니라 누진세율의 적용 등으로 분배과정의 불평등을 시정하는 사회정책적인 과세원리를 강조하였다.","집단의사결정에 관한 공공선택이론과 공공재의 최적공급에 관한 이론은 빅셀(K. Wicksell)과 파레토(V. Pareto) 등의 학자들에 의해서 제시되었다.","케인즈(J. M. Keynes)가 제시한 최적조세이론은 조세수입을 극대화하는 조세구조에 관한 이론이다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-21", subject:"재정학", year:2024, no:21, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"재정의 기능에 관한 설명으로 옳지 않은 것은?",
  choices:["재정의 자원배분기능으로 자원배분의 효율성이 개선될 수 있다.","시차문제에 있어서 재량적 재정정책(discretionary fiscal policy)이 자동안정장치(built-in stabilizer)에 비해 나은 정책수단이다.","자동안정장치의 정책수단으로는 실업보험제도와 소득세의 누진세제도 등이 있다.","정부가 재정으로 개입할 수 있는 시장실패의 유형으로는 공공재, 외부성 등이 있다.","소득분배를 위한 재정투입으로 소득계층 간 수평적 공평과 수직적 공평을 개선할 수 있다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-22", subject:"재정학", year:2024, no:22, law:"재정학", unit:"1편 재정학의 개요", kind:"calc",
  stem:"x재와 y재를 소비하는 2인 순수교환경제를 고려하자. 소비자 i의 효용함수는 uᵢ(xᵢ,yᵢ)=xᵢyᵢ이며(i=1,2), 소비자 1의 초기부존은 (x̄₁,ȳ₁)=(0,20), 소비자 2의 초기부존은 (x̄₂,ȳ₂)=(40,10)이다. 일반균형배분 ((20,15),(20,15))에 도달하기 위하여 초기부존을 재배분한다고 할 때 새로운 초기부존 ((x̄₁,ȳ₁),(x̄₂,ȳ₂))으로 적절한 것은?",
  choices:["((10,16),(30,14))","((12,20),(28,10))","((14,16),(26,14))","((16,18),(24,12))","((28,9),(12,22))"], answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-23", subject:"재정학", year:2024, no:23, law:"재정학", unit:"1편 재정학의 개요", kind:"calc",
  stem:"노동(L)과 자본(K)으로 x재와 y재를 생산하는 어느 경제의 생산가능곡선상의 한 점 (x,y)에서 한계변환율은 MRTxy(x,y)=1이며, 두 소비자 1과 2의 한계대체율이 MRS¹(x₁,y₁)=MRS²(x₂,y₂)=2인 상황을 고려하자(이 때 x₁+x₂=x, y₁+y₂=y이다). 현재 상황에 대한 옳은 설명을 모두 고른 것은?\n\nㄱ. 이 경제의 현재 상황에서 생산 측면의 효율성은 만족된다.\nㄴ. 이 경제의 현재 상황에서 소비 측면의 효율성은 만족된다.\nㄷ. 이 경제는 현재 상황에서 경제 전체적으로 생산과 소비의 종합적인 파레토 개선이 가능하다.",
  choices:["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"], answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-24", subject:"재정학", year:2024, no:24, law:"재정학", unit:"3편 공공지출이론", kind:"calc",
  stem:"두 재화 x재와 y재를 소비하는 소비자의 무차별곡선은 원점에 대해 강볼록하다. 이 소비자의 소득은 60이며, 각 재화의 가격은 px=2, py=3이라 하자. 이 소비자가 y재만 5단위를 살 수 있는 상품권을 받을 때와 해당 금액을 현금으로 받을 때의 효용을 비교하고자 한다. 이에 관한 설명으로 옳은 것은? (단, 소비점 (x,y)에서 이 소비자의 한계대체율은 MRS(x,y)로 나타내기로 한다.)",
  choices:["상품권을 받을 때 효용수준이 반드시 더 높다.","현금으로 받을 때 효용수준이 반드시 더 높다.","가격이 달라지면, 상품권을 받을 때 더 높은 효용을 얻을 수 있다.","MRS(30,5)=1이면, 현금으로 받을 때 반드시 더 높은 효용을 얻는다.","MRS(30,5)=0.5이면, 상품권으로 받을 때 반드시 더 높은 효용을 얻는다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-25", subject:"재정학", year:2024, no:25, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"역선택 문제를 완화시키는 방안으로 옳지 않은 것은?",
  choices:["카페 주인이 카페에 설치된 CCTV를 확인하여 아르바이트 직원의 업무 태도를 감시한다.","회사가 신규채용 지원자에게 대학 졸업장 제출을 요구한다.","모든 차량에 대하여 자동차 책임보험의 가입을 강제한다.","신규채용 지원자가 해당 업무의 자격증을 획득하여 해당 회사에 제출한다.","중고차 거래 시 판매자가 구매자에게 중고차에 대한 품질보증을 제공한다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-26", subject:"재정학", year:2024, no:26, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"공공재에 대한 두 소비자 1과 2의 수요함수는 각각 P₁=50-Q와 P₂=40-⅔Q(단, Q는 공공재 수량)이다. 공공재 한 단위의 생산비는 60으로 일정하다고 하자. 효율적인 공공재 조달을 위한 두 소비자의 부담(P₁과 P₂)은 각각 얼마인가?",
  choices:["P₁=30, P₂=30","P₁=32, P₂=28","P₁=35, P₂=25","P₁=38, P₂=22","P₁=40, P₂=20"], answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-27", subject:"재정학", year:2024, no:27, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"좁은 골목에서 서로 마주보고 있는 두 집에 각각 살고 있는 A와 B가 골목에 가로등을 설치하는 문제를 고려하고 있다. 가로등이 설치되면 두 사람이 얻는 편익은 각각 30으로 알려져 있으며, 가로등의 설치비용은 50이다. 각 사람은 설치에 대해 찬성(Yes) 또는 반대(No)를 선택할 수 있다. 두 사람 모두 찬성하면 설치비용을 반반씩 부담하고, 한 사람만 찬성하면 찬성한 사람만 설치비용을 부담한다. 둘 다 반대하면 가로등은 설치되지 않으며 이 때의 편익은 각각 영(0)이다. 이 문제를 전략형 게임(strategic game)의 관점에서 분석할 때, 다음 설명 중 옳은 것은?",
  choices:["서로 찬성하는 것이 우월전략균형이다.","서로 찬성하는 것이 우월전략균형은 아니지만 내쉬균형이다.","무임승차문제로 인해 이 게임의 내쉬균형은 존재하지 않는다.","이 문제는 치킨 게임이므로 누군가 한 사람만 찬성하는 것이 내쉬균형이다.","서로 반대하는 것이 유일한 내쉬균형이다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-28", subject:"재정학", year:2024, no:28, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"투표자 A, B, C가 꽁도세(Condorcet) 방식에 따라 다수결로 세 개의 대안 a, b, c 중 하나를 선택하는 문제를 다음 두 가지 사례에 각각 적용한다고 할 때, 다음 설명 중 옳은 것은? (단, 선호 조작은 없다고 가정한다.)\n\n사례 1: A: c≻b≻a, B: b≻a≻c, C: b≻c≻a\n사례 2: A: a≻c≻b, B: b≻c≻a, C: c≻a≻b",
  choices:["두 사례 모두에서 투표의 역설 현상이 나타난다.","사례 1에서는 투표의 역설 현상이 나타나지 않으나, 사례 2에서는 나타난다.","사례 1에서는 투표의 역설 현상이 나타나지만, 사례 2에서는 나타나지 않는다.","꽁도세 승자는 사례 1에서는 c이며, 사례 2에서는 a이다.","꽁도세 승자는 사례 1에서는 b이며, 사례 2에서는 c이다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-29", subject:"재정학", year:2024, no:29, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"외부성이 있는 시장에서 사적한계편익은 PMB=150-Q, 외부한계편익은 EMB=30-¼Q이며, 사적한계비용이 PMC=Q이라고 하자. 이 시장의 과소생산 문제를 해결하기 위하여 정부가 생산자에게 단위당 s의 보조금을 지급한다면 s는 얼마인가? (단, Q는 수량이다.)",
  choices:["8","9","10","11","12"], answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-30", subject:"재정학", year:2024, no:30, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"목장 주인이 방목하는 소들이 이웃 농부의 농작물을 뜯어 먹는 상황을 고려하자. 농작물 피해액은 500만원이며, 소가 농작물에 접근하지 못하도록 목장과 농장 사이에 울타리를 설치하는 비용은 600만원이다. 이 상황과 관련하여 코즈정리(Coase theorem)에서 시사하는 민간의 자발적 해결책에 관한 설명으로 옳은 것은?",
  choices:["목장 주인에게 소를 방목할 수 있는 권리가 주어진다면, 농부가 울타리를 설치하게 된다.","농부에게 재산권이 주어진다면, 목장 주인은 울타리를 설치하게 된다.","해당 권리가 누구에게 주어지든 울타리가 설치된다.","해당 권리가 누구에게 주어지든 울타리는 설치되지 않는다.","농부에게 재산권이 주어진다면, 목장 주인은 농부에게 500만원을 피해보상하고 울타리를 설치하게 된다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-31", subject:"재정학", year:2024, no:31, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"사회 A, B, C는 모두 두 사람으로 구성되어 있으며 개인 1의 소득(Y₁)이 개인 2의 소득(Y₂)의 4배이다. 사회후생함수가 각각 SWA=Y₁+Y₂, SWB=min{Y₁,Y₂}, SWC=Y₁^(1/2)Y₂^(1/2)이라고 할 때, 다음 설명 중 옳지 않은 것은?",
  choices:["사회 B의 앳킨슨지수는 사회 A보다 높다.","사회 C의 앳킨슨지수는 사회 A보다 높다.","사회 B의 앳킨슨지수는 사회 C보다 높다.","균등분배대등소득은 사회 C가 가장 크다.","앳킨슨지수로 판단할 때 가장 불균등한 분배가 이루어지고 있는 사회는 B이다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-32", subject:"재정학", year:2024, no:32, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"소득 분배에 관한 설명으로 옳지 않은 것은?",
  choices:["평등주의적 견해에 따르면 개인의 정당한 권리가 침해될 가능성이 있다.","공리주의적 견해에 따르면 불균등한 분배상태를 정당화시켜 줄 수도 있다.","롤스(J. Rawls)의 견해에 따르면 다른 사람들의 자유와 양립할 수 있는 한에서의 자유에 대한 동등한 권리가 최소극대화원칙보다 우선시된다.","러너(A. Lerner)의 동등확률 가정에 따르면 사람들의 효용함수가 서로 달라도 균등분배가 최적이다.","노직(R. Nozick)의 견해에 따르면 균등한 분배가 실현된다면 절차의 정당성은 무시될 수 있다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-33", subject:"재정학", year:2024, no:33, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"앳킨슨지수에 관한 설명으로 옳지 않은 것은?",
  choices:["1에 가까울수록 분배상태가 불균등함을 의미한다.","분배의 불평등성에 대한 명백한 가치판단을 전제로 한다.","공리주의 사회후생함수의 경우 균등분배대등소득이 평균소득보다 작다.","소득분배가 완전히 균등하다면 균등분배대등소득과 평균소득이 일치한다.","동일한 분배상태라도 사회후생함수에 따라 지수의 크기는 달라질 수 있다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-34", subject:"재정학", year:2024, no:34, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"정부가 저소득층을 위해 다양한 유형의 보조금을 지원할 수 있다. 보조금 유형에 관한 설명으로 옳은 것을 모두 고른 것은? (단, 무차별곡선은 원점에 대해 강볼록한 형태이다.)\n\nㄱ. 정책 목표가 해당 현물의 소비 증대라면 현금보조보다 현물보조가 더 효과적이다.\nㄴ. 수혜자의 선호를 존중한다면 현물보조보다 현금보조가 더 효과적이다.\nㄷ. 현물보조보다 현금보조의 경우 더 높은 행정 및 운영비용이 발생한다.\nㄹ. 가격보조가 비효율성을 일으키는 원인은 상대가격구조가 변하기 때문이다.\nㅁ. 현금보조의 단점은 부정수급과 바람직하지 않은 상품의 오남용이다.",
  choices:["ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ, ㅁ"], answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-35", subject:"재정학", year:2024, no:35, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라의 근로장려세제에 관한 설명으로 옳은 것은?",
  choices:["기초생활보장제도의 수혜대상이 되는 무소득자의 생계안정과 근로유인 제공을 위한 제도이다.","가구의 구성원에 관계없이 동일한 지원혜택을 운영하고 있다.","기초생활보장제도와 같은 공공부조 프로그램보다 근로의욕 촉진효과가 더 크다.","근로소득이 증가함에 따라 근로장려금이 감소하는 점감구간에서의 대체효과는 노동공급을 증가시키는 방향으로 작용한다.","암묵적 한계세율이 영(0)인 구간에서는 대체효과가 소득효과보다 크다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-36", subject:"재정학", year:2024, no:36, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"부의 소득세제(negative income tax)에 관한 설명으로 옳은 것을 모두 고른 것은? (단, y=a+(1-t)x, a: 보조금, y: 기초수당, t: 한계세율, x: 스스로 번 소득)\n\nㄱ. 재원이 고정되어 있는 상황에서 기초수당을 올리려면 한계세율도 올려야 한다.\nㄴ. 비범주적(noncategorical) 보조금이므로 수혜 대상에 대한 자격심사가 필요 없다.\nㄷ. 소득의 재분배 효과는 한계세율이 낮을수록 커진다.\nㄹ. 한계세율이 높을수록 근로의욕은 낮아진다.\nㅁ. 여가가 정상재일 경우 소득효과와 대체효과 모두 노동공급을 감소시키는 방향으로 작용한다.",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ, ㅁ"], answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-37", subject:"재정학", year:2024, no:37, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"국민연금제도에 관한 설명으로 옳지 않은 것은?",
  choices:["민간 보험시장에서 발생하는 역선택 문제를 해소할 수 있다.","재원을 적립방식으로 충당하면 세대 간 공평성 문제가 발생한다.","자산대체효과가 은퇴효과보다 작다면 개인 저축이 증가한다.","국민연금에 의한 소득효과는 노동공급을 감소시킨다.","세대 내의 재분배 문제는 재원조달방식과 무관하다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-38", subject:"재정학", year:2024, no:38, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라 국민건강보험제도에 관한 설명으로 옳지 않은 것은?",
  choices:["정부의 개입 정도가 국민보건서비스방식보다 강하다.","공동보험은 의료서비스 소비에서 발생하는 도덕적 해이를 부분적으로 제거할 수 있다.","강제보험이므로 민간보험시장에서 발생하는 역선택 문제를 해소할 수 있다.","넓은 의미에서 사회보험방식에 기초하고 있다.","조세제도에서 의료비지출에 세액공제를 적용하는 것은 공평성과 관련이 있다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-39", subject:"재정학", year:2024, no:39, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"정부지출에 관한 설명으로 옳지 않은 것은?",
  choices:["보몰효과(Baumol effect)에 의하면 정부가 생산·공급하는 서비스의 생산비용이 상대적으로 빠르게 증가하여 정부지출이 늘어나게 된다.","피코크-와이즈만(A. Peacock and J. Wiseman)에 의하면 사회적 혼란기에는 정부지출의 증가를 용인하는 분위기에 의해서 정부지출이 증가하게 된다.","경기침체 등으로 민간의 한계소비성향이 줄어들게 되면 정부지출에 의한 국민소득 증가의 크기는 줄어들게 된다.","민간의 한계소비성향이 1보다 작은 경우에는 정부지출 증가에 의한 국민소득의 증가분이 정부지출의 증가분보다 크게 된다.","브라운-잭슨(C. Brown and P. Jackson)은 중위투표자의 공공서비스에 대한 소득탄력성이 크게 되면 정부지출이 증가한다는 리바이어던가설(Leviathan hypothesis)을 제기하였다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2024-40", subject:"재정학", year:2024, no:40, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공공사업의 비용-편익 분석에 관한 설명으로 옳지 않은 것은?",
  choices:["무형적인 편익과 비용도 분석과정에서 모두 고려되어야 한다.","사회적 할인율이 높아질수록 사업 초기에 편익이 집중된 사업이 유리해진다.","사업기간이 긴 사업의 경우 나중에 발생하는 편익을 적절하게 평가하기 위해 낮은 할인율을 적용해야 한다.","조세가 부과된 제품을 사업의 투입물로 사용하는 경우 이 조세를 비용 계산 시 제외해야 한다.","공공투자로 인해 발생하는 위험이 다수의 사람들에게 분할될 경우에는 위험에 대한 고려를 할 필요가 없다."],
  answer:[1,2,3,4,5], status:"note", note:"⚠️ 전항정답(복수정답) 문제입니다 — 출제 오류가 인정되어 공식적으로 5개 선택지 모두 정답 처리됐습니다. 2026년 개정 영향은 없음." },
{ id:"jj2025-1", subject:"재정학", year:2025, no:1, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"바람직한 조세가 갖추어야 할 원칙에 관한 내용이다. 어느 원칙에 해당되는가?\n\n조세의 납부방법, 시기, 금액 등이 정해진 법률과 규정에 따라 국민들이 이해할 수 있는 방식으로 제시되어야 한다.",
  choices:["확실성의 원칙","공평성의 원칙","경제성의 원칙","중립성의 원칙","신축성의 원칙"], answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-2", subject:"재정학", year:2025, no:2, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"공평과세의 원칙에 관한 설명으로 옳은 것은?",
  choices:["능력원칙에 의하면 아파트 가격이 올랐다면 재산세를 더 많이 부담해야 한다.","능력원칙은 빅셀(K. Wicksell)이 제시한 동등희생의 원칙이라는 재정이론에 그 근거가 있다.","편익원칙에 따르면 상이한 경제적 능력을 가진 사람에게는 서로 다른 크기의 조세를 부과해야 한다.","능력원칙에 따른 과세의 예로 통행료, 사용료 및 수수료가 해당된다.","편익원칙은 밀(J. S. Mill)이 제공한 자발적 교환의 재정이론에서 이념적 기초를 찾을 수 있다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-3", subject:"재정학", year:2025, no:3, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"우리나라 조세에 관한 설명으로 옳지 않은 것은?",
  choices:["목적세는 특정분야 사업재원의 안정적인 확보에 기여한다.","지방세이면서 목적세로는 지방교육세가 있다.","국세이면서 목적세로는 농어촌특별세가 있다.","직접세로는 법인세가 있으며 간접세로는 부가가치세가 있다.","간접세가 직접세에 비해서 소득분배의 개선에 유리하다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-4", subject:"재정학", year:2025, no:4, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"초과부담에 관한 설명으로 옳지 않은 것은?",
  choices:["물품세 부과 시 초과부담은 한계대체율(MRS)과 한계생산변환율(MRT)이 달라 효율적인 자원배분의 조건이 충족되지 않아서 발생한다.","물품세 부과로 인한 초과부담은 소비자 지불가격과 생산자 수취가격이 달라지기 때문에 발생한다.","조세부과로 인한 초과부담은 상대가격의 변화로 인한 소득효과와 대체효과가 서로 반대방향으로 작용하게 되면 발생하지 않는다.","램지규칙에 의하면 과세로 인한 초과부담을 최소화하기 위해서는 재화 간 조세수입의 한계초과부담이 일치하도록 세율을 정해야 한다.","초과부담은 과세로 인한 소비자와 생산자의 후생감소분에서 조세수입을 차감해서 구할 수 있다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-5", subject:"재정학", year:2025, no:5, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"calc",
  stem:"어떤 재화의 한계비용은 50이고, 보상수요곡선은 P=100-Q이다. 재화의 공급자에게 단위당 20의 조세를 부과하였을 때, 다음 설명으로 옳지 않은 것은? (단, P는 가격, Q는 수량이다.)",
  choices:["조세수입은 600이다.","비효율성계수는 3/4이다.","소비자잉여의 감소는 800이다.","과세로 인한 공급자의 판매량 감소는 20이다.","과세로 조세부담은 소비자에게 전가된다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-6", subject:"재정학", year:2025, no:6, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"다음에서 설명하는 조세귀착은?\n\n조세 그 자체만의 분배적 효과를 보는 가장 좋은 방법은 한 종류의 조세를 동일한 조세수입을 가져다주는 다른 종류의 조세로 대체했을 때 어떤 분배효과가 나오는가를 보는 것이다.",
  choices:["전방전가 조세귀착","후방전가 조세귀착","균형예산 조세귀착","차별적 조세귀착","절대적 조세귀착"], answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-7", subject:"재정학", year:2025, no:7, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"우리나라의 부가가치세와 법인세에 관한 설명으로 옳은 것은?",
  choices:["수출품에 대한 부가가치세 영세율은 매출액에 대한 부가가치세가 없다는 의미이므로 매입세액공제를 하지 않는다.","부가가치세는 생산단계마다 추가된 부가가치에 대해서만 과세하므로 수직적 통합을 촉진하는 효과가 있다.","부가가치세 면세대상 상품의 경우에는 중간단계에서 납부한 매입세액을 공제하지 않는다.","경제적 이윤에 대한 법인세과세방식은 기업의 생산결정을 왜곡하게 된다.","타인자본에 대해서만 이자비용공제를 허용하는 법인세는 투자재원조달방식의 왜곡을 가져오지 않는다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-8", subject:"재정학", year:2025, no:8, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"알링햄-샌드모(M. Allingham and A. Sandmo)의 탈세모형에 관한 설명으로 옳지 않은 것은?",
  choices:["절대위험기피도 체감의 특성을 가진 개인은 세율이 올라 순소득이 줄어들면 위험부담의 크기를 줄여서 탈루소득의 크기를 줄인다.","세율인상에 따른 대체효과는 탈루소득의 한계편익이 줄어들기 때문에 탈루소득을 줄이는 방향으로 작용한다.","감사받을 확률과 벌금율의 증가는 탈루소득을 감소시킨다.","세율 상승에 따른 소득효과와 대체효과는 서로 반대 방향으로 작용하기 때문에 탈루소득의 변화 방향을 알 수 없다.","납세자가 절대위험기피도 체감의 특성을 가진다고 가정한다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-9", subject:"재정학", year:2025, no:9, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"소득세에 관한 설명으로 옳은 것은?",
  choices:["헤이그-사이먼즈(Haig-Simons)의 포괄소득세제는 능력원칙에 기반한 과세방식이다.","여가가 정상재일 때, 근로소득세의 부과에 따른 노동공급은 대체효과에 의해서 증가한다.","소득의 증가에 따라서 평균세율이 한계세율보다 클수록 누진성이 증가하게 된다.","소득공제는 세액공제보다 한계세율이 낮은 저소득층에 유리하다.","헤이그-사이먼즈의 포괄적 소득 정의에 의하면, 개인의 경제적 능력의 증가는 소득으로 실현된 경우에만 소득세의 과세 대상이 된다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-10", subject:"재정학", year:2025, no:10, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"이자소득세 부과의 효과로 옳지 않은 것은? (단, 현재소비와 미래소비는 모두 정상재이다.)",
  choices:["국민저축은 그 변화를 알 수 없다.","현재소비에 미치는 영향은 소득효과와 대체효과의 상대적인 크기에 의해 결정된다.","소득효과에 의해 현재소비가 감소한다.","이자소득세의 부과에 의한 소득효과는 저축의욕을 줄어들게 한다.","현재소비는 대체효과에 의해 증가하고 소득효과에 의해 감소한다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-11", subject:"재정학", year:2025, no:11, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"조세와 기업의 투자에 관한 설명으로 옳지 않은 것은?",
  choices:["신고전파 투자이론에 의하면 자본의 사용자비용이 적을수록 투자가 증가한다.","자본스톡의 사용자비용탄력성이 작을수록 조세정책이 기업의 투자에 미치는 영향이 작다.","신고전파 투자이론에서 자본재 구입비용은 즉시 비용처리하고, 지급이자에 대한 비용공제를 허용하지 않는 경우 법인세는 투자에 중립적이다.","한계실효세율이 음(-)이면 조세의 존재가 투자를 촉진하는 결과를 가져온다.","부채를 통한 투자의 경우 한계실효세율이 음(-)의 값을 갖는 것은 현행 조세제도가 부채의존도를 줄이는 효과를 갖는다는 뜻이다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-12", subject:"재정학", year:2025, no:12, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"정부지출 증대를 위한 국채발행이 경제에 미치는 영향으로 옳은 것을 모두 고른 것은?\n\nㄱ. 국채가 전액 시중에서 소화될 경우, 이자율이 상승하고 민간투자가 억제되는 현상을 구축효과라고 한다.\nㄴ. 통화주의자는 호황기보다 경기 침체기에 구축효과가 더 크게 발생한다고 주장한다.\nㄷ. 중앙은행이 국채를 인수하면 통화량이 증가하여 인플레이션이 유발된다.\nㄹ. 중앙은행이 국채를 인수하면 시중에서 소화되는 경우보다 총수요 증대효과가 더 크다.",
  choices:["ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"], answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-13", subject:"재정학", year:2025, no:13, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"위험자산에 대한 투자에서 투자의 안전성이 정상재이고, 투자자의 위험부담행위의 소득탄력성이 0보다 작으면, 수익에 대한 비례소득세 부과가 투자자의 자산구성에 미치는 효과에 관한 설명으로 옳은 것은?",
  choices:["완전손실보상제도가 있는 경우, 위험자산의 비중은 작아진다.","완전손실보상제도 하에 정부의 위험부담 비용이 민간부문과 같다면, 조세의 부과는 사회후생을 증진시킨다.","손실보상제도를 전혀 허용하지 않는 경우, 소득효과가 대체효과보다 큰 경우에 위험자산의 비중은 증가한다.","손실보상제도를 전혀 허용하지 않는 경우, 대체효과는 위험자산의 비중을 늘린다.","완전손실보상제도가 있는 경우, 투자 수익과는 달리 손실에 대해 정부와 투자자가 공동 부담하도록 한다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-14", subject:"재정학", year:2025, no:14, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"지방분권제도에 관한 설명으로 옳지 않은 것은?",
  choices:["정부부문의 총지출 중 중앙정부의 총지출이 차지하는 비율을 중앙집권화율이라 하며, 분권 수준을 파악하는 지표로 사용한다.","오우츠(W. Oates)는 공공재 공급비용이 동일하다면, 지역공공재는 중앙정부보다 지방정부가 공급하는 것이 효율적일 수 있다고 주장하였다.","분권화로 지방정부는 각 지역의 특성에 부합하는 다양한 정책들을 시도할 수 있다.","분권화로 지역들이 차별성을 가지고, 여러 지역 중에서 투표자가 자신이 원하는 곳을 선택할 수 있다면 결과적으로 후생이 증가될 수 있다.","티부(C. Tiebout)는 여러 개의 지역사회가 존재하고 개인들이 '발에 의한 투표'를 하면 지역공공재의 배분이 효율적으로 이루어지는 모형을 제시했다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-15", subject:"재정학", year:2025, no:15, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"국가부채에 관한 설명으로 옳지 않은 것은?",
  choices:["리카도 대등정리가 성립하면, 국채상환에 대비한 저축이 증가하여 이자율이 오르지 않아 구축효과가 발생하지 않는다.","국채발행이 증가하면 이자율이 상승하고, 환율(₩/$)이 하락하여 경상수지가 악화된다.","러너(A. Lerner)의 국채에 관한 전통적인 견해에 따르면, 외부채무의 경우 미래세대로 부담이 전가된다.","이자율 하락은 국채의 시장가치를 하락시켜 정부부채를 감소시키는 효과가 있다.","중복세대모형에 따르면, 국가채무는 미래세대로 부담이 전가된다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-16", subject:"재정학", year:2025, no:16, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"모딜리아니-밀러(Modigliani-Miller)의 제1명제에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 기업의 가치를 극대화하는 최적 자본구조의 존재를 입증한 것이다.\nㄴ. 기업의 수익에 조세를 부과하지 않는 것을 가정한다.\nㄷ. 경영자와 주주 간에 주인-대리인 문제가 있다고 가정한다.\nㄹ. 모든 투자자와 경영자가 같은 정보를 가지고 있음을 가정한다.\nㅁ. 기업의 파산과 관련한 비용은 발생하지 않는다.",
  choices:["ㄱ, ㄴ, ㄷ","ㄴ, ㄹ, ㅁ","ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ, ㅁ"], answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-17", subject:"재정학", year:2025, no:17, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"중앙정부가 지방정부에 제공하는 교부금에 관한 설명으로 옳지 않은 것은?",
  choices:["보조금이 지급될 때, 지방세가 줄어들어 민간지출이 증가하는 현상을 끈끈이 효과라 한다.","대응교부금은 공공재 선택에서 대체효과를 발생시키기 때문에 비효율적이다.","무조건부 교부금은 소득효과만을 발생시키기 때문에 비효율을 억제할 수 있다.","우리나라에서 국고보조금은 조건부 교부금의 성격을 가진다.","무조건부 교부금은 대응교부금에 비해 지방자치단체의 후생수준 증가 측면에서 우월하다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-18", subject:"재정학", year:2025, no:18, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"근로소득세 부과가 노동시장에 미치는 효과에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 여가가 정상재이고 소득효과가 대체효과보다 작으면 노동공급곡선은 후방굴절형이다.\nㄴ. 여가가 정상재이고 비례소득세 부과로 대체효과가 소득효과보다 크다면 노동공급은 늘어난다.\nㄷ. 여가가 열등재일 때 중립세로 부과하면 소득효과만 존재한다.",
  choices:["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"], answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-19", subject:"재정학", year:2025, no:19, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"자연독점인 공기업의 공공요금 결정이론에 관한 설명으로 옳지 않은 것은?",
  choices:["한계비용 가격설정방법으로 요금을 결정하면, 공공서비스 공급량은 효율적이다.","한계비용 가격설정방법으로 요금을 결정하면, 공공서비스를 생산하는 기관은 손실을 볼 수 있다.","평균비용 가격설정방법으로 요금을 결정하면, 공공서비스 공급량은 비효율적이다.","평균비용 가격설정방법으로 요금을 결정하면, 공공서비스를 생산하는 기관은 손실을 보지 않는다.","램지(F. Ramsey)의 원칙에 따르면 수요의 가격탄력성이 작을수록 가격을 한계비용에 가깝게 설정할 때 효율성이 제고된다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-20", subject:"재정학", year:2025, no:20, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"정부 감세정책의 경제적 효과로 옳은 것은?",
  choices:["가처분 소득이 줄어들고 화폐 수요가 감소한다.","소비 지출이 감소하여 총수요 곡선이 좌측으로 이동한다.","국내외 연구결과에 의하면 감세정책이 국민저축을 대폭 증대시키는 효과가 있었다.","구축효과가 없다는 가정 하에 세금 감면과 정부 지출 증가의 금액이 동일한 크기라면 두 정책의 총수요 효과는 동일하다.","구축효과가 없다는 가정 하에 정부 지출을 줄이는 만큼 세금을 감면하면 재정 적자의 변화 없이 총수요를 감소시킨다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-21", subject:"재정학", year:2025, no:21, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"공공재의 성격으로 옳은 것은?",
  choices:["비경합성이란 대가를 지불하지 않고도 소비에 참여할 수 있는 성질을 의미한다.","순수공공재는 그 특성상 가격을 설정할 수 없기 때문에 시장실패의 원인이 될 수 있다.","지방정부가 공급하는 상수도는 공공재의 예이다.","모든 소비자는 등량의 공공재 소비로부터 항상 같은 수준의 효용을 얻는다.","소비자들은 공공재에 대한 수요를 정확하게 표출한다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-22", subject:"재정학", year:2025, no:22, law:"재정학", unit:"1편 재정학의 개요", kind:"concept",
  stem:"자원배분의 효율성에 관한 설명으로 옳지 않은 것은?",
  choices:["어떤 배분상태가 효율적이라면 그 상태로부터 다른 상태로 옮겨갈 때 파레토 개선이 불가능하다.","후생경제학의 제1정리는 일반경쟁균형이 파레토 효율적임을 의미한다.","애로우(K. Arrow)는 완벽한 조건부거래시장이 존재하면 불확실성이 있더라도 시장실패가 일어나지 않음을 밝혔다.","외부효과로 인한 비효율성은 중립세 부과를 통해 해결할 수 있다.","도덕적 해이는 정보의 비대칭성 때문에 발생하는 현상으로 시장실패를 초래한다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-23", subject:"재정학", year:2025, no:23, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"시장실패와 정부의 기능에 관한 설명으로 옳지 않은 것은?",
  choices:["시장실패는 정부개입의 필요조건이다.","중립세는 민간부문의 의사결정을 교란시키지 않는다.","비용체감산업에 대한 평균비용 가격설정은 독점으로 인한 비효율성을 제거할 수 있다.","정부의 중고차 정비이력 의무화는 정보비대칭으로 인한 시장실패를 완화하는 방안이다.","국민연금의 강제 가입은 늦게 은퇴할 가능성이 높은 근로자들의 가입을 유도하여 역선택 문제를 해결할 수 있다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-24", subject:"재정학", year:2025, no:24, law:"재정학", unit:"3편 공공지출이론", kind:"calc",
  stem:"개인 A와 B로 구성된 경제에 X재가 1000단위 존재하며, 이 재화에 대한 효용함수는 각각 UA=3√XA, UB=√XB이다. 이 사회의 사회후생함수를 W=min{UA,UB}로 가정한다. 다음 중 옳지 않은 것은? (단, Xi>0(i=A,B)는 개인 i의 X재 소비량이다.)",
  choices:["X재가 사용재인 경우 사회후생의 극댓값은 30이다.","롤즈적 사회후생함수를 상정하고 있다.","X재가 순수공공재인 경우 A와 B는 같은 양을 소비한다.","X재가 순수공공재인 경우 사회후생수준은 A의 효용에 의해 결정된다.","X재가 사용재인 경우 사회후생의 극댓값은 순수공공재인 경우보다 작다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-25", subject:"재정학", year:2025, no:25, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"도농복합도시 A시에는 도시와 농촌지역에 각각 5명의 주민이 거주하고, 시정부는 소방서비스를 제공하고 있다. 도시지역 주민의 개별 수요함수는 P=20-Q이고, 농촌지역 주민의 개별 수요함수는 P=15-2Q이다. 공공재인 소방서비스의 한계비용이 85일 때, 사회적으로 바람직한 서비스 수준은? (단, P는 가격, Q는 서비스의 양이다.)",
  choices:["2","4","5","6","8"], answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-26", subject:"재정학", year:2025, no:26, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"A와 B 두 명으로 구성된 사회에서 개인의 효용을 각각 UA와 UB, 사회후생을 W라고 할 때, 다음 중 옳지 않은 것은?",
  choices:["평등주의적 사회후생함수는 많은 효용을 가진 사람에게는 낮은 가중치를, 적은 효용을 가진 사람에게는 높은 가중치를 준다.","공리주의적 사회후생함수는 모든 구성원에게 동일한 가중치를 평등하게 부여한다.","롤즈적 사회후생함수는 W=min{UA,UB}로 나타낼 수 있다.","사회후생함수가 W=UA+2UB일 경우, B의 효용을 A의 효용보다 2배 더 중요시한다.","공리주의적 사회후생함수에 의하면 소득의 한계효용이 감소할 때 사회후생의 극대화를 위해서는 각 개인소득의 한계효용이 서로 달라야 한다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-27", subject:"재정학", year:2025, no:27, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"중위투표자 정리에 관한 설명으로 옳지 않은 것은?",
  choices:["중위투표자 정리의 정치적 균형은 파레토 효율성을 보장한다.","일정한 조건 하에서 10억, 20억, 30억의 3개 예산안에 대한 꽁도세승자는 20억이 될 것이라는 의미이다.","진보정당과 보수정당의 선거공약이 비슷해지는 현상을 설명할 수 있다.","투표자의 선호가 다봉형이 아닌 단봉형일 때 성립한다.","중위투표자의 지지를 얻은 정당이 선거에서 승리할 수 있음을 의미한다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-28", subject:"재정학", year:2025, no:28, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"다음은 재화 X의 소비에 대한 사적 한계편익(PMB), 생산의 사회적 한계비용(SMC), 생산에 따른 한계 외부피해(MD)이다.\n\nPMB=600-4Q, SMC=6Q, MD=2Q\n\n사회적 최적 생산량을 위한 피구세의 크기는? (단, Q는 생산량이다.)",
  choices:["40","60","80","100","120"], answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-29", subject:"재정학", year:2025, no:29, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"니스카넨(W. Niskanen)과 미그-빌레인저(Migue-Belanger)의 관료제 모형에 관한 설명으로 옳은 것은?",
  choices:["니스카넨 모형에서 관료는 가격순응자이다.","두 모형에서 관료는 공익의 극대화를 추구하는 존재이다.","두 모형에서 관료가 선호하는 생산량은 한계편익과 한계비용이 일치하는 수준보다 크다.","다른 조건이 모두 동일할 때, 니스카넨 모형의 공공재 생산량은 미그-빌레인저 모형의 생산량보다 적다.","니스카넨 모형에서 관료는 예산집행으로 인한 편익과 비용의 차이가 가장 큰 점에서 생산하려 한다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-30", subject:"재정학", year:2025, no:30, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"외부성에 관한 설명으로 옳지 않은 것은?",
  choices:["금전적 외부성은 자원배분 효율성에는 영향을 미치지 않는다.","실질적 외부성은 자원의 비효율성을 유발한다.","외부성은 생산과정은 물론 소비과정에서도 발생한다.","외부성을 내부화하기 위한 환경세 부과는 시장을 활용하는 방식이다.","이로운 외부성이 존재하면 해당재화의 생산량은 사회적 최적 수준보다 과다 생산되는 경향이 있다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-31", subject:"재정학", year:2025, no:31, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공공사업의 비용과 편익 평가기준에 관한 설명으로 옳은 것은?",
  choices:["잠재가격은 시장이 안정적일 경우 자원의 사회적 기회비용을 계산하여 비용과 편익의 평가기준으로 사용하는 방법이다.","독점자가 생산한 상품을 구입하여 그 상품의 생산량이 그만큼 증가하였다면 평균비용을 평가기준으로 한다.","독점자가 생산한 상품을 구입하였으나 그 상품의 생산량이 불변이면 시장가격을 평가기준으로 한다.","물품세가 부과된 상품이 공공사업에 투입되었으나 그 상품의 생산량이 불변이라면 생산자가격이 적절한 평가기준이다.","물품세가 부과된 상품이 공공사업에 투입되어 그 상품의 생산량이 투입된 양만큼 증가하였다면 한계비용을 평가기준으로 한다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-32", subject:"재정학", year:2025, no:32, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공공투자가 유발하는 편익과 비용에 관한 설명으로 옳지 않은 것은?",
  choices:["실질적 편익은 공공사업의 최종소비자가 얻는 편익으로, 사회후생 증가에 기여한다.","무형적 편익과 비용은 시장에서 파악되지 않기 때문에 공공투자사업의 비용편익 분석에 고려하지 않는다.","확실대등액은 불확실성이 개재되어 있는 공공사업 평가에 활용된다.","시장이자율이 사회적 할인율보다 높을 때 시장이자율을 할인율로 사용하면 공공사업의 경제성은 낮아질 수 있다.","시장에서 거래되지 않는 재화나 서비스의 편익은 다른 상황에서 관찰된 소비자의 행위나 시장정보를 이용하여 간접적으로 추정한다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-33", subject:"재정학", year:2025, no:33, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"이전지출에 관한 설명으로 옳지 않은 것은?",
  choices:["이전지출이란 기초연금처럼 정부가 일방적으로 소득을 이전해주는 성격의 지출을 말한다.","소득보조, 가격보조, 현물보조로 나눌 수 있다.","소득보조는 상대가격 변화를 초래하지 않아 대체효과는 발생하지 않는다.","가격보조는 소득효과와 대체효과를 일으킨다.","소득보조는 가격보조에 비하여 해당상품의 소비를 촉진하는 효과가 더 크다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-34", subject:"재정학", year:2025, no:34, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라 국민연금제도의 성격으로 옳은 것을 모두 고른 것은?\n\nㄱ. 역선택으로 인한 시장실패 치유\nㄴ. 정부조세수입 확충\nㄷ. 온정적 간섭\nㄹ. 소득재분배 수단",
  choices:["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"], answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-35", subject:"재정학", year:2025, no:35, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라 재분배정책에 관한 설명으로 옳은 것은?",
  choices:["국민기초생활보장제도는 우리나라 대표적인 공공부조제도이다.","공공부조는 기여한 국민만이 혜택을 받을 수 있다.","부가가치세는 조세를 이용한 대표적인 재분배정책이다.","사회보험은 기여 여부와 무관하게 모든 국민이 혜택을 받을 수 있다.","근로장려세제는 근로에 참여한 모든 근로자를 돕기 위한 제도이다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-36", subject:"재정학", year:2025, no:36, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"외부성에 관한 설명으로 옳지 않은 것은?",
  choices:["코즈정리는 소유권이 분명하다면 외부성의 문제가 정부의 직접적 개입 없이도 당사자들의 협상에 의해 해결될 수 있음을 보여준다.","조세 부과를 통해 내부화함으로써 효율적인 자원배분을 가져오게 할 수 있다.","생산과정에서 발생하는 외부효과를 내부화하기 위해서는 사회적으로 바람직한 소비량 수준에서의 한계피해액 만큼의 크기를 조세로 부과하여야 한다.","조세 부과에 비하여 보조금 지급에 따른 생산량 감소의 크기는 단기적으로는 크지만 장기적으로는 동일하다.","배출권거래제도는 시장을 활용하여 외부성을 내부화하는 방법이다."],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-37", subject:"재정학", year:2025, no:37, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"사회의 분배 상태를 나타내는 불평등 지수에 관한 설명으로 옳지 않은 것은?",
  choices:["모두 동일한 소득을 가지고 있다면 5분위배율의 값은 1이다.","가치판단이 달라도 동일한 소득분배 상태라면 앳킨슨지수의 값은 동일하다.","지니계수는 0에서부터 1까지 값을 가지며 0에 가까울수록 평등한 분배를 뜻한다.","앳킨슨지수는 0에서부터 1까지 값을 가지며 0에 가까울수록 평등한 분배를 뜻한다.","두 사회의 로렌츠곡선이 교차한다면 로렌츠곡선만으로는 두 사회의 소득 불평등도를 비교할 수 없다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-38", subject:"재정학", year:2025, no:38, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"최적 분배에 관한 설명으로 옳지 않은 것은?",
  choices:["롤즈(J. Rawls)는 사회의 가장 가난한 사람의 후생을 극대화하도록 분배하는 것이 그 사회의 후생을 극대화하는 것이라 하였다.","러너(A. Lerner)는 동등확률 하에서도 효용함수가 서로 다르면 사람들의 균등분배는 최적분배가 아니라고 하였다.","에지워스(F. Edgeworth)는 자신이 제시한 세 가지 가정이 충족된다면 모든 사람에게 완전히 균등하게 소득을 나누어주는 것이 가장 바람직한 분배라고 하였다.","공리주의적 견해에 의하면 그 사회의 총체적 후생을 극대화할 수 있다면 불균등한 분배상태도 정당화된다.","노직(R. Nozick)은 결과의 정의보다 절차상의 정의를 더욱 중시하였다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-39", subject:"재정학", year:2025, no:39, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"분배에 관한 공리주의적 주장으로 옳지 않은 것은?",
  choices:["개인 간 효용 비교를 전제로 하고 있다.","실천과정에서 개인의 권리가 침해될 수 있다.","효용함수는 소득의 한계효용이 불변이라는 가정이 필요하다.","사회전체 후생의 증감에 입각한 공리의 원칙이 유일한 도덕기준이다.","바람직한 분배란 그 사회의 총체적 후생을 극대화할 수 있는 분배이어야 한다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"jj2025-40", subject:"재정학", year:2025, no:40, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"연금제도에 관한 설명으로 옳지 않은 것은?",
  choices:["노후소득의 감소에 대비하기 위한 사회보험제도이다.","완전적립방식은 세대 간 재분배, 부과방식은 세대 내 재분배가 발생한다.","상속효과로 민간저축이 증가한다.","재산대체효과로 민간저축이 감소한다.","사적 보험시장에서 발생 가능한 역선택 문제를 방지하기 위하여 사회보험으로 운용하고 있다."],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-1", subject:"회계학개론", year:2023, no:1, law:"회계학개론", unit:"재무회계개념체계", kind:"calc",
  stem:"(주)세무는 20×1년 초 ￦100,000을 지급하고 토지를 취득하였다. 취득당시 거래원가 ￦20,000이 추가로 발생하였다. 20×1년 말 현재 동 토지와 동등한 토지를 취득하기 위해서는 ￦110,000을 지급하여야 하며, 추가로 취득관련 거래원가 ￦5,000을 지급하여야 한다. 한편 (주)세무는 20×1년 말 현재 시장참여자 사이의 정상거래에서 동 토지를 매도할 경우 거래원가 ￦20,000을 차감하고 ￦98,000을 수취할 수 있다. 20×1년 말 현재 토지의 역사적원가, 공정가치, 현행원가를 금액이 큰 순으로 옳게 나열한 것은?",
  choices:["역사적원가 > 현행원가 > 공정가치","역사적원가 > 공정가치 > 현행원가","현행원가 > 공정가치 > 역사적원가","현행원가 > 역사적원가 > 공정가치","공정가치 > 역사적원가 > 현행원가"],
  answer:2, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-2", subject:"회계학개론", year:2023, no:2, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무는 20×1년 초 영업부에서 사용할 차량운반구(취득원가 ￦2,000,000, 내용연수 3년, 잔존가치 ￦200,000, 정액법 상각, 재평가모형 적용)를 취득하였으며, 자산의 총장부금액에서 감가상각누계액을 제거하는 방법으로 재평가회계처리를 한다. 차량운반구와 관련하여 20×2년 말에 손상이 발생하였으며, 차량운반구의 20×1년과 20×2년 말 공정가치와 회수가능액은 다음과 같다. 차량운반구 관련 회계처리가 (주)세무의 20×2년도 당기순이익에 미치는 영향은? (단, 재평가잉여금은 이익잉여금으로 대체하지 아니하며, 처분부대원가는 무시할 수 없는 수준이다.)\n\n구분 / 20×1년 말 / 20×2년 말\n공정가치 / ￦1,600,000 / ￦500,000\n회수가능액 / 1,600,000 / 300,000",
  choices:["￦400,000 감소","￦600,000 감소","￦900,000 감소","￦1,100,000 감소","￦1,300,000 감소"],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-3", subject:"회계학개론", year:2023, no:3, law:"회계학개론", unit:"금융자산", kind:"calc",
  stem:"(주)세무는 20×1년 초 (주)한국이 동 일자로 발행한 사채(액면금액 ￦1,000,000, 표시이자율 연 10%, 만기 4년, 매년 말 이자지급)를 ￦939,240에 취득하고 상각후원가측정금융자산으로 분류하였다. 취득 시 유효이자율은 연 12%이며, 취득당시 손상은 없었다. (주)세무는 20×1년 말 (주)한국으로부터 20×1년도 이자는 정상적으로 수취하였으나, 20×1년 말 동 금융자산에 신용손상이 발생하였다. (주)세무는 채무불이행 발생확률을 고려하여 20×2년부터 만기까지 매년 말 이자 ￦70,000과 만기에 원금 ￦700,000을 수취할 것으로 추정하였다. 금융자산의 회계처리가 (주)세무의 20×1년도 당기순이익에 미치는 영향은? (현가계수표: 기간3 단일금액 10%=0.7513/12%=0.7118, 정상연금 10%=2.4869/12%=2.4018)",
  choices:["￦139,247 감소","￦164,447 감소","￦172,854 감소","￦181,772 감소","￦285,597 감소"],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-4", subject:"회계학개론", year:2023, no:4, law:"회계학개론", unit:"유형자산", kind:"calc",
  stem:"(주)세무는 20×1년 초 정부보조금으로 ￦500,000을 수취하여 기계설비(취득원가 ￦2,000,000, 내용연수 5년, 잔존가치 ￦0, 정액법 상각, 원가모형 적용)를 취득하였다. 20×2년 초 (주)세무는 동 기계설비에 자산의 인식요건을 충족하는 ￦1,000,000의 지출을 하였으며, 이로 인하여 기계설비의 잔존가치는 ￦100,000 증가하고, 내용연수는 1년 연장되었다. 기계설비와 관련하여 (주)세무가 20×2년도에 인식할 감가상각비는? (단, 정부보조금은 자산에서 차감하는 방법으로 회계처리한다.)",
  choices:["￦360,000","￦380,000","￦400,000","￦420,000","￦440,000"],
  answer:4, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-5", subject:"회계학개론", year:2023, no:5, law:"회계학개론", unit:"재고자산", kind:"concept",
  stem:"재고자산의 회계처리에 관한 설명으로 옳지 않은 것은?",
  choices:["재료원가, 노무원가 및 기타 제조원가 중 비정상적으로 낭비된 부분은 재고자산의 취득원가에 포함할 수 없다.","성격과 용도 면에서 유사한 재고자산에는 동일한 단위원가 결정방법을 적용하여야 하며, 성격이나 용도 면에서 차이가 있는 재고자산에는 서로 다른 단위원가 결정방법을 적용할 수 있다.","순실현가능가치를 추정할 때 재고자산의 보유 목적은 고려하지 않는다.","자가건설한 유형자산의 구성요소로 사용되는 재고자산처럼 재고자산의 원가를 다른 자산계정에 배분하는 경우, 다른 자산에 배분된 재고자산 원가는 해당 자산의 내용연수 동안 비용으로 인식한다.","통상적으로 상호 교환될 수 없는 재고자산항목의 원가와 특정 프로젝트별로 생산되고 분리되는 재화 또는 용역의 원가는 개별법을 사용하여 결정한다."],
  answer:3, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-6", subject:"회계학개론", year:2023, no:6, law:"회계학개론", unit:"투자부동산", kind:"concept",
  stem:"투자부동산의 회계처리에 관한 설명으로 옳지 않은 것은?",
  choices:["지배기업 또는 다른 종속기업에게 부동산을 리스하는 경우, 이러한 부동산은 연결재무제표에 투자부동산으로 분류한다.","부동산의 용도가 변경되는 경우에만 다른 자산에서 투자부동산으로 또는 투자부동산에서 다른 자산으로 대체한다.","투자부동산의 손상, 멸실 또는 포기로 제3자에게서 받는 보상은 받을 수 있게 되는 시점에 당기손익으로 인식한다.","재고자산을 공정가치로 평가하는 투자부동산으로 대체하는 경우, 재고자산의 장부금액과 대체시점의 공정가치의 차액은 당기손익으로 인식한다.","부동산 보유자가 부동산 사용자에게 부수적인 용역을 제공하는 경우, 전체 계약에서 그러한 용역의 비중이 경미하다면 부동산 보유자는 당해 부동산을 투자부동산으로 분류한다."],
  answer:1, status:"clear", note:"2026년 개정 영향 없음." },
{ id:"hg2023-7", subject:"회계학개론", year:2023, no:7, law:"회계학개론", unit:"금융부채·사채", kind:"calc",

  choices:["￦51,325","￦61,345","￦88,630","￦123,656","￦160,000"],

{ id:"hg2023-9", subject:"회계학개론", year:2023, no:9, law:"회계학개론", unit:"수익인식", kind:"calc",
  stem:"프랜차이즈를 운영하는 (주)세무가 20×1년 11월 초 고객과 체결한 계약과 관련된 정보가 다음과 같을 때, (주)세무가 20×1년도에 인식할 수익은? (단, 라이선스를 부여하기로 하는 것과 설비를 이전하기로 하는 것은 구별되며, 변동대가와 고정대가는 모두 개별 판매금액을 반영한 것이다.)\n\n○ (주)세무는 계약일로부터 5년 동안 고객이 (주)세무의 상호를 사용하고 제품을 판매할 권리를 제공하는 프랜차이즈 라이선스를 부여하기로 하였으며, 라이선스에 추가하여 상점을 운영하기 위해 필요한 장비를 제공하기로 약속하였다.\n○ (주)세무는 라이선스를 부여하는 대가로 고객의 월 매출액 중 3%(변동대가)를 판매기준 로열티로 다음달 15일에 수령하기로 하였다.\n○ (주)세무는 설비가 인도되는 시점에 설비의 대가로 ￦1,500,000(고정대가)을 받기로 하였다.\n○ 계약과 동시에 설비를 고객에게 이전하였으며, 고객의 20×1년 11월과 12월의 매출액은 각각 ￦7,000,000과 ￦8,000,000이다.",

  choices:["포괄손익계산서에 기타포괄손익의 항목은 관련 법인세 효과를 차감한 순액으로 표시할 수 있다.","한국채택국제회계기준은 재무제표 이외에도 연차보고서 및 감독기구 제출서류에 반드시 적용한다.","서술형 정보의 경우에는 당기 재무제표를 이해하는 데 목적적합 하더라도 비교정보를 포함하지 않는다.","재무상태표에 자산과 부채는 유동자산과 비유동자산, 그리고 유동부채와 비유동부채로 구분하여 표시하며, 유동성순서에 따른 표시방법은 허용하지 않는다.","한국채택국제회계기준의 요구에 따라 공시되는 정보가 중요하지 않더라도 그 공시를 제공하여야 한다."],

  stem:"(주)세무는 20×1년 초 상각후원가로 측정하는 금융부채에 해당하는 사채(액면금액 ￦1,000,000, 표시이자율 연 8%, 만기 3년, 매년 말 이자지급)를 ￦950,252(유효이자율 연 10%)에 발행하였다. (주)세무는 20×2년 초에 표시이자율을 연 5%(매년 말 이자지급)로, 만기를 20×5년 말로 조건을 변경하는 것에 사채권자와 합의하였다. 조건변경과 관련한 수수료는 발생하지 않았으며, 20×2년 초 시장이자율은 연 12%이다. 동 사채의 회계처리가 (주)세무의 20×2년도 당기순이익에 미치는 영향은? (현가계수표 5년: 단일금액 5%=0.7835/8%=0.6806/10%=0.6209/12%=0.5674, 정상연금 5%=4.3295/8%=3.9927/10%=3.7908/12%=3.6048 — 1~5기간 전체 표 제시)",

{ id:"hg2023-13", subject:"회계학개론", year:2023, no:13, law:"회계학개론", unit:"주당이익", kind:"calc",
  stem:"(주)세무의 20×1년도 주당이익과 관련된 자료는 다음과 같다. (주)세무의 20×1년도 희석주당이익은?\n\n○ 20×1년 초 유통보통주식수는 10,000주이고, 유통우선주식수는 5,000주이다.\n○ 우선주(누적적 비참가적, 주당 액면금액 ￦1,000, 배당률 연 10%)는 전환우선주로 우선주 5주당 보통주 1주로 전환이 가능하다.\n○ 20×1년도 당기순이익은 ￦993,600이다.\n○ 4월 1일 신주인수권 10,000개(신주인수권 1개당 보통주 1주 인수, 행사가격 개당 ￦3,000)를 발행하였다.\n○ 7월 1일 우선주 2,000주가 보통주로 전환되었다.\n○ 보통주식의 4월 1일 종가는 주당 ￦4,000, 12월 31일 종가는 주당 ￦6,000이고, 당기 평균주가는 주당 ￦5,000이다.\n○ 기중에 전환된 전환우선주에 대해서 우선주배당금을 지급하지 않으며, 가중평균주식수는 월할 계산한다.",

{ id:"hg2023-14", subject:"회계학개론", year:2023, no:14, law:"회계학개론", unit:"사업결합·연결", kind:"calc",
  stem:"(주)세무는 20×1년 초 순자산 장부금액이 ￦1,000,000인 (주)한국의 의결권 있는 보통주 80%를 ￦900,000에 취득하여 지배력을 획득하였다. 취득일 현재 (주)한국의 자산과 부채의 장부금액과 공정가치는 건물을 제외하고 모두 일치하였다. 건물의 장부금액과 공정가치는 각각 ￦500,000과 ￦600,000이고, 정액법(잔존 내용연수 10년, 잔존가치 ￦0)으로 상각한다. (주)한국은 원가에 25%의 이익을 가산하여 (주)세무에 상품을 판매하고 있으며, 20×1년 (주)세무가 (주)한국으로부터 매입한 상품 중 ￦50,000이 기말상품재고액으로 계상되어 있다. 20×1년도 (주)세무의 별도재무제표에 보고된 당기순이익은 ￦250,000이고, (주)한국의 당기순이익이 ￦120,000이라고 할 때, (주)세무의 20×1년도 연결포괄손익계산서 상 지배기업소유주 귀속 당기순이익은? (단, (주)세무는 별도재무제표 상 (주)한국의 주식을 원가법으로 회계처리하고 있으며, 비지배지분은 종속기업의 식별가능한 순자산 공정가치에 비례하여 결정한다.)",
  choices:["￦328,000","￦330,000","￦338,000","￦346,000","￦350,000"],

{ id:"hg2023-15", subject:"회계학개론", year:2023, no:15, law:"회계학개론", unit:"주식기준보상", kind:"concept",
  stem:"주식기준보상에 관한 설명으로 옳은 것은?",
  choices:["현금결제형 주식기준보상거래의 경우에 제공받는 재화나 용역과 그 대가로 부담하는 부채를 부채의 공정가치로 측정하며, 부채가 결제될 때까지 매 보고기간 말과 결제일에 부채의 공정가치를 재측정하지 않는다.","주식결제형 주식기준보상거래로 가득된 지분상품이 추후 상실되거나 주식선택권이 행사되지 않은 경우에는 종업원에게서 제공받은 근무용역에 대해 인식한 금액을 환입하여 당기손익으로 인식한다.","부여한 지분상품의 공정가치를 신뢰성 있게 추정할 수 없어 내재가치로 측정한 경우에는 부여일부터 가득일까지 내재가치 변동을 재측정하여 당기손익으로 인식하고, 가득일 이후의 내재가치 변동은 수정하지 않는다.","시장조건이 있는 지분상품을 부여한 때에는 그 시장조건이 충족되는 시점에 거래상대방에게서 제공받는 재화나 용역을 인식한다.","거래상대방이 결제방식을 선택할 수 있는 주식기준보상거래의 경우, 기업이 결제일에 현금을 지급하는 대신 지분상품을 발행하면 부채를 발행되는 지분상품의 대가로 보아 자본으로 직접 대체한다."],
  answer:5, status:"clear", note:"2026년 개정 영향 없음." },

  stem:"(주)세무는 20×1년 1월 1일 액면금액 ￦1,000,000의 전환사채를 액면발행하였다. 다음 자료를 이용할 경우, 전환사채 상환 회계처리가 (주)세무의 20×2년도 당기순이익에 미치는 영향은? (단, 현재가치 계산 시 제시된 현가계수표를 이용한다.)\n\n○ 표시이자율 연 5%, 매년 말 이자지급\n○ 만기상환일 : 20×3년 12월 31일\n○ 일반사채의 유효이자율 : 20×1년 1월 1일 연 10%, 20×2년 1월 1일 연 12%\n○ 상환조건 : 상환기일에 액면금액의 115%를 일시상환\n○ 전환조건 : 사채액면 ￦1,000당 보통주식 1주(주당액면 ￦500)로 전환\n○ 20×2년 1월 1일에 전환사채 중 50%를 동 일자의 공정가치 ￦550,000에 상환 (현가계수표 기간3: 단일금액 10%=0.7513/12%=0.7118, 정상연금 10%=2.4869/12%=2.4018)",

{ id:"hg2023-17", subject:"회계학개론", year:2023, no:17, law:"회계학개론", unit:"종업원급여", kind:"calc",
  stem:"(주)세무는 확정급여제도를 채택하여 시행하고 있으며, 관련 자료는 다음과 같다. (주)세무가 20×2년도에 인식할 퇴직급여와 기타포괄손익은?\n\n○ 20×1년 말 사외적립자산 잔액은 ￦300,000이며, 확정급여채무 잔액은 ￦305,000이다.\n○ 20×2년 초에 현금 ￦180,000을 사외적립자산에 출연하였다.\n○ 20×2년도의 당기근무원가는 ￦190,000이다.\n○ 20×2년 말에 사외적립자산 ￦150,000이 퇴직종업원에게 현금으로 지급되었다.\n○ 20×2년 말 현재 확정급여채무의 현재가치와 사외적립자산의 공정가치는 각각 ￦373,000과 ￦375,000이며, 자산인식상한은 ￦1,000이다.\n○ 순확정급여부채(자산) 계산 시 적용한 할인율은 연 10%로 변동이 없다.",
  choices:["퇴직급여 ￦172,500, 기타포괄손익 손실 ￦500","퇴직급여 ￦172,500, 기타포괄손익 손실 ￦1,500","퇴직급여 ￦172,500, 기타포괄손익 이익 ￦1,500","퇴직급여 ￦190,500, 기타포괄손익 손실 ￦16,500","퇴직급여 ￦190,500, 기타포괄손익 이익 ￦16,500"],

{ id:"hg2023-18", subject:"회계학개론", year:2023, no:18, law:"회계학개론", unit:"법인세회계", kind:"concept",
  stem:"법인세회계에 관한 설명으로 옳지 않은 것은?",
  choices:["자산의 세무기준액은 자산의 장부금액이 회수될 때 기업에 유입될 과세대상 경제적효익에 세무상 가산될 금액을 말한다.","과거기간에 이미 납부한 법인세 금액이 그 기간 동안 납부하여야 할 금액을 초과하였다면 그 초과금액은 자산으로 인식한다.","사업결합에서 발생한 영업권을 최초로 인식하는 경우에는 이연법인세부채를 인식하지 않는다.","이연법인세자산의 일부 또는 전부에 대한 혜택이 사용되기에 충분한 과세소득이 발생할 가능성이 더 이상 높지 않다면 이연법인세자산의 장부금액을 감액시킨다.","이연법인세 자산과 부채는 현재가치로 할인하지 않는다."],

{ id:"hg2023-19", subject:"회계학개론", year:2023, no:19, law:"회계학개론", unit:"현금흐름표", kind:"calc",

{ id:"hg2023-20", subject:"회계학개론", year:2023, no:20, law:"회계학개론", unit:"충당부채", kind:"concept",

  choices:["현재의무를 이행하기 위하여 필요한 지출 금액에 영향을 미치는 미래 사건이 일어날 것이라는 충분하고 객관적인 증거가 있는 경우에는 그 미래 사건을 고려하여 충당부채 금액을 추정한다.","우발부채는 의무를 이행하기 위하여 경제적 효익이 있는 자원을 유출할 가능성이 희박하지 않다면 주석으로 공시한다.","충당부채와 관련하여 포괄손익계산서에 인식한 비용은 제삼자의 변제와 관련하여 인식한 금액과 상계하여 표시할 수 있다.","당초에 다른 목적으로 인식된 충당부채를 그 목적이 아닌 다른 지출에 사용할 수 있다.","충당부채를 현재가치로 평가하여 표시하는 경우에는 장부금액을 기간 경과에 따라 증액하고 해당 증가 금액은 차입원가로 인식한다."],

{ id:"hg2023-21", subject:"회계학개론", year:2023, no:21, law:"회계학개론", unit:"법인세회계", kind:"calc",
  stem:"(주)세무의 20×1년도 법인세 관련 자료가 다음과 같을 때, 20×1년도 법인세비용은?\n\n○ 20×1년도 법인세비용차감전순이익은 ￦1,000,000이다.\n○ 20×1년 10월 말에 자기주식처분이익 ￦20,000이 발생하였다.\n○ 20×1년 말 재고자산평가손실의 세법상 부인액은 ￦30,000, 접대비 한도초과액은 ￦50,000이다.\n○ 20×1년 초에 ￦3,000,000에 취득한 토지의 20×1년 말 현재 공정가치는 ￦3,100,000이다. (주)세무는 토지에 대해 재평가모형을 적용하고 있으나, 세법에서는 이를 인정하지 않는다.\n○ 차감할 일시적차이가 사용될 수 있는 과세소득의 발생가능성은 매우 높다.\n○ 법인세율은 20%로 매년 일정하며, 전기이월 일시적차이는 없다고 가정한다.",

  choices:["지분상품의 상환이나 차환은 자본의 변동으로 인식하지만, 지분상품의 공정가치 변동은 재무제표에 인식하지 않는다.","확정수량의 보통주로 전환되는 조건으로 발행된 전환우선주는 지분상품으로 회계처리한다.","기업이 자기지분상품을 재취득하는 경우에는 자본에서 차감하며, 자기지분상품을 매입, 매도, 발행, 소각하는 경우의 손익은 당기손익으로 인식하지 않는다.","액면주식을 액면발행한 경우, 발생한 주식발행 직접원가는 주식할인발행차금으로 차변에 기록된다.","보유자가 발행자에게 특정일이나 그 후에 확정되었거나 결정 가능한 금액으로 상환해 줄 것을 청구할 수 있는 권리가 있는 우선주는 지분상품으로 분류한다."],

{ id:"hg2023-23", subject:"회계학개론", year:2023, no:23, law:"회계학개론", unit:"리스", kind:"calc",
  stem:"(주)세무의 리스거래 관련 자료는 다음과 같다. (주)세무의 리스 회계처리가 20×2년도 당기순이익에 미치는 영향은? (단, 현재가치 계산 시 제시된 현가계수표를 이용한다.)\n\n○ 리스기간 : 20×1. 1. 1. ∼ 20×4. 12. 31.\n○ 고정리스료 : 리스기간 매년 말 ￦100,000 지급\n○ 리스계약 체결시점의 내재이자율은 연 8%이며, 리스기간 종료시 추정 잔존가치는 ￦5,000이고, 보증잔존가치는 없다.\n○ 리스자산의 경제적 내용연수는 5년, 잔존가치 ￦0, 정액법으로 상각한다.\n○ 20×1년 말 현재 사용권자산과 리스부채는 각각 ￦248,408과 ￦257,707이다.\n○ 20×2년 1월 1일 (주)세무는 잔여 리스기간을 3년에서 2년으로 단축하는 리스계약 조건변경에 합의하였다. 변경된 계약은 별도 리스로 회계처리 할 수 있는 요건을 충족하지 않는다. 리스계약 변경시점의 새로운 내재이자율은 연 10%이다. (현가계수표 기간4: 단일금액 8%=0.7350/10%=0.6830, 정상연금 8%=3.3121/10%=3.1699)",

{ id:"hg2023-24", subject:"회계학개론", year:2023, no:24, law:"회계학개론", unit:"회계변경과 오류수정", kind:"calc",
  stem:"(주)세무는 20×2년도 장부마감 전에 다음과 같은 중요한 오류를 발견하였다. (주)세무의 20×2년도 오류수정 전 당기순이익이 ￦500,000일 때, 오류수정 후 당기순이익은?\n\n○ 20×1년 기말재고자산을 ￦10,000 과대평가하였으며, 20×2년 기말재고자산을 ￦5,000 과소평가하였다.\n○ 20×1년 미지급이자를 ￦7,000 과소계상하였으며, 20×2년 미지급이자를 ￦3,000 과소계상하였다.\n○ 20×2년 초에 취득한 투자주식(지분율 30%)에 대하여 지분법으로 처리해야 하는데 원가법으로 잘못 회계처리하였다. 20×2년 중에 ￦6,000의 중간배당금을 현금으로 수령하였으며, 피투자회사의 20×2년도 당기순이익은 ￦400,000이다.",
