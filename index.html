{ id:"2018-67", subject:"세법학개론", year:2018, no:67, law:"법인세법", unit:"세무조정과 소득처분", kind:"calc",
  stem:"제조업을 주업으로 하는 내국법인 (주)A(중소기업 아님, 상시근로자 50인)가 다음 자료를 근거로 제18기 사업연도(2018.1.1.~12.31.)의 세무조정을 적정히 하는 경우, 사내유보와 사외유출로 소득처분해야 할 금액의 합계는 각각 얼마인가? (단, 전기 이전의 모든 세무조정은 적정하였으며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 제18기의 자본금과 적립금 조정명세서(을)상의 기초잔액 및 관련 자료\n과목 / 기초잔액(원) / 제18기 중 발생한 사항\n토지 / △8,400,000 / 토지의 절반을 현금 60,000,000원에 처분하고, 유형자산처분이익 10,000,000원을 결산서에 계상하였다.\n건물 / 5,000,000 / (주)A의 업무에 직접 사용하지 않으며, (주)A의 대주주인 (주)B가 사용하고 있다. (주)A는 당해 건물의 외부도장 비용 2,000,000원을 현금지출하고, 이를 수선비로 결산서에 반영하였다.\n기계장치 / – / 제18기 초에 장기할부조건으로 취득하였고, 취득대금 3,000,000원은 3년에 걸쳐 매년 말 균등상환하며, 취득대금의 현재가치 2,500,000원을 반영하여 다음과 같이 회계처리하였다.\n  (차) 기계장치 2,500,000 / 현재가치할인차금 500,000   (대) 장기미지급금 3,000,000\n(2) 제17기 1.1.에 취득하여 업무에 사용하던 업무용승용차 1대(「법인세법」상 업무용승용차로서의 요건은 모두 충족함)를 제18기 12.31.에 처분하고, 이에 따른 처분손실 11,500,000원을 결산서에 반영하였다.",
  choices:["사내유보 3,500,000원 / 사외유출 7,240,000원","사내유보 4,200,000원 / 사외유출 5,500,000원","사내유보 5,000,000원 / 사외유출 4,200,000원","사내유보 7,700,000원 / 사외유출 2,000,000원","사내유보 9,200,000원 / 사외유출 2,000,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2018-68", subject:"세법학개론", year:2018, no:68, law:"법인세법", unit:"부당행위계산의 부인", kind:"calc",
  stem:"제조업을 주업으로 하는 내국법인 (주)A(중소기업 아님)의 제18기 사업연도(2018.1.1.~12.31.) 세무조정과 관련된 다음 자료의 각 (  )에 들어갈 금액으로 옳은 것은? (단, 전기 이전 및 당기의 모든 세무조정은 적정하였으며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 지급이자\n제18기 결산상 지급이자는 40,000,000원이며, 채권자가 불분명한 사채의 이자 20,000,000원이 포함되어 있다. 제18기 중 차입금의 금액 변동은 없었고 차입금의 이자율은 연 5%이다. 제18기 3.15.에 (주)A의 대표이사에게 업무와 관계없이 대여하여 기말까지 회수하지 못한 가지급금은 ( ㄱ )원이며, 지급이자에 대한 제18기 세무조정 결과 업무무관자산 등에 대한 지급이자로 손금불산입한 금액은 4,000,000원이다.\n(2) 재고자산\n상품 평가방법에 대하여 법인설립시 후입선출법으로 적법하게 신고하고 계속 적용해왔으나, 제18기 10.31.에 총평균법으로 평가방법 변경신고를 하였다. 이에 따라 제18기 결산시부터 기말 상품에 대하여 총평균법으로 평가하고 이를 결산서에 반영하였다. 기말 상품에 대하여 후입선출법, 총평균법, 선입선출법을 적용한 평가액은 각각 250,000원, ( ㄴ )원, 500,000원이며, 기말 상품에 대한 제18기 세무조정 결과 100,000원을 손금불산입하였다.\n(3) 임대료\n제18기 5.1.부터 특수관계자인 출자임원에게 사택을 제공하고 있는데, 수령한 임대보증금은 123,200,000원이고 매월 ( ㄷ )원의 임대료를 수취하여 결산상 수익으로 반영하였다. 당해 사택의 시가는 480,000,000원이며, 1년 만기 정기예금이자율은 5%이다. 시가에 해당하는 당해 사택의 적정한 임대료는 확인되지 않았고, 당해 사택 임대료와 관련된 제18기 세무조정 결과 2,320,000원을 익금산입하였다.",
  choices:["ㄱ 100,000,000 / ㄴ 400,000 / ㄷ 200,000","ㄱ 100,000,000 / ㄴ 400,000 / ㄷ 300,000","ㄱ 100,000,000 / ㄴ 600,000 / ㄷ 200,000","ㄱ 120,000,000 / ㄴ 400,000 / ㄷ 200,000","ㄱ 120,000,000 / ㄴ 600,000 / ㄷ 300,000"],
  answer:1, status:"clear", note:"" },
{ id:"2018-69", subject:"세법학개론", year:2018, no:69, law:"법인세법", unit:"감가상각비", kind:"calc",
  stem:"다음 자료에 의하여 보험업을 영위하는 내국법인 (주)A(중소기업 아님)가 사업에 직접 사용하고 있는 건물들에 대한 제18기 사업연도(2018.1.1.~12.31.)의 세무조정 결과 ㉠익금산입ㆍ손금불산입 합계와 ㉡손금산입ㆍ익금불산입 합계는 각각 얼마인가? (단, 전기 이전의 모든 세무조정은 적정하였고, 한국채택국제회계기준은 적용하지 않으며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 건물 A(취득가액 350,000,000원, 당기말 감가상각누계액 120,000,000원)를 당기말에 「보험업법」에 따라 평가하고, 다음과 같이 당기 손익으로 회계처리하였다.\n  (차) 건물 A 20,000,000   (대) 유형자산평가이익 20,000,000\n(2) 건설 중인 건물 B의 일부가 완성되어 업무에 이용하고 있으나, 이에 대한 감가상각비를 결산에 반영하지 않았다. 당해 완성부분에 대한 감가상각범위액은 6,000,000원이다.\n(3) 전기에 취득한 건물 C(취득가액 30,000,000원, 전기말 감가상각누계액 7,000,000원, 전기말 상각부인액 4,000,000원)의 결산상 당기 감가상각비 계상액은 3,000,000원이다. 감가상각방법은 신고하지 않았고 내용연수는 10년이다.\n(4) 건물 D(취득가액 5억원, 전기말 감가상각누계액 50,000,000원)에 대하여 자본적 지출로 20,000,000원을 지출하고, 이를 손익계산서상 수선비로 회계처리하였다. 당해 건물에 대하여 제18기 결산상 계상된 감가상각비는 없으며, 감가상각방법은 신고하지 않았고 내용연수는 10년이다.",
  choices:["㉠ 0원 / ㉡ 0원","㉠ 0원 / ㉡ 5,000,000원","㉠ 6,750,000원 / ㉡ 0원","㉠ 6,750,000원 / ㉡ 5,000,000원","㉠ 9,250,000원 / ㉡ 11,000,000원"],
  answer:1, status:"clear", note:"" },
{ id:"2018-70", subject:"세법학개론", year:2018, no:70, law:"법인세법", unit:"세액계산", kind:"calc",
  stem:"다음은 제조업을 주업으로 하는 내국법인 (주)A(중소기업 아님)의 제18기 사업연도(2018.1.1.~12.31.)의 세무조정 및 신고ㆍ납부 관련 자료이다. 각 (  )에 들어갈 금액을 모두 합산하면 얼마인가? (단, 전기 이전의 모든 세무조정은 적정하였으며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) (주)A가 2015년에 출자하여 설립한 외국자회사 (주)B로부터 수령한 수입배당금액 10,000,000원이 제18기 각 사업연도 소득금액에 포함되어 있으며, (주)A는 외국법인세액에 대하여 세액공제방법을 적용한다. (주)A는 동 배당금과 관련하여 (  )원을 간접외국납부세액으로 보아 익금산입하고, 법정금액을 공제한도로 하여 당해 외국법인세액을 제18기 사업연도 법인세액에서 공제하였다. (주)B에 대한 (주)A의 출자비율은 40%이며, (주)B의 당해 사업연도 소득금액과 법인세액은 각각 3억원과 1억원이다.\n(2) 제18기 각 사업연도 소득금액에는 (주)A의 개인주주 甲에게 자금을 대여하고 수취한 이자수익 20,000,000원과 유가증권시장 주권상장법인으로부터 직접 받은 현금배당금 10,000,000원이 포함되어 있으며, 이를 모두 국내에서 지급받으면서 (  )원의 법인세 원천징수세액이 발생하였다.\n(3) 가산세 3,000,000원을 포함한 자진납부할 세액이 18,000,000원으로 산출되어, 분납할 수 있는 최대금액인 (  )원은 분납하기로 결정하였다.",
  choices:["8,000,000","10,400,000","12,200,000","14,400,000","15,000,000"],
  answer:5, status:"clear", note:"" },
{ id:"2018-71", subject:"세법학개론", year:2018, no:71, law:"부가가치세법", unit:"부가가치세 총칙", kind:"concept",
  stem:"「부가가치세법」의 총칙에 관한 설명으로 옳지 않은 것은?",
  choices:["사업자 단위 과세 사업자는 각 사업장을 대신하여 그 사업자의 본점 또는 주사무소의 소재지를 부가가치세 납세지로 한다.","신규로 사업을 시작하는 자가 사업개시일 이전에 사업자등록을 신청한 경우의 최초의 과세기간은 사업개시일로부터 신청일이 속하는 과세기간의 종료일까지로 한다.","사업장 단위로 등록한 사업자가 사업자 단위 과세 사업자로 변경하려면 사업자 단위 과세 사업자로 적용받으려는 과세기간 개시 20일 전까지 사업자의 본점 또는 주사무소 관할 세무서장에게 변경등록을 신청하여야 한다.","사업자등록증을 발급받은 사업자는 휴업 또는 폐업을 하거나 등록사항이 변경되면 지체 없이 사업장 관할 세무서장에게 신고하여야 한다.","재화를 수입하는 자의 부가가치세 납세지는 「관세법」에 따라 수입을 신고하는 세관의 소재지로 한다."],
  answer:2, status:"clear", note:"" },
{ id:"2018-72", subject:"세법학개론", year:2018, no:72, law:"부가가치세법", unit:"매입세액과 차가감납부세액", kind:"concept",
  stem:"「부가가치세법」상 납부세액의 계산 및 신고에 관한 설명으로 옳지 않은 것은?",
  choices:["사업자가 자기의 사업을 위하여 사용할 목적으로 공급받은 재화에 대한 매입세액은 매출세액에서 공제할 수 있다.","신용카드매출전표등 수령명세서를 「국세기본법」에 따른 기한후과세표준신고서와 함께 제출하여 관할 세무서장이 결정하는 경우의 해당 매입세액은 매출세액에서 공제한다.","사업장이 둘 이상인 사업자가 주된 사업장의 관할 세무서장에게 주사업장 총괄 납부를 신청한 경우에는 납부할 세액을 주된 사업장에서 총괄하여 신고하여야 한다.","사업자는 매입세액이 공제되지 아니한 면세사업등을 위한 감가상각자산을 과세사업에 사용하거나 소비하는 경우 대통령령으로 정하는 바에 따라 계산한 금액을 그 과세사업에 사용하거나 소비하는 날이 속하는 과세기간의 매입세액으로 공제할 수 있다.","간이과세자가 일반과세자로 변경되면 그 변경 당시의 재고품, 건설 중인 자산 및 감가상각자산에 대하여 대통령령으로 정하는 바에 따라 계산한 금액을 매입세액으로 공제할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"2018-73", subject:"세법학개론", year:2018, no:73, law:"부가가치세법", unit:"과세거래", kind:"concept",
  stem:"「부가가치세법」상 재화의 공급으로 보는 것은?",
  choices:["사업자가 자기의 과세사업과 관련하여 생산한 재화로서 매입세액이 공제되지 않은 재화를 자기의 면세사업을 위하여 직접 사용하는 경우","사업장이 둘 이상인 사업자가 사업자 단위 과세 사업자로 적용을 받는 과세기간에 자기의 사업과 관련하여 생산한 재화를 판매할 목적으로 자기의 다른 사업장에 반출하는 경우","사업용 자산을 「상속세 및 증여세법」에 따라 물납하는 경우","신탁의 종료로 인하여 수탁자로부터 위탁자에게 신탁재산을 이전하는 경우","사업자가 자기의 과세사업과 관련하여 생산ㆍ취득한 재화로서 매입세액이 공제된 재화를 사업과 직접적인 관계없이 자기의 개인적인 목적을 위하여 사용ㆍ소비하는 경우"],
  answer:5, status:"clear", note:"" },
{ id:"2018-74", subject:"세법학개론", year:2018, no:74, law:"부가가치세법", unit:"세금계산서 및 절차규정", kind:"concept",
  stem:"「부가가치세법」상 세금계산서 등에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 착오로 전자세금계산서를 이중으로 발급한 경우에는 처음에 발급한 세금계산서의 내용대로 음(陰)의 표시를 하여 수정전자세금계산서를 발급한다.\nㄴ. 세금계산서를 발급한 후 처음 공급한 재화가 환입된 경우, 재화를 처음 공급한 날을 작성일로 적고 비고란에 환입일을 덧붙여 적은 후 붉은색 글씨로 쓰거나 음(陰)의 표시를 하여 수정세금계산서를 발급한다.\nㄷ. 관할 세무서장은 개인사업자가 전자세금계산서 의무발급 개인사업자에 해당하는 경우에는 전자세금계산서를 발급하여야 하는 기간이 시작되기 1개월 전까지 그 사실을 해당 개인사업자에게 통지하여야 한다.",
  choices:["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],
  answer:3, status:"clear", note:"" },
{ id:"2018-75", subject:"세법학개론", year:2018, no:75, law:"부가가치세법", unit:"간이과세", kind:"calc",
  stem:"소매업을 영위하는 개인사업자 甲은 2018.1.1.부터 간이과세자에서 일반과세자로 과세유형이 전환되었다. 전환일 현재의 재고품 및 감가상각자산이 다음과 같으며 모두 매입세액공제대상일 경우 재고매입세액은 얼마인가? (단, 甲은 일반과세자 전환시 보유자산에 대한 ‘재고품 등 신고서’를 적법하게 신고한 것으로 가정하고 자산의 취득은 적격증명서류를 갖추고 있음)\n\n(1) 2018.1.1. 현재 보유자산 현황(취득가액은 모두 부가가치세 포함)\n구분 / 취득일자 / 취득가액 / 장부가액 / 시가\n건물 / 2014.6.5. / 220,000,000원 / 120,000,000원 / 230,000,000원\n비품 / 2016.4.25. / 44,000,000원 / 18,000,000원 / 24,000,000원\n상품 / 2017.12.20. / 22,000,000원 / 22,000,000원 / 26,000,000원\n※ 건물과 비품은 타인으로부터 매입한 자산이다.\n(2) 해당업종의 부가가치율은 10%로 가정한다.",
  choices:["7,200,000원","12,600,000원","14,400,000원","15,600,000원","16,200,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2018-76", subject:"세법학개론", year:2018, no:76, law:"부가가치세법", unit:"간이과세", kind:"calc",
  stem:"다음은 음식점업(과세유흥장소 아님)을 영위하는 간이과세자 甲의 부가가치세 관련 자료이다. 2018년 과세기간에 대한 부가가치세 신고시 차감 납부세액(지방소비세 포함)은 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 공급내역\n기간 / 업종 / 공급대가\n2018.1.1.~6.30. / 음식점업 / 22,000,000원\n2018.7.1.~12.31. / 음식점업 / 23,000,000원\n합계 / / 45,000,000원\n(2) 공급대가 중 신용카드매출전표 발급금액은 8,000,000원이다.\n(3) 농산물 구입은 계산서 수취분이며 농산물 가액은 1,090,000원이다.\n(4) 대형마트를 통한 조미료 등의 구입은 세금계산서 수취분이며 매입세액은 1,000,000원이다.\n(5) 음식점업의 업종 부가가치율은 10%이다. 2018년 예정부과기간의 고지세액은 없으며, 전자신고세액공제는 고려하지 않는다.\n(6) 매입세액 및 의제매입세액은 공제받기 위한 모든 요건을 충족하였고, 세액공제 등에 대해 적법하게 신고한 것으로 가정하며, 甲은 복식부기의무자가 아니다.",
  choices:["0원","52,000원","61,260원","152,000원","161,260원"],
  answer:2, status:"clear", note:"" },
{ id:"2018-77", subject:"세법학개론", year:2018, no:77, law:"부가가치세법", unit:"세금계산서 및 절차규정", kind:"calc",
  stem:"다음은 2018.10.1.에 과세사업을 개시한 일반과세자(제조업) 甲의 2018년 제2기 과세기간에 대한 매출 및 매입 내역이다. 甲이 2018.12.1.에 사업자등록을 신청하였을 때, 사업자미등록에 대한 가산세는 얼마인가? (단, 자료의 금액에는 부가가치세가 포함되어 있지 않고, 「국세기본법」상 가산세 감면규정은 적용하지 않으며 주어진 자료 이외에는 고려하지 않음)\n\n구분 / 10.1.~10.31. / 11.1.~11.30. / 12.1.~12.31. / 합계\n매출 / 75,000,000원 / 60,000,000원 / 55,000,000원 / 190,000,000원\n매입 / 40,000,000원 / 20,000,000원 / 25,000,000원 / 85,000,000원",
  choices:["0원","750,000원","1,050,000원","1,350,000원","1,900,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2018-78", subject:"세법학개론", year:2018, no:78, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"calc",
  stem:"과세사업을 영위하는 일반과세자 (주)A(제조업)의 공급에 대한 다음 자료에서 2018년 제2기 과세기간(2018.7.1.~12.31.) 공급가액의 합계는 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 2019.1.31.에 인도 예정인 재화(공급가액 1,000,000원)에 대한 대가를 2018.12.20.에 모두 받고, 그 받은 대가에 대한 세금계산서를 즉시 발급하였다.\n(2) 2018.9.1.에 할부판매 조건으로 재화를 인도하고, 공급가액 1,000,000원은 10월 말부터 2개월마다 4번에 걸쳐 받기로 하였다.\n(3) 2018.5.1.에 인도를 완료한 재화의 공급에 대하여 그 대가의 지급이 지체되었음을 이유로 2018.10.31.에 연체이자 1,000,000원을 수취하였다.\n(4) 2018.12.1.에 상품권 1,000,000원을 현금판매하였고, 그 후 당해 상품권은 2019.1.10.에 현물과 교환되었다.",
  choices:["0원","1,000,000원","2,000,000원","3,000,000원","4,000,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2019-41", subject:"세법학개론", year:2019, no:41, law:"국세기본법", unit:"납세의무", kind:"concept",
  stem:"「국세기본법」상 납세의무 성립시기에 관한 내용으로 옳은 것을 모두 고른 것은?\n\nㄱ. 원천징수하는 소득세ㆍ법인세: 과세기간이 끝나는 때\nㄴ. 증권거래세: 해당 매매거래가 확정되는 때\nㄷ. 수입재화에 대한 부가가치세: 세관장에게 수입신고를 하는 때\nㄹ. 수시부과하여 징수하는 국세: 수시부과 납부일",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],
  answer:3, status:"clear", note:"" },
{ id:"2019-42", subject:"세법학개론", year:2019, no:42, law:"국세기본법", unit:"납세자의 권리", kind:"concept",
  stem:"「국세기본법」상 납세자의 권리 중 ‘장부등의 보관 금지’에 관한 설명으로 옳은 것은?",
  choices:["세무공무원은 「조세범 처벌절차법」에 따른 조세범칙조사를 제외하고는 세무조사의 목적으로 납세자의 장부등을 세무관서에 임의로 보관할 수 없다.","세무공무원은 납세자에 대한 구체적인 탈세 제보가 있는 경우에는 조사 목적에 필요한 최소한의 범위에서 납세자, 소지자 또는 보관자 등 정당한 권한이 있는 자가 임의로 제출한 장부등을 납세자의 동의 없이 세무관서에 일시 보관할 수 있다.","납세자등은 조사목적이나 조사범위와 관련이 없는 등의 사유로 일시 보관에 동의하지 아니하는 장부등에 대해서는 세무공무원에게 일시 보관할 장부등에서 제외할 것을 요청할 수 있다. 이 경우 세무공무원은 어떠한 사유로도 해당 장부등을 일시 보관할 수 없다.","세무공무원은 법령에 따라 일시 보관하고 있는 장부등에 대하여 납세자가 반환을 요청한 날부터 14일 이내에 반환하여야 하나, 조사목적 달성을 위해 필요한 경우에는 납세자보호위원회의 심의를 거쳐 한 차례만 14일 이내의 범위에서 보관 기간을 연장할 수 있다.","세무공무원은 법령에 따라 일시 보관하고 있는 장부등의 반환을 납세자가 요청한 경우로서 세무조사에 지장이 없다고 판단될 때에는 요청한 장부등을 7일 이내에 반환하여야 한다."],
  answer:4, status:"clear", note:"" },
{ id:"2019-43", subject:"세법학개론", year:2019, no:43, law:"국세기본법", unit:"국세기본법 총칙", kind:"concept",
  stem:"「국세기본법」은 세법에 우선하여 적용한다. 다만, 세법에서 특례규정을 두고 있는 경우에는 그 세법에서 정하는 바에 따르는데, 다음 중 「국세기본법」 규정이 세법 규정에 항상 우선하는 것은?",
  choices:["기한 후 신고","납세의무의 성립과 확정","물적납세의무","연대납세의무","고지금액의 최저한도"],
  answer:2, status:"clear", note:"" },
{ id:"2019-44", subject:"세법학개론", year:2019, no:44, law:"국세기본법", unit:"조세채권 보전제도", kind:"concept",
  stem:"「국세기본법」상 국세우선과 관련한 법정기일로 옳지 않은 것은?",
  choices:["중간예납하는 법인세, 예정신고납부하는 부가가치세 및 양도소득과세표준을 예정신고하는 소득세의 경우 신고한 해당 세액에 대해서는 그 신고일","양도담보재산에서 국세를 징수하는 경우에는 법령에 따른 납부통지서의 발송일","원천징수의무자나 납세조합으로부터 징수하는 국세와 인지세의 경우에는 그 납세의무의 확정일","「국세징수법」상 납기전징수 규정에 따라 납세자의 재산을 압류한 경우에 그 압류와 관련하여 확정된 세액에 대해서는 그 납세의무의 확정일","「부가가치세법」에 따른 신탁 관련 수탁자의 물적납세의무 규정에 따라 신탁재산에서 부가가치세등을 징수하는 경우에는 법령에 따른 납부통지서의 발송일"],
  answer:4, status:"clear", note:"" },
{ id:"2019-45", subject:"세법학개론", year:2019, no:45, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"「국세징수법」상 체납처분의 중지ㆍ유예에 관한 설명으로 옳지 않은 것은?",
  choices:["체납처분의 목적물인 재산이 법정기일 전에 저당권 설정을 등기한 채권의 담보가 된 재산인 경우에 그 추산가액이 체납처분비와 해당 채권금액에 충당하고 남을 여지가 없을 때에는 체납처분을 중지하며, 체납처분의 목적물인 재산에 대하여 교부청구 또는 참가압류가 있는 경우에도 세무서장은 체납처분을 중지하여야 한다.","체납처분의 목적물인 총재산의 추산가액이 체납처분비에 충당하고 남을 여지가 없을 때에는 체납자(체납자와 체납처분의 목적물인 재산의 소유자가 다른 때에는 그 소유자를 포함한다)도 체납처분의 중지를 세무서장에게 요청할 수 있다.","세무서장은 체납자가 국세청장이 성실납세자로 인정하는 기준에 해당하는 경우에는 그 체납액에 대하여 체납처분에 의한 재산의 압류나 압류재산의 매각을 유예할 수 있다.","세무서장은 체납처분이 유예된 체납세액을 체납처분 유예기간 이내에 분할하여 징수할 수 있다.","성실납세자가 체납세액 납부계획서를 제출하고 국세체납정리위원회가 체납세액 납부계획의 타당성을 인정하는 경우, 세무서장은 재산의 압류를 유예하거나 압류한 재산의 압류를 해제하여도 그에 상당하는 납세담보의 제공을 요구하지 아니한다."],
  answer:1, status:"clear", note:"" },
{ id:"2019-46", subject:"세법학개론", year:2019, no:46, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"「국세징수법」상 압류의 해제에 관한 설명으로 옳지 않은 것은?",
  choices:["세무서장은 제3자가 체납자를 상대로 소유권에 관한 소송을 제기하여 승소 판결을 받고 그 사실을 증명한 경우에는 그 압류를 즉시 해제하여야 한다.","압류 또는 압류 해제의 등기 또는 등록에 관하여는 등록면허세를 면제한다.","세무서장은 재산의 압류를 해제하였을 때에는 그 사실을 그 재산의 압류 통지를 한 권리자, 제3채무자 또는 제3자에게 통지하여야 한다.","세무서장이 보관 중인 재산을 반환할 때에는 영수증을 받아야 하나, 압류조서에 영수 사실을 적고 서명날인하게 함으로써 갈음할 수 있다.","세무서장은 체납자가 압류할 수 있는 다른 재산을 제공하여 그 재산을 압류한 경우에는 압류를 즉시 해제하여야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"2019-47", subject:"세법학개론", year:2019, no:47, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"「국세징수법」상 체납처분 중 압류에 관한 설명으로 옳지 않은 것은?",
  choices:["세무공무원이 질권(質權)이 설정된 재산을 압류하려는 경우에는 그 질권자에게 문서로써 해당 질물의 인도를 요구하여야 한다. 이 경우 질권의 설정 시기가 법정기일 전이면 질물의 인도를 요구할 수 없다.","세무서장은 국세를 징수하기 위하여 필요한 재산 외의 재산을 압류할 수 없다.","「주택임대차보호법」제8조 및 같은 법 시행령의 규정에 따라 우선변제를 받을 수 있는 금액은 압류할 수 없다.","급료ㆍ임금ㆍ봉급ㆍ세비ㆍ퇴직연금, 그 밖에 이와 유사한 채권의 압류는 체납액을 한도로 하여 압류 후에 수입(收入)할 금액에 미친다.","체납자 또는 제3자가 압류재산의 사용 또는 수익을 하는 경우에는 그 재산으로부터 생기는 천연과실(그 재산의 매각으로 인하여 권리를 이전할 때까지 수취되지 아니한 천연과실은 제외한다)에 대하여는 압류의 효력이 미치지 아니한다."],
  answer:1, status:"clear", note:"" },
{ id:"2019-48", subject:"세법학개론", year:2019, no:48, law:"국세징수법", unit:"국세징수법 보칙", kind:"concept",
  stem:"다음은「국세징수법」상 체납자료의 제공에 관한 설명이다. (  )에 들어갈 내용으로 옳은 것은?\n\n세무서장은 국세징수 또는 공익(公益) 목적을 위하여 필요한 경우로서 신용정보회사 또는 신용정보집중기관, 그 밖에 대통령령으로 정하는 자가 다음의 어느 하나에 해당하는 체납자의 인적사항 및 체납액에 관한 자료를 요구한 경우에는 이를 제공할 수 있다.\n1. 체납 발생일부터 ( ㄱ )년이 지나고 체납액이 ( ㄴ )만원 이상인 자\n2. 1년에 ( ㄷ )회 이상 체납하고 체납액이 ( ㄹ )만원 이상인 자",
  choices:["ㄱ 1 / ㄴ 500 / ㄷ 2 / ㄹ 500","ㄱ 1 / ㄴ 500 / ㄷ 3 / ㄹ 500","ㄱ 1 / ㄴ 1,000 / ㄷ 2 / ㄹ 1,000","ㄱ 2 / ㄴ 500 / ㄷ 3 / ㄹ 500","ㄱ 2 / ㄴ 1,000 / ㄷ 2 / ㄹ 1,000"],
  answer:2, status:"clear", note:"" },
{ id:"2019-49", subject:"세법학개론", year:2019, no:49, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"「조세범처벌법」 제3조는 ‘사기나 그 밖의 부정한 행위’를 아래와 같이 말하고 있는데, (  )에 들어갈 내용으로 옳지 않은 것은?\n\n사기나 그 밖의 부정한 행위란 (  ) 행위로서 조세의 부과와 징수를 불가능하게 하거나 현저히 곤란하게 하는 적극적 행위를 말한다.",
  choices:["장부와 기록의 파기","재산의 은닉","거짓 증빙 또는 거짓 문서의 작성 및 수취","계산서, 세금계산서 또는 계산서합계표, 세금계산서합계표의 조작","소득, 거래 등에 대한 귀속연도의 착오"],
  answer:5, status:"clear", note:"" },
{ id:"2019-50", subject:"세법학개론", year:2019, no:50, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"「조세범처벌법」상 징역형과 벌금형을 병과할 수 있는 것은?",
  choices:["재화 또는 용역을 공급하지 아니하거나 공급받지 아니하고 「부가가치세법」에 따른 세금계산서를 발급하거나 발급받은 행위","납세의무자를 대리하여 세무신고를 하는 자가 조세의 부과 또는 징수를 면하게 하기 위하여 타인의 조세에 관하여 거짓으로 신고를 하였을 때","조세의 원천징수의무자가 정당한 사유 없이 그 세금을 징수하지 아니하였을 때","타인이 근로장려금을 거짓으로 신청할 수 있도록 근로를 제공받지 아니하고 근로소득 원천징수영수증을 거짓으로 기재하여 타인에게 발급한 행위","조세의 회피 또는 강제집행의 면탈을 목적으로 타인의 성명을 사용하여 사업자등록을 하거나 타인 명의의 사업자등록을 이용하여 사업을 영위하는 행위"],
  answer:1, status:"clear", note:"" },
{ id:"2019-51", subject:"세법학개론", year:2019, no:51, law:"소득세법", unit:"이자소득과 배당소득", kind:"calc",
  stem:"거주자 甲의 2019년 국내에서 발생한 이자소득 및 배당소득과 관련한 자료는 다음과 같다. 甲의 2019년의 종합소득 과세표준을 계산할 때 합산되는 금액은 얼마인가? (단, 자료에 언급된 것 이외에는 모두 적법하게 원천징수되었고, 모든 금액은 원천징수세액을 차감하기 전의 금액이다. 주어진 자료 이외에는 고려하지 않음)\n\n(1) 乙에게서 받은 비영업대금의 이익: 13,000,000원(원천징수되지 아니함)\n(2) 주권상장법인 (주)A로부터 받은 현금배당금: 5,000,000원\n(3) 비상장내국법인인 (주)B가 자기주식소각이익을 2019.5.1. 자본전입 결의하고, 그에 따라 2019.7.1. 甲에게 무상주를 교부하였음. 세법상 수입시기 현재 甲이 교부받은 무상주의 액면가액은 3,000,000원이고, 시가는 6,000,000원임. 주식소각일은 2016.1.5.이며, 소각 당시 자기주식의 시가는 취득가액을 초과함.",
  choices:["18,000,000원","21,110,000원","21,550,000원","21,880,000원","24,000,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2019-52", subject:"세법학개론", year:2019, no:52, law:"소득세법", unit:"사업소득", kind:"calc",
  stem:"다음은 식기류 도매업을 영위하고 있는 계속사업자인 A의 2019.1.1.~12.31.의 자료이다. A가 ㉠ 개인(복식부기의무자임)일 경우의 기부금의 필요경비 불산입액과, ㉡ 법인(사업연도는 역년과 같고, 사회적기업이 아님)일 경우의 기부금의 손금불산입액을 계산하면 각각 얼마인가? (단, A에게는 다른 소득은 없으며 기부는 A가 직접하였고 모든 증빙을 갖추었다고 가정한다. 주어진 자료 이외에는 고려하지 않음)\n\n(1) 기준소득금액(이월결손금 차감 전이며, 기부금을 필요경비 또는 손금으로 산입하기 전의 금액): 170,000,000원\n(2) 종교단체기부금: 5,000,000원\n(3) 실비로 이용가능한 「아동복지법」 제52조 제1항에 따른 아동복지시설(특수관계인 아님)에 대한 금전 외 자산 기부금: 장부가액 20,000,000원, 시가 35,000,000원\n(4) 장애인유료복지시설에 대한 기부금: 30,000,000원\n(5) 직전 과세기간(2018.1.1.~12.31.)에 발생한 세무상 이월결손금: 20,000,000원",
  choices:["㉠ 25,000,000원 / ㉡ 30,000,000원","㉠ 25,000,000원 / ㉡ 40,000,000원","㉠ 25,000,000원 / ㉡ 55,000,000원","㉠ 30,000,000원 / ㉡ 40,000,000원","㉠ 30,000,000원 / ㉡ 55,000,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2019-53", subject:"세법학개론", year:2019, no:53, law:"소득세법", unit:"양도소득세", kind:"calc",
  stem:"거주자 甲은 2019.6.30. 국내에 보유하고 있는 건물과 토지를, 건물은 300,000천원, 토지는 200,000천원으로 하여 특수관계인이 아닌 乙에게 일괄 양도하였다. 이 경우 건물의 양도차익은 얼마인가?\n\n1. 실지거래금액 및 감정평가가액(아래 기재된 가액 이외의 매매사례가액, 감정평가가액 등은 없다고 가정함) (단위: 천원)\n구분 / 건물 / 토지 / 비고\n계약서상 양도금액 / 300,000 / 200,000 / \n취득시 취득가액 / 120,000 / 180,000 / 2016.1.1. 취득\n양도시 감정평가가액 / 150,000 / 250,000 / \n\n2. 건물은 정액법(내용연수 10년, 잔존가치 없음)으로 월할 상각하여 사업소득금액 계산시 필요경비에 산입하였다.\n3. 甲은 취득시 건물과 토지 모두를 자신의 명의로 등기하였으며, 기준시가는 다음과 같다. (단위: 천원)\n구분 / 건물 / 토지 / 비고\n양도시점 / 120,000 / 200,000 / \n취득시점 / 80,000 / 120,000 / \n\n4. 양도시 양도계약서 작성비용: 4,000천원\n5. 건물 취득일에 완료한 외벽의 도색 비용: 5,000천원",
  choices:["104,750천원","105,500천원","108,000천원","164,250천원","220,500천원"],
  answer:3, status:"clear", note:"" },
{ id:"2019-54", subject:"세법학개론", year:2019, no:54, law:"소득세법", unit:"종합소득공제", kind:"calc",
  stem:"다음 자료를 이용하여 거주자 甲의 2019년도 종합소득공제액을 계산하면 얼마인가? (단, 소득공제의 종합한도나 「조세특례제한법」상의 소득공제는 고려하지 아니하고, 주어진 자료 이외에 종합소득공제의 배제 사유는 없음)\n\n(1) 본인 및 가족현황(소득현황란에 기재된 소득 이외의 소득은 없음)\n구분 / 연령 / 소득현황 / 비고\n본인 / 51세 / 총급여액 60,000,000원 / 무주택자이고 부녀자 아님\n배우자 / 47세 / 총급여액 4,000,000원의 근로소득 / 별거중임\n부친 / 80세 / 사업소득금액 10,000,000원 / \n모친 / 75세 / 작물재배업에서 발생하는 소득 15,000,000원 / 2019.2.8. 사망\n장녀 / 21세 / 소득금액 합계액 2,000,000원 / 장애인\n장남 / 18세 / 소득 없음 / 장애인\n※ 가족들은 모두 甲과 생계를 같이 한다.\n\n(2) 기타 甲이 지출하였거나 甲이 근무하고 있는 회사가 부담한 사항은 다음과 같다.\n 가. 「국민건강보험법」에 따른 국민건강보험료 3,600,000원 (본인 부담분 1,800,000원, 회사 부담분 1,800,000원)\n 나. 「고용보험법」에 따른 고용보험료 1,000,000원 (본인 부담분 500,000원, 회사 부담분 500,000원)\n 다. 생명보험 보험료 1,000,000원",
  choices:["11,300,000원","12,300,000원","12,348,000원","13,600,000원","14,800,000원"],
  answer:1, status:"clear", note:"" },
{ id:"2019-55", subject:"세법학개론", year:2019, no:55, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"calc",
  stem:"다음은 거주자 甲이 2019년에 (주)A에 근무하면서 지급받은 급여 등에 관련된 자료이다. 거주자 甲의 2019년 총급여액은? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 연간 급여 합계액(30,000,000원)\n(2) 연간 상여 합계액(10,000,000원)\n(3) 상여 소득처분금액(2,000,000원): (주)A는 2019.3.20.에 2018.1.1.~12.31. 기간의 법인세를 신고하면서 익금산입한 금액 중 2,000,000원을 甲을 귀속자로 하는 상여로 소득처분하였다.\n(4) 연간 급여 및 상여 외의 甲의 주식매수선택권 행사로 인한 이익(10,000,000원): 주식매수선택권은 (주)A의 100% 모회사인 (주)B 발행 주식을 대상으로 한 것으로서, 2019.5.5. 행사하였다. (주)A 및 (주)B는 모두 벤처기업이 아니다.\n(5) 연간 급여 외의 식대(2,400,000원): (주)A는 구내식당을 운영하고 있지 아니하여 식대를 월 200,000원씩 금전으로 지급하고 있다.",
  choices:["41,200,000원","48,800,000원","51,200,000원","53,200,000원","54,400,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2019-56", subject:"세법학개론", year:2019, no:56, law:"소득세법", unit:"소득세 총칙", kind:"concept",
  stem:"「소득세법」상 납세의무자 및 과세소득의 범위에 관한 설명으로 옳지 않은 것은?",
  choices:["과세기간 종료일 10년 전부터 국내에 주소나 거소를 둔 기간의 합계가 5년 이하인 외국인 거주자에게는 과세대상 소득 중 국외에서 발생한 소득의 경우 국내에서 지급되거나 국내로 송금된 소득에 대해서만 과세한다.","「소득세법」상 거주자란 국내에 주소를 두거나 183일 이상의 거소를 둔 개인을 말한다.","「국세기본법」에 따른 법인 아닌 단체 중 법인으로 보는 단체 외의 법인 아닌 단체가 구성원 간 이익의 분배방법이나 분배비율이 정하여져 있지 않거나 확인되지 않는 경우에는 해당 단체를 1거주자 또는 1비거주자로 보아 과세한다.","내국법인이 발행주식총수 100%를 간접출자한 해외현지법인에 파견된 당해 내국법인의 직원이, 생계를 같이 하는 가족이나 자산상태로 보아 파견기간 종료 후 재입국할 것으로 인정되는 경우라면, 외국의 국적 취득과는 관계없이 거주자로 본다.","국내에 거소를 둔 기간은 입국하는 날부터 출국하는 날까지로 한다."],
  answer:5, status:"clear", note:"" },
{ id:"2019-57", subject:"세법학개론", year:2019, no:57, law:"소득세법", unit:"소득세 절차규정과 외국법인·비거주자", kind:"concept",
  stem:"<소득세법> 법인의 대표자(등기임원)인 대주주가 법인이 보유하던 자산을 횡령하면서 그 사실을 감추기 위하여 매출을 일부 누락시켰으나, 이후 과세관청이 그 관련 법인세 등 부과처분을 한 사안과 관련하여 옳지 않은 것은?",
  choices:["해당 사안과 관련하여 법인에게 소득금액변동통지서를 통지한 경우 통지하였다는 사실을 대표자에게 알려야 하며, 당해 내용에는 소득금액 변동내용이 포함되어 있어야 한다.","해당 사안의 경우 대표자에 대한 상여로 소득처분하는 것이 일반적이다.","법인 소재지가 분명하고, 송달할 수 있는 경우라면, 소득처분되는 배당·상여 및 기타소득은 법인소득금액의 결정 또는 경정일로부터 15일 내에 소득금액변동통지서에 의하여 당해 법인에게 통지하여야 한다.","「소득세법」은 횡령에 의하여 취득하는 금품을 기타소득으로 명시하여 규정하고 있지 않다.","해당 사안의 경우 법인은 소득금액변동통지서를 받은 날 소득을 지급한 것으로 보아, 소득세를 원천징수하여야 한다."],
  answer:1, status:"clear", note:"" },
{ id:"2019-58", subject:"세법학개론", year:2019, no:58, law:"소득세법", unit:"소득세 총칙", kind:"concept",
  stem:"<소득세법> 「소득세법」상 비과세소득이 아닌 것은?",
  choices:["사업소득 중 전통주의 제조에서 발생하는 소득으로서 연 1,500만원 이하의 금액","사업소득 중 조림기간 5년 이상인 임지(林地)의 임목(林木)의 벌채 또는 양도로 발생하는 소득으로서 연 600만원 이하의 금액","「공익신탁법」에 따른 공익신탁의 이익","기타소득 중 서화·골동품을 박물관 또는 미술관에 양도함으로써 발생하는 소득","「고용보험법」에 따라 받는 실업급여"],
  answer:1, status:"clear", note:"" },
{ id:"2019-59", subject:"세법학개론", year:2019, no:59, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"concept",
  stem:"<소득세법> 「소득세법」상 기타소득에 관한 설명으로 옳지 않은 것은?",
  choices:["법령에 기타소득으로 열거된 항목이라 하더라도 사업소득으로 과세하는 것이 가능한 경우가 있을 수 있다.","10년 이상 보유한 서화의 양도로 발생하는 소득이 기타소득으로 구분되는 경우, 최소한 당해 거주자가 받은 금액의 100분의 90에 상당하는 금액을 필요경비로 인정받을 수 있다.","정신적 피해를 전보하기 위하여 받는 배상금은 기타소득으로 과세되지 아니한다.","퇴직 전에 부여받은 주식매수선택권을 퇴직 후에 행사함으로써 얻은 이익은 기타소득에 해당한다.","특정한 소득이 기타소득의 어느 항목에 해당하는지 여부는 세액에 영향이 없다."],
  answer:5, status:"clear", note:"" },
{ id:"2019-60", subject:"세법학개론", year:2019, no:60, law:"소득세법", unit:"양도소득세", kind:"concept",
  stem:"<소득세법> 「소득세법」상 거주자의 양도소득에 대한 납세의무와 관련하여 양도에 관한 설명으로 옳지 않은 것은?",
  choices:["법원의 파산선고에 의한 부동산의 처분은 양도로 보지 아니한다.","이혼으로 인하여 혼인 중에 형성된 부부공동재산을 「민법」에 따라 재산분할하는 경우에는 양도로 보지 아니한다.","공동사업을 경영할 것을 약정하는 계약에 따라 토지나 건물을 해당 공동사업체에 현물출자하는 경우 그 공동사업체에 유상으로 양도된 것으로 본다.","「도시개발법」에 따른 환지처분으로 지번이 변경되는 경우는 양도로 보지 아니한다.","양도담보계약에 따라 소유권을 이전하는 경우라 하더라도 법정요건을 갖춘 경우에는 양도로 보지 아니하나, 채무불이행으로 인하여 담보 자산을 변제에 충당한 때에는 양도한 것으로 본다."],
  answer:1, status:"clear", note:"" },
{ id:"2019-61", subject:"세법학개론", year:2019, no:61, law:"법인세법", unit:"손익의 귀속시기", kind:"concept",
  stem:"<법인세법> 「법인세법」상 익금과 손금의 귀속시기에 관한 설명으로 옳지 않은 것은?",
  choices:["내국법인의 각 사업연도의 익금과 손금의 귀속사업연도는 그 익금과 손금이 확정된 날이 속하는 사업연도로 한다.","금융보험업을 영위하는 법인의 수입보험료(원천징수대상 아님)로서 해당 법인이 결산을 확정할 때 이미 경과한 기간에 대응하는 보험료상당액을 해당 사업연도에 수익으로 계상한 경우에는 그 계상한 사업연도의 익금으로 한다.","제조업을 영위하는 법인이 원천징수대상인 이자에 대하여 결산상 미수이자를 계상한 경우에는 그 계상한 사업연도의 익금에 산입되지 않는다.","중소기업이 아닌 법인이 장기할부조건으로 자산을 판매하고 인도기준으로 회계처리한 경우, 그 장기할부조건에 따라 각 사업연도에 회수하였거나 회수할 금액과 이에 대응하는 비용을 신고조정에 의하여 해당 사업연도의 익금과 손금에 산입할 수 있다.","계약의 목적물을 인도하지 아니하고 목적물의 가액 변동에 따른 차액을 금전으로 정산하는 파생상품의 거래로 인한 손익은 그 거래에서 정하는 대금결제일이 속하는 사업연도의 익금과 손금으로 한다."],
  answer:4, status:"clear", note:"" },
{ id:"2019-62", subject:"세법학개론", year:2019, no:62, law:"법인세법", unit:"익금과 익금불산입", kind:"calc",
  stem:"<법인세법> 비상장 영리내국법인인 (주)A와 (주)B의 자료를 이용하여 보통주 소각으로 인한 (주)A의 의제배당금액을 계산하면 얼마인가? (단, 주식 취득과 소각은 적법하였고, (주)B는 과거 합병사실이 없다. 주어진 자료 이외에는 고려하지 않음)\n\n(1) (주)A는 제19기(2019.1.1.~12.31.) 초 현재 (주)B의 보통주 600주(1주당 액면금액 1,000원)를 보유하고 있으며, 보통주 관련 거래는 다음과 같다.\nㅇ (주)A는 2016.4.1. (주)B의 보통주 400주를 1주당 시가인 1,500원에 취득하였음\nㅇ (주)A는 2017.5.2. (주)B가 주식발행초과금(출자전환으로 인한 채무면제이익이 아님)을 자본에 전입함에 따라 보통주 200주를 무상으로 취득하였음\nㅇ (주)A는 2017.7.1. (주)B가 법인세가 이미 과세된 자기주식처분이익을 자본에 전입함에 따라 보통주 400주를 무상으로 취득하였음\nㅇ (주)A는 2017.9.15. 보유중인 (주)B의 보통주 400주를 유상으로 처분하였음\n\n(2) (주)B는 2019.3.31. 보통주를 1주당 1,500원에 소각하였으며, 이로 인해 (주)A가 보유한 (주)B의 보통주 400주가 소각되었다.",
  choices:["200,000원","250,000원","400,000원","450,000원","600,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2019-63", subject:"세법학개론", year:2019, no:63, law:"법인세법", unit:"손금과 손금불산입", kind:"concept",
  stem:"<법인세법> 「법인세법」상 접대비에 관한 설명으로 옳지 않은 것은?",
  choices:["주주 또는 출자자나 임원 또는 직원이 부담하여야 할 성질의 접대비를 법인이 지출한 것은 접대비로 보지 않는다.","법인이 그 직원이 조직한 조합 또는 단체에 복리시설비를 지출한 경우 해당 조합이나 단체가 법인인 때에는 이를 접대비로 보며, 해당 조합이나 단체가 법인이 아닌 때에는 그 법인의 경리의 일부로 본다.","법인이 접대비를 금전 외의 자산으로 제공한 경우 해당 자산의 가액은 제공한 때의 장부가액과 시가 중 큰 금액으로 산정한다.","내국법인이 한 차례의 접대에 지출한 접대비 중 1만원(경조금은 10만원)을 초과하는 접대비로서 증명서류를 수취하지 않은 것은 전액 손금불산입하고 소득귀속자에 관계없이 기타사외유출로 처분한다.","재화 또는 용역을 공급하는 신용카드 등의 가맹점이 아닌 다른 가맹점의 명의로 작성된 매출전표 등을 발급받은 경우 해당 지출액은 신용카드 등을 사용하여 지출한 접대비로 보지 않는다."],
  answer:4, status:"clear", note:"" },
{ id:"2019-64", subject:"세법학개론", year:2019, no:64, law:"법인세법", unit:"감가상각비", kind:"concept",
  stem:"<법인세법> 내국법인 (주)A가 유형자산과 관련하여 행하는 활동에 관한 설명으로 옳지 않은 것은?",
  choices:["시험기기 1,000,000원과 가스기기 1,500,000원을 한 거래처에서 구입하면서 2,500,000원을 지급하고 비용으로 처리하는 경우 세법상 모두 손금으로 인정된다.","개인용 컴퓨터 2,000,000원과 전기기구 2,500,000원을 한 거래처에서 구입하면서 4,500,000원을 지급하고 비용으로 처리하는 경우 세법상 모두 손금으로 인정된다.","시설개체 또는 기술의 낙후로 인하여 생산설비의 일부를 폐기한 경우 당해 자산의 장부가액을 폐기일이 속하는 사업연도의 손금에 산입할 수 있다.","2년 전에 업무용 승용차의 타이어를 교체한 후 2019년 4월 1일 다시 전체적으로 타이어를 교체하기 위하여 지출한 600,000원은 수익적지출에 해당된다.","재무상태표상 직전사업연도 장부금액이 60,000,000원인 기계장치에 대한 자본적지출액 5,000,000원을 비용으로 처리할 경우 5,000,000원은 (주)A가 감가상각한 금액으로 의제하여 시부인한다."],
  answer:3, status:"clear", note:"" },
{ id:"2019-65", subject:"세법학개론", year:2019, no:65, law:"법인세법", unit:"부당행위계산의 부인", kind:"concept",
  stem:"<법인세법> 「법인세법」상 부당행위계산의 부인에 관한 설명으로 옳지 않은 것은?",
  choices:["내국법인의 행위 또는 소득금액의 계산이 특수관계인과의 거래로 인하여 그 법인의 소득에 대한 조세의 부담을 부당하게 감소시킨 것으로 인정되는 경우에는 그 법인의 행위 또는 소득금액의 계산과 관계없이 그 법인의 각 사업연도의 소득금액을 계산한다.","부당행위계산에 있어서의 시가란 건전한 사회통념 및 상관행과 특수관계인이 아닌 자 간의 정상적 거래에서 적용되거나 적용될 것으로 판단되는 가격을 말한다.","토지의 시가가 불분명한 경우로 「감정평가 및 감정평가사에 관한 법률」에 의한 감정평가업자가 감정한 가액이 2 이상인 경우에는 그 감정한 가액의 평균액을 적용한다.","특수관계인에 대한 금전 대여의 경우 대여기간이 5년을 초과하는 대여금이 있으면 해당 대여금에 한정하여 가중평균차입이자율을 시가로 한다.","특수관계인에게 자산을 무상 또는 시가보다 낮은 가액으로 양도하는 경우에는 시가와 거래가액의 차액이 3억원 이상이거나 시가의 100분의 5에 상당하는 금액 이상인 경우에 한하여 부당행위계산의 부인규정을 적용한다."],
  answer:4, status:"clear", note:"" },
{ id:"2019-66", subject:"세법학개론", year:2019, no:66, law:"법인세법", unit:"연결납세방식", kind:"concept",
  stem:"<법인세법> 「법인세법」상 연결납세제도에 관한 설명으로 옳지 않은 것을 모두 고른 것은?\n\nㄱ. 내국법인인 완전모법인과 그 다른 내국법인인 완전자법인은 완전모법인의 납세지 관할지방국세청장의 승인을 받아 연결납세방식을 적용할 수 있다.\nㄴ. 연결납세방식을 적용받으려는 내국법인과 해당 내국법인의 완전자법인은 최초의 사업연도 개시일부터 20일 이내에 연결납세방식 적용신청서를 해당 내국법인의 납세지 관할세무서장을 경유하여 관할지방국세청장에게 제출하여야 한다.\nㄷ. 같은 사업연도에 2 이상의 연결법인에서 발생한 결손금이 있는 경우에는 연결법인 간 균등하게 배분하여 결손금 공제를 할 수 있다.\nㄹ. 연결납세방식의 적용 승인이 취소된 연결법인은 취소된 날이 속하는 사업연도와 그 다음 사업연도의 개시일부터 4년 이내에 끝나는 사업연도까지는 연결납세방식의 적용 당시와 동일한 법인을 연결모법인으로 하여 연결납세방식을 적용받을 수 없다.\nㅁ. 각 연결사업연도의 기간이 6개월을 초과하는 연결모법인은 해당 연결사업연도 개시일부터 6개월간을 중간예납기간으로 하여 연결중간예납세액을 중간예납기간이 지난 날부터 2개월 이내에 납세지 관할 세무서등에 납부하여야 한다.",
  choices:["ㄱ, ㄴ","ㄴ, ㄷ","ㄹ, ㅁ","ㄴ, ㄷ, ㄹ","ㄷ, ㄹ, ㅁ"],
  answer:2, status:"clear", note:"" },
{ id:"2019-67", subject:"세법학개론", year:2019, no:67, law:"법인세법", unit:"세무조정과 소득처분", kind:"calc",
  stem:"<법인세법> 다음은 주권상장 내국법인 (주)A의 제19기(2019.1.1.~12.31.) 자료이다. 관련된 세무조정을 소득처분별로 합계한 것으로 옳은 것은? (단, 한국채택국제회계기준에 따른 회계처리는 적정하였으며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) (주)A는 2019년 초 (주)B의 주식을 20,000원에 취득하여 기타포괄손익인식금융자산으로 분류하였고, 제19기 말 공정가치인 25,000원으로 평가하여 다음과 같이 회계처리하였다.\n (차) 기타포괄손익인식금융자산 5,000원 (대) 금융자산평가이익 5,000원\n\n(2) (주)A는 2019.11.1. (주)C의 회사채(액면 10,000원)를 만기보유목적으로 8,000원에 취득하였고, 제19기 말에 다음과 같이 회계처리하였다.\n (차) 상각후원가측정금융자산 200원 (대) 이자수익 200원",
  choices:["세무조정 없음","익금산입·손금불산입 5,000원(유보) / 손금산입·익금불산입 5,200원(△유보)","익금산입·손금불산입 5,000원(유보) / 손금산입·익금불산입 200원(△유보)","익금산입·손금불산입 10,000원(기타) / 손금산입·익금불산입 200원(△유보)","익금산입·손금불산입 5,000원(기타) / 손금산입·익금불산입 5,200원(△유보)"],
  answer:5, status:"clear", note:"" },
{ id:"2019-68", subject:"세법학개론", year:2019, no:68, law:"법인세법", unit:"충당금과 준비금", kind:"calc",
  stem:"<법인세법> 다음은 제조업을 영위하는 영리내국법인 (주)A의 대손충당금에 관한 자료이다. 다음 자료를 이용하여 제19기(2019.1.1.~12.31.) 세무조정 시 각 사업연도소득금액에 미치는 영향금액은 얼마인가? (단, 전기 이전의 모든 세무조정은 적정하였고, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 대손충당금 변동\n가. 회사계상 대손충당금 내역\n기초잔액 20,000원 / 당기 상계액(감소) 10,000원 / 당기 설정액(증가) 16,000원 / 기말잔액 26,000원\n나. 당기 상계액 10,000원 중 4,000원은 거래처의 파산으로 회수불가능하다고 판단한 매출채권금액이며, 나머지 6,000원은 세법상 대손요건을 충족하지 않았지만 회사가 미수금에 대해 조기에 회수불능으로 판단하여 처리하였음\n다. 대손충당금 기초잔액 20,000원 중 대손충당금 한도초과액은 3,000원이다.\n\n구분 / 당기 말 / 전기 말\n매출채권 / 260,000원 / 160,000원\n미수금 / 100,000원 / 40,000원\n선급금 / 40,000원 / -\n구상채권 / 6,000원 / -\n\n(2) 회사계상 기말 자산 내역 중 일부\n가. 전기 말 채권 중 대손부인된 채권은 없음\n나. 미수금은 비품 처분과 관련된 것임\n다. 자회사의 채무보증으로 인하여 발생한 구상채권임",
  choices:["14,760원","14,880원","20,880원","21,050원","21,120원"],
  answer:3, status:"clear", note:"" },
{ id:"2019-69", subject:"세법학개론", year:2019, no:69, law:"법인세법", unit:"감가상각비", kind:"calc",
  stem:"<법인세법> 다음은 제조업을 영위하는 영리내국법인 (주)A의 제19기(2019.1.1.~12.31.) 감가상각과 관련된 자료이다. 관련된 세무조정과 소득처분으로 옳은 것은? (단, 전기 이전의 모든 세무조정은 적정하였으며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 기계장치 취득가액: 50,000,000원\n(2) 기계장치 취득일: 2017.1.1.\n(3) 감가상각방법 및 상각률: 정률법(상각률 : 0.45)\n(4) 감가상각비 장부상 계상금액\nㅇ 2017년 : 25,000,000원\nㅇ 2018년 : 10,000,000원\nㅇ 2019년 : 6,500,000원",
  choices:["세무조정 없음","손금산입·익금불산입 125,000원(△유보)","익금산입·손금불산입 306,250원(유보)","손금산입·익금불산입 306,250원(△유보)","손금산입·익금불산입 250,000원(△유보)"],

{ id:"2019-70", subject:"세법학개론", year:2019, no:70, law:"법인세법", unit:"합병 및 분할 특례", kind:"calc",
  stem:"<법인세법> (주)A는 (주)B를 흡수합병하고 2019.3.10. 합병등기를 하였다. 두 법인은 모두 영리내국법인으로 사업연도는 제19기(2019.1.1.~12.31.)이다. 다음의 자료를 이용하여 ㉠ 비적격합병이라 가정할 때의 (주)B의 양도손익에서 ㉡ 적격합병이라 가정할 때의 (주)B의 양도손익을 차감하면 얼마인가? (단, 전기 이전의 세무조정은 적정하였으며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 합병등기일 현재 (주)B의 재무상태표는 다음과 같다.\n[재무상태표]\n건물 150,000원 | 부채 100,000원 / 자본금 30,000원 / 자본잉여금 15,000원 / 이익잉여금 5,000원\n합계 150,000원 | 합계 150,000원\n\n(2) 합병등기일 현재 (주)B의 건물의 시가는 250,000원이었고, (주)A는 (주)B의 구주주에게 현금 15,000원과 주식(액면가액 75,000원, 시가 135,000원)을 교부하고, 다음과 같이 회계처리하였다.\n (차) 건물 250,000원 (대) 부채 100,000원 / 자본금 75,000원 / 주식발행초과금 60,000원 / 현금 15,000원",
  choices:["0원","50,000원","100,000원","150,000원","200,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2019-71", subject:"세법학개론", year:2019, no:71, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"calc",
  stem:"<부가가치세법> 2019년도에 발생한 다음 자료를 이용하여 (주)A(제조 및 수출 영위)의 2019년 제1기 과세기간(2019.1.1.~6.30.)의 부가가치세 과세표준을 계산하면 얼마인가? (단, 금액은 특별한 언급이 없는 한 부가가치세가 포함되지 않은 금액이며, 영세율 적용대상 거래의 경우 적용요건을 충족하고 있고, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 1월 1일 국내거래처에 AA제품을 20,000,000원에 장기할부로 매출하고 대금회수는 매년말 10,000,000원씩 2년 동안 회수하기로 하였다. 회사는 현재가치로 매출 17,355,400원과 현재가치할인차금 2,644,600원을 인식하였다. 1월 1일부터 6월 30일까지의 현재가치할인차금상각액은 867,770원이다. 부가가치세법상 공급시기에 세금계산서는 발행된다.\n(2) 2월 2일 국내거래처에 그 동안 실적에 따라 장려금 300,000원과 BB제품(원가 1,000,000원, 시가 1,500,000원)을 장려품으로 지급하였다.\n(3) 2018년 8월 10일에 국내거래처에 대하여 발생했던 매출채권을 2019년 3월 3일에 조기에 전액 회수하면서 매출채권의 10%에 해당하는 200,000원에 대해 매출할인을 실시하였다.\n(4) 4월 4일 미국거래처에 CC제품을 수출하고 대금 $1,000는 4월 10일에 수령하였으며 환전은 4월 12일에 하였다. 일자별 1달러 당 환율은 다음과 같다.\n구분 / 4월 4일 / 4월 10일 / 4월 12일\n기준환율 / 1,000원 / 1,010원 / 1,020원",
  choices:["1,800,000원","2,000,000원","2,300,000원","2,320,000원","2,500,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2019-72", subject:"세법학개론", year:2019, no:72, law:"부가가치세법", unit:"간이과세", kind:"calc",
  stem:"<부가가치세법> 문구 소매업과 의류 제조업을 겸영하고 있는 간이과세자인 甲의 2019년 과세기간(2019.1.1.~12.31.)의 거래내역이다. 신고서를 서면으로 제출할 경우 차가감납부세액(지방소비세 포함)은 얼마인가? (단, 모두 국내거래이며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 공급 내역\n① 소매업분: 공급대가 20,000,000원\n② 제조업분: 공급대가 30,000,000원\n③ 비품: 공급대가 10,000,000원(업종별 실지귀속을 구분할 수 없음)\n(2) 매입 내역\n① 소매업분: 공급가액 15,000,000원, 매입세액 1,500,000원\n② 제조업분: 공급가액 5,000,000원, 매입세액 500,000원\n③ 업종별 실지 귀속을 구분할 수 없는 매입분: 공급가액 3,000,000원, 매입세액 300,000원\n(3) 업종별 부가가치율\n① 업종별로 5%, 10%, 20%, 30%를 적용함\n② 소매업의 경우 10%, 제조업의 경우 20%임\n(4) 세금계산서는 적법하게 수취하였다.",
  choices:["548,000원","620,000원","662,000원","695,000원","705,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2019-73", subject:"세법학개론", year:2019, no:73, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"calc",
  stem:"<부가가치세법> 다음 자료에 의하여 제조업을 영위하는 일반과세자인 甲의 2019년 제1기 과세기간(2019.1.1.~6.30.)의 과세표준은 얼마인가? (단, 모두 국내거래이고, 금액에는 부가가치세가 포함되지 않았으며, 아래의 자료를 제외한 세무상 처리는 모두 적정하였음)\n\n거래일자 / 거래내용 / 금액\n4.11. / A제품을 乙에게 외상으로 공급함(대금은 2019.7.10.에 수령함) / 10,000,000원\n5.20. / 대가를 받지 않고 丙에게 A제품을 견본품으로 제공함 / 시가 100,000원, 원가 60,000원\n6.17. / A제품을 직원의 생일축하선물로 제공함 / 시가 150,000원, 원가 80,000원\n6.26. / 일주일 안으로 서면이나 구두로 매입동의 여부를 알려주기로 하고 시제품을 丁에게 인도함(2019.7.1. 상대방이 구두로 매입의사를 밝힘) / 700,000원\n6.27. / A제품을 戊에게 공급하기로 계약을 체결하였으나 戊가 일방적으로 이를 해제함에 따라 위약금으로 받은 금액 / 200,000원",
  choices:["10,000,000원","10,080,000원","10,150,000원","10,350,000원","10,990,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2019-74", subject:"세법학개론", year:2019, no:74, law:"부가가치세법", unit:"세금계산서 및 절차규정", kind:"concept",
  stem:"<부가가치세법> 「부가가치세법」상 환급에 관한 설명으로 옳지 않은 것은?",
  choices:["조기환급의 경우 환급세액은 조기환급 관련 신고기한이 지난 후 15일 이내에 환급하여야 한다.","일반과세자이든 간이과세자이든 환급규정이 적용된다.","납세지 관할 세무서장은 사업자가 「부가가치세법」상 영세율을 적용받는 경우에 해당하여 환급을 신고한 때에는 대통령령으로 정하는 바에 따라 사업자에게 환급세액을 조기환급할 수 있다.","사업자가 사업 설비를 신설·취득·확장 또는 증축하는 경우 조기환급은 세법상 감가상각자산에 한해 받을 수 있다.","조기환급이 아닌 경우의 환급세액은 확정신고한 사업자에게 확정신고기한이 지난 후 30일 이내에 환급하여야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"2019-75", subject:"세법학개론", year:2019, no:75, law:"부가가치세법", unit:"과세거래", kind:"concept",
  stem:"<부가가치세법> 「부가가치세법」상 재화의 공급으로 보는 경우에 해당하는 것은?",
  choices:["질권, 저당권 또는 양도담보의 목적으로 동산, 부동산 및 부동산상의 권리를 제공하는 것","사업장 별로 그 사업에 관한 모든 권리와 의무를 포괄적으로 승계시키는 사업의 양도","사업에 관한 모든 권리와 의무를 포괄적으로 승계시키는 사업의 양도로서 양수자가 승계받은 사업의 종류를 변경한 경우","「신탁법」에 따른 위탁자가 신탁재산을 수탁자의 명의로 매매하는 경우","사업용 자산을 「상속세 및 증여세법」에 따라 물납하는 경우"],
  answer:4, status:"clear", note:"" },
{ id:"2019-76", subject:"세법학개론", year:2019, no:76, law:"부가가치세법", unit:"부가가치세 총칙", kind:"concept",
  stem:"<부가가치세법> 「부가가치세법」상 사업장에 관한 설명으로 옳지 않은 것은?",
  choices:["사업장은 사업자가 사업을 하기 위하여 거래의 전부 또는 일부를 하는 고정된 장소로 한다.","사업장을 설치하지 아니하고 사업자등록도 하지 아니한 경우에는 과세표준 및 세액을 결정하거나 경정할 당시의 사업자의 주소 또는 거소를 사업장으로 한다.","광업의 경우 광업사무소의 소재지로 하되, 광업사무소가 광구(鑛區) 밖에 있을 때에는 그 광업사무소에서 가장 가까운 광구에 대하여 작성한 광업 원부의 맨 처음에 등록된 광구 소재지에 광업사무소가 있는 것으로 본다.","제조업의 경우 따로 제품 포장만을 하거나 용기에 충전만을 하는 장소와 「개별소비세법」 제10조의 5에 따른 저유소(貯油所)는 사업장에서 제외한다.","부동산상의 권리만 대여하는 부동산임대업의 경우에는 부동산의 등기부상 소재지를 사업장으로 하여야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"2019-77", subject:"세법학개론", year:2019, no:77, law:"부가가치세법", unit:"과세거래", kind:"concept",
  stem:"<부가가치세법> 「부가가치세법」상 부가가치세 과세대상에 해당하는 것은 모두 몇 개인가?\n\nㄱ. 소유재화의 파손, 훼손, 도난 등으로 인하여 가해자로부터 받는 손해배상금\nㄴ. 외상매출채권의 양도\nㄷ. 공동사업자 구성원이 각각 독립적으로 사업을 영위하기 위하여 공동사업용 건물의 분할등기(출자지분의 현물반환)로 소유권이 이전되는 건축물\nㄹ. 수표·어음 등의 화폐대용증권\nㅁ. 온라인 게임에 필요한 사이버 화폐인 게임머니를 계속적·반복적으로 판매하는 것\nㅂ. 재화 또는 용역에 대한 대가 관계가 없이 잔여 임대기간에 대한 보상으로서 받는 이주보상비",
  choices:["1개","2개","3개","4개","5개"],
  answer:2, status:"clear", note:"" },
{ id:"2019-78", subject:"세법학개론", year:2019, no:78, law:"부가가치세법", unit:"영세율과 면세", kind:"concept",
  stem:"<부가가치세법> 「부가가치세법」상 영세율에 관한 설명으로 옳지 않은 것은?",
  choices:["「관세법」에 따른 수입신고 수리 전의 물품으로서 보세구역에 보관하는 물품을 외국으로 반출할 경우(국내 사업장에서 계약과 대가 수령 등 거래가 이루어짐) 영세율 적용이 된다.","수출용 완제품을 공급한 후라도 내국신용장이 그 공급시기가 속하는 과세기간이 끝난 후 25일 이내에 개설된 경우에는 영세율이 적용된다.","국내사업장을 둔 사업자가 해외에서 도로건설 용역을 제공하는 경우 외화로 대금을 수령할 경우에만 영세율을 적용받는다.","선박 또는 항공기에 의한 외국항행용역의 공급은 영세율을 적용한다. 이 때, 외국항행용역에는 선박 또는 항공기에 의하여 여객이나 화물을 국내에서 국외로, 국외에서 국내로 또는 국외에서 국외로 수송하는 것을 포함한다.","「관광진흥법」 시행령에 따른 일반여행업자가 외국인 관광객에게 공급하는 관광알선용역(그 대가를 외국환은행에서 원화로 받았다)에는 영세율을 적용한다."],
  answer:3, status:"clear", note:"" },
{ id:"2020-41", subject:"세법학개론", year:2020, no:41, law:"국세기본법", unit:"납세의무", kind:"concept",
  stem:"<국세기본법> 「국세기본법」상 제2차 납세의무에 관한 설명으로 옳은 것은?",
  choices:["청산인의 제2차 납세의무의 한도는 그가 받은 보수의 총액이며, 잔여재산을 분배받은 자의 제2차 납세의무의 한도는 그가 받은 재산의 가액으로 한다.","사업이 양도·양수된 경우에 양도일 이전에 양도인의 납세의무가 확정된 그 사업에 관한 국세 및 체납처분비를 양도인의 재산으로 충당하여도 부족할 때에는 사업의 양수인은 그 부족한 금액에 대하여 제2차 납세의무를 진다. 이때 사업의 양수인은 양도인과 특수관계인인 자에 한한다.","법인의 재산으로 그 법인에 부과되거나 그 법인이 납부할 국세 및 체납처분비에 충당하여도 부족한 경우에는 그 국세의 납세의무 확정일 현재 무한책임사원 또는 과점주주는 그 부족한 금액에 대하여 제2차 납세의무를 진다.","법인의 주주 1인과 그의 자녀가 그 법인의 주주명부상 발행주식 총수의 100분의 50을 초과하는 경우 그들은 출자자의 제2차 납세의무를 부담하는 과점주주에 해당한다.","정부가 국세의 납부기간 만료일 현재 법인의 과점주주인 출자자의 소유주식을 재공매하거나 수의계약으로 매각하려 하여도 매수희망자가 없는 경우 그 법인은 그 출자자가 납부할 국세 및 체납처분비에 대한 제2차 납세의무를 부담하지 아니한다."],
  answer:5, status:"clear", note:"" },
{ id:"2020-42", subject:"세법학개론", year:2020, no:42, law:"국세기본법", unit:"국세기본법 총칙", kind:"concept",
  stem:"<국세기본법> 「국세기본법」상 관할 세무서장에게 신청 후 승인을 받은 '법인으로 보는 단체'에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 공익을 목적으로 출연된 기본재산이 있는 재단으로서 등기되지 아니할 것을 요건으로 한다.\nㄴ. 주무관청의 허가를 받아 설립된 단체로서 등기되지 아니할 것을 요건으로 한다.\nㄷ. 단체의 수익을 구성원에게 분배할 것을 요건으로 한다.\nㄹ. 단체 자신의 계산과 명의로 수익과 재산을 독립적으로 소유·관리할 것을 요건으로 한다.\nㅁ. 관할 세무서장의 승인을 받은 날이 속하는 과세기간과 그 과세기간이 끝난 날부터 3년이 되는 날이 속하는 과세기간까지는 원칙적으로 「소득세법」에 따른 거주자 또는 비거주자로 변경할 수 없다.\nㅂ. 단체의 조직과 운영에 관한 규정을 가지고 대표자나 관리인을 선임하고 있을 것을 요건으로 한다.",
  choices:["ㄱ, ㄷ, ㅁ","ㄹ, ㅁ, ㅂ","ㄱ, ㄴ, ㄷ, ㅂ","ㄱ, ㄴ, ㄹ, ㅂ","ㄴ, ㄷ, ㄹ, ㅁ"],
  answer:2, status:"clear", note:"" },
{ id:"2020-43", subject:"세법학개론", year:2020, no:43, law:"국세기본법", unit:"국세부과와 세법 적용", kind:"concept",
  stem:"<국세기본법> 「국세기본법」상 국세부과의 제척기간에 관한 설명으로 옳은 것은?",
  choices:["원칙적인 부과제척기간이 지났더라도 「행정소송법」에 따른 소송에 대한 판결이 확정된 경우 지방국세청장 또는 세무서장은 그 확정된 날부터 1년이 지나기 전까지 경정이나 그 밖에 필요한 처분을 할 수 있다.","과세표준과 세액을 신고하는 국세(신고하는 종합부동산세는 제외)의 제척기간 기산일은 해당 국세의 과세표준신고기한(예정신고기한 포함)의 다음 날로 한다.","조세쟁송에 대한 결정 또는 판결에서 명의대여 사실이 확인되는 경우 그 결정 또는 판결이 확정된 날부터 2년이 지나기 전까지는 명의자에 대한 부과처분을 취소하고 실제로 사업을 경영한 자에게 경정이나 그 밖에 필요한 처분을 할 수 있다.","원칙적인 부과제척기간이 끝난 날이 속하는 과세기간 이후의 과세기간에 「법인세법」에 따라 이월결손금을 공제하는 경우 그 결손금이 발생한 과세기간의 법인세의 부과제척기간은 이월결손금을 공제한 과세기간의 법정신고기한으로부터 2년으로 한다.","부담부증여에 따라 증여세와 함께 양도소득세가 과세되는 때에 납세자가 법정신고기한까지 소득세 과세표준신고서를 제출하지 아니한 경우 그 양도소득세의 부과제척기간은 7년으로 한다."],
  answer:1, status:"clear", note:"" },
{ id:"2020-44", subject:"세법학개론", year:2020, no:44, law:"국세기본법", unit:"납세자의 권리", kind:"concept",
  stem:"<국세기본법> 「국세기본법」상 재조사 금지에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["2개 이상의 과세기간과 관련하여 잘못이 있는 경우 같은 세목 및 같은 과세기간에 대하여 재조사를 할 수 없다.","국세환급금의 결정을 위한 확인조사를 하는 경우 같은 세목 및 같은 과세기간에 대하여 재조사를 할 수 없다.","세무공무원의 조사행위가 국세청의 사무처리규정에 따라 실시한 사업장 현지확인이더라도 재조사가 금지되는 세무조사에 해당할 수 있다.","재조사의 허용사유인 '조세탈루의 혐의를 인정할 만한 명백한 자료가 있는 경우'란 조세의 탈루사실이 확인될 상당한 정도의 개연성이 있는 경우를 말하며 객관성과 합리성이 뒷받침되는 자료는 필요하지 않다.","서울지방국세청이 실시한 세무조사에서 작성하거나 취득한 과세자료의 처리를 위해 종로세무서는 같은 세목 및 같은 과세기간에 대하여 재조사를 할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"2020-45", subject:"세법학개론", year:2020, no:45, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"<국세징수법> 「국세징수법」상 압류를 즉시 해제하여야 하는 경우를 모두 고른 것은?\n\nㄱ. 압류에 관계되는 체납액의 일부가 충당된 경우\nㄴ. 제3자가 체납자를 상대로 소유권에 관한 소송을 제기하여 승소 판결을 받고 그 사실을 증명한 경우\nㄷ. 공매의 중지로 압류할 필요가 없게 된 경우\nㄹ. 체납자가 압류할 수 있는 다른 재산을 제공하여 그 재산을 압류한 경우\nㅁ. 압류 후 재산가격이 변동하여 체납액 전액을 현저히 초과한 경우\nㅂ. 압류한 재산에 대하여 제3자가 매각 5일 전까지 소유자로 확인할 만한 증거서류를 제출하고 그 소유권 주장이 상당한 이유가 있다고 인정하는 경우",
  choices:["ㄱ, ㄹ, ㅁ","ㄴ, ㄷ, ㅂ","ㄷ, ㄹ, ㅂ","ㄱ, ㄴ, ㄹ, ㅁ","ㄴ, ㄷ, ㅁ, ㅂ"],
  answer:2, status:"clear", note:"" },
{ id:"2020-46", subject:"세법학개론", year:2020, no:46, law:"국세징수법", unit:"신고납부, 납부고지 등", kind:"concept",
  stem:"<국세징수법> 「국세징수법」상 징수유예에 관한 설명으로 옳지 않은 것은?",
  choices:["납세자가 도난으로 재산에 심한 손실을 입은 경우 징수유예 사유에 해당한다.","납세자와 함께 사는 어머니가 질병으로 장기치료가 필요한 경우 징수유예 사유에 해당한다.","주소·거소·영업소 또는 사무소가 분명하지 아니하여 납세고지서를 송달할 수 없어서 징수를 유예하는 경우 그 징수유예의 기간은 그 유예한 날의 다음 날부터 30일 이내로 한다.","세무서장은 납기 시작 전에 징수를 유예하였더라도 해당 납세자가 국세와 체납액을 지정된 기한까지 납부하지 않을 경우 그 징수유예를 취소하고 유예에 관계되는 국세 또는 체납액을 한꺼번에 징수할 수 있다.","세무서장은 고지된 국세의 징수를 유예한 기간 중에 그 유예한 국세 또는 체납액에 대하여 교부청구를 할 수 없다."],
  answer:5, status:"clear", note:"" },
{ id:"2020-47", subject:"세법학개론", year:2020, no:47, law:"국세징수법", unit:"국세징수법 보칙", kind:"concept",
  stem:"<국세징수법> 「국세징수법」상 납세증명서에 관한 설명으로 옳은 것은?",
  choices:["납세증명서는 징수유예액, 체납처분유예액, 압류된 재산의 환가유예에 관련된 체납액을 포함하여 발급일 현재 납세자가 체납액이 없다는 사실을 증명한다.","국세에 대한 납부의무가 있는 외국인이 출국하거나 내국인이 해외이주 목적으로 「해외이주법」에 따라 외교부장관에게 해외이주신고를 하는 경우에는 납세증명서를 제출하여야 한다.","국세 체납처분에 따른 채권 압류로 세무서장이 국가로부터 대금을 지급받는 경우에도 납세증명서를 제출하여야 한다.","국가로부터 대금을 지급받는 경우로서 채권양도에 의하여 대금을 지급받는 자가 원래의 계약자 외의 자인 경우에는 해당 채권의 양도인뿐만 아니라 양수인의 납세증명서를 함께 제출하여야 한다.","발급일 현재 해당 신청인에게 고지된 국세가 있는 경우를 포함하여 납세증명서 유효기간은 그 증명서를 발급한 날부터 30일간으로 한다."],
  answer:4, status:"clear", note:"" },
{ id:"2020-48", subject:"세법학개론", year:2020, no:48, law:"국세징수법", unit:"신고납부, 납부고지 등", kind:"concept",
  stem:"<국세징수법> 「국세징수법」상 국세의 징수절차에 관한 설명으로 옳지 않은 것은?",
  choices:["세무서장이 납세자에게 발급하는 납세고지서에는 국세의 과세기간, 세목, 세액 및 그 산출근거, 납부기한과 납부장소를 기재하여야 한다.","납세자가 지방세의 체납으로 체납처분을 받을 때에는 세무서장은 납기 전이라도 그 납세자의 납세의무가 이미 확정된 국세를 징수할 수 있다.","세무서장이 양도담보권자로부터 납세자의 체납액을 징수하기 위해 양도담보권자에게 납부고지를 할 경우 양도담보권자의 주소 또는 거소를 관할하는 세무서장과 납세자에게도 그 사실을 통보하여야 한다.","세법에 따라 기간을 정하여 징수유예한 경우 징수유예기간이 끝난 날에 납세고지서를 발급하여야 한다.","세무서장이 제2차 납세의무자에게 납세자의 체납액을 징수하기 위해 납부통지서로 고지할 경우 납세자에게도 그 사실을 통지하여야 한다."],
  answer:4, status:"clear", note:"" },
{ id:"2020-49", subject:"세법학개론", year:2020, no:49, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"<조세범처벌법> 「조세범처벌법」상 조세범처벌에 관한 설명으로 옳은 것은?",
  choices:["원천징수의무자가 원천징수를 하지 아니하였을 경우보다 원천징수한 세금을 납부하지 아니하였을 경우의 법정(法定) 형량이 더 크다.","개인의 사용인이 그 개인의 업무에 관하여 「조세범처벌법」에서 규정하는 범칙행위를 하여 징역형을 과한 경우 그 개인에게도 징역형을 과할 수 있다.","「조세범처벌법」에 따른 범칙행위에 대해서는 국세청장, 지방국세청장 또는 세무서장의 고발이 없더라도 포탈세액이 5억원 이상인 경우 검사는 공소를 제기할 수 있다.","조세의 회피 또는 강제집행의 면탈을 목적으로 타인의 성명을 사용하여 사업자등록을 하는 경우 공소시효는 10년이 지나면 완성된다.","납세의무자의 재산을 점유하는 자가 체납처분의 집행을 면탈하게 할 목적으로 그 재산을 은닉하였을 때에는 1년 이하의 징역 또는 1천만원 이하의 벌금에 처한다."],
  answer:1, status:"clear", note:"" },
{ id:"2020-50", subject:"세법학개론", year:2020, no:50, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"<조세범처벌법> 「조세범처벌법」상 징역형과 벌금형을 병과할 수 있는 경우가 아닌 것은?",
  choices:["사기나 그 밖의 부정한 행위로써 1억원 미만의 조세의 환급을 받은 경우","재화 또는 용역을 공급받지 아니하고 「부가가치세법」에 따른 매출·매입처별 세금계산서합계표를 거짓으로 기재하여 제출한 경우","「국제조세조정에 관한 법률」에 따른 해외금융계좌정보의 신고의무자로서 정당한 사유 없이 신고기한 내에 신고하지 아니한 금액이 50억원을 초과한 경우","납세의무자를 대리하여 세무신고를 하는 자가 조세의 부과 또는 징수를 면하게 하기 위하여 타인의 조세에 관하여 거짓으로 신고한 경우","재화 또는 용역을 공급하지 아니하고 「소득세법」 및 「법인세법」에 따른 매출·매입처별 계산서합계표를 거짓으로 기재하여 제출한 경우"],
  answer:4, status:"clear", note:"" },
{ id:"2020-51", subject:"세법학개론", year:2020, no:51, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"concept",
  stem:"<소득세법> 내국법인 (주)A에 근무하는 거주자의 소득세법령상 근로소득에 관한 설명으로 옳지 않은 것은?",
  choices:["거주자 甲(일용근로자 아님)의 근로소득금액을 계산할 때 총급여액에서 공제되는 근로소득공제액의 한도는 2천만원이다.","「법인세법」에 따라 상여로 처분된 금액은 근로소득으로 한다.","일용근로자 乙의 근로소득은 종합소득과세표준을 계산할 때 합산하지 아니한다.","「산업재해보상보험법」에 따라 수급권자가 받는 휴업급여는 비과세소득이지만, 「고용보험법」에 따라 받는 육아휴직급여는 과세대상 근로소득이다.","퇴직함으로써 받는 소득으로서 퇴직소득에 속하지 아니하는 소득은 근로소득으로 한다."],
  answer:4, status:"clear", note:"" },
{ id:"2020-52", subject:"세법학개론", year:2020, no:52, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"concept",
  stem:"<소득세법> 「소득세법」상 거주자의 연금소득에 관한 설명으로 옳지 않은 것은?",
  choices:["「산업재해보상보험법」에 따라 받는 각종 연금은 비과세소득이다.","공적연금소득의 수입시기는 공적연금 관련법에 따라 연금을 지급받기로 한 날로 한다.","연금계좌의 운용실적에 따라 증가된 금액을 연금계좌에서 연금외수령한 소득은 그 소득의 성격에 따라 이자 또는 배당소득으로 본다.","연금소득금액은 「소득세법」에 정한 총연금액에서 연금소득공제를 적용한 금액으로 한다.","공적연금소득을 지급하는 자가 연금소득의 일부 또는 전부를 지연하여 지급하면서 지연지급에 따른 이자를 함께 지급하는 경우 해당 이자는 공적연금소득으로 본다."],
  answer:3, status:"clear", note:"" },
{ id:"2020-53", subject:"세법학개론", year:2020, no:53, law:"소득세법", unit:"소득세 총칙", kind:"concept",
  stem:"<소득세법> 「소득세법」상 비과세소득에 해당하는 것을 모두 고른 것은? (단, 거주자의 2020년 귀속 소득이며, 조림기간, 전통주 및 민박은 소득세법령에 정한 해당 요건을 충족하고 각 내용은 상호 독립적임)\n\nㄱ. 밭을 작물 생산에 이용하게 함으로써 발생한 소득금액 5천 5백만원\nㄴ. 한국표준산업분류에 따른 연근해어업에서 발생한 소득금액 5천만원(2020.7.1. 이후 발생분)\nㄷ. 조림기간 5년 이상인 임지의 임목의 양도로 발생한 소득금액 5백만원\nㄹ. 「수도권정비계획법」 제2조 제1호에 따른 수도권 지역에서 전통주를 제조함으로써 발생한 소득금액 1천 3백만원\nㅁ. 농민이 부업으로 민박을 운영하면서 발생한 소득금액 2천만원",
  choices:["ㄱ, ㄷ, ㅁ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㅁ","ㄱ, ㄴ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ, ㅁ"],
  answer:3, status:"clear", note:"" },
{ id:"2020-54", subject:"세법학개론", year:2020, no:54, law:"소득세법", unit:"사업소득", kind:"concept",
  stem:"<소득세법> 「소득세법」상 거주자의 주택임대소득의 과세에 관한 설명으로 옳지 않은 것은? (단, 소득세법령에 정한 해당 요건을 모두 충족하며, 공동소유 및 공동사업자인 경우는 고려하지 않음)",
  choices:["해당 과세기간에 주거용 건물 임대업에서 발생한 총수입금액의 합계액이 2천만원 이하인 자의 주택임대소득은 주택임대소득에 대한 세액 계산의 특례가 적용된다.","1개의 주택을 소유하는 자(부부 합산 제외)의 주택임대소득은 소득세를 과세하지 아니하지만, 과세기간 종료일 또는 해당 주택의 양도일 현재 기준시가가 9억원을 초과하는 주택 및 국외에 소재하는 주택의 임대소득은 제외한다.","주택을 대여하고 보증금 등을 받은 경우에는 3주택(법령에 정한 요건을 충족한 주택 제외) 이상을 소유하고 해당 주택의 보증금 등의 합계액이 3억원을 초과하는 경우에는 총수입금액 계산의 특례가 적용된다.","임차 또는 전세받은 주택을 전대하거나 전전세하는 경우에는 당해 임차 또는 전세받은 주택을 임차인 또는 전세받은 자의 주택으로 계산한다.","등록임대주택의 임대사업에서 발생한 사업소득금액은 총수입금액에서 필요경비(총수입금액의 100분의 60)를 차감한 금액으로 하되, 분리과세 주택임대소득을 제외한 해당 과세기간의 종합소득금액이 2천만원 이하인 경우에는 추가로 200만원을 차감한 금액으로 한다."],
  answer:5, status:"clear", note:"" },
{ id:"2020-55", subject:"세법학개론", year:2020, no:55, law:"소득세법", unit:"퇴직소득세", kind:"calc",
  stem:"<소득세법> 영리내국법인 (주)A의 대표이사인 거주자 甲은 2020년 12월 31일에 (주)A를 퇴사하였다. 甲이 사용자 부담금을 기초로 하여 현실적인 퇴직을 원인으로 지급받은 소득이 150,000,000원일 경우 다음 자료에 의한 甲의 「소득세법」상 퇴직소득금액은? (단, 임원, 총급여 및 근무기간은 소득세법령의 요건을 충족하며, 비과세소득은 없음)\n\n(1) 근무기간: 2016.1.1.~2020.12.31. (대표이사로 근무함)\n(2) 기간별로 산정한 甲의 총급여의 연평균 환산액\n기간 / 해당 기간 동안 총급여의 연평균 환산액\n2016.1.1.~2020.12.31. / 89,000,000원\n2017.1.1.~2019.12.31. / 90,000,000원\n2018.1.1.~2020.12.31. / 100,000,000원\n2020.1.1.~2020.12.31. / 110,000,000원",
  choices:["89,000,000원","100,000,000원","130,000,000원","133,500,000원","150,000,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2020-56", subject:"세법학개론", year:2020, no:56, law:"소득세법", unit:"이자소득과 배당소득", kind:"calc",
  stem:"<소득세법> 다음은 거주자 甲이 국내에서 지급받은 2020년 귀속 금융소득 관련 자료이다. 「소득세법」상 2020년 귀속 금융소득에 대하여 원천징수되는 소득세액은? (단, 甲은 출자공동사업자가 아니며 금융소득은 소득세법령에 따른 실지명의가 확인된 것이고 이자소득 또는 배당소득 원천징수시기에 대한 특례, 원천징수의 배제, 집합투자기구 및 특정금전신탁 등의 원천징수 특례는 고려하지 않음)\n\n구분 / 금액 / 비고\n공익신탁의 이익 / 5,000,000원 / 「공익신탁법」에 따른 공익신탁임\n회사채의 이자 / 10,000,000원 / 내국법인이 2019년에 발행한 회사채(만기 10년)임\n보증금 및 경락대금에서 발생한 이자소득 / 10,000,000원 / 「민사집행법」 제113조 및 같은 법 제142조에 따라 법원에 납부한 보증금 및 경락대금임\n정기예금의 이자 / 10,000,000원 / 국내은행으로부터 지급받음\n비영업대금의 이익 / 5,000,000원 / 개인 간 금전대차거래로서 차입자로부터 직접 지급받은 이자임\n내국법인으로부터 받은 현금배당 / 10,000,000원 /\n합계 / 50,000,000원 /",
  choices:["6,300,000원","6,850,000원","7,000,000원","7,200,000원","8,600,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2020-57", subject:"세법학개론", year:2020, no:57, law:"소득세법", unit:"양도소득세", kind:"calc",
  stem:"<소득세법> 2020년 6월 1일 거주자 甲은 국내소재 주택(1세대 1주택으로 등기자산임)을 10억원에 양도하였다. 양도시점에 양도비용은 10,000,000원이 발생하였다. 해당 주택의 취득당시 기준시가는 2억원이며 양도당시 기준시가는 5억원이다. 취득당시 실지거래가액, 매매사례가액과 감정가액은 확인되지 않는다. 甲이 해당 주택의 취득당시 소유권 확보를 위하여 직접 소요된 소송비용 등은 20,000,000원이고 자본적 지출액은 10,000,000원이며, 모두 소득세법령이 정한 필요경비의 요건을 충족한다. 甲의 해당 주택의 보유 및 거주기간은 11년 1개월인 경우 해당 주택의 양도소득금액은? (단, 장기보유 특별공제의 적용요건을 충족하고, 양도소득의 필요경비 계산특례 및 부당행위계산의 대상이 아니며, 주어진 자료 외의 사항은 고려하지 않음)",
  choices:["11,880,000원","20,790,000원","54,648,000원","100,850,000원","118,800,000원"],
  answer:1, status:"clear", note:"" },
{ id:"2020-58", subject:"세법학개론", year:2020, no:58, law:"소득세법", unit:"소득금액 계산 및 세액계산 특례", kind:"concept",
  stem:"<소득세법> 「소득세법」상 거주자의 소득금액계산의 특례와 납세의무의 범위에 관한 설명으로 옳지 않은 것은? (단, 출자공동사업자, 연금외수령, 사업자, 주된 공동사업자 및 손익분배비율은 소득세법령의 요건을 충족하며, 비거주자 등과의 거래에 대한 소득금액 계산의 특례는 고려하지 않음)",
  choices:["부당행위계산의 부인규정이 적용되는 종합소득은 출자공동사업자의 손익분배비율에 해당하는 배당소득, 사업소득 또는 기타소득이 해당된다.","사업소득이 발생하는 사업을 공동으로 경영하고 그 손익을 분배하는 공동사업(경영에 참여하지 아니하고 출자만 하는 출자공동사업자가 있는 공동사업을 포함)의 경우에는 해당 사업을 경영하는 장소인 공동사업장을 1거주자로 보아 공동사업장별로 그 소득금액을 계산한다.","연금계좌의 가입자가 사망하였으나 그 배우자가 연금외수령 없이 해당 연금계좌를 상속으로 승계하는 경우에는 해당 연금계좌에 있는 피상속인의 소득금액은 상속인의 소득금액으로 보아 소득세를 계산한다.","사업자가 비치·기록한 장부에 의하여 해당 과세기간의 사업소득금액을 계산할 때 발생한 결손금(주거용 건물 임대업 외의 부동산임대업에서 발생한 금액 제외)은 그 과세기간의 종합소득과세표준을 계산할 때 근로소득금액·연금소득금액·이자소득금액·기타소득금액·배당소득금액에서 순서대로 공제한다.","주된 공동사업자에게 합산과세되는 경우 그 합산과세되는 소득금액에 대해서는 주된 공동사업자의 특수관계인은 손익분배비율에 해당하는 그의 소득금액을 한도로 주된 공동사업자와 연대하여 납세의무를 진다."],
  answer:4, status:"clear", note:"" },
{ id:"2020-59", subject:"세법학개론", year:2020, no:59, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"calc",
  stem:"<소득세법> 다음은 거주자 甲의 2020년 귀속 소득 관련 자료이다. 「소득세법」상 종합소득에 합산되는 소득금액에 대하여 원천징수되는 소득세액은? (단, 모두 국내에서 지급받은 것으로 일시적·우발적으로 발생하였으며, 필요경비는 확인되지 않고 주어진 자료 외의 사항은 고려하지 않음)\n\n(1) 계약의 위약으로 인하여 받은 위약금 중 주택입주 지체상금(계약금이 위약금으로 대체되지 않음): 10,000,000원\n(2) 영업권을 기계장치와 함께 양도함에 따라 받은 대가: 5,000,000원\n(3) 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」 제4조에 따른 공익사업과 관련하여 지상권을 설정함으로써 발생하는 소득: 3,000,000원\n(4) 부동산매매계약의 해약으로 계약금이 위약금으로 대체된 금액: 12,000,000원",
  choices:["640,000원","1,040,000원","1,440,000원","2,640,000원","3,202,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2020-60", subject:"세법학개론", year:2020, no:60, law:"소득세법", unit:"종합소득 세액계산", kind:"calc",
  stem:"<소득세법> 다음은 「소득세법」상 근로소득이 있는 거주자 甲이 지출한 2020년 교육비 자료이다. 이 자료에 의해 계산한 교육비세액공제액은? (단, 甲은 일용근로자가 아니며, 가족 모두 기본공제대상자이고 학자금 대출을 받지 아니함)\n\n(1) 甲의 2020년 귀속 총급여액: 100,000,000원임\n(2) 본인: 대학원(4학기 교육과정) 수업료 10,000,000원을 지출하였으며, 이 중 회사에서 3,000,000원의 학자금(소득세 비과세)을 지원받음\n(3) 배우자: 대학원(4학기 교육과정) 수업료 7,000,000원을 지출함\n(4) 아들(15세 중학생): 「초·중등교육법」 제2조에 따른 학교에서 실시하는 방과 후 학교 수업료 1,500,000원 및 교복구입비용 700,000원을 지출함\n(5) 딸(5세): 「유아교육법」 제2조 제2호에 따른 유치원 수업료 2,200,000원 및 특별활동비 1,800,000원을 지출함",
  choices:["1,630,000원","1,750,000원","1,800,000원","1,950,000원","2,105,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2020-61", subject:"세법학개론", year:2020, no:61, law:"법인세법", unit:"자산과 부채의 평가", kind:"concept",
  stem:"<법인세법> 「법인세법」상 영리내국법인이 보유하는 자산에 대한 평가손실을 허용하지 않는 경우는?",
  choices:["「보험업법」이나 그 밖의 법률에 따른 유형자산의 평가로 장부가액을 감액한 경우","주권상장법인이 발행한 주식으로서 주식의 발행법인이 부도가 발생한 경우","유형자산으로서 천재지변·화재 등의 사유로 파손되거나 멸실된 경우","재고자산으로서 파손·부패 등의 사유로 정상가격으로 판매할 수 없는 경우","주권상장법인이 발행한 주식으로서 그 주식의 발행법인이 「기업구조조정촉진법」에 따른 부실징후기업이 된 경우"],
  answer:1, status:"clear", note:"" },
{ id:"2020-62", subject:"세법학개론", year:2020, no:62, law:"법인세법", unit:"세무조정과 소득처분", kind:"concept",
  stem:"<법인세법> 「법인세법」상 소득처분에 관한 설명으로 옳지 않은 것은?",
  choices:["소득처분은 각 사업연도 소득에 대한 법인세 납세의무가 있는 영리법인뿐만 아니라 비영리내국법인과 비영리외국법인에 대하여도 적용된다.","사외유출된 금액의 귀속자가 법인으로써 그 분여된 이익이 내국법인 또는 외국법인의 국내사업장의 각 사업연도의 소득을 구성하는 경우 기타사외유출로 처분한다.","내국법인이 국세기본법상 수정신고기한 내에 매출누락, 가공경비 등 부당하게 사외유출된 금액을 회수하고 세무조정으로 익금에 산입하여 신고하는 경우 기타사외유출로 처분한다.","법령으로 정하는 채권자가 불분명한 사채의 이자(동 이자에 대한 원천징수세액은 제외)는 대표자에 대한 상여로 처분하고 익금에 산입한 이자·할인액 또는 차익에 대한 원천징수세액에 상당하는 금액은 기타사외유출로 처분한다.","사외유출된 금액의 귀속이 불분명하여 대표자(법령이 정하는 대표자로 함)에게 귀속된 것으로 처분한 경우 당해 법인이 그 처분에 따른 소득세 등을 대납하고 이를 손비로 계상하거나 그 대표자와의 특수관계가 소멸될 때까지 회수하지 아니함에 따라 익금에 산입한 금액은 기타사외유출로 처분한다."],
  answer:3, status:"clear", note:"" },
{ id:"2020-63", subject:"세법학개론", year:2020, no:63, law:"법인세법", unit:"손금과 손금불산입", kind:"concept",
  stem:"<법인세법> 「법인세법」상 영리내국법인의 지급이자 손금불산입에 관한 설명으로 옳지 않은 것은?",
  choices:["지급이자의 손금불산입 규정이 동시에 적용되는 경우 부인 순서는 채권자가 불분명한 사채의 이자, 지급받은 자가 불분명한 채권·증권의 이자·할인액 또는 차익, 건설자금에 충당한 차입금의 이자, 업무무관자산 등에 대한 지급이자의 순으로 부인한다.","건설자금이자와 관련하여 특정차입금의 일부를 운영자금에 전용한 경우에는 그 부분에 상당하는 지급이자는 이를 손금으로 한다.","업무무관자산 등에 대한 지급이자 부인 시 직원에 대한 월정급여액의 범위에서의 일시적인 급료의 가불금은 업무무관가지급금의 범위에서 제외된다.","지급이자가 손금부인되는 지급받은 자가 불분명한 채권·증권의 이자·할인액 또는 차익이란 당해 채권 또는 증권의 발행법인이 직접 지급하는 경우 그 지급사실이 객관적으로 인정되지 아니하는 이자·할인액 또는 차익을 말한다.","지급이자가 손금부인되는 채권자가 불분명한 사채의 이자에는 거래일 현재 주민등록표에 의하여 그 거주사실 등이 확인된 채권자가 차입금을 변제받은 후 소재불명이 된 경우의 차입금에 대한 이자도 포함된다."],
  answer:5, status:"clear", note:"" },
{ id:"2020-64", subject:"세법학개론", year:2020, no:64, law:"법인세법", unit:"충당금과 준비금", kind:"concept",
  stem:"<법인세법> 「법인세법」상 손금으로 인정하는 대손금에는 해당 사유가 발생한 날이 속하는 사업연도의 손금으로 산입하는 것과 해당 사유가 발생하여 손비로 계상한 날이 속하는 사업연도의 손금으로 산입하는 것의 2가지로 분류된다. 이 분류를 적용할 경우 다음 중 성격이 다른 하나는? (단, 영리내국법인을 가정함)",
  choices:["「민사집행법」 제102조에 따라 채무자의 재산에 대한 경매가 취소된 압류채권","「민사소송법」에 따른 화해에 따라 회수불능으로 확정된 채권","중소기업의 외상매출금으로서 부도발생일부터 6개월 이상 지난 어음상의 채권(부도발생일 이전의 것으로서 해당 법인이 채무자의 재산에 대하여 저당권을 설정하고 있지 않음)","중소기업의 외상매출금으로서 회수기일이 2년 이상 지난 것(단, 특수관계인과의 거래로 인하여 발생한 외상매출금은 제외함)","회수기일이 6개월 이상 지난 채권 중 채권가액이 30만원 이하(채무자별 채권가액의 합계액을 기준으로 함)인 채권"],
  answer:1, status:"clear", note:"" },
{ id:"2020-65", subject:"세법학개론", year:2020, no:65, law:"법인세법", unit:"합병 및 분할 특례", kind:"concept",
  stem:"<법인세법> 「법인세법」상 영리내국법인의 합병 및 분할 등에 관한 설명으로 옳지 않은 것은? (단, 「조세특례제한법」은 고려하지 않음)",
  choices:["적격합병의 경우 피합병법인이 합병법인으로부터 받은 양도가액을 피합병법인의 합병등기일 현재의 순자산 장부가액으로 보아 양도손익이 없는 것으로 할 수 있다.","적격합병의 경우 합병법인이 승계한 피합병법인의 결손금은 피합병법인으로부터 승계받은 사업에서 발생한 소득금액의 범위에서 합병법인의 각 사업연도의 과세표준을 계산할 때 공제한다.","적격합병의 경우 합병법인은 피합병법인의 자산을 장부가액으로 양도받은 것으로 한다. 이 경우 장부가액과 시가와의 차액을 법령으로 정하는 바에 따라 자산별로 계상하여야 한다.","합병 시 피합병법인의 대손충당금 관련 세무조정사항의 승계는 적격합병의 요건을 갖추고, 대손충당금에 대응하는 채권이 합병법인에게 함께 승계되는 경우에만 가능하다.","합병법인이 합병등기일이 속하는 사업연도의 종료일까지 피합병법인으로부터 승계받은 사업을 계속 영위하는 것도 적격합병의 요건 중 하나이다."],
  answer:4, status:"clear", note:"" },
{ id:"2020-66", subject:"세법학개론", year:2020, no:66, law:"법인세법", unit:"자산과 부채의 평가", kind:"calc",
  stem:"<법인세법> 다음은 영리내국법인 (주)한국의 제3기 사업연도(2020.1.1.~12.31.)의 기말 재고자산 평가와 관련한 자료이다. 제3기말 세무상 재고자산평가액은? (단, 주어진 자료 이외에는 고려하지 않음)\n\n구분 / 장부상 평가액 / 후입선출법 / 총평균법 / 선입선출법\n제품 / 10,000,000원 / 7,000,000원 / 8,700,000원 / 10,000,000원\n재공품 / 5,000,000원 / 4,500,000원 / 4,800,000원 / 5,000,000원\n원재료 / 3,000,000원 / 2,700,000원 / 3,000,000원 / 3,500,000원\n저장품 / 1,500,000원 / 1,000,000원 / 1,200,000원 / 1,400,000원\n\n(1) 법인의 설립일이 속하는 사업연도의 법인세 과세표준 신고기한까지 관할세무서장에게 제품, 재공품, 저장품에 대한 평가방법을 모두 총평균법으로 신고하였으나, 원재료에 대한 평가방법은 신고하지 않았다.\n(2) 2020년 10월 5일에 제품 평가방법을 총평균법에서 선입선출법으로 변경신고하였다.\n(3) 저장품은 총평균법으로 평가하였으나 계산착오로 300,000원이 과대 계상되었다.",
  choices:["19,500,000원","19,700,000원","19,900,000원","20,000,000원","20,700,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2020-67", subject:"세법학개론", year:2020, no:67, law:"법인세법", unit:"손금과 손금불산입", kind:"calc",
  stem:"<법인세법> 다음은 (주)서울의 당기 제7기 사업연도(2020.1.1.~12.31.)의 기부금 관련 자료이다. 제7기의 각 사업연도 소득금액은? (단, (주)서울은 사업연도 종료일 현재 「사회적기업 육성법」에 따른 사회적기업이 아님)\n\n(1) 조정후 소득금액: 97,000,000원\n조정후 소득금액은 전기 이전 기부금 한도초과액의 이월손금산입과 당기 기부금 관련 세무조정만을 제외한 모든 세무조정이 이루어진 상태이다.\n\n(2) 손익계산서에 계상된 기부금 내역\n① 천재지변으로 생기는 이재민을 위한 구호금품의 가액: 13,000,000원\n② 「사립학교법」에 따른 사립학교가 운영하는 병원에 시설비로 지출하는 기부금: 5,000,000원\n③ 법령에 정한 종교단체에 지출한 기부금: 10,000,000원\n④ 새마을금고에 지출한 기부금: 3,000,000원\n\n(3) 제6기에 발생한 세무상 미공제 이월결손금: 7,000,000원\n(4) 제2기에 발생한 법정기부금 한도초과액 미사용 이월잔액 2,000,000원이 있다.\n(5) 제3기에 발생한 지정기부금 한도초과액 미사용 이월잔액 3,000,000원이 있다.",
  choices:["92,000,000원","95,000,000원","97,900,000원","98,200,000원","99,120,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2020-68", subject:"세법학개론", year:2020, no:68, law:"법인세법", unit:"과세표준", kind:"calc",
  stem:"<법인세법> 다음은 영리내국법인 (주)백두의 제20기 사업연도(2020.1.1.~12.31.) 세무조정 관련 자료이다. 세부담 최소화를 가정할 경우 제20기의 법인세 과세표준금액은? (단, (주)백두는 「조세특례제한법」상 중소기업이 아니며 회생계획을 이행 중인 기업 등 대통령령으로 정하는 법인에 해당하지 않고 주어진 자료 이외에는 고려하지 않음)\n\n(1) 세무조정 내역(주1)\n손익계산서상 당기순이익 / 10,000,000원\n익금산입·손금불산입 / 17,000,000원\n손금산입·익금불산입 / (-)12,000,000원\n계 / 15,000,000원\n\n(주1) 매입채무에 대한 채무면제이익 10,000,000원이 영업외수익으로 당기순이익에 포함되어 있으며, 이와 관련된 세무조정은 포함되지 않음.\n\n(2) 과거 사업연도에 공제되지 않은 세무상 이월결손금 내역\n제8기 사업연도 (2008.1.1.~2008.12.31.) / 5,000,000원\n제18기 사업연도 (2018.1.1.~2018.12.31.) / 5,000,000원\n제19기 사업연도 (2019.1.1.~2019.12.31.) / 5,000,000원\n계 / 15,000,000원",
  choices:["0원","2,000,000원","4,000,000원","5,000,000원","10,000,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2020-69", subject:"세법학개론", year:2020, no:69, law:"법인세법", unit:"손금과 손금불산입", kind:"calc",
  stem:"<법인세법> 제조업을 영위하는 영리내국법인 (주)한라(중소기업이 아님)의 제20기 사업연도(2020.1.1.~6.30.)의 기업회계기준에 따라 계산한 매출액은 150억원(세무상 수입금액: 160억원)이며, 매출액 중 「법인세법」상 특수관계인과의 거래에서 발생한 매출액 30억원(세무상 수입금액: 40억원)이 포함되어 있다. 제20기 손익계산서상 접대비는 판매비와 관리비에 40,000,000원이 계상되어 있으며 접대비 중 700,000원은 증거자료가 누락되어 있고, 300,000원은 영수증(현금영수증 등 법정 증거자료가 아님)을 수취하였다. 제20기 손익계산서상 판매비와 관리비 항목에서 다음과 같은 사항을 파악하였다.\n\n(1) 접대비 관련 부가가치세 매입세액 1,000,000원(공급가액 10,000,000원은 접대비에 포함되어 있음)이 제20기 손익계산서의 판매비와 관리비 항목의 세금과공과 계정에 계상되어 있다.\n(2) 판매비와 관리비 항목의 복리시설비에는 종업원이 조직한 법인인 단체에 지출한 금액 3,000,000원이 포함되어 있다.\n\n접대비는 모두 국내에서 지출되었으며 문화접대비는 없고 주어진 자료 이외에는 고려하지 않는다고 가정한다면 (주)한라의 제20기 사업연도의 접대비 관련 세무조정으로 옳은 것은?",
  choices:["손금불산입 3,100,000원 (기타사외유출)","손금불산입 3,400,000원 (기타사외유출)","손금불산입 1,000,000원 (대표자상여) / 손금불산입 2,400,000원 (기타사외유출)","손금불산입 700,000원 (대표자상여) / 손금불산입 2,400,000원 (기타사외유출)","손금불산입 700,000원 (대표자상여) / 손금불산입 2,700,000원 (기타사외유출)"],
  answer:5, status:"clear", note:"" },
{ id:"2020-70", subject:"세법학개론", year:2020, no:70, law:"법인세법", unit:"감가상각비", kind:"calc",

  stem:"<부가가치세법> 과세사업(신발제조업)을 영위하던 일반과세자인 甲은 2020년 6월 20일에 해당 사업을 폐업하였다. 폐업 시점에 남아있는 재화의 현황이 다음과 같은 경우 부가가치세 과세표준금액은? (단, 건물과 원재료의 취득가액은 매입세액공제를 받은 금액이며, 주어진 자료 이외에는 고려하지 않음)\n\n폐업시점에 남은 재화 / 취득일 / 취득가액 / 시가\n토지(주1) / 2015.1.1. / 100,000,000원 / 200,000,000원\n건물(주1) / 2018.2.10. / 100,000,000원 / 150,000,000원\n차량(주2) / 2019.7.2. / 60,000,000원 / 50,000,000원\n원재료 / 2019.12.1. / 70,000,000원 / 80,000,000원\n\n(주1) 건물과 토지는 신발 제조를 위한 건물 및 그 부속토지임\n(주2) 차량은 「개별소비세법」 제1조 제2항 제3호에 따른 자동차로서 취득 시 매입세액을 공제받지 아니하였음",

{ id:"2020-73", subject:"세법학개론", year:2020, no:73, law:"부가가치세법", unit:"세금계산서 및 절차규정", kind:"concept",
  stem:"<부가가치세법> 「부가가치세법」상 세금계산서에 관한 설명으로 옳은 것은?",
  choices:["법인사업자와 직전 연도의 사업장별 재화 및 용역의 공급가액(면세공급가액 포함)의 합계액이 1억원 이상인 개인사업자는 세금계산서를 발급하려면 전자세금계산서를 발급하여야 한다.","계약의 해제로 재화 또는 용역이 공급되지 아니한 경우 수정세금계산서의 작성일은 처음 세금계산서 작성일로 적고, 비고란에 계약해제일을 덧붙여 적은 후 붉은색 글씨로 쓰거나 음(陰)의 표시를 하여 발급할 수 있다.","처음 공급한 재화가 환입된 경우에는 재화가 환입된 날을 작성일로 적고 비고란에 처음 세금계산서 작성일을 덧붙여 적은 후 붉은색 글씨로 쓰거나 음(陰)의 표시를 하여 발급할 수 있다.","전자세금계산서 발급명세 전송기한이 지난 후 재화 또는 용역의 공급시기가 속하는 과세기간에 대한 확정신고기한까지 국세청장에게 전자세금계산서 발급명세를 전송하는 경우 그 공급가액의 0.5%를 납부세액에 더하거나 환급세액에서 뺀다.","매입자발행세금계산서를 발행하려는 자는 거래건당 공급가액이 100만원 이상인 거래에 한하여 해당 재화 또는 용역의 공급시기가 속하는 과세기간의 종료일부터 6개월 이내에 신청인 관할 세무서장에게 거래사실의 확인을 신청하여야 한다."],

{ id:"2020-74", subject:"세법학개론", year:2020, no:74, law:"부가가치세법", unit:"과세거래", kind:"concept",
  stem:"<부가가치세법> 「부가가치세법」상 부가가치세가 과세되는 경우는 모두 몇 개인가?\n\nㅇ 사업자가 자기생산·취득재화를 고객에게 증여하는 경우로서 자기적립마일리지등으로만 전부를 결제받고 공급하는 경우\nㅇ 「도시 및 주거환경정비법」 등에 따른 수용절차에서 수용대상 재화의 소유자가 수용된 재화에 대한 대가를 받는 경우\nㅇ 사업자가 자기생산·취득재화를 경조사(설날, 추석, 창립기념일 및 생일 등을 포함)와 관련된 재화로서 사용인 1명당 연간 10만원 이하의 재화를 제공하는 경우\nㅇ 사업자가 자기의 과세사업과 관련하여 취득한 재화(내국신용장에 의해 공급받아 영세율을 적용받음)를 자기의 면세사업을 위하여 직접 사용하는 경우\nㅇ 사업자가 자기생산·취득재화를 매입세액이 불공제되는 「개별소비세법」 제1조 제2항 제3호에 따른 자동차로 사용·소비하거나 그 자동차의 유지를 위하여 사용·소비하는 경우",
  choices:["1개","2개","3개","4개","5개"],
  answer:2, status:"clear", note:"" },
{ id:"2020-75", subject:"세법학개론", year:2020, no:75, law:"부가가치세법", unit:"세금계산서 및 절차규정", kind:"concept",
  stem:"<부가가치세법> 외국법인 A로부터 용역을 공급받는 자인 B의 대리납부에 관한 설명으로 옳은 것을 모두 고른 것은? (단, 각 지문은 상호 독립적이며, 대리납부에 관한 특례 규정은 고려하지 않음)\n\nㄱ. 국내사업장이 없는 A로부터 용역의 공급을 받는 B는 공급받는 용역(매입세액공제대상임)을 과세사업에 사용한 경우에는 대리납부의무가 있다.\nㄴ. 국내사업장이 없는 A로부터 부가가치세 과세대상 용역을 공급받는 면세사업을 영위하는 사업자 B는 대리납부의무가 있다.\nㄷ. 국내사업장이 없는 A로부터 부가가치세법상 매입세액이 공제되지 아니하는 용역을 공급받는 과세사업자 B는 대리납부의무가 있다.\nㄹ. 대리납부 적용 요건을 충족하는 용역을 공급받는 사업자 B는 용역의 공급시기에 관계없이 그 대가를 지급하는 때에 부가가치세액을 징수한다.",
  choices:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],
  answer:5, status:"clear", note:"" },

  choices:["감면 총규모가 일정할 때, 소득공제를 세액공제로 변경하면 수직적 공평성은 악화된다.","누진세율 구조에서 소득공제의 실제 조세감면 효과는 대상자의 소득이 클수록 크게 나타난다.","어떤 재화 구입비의 소득공제는 해당 재화의 상대가격 변화를 가져올 수 있다.","우리나라의 경우 교육비는 세액공제 대상이다.","세액공제의 결정액은 한계세율과 관계없다."],

{ id:"jj2022-8", subject:"재정학", year:2022, no:8, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"재정적자의 경제적 효과에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 통화주의학파: 경제 불황기에는 호황기에 비해 구축효과가 크게 나타난다.\nㄴ. 케인즈학파: 국채발행을 통해 재정적자를 충당하면 승수효과만큼 총수요 증가를 가져온다.\nㄷ. 리카르도(D. Ricardo)의 대등정리: 재정적자를 국채로 충당할 때 총수요에 아무런 영향을 끼치지 않는다.\nㄹ. 러너(A. Lerner): 내부채무는 미래세대의 부담을 증가시킨다.\nㅁ. 배로(R. Barro): 적자재정이 국민저축과 투자에 전혀 영향을 미치지 않는다.",
  choices:["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄴ, ㄷ, ㅁ","ㄷ, ㄹ, ㅁ"],

{ id:"jj2022-10", subject:"재정학", year:2022, no:10, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"알링햄-샌드모(M. Allingham & A. Sandmo)의 탈세모형에 관한 설명으로 옳은 것은?",
  choices:["세율 인상에 따른 대체효과는 탈루소득을 줄이는 방향으로 작용한다.","절대위험기피도가 체감하는 개인은 세율이 오르면 소득효과로 탈루소득의 크기를 줄인다.","탈세로 인한 심리적 비용이 클수록 탈세 규모는 감소한다.","절세행위는 불법성을 특징으로 한다는 점에서 조세회피와 구별된다.","탈세의 편익은 세율로 표현될 수 있으며, 감사받을 확률의 증가나 벌금률의 증가가 탈루소득을 분명하게 늘린다."],

{ id:"jj2022-11", subject:"재정학", year:2022, no:11, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"calc",
  stem:"한계세율이 소득액 5000만원까지는 10 %, 5000만원 초과금액에 대해서는 30 %일 때, 두 부부의 소득과 소득세액은 아래와 같다. (단, 소득공제는 없다.)\n\n부부 / 개인소득 / 과세단위별 소득세액(개인기준) / 과세단위별 소득세액(가족기준)\nA 유○○ / 0.5억원 / 500만원 / (A부부 합계) 5000만원\nA 이○○ / 1.5억원 / 3500만원 /\nB 박○○ / 1억원 / 2000만원 / (B부부 합계) 5000만원\nB 전○○ / 1억원 / 2000만원 /\n\n다른 조건이 일정할 때, 두 부부의 과세방식을 개인기준에서 가족기준으로 변경할 경우의 결과로 옳은 것은?",
  choices:["A부부 - 결혼중립성 충족","B부부 - 결혼중립성 충족","A부부 - 수평적 공평성 미충족","B부부 - 수평적 공평성 미충족","A부부 - 수평적 공평성 충족"],

{ id:"jj2022-12", subject:"재정학", year:2022, no:12, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"누진세에 관한 찬반 의견으로 옳지 않은 것은?",
  choices:["조세제도를 복잡하게 만들어 탈세할 수 있는 구멍(loophole)을 제공할 수 있다고 반대한다.","경제의 활력을 떨어뜨리는 원인이 된다고 반대한다.","능력원칙에 따라 경제적 능력이 큰 사람일수록 정부서비스 혜택을 많이 받기 때문에 찬성한다.","사람들은 자신들의 미래가 불확실한 상황에서는 누진세를 찬성할 수 있다.","밀(J. S. Mill)의 동등희생의 원칙에는 누진세를 찬성하는 논리가 제시되어 있다."],

  choices:["조세지출예산제도는 조세지출의 남발을 억제하기 위해 도입된 제도이다.","법인세 특별감가상각제도는 조세지출의 예이다.","남북협력기업에 대한 보조금 지급은 조세지출에 해당한다.","공익단체에 대한 기부행위에 소득공제를 허용하는 것은 조세지출의 예이다.","투자세액공제는 조세지출에 해당한다."],

{ id:"jj2022-14", subject:"재정학", year:2022, no:14, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"이자소득세 부과의 효과에 관한 내용으로 옳은 것의 개수는? (단, 현재소비와 미래소비는 모두 정상재이다.)\n\nㅇ 저축을 감소시키는 소득효과와 저축을 증가시키는 대체효과를 동시에 발생시킨다.\nㅇ 저축에 대한 영향은 시점 간 자원배분모형을 이용하여 분석될 수 있다.\nㅇ 미래소비보다 현재소비가 유리한 여건이 제공될 수 있다.\nㅇ 현재소비는 대체효과에 의해 증가하고 소득효과에 의해 감소한다.\nㅇ 민간저축은 증가할 수도 감소할 수도 있다.",
  choices:["1개","2개","3개","4개","5개"],
  answer:4, status:"clear", note:"" },

  stem:"어떤 독점기업의 수요함수는 P = 200 - Q 이고, MC 는 40 이다. 이 때 단위당 60의 종량세를 이 기업에 부과할 경우 발생하는 영향으로 옳지 않은 것은?",
  choices:["시장가격은 120에서 150으로 상승한다.","종량세 과세에 따른 초과부담은 450이다.","소비자에게 귀착되는 종량세 부담은 1200이다.","종량세 부과로 발생하는 조세수입은 3000이다.","시장의 거래량은 80에서 50으로 줄어든다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2022-16", subject:"재정학", year:2022, no:16, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"하버거(A. Harberger)는 아래 가정 하에 조세귀착의 일반균형 모형을 분석하였다. 이 경우에 나타나는 현상으로 옳은 것은?\n\nㅇ 두 재화 X, Y가 있으며, 생산기술은 1차동차(선형동차)이고 X와 Y의 요소집약도는 동일하다.\nㅇ 모든 시장은 완전경쟁이고 노동과 자본의 부존량은 주어져 있고, 이 생산요소들은 완전한 이동성을 갖는다.",
  choices:["X부문과 Y부문에 대한 동일 세율의 물품세는 노동의 상대가격을 낮추게 된다.","X부문에 물품세를 부과하면 노동에 대비한 자본의 상대가격을 높이게 된다.","X부문의 자본에 대한 과세는 산출효과를 통해 노동에 대비한 자본의 상대가격을 낮추게 된다.","X부문의 자본에 대한 과세는 요소대체효과를 통해 노동에 대비한 자본의 상대가격을 낮추게 된다.","Y부문의 노동에 대한 과세 시 산출효과와 요소대체효과는 서로 같은 방향으로 작용한다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2022-17", subject:"재정학", year:2022, no:17, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공공요금 이론에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 최대부하가격설정에서 비성수기에는 공공요금을 한계비용에 일치시키는 것이 효율적이다.\nㄴ. 공공부문이 생산하는 재화나 서비스의 한계비용가격설정은 일반적으로 효율적인 자원배분을 실현할 수 없다.\nㄷ. 공공서비스의 경우 이부가격제도(two-part tariff)를 적용하면 결손을 줄일 수 있다.\nㄹ. 램지가격설정방식은 분배상 문제를 일으킬 수 있다.\nㅁ. 규모의 경제가 존재할 경우 여러 공기업에서 생산하는 것이 바람직하다.",
  choices:["ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ","ㄷ, ㄹ, ㅁ"],
  answer:2, status:"clear", note:"" },
{ id:"jj2022-18", subject:"재정학", year:2022, no:18, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"비례소득세 부과가 노동공급에 미치는 영향으로 옳지 않은 것은?",
  choices:["여가가 정상재일 경우, 비례소득세를 부과하면 소득효과와 대체효과 모두 노동공급을 증가시키므로 총노동공급은 증가한다.","여가가 정상재일 경우, 누진소득세 부과가 노동공급에 미치는 영향은 비례소득세 부과와 유사하지만 고소득자에게 불리하다.","여가가 열등재일 경우, 비례소득세를 부과하면 노동공급량은 감소한다.","여가가 정상재일 경우, 임금변화에 따른 소득효과가 대체효과보다 크다면 후방굴절형 노동공급곡선이 될 것이다.","여가가 정상재일 경우, 비례소득세를 부과하면 대체효과는 노동공급을 줄이는 방향으로 작용하고 소득효과는 노동공급을 늘리는 방향으로 작용한다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2022-19", subject:"재정학", year:2022, no:19, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"조겐슨(D. Jorgenson)의 신고전파 투자이론에 관한 설명으로 옳지 않은 것은?",
  choices:["자본의 사용자 비용이 적을수록 투자가 증가한다.","생산요소 간에 대체탄력성이 작으면 자본스톡의 사용자비용탄력성이 낮아질 수 있다.","자본스톡의 사용자비용탄력성이 작을수록 법인세가 기업의 투자에 미치는 영향이 크다.","법인세의 경우 자본재 구입비용은 즉시상각하고, 지급이자에 대한 비용공제는 불허하면 투자에 대해 중립적이다.","자기자본의 귀속이자비용과 차입금에 대한 이자공제가 허용되고 세법상 감가상각률과 경제적 감가상각률이 일치할 경우 법인세는 투자에 영향을 미치지 않는다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2022-20", subject:"재정학", year:2022, no:20, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"지방분권에 관한 설명으로 옳지 않은 것을 모두 고른 것은?\n\nㄱ. 자치단체 간 경쟁을 유발하여 효율적인 생산을 촉진한다.\nㄴ. 중앙정부의 교부금으로 인해 지방의 재정자립도가 높아진다.\nㄷ. 지역 간 재정능력의 불균형으로 지역 간 격차가 커질 수 있다.\nㄹ. 오우츠(W. Oates)의 분권화 정리는 지방공공재 공급에 있어서 규모의 경제가 있고, 인접 지역으로의 외부성이 없는 경우에 성립한다.\nㅁ. 지방분권제도가 중앙집권제도보다 지방공공재에 대한 정보를 획득하는 비용이 높다.",
  choices:["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄴ, ㄹ, ㅁ","ㄷ, ㄹ, ㅁ"],
  answer:4, status:"clear", note:"" },
{ id:"jj2022-21", subject:"재정학", year:2022, no:21, law:"재정학", unit:"1편 재정학의 개요", kind:"concept",
  stem:"자원배분의 효율성에 관한 설명으로 옳지 않은 것은?",
  choices:["후생경제학의 제1정리는 아담 스미스(A. Smith)의 '보이지 않는 손'이 효율적인 자원배분을 실현함을 의미한다.","정보의 비대칭성은 자원배분의 비효율성을 초래하는 요인이 된다.","어떤 자원배분 상태에 파레토개선의 여지가 있다면 그 상태는 효율적이다.","영기준 예산제도는 점증주의 예산에서 탈피하여 효율적 자원배분을 제고할 수 있는 제도이다.","공공부문이 공급하는 재화나 서비스에 공공요금을 부과하면 가격기능을 통해 효율적인 자원배분이 가능하다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2022-22", subject:"재정학", year:2022, no:22, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"A와 B 두 명으로 구성된 사회에서 개인의 효용을 각각 U_A 와 U_B, 사회후생을 W 라고 할 때, 다음 중 옳지 않은 것은?",
  choices:["어떤 배분상태가 효용가능경계상에 있다면 그 상태에서 효율성과 공평성을 동시에 개선시킬 수 없다.","평등주의적 사회후생함수의 경우, 평등주의적 성향이 극단적으로 강하면 롤즈(J. Rawls)적 사회무차별곡선의 형태를 가진다.","롤즈의 사회후생함수는 W = min{U_A, U_B}로 나타낼 수 있다.","사회후생함수가 W = U_A + 2U_B 일 경우, B의 효용이 A의 효용보다 사회적으로 2배의 중요성이 부여되고 있다.","평등주의적 사회후생함수는 사회 구성원들에게 동일한 가중치를 부여한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2022-23", subject:"재정학", year:2022, no:23, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"시장실패와 정부의 기능에 관한 설명으로 옳지 않은 것은?",
  choices:["국민연금의 강제 가입은 일찍 은퇴할 가능성이 높은 사람만 가입하는 역선택 문제를 해결할 수 없다.","중립세는 민간부분의 의사결정을 교란시키지 않는다.","시장실패는 정부개입의 필요조건이다.","정부가 어떤 정책에 대한 민간부문의 반응을 완벽하게 통제하지 못하면 정부실패가 발생할 수 있다.","자연독점기업에 대한 한계비용가격설정은 독점으로 인한 비효율성을 제거할 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2022-24", subject:"재정학", year:2022, no:24, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"기업 A와 B는 현재 각각 500단위의 오염을 배출하고 있으며, 배출의 저감비용은 각각 C(q_A) = 40 + (1/2)q_A², C(q_B) = 30 + q_B² 이다. 정부가 총 배출량을 30% 줄이기 위해 배출권거래제를 도입하고, A에 400단위, B에 300단위의 배출권을 무료로 할당한다면 배출권시장의 균형에서 (ㄱ)배출권의 가격과 (ㄴ)배출권 거래량은? (단, q_i (i = A, B)는 기업 i의 배출 저감량이다.)",
  choices:["ㄱ: 100, ㄴ: 100단위","ㄱ: 100, ㄴ: 200단위","ㄱ: 200, ㄴ: 100단위","ㄱ: 200, ㄴ: 200단위","ㄱ: 250, ㄴ: 100단위"],
  answer:3, status:"clear", note:"" },
{ id:"jj2022-25", subject:"재정학", year:2022, no:25, law:"재정학", unit:"3편 공공지출이론", kind:"calc",
  stem:"개인 A와 B로 구성된 경제에 X재가 1000단위 존재하며, 이 재화에 대한 효용함수는 각각 U_A = 3√(X_A), U_B = √(X_B) 이다. 이 사회의 사회후생함수를 W = min{U_A, U_B}로 가정할 경우 사회후생의 극댓값은? (단, X_i > 0 (i = A, B)는 개인 i의 X재 소비량이다.)",
  choices:["15","30","60","90","100"],
  answer:2, status:"clear", note:"" },
{ id:"jj2022-26", subject:"재정학", year:2022, no:26, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"외부성에 관한 설명으로 옳지 않은 것은?",
  choices:["기술적 외부성은 자원 배분의 비효율성을 발생시킨다.","코즈(R. Coase) 정리가 성립하려면 외부성에 관한 권리(재산권)의 설정이 명확해야 한다.","해로운 외부성이 존재하면 해당 재화는 사회적 최적 수준보다 과다 생산되는 경향이 있다.","대규모 건설공사로 인한 건축자재 가격 상승으로 다른 건축업자가 피해를 입은 것은 금전적인 외부성의 예이다.","코즈 정리에 따르면 외부성 관련 거래비용이 클수록 협상이 용이하다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2022-27", subject:"재정학", year:2022, no:27, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"공공재에 관한 설명으로 옳지 않은 것은?",
  choices:["클럽재는 부분적으로 경합성의 성질을 가져 혼잡을 발생시키는 재화나 서비스이다.","순수공공재의 경우 소비자 추가에 따른 한계비용이 영(0)이다.","공공재의 최적 공급수준은 개별 이용자의 한계편익의 합과 한계비용이 일치할 때 달성된다.","클라크 조세(Clarke tax)에서 각 개인은 공공재에 대한 자신의 진정한 선호를 표출하는 것이 우월전략이다.","가치재는 순수 공공재에 해당된다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2022-28", subject:"재정학", year:2022, no:28, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"공공선택에서 투표제도에 관한 설명으로 옳지 않은 것은?",
  choices:["과반수제가 갖는 문제점으로는 투표의 역설이 있다.","최적다수결제의 경우 의사결정비용은 의결에 필요한 표수가 클수록 커진다.","린달(E. Lindahl) 모형은 전원합의제에 의한 공공재 배분의 가능성을 보여준 사례이다.","전략적 행동이 없을 경우, 선택대상에 대한 선호의 강도를 가장 잘 반영하는 것은 점수투표제이다.","점수투표제에서 투표거래(logrolling)가 발생하면 선호의 강도가 반영될 수 없다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2022-29", subject:"재정학", year:2022, no:29, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"오염배출권 거래제도에 관한 설명으로 옳지 않은 것은?",
  choices:["배출권 시장의 균형에서는 개별 기업이 결정한 배출량의 합이 정부가 설정한 목표 배출량과 일치한다.","정부는 총배출량을 설정할 때 개별 기업의 한계저감비용에 관한 정보를 필요로 한다.","환경세에 비해 인플레이션과 같은 경제 상황의 변화에 쉽게 적응할 수 있다.","배출권 거래 시 한계저감비용이 상대적으로 높은 기업이 구매자가 된다.","배출권 시장의 균형에서는 각 기업의 한계저감비용이 같아진다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2022-30", subject:"재정학", year:2022, no:30, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"니스카넨(W. Niskanen) 모형에 관한 설명으로 옳지 않은 것은?",
  choices:["관료는 사회적 최적 수준보다 과다한 생산 수준을 선택한다.","생산 수준이 미그-빌레인저(Migue-Belanger) 모형에서 제시한 수준보다 더 적다.","관료제에 대응하는 방안으로 민간부문에 생산을 맡기고 정부는 비용만 부담하는 방법을 제안했다.","관료가 선택한 생산수준에서는 사회적 잉여가 영(0) 이다.","관료는 예산 극대화를 추구하며, 총편익과 총비용이 일치하는 수준에서 생산 수준을 결정한다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2022-31", subject:"재정학", year:2022, no:31, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공공사업이 유발하는 편익과 비용에 관한 설명으로 옳은 것은?",
  choices:["공공사업을 추진하는 행정주체는 내부적 편익과 외부적 편익 가운데 외부적 편익을 더 중시한다.","공공사업의 목표는 소득재분배, 총 소비 증대를 통한 국민의 후생증진에 국한된다.","공공사업에서 발생하는 금전적 편익은 사회 전체적인 후생을 증진시킨다.","공공사업의 유형적 편익과 무형적 편익을 비교하면 무형적 편익이 크다.","공공사업은 이윤 이외의 목표 추구 등을 고려하므로 그 편익과 비용을 측정할 때 시장가격과 다른 척도의 적용이 필요하다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2022-32", subject:"재정학", year:2022, no:32, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"소득분배의 불평등을 완화하는 정책으로 옳은 것만을 고른 것은?\n\nㄱ. 교육기회 확대\nㄴ. 누진세제\nㄷ. 인두세 강화\nㄹ. 복권제도 활성화",
  choices:["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
  answer:1, status:"clear", note:"" },
{ id:"jj2022-33", subject:"재정학", year:2022, no:33, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"앳킨슨(A. Atkinson) 지수에 관한 설명으로 옳지 않은 것은?",
  choices:["사회후생함수에 의한 가치판단을 명시적으로 전제하여 소득불평등을 측정한다.","불균등한 분배가 사회후생을 떨어뜨리는 정도가 클수록 균등분배대등소득과 1인당 평균소득 간 격차는 줄어든다.","균등분배대등소득과 1인당 평균소득이 같으면 앳킨슨 지수는 영(0)의 값을 갖는다.","동일한 분배상태라도 보는 사람에 따라 균등분배대등소득이 달라질 수 있으므로 앳킨슨 지수의 값은 여러 가지로 측정될 수 있다.","앳킨슨 지수는 0에서 1 사이의 값을 갖는다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2022-34", subject:"재정학", year:2022, no:34, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"사회보험과 관련된 내용만을 모두 고른 것은?\n\nㄱ. 정부의 재정수입 달성\nㄴ. 시장실패의 보완\nㄷ. 보험료에 의한 재원 조달\nㄹ. 정부의 온정적 간섭주의",
  choices:["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],

{ id:"jj2022-35", subject:"재정학", year:2022, no:35, law:"재정학", unit:"1편 재정학의 개요", kind:"concept",
  stem:"다음은 예산제도에 관한 설명이다. (  )에 들어갈 내용으로 옳은 것은?\n\n각 기관의 지출항목별로 예산을 편성하는 방식을 ( ㄱ )라고 부른다. ( ㄱ )는 유사한 일을 하는 부서 간에 예산편중 중복을 차단하기 쉽지 않다. ( ㄴ )는 비슷한 기능을 가진 부서들이 하는 업무를 하나로 묶어 소요예산을 절감하는 방식을 따르며, 우리나라는 2007년부터 도입하여 운영하고 있다.",

{ id:"jj2022-36", subject:"재정학", year:2022, no:36, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"사회후생함수에 관한 설명으로 옳지 않은 것은?",
  choices:["롤즈(J. Rawls)적 가치판단에 기초한 사회무차별곡선은 우하향하는 직선 형태로 표시된다.","사회후생함수가 설정되면 어떤 변화가 발생했을 때, 그것이 개선인지의 여부를 판정할 수 있다.","사회후생함수와 효용가능경계를 이용하여 바람직한 자원배분을 도출할 수 있다.","사회구성원들의 가치판단에 따라 여러 유형의 사회후생함수가 선택될 수 있다.","센(A. Sen)에 따르면 제한된 수의 선택가능성 사이에 서열을 매길 수 있는 합리적이고 민주적인 사회적 선호체계의 도출이 가능하다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2022-37", subject:"재정학", year:2022, no:37, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"소득재분배정책에 관한 설명으로 옳지 않은 것은?",
  choices:["로렌츠곡선을 완전히 평등한 분배를 나타내는 대각선으로 접근시키는 역할을 한다.","상속 및 증여세는 세입 측면의 소득재분배정책 성격을 갖는다.","현금보조, 물품보조 등을 활용하는 방식으로 시행될 수 있다.","로렌츠곡선, 지니계수, 앳킨슨 지수로 분배의 불평등을 평가함에 있어서는 가치판단이 개입된다.","지니계수가 커지면 소득분배의 개선으로 본다."],

{ id:"jj2022-38", subject:"재정학", year:2022, no:38, law:"재정학", unit:"1편 재정학의 개요", kind:"concept",
  stem:"정부지출 증가 원인에 관한 주장으로 옳은 것은?",
  choices:["브라운-잭슨(C. Brown & P. Jackson): 바그너(A. Wagner)의 법칙을 중위투표자의 선택과 결부시켜 설명하였다.","보몰(W. Baumol): 사회적 격변기에 전위효과(displacement effect)의 영향으로 정부지출이 팽창된다고 보았다.","피코크-와이즈만(A. Peacock & J. Wiseman): 노동집약적인 공공부문이 민간부문보다 생산성 향상이 느리기 때문에 정부지출이 팽창된다고 주장하였다.","부캐넌(J. Buchanan): 정부지출의 편익이 간접적으로 인식되는 반면, 공공서비스의 공급비용은 과대평가되므로 정부지출이 팽창된다고 설명하였다.","바그너의 법칙: 1인당 국민소득 하락 국면에서 공공부문의 상대적 크기가 증가하는 것을 말한다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2022-39", subject:"재정학", year:2022, no:39, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"비용편익분석에 관한 내용으로 옳은 것은?",
  choices:["파레토기준을 충족한 투자계획만을 채택한다.","공공부문의 투자계획 타당성 판정에만 적용된다.","현재가치법에서 적용되는 할인율은 투자계획에 사용되는 자금의 기간당 기회비용과 일치하도록 선택되어야 한다.","현재가치법은 어떤 투자계획의 채택가능성을 평가할 뿐이며, 투자계획들 간 우선순위를 결정하지는 못한다.","내부수익률이 투자계획에 소요되는 자금의 기회비용인 할인율보다 크다면 그 투자계획은 기각된다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2022-40", subject:"재정학", year:2022, no:40, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"우리나라의 국민연금제도에 관한 설명으로 옳지 않은 것은?",
  choices:["1988년에 시행되었다.","최초 법적 기반은 1973년에 제정된 「국민복지연금법」이다.","사업장가입자 한 사람당 기준소득월액의 9 %씩 국민연금 보험료로 납부되고 있다.","2022년부터 1인 이상 근무하는 전체 사업장이 국민연금 가입 대상으로 확대되었다.","65세 이상 노령층에 대해 소득수준 등을 감안하여 지급되는 기초연금은 국민연금을 보완하는 측면이 있다."],

{ id:"jj2021-1", subject:"재정학", year:2021, no:1, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"부가가치세에 관한 설명으로 옳지 않은 것은?",
  choices:["각 생산단계에서 추가된 부가가치에만 과세되어 수직적 통합을 방지하는 효과가 있다.","영세율을 통해 수출품에 대해 조세를 효과적으로 환급해 줄 수 있다.","소비형 부가가치세는 투자를 촉진하는 장점이 있다.","매입세액 공제방식은 탈세를 방지할 수 있다.","어떤 상품이 면세의 대상인 경우 중간단계에서 납부한 부가가치세까지 환급해 준다."],

{ id:"jj2021-2", subject:"재정학", year:2021, no:2, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"조세의 초과부담에 관한 설명으로 옳은 것은?",
  choices:["조세부과 시 발생하는 소득변화에 의해 나타나는 납세자 선택의 왜곡현상을 의미한다.","서로 다른 재화에 대해 조세징수액이 같으면 초과부담의 크기는 동일하게 나타난다.","초과부담은 조세부과로 인해 상대가격이 변하는 경우 대체효과에 의해 나타난다.","조세부과로 인하여 소득효과와 대체효과가 상반된 방향으로 작용하여 상쇄되면 수요량의 변화가 없게 되어 초과부담은 발생하지 않는다.","초과부담은 조세부과로 인해 발생하는 소비자잉여와 생산자잉여의 감소분을 합한 것이다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2021-3", subject:"재정학", year:2021, no:3, law:"재정학", unit:"5편 조세의 초과부담 및 최적과세론", kind:"concept",
  stem:"물품세(excise tax)의 초과부담에 관한 설명으로 옳지 않은 것은?",
  choices:["물품세의 최적과세는 초과부담을 최소화시키는 과세를 의미한다.","물품세의 초과부담은 소비자가 지불하는 가격과 생산자가 수취하는 가격이 달라지기 때문에 발생한다.","물품세의 초과부담은 수요의 가격탄력성이 클수록 증가한다.","보상수요의 가격탄력성이 0인 경우에는 물품세 부과로 인한 가격 상승이 보상수요량에 아무런 변화도 주지 않고 초과부담도 없다.","어떤 재화의 시장에서 공급곡선이 수평이고 수요곡선이 우하향하며 직선인 경우 재화의 초기 균형가격은 P₁, 물품세의 세율은 t, 물품세 과세 이전과 이후의 균형 소비량(산출량)은 각각 Q₁과 Q₂, 그리고 보상수요의 가격탄력성을 e로 나타내면 물품세의 과세로 인한 초과부담은 (1/2)e(P₁Q₂)t² 이 된다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2021-4", subject:"재정학", year:2021, no:4, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",

{ id:"jj2021-5", subject:"재정학", year:2021, no:5, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",

  stem:"조세의 전가와 귀착에 관한 설명으로 옳지 않은 것은?",
  choices:["독점시장의 경우 조세 부담은 소비자에게 모두 전가되지는 않는다.","법인세의 법적 부담자는 기업이지만 법인세 과세로 인해 상품가격이 인상된다면 소비자에게도 세 부담이 전가된다.","국민연금제도에서 기여금은 법적으로는 고용주와 근로자가 1/2씩 부담하지만 실질적인 부담은 노동의 수요 및 공급의 임금탄력성에 따라 결정된다.","독점시장에서는 공급곡선의 형태에 따라 귀착은 달라진다.","독점시장에서 종량세와 종가세가 미치는 효과는 상이하다."],

{ id:"jj2021-12", subject:"재정학", year:2021, no:12, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"부의 소득세제(negative income tax)가 S = a - tE 로 주어졌을 때 다음 설명으로 옳지 않은 것은? (단, S: 보조금, a: 기초수당, t: 한계세율, E: 스스로 벌어들인 소득)",
  choices:["a가 50 만원, t가 0.2 일 때 E가 250 만원이면 보조금 혜택이 중단된다.","a가 50 만원, t가 0.25 일 때 보조금을 받기 위해서 E는 200 만원 미만이어야 한다.","다른 조건이 일정할 때, t가 인하되면 조세부담이 줄어들어 보조금도 같이 줄어든다.","정부가 선택할 수 있는 정책변수는 a와 t이다.","다른 조건이 일정할 때, a가 클수록 재분배효과가 증가한다."],
  answer:3, status:"clear", note:"" },
{ id:"jj2021-13", subject:"재정학", year:2021, no:13, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"부동산 관련 조세에 관한 설명으로 옳지 않은 것은?",
  choices:["부동산의 공급탄력성이 0이면 과세에 따른 초과부담이 발생하지 않는다.","부동산 보유세 인상 시 조세의 자본화에 의하여 부동산 가격이 상승하게 된다.","우리나라의 부동산 취득 시 내는 조세로는 지방세인 취득세가 있다.","우리나라의 재산세와 종합부동산세는 부동산 보유 시 부과된다.","우리나라의 양도소득세는 부동산 양도 시 발생하는 차익에 대해서 과세하는 국세다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2021-14", subject:"재정학", year:2021, no:14, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"조겐슨(D. Jorgenson)의 신고전학파 투자이론에 관한 설명으로 옳지 않은 것은?",
  choices:["중요한 투자결정요인은 자본의 사용자비용이다.","자본의 사용자비용이 낮아지면 투자는 늘어난다.","자본의 사용자비용에는 포기된 다른 투자로 인한 기회비용도 포함된다.","자본재 구입비용은 즉시 비용처리하고, 지급이자에 대한 비용공제는 허용하지 않는 경우 법인세는 투자에 중립적이다.","자기자본의 귀속이자비용이 공제되지 않아도, 차입금에 대한 이자공제가 허용되고 세법상 감가상각률과 경제적 감가상각률이 일치하면 법인세는 투자에 영향을 미치지 않는다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2021-15", subject:"재정학", year:2021, no:15, law:"재정학", unit:"4편 조세론의 기초 및 전가와 귀착", kind:"concept",
  stem:"토지에 부과된 조세의 자본화(capitalization)에 관한 설명으로 옳은 것은?",
  choices:["자본화의 크기는 기간 당 할인율에 비례한다.","세율이 높을수록 조세의 자본화 정도는 작아진다.","조세부담은 토지임대사용자에게 귀착된다.","토지가격의 변동 폭은 부과된 조세의 현재 가치보다 크게 나타난다.","토지와 같이 공급이 고정된 자산에 과세하면 미래 조세부담이 미리 예측되어 가격이 하락하는 현상을 말한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2021-16", subject:"재정학", year:2021, no:16, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"근로소득에 비례소득세를 부과하는 경우 나타나는 효과에 관한 설명으로 옳지 않은 것은? (단, 여가는 정상재이고, 근로소득만 존재한다.)",
  choices:["초과부담은 세율이 높아질수록 커진다.","노동공급곡선이 우상향이면 시장임금률은 상승한다.","노동공급곡선이 수직이면 전부 근로자에게 귀착된다.","실질소득의 감소로 노동공급을 증가시키려는 소득효과가 나타난다.","대체효과와 소득효과가 동일하여 노동공급이 일정하면 순임금률과 시장임금률은 동일하다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2021-17", subject:"재정학", year:2021, no:17, law:"재정학", unit:"6편 개별조세이론 및 조세의 경제적 효과", kind:"concept",
  stem:"투자자들이 자산유형별로 상이한 위험과 기대수익률을 고려하여 수익률을 극대화하도록 자산을 구성한다고 한다. 투자의 안전성이 정상재이고 투자자의 위험회피도가 체증적인 경우, 수익에 대한 비례소득세 부과가 투자자의 자산구성에 미치는 효과에 관한 설명으로 옳은 것은?",
  choices:["기대수익률이 하락하여 안전성에 대한 기회비용이 증가함으로써, 위험자산의 비중은 작아진다.","완전손실상계제도가 있는 경우, 위험자산의 비중은 커진다.","완전손실상계제도가 있는 경우, 투자 수익과는 달리 손실에 대해 정부와 투자자가 공동 부담하도록 한다.","손실상계제도를 전혀 허용하지 않는 경우, 위험자산의 비중에는 영향이 없다.","손실상계제도를 전혀 허용하지 않는 경우, 소득효과가 대체효과보다 큰 경우에 한해 위험자산의 비중은 감소한다."],
  answer:2, status:"clear", note:"" },
{ id:"jj2021-18", subject:"재정학", year:2021, no:18, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"A, B 두 사람이 공동으로 소비하는 공공재(Z)에 대한 수요함수는 각각 Z_A = 100 - 20P, Z_B = 100 - 10P 이고, 이를 생산하는 데 드는 한계비용이 3 일 때, B의 린달가격(부담비율)은? (단, P는 공공재 가격이다.)",

{ id:"jj2021-19", subject:"재정학", year:2021, no:19, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"지방분권제도에 관한 설명으로 옳지 않은 것은?",
  choices:["지역의 특성을 반영한 제도의 도입이 용이하다.","지역주민의 욕구를 반영한 행정을 실현할 수 있다.","자치단체 간 경쟁을 유발하여 효율적인 생산을 촉진한다.","중앙정부의 교부금으로 인해 지방의 재정자립도가 높아진다.","지역 간 재정능력의 불균형으로 지역 간 격차가 커질 수 있다."],

{ id:"jj2021-20", subject:"재정학", year:2021, no:20, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"공공서비스의 가격설정 이론에 관한 설명으로 옳은 것은?",
  choices:["더 많이 소비하는 사람이 더 많은 비용을 부담해야 한다는 원칙을 적용해야 한다.","외부성이 존재하는 경우 한계비용과 일치하는 수준에서 가격이 설정되어야 한다.","기존시설에 대한 초과 수요가 존재하는 경우 평균비용에서 경제적 지대를 제외한 수준에서 가격이 설정되어야 한다.","규모의 경제가 존재하는 경우 한계비용과 일치하는 수준에서 가격이 설정되면 효율적인 배분을 달성할 수 있다.","램지(F. Ramsey)의 원칙에 따르면 수요의 가격탄력성이 작을수록 가격을 한계비용에 가깝게 설정할 때 효율성이 제고된다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2021-21", subject:"재정학", year:2021, no:21, law:"재정학", unit:"1편 재정학의 개요", kind:"concept",
  stem:"효용가능경계(utility possibility frontier)에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 효용가능경계 상의 각 점에서는 소비의 파레토 효율성만 충족된다.\nㄴ. 효용가능경계 상의 한 점은 생산가능곡선 상의 한 점과 대응관계에 있다.\nㄷ. 효용가능경계 상의 일부 점에서만 MRS = MRT 가 성립한다.\nㄹ. 소비에 있어서 계약곡선을 효용공간으로 옮겨 놓은 효용가능곡선의 포락선(envelope curve)이다.\nㅁ. 효율과 공평을 동시에 달성시키는 점들의 궤적이다.",
  choices:["ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㅁ","ㄴ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ, ㅁ"],
  answer:2, status:"clear", note:"" },
{ id:"jj2021-22", subject:"재정학", year:2021, no:22, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"calc",
  stem:"공공서비스의 수요곡선은 P = 16 - (1/2)Q 이고 이를 공급하는데 소요되는 한계비용은 12 로 일정할 때, 이를 독점적으로 공급하는 관료가 효율적인 서비스를 제공하기 보다는 자신이 속한 조직 규모 극대화를 추구하고 있다. 이런 경우 관료의 공공서비스 규모는? (단, P는 공공서비스의 가격, Q는 공공서비스의 규모이다.)",
  choices:["4","8","12","14","16"],

{ id:"jj2021-23", subject:"재정학", year:2021, no:23, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"공공재의 과다공급 원인으로 옳은 것을 모두 고른 것은?\n\nㄱ. 다수결 투표제도\nㄴ. 정치적 결탁(logrolling)\nㄷ. 다운즈(A. Downs)의 투표자의 무지\nㄹ. 갤브레이드(J. K. Galbraith)의 의존효과",

{ id:"jj2021-24", subject:"재정학", year:2021, no:24, law:"재정학", unit:"3편 공공지출이론", kind:"concept",
  stem:"사회후생함수에 관한 설명으로 옳지 않은 것은?",
  choices:["그 사회가 선택하는 가치기준에 의해서 형태가 결정된다.","사회후생함수에서는 개인들의 효용을 측정할 수 있다고 가정한다.","평등주의 사회후생함수는 각 개인의 효용에 동일한 가중치를 부여하게 된다.","공리주의 사회후생함수에 의하면 사회후생의 극대화를 위해서는 각 개인소득의 한계효용이 같아야 한다.","사회후생을 극대화시키는 배분은 파레토 효율을 달성한다."],

{ id:"jj2021-25", subject:"재정학", year:2021, no:25, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"코즈(R. Coase) 정리에 관한 설명으로 옳지 않은 것은?",
  choices:["외부성이 있는 경우 형평성이 아닌 효율성을 고려하는 해결 방안이다.","외부성이 있는 경우 당사자들의 이해관계와 무관하게 코즈 정리를 적용할 수 있다.","외부성 문제가 있는 재화의 과다 또는 과소 공급을 해결하는 방안이다.","정부가 환경세를 부과하여 당사자의 한쪽에게 책임을 지게 하면 효율적 자원배분을 이룰 수 있다.","소유권이 분명하다면, 당사자들의 자발적 거래에 의해 시장실패가 해결된다는 정리이다."],
  answer:4, status:"clear", note:"" },
{ id:"jj2021-26", subject:"재정학", year:2021, no:26, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"시장실패에 관한 설명으로 옳지 않은 것은?",
  choices:["불완전한 경쟁의 경우 시장실패가 일어날 수 있다.","공공재는 그 특성에 의해서 시장실패가 발생하게 된다.","정부개입의 필요조건을 제공한다.","완비되지 못한 보험시장의 경우 시장실패가 일어날 수 있다.","외부불경제로 사회적 최적생산량보다 과소 생산되는 경우에 발생한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2021-27", subject:"재정학", year:2021, no:27, law:"재정학", unit:"2편 외부성·공공재·공공선택이론", kind:"concept",
  stem:"중위투표자 정리에 관한 설명으로 옳지 않은 것은?",
  choices:["양당제를 운영하고 있는 국가에서 정치적 성향이 대치되는 두 정당의 선거 공약이 차별화되는 것과 관련이 있다.","선호가 모든 투표자 선호의 한 가운데 있는 사람을 중위투표자라 한다.","이 정리에 의한 정치적 균형이 항상 파레토 효율성을 가져오는 것은 아니다.","투표자의 선호가 다봉형이 아닌 단봉형일 때 성립한다.","가장 많은 국민들의 지지를 확보하려는 정치가는 중위투표자의 지지를 얻어야 하는 것으로 해석할 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"jj2021-28", subject:"재정학", year:2021, no:28, law:"재정학", unit:"7편 재정학의 기타주제", kind:"concept",
  stem:"티부(C. Tiebout) 가설에 관한 설명으로 옳지 않은 것은?",
  choices:["개인의 완전한 이동성이 보장되어야 한다.","지방정부가 취한 행동이 외부성을 발생시키지 않아야 한다.","상이한 재정 프로그램을 제공하는 지역사회의 수가 충분히 많아야 한다.","각 지역사회가 공급하는 재화와 조세에 대해 주민이 완전한 정보를 가지고 있어야 한다.","공공재의 생산 규모가 증가할수록 단위당 생산비용이 하락하는 규모의 경제가 발생하여야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"jj2021-29", subject:"재정학", year:2021, no:29, law:"재정학", unit:"3편 공공지출이론", kind:"concept",

  answer:4, status:"clear", note:"" },
{ id:"jj2021-30", subject:"재정학", year:2021, no:30, law:"재정학", unit:"3편 공공지출이론", kind:"calc",
  stem:"기간별 비용과 편익이 아래와 같을 때 공공사업의 순편익의 현재가치는? (단, 할인율은 10 %이다.)\n\n구분 / 0기 / 1기 / 2기\n비용 / 3,000 / 0 / 0\n편익 / 0 / 1,100 / 2,420",
  choices:["-3,520/(1+0.1)²","-520/(1+0.1)","0","100","520"],
