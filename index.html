{ id:"2021-70", subject:"세법학개론", year:2021, no:70, law:"법인세법", unit:"세액계산", kind:"concept",
  stem:"「법인세법」상 외국납부세액공제와 관련하여, (  )에 들어갈 내용으로 옳은 것은? (단, 2021.1.1. 이후 개시하는 사업연도에 발생한 외국법인세액만 있는 경우로 가정함)\n\n내국법인의 각 사업연도의 소득에 대한 과세표준에 국외원천소득이 포함되어 있는 경우로서 법령에 따라 외국법인세액을 해당 사업연도의 산출세액에서 공제하고자 할 때, 그 국외원천소득에 대하여 외국정부에 납부하였거나 납부할 외국법인세액이 해당 사업연도의 공제한도금액을 초과하는 경우 그 초과하는 금액은 해당 사업연도의 다음 사업연도 개시일부터 (  ) 이내에 끝나는 각 사업연도로 이월하여 그 이월된 사업연도의 공제한도금액 내에서 공제받을 수 있다.",
  choices:["10년","12년","15년","17년","20년"],
  answer:1, status:"clear", note:"" },
{ id:"2021-71", subject:"세법학개론", year:2021, no:71, law:"부가가치세법", unit:"부가가치세 총칙", kind:"concept",
  stem:"「부가가치세법」상 사업장에 관한 설명으로 옳지 않은 것은?",
  choices:["기획재정부령으로 정하는 이동통신역무를 제공하는 전기통신사업의 사업장은 사업자가 법인인 경우에는 그 법인의 본점소재지이다.","사업자가 사업장을 설치하지 아니하고 사업자등록도 하지 아니한 경우에는 과세표준 및 세액을 결정하거나 경정할 당시의 사업자의 주소 또는 거소를 사업장으로 한다.","운수업의 사업장은 개인의 명의로 등록된 차량을 다른 개인이 운용하는 경우 그 등록된 개인이 업무를 총괄하는 장소이다.","무인자동판매기를 통하여 재화ㆍ용역을 공급하는 사업의 경우에는 사업에 관한 업무를 총괄하는 장소 외의 장소를 추가로 사업장으로 등록할 수 있다.","사업자가 자기의 사업과 관련하여 생산하거나 취득한 재화를 직접 판매하기 위하여 특별히 판매시설을 갖춘 장소는 사업장으로 본다."],
  answer:4, status:"clear", note:"" },
{ id:"2021-72", subject:"세법학개론", year:2021, no:72, law:"부가가치세법", unit:"과세거래", kind:"concept",
  stem:"「부가가치세법」상 재화의 공급에 해당하지 않는 것은?",
  choices:["공동사업자 구성원이 각각 독립적으로 사업을 영위하기 위하여 공동사업의 사업용 고정자산인 건축물을 분할등기하는 경우 해당 건축물의 이전","사업자간에 상품ㆍ제품 등의 재화를 차용하여 사용하거나 소비하고 동종 또는 이종의 재화를 반환하는 소비대차의 경우의 해당 재화의 차용 또는 반환","사업자가 폐업할 시 자기생산ㆍ취득재화(매입세액공제 받음) 중 남아 있는 재화","재화의 인도 대가로서 다른 재화를 인도받거나 용역을 제공받는 교환계약에 따른 재화의 인도ㆍ양도","출자자가 자기의 출자지분을 타인에게 양도ㆍ상속ㆍ증여하거나 법인 또는 공동사업자가 출자지분을 현금으로 반환하는 경우"],
  answer:5, status:"clear", note:"" },
{ id:"2021-73", subject:"세법학개론", year:2021, no:73, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"calc",
  stem:"자동차용 배터리 소재 제조업을 영위하는 일반과세자인 (주)세무의 2021년 제1기 예정신고기간 자료이다. (주)세무의 2021년 제1기 예정신고기간의 부가가치세 과세표준금액은? (단, 다음 자료의 금액에는 부가가치세가 포함되어 있지 않음)\n\n(1) 1월 30일: 재화의 공급으로 인하여 거래처로부터 매출할인과 에누리액 200,000원 차감 후, 연체이자 100,000원을 포함한 현금 5,000,000원을 받았다.\n(2) 2월 15일: 미국의 U사와 신용장(L/C)방식에 의한 수출계약을 하고 2월 15일에 선적하였으며, 수출계약금액은 $5,000이다. 2월 10일에 선수금 $2,000를 수령하여 2월 12일에 2,000,000원으로 환가하였으며, 나머지 금액인 $3,000은 2월 15일에 수령하여 2월 20일에 환가하였다.(기준환율 2월 10일 1,100원/$; 2월 15일 1,200원/$; 2월 20일 1,300원/$)\n(3) 3월 5일: 시가 4,000,000원의 제품을 판매하여 현금 3,800,000원과 자기적립마일리지 200,000원으로 결제 받았다.\n(4) 사업을 위하여 대가를 받지 않고 거래처 A사에게 제품(시가 1,000,000원, 원가 500,000원)을 견본품으로 제공하였다.",
  choices:["14,000,000원","14,300,000원","14,500,000원","14,800,000원","15,300,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2021-74", subject:"세법학개론", year:2021, no:74, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"calc",
  stem:"일반과세자인 (주)세무는 건물, 기계장치 및 토지를 69,480,000원(부가가치세 제외)에 일괄양도 하였으며, 건물, 기계장치 및 토지 각각의 실거래가액은 불분명하다. 인도시점에 매각대금을 전액 수령하였고, 각 자산의 관련 자료는 다음과 같으며, 감정평가가액은 불분명하다. 이 경우 (주)세무의 건물에 대한 부가가치세 과세표준금액은?\n\n구분 / 건물 / 기계장치 / 토지\n취득가액 / 55,000,000원 / 11,000,000원 / 15,000,000원\n장부가액 / 33,000,000원 / 9,900,000원 / 15,000,000원\n기준시가 / 22,000,000원 / - / 14,000,000원",
  choices:["35,200,000원","36,000,000원","36,800,000원","38,600,000원","39,600,000원"],
  answer:1, status:"clear", note:"" },
{ id:"2021-75", subject:"세법학개론", year:2021, no:75, law:"부가가치세법", unit:"영세율과 면세", kind:"concept",
  stem:"「부가가치세법」상 면세대상에 관한 설명으로 옳은 것은?",
  choices:["「항공사업법」에 따른 항공기에 의한 여객운송 용역은 면세한다.","면세되는 도서ㆍ신문ㆍ잡지 등의 인쇄ㆍ제본 등을 위탁받아 인쇄ㆍ제본 등의 용역을 제공하는 것에 대하여는 면세한다.","피부과의원에 부설된 피부관리실에서 제공하는 피부관리용역은 면세한다.","우리나라에서 생산되어 식용으로 제공되지 아니하는 관상용의 새에 대하여는 면세하지 아니한다.","김치를 거래단위로서 포장하여 최종소비자에게 그 포장의 상태로 직접 공급하는 것에 대하여는 면세하지 아니한다."],
  answer:5, status:"clear", note:"" },
{ id:"2021-76", subject:"세법학개론", year:2021, no:76, law:"부가가치세법", unit:"세금계산서 및 절차규정", kind:"concept",
  stem:"「부가가치세법」상 신고와 납부에 관한 설명으로 옳지 않은 것은?",
  choices:["예정신고를 하는 사업자가 예정신고와 함께 매출ㆍ매입처별 세금계산서합계표를 제출하지 못하는 경우 해당 예정신고기간이 속하는 과세기간의 확정신고를 할 때 함께 제출할 수 있다.","재화를 수입하는 자(납세의무자)가 재화의 수입에 대하여「관세법」에 따라 관세를 세관장에게 신고하고 납부하는 경우에는 재화의 수입에 대한 부가가치세를 함께 신고납부해야 한다.","개인사업자의 경우 관할세무서장은 제1기 예정신고기간분 예정고지세액에 대해서 4월 1일부터 4월 25일까지의 기간 이내에 납부고지서를 발부해야 한다.","간이과세자에서 해당 과세기간 개시일 현재 일반과세자로 변경된 경우에는「부가가치세법」제48조제3항에 의한 예정고지세액을 징수하지 않는다.","개인사업자의 경우 각 예정신고기간분에 대해 조기환급을 받으려는 자는 예정신고 할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"2021-77", subject:"세법학개론", year:2021, no:77, law:"부가가치세법", unit:"과세·면세 겸영사업자의 세액계산 특례", kind:"calc",
  stem:"과세사업과 면세사업을 겸영하고 있는 (주)세무는 다음의 재화(기계장치, 건물, 원재료)를 취득하여 면세사업에만 사용하였다. (주)세무가 면세사업에만 사용하던 아래의 모든 재화를 2021.4.5.부터 과세사업과 면세사업에 공통사용하는 경우, 2021년 제1기 부가가치세 확정신고시 매입세액으로 공제할 수 있는 금액은? (단, 취득당시 면세사업과 관련한 매입세액을 불공제 하였음)\n\n구분 / 취득일자 / 취득가액(부가가치세 불포함)\n기계장치 / 2020.7.5. / 40,000,000원\n건물 / 2018.4.15. / 300,000,000원\n원재료 / 2020.9.9. / 100,000,000원\n\n또한, (주)세무의 공급가액은 다음과 같다.\n과세기간 / 과세사업 / 면세사업 / 합계\n2021년 제1기(1.1.~3.31.) / 15억원 / 5억원 / 20억원\n2021년 제1기(4.1.~6.30.) / 15억원 / 15억원 / 30억원",
  choices:["12,000,000원","14,400,000원","15,750,000원","18,900,000원","24,000,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2021-78", subject:"세법학개론", year:2021, no:78, law:"부가가치세법", unit:"과세·면세 겸영사업자의 세액계산 특례", kind:"calc",
  stem:"통조림판매(과세)와 과일판매(면세)를 겸영하고 있는 (주)세무는 2019.10.1. 공통사용하는 사업용건물을 110,000,000원(부가가치세 포함)에 매입하였다. 각 과세기간의 수입금액이 다음과 같을 때 2021년 제1기의 납부 및 환급세액 재계산으로 인하여 가산하거나 차감할 세액은? (단, 통조림판매부문과 과일판매부문의 건물사용면적은 구분되지 않음)\n\n과세기간 / 과일공급가액 / 통조림공급가액(부가가치세 제외) / 합계\n2019년 제2기 / 40,000,000원 / 60,000,000원 / 100,000,000원\n2020년 제1기 / 50,000,000원 / 50,000,000원 / 100,000,000원\n2020년 제2기 / 54,000,000원 / 46,000,000원 / 100,000,000원\n2021년 제1기 / 47,000,000원 / 53,000,000원 / 100,000,000원",
  choices:["없음","340,000원 납부세액에서 가산","595,000원 납부세액에서 가산","630,000원 납부세액에서 차감","700,000원 납부세액에서 차감"],
  answer:1, status:"clear", note:"" },
{ id:"2017-41", subject:"세법학개론", year:2017, no:41, law:"국세기본법", unit:"조세구제제도", kind:"concept",
  stem:"「국세기본법」상 심사와 심판에 관한 설명으로 옳지 않은 것은?",
  choices:["「감사원법」에 따라 심사청구를 한 처분이나 그 심사청구에 대한 처분에 대하여는 「국세기본법」상 불복청구를 할 수 없다.","심사청구의 대상이 된 처분에 대한 재조사 결정에 따라 처분청의 처분이 있는 경우 해당 재조사 결정을 한 재결청에 대하여 심사청구 또는 심판청구를 제기할 수 없다.","재결청은 이의신청인, 심사청구인 또는 심판청구인이 심각한 재해를 입은 경우 이를 정부가 조사하기 위하여 상당한 시일이 필요하다고 인정되는 경우에만 해당 처분의 집행을 중지할 수 있다.","조세심판관이 심판청구일 전 최근 5년 이내에 불복의 대상이 되는 처분, 처분에 대한 이의신청 또는 그 기초가 되는 세무조사에 관여하였던 경우에는 심판관여로부터 제척된다.","심판청구사건에 대한 결정이 국세행정에 중대한 영향을 미칠 것으로 예상되어 국세청장의 요청이 있고 조세심판원장이 필요하다고 인정하는 경우에는 조세심판관합동회의가 심리를 거쳐 결정하여야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"2017-42", subject:"세법학개론", year:2017, no:42, law:"국세기본법", unit:"과세", kind:"concept",
  stem:"「국세기본법」상 가산세에 관한 설명으로 옳지 않은 것은?",
  choices:["가산세는 해당 의무가 규정된 세법의 해당 국세의 세목으로 하나 해당 국세를 감면하는 경우 가산세는 감면대상에 포함되지 아니한다.","납세의무자가 국제거래에서 발생한 부정행위로 법정신고기한까지 법인세 과세표준 신고를 하지 아니한 경우에는 그 신고로 납부하여야 할 세액에 100분의 60을 곱한 금액을 가산세로 한다.","납세의무자가 법정신고기한까지 법인세의 과세표준 신고를 한 경우로서 착오에 의하여 과소신고를 한 때에는 과소신고납부세액의 100분의 10에 상당하는 금액을 가산세로 한다.","납부불성실 가산세를 부과함에 있어 납세의무자가 법인세를 부정행위로 과소신고하면서 과세기간을 잘못 적용한 경우 실제 신고납부한 날에 실제 신고납부한 금액의 범위에서 신고납부하였어야 할 과세기간에 대한 법인세를 자진납부한 것으로 본다.","정부는 납세자가 의무를 이행하지 아니한 데 대한 정당한 사유가 있는 때에는 해당 가산세를 부과하지 아니한다."],
  answer:4, status:"clear", note:"" },
{ id:"2017-43", subject:"세법학개론", year:2017, no:43, law:"국세기본법", unit:"국세부과와 세법 적용", kind:"concept",
  stem:"「국세기본법」상 신의성실의 원칙에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["조세실체법에 대한 신의성실의 원칙 적용은 합법성을 희생하여서라도 구체적 신뢰보호의 필요성이 인정되는 경우에 한하여 허용된다.","세무서 직원들이 명시적으로 부가가치세 면제대상으로 세무지도를 하여 납세자가 이를 믿고 부가가치세를 거래징수하지 않았으나 그 이후에 과세관청이 한 부가가치세 과세처분은 신의성실의 원칙에 위반된다.","신의성실의 원칙은 과세관청이 과거의 언동에 반하여 소급 처분하는 것을 금지하는 것으로 과세관청이 과거의 언동을 시정하여 장래에 향하여 처분하는 것은 허용된다.","납세의무자가 인터넷 국세종합상담센터의 답변에 따라 세액을 과소신고ㆍ납부한 경우 그 답변은 과세관청의 공식적인 견해표명에 해당하지 않는다.","납세의무자가 자산을 과대계상하는 방법으로 분식결산을 하고 이에 따라 법인세를 과다신고ㆍ납부한 후 그 과다납부한 세액에 대한 감액을 주장하는 경우 납세의무자에게 신의성실의 원칙이 적용된다."],
  answer:5, status:"clear", note:"" },
{ id:"2017-44", subject:"세법학개론", year:2017, no:44, law:"국세기본법", unit:"납세자의 권리", kind:"concept",
  stem:"「국세기본법」상 세무조사에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)",
  choices:["납세자가 세무공무원에게 직무와 관련하여 금품제공을 알선한 경우에는 정기선정에 의한 조사 외에 세무조사를 할 수 있다.","세무공무원이 납세의무자의 2015년도분 소득세에 대한 임대료수입금액 누락에 대하여 세무조사를 마친 후 다시 2015년도분 소득세에 대한 음식점수입금액 누락에 대하여 세무조사를 하는 경우에는 세무조사의 내용이 중첩되지 않으므로 원칙적으로 「국세기본법」에서 금지하는 재조사에 해당하지 않는다.","세무공무원은 세무조사 과정에서 「조세범 처벌절차법」에 따른 조세범칙조사로 전환하는 경우에는 납세자에게 별도의 통지 없이 세무조사의 범위를 확대할 수 있다.","세무공무원은 국외자료의 수집에 따라 외국 과세기관과의 협의가 필요하여 세무조사를 진행하기 어려운 경우에는 세무조사를 중지할 수 있고 이 중지기간은 세무조사기간에 산입된다.","세무조사의 적법요건으로 객관적 필요성, 최소성, 권한남용의 금지 등을 규정하고 있는 「국세기본법」 제81조의4 제1항은 그 자체로서는 구체적인 법규적 효력이 없다."],
  answer:1, status:"clear", note:"" },
{ id:"2017-45", subject:"세법학개론", year:2017, no:45, law:"국세기본법", unit:"납세의무", kind:"concept",
  stem:"다음의 거주자 甲의 납세의무 성립시기가 빠른 순서대로 나열한 것은?\n\nㄱ. 부친이 2017.4.1.에 사망하여 甲에게 부과된 상속세에 대한 가산세\nㄴ. 甲이 2017.2.1.에 취득한 부동산에 대한 종합부동산세\nㄷ. 은행이 2017.5.1.에 甲에게 지급한 이자소득에 대하여 원천징수한 소득세\nㄹ. 甲이 2017년에 중간예납한 소득세\nㅁ. 甲이 금융업자로서 그 수익금액에 대하여 2017년에 부과 받은 교육세",
  choices:["ㄱ-ㄷ-ㄴ-ㄹ-ㅁ","ㄴ-ㄱ-ㄷ-ㅁ-ㄹ","ㄷ-ㄱ-ㄴ-ㅁ-ㄹ","ㄹ-ㄷ-ㄱ-ㄴ-ㅁ","ㅁ-ㄱ-ㄴ-ㄷ-ㄹ"],
  answer:1, status:"clear", note:"" },
{ id:"2017-46", subject:"세법학개론", year:2017, no:46, law:"국세징수법", unit:"신고납부, 납부고지 등", kind:"concept",
  stem:"「국세징수법」상 징수의 유예에 관한 설명으로 옳지 않은 것은?",
  choices:["세무서장은 납기가 시작되기 전에 납세자의 질병으로 장기치료가 필요하여 국세를 납부할 수 없다고 인정할 때에는 국세의 납세 고지를 유예할 수 있다.","징수유예기간에는 국세징수권의 소멸시효가 진행되지 아니한다.","세무서장은 납세자가 독촉을 받은 후 사업이 중대한 위기에 처하여 체납액을 납부기한까지 납부할 수 없다고 인정할 때에는 법령에 따라 납부기한을 다시 정하여 징수를 유예할 수 있다.","세무서장은 징수를 유예한 기간 중 체납액에 대하여 교부청구를 할 수 있다.","징수를 유예받은 납세자의 재산상황 변화로 유예할 필요가 없다고 인정되어 세무서장이 유예를 취소한 경우 그 국세와 체납액에 대하여 다시 징수유예를 할 수 없다."],
  answer:5, status:"clear", note:"" },
{ id:"2017-47", subject:"세법학개론", year:2017, no:47, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"「국세징수법」상 체납처분에 관한 설명으로 옳지 않은 것은?",
  choices:["세무서장은 납세자가 독촉장을 받고 지정된 기한까지 국세와 가산금을 완납하지 아니한 경우 납세자의 재산을 압류한다.","세무서장은 체납자가 국유 재산을 매수한 것이 있을 때에는 소유권 이전 전이라도 그 재산에 관한 체납자의 정부에 대한 권리를 압류한다.","재판상의 가압류 재산이 체납처분 대상인 경우에도 「국세징수법」에 따른 체납처분을 한다.","세무서장이 체납자의 채권을 압류할 때 채권의 채무자에게 압류의 통지를 한 때에는 체납액을 한도로 하여 체납자인 채권자를 대위한다.","부동산에 대한 압류는 압류재산의 소유권이 이전된 후 「국세기본법」에 따른 법정기일이 도래한 국세의 체납액에 대하여도 그 효력이 미친다."],
  answer:5, status:"clear", note:"" },
{ id:"2017-48", subject:"세법학개론", year:2017, no:48, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"「국세징수법」상 공매에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["「국세징수법」상 체납처분절차를 통하여 압류재산을 매각한 후 그 매각대금을 배분함에 있어서 국세와 다른 채권 간의 우선순위는 압류재산의 매각대금을 배분하기 위하여 「국세징수법」상 배분계산서를 작성함으로써 체납처분이 종료되는 때에 비로소 확정된다.","세무서장은 압류한 재산이 예술품인 경우에는 직권으로 전문매각기관을 선정하여 예술품의 매각을 대행하게 할 수 있다.","세무서장이 체납자에게 공매통지를 하지 않은 공매처분은 위법하다.","「국세기본법」에 따른 심판청구 절차가 진행 중인 국세의 체납으로 압류한 재산이 감량되기 쉬운 재산으로서 속히 매각하지 아니하면 그 재산가액이 줄어들 우려가 있는 경우에도 청구에 대한 결정이 확정되기 전에 공매할 수 없다.","공매를 집행하는 공무원은 매각결정 기일 전에 제3자가 그 체납액을 완납하면 공매를 중지하여야 한다."],
  answer:4, status:"clear", note:"" },
{ id:"2017-49", subject:"세법학개론", year:2017, no:49, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"「조세범처벌법」상 조세포탈에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["조세포탈이 성립하기 위해서는 법령에 열거된 사기나 그 밖의 부정한 행위를 통해 조세의 부과와 징수를 불가능하게 하거나 현저히 곤란하게 하는 적극적 행위를 할 것이 요구된다.","회사의 폐업 후에 부가가치세의 과세표준 및 세액을 관할세무서에 신고하지 아니하거나 세법상 요구되는 장부를 비치하지 않았다고 하여 조세포탈죄가 성립되지는 않는다.","부가가치세는 신고납부기간이 경과한 때에 조세포탈행위의 기수가 된다 할 것이고 그 납부 후에 포탈세액 일부를 납부하였다 하더라도 조세포탈죄의 성립에는 아무런 영향을 미칠 수 없다.","조세포탈의 죄를 범한 자가 포탈세액에 대하여 법정신고기한이 지난 후 6개월 이내에 「국세기본법」에 따른 기한 후 신고를 하였을 때에는 형을 감경할 수 있다.","매출누락에 따른 부가가치세의 포탈세액을 산정함에 있어서 매입세금계산서를 교부받지 아니한 매입액에 대한 매입세액을 매출세액에서 공제하여야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"2017-50", subject:"세법학개론", year:2017, no:50, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"「조세범처벌법」상 세금계산서 발급 관련 범죄에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["세금계산서를 발급하여야 할 자가 재화를 공급하면서 공급가액을 부풀려 세금계산서를 발급한 경우 세금계산서를 거짓으로 기재하여 발급한 죄에 해당한다.","재화를 공급하지 않은 자가 타인 명의를 위조하여 그 타인을 공급하는 자로 기재하여 세금계산서를 교부한 경우 거래 없이 세금계산서를 교부한 죄에 해당하지 않는다.","재화를 공급한 자가 재화를 실제로 공급받은 자가 아닌 다른 사람에게 세금계산서를 발급한 경우 세금계산서 미발급으로 인한 죄에 해당하지 않는다.","용역을 제공받은 사실이 없음에도 허위 세금계산서를 교부받은 이상 허위 세금계산서를 자료상이 아닌 자로부터 교부받았다 하더라도 용역을 공급받지 않고 세금계산서를 발급받은 죄에 해당한다.","거래 없이 세금계산서를 교부한 죄는 각 세금계산서마다 1개의 죄가 성립한다."],
  answer:3, status:"clear", note:"" },
{ id:"2017-51", subject:"세법학개론", year:2017, no:51, law:"소득세법", unit:"소득세 총칙", kind:"concept",
  stem:"위법소득의 과세에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["회사의 부사장이 회사소유 부동산을 매각하여 그 처분대금을 횡령한 경우 경제적 측면에서 보아 현실로 이득을 지배관리하면서 이를 향수하고 있어 담세력이 있는 것으로 판단되므로 과세소득에 해당한다.","매매가 위법한 것이어서 무효임에도 당사자 사이에서 그 매매계약이 유효한 것으로 취급되어 매도인이 매매대금을 수수하여 그대로 보유하고 있는 경우 양도소득세 과세대상이 된다.","법인의 피용자의 지위에 있는 자가 법인의 자금을 횡령하여 법인이 그 자에 대한 손해배상채권을 취득하는 경우에는 그 금원 상당액이 곧바로 사외유출된 것으로 볼 수는 없어 소득처분에 의한 근로소득으로 과세될 수 없다.","법인과 이사 사이에 이익이 상반되는 금전소비대차라 하더라도 그 소비대차에서 발생한 이자소득은 과세대상이 된다.","위법소득에 대한 납세의무가 성립한 후에는 「형법」에 따른 몰수가 이루어진 경우라 하더라도 「국세기본법」상 후발적 경정청구의 대상이 되지 않는다."],
  answer:5, status:"clear", note:"" },
{ id:"2017-52", subject:"세법학개론", year:2017, no:52, law:"소득세법", unit:"양도소득세", kind:"concept",
  stem:"「소득세법」상 양도소득금액의 계산에서 양도가액과 취득가액에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["양도소득세 과세대상이 되는 거래가 단순한 교환인 경우는 실지거래가액을 확인할 수 없는 경우에 해당한다.","「법인세법」에 따른 특수관계인에 해당하는 법인 외의 자에게 부동산을 시가보다 높은 가격으로 양도하는 경우로서 「상속세 및 증여세법」에 따라 해당 거주자의 증여재산가액으로 하는 금액이 있는 경우 그 부동산의 시가를 실지양도가액으로 본다.","취득일로부터 3년이 지난 후에 취득 당시로 소급하여 한 감정에 의하여 평가한 가액은 취득 당시의 실지거래가액을 대체할 수 있는 감정가액에 해당하지 않는다.","「법인세법」에 따른 특수관계인으로부터 부동산을 취득한 경우 거주자의 상여로 처분된 금액이 있으면 그 상여로 처분된 금액을 취득가액에 더한다.","양도차익 계산시 양도가액을 매매사례가액으로 하는 경우 취득가액을 실지거래가액에 따를 수 있다."],
  answer:2, status:"clear", note:"" },
{ id:"2017-53", subject:"세법학개론", year:2017, no:53, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"calc",
  stem:"다음은 (주)A에 근무하는 거주자 甲의 2017년도 소득자료이다. 甲의 기타소득으로 원천징수될 소득세액은 얼마인가? (단, 다음 소득은 일시ㆍ우발적으로 발생하였으며, 소득과 관련된 필요경비는 확인되지 않음)\n\n(1) 상가입주 지체상금 1,500,000원\n(2) 상표권 대여료 1,000,000원\n(3) 지상권 설정대가 2,000,000원\n(4) 서화를 미술관에 양도하고 받은 대가 10,000,000원\n(5) (주)B의 입사시험 출제수당 250,000원\n(6) 복권당첨금 3,000,000원\n(7) 배임수재로 받은 금품 5,000,000원",
  choices:["300,000원","460,000원","1,020,000원","1,180,000원","2,700,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2017-54", subject:"세법학개론", year:2017, no:54, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"calc",
  stem:"다음은 거주자 甲(62세)이 2017년도에 수령한 국민연금과 연금계좌에 대한 자료이다. 「소득세법」상 甲의 2017년도 종합과세되는 총연금액은 얼마인가? (단, 甲이 종합과세와 분리과세 중 선택할 수 있는 경우에는 종합과세를 선택한 것으로 가정함)\n\n(1) 2017년도 국민연금 수령액은 30,000,000원이고, 국민연금 환산소득누계액과 국민연금보험료 누계액 자료는 다음과 같음\n ① 2002.1.1. 이후 국민연금 납입기간의 환산소득 누계액: 450,000,000원\n ② 2001.12.31. 이전 국민연금 납입기간의 환산소득 누계액: 900,000,000원\n ③ 2002.1.1. 이후 납입한 국민연금보험료 누계액: 60,000,000원(소득공제 받지 않은 금액 3,000,000원)\n(2) 2017년도 연금계좌(가입일: 2007.2.10., 수령시작일: 2017.3.10.)에서 연금으로 수령한 금액은 25,000,000원이고, 연금수령개시 신청일인 2017.3.10. 현재 연금계좌평가액 50,000,000원의 내역은 다음과 같음\n ① 甲이 납입한 연금보험료 합계액: 33,000,000원(소득공제 또는 세액공제 받지 않은 금액 2,000,000원)\n ② 연금계좌 운용수익: 10,000,000원\n ③ 이연퇴직소득: 7,000,000원",
  choices:["7,000,000원","10,000,000원","11,000,000원","12,000,000원","13,000,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2017-55", subject:"세법학개론", year:2017, no:55, law:"소득세법", unit:"소득세 절차규정과 외국법인·비거주자", kind:"concept",
  stem:"「소득세법」상 원천징수에 관한 설명으로 옳지 않은 것은?",
  choices:["법인세 과세표준을 경정하는 경우 「법인세법」에 따라 처분되는 상여는 경정의 대상이 되는 사업연도 중 근로를 제공 받은 날에 근로소득을 지급한 것으로 보아 소득세를 원천징수한다.","원천징수의무자가 소득세가 면제되는 이자소득을 거주자에게 지급할 때는 소득세를 원천징수하지 아니한다.","배당소득이 발생한 후 지급되지 않아 소득세가 원천징수되지 않고 종합소득에 합산되어 종합소득에 대한 소득세가 과세된 경우에 그 소득을 지급할 때는 소득세를 원천징수하지 아니한다.","거주자의 퇴직소득이 퇴직일 현재 연금계좌에 있는 경우 해당 퇴직소득에 대한 소득세를 연금외수령하기 전까지 원천징수하지 아니한다.","공적연금소득을 받는 사람이 해당 과세기간 중에 사망한 경우 원천징수의무자는 그 사망일이 속하는 달의 다음다음 달 말일까지 그 사망자의 공적연금소득에 대한 연말정산을 하여야 한다."],
  answer:1, status:"clear", note:"" },
{ id:"2017-56", subject:"세법학개론", year:2017, no:56, law:"소득세법", unit:"소득세 총칙", kind:"concept",
  stem:"「소득세법」상 거주자 및 비거주자의 납세의무에 관한 설명으로 옳은 것은?",
  choices:["국내에 거소를 둔 기간이 2과세기간에 걸쳐 183일 이상인 경우에는 국내에 183일 이상 거소를 둔 것으로 본다.","거주자는 거소의 국외 이전을 위하여 출국하는 날부터 비거주자가 된다.","내국법인이 발행주식총수의 100분의 80을 직접 출자한 해외현지법인에 파견된 직원은 거주자로 본다.","비거주자는 국내에 주소를 둔 기간이 183일이 되는 날부터 거주자가 된다.","「소득세법」에 따른 거소는 국내에 생계를 같이 하는 가족 및 국내에 소재하는 자산의 유무 등 생활관계의 객관적 사실에 따라 판정한다."],
  answer:1, status:"clear", note:"" },
{ id:"2017-57", subject:"세법학개론", year:2017, no:57, law:"소득세법", unit:"양도소득세", kind:"concept",
  stem:"거주자 甲은 2014.3.10.에 (주)A의 총발행주식 10,000주 중 6,000주를 취득한 이후 계속 보유하고 있다가 2017.6.15.에 (주)A의 주식 5,200주를 특수관계 없는 거주자 乙에게 양도하였다. 2017.6.15. 현재 (주)A의 재무상태표가 다음과 같을 경우, 甲의 (주)A의 주식 양도로 발생하는「소득세법」상 양도소득세 납세의무에 관한 설명으로 옳은 것은? (단, (주)A는 제조업을 영위하는 중소기업이 아닌 비상장 내국법인이며, 재무상태표상 토지 및 건물의 장부가액은 기준시가와 일치한다고 가정함)\n\n(주)A의 재무상태표 (단위: 원)\n현금 20,000,000 / 부채 50,000,000\n토지 200,000,000 / 자본금 200,000,000\n건물 150,000,000 / 이익잉여금 250,000,000\n기계장치 130,000,000 /\n계 500,000,000 / 계 500,000,000",
  choices:["甲은 2017.8.31.까지 양도소득 과세표준을 예정신고해야 한다.","甲은 양도차익에서 장기보유특별공제액을 차감할 수 있다.","甲은 양도소득 과세표준에 20%의 세율을 적용하여 계산한 금액을 양도소득 산출세액으로 한다.","甲은 (주)A의 주식 양도 이외에 다른 양도소득이 없더라도 양도소득기본공제를 받을 수 없다.","甲이 (주)A의 주식을 양도할 때 명의개서하지 않으면 양도로 보지 아니한다."],
  answer:1, status:"clear", note:"" },
{ id:"2017-58", subject:"세법학개론", year:2017, no:58, law:"소득세법", unit:"종합소득 세액계산", kind:"calc",
  stem:"다음은 중소기업을 운영하는 거주자 甲의 2017년도 소득자료이다. 甲의 종합소득산출세액에서 공제될 배당세액공제액을 계산하면 얼마인가?\n\n(1) 금융소득 자료\n ① 내국법인 A의 현금배당 70,000,000원\n ② 외국법인 B의 현금배당 10,000,000원\n ③ 국내은행 정기예금이자 5,000,000원\n(2) 금융소득 외에 2017년도 사업소득금액은 27,850,000원이며, 종합소득공제액은 20,000,000원임\n(3) 기본세율\n과세표준 / 세율\n1천200만원 이하 / 과세표준의 6%\n1천200만원 초과 4천600만원 이하 / 72만원 + (1천200만원을 초과하는 금액의 15%)\n4천600만원 초과 8천800만원 이하 / 582만원 + (4천600만원을 초과하는 금액의 24%)\n8천800만원 초과 1억5천만원 이하 / 1천590만원 + (8천800만원을 초과하는 금액의 35%)\n1억5천만원 초과 5억원 이하 / 3천760만원 + (1억5천만원을 초과하는 금액의 38%)\n5억원 초과 / 1억7천60만원 + (5억원을 초과하는 금액의 40%)",
  choices:["3,209,000원","4,409,000원","5,609,000원","7,150,000원","7,700,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2017-59", subject:"세법학개론", year:2017, no:59, law:"소득세법", unit:"양도소득세", kind:"concept",
  stem:"거주자 甲은 배우자인 거주자 乙이 2007.3.1.에 300,000,000원에 취득한 토지를 2013.4.1.에 乙로부터 증여(증여 당시 시가 700,000,000원) 받아 소유권이전등기를 마쳤다. 이후 甲은 2017.6.1.에 토지를 甲 또는 乙과 특수관계 없는 거주자 丙에게 1,000,000,000원에 양도하였다. 甲 또는 乙의 양도소득 납세의무에 관한 설명으로 옳은 것은? (단, 양도소득은 실질적으로 甲에게 귀속되지 아니하고, 토지는 법령상 협의매수 또는 수용된 적이 없으며, 양도 당시 甲과 乙은 혼인관계를 유지하고 있음)",
  choices:["토지의 양도차익 계산시 양도가액에서 공제할 취득가액은 700,000,000원이다.","토지의 양도차익 계산시 취득시기는 2007.3.1. 이다.","토지의 양도차익 계산시 甲의 증여세 산출세액은 양도가액에서 공제할 수 없다.","甲과 乙은 연대하여 토지의 양도소득세 납세의무를 진다.","토지의 양도소득세 납세의무자는 乙이다."],
  answer:2, status:"clear", note:"" },
{ id:"2017-60", subject:"세법학개론", year:2017, no:60, law:"소득세법", unit:"이자소득과 배당소득", kind:"concept",
  stem:"「소득세법」상 배당소득에 관한 설명으로 옳은 것은?",
  choices:["법인으로 보는 단체로부터 받는 분배금은 배당소득에 해당하지 않는다.","외국법인으로부터 받는 이익이나 잉여금의 배당은 배당소득에 해당하지 않는다.","합병으로 소멸한 법인의 주주가 합병 후 존속하는 법인으로부터 그 합병으로 취득한 주식의 가액과 금전의 합계액이 그 합병으로 소멸한 법인의 주식을 취득하기 위하여 사용한 금액을 초과하는 금액은 배당소득에 해당하지 않는다.","거주자가 일정기간 후에 같은 종류로서 같은 양의 주식을 반환 받는 조건으로 주식을 대여하고 해당 주식의 차입자로부터 지급받는 해당 주식에서 발생하는 배당에 상당하는 금액은 배당소득에 해당하지 않는다.","국외에서 설정된 집합투자기구로부터의 이익은 해당 집합투자기구의 설정일부터 매년 1회 이상 결산ㆍ분배할 것이라는 요건을 갖추지 않아도 배당소득에 해당한다."],
  answer:5, status:"clear", note:"" },
{ id:"2017-61", subject:"세법학개론", year:2017, no:61, law:"법인세법", unit:"기타 법인세", kind:"concept",
  stem:"「법인세법」상 비영리내국법인에 관한 설명으로 옳은 것은?",
  choices:["비영리내국법인이 수익사업을 영위하는 경우 구분경리하지 않는 것을 원칙으로 한다.","비영리내국법인의 청산소득에 대하여는 법인세가 과세된다.","비영리내국법인은 「소득세법」에 따른 비영업대금의 이익에 대해서 반드시 법인세 과세표준신고를 하여야 한다.","비영리내국법인은 고유목적사업준비금을 손금에 산입한 날이 속하는 사업연도 종료일 이후 3년이 되는 날까지 고유목적사업에 사용하여야 한다.","축산업을 영위하는 비영리내국법인은 지상권의 양도로 인하여 발생하는 소득이 있는 경우 법인세 과세표준신고를 하여야 한다."],
  answer:3, status:"clear", note:"" },
{ id:"2017-62", subject:"세법학개론", year:2017, no:62, law:"법인세법", unit:"부당행위계산의 부인", kind:"concept",
  stem:"「법인세법」상 부당행위계산의 부인에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["법인과 특수관계인 간의 거래는 반드시 직접적인 거래관계에 국한하지 않고 특수관계인 외의 자를 통하여 이루어진 거래도 포함한다.","비상장주식에 대하여 특수관계인이 아닌 제3자 간에 일반적으로 거래된 가격이 없으면 「상속세 및 증여세법」에 따른 보충적 평가방법을 준용하여 평가한 금액을 기준으로 부당행위계산부인 규정을 적용한다.","법령으로 정하는 파생상품에 근거한 권리를 행사하지 아니하거나 그 행사기간을 조정하는 방법으로 이익을 분여하는 경우는 ‘조세의 부담을 부당하게 감소시킨 것으로 인정되는 경우’에 해당한다.","부당행위계산부인 규정은 세법상 과세소득계산상의 범위 내에서만 변동을 초래할 뿐 당사자 간에 약정한 사법상 법률행위의 효과와는 무관하다.","부당행위계산에 해당하는 경우 시가와의 차액 등을 익금에 산입하여 당해 법인의 각 사업연도의 소득금액을 계산하고 귀속자에게 증여세를 과세하는 것을 원칙으로 한다."],
  answer:5, status:"clear", note:"" },
{ id:"2017-63", subject:"세법학개론", year:2017, no:63, law:"법인세법", unit:"세무조정과 소득처분", kind:"concept",
  stem:"「법인세법」상 장부에 계상하여야 세무조정의 효과가 발생하는 조정(이하 ‘결산조정’이라 함)과 소득금액조정합계표에 계상하여야 세무조정의 효과가 발생하는 조정(이하 ‘신고조정’이라 함)에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 익금항목은 모두 신고조정사항이다.\nㄴ. 일시상각충당금은 원칙적으로 결산조정사항이지만, 예외적으로 신고조정을 허용한다.\nㄷ. 「채무자 회생 및 파산에 관한 법률」에 따른 회생계획인가의 결정 또는 법원의 면책결정에 따라 회수불능으로 2017년도에 확정된 채권을 2020년도에 손금에 계상한 경우 손금으로 인정되지 않는다.\nㄹ. 물품의 수출 또는 외국에서의 용역제공으로 발생한 채권으로서 외국환거래에 관한 법령에 따라 한국은행총재 또는 외국환은행의 장으로부터 채권회수의무를 면제받은 것은 신고조정사항이다.\nㅁ. 감가상각비의 손금산입은 모두 결산조정사항이다.",
  choices:["ㄱ","ㄴ, ㄷ","ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],
  answer:4, status:"clear", note:"" },
{ id:"2017-64", subject:"세법학개론", year:2017, no:64, law:"법인세법", unit:"세무조정과 소득처분", kind:"calc",
  stem:"다음은 내국법인 (주)A의 제17기 사업연도(2017.1.1.~12.31.) 자료이다. 세무조정시 대표자에 대한 상여와 기타사외유출로 소득처분할 금액은 각각 얼마인가?\n\n(1) 현금매출누락 100,000,000원(부가가치세 제외한 금액)\n(2) 채권자가 불분명한 사채이자 15,000,000원(원천징수세액 4,125,000원 포함)\n(3) 증빙불비 접대비 4,000,000원(귀속자 불분명)\n(4) 업무와 관련하여 발생한 교통사고 벌과금 1,000,000원\n(5) 사외유출된 금액의 귀속이 불분명하여 대표자에 대한 상여로 처분을 한 경우, (주)A가 그 처분에 따른 소득세를 대납하고 이를 손비로 계상한 금액 2,500,000원",
  choices:["대표자 상여 110,875,000원 / 기타사외유출 11,625,000원","대표자 상여 114,875,000원 / 기타사외유출 7,625,000원","대표자 상여 115,000,000원 / 기타사외유출 7,500,000원","대표자 상여 117,375,000원 / 기타사외유출 5,125,000원","대표자 상여 119,000,000원 / 기타사외유출 3,500,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2017-65", subject:"세법학개론", year:2017, no:65, law:"법인세법", unit:"익금과 익금불산입", kind:"calc",
  stem:"제조업을 영위하는 내국법인 (주)C는 제35기 과세기간(2017.1.1.~12.31.) 중 주식발행초과금 150,000,000원을 재원으로 하여 무상증자를 시행하였다. 무상증자 직전의 (주)C의 발행주식총수는 300,000주(1주당 액면가액은 500원)이며 주주구성 및 보유주식현황은 다음 표와 같을 때 상황1과 상황2에서 (주)B의 의제배당금액을 계산하면 각각 얼마인가?\n\n무상증자 직전의 주주구성 및 보유주식현황\n주주구성 / 보유주식수\n(주)A / 180,000주\n(주)B / 60,000주\n(주)C / 60,000주\n합계 / 300,000주\n\n<상황1> 무상증자시 자기주식에 배정할 무상주 60,000주에 대하여 (주)C를 제외한 기타주주의 지분비율에 따라 배정하여 무상증자후 총발행주식수가 600,000주가 되었다고 가정\n<상황2> 무상증자시 자기주식에 배정할 무상주 60,000주에 대하여 (주)C를 제외한 기타주주에게 배정하지 않아 무상증자후 총발행주식수가 540,000주가 되었다고 가정",
  choices:["상황1 6,500,000원 / 상황2 4,500,000원","상황1 6,500,000원 / 상황2 5,500,000원","상황1 7,500,000원 / 상황2 5,500,000원","상황1 7,500,000원 / 상황2 6,000,000원","상황1 8,000,000원 / 상황2 6,000,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2017-66", subject:"세법학개론", year:2017, no:66, law:"법인세법", unit:"과세표준", kind:"concept",
  stem:"「법인세법」상 내국법인의 과세표준 및 세액의 계산에 관한 설명으로 옳지 않은 것은? (단, 중소기업의 경우 법령상 요건을 모두 갖추고 있는 것으로 가정함)",
  choices:["중소기업은 결손금 소급공제시 직전 사업연도의 소득에 대하여 과세된 법인세액을 한도로 한다. 여기에서 과세된 법인세액이란 법령에 따른 토지 등 양도소득에 대한 법인세를 제외하고 직전 사업연도의 소득에 대한 법인세로서 공제 또는 감면된 법인세액을 차감한 금액을 말한다.","중소기업은 결손금이 발생한 사업연도와 직전 사업연도의 소득에 대한 법인세 과세표준 및 세액을 각각의 과세표준신고기한 내에 적법하게 신고하고 환급신청을 한 경우에만 결손금 소급공제를 적용할 수 있으나 발생한 결손금의 일부만을 소급공제 신청할 수는 없다.","결손금 공제 중 이월공제는 신청을 요건으로 하지 않는다.","각 사업연도 소득에 대한 법인세의 과세표준은 각 사업연도 소득의 범위에서 법정 이월결손금, 비과세소득, 소득공제액을 차례로 공제한 금액으로 한다. 다만, 중소기업과 회생계획을 이행 중인 기업 등 법령으로 정하는 법인을 제외한 내국법인의 경우 법정 이월결손금 금액에 대한 공제의 범위는 각 사업연도 소득의 100분의 80으로 한다.","법인세의 과세표준과 세액을 추계하는 경우에는 이월결손금 공제규정을 적용하지 아니한다. 다만, 천재지변 등으로 장부나 그 밖의 증명서류가 멸실되어 법령으로 정하는 바에 따라 추계하는 경우에는 그러하지 아니하다."],
  answer:2, status:"clear", note:"" },
{ id:"2017-67", subject:"세법학개론", year:2017, no:67, law:"법인세법", unit:"익금과 익금불산입", kind:"concept",
  stem:"「법인세법」상 익금에 관한 설명으로 옳지 않은 것은?",
  choices:["익금은 자본 또는 출자의 납입 및 「법인세법」에서 규정하는 것은 제외하고 해당 법인의 순자산을 증가시키는 거래로 인하여 발생하는 수익의 금액으로 한다.","이월결손금의 보전에 충당하지 않은 자산수증이익과 채무의 출자전환에 따른 채무면제이익은 해당 사업연도에 익금불산입하고 그 이후의 각 사업연도에 발생한 결손금의 보전에 충당할 수 있다.","「법인세법」에 따른 특수관계인인 개인으로부터 유가증권을 시가보다 낮은 가액으로 매입하는 경우 당해 시가와 그 매입가액의 차액에 상당하는 금액은 익금으로 본다.","국세 과오납금의 환급금에 대한 이자는 익금으로 보지 않는다.","채무의 출자전환시 시가가 액면가액에 미달하는 경우 익금에 산입되는 채무면제이익은 발행가액에서 액면가액을 차감하여 계산한다."],
  answer:2, status:"clear", note:"" },
{ id:"2017-68", subject:"세법학개론", year:2017, no:68, law:"법인세법", unit:"손금과 손금불산입", kind:"concept",
  stem:"「법인세법」상 손금에 관한 설명으로 옳지 않은 것은?",
  choices:["「법인세법」은 손비의 범위에 관한 일반적 기준으로서 그 법인의 사업과 관련하여 발생하거나 지출된 손실 또는 비용으로서 일반적으로 인정되는 통상적인 것이거나 수익과 직접 관련된 것으로 규정하고 있다.","합명회사나 합자회사의 노무출자사원에 대한 보수는 이익처분에 의한 상여로 의제하여 손금에 산입하지 아니한다.","내국법인이 임직원과 성과산정지표 및 그 목표, 성과의 측정 및 배분방법 등에 대하여 사전에 서면으로 약정하고 이에 따라 그 임직원에게 지급하는 성과배분상여금은 이익처분에 의해 지급하는 경우에도 이를 손금에 산입한다.","「근로자퇴직급여 보장법」에 따른 퇴직급여 중간정산을 현실적 퇴직으로 보아 손금에 산입하는 경우는 중간정산시점부터 새로 근무연수를 기산하여 퇴직급여를 계산하는 경우에 한정한다.","부동산임차인이 부담한 사실이 확인되는 전세금 및 임차보증금에 대한 매입세액은 임차인의 손금으로 산입할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"2017-69", subject:"세법학개론", year:2017, no:69, law:"법인세법", unit:"손금과 손금불산입", kind:"calc",
  stem:"다음은 제조업을 영위하는 중소기업이 아닌 내국법인 (주)A의 제11기 사업연도(2017.1.1.~2017.12.31.) 접대비와 관련된 자료이다. 손금불산입되는 접대비의 총액은 얼마인가? (단, 아래의 자료에서 특별히 언급한 것 이외에는 모든 지출은 (주)A 명의의 신용카드로 사용하였고, 접대비로 계상된 금액은 업무관련성이 있으며 경조금은 없는 것으로 가정함)\n\n(1) 기업회계기준상 매출액: 9,000,000,000원(특수관계인 매출액 3,000,000,000원 포함)\n(2) 당기 포괄손익계산서상 접대비 계정 금액은 60,000,000원으로 상세 내역은 다음과 같다.\n구분 / 건당 1만원 이하 / 건당 1만원 초과\n현금 사용금액(영수증 수취) / 6,000,000원 / 10,000,000원\n(주)A 명의의 신용카드 사용금액 / 4,000,000원 / 40,000,000원\n계 / 10,000,000원 / 50,000,000원\n(3) 당기 복리시설비 계정에는 법인형태로 설립된 (주)A의 노동조합에 지출한 복리시설비 5,000,000원이 포함되어 있다.\n(4) 당기 광고선전비 계정에는 (주)A의 우량 거래처 50곳에 개당 시가 100,000원(부가가치세 포함)의 광고선전물품을 구입하여 제공한 금액 5,000,000원이 포함되어 있다.",
  choices:["35,400,000원","39,400,000원","40,400,000원","45,400,000원","51,400,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2017-70", subject:"세법학개론", year:2017, no:70, law:"법인세법", unit:"손금과 손금불산입", kind:"calc",
  stem:"다음은 내국법인 (주)A의 제10기 사업연도(2017.1.1.~2017.12.31.) 세무조정 관련 자료이다. 제10기 각 사업연도 소득금액은 얼마인가?\n\n(1) 세무조정 내역* \n포괄손익계산서상 당기순이익 6,000,000원\n익금산입ㆍ손금불산입 7,000,000원\n손금산입ㆍ익금불산입 17,000,000원\n계 △4,000,000원\n*비지정기부금을 제외한 기부금 관련 세무조정은 포함되지 않음\n(2) 포괄손익계산서상 기부금 내역\n새마을금고에 지출한 기부금 3,000,000원\n불우이웃돕기성금 5,000,000원\n천재지변으로 인한 이재민 구호금품 2,000,000원\n대한적십자사에 기부한 기부금** 1,000,000원\n계 11,000,000원\n**대한적십자사에 대한 기부금은 어음(결제일: 2018.1.5.)을 발행한 것임\n(3) (주)A의 세무상 이월결손금은 1,500,000원(제7기 발생분)이며, 당기 이전 기부금 한도초과로 손금불산입된 금액은 다음과 같다.\n법정기부금: 500,000원(2015년 지출분)\n지정기부금: 800,000원(2014년 지출분)",
  choices:["△250,000원","1,000,000원","2,625,000원","3,525,000원","3,775,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2017-71", subject:"세법학개론", year:2017, no:71, law:"부가가치세법", unit:"과세거래", kind:"concept",
  stem:"「부가가치세법」상 재화 또는 용역의 공급에 관한 설명으로 옳지 않은 것은? (단, 아래의 거래는 2017.4.1. 이후 발생한 것임)",
  choices:["사업자가 거래상대방으로부터 인도 받은 재화에 주요 자재를 전혀 부담하지 않고 단순가공만 하여 대가를 받는 것은 용역의 공급으로 본다.","대학이 사업용 부동산을 그 대학의 산학협력단에 대가를 받지 않고 임대하는 것은 용역의 공급으로 보지 않는다.","건설업의 경우 건설업자가 건설자재의 전부 또는 일부를 부담하고 대가를 받는 것은 용역의 공급으로 본다.","사업자가 가공계약에 따라 거래상대방으로부터 인도 받은 재화에 주요자재의 일부를 부담하고 새로운 재화를 만들어 인도하면 재화의 공급으로 본다.","사업자가 자기가 생산한 재화를 자기의 고객에게 사업을 위하여 증여한 것으로서 법령에 따른 자기적립마일리지로만 전부를 결제 받은 경우 재화의 공급으로 본다."],
  answer:5, status:"clear", note:"" },
{ id:"2017-72", subject:"세법학개론", year:2017, no:72, law:"부가가치세법", unit:"영세율과 면세", kind:"concept",
  stem:"「부가가치세법」상 면세에 관한 설명으로 옳지 않은 것은?",
  choices:["「음악산업진흥에 관한 법률」의 적용을 받는 전자출판물의 공급에 대해서는 부가가치세를 과세한다.","미술창작품의 공급에 대해서는 부가가치세를 면제한다.","금융회사가 국가ㆍ지방자치단체에 제공하는 금고대행용역에 대해서는 부가가치세를 면제한다.","면세 농산물을 수출하는 사업자가 면세포기를 하여 해당 농산물에 대하여 영세율이 적용되는 경우 수출을 위하여 당초 매입한 면세 농산물에 대하여 의제매입세액공제가 가능하다.","면세재화의 공급이 영세율 적용의 대상이 되는 경우 면세포기가 가능하나 면세포기를 신고한 날부터 3년 간 부가가치세를 면제받지 못한다."],
  answer:4, status:"clear", note:"" },
{ id:"2017-73", subject:"세법학개론", year:2017, no:73, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"concept",
  stem:"「부가가치세법」상 과세표준에 관한 설명으로 옳지 않은 것은?",
  choices:["사업자가 법령에 따른 특수관계인에게 대가를 받지 않고 과세되는 사업용 부동산임대용역을 공급하는 경우 공급가액에 포함되지 아니한다.","완성도기준지급조건부로 용역을 공급하는 경우 계약에 따라 받기로 한 대가의 각 부분을 과세표준으로 한다.","위탁가공무역 방식으로 수출하는 경우 완성된 제품의 인도가액을 과세표준으로 한다.","기부채납의 경우 해당 기부채납의 근거가 되는 법률에 따라 기부채납된 가액을 과세표준으로 하되 기부채납된 가액에 부가가치세가 포함된 경우 그 부가가치세는 제외한다.","재화의 공급과 직접 관련된 국고보조금과 공공보조금은 과세표준에 포함된다."],
  answer:1, status:"clear", note:"" },
{ id:"2017-74", subject:"세법학개론", year:2017, no:74, law:"부가가치세법", unit:"세금계산서 및 절차규정", kind:"concept",
  stem:"「부가가치세법」상 수정세금계산서를 발급할 수 있는 경우를 모두 고른 것은?\n\nㄱ. 세율을 잘못 적용하여 세금계산서를 발급하였으나 세무조사의 통지를 받은 경우로서 과세표준을 경정할 것을 미리 알고 있는 경우\nㄴ. 재화를 공급한 후 공급시기가 속하는 과세기간 종료 후 25일(25일이 되는 날은 영업일임) 이내에 내국신용장이 개설된 경우\nㄷ. 계약의 해지에 따라 공급가액에 추가되는 금액이 발생한 경우\nㄹ. 면세 등 발급대상이 아닌 거래에 대하여 발급한 경우\nㅁ. 계약의 해제로 재화 또는 용역이 공급되지 아니한 경우",
  choices:["ㄱ","ㄴ, ㄷ","ㄱ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],
  answer:4, status:"clear", note:"" },
{ id:"2017-75", subject:"세법학개론", year:2017, no:75, law:"부가가치세법", unit:"매입세액과 차가감납부세액", kind:"calc",
  stem:"다음은 소시지제조업을 영위하는 일반과세자인 개인사업자 甲의 2017년 제1기 과세기간(2017.1.1.~6.30.)에 대한 거래내역이다. 2017년 제1기 확정신고시 공제가능한 매입세액은 얼마인가? (단, 다음 거래는 세법상 요구되는 의무를 모두 이행하였으며, 의제매입세액공제 대상액은 공제한도 내 금액인 것으로 가정함)\n\n(1) 외국산 미가공식료품을 31,200,000원에 매입하여 소시지 제조에 전부 사용하였다.\n(2) 소시지 배달을 위해 개별소비세가 과세되는 5인승 승용차를 22,000,000원(공급대가)에 구입하였다.\n(3) 세금계산서 발급이 금지되지 않은 일반과세자로부터 사업용 냉장고를 2,200,000원(공급대가)에 구입하고 부가가치세가 별도로 구분되는 신용카드매출전표를 수령하였다.\n(4) 2017년 제1기 예정신고시 매입세액 500,000원이 신고누락되었다.\n(5) 2015년 제1기 부가가치세 확정신고시 매입세액에서 차감한 대손세액은 300,000원이었고 2017.3.10.에 관련 대손금액 전부를 변제하였다.",
  choices:["1,000,000원","1,900,000원","2,200,000원","3,200,000원","4,200,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2017-76", subject:"세법학개론", year:2017, no:76, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"calc",
  stem:"다음은 도시지역 내에 소재하는 1층 건물을 임대하고 있는 (주)A의 2017년 제1기 예정신고기간(2017.1.1.~3.31.)에 대한 자료이다. (주)A의 2017년 제1기 예정신고기간의 부가가치세 과세표준은 얼마인가?\n\n(1) 임대기간: 2016.7.1.~2017.6.30.\n(2) 임대보증금: 365,000,000원\n(3) 임대료 및 관리비: 임대료 1년분 4,800,000원은 2016.7.1.에 모두 수령, 관리비 월 100,000원(청소비 30,000원 포함)은 매월 말일 수령\n(4) 임대현황(주택면적에는 지하층ㆍ지상주차장ㆍ주민공동시설면적 제외)\n구분 / 면적\n건물 상가 / 300㎡\n건물 주택 / 100㎡\n토지 / 1,200㎡\n(5) 2017년 제1기 예정신고기간 종료일 현재 「소득세법」상 기준시가\n구분 / 기준시가\n건물 / 400,000,000원\n토지 / 100,000,000원\n(6) 과세되는 상가임대용역과 면세되는 주택임대용역에 대한 임대료 등의 구분이 불분명함\n(7) 예정신고기간 종료일 현재 계약기간 1년의 정기예금이자율: 4.6%",
  choices:["846,000원","3,384,000원","4,140,000원","4,230,000원","8,494,500원"],

{ id:"2017-77", subject:"세법학개론", year:2017, no:77, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"calc",
  stem:"다음은 제조업을 영위하는 일반과세자인 (주)A의 2017년 제2기 과세기간(2017.7.1.~12.31.)에 대한 자료이다. (주)A의 2017년 제2기 과세기간의 부가가치세 과세표준은 얼마인가? (단, 다음 자료의 금액에는 부가가치세가 포함되지 않음)\n\n(1) 7월 20일: 기계를 15,000,000원에 판매하고 7월 20일부터 15개월 간 매달 20일에 1,000,000원씩 받기로 하였다.\n(2) 7월 25일: 기계유지보수 계약을 맺고 7월 25일부터 10개월 간 매달 25일에 200,000원씩 받기로 하였다.\n(3) 9월 25일: 증여세 20,000,000원을 사업용 건물로 물납하였다.\n(4) 10월 14일: 당사가 생산한 제품(매입세액공제분)을 거래처에 판매장려물품(제조원가: 800,000원, 시가: 1,000,000원)으로 기증하였다.\n(5) 11월 11일: 사업용으로 사용하던 화물자동차를 500,000원에 매각하였다.\n(6) 12월 5일: 공급에 대한 대가의 지급이 지체되어 거래처로부터 연체이자 800,000원을 수령하였다.",
  choices:["7,700,000원","8,500,000원","8,700,000원","9,500,000원","28,700,000원"],

{ id:"2017-78", subject:"세법학개론", year:2017, no:78, law:"부가가치세법", unit:"과세·면세 겸영사업자의 세액계산 특례", kind:"calc",
  stem:"부가가치세 겸영사업자인 신문사 (주)A의 2017년 제1기 과세기간 확정신고시 ㉠공제받지 못할 매입세액과 2017년 제2기 과세기간 확정신고시 납부ㆍ환급세액을 재계산하여 ㉡납부세액에 가산(또는 공제)하거나 환급세액에 가산(또는 공제)할 금액은 얼마인가? (단, 다음 자료의 금액은 부가가치세가 포함되지 아니한 금액이고, 건물의 과세 및 면세사용면적은 구분되지 않으며, 세금계산서 등의 증명서류는 회사설립 이후 현재까지 적법하게 수령 및 발급되었다고 가정함. ㉡의 경우 납부세액에 가산하거나 환급세액에 공제하는 것은 (+)로, 납부세액에 공제하거나 환급세액에 가산하는 것은 (-)로 표시함)\n\n(1) (주)A는 2017.2.1.에 사업용 건물을 3,000,000,000원에 구입하였다.\n(2) 광고료 및 신문판매 공급가액 자료\n구분 / 2016년 제2기 / 2017년 제1기 / 2017년 제2기\n광고료 수입 / 2,000,000,000원 / 3,000,000,000원 / 3,000,000,000원\n신문판매 수입 / 2,000,000,000원 / 2,000,000,000원 / 1,000,000,000원",
  choices:["㉠ 120,000,000원 / ㉡ (-)42,750,000원","㉠ 120,000,000원 / ㉡ (-)33,750,000원","㉠ 120,000,000원 / ㉡ (+)42,750,000원","㉠ 150,000,000원 / ㉡ (-)40,500,000원","㉠ 150,000,000원 / ㉡ (-)33,750,000원"],
  answer:1, status:"clear", note:"" },
{ id:"2016-41", subject:"세법학개론", year:2016, no:41, law:"국세기본법", unit:"국세기본법 총칙", kind:"concept",
  stem:"「국세기본법」상 용어의 정의에 관한 설명으로 옳지 않은 것은?",
  choices:["‘세무공무원’에는 국세청장, 지방국세청장, 세무서장 또는 그 소속 공무원뿐만 아니라 세법에 따라 국세에 관한 사무를 세관장이 관장하는 경우의 그 소속 공무원도 포함한다.","‘가산금’이란 국세를 납부기한까지 납부하지 아니한 경우에「국세징수법」에 따라 고지세액에 가산하여 징수하는 금액과 납부기한이 지난 후 일정 기한까지 납부하지 아니한 경우에 그 금액에 다시 가산하여 징수하는 금액을 말한다.","‘공과금’이란「국세징수법」에서 규정하는 체납처분의 예에 따라 징수할 수 있는 채권 중 국세, 관세, 임시수입부가세, 지방세와 이에 관계되는 가산금 및 체납처분비를 제외한 것을 말한다.","‘납세의무자’는 연대납세의무자, 제2차 납세의무자, 보증인, 원천징수의무자를 포함한다.","‘과세표준’이란 세법에 따라 직접적으로 세액산출의 기초가 되는 과세대상의 수량 또는 가액을 말한다."],
  answer:4, status:"clear", note:"" },
{ id:"2016-42", subject:"세법학개론", year:2016, no:42, law:"국세기본법", unit:"과세", kind:"concept",
  stem:"경정 등의 청구에 관한 설명으로 옳은 것은?",
  choices:["과세표준신고서를 법정신고기한까지 제출한 자는 과세관청의 결정 또는 경정으로 인하여 증가된 과세표준 및 세액에 대하여는 법정신고기한이 지난 후 5년이 경과하였더라도 해당 처분이 있음을 안 날부터 90일 이내에 경정을 청구할 수 있다.","과세표준신고서를 법정신고기한까지 제출한 자라도 상속세 또는 증여세에 관하여는 결정 또는 경정을 청구할 수 없다.","과세표준신고서를 법정신고기한까지 제출한 자는 과세표준신고서에 기재된 과세표준 및 세액이 세법에 따라 신고하여야 할 과세표준 및 세액에 미치지 못할 때에는 경정을 청구할 수 있다.","원천징수대상자에게 근로소득만 있어서 원천징수의무자가 연말정산에 의하여 그에 관한 소득세를 납부하고 지급명세서를 제출기한까지 제출한 경우, 원천징수영수증에 기재된 과세표준 및 세액이 세법에 따라 신고하여야 할 과세표준 및 세액을 초과할 때에는 원천징수의무자 뿐만 아니라 원천징수대상자도 경정을 청구할 수 있다.","국세의 과세표준 및 세액의 결정을 받은 자는 해당 처분이 있음을 안 날부터 90일이 지난 경우라도 최초의 결정을 할 때 과세표준 및 세액의 계산 근거가 된 행위의 효력과 관계되는 계약이 해제권의 행사에 의하여 해제된 것을 안 날부터 1년 이내에 경정을 청구할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"2016-43", subject:"세법학개론", year:2016, no:43, law:"국세기본법", unit:"납세자의 권리", kind:"concept",
  stem:"납세자의 권리에 관한 설명으로 옳지 않은 것은?",
  choices:["세무공무원이 부동산투기를 통한 세금 탈루 혐의가 있는 자에 대하여 일제조사를 하는 경우에는 같은 세목 및 같은 과세기간에 대하여도 재조사를 할 수 있다.","세무공무원은 세무조사를 마쳤을 때에는 납세자가 폐업한 경우에도 그 조사 결과를 서면으로 납세자에게 통지하여야 한다.","세무공무원은 세무조사를 함에 있어 거래처 조사, 거래처 현지확인 또는 금융거래 현지확인이 필요한 경우에는 세무조사기간을 연장할 수 있다.","납세자 본인의 권리 행사에 필요한 정보를 납세자가 요구하는 경우 세무공무원은 신속하게 정보를 제공하여야 한다.","세무공무원은 적정하고 공평한 과세의 실현을 위하여 필요한 최소한의 범위 안에서 세무조사를 하여야 하며, 다른 목적 등을 위하여 조사권을 남용해서는 아니 된다."],
  answer:2, status:"clear", note:"" },
{ id:"2016-44", subject:"세법학개론", year:2016, no:44, law:"국세기본법", unit:"국세환급금과 국세환급가산금", kind:"concept",
  stem:"국세환급금에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["납세자의 국세환급금과 국세환급가산금에 관한 권리는 행사할 수 있는 때부터 5년간 행사하지 아니하면 소멸시효가 완성된다.","국세환급금의 발생원인으로서 ‘잘못 납부한 금액(오납금)’이라 함은 납부 또는 징수의 기초가 된 신고(신고납세의 경우) 또는 부과처분(부과과세의 경우)이 부존재하거나 당연무효임에도 불구하고 납부 또는 징수된 세액을 말한다.","국세환급금의 발생원인으로서 ‘초과하여 납부한 금액(과납금)’은 신고납세방식에 있어서 신고로 또는 부과과세방식에 있어서 부과결정으로 각 확정된다.","국세환급금의 발생원인으로서 ‘환급세액’이라 함은 세법에 따라 적법하게 납부 또는 징수되었으나 그 후 국가가 보유할 정당한 이유가 없게 되어 각 개별세법에서 환급하기로 정한 세액을 말한다.","원천징수의무자가 원천징수하여 납부한 세액에서 환급받을 환급세액이 있는 경우, 그 원천징수의무자가 그 환급액을 즉시 환급해 줄 것을 요구하는 경우나 원천징수하여 납부하여야 할 세액이 없는 경우에는 즉시 환급한다."],
  answer:3, status:"clear", note:"" },
{ id:"2016-45", subject:"세법학개론", year:2016, no:45, law:"국세기본법·소득세법", unit:"납세의무", kind:"concept",
  stem:"연대납세의무에 관한 설명으로 옳지 않은 것은?",
  choices:["공동사업에 관한 부가가치세는 공동사업자가 연대하여 납부할 의무를 진다.","법인이 분할되는 경우 분할되는 법인에 대하여 분할일 이전에 부과되거나 납세의무가 성립한 국세ㆍ가산금 및 체납처분비는 분할되는 법인과 분할로 설립되는 법인이 연대하여 납부할 의무를 진다.","납세의 고지와 독촉에 관한 서류는 연대납세의무자 모두에게 각각 송달하여야 한다.","법인이 해산한 경우에 원천징수를 하여야 할 소득세를 징수하지 아니하였거나 징수한 소득세를 납부하지 아니하고 잔여재산을 분배하였을 때에는 청산인은 그 분배액을 한도로 하여 그 법인과 연대하여 납부할 의무를 진다.","어느 연대납세의무자에 대하여 소멸시효가 완성한 때에는 그 부담부분에 한하여 다른 연대납세의무자도 그 납부의무를 면한다."],
  answer:4, status:"clear", note:"" },
{ id:"2016-46", subject:"세법학개론", year:2016, no:46, law:"국세징수법", unit:"강제징수", kind:"calc",
  stem:"체납자 甲의 재산이 다음과 같은 경우「국세징수법」상 압류할 수 있는 재산의 총액은 얼마인가?\n\n1. 질병을 원인으로 甲이 보험회사로부터 지급받은 보장성 보험의 보험금은 아래와 같다.\n (1) 치료를 위하여 진료비, 치료비, 수술비, 입원비, 약제비 등으로 실제 지출되는 비용을 보장하기 위한 보험금: 3,000,000원\n (2) 치료 및 장애 회복을 위한 보험금 중 위 (1)에 해당하는 보험금을 제외한 보험금: 5,000,000원\n2. 보장성보험의 해약환급금: 2,000,000원\n3. 甲의 은행 예금 잔액: 1,200,000원",
  choices:["500,000원","2,500,000원","3,000,000원","4,500,000원","11,200,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2016-47", subject:"세법학개론", year:2016, no:47, law:"국세징수법", unit:"신고납부, 납부고지 등", kind:"concept",
  stem:"「국세징수법」상 징수절차에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
  choices:["세무서장은 납세자의 체납액을 제2차 납세의무자로부터 징수하려면 제2차 납세의무자에게 징수하려는 체납액의 과세기간, 세목, 세액 및 그 산출 근거, 납부기한, 납부장소와 제2차 납세의무자로부터 징수할 금액 및 그 산출 근거와 그 밖에 필요한 사항을 적은 납부통지서로 고지하여야 한다.","세무서장은 국세를 징수하려면 납세자에게 그 국세의 과세기간, 세목, 세액 및 그 산출근거, 납부기한과 납부장소를 적은 납세고지서를 발급하여야 한다.","세무서장은 납세자가 체납액 중 국세와 가산금만을 완납한 경우에 체납처분비를 징수하려면 납세자에게 체납처분비의 징수에 관계되는 국세의 과세기간, 세목 및 체납처분비의 산출근거, 납부기한과 납부장소를 적은 체납처분비고지서를 발급하여야 한다.","세무서장은 세법에서 국세(체납처분비 포함)의 납부기한을 정하는 경우 외에는 국세의 납부기한을 납세 또는 납부의 고지를 하는 날부터 30일 내로 지정할 수 있다.","과세관청이 과세표준과 세액을 결정 또는 경정하고 그 통지를 납세고지서에 의하는 경우의 납세고지는 징수고지로서의 성질은 있으나 부과고지로서의 성질은 없다."],
  answer:5, status:"clear", note:"" },
{ id:"2016-48", subject:"세법학개론", year:2016, no:48, law:"국세징수법", unit:"신고납부, 납부고지 등", kind:"concept",
  stem:"납기 전 징수에 관한 설명으로 옳지 않은 것은?",
  choices:["세무서장은 납세자가 국세의 체납으로 체납처분을 받을 때에는 납기 전이라도 이미 납세의무가 확정된 국세를 징수할 수 있다.","세무서장(법령이 정하는 체납자의 경우에는 지방국세청장을 포함)은 납기 전 징수 사유에 해당함에 따라 납세자가 납기 전에 납부 고지를 받고 지정된 기한까지 완납하지 아니한 경우에는 납세자의 재산을 압류한다.","납기 전에 징수를 할 수 있는 국세에는 납세고지를 한 국세는 포함되나, 원천징수한 국세는 포함되지 않는다.","납세자에게 경매가 시작된 때에도 납기 전 징수 사유에 해당한다.","세무서장이 납기 전에 국세를 징수하는 경우 이미 납세고지를 하였을 때에는 납부기한의 변경을 고지하여야 한다."],
  answer:3, status:"clear", note:"" },
{ id:"2016-49", subject:"세법학개론", year:2016, no:49, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"조세범처벌법위반의 죄에 해당하는 경우를 모두 고른 것은?\n\nㄱ. 조세의 원천징수의무자가 정당한 사유 없이 징수한 세금을 납부하지 아니하였을 때\nㄴ. 납세의무자의 재산을 점유하는 자가 체납처분의 집행을 면탈하게 할 목적으로 그 재산을 은닉한 때\nㄷ. 이중장부를 작성하여 조세의 부과와 징수를 현저히 곤란하게 하는 적극적 행위로써 조세를 포탈한 때\nㄹ. 조세의 회피 또는 강제집행의 면탈을 목적으로 타인의 성명을 사용하여 사업자등록을 하거나 타인 명의의 사업자등록을 이용하여 사업을 영위한 때\nㅁ. 세무를 대리하는 세무사ㆍ공인회계사 및 변호사가 재화 또는 용역을 공급받지 아니하고 세금계산서를 발급하는 행위를 알선하거나 중개한 때",
  choices:["ㄱ, ㄴ, ㅁ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],
  answer:5, status:"clear", note:"" },
{ id:"2016-50", subject:"세법학개론", year:2016, no:50, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"「조세범처벌법」상 세금계산서의 발급의무 위반 등의 죄에 해당하지 않는 것은? (다툼이 있으면 판례에 따름)",
  choices:["「부가가치세법」에 따라 세금계산서를 작성하여 발급하여야 할 자가 세금계산서를 거짓으로 기재하여 발급한 경우","「부가가치세법」에 따라 세금계산서를 발급받아야 할 자가 공급자와 통정하여 공급가액을 부풀리는 방법으로 허위 기재를 한 세금계산서를 발급받은 경우","재화 또는 용역을 공급하지 아니하고「부가가치세법」에 따른 세금계산서를 발급한 경우","재화 또는 용역을 공급하지 아니하고「소득세법」에 따른 계산서를 발급한 경우","「부가가치세법」에 따라 세금계산서를 작성하여 발급하고 매출처별세금계산서합계표를 정부에 제출하지 아니한 경우"],
  answer:5, status:"clear", note:"" },
{ id:"2016-51", subject:"세법학개론", year:2016, no:51, law:"소득세법", unit:"양도소득세", kind:"calc",
  stem:"다음 자료를 이용하여 거주자 甲이 양도한 A토지의 양도소득세 과세표준을 계산하면 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 양도자산의 자료\n양도자산 / A토지(甲소유로 등기된 토지임)\n비사업용 토지 여부 / 비사업용 토지에 해당되지 않음\n면적 / 90㎡\n양도일자 / 2016.4.25.\n취득일자 / 1993.5.20.\n(2) A토지의 양도 당시 실거래가액은 100,000,000원이며, 취득 당시 실거래가액은 60,000,000원이다. 매매사례가액 및 감정가액은 없다.\n(3) 개별공시지가에 대한 자료는 다음과 같다.\n고시일 / 1992.5.30. / 1993.5.30. / 2014.5.30. / 2015.5.29.\n㎡당 개별공시지가 / 500,000원 / 600,000원 / 950,000원 / 1,000,000원\n(4) A토지의 소유권을 확보하기 위하여 직접 소요된 소송비용(그 지출한 연도의 각 소득금액의 계산에 있어서 필요경비에 산입하지 않았음)으로 10,000,000원을 지출하였으며, A토지 양도를 위해 직접 지출한 소개비 2,000,000원이 있다. 이상의 경비는 모두 법정증빙을 수취하였다.\n(5) 2016년에 A토지 이외에 다른 양도는 없다.",
  choices:["17,100,000원","21,300,000원","25,500,000원","27,600,000원","31,555,000원"],
  answer:1, status:"clear", note:"" },
{ id:"2016-52", subject:"세법학개론", year:2016, no:52, law:"소득세법", unit:"사업소득", kind:"calc",
  stem:"다음은 국내에서 제조업을 영위하는 거주자 甲의 2016년 귀속 사업소득에 대한 자료이다. 甲의 2016년 귀속 사업소득금액은 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 2016년 손익계산서 (단위: 원)\nⅠ. 매출액 800,000,000\nⅡ. 매출원가 590,000,000\nⅢ. 매출총이익 210,000,000\nⅣ. 판매비및관리비 55,000,000\n  1. 급여 22,000,000\n  2. 접대비 30,000,000\n  3. 보험료 3,000,000\nⅤ. 영업이익 155,000,000\nⅥ. 영업외수익 7,000,000\n  1. 이자수익 7,000,000\nⅦ. 영업외비용 0\nⅧ. 소득세차감전순이익 162,000,000\nⅨ. 소득세비용 40,000,000\nⅩ. 당기순이익 122,000,000\n\n(2) 추가자료\n○ 급여는 대표자인 甲에 대한 급여 10,000,000원과 같은 사업장의 경리로 근무하는 乙(甲의 배우자)에 대한 급여 12,000,000원으로 구성되어 있다.\n○ 접대비는 모두 업무용 사용분으로 법적 증빙요건을 충족하며, 소득세법상 접대비 한도액은 25,000,000원이다.\n○ 보험료는 전액 甲에 대한 국민건강보험료이다.\n○ 이자수익은 사업자금을 은행에 예탁하여 받은 이자이다.\n○ 소득세비용은 소득세와 개인지방소득세의 합계액이며 이월결손금은 없다.",
  choices:["122,000,000원","137,000,000원","155,000,000원","170,000,000원","173,000,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2016-53", subject:"세법학개론", year:2016, no:53, law:"소득세법", unit:"소득금액 계산 및 세액계산 특례", kind:"concept",
  stem:"「소득세법」상 결손금 및 이월결손금 공제에 관한 설명으로 옳지 않은 것은?",
  choices:["사업자(주거용 건물 임대업이 아닌 부동산임대업은 제외)가 비치ㆍ기록한 장부에 의하여 해당 과세기간의 사업소득금액을 계산할 때 발생한 결손금은 그 과세기간의 종합소득과세표준을 계산할 때 근로소득금액ㆍ연금소득금액ㆍ기타소득금액ㆍ이자소득금액ㆍ배당소득금액에서 순서대로 공제한다.","부동산임대업에서 발생한 결손금은 종합소득 과세표준을 계산할 때 그 과세기간의 다른 종합소득금액에서 공제하지 아니하나 주거용 건물 임대업의 경우에는 그러하지 아니하다.","중소기업을 경영하는 비거주자가 그 사업소득금액을 계산할 때 해당 과세기간의 이월결손금(주거용 건물 임대업이 아닌 부동산임대업에서 발생한 이월결손금은 제외)이 발생한 경우에는 결손금 소급공제세액을 환급신청할 수 있다.","「국세기본법」에 따른 국세부과의 제척기간이 지난 후에 그 제척기간 이전 과세기간의 이월결손금이 확인된 경우 그 이월결손금은 공제하지 아니한다.","해당 과세기간의 소득금액에 대해서 추계신고를 하거나 추계조사결정하는 경우(천재지변이나 그 밖의 불가항력으로 장부나 그 밖의 증명서류가 멸실된 경우는 제외)에는 이월결손금을 공제하지 않는다."],
  answer:3, status:"clear", note:"" },
{ id:"2016-54", subject:"세법학개론", year:2016, no:54, law:"소득세법", unit:"이자소득과 배당소득", kind:"calc",
  stem:"거주자 甲의 2016년 소득자료가 다음과 같을 때, 이자소득과 배당소득으로 소득세가 과세되는 금액의 합계액은 얼마인가? (단, 주어진 자료 이외에는 고려하지 않으며 다툼이 있으면 판례에 따름)\n\n(1) 법령으로 정한 직장공제회 초과반환금 13,000,000원(국내에서 받았으며, 원천징수는 적법하게 이루어짐)\n(2) 법원의 판결에 의한 손해배상금 30,000,000원(법정이자 5,000,000원 포함)\n(3) 2016년 초에 대여한 비영업대금의 원금 30,000,000원과 그에 대하여 발생한 이자 3,000,000원 중 채무자의 파산으로 인하여 2016.12.1. 32,000,000원만 회수하고 나머지 채권은 과세표준확정신고 전에 회수 불능사유가 발생하여 회수할 수 없는 것으로 확정됨\n(4) 내국법인이 발행한 채권을 만기 전에 중도 매도함에 따른 매매차익 40,000,000원(채권 매입은 2015.1.1.이고 채권 매도는 2016.1.1.이며, 보유기간의 이자상당액 15,000,000원 포함)",
  choices:["17,000,000원","30,000,000원","35,000,000원","36,000,000원","55,000,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2016-55", subject:"세법학개론", year:2016, no:55, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"concept",
  stem:"연금소득에 관한 설명으로 옳지 않은 것은?",
  choices:["연금소득이 있는 거주자의 해당 과세기간에 받은 총연금액(분리과세연금소득은 제외함)에서 공제하는 연금소득공제액이 900만원을 초과하는 경우에는 900만원을 공제한다.","공적연금소득을 받는 사람이 해당 과세기간 중에 사망한 경우 공적연금소득에 대한 원천징수의무자는 그 사망일이 속하는 달의 다음다음 달 말일까지 그 사망자의 공적연금소득에 대한 연말정산을 하여야 한다.","연금계좌세액공제를 받은 연금계좌 납입액과 연금계좌의 운용실적에 따라 증가된 금액을 그 소득의 성격에 불구하고 연금계좌에서 연금수령하면 연금소득으로, 연금외수령하면 퇴직소득으로 과세한다.","연금계좌에서 인출된 금액이 연금수령한도를 초과하는 경우에는 연금수령분이 먼저 인출되고 그 다음으로 연금외수령분이 인출되는 것으로 본다.","공적연금소득의 수입시기는 공적연금 관련법에 따라 연금을 지급받기로 한 날로 한다."],
  answer:3, status:"clear", note:"" },
{ id:"2016-56", subject:"세법학개론", year:2016, no:56, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"concept",
  stem:"「소득세법」상 과세되는 기타소득을 모두 고른 것은? (다툼이 있으면 판례에 따름)\n\nㄱ. 근로계약을 체결한 근로자가 퇴직시 퇴직금지급채무의 이행지체로 인해 수령하는 지연손해금\nㄴ. 교통재해를 직접적인 원인으로 신체상의 상해를 입었음을 이유로 보험회사로부터 수령한 보험금\nㄷ. 퇴직 전에 부여받은 주식매수선택권을 퇴직 후에 행사함으로써 얻은 이익\nㄹ. 사업용 고정자산과 함께 양도하는 영업권\nㅁ. 서화ㆍ골동품을 박물관에 양도함으로써 발생하는 소득",
  choices:["ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㅁ","ㄴ, ㄹ, ㅁ"],
  answer:1, status:"clear", note:"" },
{ id:"2016-57", subject:"세법학개론", year:2016, no:57, law:"소득세법", unit:"소득세 절차규정과 외국법인·비거주자", kind:"concept",
  stem:"「소득세법」상 신고ㆍ납부절차에 관한 설명으로 옳지 않은 것은?",
  choices:["과세기간의 개시일 현재 사업자가 아닌 자로서 그 과세기간 중 신규로 사업을 시작한 거주자는 그 과세기간의 사업소득에 대하여 중간예납 의무가 없다.","중간예납세액이 30만원 미만인 경우에는 해당 세액을 징수하지 않는다.","복식부기의무자가 아닌 농ㆍ축ㆍ수산물 판매업을 영위하는 거주자는 납세조합을 조직할 수 있다.","금융업을 경영하는 사업자가 직전 과세기간의 상시고용인원의 평균인원수가 20인 이하인 원천징수의무자로서 관할 세무서장으로부터 승인을 얻은 경우에는 원천징수한 소득세를 그 징수일이 속하는 반기의 마지막 달의 다음 달 10일까지 납부할 수 있다.","분리과세이자소득, 분리과세배당소득, 분리과세연금소득 및 분리과세기타소득만 있는 거주자는 과세표준확정신고를 하지 아니할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"2016-58", subject:"세법학개론", year:2016, no:58, law:"소득세법", unit:"퇴직소득세", kind:"calc",
  stem:"다음 자료를 이용하여 내국법인인 (주)A에서 경리과장으로 근무하던 거주자 甲의 2016년 퇴직소득산출세액을 계산하면 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 퇴직소득금액: 150,000,000원\n(2) 근무기간: 2009.1.1. ~ 2016.3.31.(퇴직일) (근무기간 중 근로기간으로 보지 않는 기간은 없음)\n(3) 기본세율\n과세표준 / 세율\n1천200만원 이하 / 과세표준의 100분의 6\n1천200만원 초과 4천600만원 이하 / 72만원 + (1천200만원을 초과하는 금액의 100분의 15)\n4천600만원 초과 8천800만원 이하 / 582만원 + (4천600만원을 초과하는 금액의 100분의 24)\n8천800만원 초과 1억5천만원 이하 / 1천590만원 + (8천800만원을 초과하는 금액의 100분의 35)\n(4) 근속연수에 따른 공제액\n근속연수 5년 초과 10년 이하 / 150만원 + 50만원 × (근속연수 - 5년)\n(5) 환산급여공제액\n환산급여 7천만원 초과 1억원 이하 / 4천520만원 + (7천만원 초과분의 55퍼센트)\n환산급여 1억원 초과 3억원 이하 / 6천170만원 + (1억원 초과분의 45퍼센트)",
  choices:["8,874,000원","9,992,700원","11,111,400원","14,467,500원","21,701,250원"],
  answer:2, status:"clear", note:"" },
{ id:"2016-59", subject:"세법학개론", year:2016, no:59, law:"소득세법", unit:"양도소득세", kind:"concept",
  stem:"양도소득세에 관한 설명으로 옳은 것은?",
  choices:["1세대 1주택 비과세요건 판정시 상속받은 주택과 그 밖의 주택을 국내에 각각 1개씩 소유하고 있는 1세대가 상속받은 주택을 양도하는 경우 국내에 1개의 주택을 소유한 것으로 본다.","1세대가 1주택을 취득 후 1년 이상 거주하고 세대원 중 일부가 사업상 형편으로 다른 시ㆍ군으로 이전하면서 해당 주택을 양도하는 경우에는 2년 미만 보유한 때에도 1세대 1주택 비과세한다.","비사업용 토지(법적절차에 따라 등기된 것임)로서 2016.1.1. 이전에 취득하여 보유하고 있는 자산인 경우에는 2016.1.1.부터 기산하여 장기보유특별공제를 적용한다.","주택과 주택외부분이 복합된 겸용주택으로서 그 전부를 주택으로 보는 경우에는 그 전부의 실지거래가액에서 주택외부분의 실지거래가액을 제외한 금액으로 고가주택(실지거래가액 9억원 초과)에 해당여부를 판단한다.","파산선고에 의한 처분과 강제경매로 인하여 발생하는 소득에는 양도소득세를 과세하지 아니한다."],
  answer:3, status:"clear", note:"" },
{ id:"2016-60", subject:"세법학개론", year:2016, no:60, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"calc",
  stem:"2016.2.1.에 생애 최초로 입사한 거주자 甲(생산직근로자임)의 다음의 자료를 이용한 2월분 급여 중 비과세 근로소득의 합계는 얼마인가? (단, 상여금 및 연장근무수당 이외에는 매월 동액이 지급되며, 주어진 자료 이외에는 고려하지 않음)\n\n<甲의 2월 급여내역>\n항목 / 금액 / 비고\n(1) 급여 / 1,100,000원 / \n(2) 상여금 / 500,000원 / 부정기적인 상여임\n(3) 자가운전보조금 / 250,000원 / 甲 소유의 차량을 업무수행에 이용하고 시내출장 등에 소요된 실제여비를 받는 대신에 그 소요경비를 사규에 의한 지급기준에 따라 받는 금액임\n(4) 식사대 / 100,000원 / 회사는 무상으로 중식을 제공하며 이와 별도로 지급된 식사대임\n(5) 자녀보육수당 / 200,000원 / 甲의 3세 및 5세인 자녀 보육과 관련된 수당임\n(6) 연장근무수당 / 250,000원 / 「근로기준법」에 따른 연장근무로 인한 통상임금에 더한 지급액이며 당월 외에는 연장ㆍ야간ㆍ휴일근무수당은 없음\n계 / 2,400,000원",
  choices:["300,000원","550,000원","400,000원","450,000원","750,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2016-61", subject:"세법학개론", year:2016, no:61, law:"법인세법", unit:"법인세 총칙", kind:"concept",
  stem:"「법인세법」상 과세소득의 범위와 사업연도 및 납세지에 관한 설명으로 옳지 않은 것은?",
  choices:["영리내국법인에 대하여는 각 사업연도의 소득, 청산소득, 법령에 따른 토지등 양도소득 및 미환류소득에 대하여 법인세를 부과한다.","출자지분의 양도로 인하여 생기는 수입은 비영리내국법인의 각 사업연도의 소득에 포함되지 않는다.","비영리외국법인의 각 사업연도의 소득은 국내원천소득 중 수익사업에서 생기는 소득만 해당한다.","내국법인이 사업연도 중에 연결납세방식을 적용받는 경우에는 그 사업연도 개시일부터 연결사업연도 개시일의 전날까지의 기간을 1사업연도로 본다.","납세지가 변경된 법인이「부가가치세법」에 따라 그 변경된 사실을 신고한 경우에는「법인세법」에 따른 납세지 변경신고를 한 것으로 본다."],
  answer:2, status:"clear", note:"" },
{ id:"2016-62", subject:"세법학개론", year:2016, no:62, law:"법인세법", unit:"세무조정과 소득처분", kind:"concept",
  stem:"제조업을 영위하는 영리내국법인 (주)A는 제16기 사업연도(2016.1.1.~12.31.)에 (주)B(제조업)로부터 잉여금 처분에 따른 금전배당금 5,000,000원((주)B의 잉여금 처분 결의는 2015년에 이루어 진 것임)을 수령하였고, 이에 대한 (주)A의 회계처리는 다음과 같다.\n\n○ 제15기: 배당수익과 관련한 아무런 회계처리를 하지 않았음\n○ 제16기: <차변> 현금 5,000,000 / <대변> 배당금수익 5,000,000\n\n제15기에 대하여 (주)A가 해야 할 모든 세무조정은 적법하게 이루어졌다고 가정할 때, (주)A가 제16기의 각 사업연도의 소득금액 계산시 해야 할 세무조정과 소득처분으로 옳은 것은? (단, 법인세법상 수입배당금액의 익금불산입 규정 등 주어진 자료 이외 다른 사항은 고려하지 않음)",
  choices:["세무조정 없음","<익금산입> 배당금수익 5,000,000원(배당)","<익금불산입> 배당금수익 5,000,000원(기타)","<익금산입> 배당금수익 5,000,000원(유보)","<익금불산입> 배당금수익 5,000,000원(△유보)"],
  answer:5, status:"clear", note:"" },
{ id:"2016-63", subject:"세법학개론", year:2016, no:63, law:"법인세법", unit:"손금과 손금불산입", kind:"concept",
  stem:"「법인세법」상 손금에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 「채무자 회생 및 파산에 관한 법률」에 따른 회생계획인가의 결정에 따라 회수불능으로 확정된 채권은 당해 채권을 손금으로 계상한 날이 속하는 사업연도의 손금으로 한다.\nㄴ. 내국법인이 임원 및 사용인에게 지급하는 성과배분상여금은 잉여금의 처분을 손비로 계상한 것이라도 각 사업연도의 소득금액을 계산할 때 손금에 산입한다.\nㄷ. 회수할 수 없는 부가가치세 매출세액미수금으로서「부가가치세법」에 따라 대손세액공제를 받지 아니한 것은 손금에 해당한다.\nㄹ. 내국법인이 해당 법인 이외의 자와 출자에 의하여 특정사업을 공동으로 영위함에 따라 발생된 손비에 대한 분담금액은 출자총액 중 당해 법인이 출자한 금액의 비율에 우선하여 당해 공동사업자 사이의 약정에 따른 분담비율을 기준으로 정한다.",
  choices:["ㄷ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],
  answer:1, status:"clear", note:"" },
{ id:"2016-64", subject:"세법학개론", year:2016, no:64, law:"법인세법", unit:"손익의 귀속시기", kind:"concept",
  stem:"「법인세법」상 손익의 귀속시기와 자산ㆍ부채의 취득가액 및 평가에 관한 설명으로 옳은 것은?",
  choices:["내국법인이 수행하는 계약기간 3년 미만인 건설 등의 제공으로 인한 익금과 손금은 그 목적물의 인도일이 속하는 사업연도의 익금과 손금에 산입하여야 한다.","상품 등 외의 자산의 양도로 인한 익금 및 손금의 귀속사업연도는 그 대금을 청산하기로 한 날이 속하는 사업연도로 한다.","「자본시장과 금융투자에 관한 법률」에 따른 증권시장에서 증권시장업무규정에 따라 보통거래방식으로 한 유가증권의 매매로 인한 익금과 손금의 귀속사업연도는 매매대금의 수수일이 속하는 사업연도로 한다.","내국법인이 유형고정자산의 취득과 함께 국ㆍ공채를 매입하는 경우 기업회계기준에 따라 그 국ㆍ공채의 매입가액과 현재가치의 차액을 당해 유형고정자산의 취득가액으로 계상한 금액은 그 취득가액에 포함한다.","재고자산을 평가할 때 해당 자산을 제품 및 상품, 재공품, 원재료로 구분할 수는 있으나, 종류별ㆍ영업장별로 각각 다른 방법에 의하여 평가할 수는 없다."],
  answer:4, status:"clear", note:"" },
{ id:"2016-65", subject:"세법학개론", year:2016, no:65, law:"법인세법", unit:"법인세 절차규정", kind:"concept",
  stem:"「법인세법」상 신고 및 납부에 관한 설명으로 옳은 것은?",
  choices:["내국법인이 각 사업연도의 소득에 대한 법인세의 과세표준과 세액을 신고하는 경우,「주식회사의 외부감사에 관한 법률」에 따라 감사인에 의한 감사를 받아야 하는 내국법인이 해당 사업연도의 감사가 종결되지 아니하여 결산이 확정되지 아니하였다는 사유로 법령으로 정하는 바에 따라 신고기한의 연장을 신청한 경우에는 그 신고기한을 1개월의 범위에서 연장할 수 있다.","내국법인의 납부할 세액이 2천만원을 초과하는 경우에는 납부할 세액에서 1천만원을 초과하는 금액을 납부기한이 지난 날부터 1개월 이내에 분납할 수 있다.","내국법인이 직전 사업연도의 법인세로서 확정된 산출세액을 직전 사업연도의 월수로 나눈 금액에 6을 곱하여 중간예납세액을 계산하는 경우, 당해 직전 사업연도의 산출세액에는 미환류소득에 대한 법인세를 포함하며 가산세는 제외한다.","내국법인은 각 사업연도의 소득에 대한 법인세 산출세액에 해당사업연도에 원천징수된 세액을 합산한 금액을 각 사업연도의 소득에 대한 법인세로서 납부하여야 한다.","법인세가 수시부과된 사업연도에 대해서는 당해 수시부과로써 그 신고의무가 완료된 것이므로 해당 각 사업연도의 소득에 대한 별도의 법인세 과세표준 등의 신고 의무는 없다."],
  answer:1, status:"clear", note:"" },
{ id:"2016-66", subject:"세법학개론", year:2016, no:66, law:"법인세법", unit:"과세표준", kind:"calc",
  stem:"영리내국법인 (주)A(중소기업에 해당됨)는 제16기 사업연도(2016.1.1.~12.31.)에 발생한 법령에 따른 결손금 100,000,000원 전액에 대하여「법인세법」상 결손금소급공제에 의한 법인세액의 환급을 신청하는 경우, (주)A가 환급받을 수 있는 금액은 얼마인가? (단, 결손금 소급공제에 필요한 모든 요건은 충족하며, 주어진 자료 이외에는 고려하지 않음)\n\n<제15기 법인세 과세표준 등 신고 내역>\n과세표준 300,000,000원\n산출세액 40,000,000원\n공제ㆍ감면세액 (21,000,000원)\n가산세액 3,000,000원\n기납부세액 (10,000,000원)\n차감납부세액 12,000,000원\n※ 제15기 법인세율: 과세표준 2억원 이하는 10%, 2억원 초과 200억원 이하는 2천만원 + (2억원 초과금액의 20%)",
  choices:["19,000,000원","20,000,000원","21,000,000원","22,000,000원","25,000,000원"],
  answer:1, status:"clear", note:"" },
{ id:"2016-67", subject:"세법학개론", year:2016, no:67, law:"법인세법", unit:"감가상각비", kind:"calc",
  stem:"영리내국법인 (주)A의 제16기 사업연도(2016.1.1.~12.31.) 손익계산서에 기계장치A의 감가상각비로 계상된 금액은 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 기계장치A의 전기말 재무상태표상 취득원가와 감가상각누계액은 각각 300,000,000원과 50,000,000원이다.\n(2) 제15기의 ‘자본금과 적립금 조정명세서(을)’의 당해 기계장치A 과목에 기록된 기말잔액은 15,000,000원이다.\n(3) 제16기에 기계장치A에 대한 자본적 지출에 해당되는 금액을 수선비로 회계처리한 금액은 25,000,000원이다.\n(4) (주)A는 당해 기계장치A에 대한 감가상각 방법을 신고하지 않았으며, 정액법 상각률은 0.125, 정률법 상각률은 0.300으로 가정한다.\n(5) 제16기의 기계장치A 감가상각비에 대한 세무조정 결과 27,000,000원의 시인부족액이 발생하였다.",
  choices:["9,250,000원","23,000,000원","30,500,000원","34,250,000원","35,000,000원"],
  answer:5, status:"clear", note:"" },
{ id:"2016-68", subject:"세법학개론", year:2016, no:68, law:"법인세법", unit:"세무조정과 소득처분", kind:"calc",
  stem:"영리내국법인 (주)A가 제16기(2016.1.1.~12.31.)에 발생한 다음의 각 사항들에 대하여「법인세법」상 적법한 세무조정을 하였을 경우, 다음에 제시된 제16기의 ‘자본금과 적립금 조정명세서(을)’의 (ㄱ)에 들어갈 금액으로 옳은 것은? (단, 전기 이전의 세무조정은 모두 적법하게 이루어졌으며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 당기에 사업용 토지를 취득하였으며 취득세 4,000,000원과 취득세에 대한 가산세 1,000,000원을 포함하여 재무상태표상 장부가액은 55,000,000원이다.\n(2) 기초 재무상태표상 매출채권 3,000,000원 중에서 1,000,000원은 당기에 회수불가능하다고 판단하여 당기 말에 대손충당금과 상계처리하고 재무상태표에서 제거하였다. 상기의 기초 매출채권 3,000,000원은 회수 노력을 다 하였으나, 전기(제15기)에 법정 소멸시효가 완성되었다.\n(3) (주)A는 전기말에 발생한 재고자산과 관련한 다음 사항에 대하여 당기에 회계상 아무런 수정분개를 하지 않았다. 전기(제15기)에 기말 상품에 대하여 평가방법 변경신고를 하지 않고 후입선출법으로 평가하여 회계처리하였으며, 당초 신고된 평가방법은 총평균법이다. 또한, 각 평가방법에 따른 전기말 상품 평가금액은 다음과 같다.\n후입선출법 600,000원 / 총평균법 800,000원 / 선입선출법 1,000,000원\n\n자본금과 적립금조정명세서(을) (단위: 원)\n①과목 또는 사항 / ②기초잔액 / ③감소 / ④증가 / ⑤기말잔액\n토지 / / / / \n매출채권 / / / / \n상품 / / / / \n합계 / / / / (ㄱ)",
  choices:["△1,000,000","△2,000,000","△3,000,000","1,000,000","4,000,000"],
  answer:3, status:"clear", note:"" },
{ id:"2016-69", subject:"세법학개론", year:2016, no:69, law:"법인세법", unit:"기타 법인세", kind:"calc",
  stem:"다음 자료를 이용하여 제16기 사업연도(2016.1.1.~12.31.)말에 해산을 결의하고 청산절차에 착수한 영리내국법인 (주)A의「법인세법」상 청산소득금액을 계산하면 얼마인가? (단, 주어진 자료 이외에 다른 사항은 고려하지 않음)\n\n(1) 해산등기일 현재 재무상태표상 자본의 내역\n자본금 80,000,000원\n자본잉여금 30,000,000원\n이익잉여금 10,000,000원\n(2) 해산등기일 현재 법령으로 정하는 이월결손금은 50,000,000원이며, 이 금액 중 자기자본의 총액에서 이미 상계되었거나 상계된 것으로 보는 금액은 없다.\n(3) 해산에 의한 잔여재산의 가액은 1억원으로 확정되었다.\n(4) 해산등기일 전 2년 이내에 자본금에 전입한 잉여금은 없다.",
  choices:["10,000,000원","20,000,000원","30,000,000원","40,000,000원","50,000,000원"],
  answer:2, status:"clear", note:"" },
{ id:"2016-70", subject:"세법학개론", year:2016, no:70, law:"법인세법", unit:"세액계산", kind:"calc",
  stem:"영리내국법인 (주)A(제조업)의 제16기 사업연도(2016.1.1.~12.31.)에 대한「법인세법」상 재해손실에 대한 세액공제액은 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 2016.3.20.에 발생한 화재로 인한 (주)A 사업용 자산 가액의 변동\n구분 / 화재발생 직전 장부가액 / 화재발생 후 장부가액\n토지 / 100,000,000원 / 90,000,000원\n건물 / 200,000,000원 / 60,000,000원\n기타 자산 / 100,000,000원 / 30,000,000원\n한편, 상기 사업용 자산과는 별개로 (주)A가 보관하던 타인소유 자산 60,000,000원이 당해 화재로 상실되었으며, (주)A는 이에 대한 변상책임을 부담하지 않는다.\n(2) 당해 화재로 인해 보험회사로부터 보험금 90,000,000원을 수령하였다.\n(3) 제16기 각 사업연도의 소득에 대한 법인세 산출세액은 280,000,000원이며, 재해발생일 현재 부과되지 아니한 법인세와 부과된 법인세로서 미납된 세액은 없다. 또한 국세기본법에 따른 원천징수납부 등 불성실가산세가 40,000,000원 있으며, 당해 재해손실에 대한 세액공제 이외에 다른 공제 및 감면세액은 없다.",
  choices:["128,000,000원","160,000,000원","192,000,000원","210,000,000원","224,000,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2016-71", subject:"세법학개론", year:2016, no:71, law:"부가가치세법", unit:"과세거래", kind:"concept",
  stem:"「부가가치세법」상 과세대상 거래에 관한 설명으로 옳지 않은 것은?",
  choices:["사업자가 취득한 재화(매입세액공제 받음)를 사업과 직접적인 관계없이 자기의 개인적인 목적으로 사용ㆍ소비하는 경우에는 재화의 공급으로 본다.","사업자가 취득한 재화를 견본품으로서 사업을 위하여 대가를 받지 아니하고 다른 사업자에게 인도하는 경우, 당해 견본품의 인도는 재화의 공급으로 보지 아니한다.","사업자가 폐업할 때 자기생산ㆍ취득재화(매입세액공제 받음) 중 남아 있는 재화는 자기에게 공급하는 것으로 본다.","위탁매매에 의한 매매를 하는 해당 거래의 특성상 위탁자를 알 수 없는 경우에는 수탁자에게 재화를 공급하거나 수탁자로부터 재화를 공급받은 것으로 본다.","사업용 자산을「상속세 및 증여세법」에 따라 물납(物納)하는 것은 재화의 공급으로 본다."],
  answer:5, status:"clear", note:"" },
{ id:"2016-72", subject:"세법학개론", year:2016, no:72, law:"부가가치세법", unit:"과세거래", kind:"concept",
  stem:"「부가가치세법」상 재화 또는 용역의 공급시기에 관한 설명으로 옳지 않은 것은?",
  choices:["기한부판매의 경우에는 기한이 지나 판매가 확정되는 때를 재화의 공급시기로 본다.","완성도기준지급조건부로 재화를 공급하는 경우 대가의 각 부분을 받기로 한 때를 재화의 공급시기로 보지만, 재화가 인도되거나 이용가능하게 되는 날 이후에 받기로 한 대가의 부분에 대해서는 재화가 인도되거나 이용가능하게 되는 날을 그 재화의 공급시기로 본다.","무인판매기를 이용하여 재화를 공급하는 경우 해당 사업자가 무인판매기에서 현금을 꺼내는 때를 재화의 공급시기로 본다.","사업자가 둘 이상의 과세기간에 걸쳐 부동산 임대용역을 공급하고 그 대가를 선불 또는 후불로 받는 경우 예정신고기간 또는 과세기간의 종료일을 용역의 공급시기로 본다.","전력이나 그밖에 공급단위를 구획할 수 없는 재화를 계속적으로 공급하는 경우에는 예정신고기간 또는 과세기간의 종료일을 재화의 공급시기로 본다."],
  answer:5, status:"clear", note:"" },
{ id:"2016-73", subject:"세법학개론", year:2016, no:73, law:"부가가치세법", unit:"매입세액과 차가감납부세액", kind:"concept",
  stem:"「부가가치세법」상 매입세액에 관한 설명으로 옳지 않은 것은?",
  choices:["건축물이 있는 토지를 취득하여 그 건축물을 철거하고 토지만 사용하는 경우에는 철거한 건축물의 취득 및 철거 비용과 관련된 매입세액은 매출세액에서 공제한다.","재화 또는 용역의 공급시기 이후에 발급받은 세금계산서라 하더라도 해당 공급시기가 속하는 과세기간에 대한 확정신고기한까지 세금계산서를 발급받는다면 당해 매입세액은 매출세액에서 공제한다.","사업자가 그 업무와 관련 없는 자산을 취득시 부담한 매입세액은 매출세액에서 공제하지 아니한다.","면세사업을 위한 투자에 관련된 매입세액은 매출세액에서 공제하지 아니한다.","공급시기가 속하는 과세기간이 끝난 후 20일 이내에 사업자등록을 신청한 경우 등록신청일부터 공급시기가 속하는 과세기간 기산일까지 역산한 기간 내의 매입세액은 매출세액에서 공제할 수 있다."],
  answer:1, status:"clear", note:"" },
{ id:"2016-74", subject:"세법학개론", year:2016, no:74, law:"부가가치세법", unit:"세금계산서 및 절차규정", kind:"concept",
  stem:"「부가가치세법」상 신고 및 납부에 관한 설명으로 옳은 것은?",
  choices:["예정신고를 한 사업자는 확정신고 및 납부시 예정신고한 과세표준과 납부한 납부세액 또는 환급받은 환급세액도 포함하여 신고하여야 한다.","일반과세자인 개인사업자가 사업 부진으로 인하여 예정신고기간의 공급가액이 직전 과세기간 공급가액의 3분의 1에 미달하여 예정신고납부를 한 경우에는 예정고지세액의 결정은 없었던 것으로 본다.","사업자가 물품을 제조하기 위한 원재료를 수입하면서 부가가치세의 납부유예를 미리 신청하는 경우에는 관할세무서장은 해당 재화를 수입할 때 부가가치세의 납부를 유예할 수 있다.","간이과세자는 사업부진으로 인하여 예정부과기간의 공급대가의 합계액이 직전 과세기간의 공급대가 합계액의 3분의 1에 미달하여도 예정부과기간의 과세표준과 납부세액을 예정부과 기한까지 사업장 관할 세무서장에 신고할 수 없다.","대리납부의무자는 사업자이어야 한다."],
  answer:2, status:"clear", note:"" },
{ id:"2016-75", subject:"세법학개론", year:2016, no:75, law:"부가가치세법", unit:"영세율과 면세", kind:"concept",
  stem:"「부가가치세법」상 영세율 적용에 관한 설명으로 옳은 것은?",
  choices:["금지금을 내국신용장 또는 구매확인서에 의하여 공급하는 것은 영세율이 적용되는 수출로 본다.","계약과 대가 수령 등 거래가 국외사업장에서 이루어지는 중계무역 방식의 수출은 영세율이 적용되는 수출에 속하는 것으로 본다.","「항공법」에 따른 상업서류 송달용역의 공급에는 영세율이 적용되지 아니한다.","대한민국 선박에 의하여 공해에서 잡힌 수산물을 외국으로 반출하는 것은 영세율이 적용되는 수출에 해당한다.","비거주자인 사업자가 재화를 수출하는 경우, 비거주자의 해당 국가에서 대한민국의 거주자에 대하여 면세하는지 여부와 관계없이 영세율을 적용한다."],
  answer:4, status:"clear", note:"" },
{ id:"2016-76", subject:"세법학개론", year:2016, no:76, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"calc",
  stem:"다음 자료를 기초로 일반과세자인 개인사업자 甲의 2016년 제1기 과세기간(2016.1.1.~6.30.)의 부가가치세 과세표준을 계산하면 얼마인가? (단, 주어진 자료의 금액은 부가가치세가 포함되지 아니한 금액이며, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 甲은 2016.4.20. 제품을 공급하고 대금은 4월 말일부터 매월 1,000,000원씩 7개월 동안 받기로 하였다.\n(2) 甲은 2016.5.1. 미국의 X법인과 $20,000의 제품수출계약을 체결하였다.\n ○ 수출계약 금액 중 $10,000은 계약체결일에 선수금으로 수령하여 동일자에 12,000,000원으로 환가하였다.\n ○ 수출신고필증상 신고수리일은 2016.5.10.이며, 선적일은 2016.5.15.이다.\n ○ 잔금은 2016.5.30.에 수령하여 동일자에 기준환율로 환가하였다.\n ○ 기준환율: 2016.5.1. 1,200원/$ / 2016.5.10. 1,100원/$ / 2016.5.15. 1,050원/$ / 2016.5.30. 1,000원/$\n(3) 甲은 2015.12.1. 다음과 같이 대금회수를 하기로 하고 잔금수령일에 기계설비를 인도하는 계약을 하였다. 실제 인도 시기는 2016.6.30.이었다.\n비고 / 대금회수 약정일 / 금액(원)\n계약금 / 2015.12.1. / 10,000,000\n중도금 / 2016.3.1. / 10,000,000\n잔금 / 2016.7.1. / 10,000,000",
  choices:["27,000,000원","39,500,000원","45,500,000원","49,000,000원","49,500,000원"],
  answer:5, status:"clear", note:"" },
{ id:"2016-77", subject:"세법학개론", year:2016, no:77, law:"부가가치세법", unit:"매입세액과 차가감납부세액", kind:"calc",
  stem:"다음은 과세유흥장소가 아닌 음식점업을 경영하는 (주)A(사업개시일: 2016.4.10.)의 2016년 제1기 과세기간의 매입내역이다. 이를 근거로 제1기 부가가치세 확정신고시 공제받을 수 있는 의제매입세액공제액은 얼마인가? (단, 의제매입세액공제 한도는 고려하지 아니하고 의제매입세액을 공제받기 위한 모든 요건은 충족되었다고 가정함. 또한, 주어진 자료 이외에는 고려하지 아니하고, 원 단위 미만은 절사함)\n\n(1) 쌀과 활어를 각각 15,000,000원과 28,000,000원에 구입하였다.\n(2) 미국에서 가공하지 않은 바닷가재를 직수입하였으며 그 가액은 12,000,000원으로 관세가 2,000,000원 포함되어 있다.\n(3) 사업자인 영덕수산으로부터 가공하지 않은 대게를 인터넷으로 직접 구입하고 그 대금으로 21,000,000원을 신용카드로 결제하였다.\n(4) 위 매입액 중 6월말 기준 재고액 37,100,000원을 제외하고는 모두 음식재료로 사용되었다.",
  choices:["2,088,679원","3,000,000원","4,188,679원","4,301,886원","4,313,207원"],
  answer:3, status:"clear", note:"" },
{ id:"2016-78", subject:"세법학개론", year:2016, no:78, law:"부가가치세법", unit:"과세표준과 매출세액", kind:"calc",
  stem:"다음 자료를 이용하여 제조업과 부동산 임대업을 같은 장소에서 겸영하는 일반과세자인 개인사업자 甲의 2016년 1기 과세기간(2016.1.1.~6.30.)의 부가가치세 과세표준을 계산하면 얼마인가? (단, 자료금액은 부가가치세가 포함되지 아니한 금액이며, 주어진 자료 이외에는 고려하지 아니함. 원 단위 미만은 절사하며, 1년은 366일로 함)\n\n(1) 甲은 보유상가를 2016.4.1.부터 2018.3.31.까지의 기간 동안 임대하기로 하는 계약을 임차인과 체결하였다. 이하는 그 관련 자료이다.\n ○ 2016.4.1.에 임대보증금 100,000,000원을 수령하였다.\n ○ 월 임대료는 10,000,000원이며, 매월 초에 선불로 받기로 하였는바, 4.1.과 5.1.에는 각각 수령하였으나, 6.1.에 수령할 임대료는 6.30.이 경과할 때까지 수령하지 못하였다.\n ○ 계약기간 1년의 정기예금이자율은 1.8%이다.\n(2) 甲은 2016.5.30. 제조업에 사용하는 기계장치A(시가 10,000,000원, 감정가액 11,000,000원)를 거래처의 기계장치B(시가 8,000,000원, 감정가액 9,000,000원)와 교환하였다.\n(3) 甲은 2015년 제2기 과세기간(2015.7.1.~12.31.)에 거래처 설 명절 선물로 사용할 과세물품을 구입하였으나 매입세액공제를 받지 아니하였다. 2016.3.1. 당해 물품 중 사용하고 남은 물품(구입액 2,000,000원, 시가 1,500,000원)을 종업원에게 선물로 증여하였다.",
  choices:["30,447,540원","38,447,540원","40,447,540원","41,947,540원","42,447,540원"],
  answer:3, status:"clear", note:"" },
{ id:"2018-41", subject:"세법학개론", year:2018, no:41, law:"국세기본법", unit:"조세구제제도", kind:"concept",
  stem:"「국세기본법」상 심사와 심판에 관한 설명으로 옳지 않은 것은?",
  choices:["조세심판관은 심판청구에 관한 조사 및 심리의 결과와 과세의 형평을 고려하여 자유심증으로 사실을 판단한다.","조세심판관은 심판청구일 전 최근 5년 이내에 불복의 대상이 되는 처분의 기초가 되는 세무조사에 관여하였던 경우에는 그 심판관여로부터 제척된다.","조세심판관의 임기는 2년으로 하고 한 차례만 중임할 수 있다.","심판청구를 제기한 후 심사청구를 제기한 경우에는 그 심사청구를 각하하는 결정을 한다.","국세의 심판청구금액이 3천만원 미만인 것으로 청구사항이 법령의 해석에 관한 것이 아닌 경우 조세심판관회의의 심리를 거치지 아니하고 주심조세심판관이 심리하여 결정할 수 있다."],
  answer:3, status:"clear", note:"" },
{ id:"2018-42", subject:"세법학개론", year:2018, no:42, law:"국세기본법", unit:"조세채권 보전제도", kind:"concept",
  stem:"「국세기본법」상 국세의 우선권에 관한 설명으로 옳지 않은 것은?",
  choices:["국세상호간의 우선관계는 압류에 관한 국세, 교부청구한 국세, 납세담보 있는 국세 순이다.","세무서장은 대물변제의 예약에 의하여 권리이전 청구권의 보전을 위해 가등기된 재산을 압류할 때에는 그 사실을 가등기권리자에게 지체없이 통지하여야 한다.","과세표준과 세액을 정부가 결정하여 납세고지한 경우 법정기일은 그 납세고지서의 발송일이다.","가산금의 경우 법정기일은 그 가산금을 가산하는 고지세액의 납부기한이 지난 날이다.","공과금의 체납처분을 할 때 그 체납처분금액 중에서 국세를 징수하는 경우 그 공과금의 체납처분비는 국세에 우선한다."],
  answer:1, status:"clear", note:"" },
{ id:"2018-43", subject:"세법학개론", year:2018, no:43, law:"국세기본법", unit:"납세의무", kind:"concept",
  stem:"「국세기본법」상 납세의무의 성립시기로 옳지 않은 것은?",
  choices:["인지세: 과세문서를 작성한 때","수시부과하여 징수하는 국세: 수시부과할 사유가 발생한 때","상속세: 상속이 개시되는 때","종합부동산세: 과세기준일","가산세: 가산할 국세의 납세의무가 확정되는 때"],
  answer:5, status:"clear", note:"" },
{ id:"2018-44", subject:"세법학개론", year:2018, no:44, law:"국세기본법", unit:"과세", kind:"concept",
  stem:"「국세기본법」상 가산세 감면에 관한 설명으로 옳지 않은 것은?",
  choices:["가산세를 부과하는 경우 납세자가 의무를 이행하지 아니한 데 대한 정당한 사유가 있는 때에는 해당 가산세를 부과하지 아니한다.","법정신고기한이 지난 후 1개월 이내에 기한 후 신고를 한 경우 무신고 가산세액의 100분의 50에 상당하는 금액을 감면한다.","법정신고기한이 지난 후 1년 이내에 수정신고한 경우 과소신고 가산세액의 100분의 50에 상당하는 금액을 감면한다.","과세전적부심사 결정ㆍ통지기간에 그 결과를 통지하지 아니한 경우 결정ㆍ통지가 지연됨으로써 해당 기간에 부과되는 납부불성실 가산세액의 100분의 50에 상당하는 금액을 감면한다.","세법에 따른 제출의 기한이 지난 후 1개월 이내에 해당 세법에 따른 제출 의무를 이행하는 경우 제출 의무 위반 관련 가산세액의 100분의 50에 상당하는 금액을 감면한다."],
  answer:3, status:"clear", note:"" },
{ id:"2018-45", subject:"세법학개론", year:2018, no:45, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"甲과 乙과 丙이 공유하고 있는 재산 중 甲의 지분을 「국세징수법」상 甲의 체납으로 공매하는 경우에 관한 설명으로 옳지 않은 것은?",
  choices:["세무서장은 ‘공유자(체납자 제외)에게 우선매수권이 있다는 사실’을 공고하여야 한다.","세무서장은 공매공고를 하였을 때에는 즉시 그 내용을 공매공고의 등기 또는 등록 전일 현재의 공유자인 乙과 丙에게 통지하여야 한다.","乙 또는 丙은 매각결정 기일 전까지 공매보증금을 제공하고 매각예정가격 이상인 최고입찰가격과 같은 가격으로 공매재산을 우선매수하겠다는 신고를 할 수 있다.","세무서장은 乙과 丙이 우선매수하겠다는 신고를 하고 그 공유자에게 매각결정을 하였을 때에는 특별한 협의가 없으면 공유지분의 비율에 따라 공매재산을 매수하게 한다.","세무서장은 공매재산이 우선매수하겠다고 신고한 乙 또는 丙에게 매각결정되었지만 그 매수인이 매각대금을 납부하지 아니한 경우에는 재공매하여야 한다."],
  answer:5, status:"clear", note:"" },
{ id:"2018-46", subject:"세법학개론", year:2018, no:46, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"「국세징수법」상 압류를 즉시 해제하여야 하는 경우를 모두 고른 것은?\n\nㄱ. 압류 후 재산가격이 변동하여 체납액 전액을 현저히 초과한 경우\nㄴ. 압류에 관계되는 체납액의 일부가 납부되거나 충당된 경우\nㄷ. 압류재산에 대한 「국세징수법」에 따른 제3자의 소유권 주장이 상당한 이유가 있다고 인정하는 경우\nㄹ. 체납자가 압류할 수 있는 다른 재산을 제공하여 그 재산을 압류한 경우\nㅁ. 제3자가 체납자를 상대로 소유권에 관한 소송을 제기하여 승소 판결을 받고 그 사실을 증명한 경우",
  choices:["ㄱ, ㄹ","ㄷ, ㅁ","ㄱ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㅁ"],
  answer:2, status:"clear", note:"" },
{ id:"2018-47", subject:"세법학개론", year:2018, no:47, law:"국세징수법", unit:"강제징수", kind:"concept",
  stem:"「국세징수법」상 압류재산의 매각에 관한 설명으로 옳지 않은 것은?",
  choices:["세무서장은 압류된 재산이 「자본시장과 금융투자업에 관한 법률」에 따른 증권시장에 상장된 증권일 때에는 해당 시장에서 직접 매각할 수 있다.","심판청구 절차가 진행 중인 국세의 체납으로 압류한 재산이 부패ㆍ변질 또는 감량되기 쉬운 재산으로서 속히 매각하지 아니하면 그 재산가액이 줄어들 우려가 있는 경우에는 그 청구에 대한 결정이 확정되기 전이라도 공매할 수 있다.","세무서장은 압류재산이 수의계약으로 매각하지 아니하면 매각대금이 체납처분비에 충당하고 남을 여지가 없는 경우에는 수의계약으로 매각할 수 있다.","세무서장이 전문매각기관을 선정하여 압류한 예술품의 매각을 대행하게 하는 경우에는 해당 전문매각기관은 그 압류한 예술품의 매각을 대행하거나 직접 매수할 수 있다.","여러 개의 재산을 일괄하여 공매하는 경우 그 가운데 일부의 매각대금으로 체납액을 변제하기에 충분하면 체납자는 그 재산 가운데 매각할 것을 지정할 수 있다."],
  answer:4, status:"clear", note:"" },
{ id:"2018-48", subject:"세법학개론", year:2018, no:48, law:"국세징수법", unit:"신고납부, 납부고지 등", kind:"concept",
  stem:"「국세징수법」상 징수절차에 관한 설명으로 옳지 않은 것은?",
  choices:["세무서장은 세법에서 국세의 납부기한을 정하는 경우 외에는 국세의 납부기한을 납부의 고지를 하는 날부터 30일 내로 지정할 수 있다.","세무서장은 납세자가 지방세의 체납으로 체납처분을 받을 때에는 납기 전이라도 이미 납세의무가 확정된 국세를 징수할 수 있다.","세무서장은 납세고지서를 납부기한이 일정한 경우에는 납기가 시작되기 5일 전에, 납부기한이 일정하지 아니한 경우에는 징수결정 즉시 발급하여야 한다.","세무서장은 납세자가 국세를 포탈하려는 행위가 있다고 인정될 때에는 납기 전이라도 이미 납세의무가 확정된 국세를 징수할 수 있다.","「국세기본법」에 따라 물적납세 의무가 있는 양도담보권자에게 납부고지가 있은 후 해당 재산의 양도에 의하여 담보된 채권이 변제에 의하여 소멸한 경우에도 그 재산은 양도담보재산으로서 존속하는 것으로 본다."],
  answer:5, status:"clear", note:"" },
{ id:"2018-49", subject:"세법학개론", year:2018, no:49, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"「조세범처벌법」상 주류 또는 유류에 대한 조세범처벌에 관한 설명으로 옳지 않은 것은?",
  choices:["가짜석유제품을 제조 또는 판매하여 조세를 포탈한 자는 3년 이하의 징역 또는 포탈한 세액의 3배 이하의 벌금에 처한다.","지방국세청장 또는 세무서장은 「주세법」에 따른 면허를 받지 아니하고 제조한 물품으로서 제조자나 판매자가 소지하는 물품을 몰취할 수 있다.","「주세법」에 따른 납세증명표지를 재사용하거나 정부의 승인을 받지 아니하고 이를 타인에게 양도한 자는 2년 이하의 징역 또는 2천만원 이하의 벌금에 처한다.","면세유의 부정 유통의 범칙행위를 한 자에 대해서는 「형법」 중 벌금경합에 관한 제한가중규정을 적용하지 아니한다.","「주세법」에 따른 면허를 받지 아니하고 주류를 판매하기 위하여 제조하거나 판매한 자는 3년 이하의 징역 또는 3천만원(해당 주세 상당액의 3배의 금액이 3천만원을 초과할 때에는 그 주세 상당액의 3배의 금액) 이하의 벌금에 처한다."],
  answer:1, status:"clear", note:"" },
{ id:"2018-50", subject:"세법학개론", year:2018, no:50, law:"조세범처벌법", unit:"조세범처벌법", kind:"concept",
  stem:"「조세범처벌법」상 조세범처벌에 관한 설명으로 옳지 않은 것은?",
  choices:["「조세범처벌법」상 조세란 관세를 제외한 국세를 말한다.","사기나 그 밖의 부정한 행위로써 조세를 포탈한 자는 포탈세액이 5억원 이상인 경우에는 3년 이하의 징역 또는 포탈세액의 3배 이하에 상당하는 벌금에 처한다.","법인의 사용인이 그 법인의 업무에 관하여 「조세범처벌법」에서 규정하는 범칙행위를 한 경우 그 법인이 그 위반행위를 방지하기 위하여 상당한 주의 또는 감독을 게을리한 경우에는 그 법인에게도 해당 조문의 벌금형을 과한다.","사기나 그 밖의 부정한 행위로써 조세를 포탈하거나 조세의 환급ㆍ공제를 받는 죄를 상습적으로 범한 자는 형의 2분의 1을 가중한다.","사기나 그 밖의 부정한 행위로써 조세를 포탈한 범칙행위의 공소시효는 5년이 지나면 완성된다."],
  answer:5, status:"clear", note:"" },
{ id:"2018-51", subject:"세법학개론", year:2018, no:51, law:"소득세법", unit:"양도소득세", kind:"concept",
  stem:"「소득세법」상 양도소득세가 과세되는 것은?",
  choices:["거주자 甲은 이혼하면서 법원의 판결에 따른 재산분할에 의하여 배우자에게 혼인 중에 형성된 부부공동재산인 토지의 소유권을 이전하였다.","사업자인 거주자 乙은 사업용으로 사용하던 기계장치를 처분하였다.","거주자 丙은 본인 소유의 토지를 동생에게 증여하면서, 동생이 그 토지에 의하여 담보된 丙의 은행대출 채무를 인수하였다.","건설업을 영위하는 사업자인 거주자 丁은 아파트를 신축하여 판매하였다.","거주자 戊는 자기소유의 토지를 경매로 인하여 자기가 재취득하였다."],
  answer:3, status:"clear", note:"" },
{ id:"2018-52", subject:"세법학개론", year:2018, no:52, law:"소득세법", unit:"소득세 총칙", kind:"concept",
  stem:"「소득세법」상 납세지에 관한 설명으로 옳지 않은 것은?",
  choices:["주소지가 2이상인 때에는 생활관계가 보다 밀접한 곳을 납세지로 한다.","비거주자 甲이 국내에 두 곳의 사업장을 둔 경우, 주된 사업장을 판단하기가 곤란한 때에는 둘 중 하나를 선택하여 신고한 장소를 납세지로 한다.","해외근무 등으로 국내에 주소가 없는 공무원 乙의 소득세 납세지는 그 가족의 생활근거지 또는 소속기관의 소재지로 한다.","납세지의 변경신고를 하고자 하는 자는 납세지변경신고서를 그 변경 후의 납세지 관할 세무서장에게 제출하여야 한다.","납세지의 지정이 취소된 경우에도 그 취소 전에 한 소득세에 관한 신고, 신청, 청구, 납부, 그 밖의 행위의 효력에는 영향을 미치지 아니한다."],
  answer:1, status:"clear", note:"" },
{ id:"2018-53", subject:"세법학개론", year:2018, no:53, law:"소득세법", unit:"소득금액 계산 및 세액계산 특례", kind:"concept",
  stem:"「소득세법」상 소득금액 계산의 특례에 관한 설명으로 옳지 않은 것은?",
  choices:["종합소득과세표준 확정신고 후 예금 또는 신탁계약의 중도 해지로 이미 지난 과세기간에 속하는 이자소득금액이 감액된 때에는, 경정청구를 하지 아니한 경우라면 그 중도 해지일이 속하는 과세기간의 종합소득금액에 포함된 이자소득금액에서 그 감액된 이자소득금액을 뺄 수 있다.","우리나라가 조세조약의 상대국과 그 조세조약의 상호 합의 규정에 따라 거주자가 국외에 있는 비거주자와 거래한 그 금액에 대하여 권한 있는 당국 간에 합의를 하는 경우에는 그 합의에 따라 납세지 관할 세무서장은 그 거주자의 각 과세기간의 소득금액을 조정하여 계산할 수 있다.","사업소득이 발생하는 사업을 공동으로 경영하고 그 손익을 분배하는 공동사업의 경우에는 각 공동사업자별로 소득금액을 계산한다.","연금계좌의 가입자가 사망하였으나 그 배우자가 연금외수령 없이 해당 연금계좌를 상속으로 승계하는 경우에는 그 연금계좌에 있는 피상속인의 소득금액은 상속인의 소득금액으로 보아 소득세를 계산한다.","결손금 및 이월결손금을 공제할 때 해당 과세기간에 결손금이 발생하고 이월결손금이 있는 경우에는 그 과세기간의 결손금을 먼저 소득금액에서 공제한다."],
  answer:3, status:"clear", note:"" },
{ id:"2018-54", subject:"세법학개론", year:2018, no:54, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"concept",
  stem:"내국법인 (주)A(벤처기업 아님)는 정관에서 주식매수선택권 부여에 필요한 사항을 모두 정하고 이를 등기한 후에 2018.3.20. 주주총회 특별결의를 거쳐 주식매수선택권(부여주식 수: 30,000주, 행사가격: 10,000원, 행사시기: 2022.3.20.부터 2027.3.20.까지)을 부여하는 계약을 임원인 甲(거주자)과 체결하였다. 주식매수선택권 부여 계약에는 행사를 제한하는 어떠한 특약도 없었고, 행사가격은 주식매수선택권 부여 당시의 주식의 시가보다 높은 것이었으며, 미공개정보로 인하여 단기간 내에 주가가 상승할 것이라고 예상되는 특별한 사정도 없었다. 다음 중 옳은 것은?",
  choices:["甲이 (주)A에 재직하면서 2022.3.20.부터 2027.3.20.까지 사이에 주식매수선택권을 행사하여 얻은 이익은 기타소득에 해당한다.","甲이 2024.10.20. 퇴직한 후 다음 해에 주식매수선택권을 행사하여 얻은 이익은 기타소득에 해당한다.","甲이 2020.6.20. 사망하고 2022.3.20.부터 2027.3.20.까지 사이에 그 상속인이 주식매수선택권을 행사하여 얻은 이익은 근로소득에 해당한다.","甲의 주식매수선택권 행사이익은 그 주식매수선택권 부여 당시 (주)A 주식의 시가에서 실제 매수가격을 뺀 금액이다.","甲이 주식매수선택권을 행사하여 취득한 주식을 양도하는 때, 당해 주식이 양도소득세 과세대상이 되는 경우에는 그 주식매수선택권의 행사가격을 취득가액으로 하여 양도소득을 계산한다."],
  answer:2, status:"clear", note:"" },
{ id:"2018-55", subject:"세법학개론", year:2018, no:55, law:"소득세법", unit:"종합소득 세액계산", kind:"concept",
  stem:"「소득세법」상 세액공제 등에 관한 설명으로 옳은 것은?",
  choices:["기장세액공제를 받은 간편장부대상자는 이와 관련된 장부 및 증명서류를 해당 과세표준확정신고기간 종료일부터 10년간 보관하여야 한다.","거주자가 외국소득세액을 종합소득산출세액에서 공제하는 경우 그 외국소득세액이 「소득세법」에서 정하는 공제한도를 초과하는 때에는 초과하는 금액은 이를 이월하여 공제받을 수 없다.","거주자의 사업소득금액에 국외원천소득이 합산되어 있는 경우 그 국외원천소득에 대하여 외국에서 외국소득세액을 납부하였거나 납부할 것이 있을 때에는 그 외국소득세액을 해당 과세기간의 사업소득금액 계산상 필요경비에 산입하는 방법을 선택할 수 있다.","특별세액공제 규정을 적용할 때 과세기간 종료일 이전에 이혼하여 기본공제대상자에 해당되지 아니하게 되는 종전의 배우자를 위하여 과세기간 중 이미 지급한 금액에 대한 세액공제액은 해당 과세기간의 종합소득산출세액에서 공제할 수 없다.","이월공제가 인정되는 세액공제로서 해당 과세기간 중에 발생한 세액공제액과 이전 과세기간에서 이월된 미공제액이 함께 있을 때에는 해당 과세기간 중에 발생한 세액공제액을 먼저 공제한다."],
  answer:3, status:"clear", note:"" },
{ id:"2018-56", subject:"세법학개론", year:2018, no:56, law:"소득세법", unit:"양도소득세", kind:"calc",
  stem:"다음은 개인사업자인 거주자 甲이 사업에 사용하던 상가건물을 2018.7.1.에 특수관계자인 乙에게 양도한 내역이다. 양도소득과세표준은 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 건물과 관련된 정보\n ① 양도가액은 6억원, 취득가액은 4억원이며, 모두 실지거래가액이다.\n ② 양도 당시 건물의 감가상각누계액은 15,000,000원이며, 감가상각비는 사업소득금액 계산 시 필요경비에 반영되었다.\n ③ 건물에 대한 취득세로 납부한 금액은 13,000,000원이며, 취득 시 국민주택채권을 8,000,000원에 매입하여 즉시 사채업자에게 3,000,000원에 매각한 것이 확인되었다. 이를 동일한 날 금융회사에 매각한다면 2,000,000원의 매각 차손이 발생한다.\n ④ 양도 당시 건물의 시가는 620,000,000원이고, 건물의 보유기간은 5년 2개월이며 등기되었다.\n(2) 양도 시 중개수수료 9,000,000원을 부담하였고, 지출한 양도비의 적격 증명서류를 수취하였다.\n(3) 보유 중 납부한 재산세 합계액은 8,000,000원이다.\n(4) 당해 건물은 비사업용이 아니며, 장기보유특별공제율은 3년 이상 4년 미만 보유 시 10%, 4년 이상 5년 미만 보유 시 12%, 5년 이상 6년 미만 보유 시 15%를 적용한다.\n(5) 양도소득 기본공제를 적용하며, 동 건물 외에 다른 양도소득세 과세대상은 없다.",
  choices:["159,850,000원","162,350,000원","162,850,000원","188,500,000원","191,000,000원"],
  answer:1, status:"clear", note:"" },
{ id:"2018-57", subject:"세법학개론", year:2018, no:57, law:"소득세법", unit:"사업소득", kind:"calc",
  stem:"다음은 제조업(중소기업)을 영위하는 개인사업자 대표자 甲(거주자)의 제18기(2018.1.1.~12.31.) 사업소득금액 계산을 위한 자료이다. 2018년 귀속 사업소득금액은 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 손익계산서 내역\n ① 당기순이익은 100,000,000원이다.\n ② 인건비에는 대표자 甲의 급여 48,000,000원이 포함되어 있다.\n ③ 영업외손익에는 다음의 항목이 포함되어 있다.\n  - 예금이자 수익: 300,000원\n  - 업무용화물차 처분이익: 100,000원\n  - 사업관련 공장의 화재로 인한 보험차익: 5,000,000원\n  - 현금배당수익(배당기준일의 1개월 전에 취득한 비상장주식의 현금 배당임): 3,000,000원\n  - 유가증권처분이익(채권매매차익임): 1,000,000원\n(2) 대표자 甲이 개인적으로 사용한 제품 5,000,000원은 잡비로 계상되어 있으며, 동 제품의 판매가격 및 시가는 8,000,000원이다.\n(3) 甲은 복식부기의무자이다.",
  choices:["104,700,000원","147,700,000원","150,700,000원","151,700,000원","152,700,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2018-58", subject:"세법학개론", year:2018, no:58, law:"소득세법", unit:"종합소득 세액계산", kind:"calc",
  stem:"다음은 거주자 甲(2018년도 중 계속 근로자임)이 기본공제대상자를 위하여 2018년에 지출한 의료비 내역이다. 2018년 귀속 의료비 세액공제액은 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 연 급여: 35,000,000원(비과세급여 3,000,000원 포함)\n(2) 본인(34세)을 위한 시력보정용 안경 구입비: 800,000원 / 본인의 국외 치료비: 4,000,000원\n(3) 배우자(32세)를 위한 치료목적 한약비: 1,000,000원 / 배우자를 위한 난임시술비(「모자보건법」에 따른 보조생식술에 소요된 비용): 3,000,000원\n(4) 부친(67세)에 대한 질병 치료비: 700,000원\n(5) 모친(장애인, 62세)을 위한 장애인 보장구 구입비: 600,000원\n(6) 부양가족은 모두 생계를 같이 하고 있으며 소득은 없다.\n(7) 부양가족은 다른 근로자의 기본공제대상이 아니고, 본인 국외 치료비를 제외한 다른 의료비는 모두 국내 의료기관 등에 지출한 금액이며, 의료비 세액공제액 외 다른 세액공제 및 표준세액공제는 적용하지 않는다.",
  choices:["726,000원","831,000원","876,000원","1,431,000원","1,476,000원"],
  answer:3, status:"clear", note:"" },
{ id:"2018-59", subject:"세법학개론", year:2018, no:59, law:"소득세법", unit:"근로소득, 연금소득 및 기타소득", kind:"calc",
  stem:"다음은 내국법인 (주)A에서 영업사원으로 근무하던 거주자 甲의 근로소득 관련 자료이다. 甲의 2018년 귀속 근로소득금액은 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 근무기간: 2018.1.1.부터 2018.10.31.(퇴직일)까지 계속 근무하였음\n(2) 급여내역\n구분 / 금액 / 비고\n기본급여총액 / 50,000,000원 / 기본급으로 월 5,000,000원 지급 받음\n휴가비 / 5,000,000원 / (주)A로부터 보조받은 휴가비임\n강연수당 / 4,000,000원 / (주)A의 사내연수 강연수당임\n인정상여 / 2,000,000원 / (주)A의 2017년도 귀속 법인세무조정시 발생한 것임\n식사대 / 1,200,000원 / 월 120,000원(회사는 현물식사를 별도 제공하지 않음)\n자가운전보조금 / 3,000,000원 / 월 300,000원(시내출장 등이 있을 시 甲소유 차량을 업무에 이용하였고, 이에 소요된 실제 여비는 자가운전보조금을 받았음에도 불구하고 출장여비 규정에 의해 별도로 지급받았음)\n(3) 근로소득공제액\n총급여액 / 근로소득공제액\n1,500만원 초과 4,500만원 이하 / 750만원 + 1,500만원을 초과하는 금액의 100분의 15\n4,500만원 초과 1억원 이하 / 1,200만원 + 4,500만원을 초과하는 금액의 100분의 5",
  choices:["44,590,000원","44,840,000원","48,290,000원","49,340,000원","50,090,000원"],
  answer:4, status:"clear", note:"" },
{ id:"2018-60", subject:"세법학개론", year:2018, no:60, law:"소득세법", unit:"종합소득 세액계산", kind:"calc",
  stem:"다음 자료를 이용하여 거주자 甲의 2018년 귀속 종합소득금액을 계산하면 얼마인가? (단, 주어진 자료 이외에는 고려하지 않음)\n\n(1) 甲의 2018년 귀속 근로소득 등 관련 자료\n ① 연 급여: 93,000,000원 [식사대 2,400,000원(월 200,000원×12개월) 포함, 회사는 현물식사를 별도 제공하지 않음]\n ② 「발명진흥법」에 따른 직무발명보상금: 5,000,000원\n ③ 법령에 의한 건강보험료 회사부담금: 2,400,000원\n ④ 법령으로 정한 직장공제회 초과반환금: 6,000,000원(국내에서 받았으며 원천징수는 적법하게 이루어짐)\n ⑤ 근로소득공제액\n  총급여액 4,500만원 초과 1억원 이하 / 1,200만원 + 4,500만원을 초과하는 금액의 100분의 5\n  총급여액 1억원 초과 / 1,475만원 + 1억원을 초과하는 금액의 100분의 2\n(2) 甲은 상가건물을 2017년 12월 초부터 2018년 12월 말까지 매월 임대료 2,000,000원(부가가치세 별도)을 받기로 약정하고 임대사업을 하고 있다. 당해 임대사업은 세무대리인을 통해 장부 기장에 의한 신고를 하였으며, 2018년 필요경비는 10,000,000원이다. (임차인과는 특수관계가 아니며 임차기간 중 임차인 변동은 없고, 사업기간 중 휴업사실 없음)\n(3) 甲이「문화재보호법」에 따라 국가지정문화재로 지정된 서화를 양도하고 발생한 양도소득은 10,000,000원이다.\n(4) 甲은 직장동료 乙에게 2018.4.1.에 1억원을 빌려주고 원금과 이자(연 5%)는 1년 후 받기로 하였다. (甲은 금전 대여를 사업적으로 하지 않음)",
  choices:["89,560,000원","93,360,000원","99,560,000원","103,360,000원","123,100,000원"],

{ id:"2018-62", subject:"세법학개론", year:2018, no:62, law:"법인세법", unit:"법인세 총칙", kind:"concept",
  stem:"「법인세법」의 총칙에 관한 설명으로 옳지 않은 것은?",
  choices:["내국법인 중 국가와 지방자치단체에 대하여는 법인세를 부과하지 아니한다.","자산이나 사업에서 생기는 수입이 법률상 귀속되는 법인과 사실상 귀속되는 법인이 서로 다른 경우에는 그 수입이 사실상 귀속되는 법인에 대하여 「법인세법」을 적용한다.","신탁재산에 귀속되는 소득은 그 신탁의 이익을 받을 수익자가 특정된 경우 그 수익자가 그 신탁재산을 가진 것으로 보고 「법인세법」을 적용한다.","둘 이상의 국내사업장이 있는 외국법인이 사업연도 중에 그 중 하나의 국내사업장을 가지지 아니하게 된 경우에는 그 사업연도 개시일부터 그 사업장을 가지지 아니하게 된 날까지의 기간을 그 법인의 1사업연도로 본다.","법령에 따라 사업연도가 정하여지는 법인이 관련 법령의 개정에 따라 사업연도가 변경된 경우에는 사업연도의 변경신고를 하지 아니한 경우에도 사업연도가 변경된 것으로 본다."],
  answer:4, status:"clear", note:"" },
{ id:"2018-63", subject:"세법학개론", year:2018, no:63, law:"법인세법", unit:"익금과 익금불산입", kind:"concept",

{ id:"2018-64", subject:"세법학개론", year:2018, no:64, law:"법인세법", unit:"법인세 절차규정", kind:"concept",
  stem:"「법인세법」상 과세표준 및 세액의 신고 및 결정ㆍ경정에 관한 설명으로 옳지 않은 것은?",
  choices:["내국법인으로서 각 사업연도의 소득금액이 없는 법인도 그 사업연도의 소득에 대한 법인세의 과세표준과 세액을 납세지 관할 세무서장에게 신고하여야 한다.","납세지 관할 세무서장은 제출된 신고서에 오류가 있을 때에는 보정할 것을 요구할 수 있다.","납세지 관할 세무서장은 법인세 과세표준과 세액을 신고한 내국법인의 신고 내용에 누락이 있는 경우에는 그 법인의 각 사업연도의 소득에 대한 법인세의 과세표준과 세액을 경정한다.","「주식회사의 외부감사에 관한 법률」에 따라 감사인에 의한 감사를 받아야 하는 내국법인이 해당 사업연도의 감사가 종결되지 아니하여 결산이 확정되지 아니하였다는 사유로 신고기한의 연장을 신청한 경우에는 그 신고기한을 1개월의 범위에서 연장할 수 있다.","납세지 관할 세무서장은 법인세의 과세표준과 세액을 결정한 후 그 결정에 오류가 있는 것을 발견한 경우에는 1개월 이내에 이를 경정한다."],
  answer:5, status:"clear", note:"" },
{ id:"2018-65", subject:"세법학개론", year:2018, no:65, law:"법인세법", unit:"과세표준", kind:"concept",
  stem:"「법인세법」상 과세표준 및 세액의 계산에 관한 설명으로 옳은 것은?",
  choices:["중소기업은 각 사업연도에 결손금이 발생한 경우, 직전 및 직전 전 사업연도의 소득에 대하여 과세된 법인세액을 한도로 그 결손금의 환급을 신청할 수 있다.","재해손실세액공제는 천재지변 등 재해로 상실 전 자산총액의 100분의 15 이상을 상실하여 납세자가 곤란하다고 인정되는 경우 적용된다.","외국납부세액공제는 해당 법인의 국내 법인세 산출세액을 한도로 하며, 이를 초과하는 금액은 10년간 이월공제 가능하다.","천재지변 등으로 장부나 그 밖의 증명서류가 멸실되어 법인세를 추계하여 결정하는 경우에는 이월결손금 공제와 외국납부세액공제 모두 적용 가능하다.","결손금의 이월공제는 각 사업연도의 소득의 범위에서 각 사업연도의 개시일 전 5년 이내에 개시한 사업연도에서 발생한 결손금에 한하여 이월하여 공제한다."],
  answer:4, status:"clear", note:"" },
{ id:"2018-66", subject:"세법학개론", year:2018, no:66, law:"법인세법", unit:"손익의 귀속시기", kind:"calc",
  stem:"다음은 제조업을 주업으로 하는 내국법인 (주)A(중소기업 아님)의 제18기 사업연도(2018.1.1.~12.31.) 세무조정을 위한 자료이다. 제18기에 필요한 세무조정을 적정하게 하였을 경우, 이 같은 세무조정이 제18기 각 사업연도의 소득금액에 미친 순영향으로 옳은 것은? (단, 「법인세법」에서 정하는 익금과 손금의 요건을 모두 충족하고, 손금에 대한 법정한도금액은 초과하지 않으며, 주어진 자료 이외에는 고려하지 않음)\n\n(주)A의 제18기 결산서에 반영된 사항 / 비고\n배당금수익 1,000,000원(해산한 법인 (주)B의 잔여재산 분배로 인한 의제배당) / (주)B의 해산등기일: 2018.12.31. / (주)B의 잔여재산가액확정일: 2019.1.31.\n선급비용 1,000,000원(지출 후 이연 처리한 접대비) / 접대비 지출일: 2018.12.31. / 결산상 손비계상일: 2019.1.31.\n영업외비용 1,000,000원(어음을 발행하여 지출한 기부금) / 어음발행일: 2018.12.31. / 어음결제일: 2019.1.31.\n영업외수익 1,000,000원(유형자산 양도로 인한 처분이익) / 매수자의 사용수익일: 2018.12.31. / 대금청산일: 2019.1.31.",
  choices:["(-)2,000,000원","(-)1,000,000원","0원","(+)1,000,000원","(+)2,000,000원"],
